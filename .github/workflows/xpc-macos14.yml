name: XPC on macOS 14
# Settling question 3 in docs/2.0/TESTS.md: does an ad-hoc bundle launch its embedded XPC service on macOS 14?
# The same four checks as the XPC part of test/settling/section.sh, run on the oldest macOS 2.0 supports.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["test/settling/xpc/**", ".github/workflows/xpc-macos14.yml"]
jobs:
  probe:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - name: Build the probe
        run: |
          sw_vers
          out=$(test/settling/xpc/build.sh "$RUNNER_TEMP/xpc" 2>&1); printf '%s\n' "$out"
          printf '%s\n' "$out" | grep -q 'built and verified'
          ! printf '%s\n' "$out" | grep -q warning:
      - name: Call the service from the bundle and through a symlink
        run: |
          mkdir -p "$RUNNER_TEMP/fixture/a" && echo x >"$RUNNER_TEMP/fixture/a/one"
          host="$RUNNER_TEMP/xpc/MMXPCProbe.app/Contents/MacOS/host"
          "$host" "$RUNNER_TEMP/fixture" 2>&1 | tee "$RUNNER_TEMP/direct.txt"
          [ "$(tail -1 "$RUNNER_TEMP/direct.txt")" = PASS ]
          ln -sf "$host" "$RUNNER_TEMP/probe"
          "$RUNNER_TEMP/probe" "$RUNNER_TEMP/fixture" 2>&1 | tee "$RUNNER_TEMP/link.txt"
          [ "$(tail -1 "$RUNNER_TEMP/link.txt")" = PASS ]
