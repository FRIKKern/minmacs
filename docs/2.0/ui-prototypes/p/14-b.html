<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>One Sentence</title>
<style>
:root{
  --glass:rgba(28,29,38,.86);
  --line:rgba(255,255,255,.06);
  --tx:rgba(255,255,255,.94);
  --tx2:rgba(235,235,245,.62);
  --tx3:rgba(235,235,245,.36);
  --tx4:rgba(235,235,245,.22);
  --ease:cubic-bezier(.3,.7,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#1a1636}
body{font-family:-apple-system,"SF Pro Text",system-ui,sans-serif;color:var(--tx);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;cursor:default;user-select:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;letter-spacing:inherit}
button:focus-visible{outline:2px solid rgba(255,255,255,.55);outline-offset:3px;border-radius:6px}
#stage{position:absolute;left:0;top:0;width:1280px;height:800px;transform-origin:0 0;overflow:hidden;
  background:
   radial-gradient(760px 560px at 10% 6%,#4b3c9e 0%,rgba(75,60,158,0) 70%),
   radial-gradient(700px 520px at 84% 2%,#22618f 0%,rgba(34,97,143,0) 70%),
   radial-gradient(820px 620px at 88% 104%,#a0436f 0%,rgba(160,67,111,0) 70%),
   radial-gradient(640px 520px at 18% 100%,#3a2463 0%,rgba(58,36,99,0) 75%),
   #1d1a3c}

/* menu bar */
.mb{position:absolute;left:0;right:0;top:0;height:26px;display:flex;align-items:center;justify-content:space-between;padding:0 12px 0 16px;background:rgba(18,14,40,.32);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);font-size:13px;color:rgba(255,255,255,.92);z-index:5}
.mb-l,.mb-r{display:flex;align-items:center;gap:18px}
.mb-l b{font-weight:700}
.mb-r{gap:14px}
.icons{display:flex;align-items:center;gap:12px}
.mi{display:flex;width:16px;overflow:hidden;transition:width .4s var(--ease),opacity .3s,margin .4s var(--ease)}
.mi.off{width:0;opacity:0;margin-left:-12px}

/* window */
.win{position:absolute;left:50%;top:128px;width:780px;height:488px;transform:translateX(-50%);display:grid;grid-template-columns:208px 1fr;background:var(--glass);backdrop-filter:blur(36px) saturate(1.5);-webkit-backdrop-filter:blur(36px) saturate(1.5);border:1px solid rgba(255,255,255,.08);border-radius:22px;box-shadow:0 40px 110px rgba(6,4,24,.5),inset 0 1px 0 rgba(255,255,255,.035)}
.side{display:flex;flex-direction:column;padding:0 14px 20px;border-right:1px solid var(--line)}
.tb{height:52px;display:flex;align-items:center;padding:0 6px;flex:none}
.lights{display:flex;gap:8px}
.lights i{width:12px;height:12px;border-radius:50%}
.lights i:nth-child(1){background:#ff5f57}.lights i:nth-child(2){background:#febc2e}.lights i:nth-child(3){background:#28c840}

.nav{display:flex;flex-direction:column;gap:2px;margin-top:14px}
.nav button{position:relative;display:flex;align-items:center;gap:12px;height:40px;padding:0 12px;border-radius:11px;font-size:15px;color:var(--tx2);text-align:left;transition:background .25s,color .25s}
.nav button:hover{color:var(--tx)}
.nav button[aria-selected="true"]{background:rgba(255,255,255,.075);color:var(--tx);font-weight:500}
.dot{width:8px;height:8px;border-radius:50%;flex:none;box-sizing:border-box;transition:background .3s,border-color .3s,transform .3s var(--ease)}
.dot.m2{background:var(--c)}
.dot.m1{border:1.6px solid var(--c)}
.dot.m0{background:rgba(235,235,245,.18);transform:scale(.75)}
.nav .mw{margin-left:auto;font-size:12px;color:var(--tx3);font-weight:400;white-space:nowrap}

.sw-wrap{margin-top:auto;display:flex;flex-direction:column;gap:12px;padding:0 12px}
.sw{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px;color:var(--tx3);white-space:nowrap;width:100%;transition:color .2s}
.sw i{width:28px;height:16px;border-radius:8px;background:rgba(255,255,255,.12);position:relative;transition:background .25s;flex:none}
.sw i::after{content:"";position:absolute;left:2px;top:2px;width:12px;height:12px;border-radius:50%;background:rgba(255,255,255,.9);transition:transform .3s var(--ease)}
.sw[aria-checked="true"]{color:var(--tx2)}
.sw[aria-checked="true"] i{background:rgba(255,255,255,.32)}
.sw[aria-checked="true"] i::after{transform:translateX(12px);background:#fff}

/* main */
.main{position:relative;display:flex;flex-direction:column;padding:0 48px 26px 52px;min-width:0}
.main .tb{justify-content:center;padding:0;margin-left:-208px;pointer-events:none}
.main .tb h1{font-size:13px;font-weight:600;color:var(--tx3)}
.pane{display:flex;flex-direction:column;flex:1;padding-top:22px}
.pane.in{animation:paneIn .45s var(--ease)}
@keyframes paneIn{from{opacity:0;transform:translateY(8px)}}

.eyebrow{display:flex;align-items:center;gap:12px;font-size:14px;font-weight:500;color:var(--tx2)}
.bdg{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 20%,transparent);transition:background .3s}
.pane.off .bdg{background:rgba(255,255,255,.07)}

.say{margin-top:22px;font-size:28px;line-height:39px;letter-spacing:-.018em;color:rgba(255,255,255,.88);font-weight:400;min-height:78px;transition:color .4s var(--ease)}
.pane.off .say{color:var(--tx3)}
.w{display:inline;padding:0 2px;border-radius:6px;color:var(--c);font-weight:500;background-image:linear-gradient(color-mix(in srgb,var(--c) 45%,transparent),color-mix(in srgb,var(--c) 45%,transparent));background-repeat:no-repeat;background-position:0 100%;background-size:100% 1.5px;transition:color .35s var(--ease)}
.w:hover,.w[aria-expanded="true"]{background-color:color-mix(in srgb,var(--c) 14%,transparent)}
.pane.off .w{--c:rgba(235,235,245,.42)}
.w .t{display:inline-block}
.t.swap{animation:swap .42s var(--ease)}
@keyframes swap{from{opacity:0;filter:blur(3px);transform:translateY(4px)}}

/* mode words */
.modes{position:relative;display:flex;gap:30px;margin-top:30px;height:30px;align-items:flex-start}
.modes button{font-size:17px;font-weight:500;color:var(--tx3);padding:0 0 8px;transition:color .3s var(--ease);white-space:nowrap}
.modes button:hover{color:var(--tx2)}
.modes button[aria-checked="true"]{color:var(--c)}
.pane.off .modes button[aria-checked="true"]{color:var(--tx)}
.bar{position:absolute;left:0;bottom:0;height:2px;border-radius:1px;background:var(--c);transition:transform .4s var(--ease),width .4s var(--ease),background .3s}
.pane.off .bar{background:rgba(255,255,255,.55)}
.does{margin-top:10px;font-size:14px;line-height:20px;color:var(--tx3);min-height:20px}

/* live numbers */
.live{margin-top:auto;padding-top:24px;border-top:1px solid var(--line);display:flex;gap:44px;align-items:baseline;min-height:86px}
.stat{display:flex;align-items:baseline;gap:8px;white-space:nowrap}
.stat .n{font-size:46px;line-height:56px;font-weight:600;letter-spacing:-.02em;color:var(--tx)}
.stat .u{font-size:15px;color:var(--tx3)}
.live .quiet{font-size:20px;line-height:56px;color:var(--tx3)}
.live > *{animation:swap .5s var(--ease)}

.today{margin-top:18px;display:flex;align-items:center;gap:8px;font-size:13px;line-height:20px;color:var(--tx3);white-space:nowrap}
.today b{font-weight:500;color:var(--tx2)}
.today .act{margin-left:4px;color:var(--tx);font-weight:500}
.today .act:hover{text-decoration:underline;text-underline-offset:3px;text-decoration-color:rgba(255,255,255,.35)}
.fade{animation:swap .45s var(--ease)}

/* popover */
.pop{position:absolute;z-index:10;min-width:150px;padding:6px;border-radius:14px;background:rgba(40,41,54,.94);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,.1);box-shadow:0 18px 50px rgba(0,0,0,.45);opacity:0;transform:translateY(-4px) scale(.98);transform-origin:top left;pointer-events:none;transition:opacity .2s,transform .28s var(--ease)}
.pop.on{opacity:1;transform:none;pointer-events:auto}
.pop button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:8px 14px 8px 10px;border-radius:9px;font-size:14px;color:var(--tx2);white-space:nowrap}
.pop button:hover,.pop button:focus-visible{background:rgba(255,255,255,.07);color:var(--tx);outline:0}
.pop button .ck{width:12px;flex:none;color:var(--c);display:flex}
.pop button[aria-checked="true"]{color:var(--tx)}
.pop button .k{font-weight:500}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important}}
</style>
</head>
<body>
<div id="stage">
  <div class="mb">
    <div class="mb-l">
      <svg viewBox="0 0 17 20" width="13" height="16" aria-hidden="true"><path fill="#fff" d="M14.1 10.6c0-2.6 2.1-3.8 2.2-3.9-1.2-1.8-3.1-2-3.7-2-1.6-.2-3.1.9-3.9.9-.8 0-2-.9-3.4-.9C3.6 4.8 1.9 5.8 1 7.4c-1.9 3.3-.5 8.2 1.4 10.9.9 1.3 2 2.8 3.4 2.7 1.4-.1 1.9-.9 3.5-.9s2.1.9 3.5.9c1.5 0 2.4-1.3 3.3-2.7 1-1.5 1.5-3 1.5-3.1-.1 0-2.9-1.1-2.9-4.3zM11.5 3c.7-.9 1.2-2.1 1.1-3.3-1 0-2.3.7-3 1.6-.7.8-1.3 2-1.1 3.2 1.1.1 2.3-.6 3-1.5z"/></svg>
      <b>MinMacs</b><span>Edit</span><span>Window</span><span>Help</span>
    </div>
    <div class="mb-r">
      <div class="icons" id="icons"></div>
      <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M2 6.3a8.6 8.6 0 0 1 12 0M4.2 8.6a5.4 5.4 0 0 1 7.6 0"/><circle cx="8" cy="11.6" r="1.3" fill="#fff" stroke="none"/></svg>
      <svg viewBox="0 0 26 14" width="25" height="13" aria-hidden="true"><rect x=".7" y=".7" width="21.6" height="12.6" rx="3.6" fill="none" stroke="rgba(255,255,255,.55)" stroke-width="1.2"/><rect x="2.6" y="2.6" width="11.6" height="8.8" rx="2" fill="#fff"/><path d="M24 5v4" stroke="rgba(255,255,255,.55)" stroke-width="1.4" stroke-linecap="round"/></svg>
      <span>Tue 27 Oct&nbsp;&nbsp;16:42</span>
    </div>
  </div>

  <div class="win" id="win" role="dialog" aria-label="Settings">
    <div class="side">
      <div class="tb"><div class="lights"><i></i><i></i><i></i></div></div>
      <div class="nav" id="nav" role="tablist" aria-orientation="vertical"></div>
      <div class="sw-wrap">
        <button class="sw" id="one" role="switch" aria-checked="false">One icon <i></i></button>
        <button class="sw" id="login" role="switch" aria-checked="true">Open at login <i></i></button>
      </div>
    </div>
    <div class="main">
      <div class="tb"><h1>Settings</h1></div>
      <div class="pane" id="pane" role="tabpanel"></div>
      <p class="today" id="today"></p>
    </div>
    <div class="pop" id="pop" role="menu"></div>
  </div>
</div>

<script>
const G = {
  apps:'<rect x="4.2" y="4.2" width="7.6" height="7.6" rx="1.6"/><path d="M6.6 1.8v2.4M9.4 1.8v2.4M6.6 11.8v2.4M9.4 11.8v2.4M1.8 6.6h2.4M1.8 9.4h2.4M11.8 6.6h2.4M11.8 9.4h2.4"/>',
  servers:'<rect x="2.5" y="2.8" width="11" height="4.2" rx="1.4"/><rect x="2.5" y="9" width="11" height="4.2" rx="1.4"/><path d="M5.2 4.9h.01M5.2 11.1h.01" stroke-width="2.2"/>',
  trees:'<circle cx="4.6" cy="3.6" r="1.6"/><circle cx="4.6" cy="12.4" r="1.6"/><circle cx="11.4" cy="5.4" r="1.6"/><path d="M4.6 5.2v5.6M11.4 7c0 2.7-2.4 3.4-5.4 4.2"/>',
  disk:'<ellipse cx="8" cy="4" rx="5.5" ry="2"/><path d="M2.5 4v8c0 1.1 2.5 2 5.5 2s5.5-.9 5.5-2V4M2.5 8c0 1.1 2.5 2 5.5 2s5.5-.9 5.5-2"/>',
  awake:'<path d="M1.8 8s2.3-4.3 6.2-4.3S14.2 8 14.2 8s-2.3 4.3-6.2 4.3S1.8 8 1.8 8z"/><circle cx="8" cy="8" r="1.9"/>',
  one:'<circle cx="8" cy="8" r="5.8"/><path d="M8 4.6v3.6l2.4 1.4"/>'
};
const gl=(k,c,s)=>`<svg viewBox="0 0 16 16" width="${s}" height="${s}" fill="none" stroke="${c}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${G[k]}</svg>`;
const CK='<svg viewBox="0 0 12 12" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2.2 6.3l2.4 2.4 5.2-5.4"/></svg>';

/* mode index: 0 = Leave it (Off), 1 = Ask me (Ask), 2 = Do it (Auto) */
const MW = ['Leave it','Ask me','Do it'];
const ORDER = [2,1,0];
const S = [
  {id:'apps',name:'Apps',c:'#5B9BFF',mode:2,vals:['60 %','70 %','80 %','90 %'],v:1,
   say:v=>`Close noise apps when the Mac is over ${v} busy.`,
   does:['Not watching apps.','Shows noise apps to close.','Closes noise apps when the Mac is busy.'],
   live:[null,[[2,'noise apps open']],[[2,'closed today']]], quiet:'Not watching'},
  {id:'servers',name:'Servers',c:'#3FD0B8',mode:2,vals:['30 min','1 hour','2 hours','4 hours','1 day'],v:2,
   say:v=>`Stop servers when nobody used them for ${v}.`,
   does:['Not watching servers.','Shows idle localhost servers.','Stops localhost servers nobody used.'],
   live:[null,[[3,'idle now']],[[3,'idle now'],[3,'stopped today']]], quiet:'Not watching'},
  {id:'trees',name:'Worktrees',c:'#4CC96B',mode:1,vals:['1 hour','1 day','1 week'],v:1,
   say:v=>`Remove merged worktrees after ${v}.`,
   does:['Not watching worktrees.','Shows merged git worktrees.','Removes merged worktrees. Undo brings them back.'],
   live:[null,[[4,'merged'],['5.7','GB']],[[4,'merged'],['5.7','GB']]], quiet:'Not watching'},
  {id:'disk',name:'Disk',c:'#F2B544',mode:2,vals:['daily','weekly','monthly'],v:1,
   say:v=>`Move safe clutter to the Trash ${v}.`,
   does:['Not watching the disk.','Shows caches and build output safe to clean.','Moves safe clutter to the Trash.'],
   live:[null,[[30,'GB safe to clean']],[[30,'GB safe to clean'],['Sun','next']]], quiet:'Not watching'},
  {id:'awake',name:'Keep Awake',c:'#B18CFF',mode:2,vals:['10 %','20 %','30 %','any'],v:1,
   say:v=>v==='any'?`Stay awake while agents work, on ${v} battery.`:`Stay awake while agents work, until ${v} battery.`,
   does:['The Mac sleeps as usual.','Asks when an agent starts working.','Keeps the Mac awake while agents work, then sleeps.'],
   live:[null,[[4,'agents working']],[[4,'agents working']]], quiet:'The Mac sleeps as usual'}
];
const app = {one:false, login:true, undone:false};
let cur = 1; // Servers shown first

const $ = id => document.getElementById(id);

function renderNav(){
  $('nav').innerHTML = S.map((s,i)=>`<button role="tab" id="tab-${s.id}" aria-selected="${i===cur}" tabindex="${i===cur?0:-1}" data-i="${i}" style="--c:${s.c}"><span class="dot m${s.mode}"></span>${s.name}<span class="mw">${MW[s.mode]}</span></button>`).join('');
}
function sayHTML(s){
  const val=s.vals[s.v], full=s.say(val), at=full.indexOf(val);
  return `${full.slice(0,at)}<button class="w" data-k="v" aria-haspopup="menu" aria-expanded="false"><span class="t">${val}</span></button>${full.slice(at+val.length)}`;
}
function liveHTML(s){
  const L=s.live[s.mode];
  return L ? L.map(([n,u])=>`<span class="stat"><span class="n">${n}</span><span class="u">${u}</span></span>`).join('') : `<span class="quiet">${s.quiet}</span>`;
}
function renderPane(anim){
  const s=S[cur], p=$('pane');
  p.style.setProperty('--c',s.c);
  p.className='pane'+(s.mode?'':' off');
  p.setAttribute('aria-labelledby','tab-'+s.id);
  p.innerHTML = `
    <div class="eyebrow"><span class="bdg" id="bdg">${gl(s.id,s.mode?s.c:'rgba(235,235,245,.45)',15)}</span>${s.name}</div>
    <p class="say" id="say">${sayHTML(s)}</p>
    <div class="modes" id="modes" role="radiogroup" aria-label="${s.name} mode">
      ${ORDER.map(i=>`<button role="radio" aria-checked="${i===s.mode}" data-m="${i}">${MW[i]}</button>`).join('')}
      <i class="bar" id="bar"></i>
    </div>
    <p class="does" id="does">${s.does[s.mode]}</p>
    <div class="live" id="live">${liveHTML(s)}</div>`;
  placeBar(false);
  if(anim){ void p.offsetWidth; p.classList.add('in'); }
}
function placeBar(animate){
  const bar=$('bar'), b=$('modes').querySelector('[aria-checked="true"]');
  if(!animate){ bar.style.transition='none'; }
  bar.style.width=b.offsetWidth+'px'; bar.style.transform=`translateX(${b.offsetLeft}px)`;
  if(!animate){ void bar.offsetWidth; bar.style.transition=''; }
}
function setMode(m){
  const s=S[cur]; if(s.mode===m) return; s.mode=m;
  const p=$('pane'); p.classList.toggle('off',!m);
  $('modes').querySelectorAll('button').forEach(b=>b.setAttribute('aria-checked',String(+b.dataset.m===m)));
  placeBar(true);
  $('bdg').innerHTML=gl(s.id,m?s.c:'rgba(235,235,245,.45)',15);
  $('does').textContent=s.does[m]; $('does').classList.remove('fade'); void $('does').offsetWidth; $('does').classList.add('fade');
  $('live').innerHTML=liveHTML(s);
  const tab=$('tab-'+s.id); tab.querySelector('.dot').className='dot m'+m; tab.querySelector('.mw').textContent=MW[m];
  renderIcons();
}
function select(i,focus){
  if(i===cur) return; cur=i; closePop();
  document.querySelectorAll('.nav button').forEach((b,j)=>{ b.setAttribute('aria-selected',String(j===i)); b.tabIndex=j===i?0:-1; });
  renderPane(true); if(focus) $('tab-'+S[i].id).focus();
}
function renderToday(anim){
  $('today').innerHTML = app.undone
    ? `<span>Reopened <b>2 apps</b> and restarted <b>3 servers</b>.</span><button class="act" id="redo">Redo</button>`
    : `<span>Today: closed <b>2 apps</b>, stopped <b>3 servers</b>.</span><button class="act" id="undo">Undo</button>`;
  if(anim){ $('today').classList.remove('fade'); void $('today').offsetWidth; $('today').classList.add('fade'); }
}
function renderIcons(){
  const box=$('icons');
  if(!box.children.length) box.innerHTML = S.map(s=>`<span class="mi" id="mi-${s.id}">${gl(s.id,'#fff',16)}</span>`).join('') + `<span class="mi off" id="mi-one">${gl('one','#fff',16)}</span>`;
  S.forEach(s=>$('mi-'+s.id).classList.toggle('off', app.one || s.mode===0));
  $('mi-one').classList.toggle('off', !app.one);
}

/* value popover */
let popOpen=false;
function openPop(btn){
  const s=S[cur], pop=$('pop');
  pop.innerHTML = s.vals.map((v,i)=>`<button role="menuitemradio" aria-checked="${i===s.v}" data-pick="${i}"><span class="ck">${i===s.v?CK:''}</span><span class="k">${v}</span></button>`).join('');
  pop.style.setProperty('--c',s.mode?s.c:'rgba(255,255,255,.9)');
  const k=$('stage').getBoundingClientRect().width/1280, wr=$('win').getBoundingClientRect(), br=btn.getBoundingClientRect();
  pop.classList.add('on'); popOpen=true; btn.setAttribute('aria-expanded','true');
  let x=(br.left-wr.left)/k-10, y=(br.bottom-wr.top)/k+8;
  x=Math.min(x,780-pop.offsetWidth-16);
  pop.style.left=x+'px'; pop.style.top=y+'px';
  (pop.querySelector('[aria-checked="true"]')||pop.querySelector('button')).focus({preventScroll:true});
}
function closePop(){
  $('pop').classList.remove('on'); popOpen=false;
  const b=document.querySelector('.w[aria-expanded="true"]'); if(b) b.setAttribute('aria-expanded','false'); return b;
}

document.addEventListener('click',e=>{
  const it=e.target.closest('.pop button');
  if(it){ closePop(); const s=S[cur]; s.v=+it.dataset.pick; $('say').innerHTML=sayHTML(s); const w=$('say').querySelector('.w'); w.querySelector('.t').classList.add('swap'); w.focus({preventScroll:true}); return }
  const w=e.target.closest('.w'); if(w){ popOpen?closePop():openPop(w); return }
  if(popOpen && !e.target.closest('.pop')) closePop();
  const t=e.target.closest('.nav button'); if(t){ select(+t.dataset.i); return }
  const m=e.target.closest('.modes button'); if(m){ setMode(+m.dataset.m); return }
  if(e.target.closest('#undo')){ app.undone=true; renderToday(true); return }
  if(e.target.closest('#redo')){ app.undone=false; renderToday(true); return }
  const sw=e.target.closest('.sw'); if(sw){ const on=sw.getAttribute('aria-checked')!=='true'; sw.setAttribute('aria-checked',String(on)); if(sw.id==='one') app.one=on; else app.login=on; renderIcons(); }
});
document.addEventListener('keydown',e=>{
  if(popOpen){
    if(e.key==='Escape'){ const b=closePop(); b&&b.focus(); }
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){ e.preventDefault(); const bs=[...$('pop').querySelectorAll('button')], i=bs.indexOf(document.activeElement); bs[(i+(e.key==='ArrowDown'?1:-1)+bs.length)%bs.length].focus(); }
    return;
  }
  if(e.target.closest('.nav') && (e.key==='ArrowDown'||e.key==='ArrowUp')){ e.preventDefault(); select((cur+(e.key==='ArrowDown'?1:-1)+S.length)%S.length,true); }
  if(e.target.closest('.modes') && (e.key==='ArrowRight'||e.key==='ArrowLeft')){
    e.preventDefault(); const pos=ORDER.indexOf(S[cur].mode), np=Math.max(0,Math.min(2,pos+(e.key==='ArrowRight'?1:-1)));
    setMode(ORDER[np]); $('modes').querySelector(`[data-m="${ORDER[np]}"]`).focus();
  }
});
function fit(){ const st=$('stage'), k=Math.min(innerWidth/1280, innerHeight/800); st.style.transform=`translate(${(innerWidth-1280*k)/2}px,${(innerHeight-800*k)/2}px) scale(${k})` }
addEventListener('resize',()=>{ fit(); closePop(); });
renderNav(); renderPane(false); renderToday(); renderIcons(); fit();
</script>
</body>
