<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Inline Words</title>
<style>
:root{
  --glass:rgba(28,29,38,.88);
  --line:rgba(255,255,255,.06);
  --tx:rgba(255,255,255,.94);
  --tx2:rgba(235,235,245,.58);
  --tx3:rgba(235,235,245,.3);
  --g1:rgba(255,255,255,.07);
  --g2:rgba(255,255,255,.2);
  --g3:rgba(255,255,255,.42);
  --ease:cubic-bezier(.3,.7,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#1a1636}
body{font-family:-apple-system,"SF Pro Text",system-ui,sans-serif;color:var(--tx);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;font-size:13px;cursor:default;user-select:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;text-align:left}
b{font-weight:500}
:focus{outline:none}
:focus-visible{outline:2px solid rgba(255,255,255,.55);outline-offset:2px;border-radius:8px}
#stage{position:absolute;left:0;top:0;width:1280px;height:800px;transform-origin:0 0;overflow:hidden;
  background:
   radial-gradient(760px 560px at 10% 6%,#4b3c9e 0%,rgba(75,60,158,0) 70%),
   radial-gradient(700px 520px at 84% 2%,#22618f 0%,rgba(34,97,143,0) 70%),
   radial-gradient(820px 620px at 88% 104%,#a0436f 0%,rgba(160,67,111,0) 70%),
   radial-gradient(640px 520px at 18% 100%,#3a2463 0%,rgba(58,36,99,0) 75%),
   #1d1a3c}

/* menu bar */
.mb{position:absolute;left:0;right:0;top:0;height:26px;display:flex;align-items:center;justify-content:space-between;padding:0 12px 0 16px;background:rgba(18,14,40,.32);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);font-size:13px;color:rgba(255,255,255,.92);z-index:5}
.mb-l,.mb-r{display:flex;align-items:center;gap:18px}
.mb-l b{font-weight:700}
.mb-r{gap:14px}
.icons{position:relative;display:flex;align-items:center;gap:12px}
.hl{position:absolute;top:-3px;height:22px;width:28px;border-radius:6px;background:rgba(255,255,255,.2);transition:transform .45s var(--ease),opacity .3s;pointer-events:none}
.mi{position:relative;display:flex;width:16px;overflow:hidden;cursor:pointer;transition:width .4s var(--ease),opacity .3s,margin .4s var(--ease)}
.mi.off{width:0;opacity:0;margin-left:-12px}

/* sheet */
.sheet{position:absolute;top:34px;left:360px;width:860px;background:var(--glass);backdrop-filter:blur(36px) saturate(1.5);-webkit-backdrop-filter:blur(36px) saturate(1.5);border:1px solid rgba(255,255,255,.085);border-radius:22px;box-shadow:0 34px 100px rgba(6,4,24,.5),inset 0 1px 0 rgba(255,255,255,.035);animation:drop .6s var(--ease) both}
@keyframes drop{from{opacity:0;transform:translateY(-10px)}}
.nub{position:absolute;top:-8px;left:0;width:18px;height:8px;margin-left:-9px;transition:transform .45s var(--ease)}
.nub svg{display:block}

.head{display:flex;align-items:center;gap:12px;height:54px;padding:0 30px;white-space:nowrap}
.head .lbl{font-size:12px;color:var(--tx3)}
.head .txt{font-size:13px;color:var(--tx2)}
.head .txt b{color:var(--tx)}
.head .undo{margin-left:auto;font-size:13px;font-weight:500;padding:4px 12px;border-radius:12px;background:rgba(255,255,255,.07);transition:background .2s}
.head .undo:hover{background:rgba(255,255,255,.13)}

.body{display:grid;grid-template-columns:310px 1fr;column-gap:32px;padding:2px 30px 24px;height:614px}

/* ---------- left column: the live index ---------- */
.idx{display:flex;flex-direction:column;min-height:0}
.leg{font-size:11px;color:var(--tx3);height:20px;line-height:14px;white-space:nowrap;display:flex;align-items:flex-start;justify-content:flex-end;gap:6px}
.leg i{display:inline-block;width:12px;height:5px;border-radius:3px;margin-top:5px;background:linear-gradient(90deg,#FF8A6B,#5B9BFF 22%,#3FD0B8 42%,#4CC96B 60%,#F2B544 78%,#B18CFF)}
.it{position:relative;display:flex;align-items:center;gap:10px;height:82px;width:100%;border-radius:14px;transition:background .3s}
.it .dot{flex:none;width:9px;height:9px;border-radius:50%;box-shadow:inset 0 0 0 1.5px rgba(235,235,245,.28);transition:background .35s,box-shadow .35s}
.it .nm{flex:1;min-width:0;font-size:24px;font-weight:600;letter-spacing:-.022em;color:rgba(235,235,245,.36);transition:color .3s;white-space:nowrap}
.it:hover .nm{color:var(--tx2)}
.it.sel .nm{color:var(--tx)}
.mg{flex:none;position:relative;width:56px;height:24px;display:flex;align-items:flex-end;justify-content:space-between;transition:opacity .4s,filter .4s}
.it.m0 .mg{opacity:.28;filter:grayscale(1)}
.mg i{display:block;transition:height .55s var(--ease),width .55s var(--ease),left .55s var(--ease),background .35s,opacity .35s,box-shadow .35s}
.mg .tr{position:absolute;left:0;right:0;top:9px;height:6px;border-radius:3px;background:var(--g1)}
.mg .tr i{position:absolute;top:0;bottom:0;border-radius:3px}
.mg.mc i{flex:none;border-radius:2px}
.mg.dots{flex-wrap:wrap;align-content:center;justify-content:space-between;row-gap:4px}
.mg.dots i{width:6px;height:6px;border-radius:50%}
.mg.ring{justify-content:flex-end;align-items:center}
.mg i.gh{background:transparent!important;box-shadow:inset 0 0 0 1.2px var(--c)!important;opacity:1!important;animation:pulse 1.3s ease-in-out infinite}
.nb{flex:none;width:84px;display:flex;flex-direction:column;align-items:flex-end;white-space:nowrap}
.nb .n{font-size:16px;font-weight:500;line-height:19px;color:var(--tx2);transition:color .3s}
.nb .n u{text-decoration:none;font-size:11px;font-weight:400;color:var(--tx3);margin-left:3px}
.nb .cp{font-size:11px;line-height:15px;color:var(--tx3);transition:color .3s}
.it.sel .nb .n{color:var(--tx)}
.it.m0 .nb .n{color:var(--tx3);font-weight:400;font-size:13px}
.it.pv{background:rgba(255,255,255,.035)}
.it.pv .nb .n,.it.pv .nb .cp{color:var(--c)}
.sws{margin-top:auto;display:flex;flex-direction:column;gap:10px;padding-left:19px}
.sw{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--tx2);transition:color .2s;white-space:nowrap}
.sw i{width:28px;height:17px;border-radius:9px;background:rgba(255,255,255,.14);position:relative;transition:background .25s;flex:none}
.sw i::after{content:"";position:absolute;left:2px;top:2px;width:13px;height:13px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .25s var(--ease)}
.sw[aria-checked="true"]{color:var(--tx)}
.sw[aria-checked="true"] i{background:#5B9BFF}
.sw[aria-checked="true"] i::after{transform:translateX(11px)}

/* ---------- right pane ---------- */
.det{position:relative;min-width:0;height:100%}
.det .in{display:flex;flex-direction:column;height:100%;transition:opacity .22s,transform .35s var(--ease)}
.det .in.swap{opacity:0;transform:translateY(6px)}
.lab{display:flex;align-items:center;height:16px;font-size:12px;color:var(--tx3);white-space:nowrap}
.lab .key{margin-left:auto;display:flex;align-items:center;gap:6px;color:var(--tx2);transition:opacity .3s}
.mk{flex:none;width:7px;height:7px;border-radius:50%;transition:background .35s,box-shadow .35s,opacity .35s}
.mk.a{background:var(--c)}
.mk.s{box-shadow:inset 0 0 0 1.5px var(--c)}
.mk.n{opacity:0}
.big{display:flex;align-items:baseline;gap:6px;white-space:nowrap;height:44px;margin-top:4px}
.big .n{font-size:40px;font-weight:500;letter-spacing:-.02em;line-height:44px}
.big .u{font-size:15px;color:var(--tx2)}
.big .n2{margin-left:auto;font-size:13px;color:var(--tx2)}
.big .n2 b{color:var(--tx)}
.say{margin-top:4px;font-size:14px;line-height:20px;color:var(--tx2);min-height:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.say b{color:var(--tx)}
.gr{margin-top:12px;transition:opacity .4s,filter .4s}
.det.off .gr{filter:grayscale(1);opacity:.45}
.mt+.mt{margin-top:10px}
.mt .hd{display:flex;align-items:baseline;justify-content:space-between;height:16px;font-size:12px;color:var(--tx3);white-space:nowrap}
.mt .hd b{color:var(--tx)}
.mt .hd span:last-child{color:var(--tx2);transition:color .3s}
.mt .hd span.pvt{color:var(--c)}
.tb{position:relative;height:6px;margin-top:6px;border-radius:3px;background:var(--g1)}
.tb i{position:absolute;top:0;bottom:0;border-radius:3px;transition:left .55s var(--ease),width .55s var(--ease),background .35s}
.tb .tk{top:-4px;bottom:-4px;width:2px;margin-left:-1px;border-radius:1px;background:#fff}
.tb.seg{display:flex;gap:2px;background:none}
.tb.seg i{position:static;flex-basis:0;transition:flex-grow .55s var(--ease),background .35s,margin .55s var(--ease)}
.tl{position:relative;height:14px;font-size:10.5px;color:var(--tx3)}
.tl span{position:absolute;top:3px;transform:translateX(-50%);white-space:nowrap;transition:left .55s var(--ease)}
.cols{display:flex;align-items:flex-end;gap:5px;height:50px}
.cols .cl{flex:1;position:relative;height:100%;border-radius:4px;background:rgba(255,255,255,.04)}
.cols .cl i{position:absolute;left:0;right:0;bottom:0;border-radius:4px;transition:height .55s var(--ease),background .35s,box-shadow .35s,opacity .35s}
.cleg{display:flex;gap:11px;margin-top:7px;font-size:11px;color:var(--tx3);white-space:nowrap}
.cleg span{display:flex;align-items:center;gap:5px}
.cleg i{width:8px;height:8px;border-radius:2px}
/* striped = what the hovered action touches */
.hit{background:repeating-linear-gradient(135deg,var(--c) 0 2.5px,transparent 2.5px 5px)!important;box-shadow:inset 0 0 0 1px var(--c)!important;opacity:1!important;animation:pulse 1.3s ease-in-out infinite}
@keyframes pulse{50%{opacity:.6}}

/* rows */
.rows{margin-top:10px}
.rw{position:relative;display:flex;align-items:center;gap:8px;height:30px;margin:0 -8px;padding:0 8px;border-radius:9px;font-size:13px;white-space:nowrap;overflow:hidden;transition:height .42s var(--ease),opacity .32s,transform .42s var(--ease),background .2s}
.rw:hover,.rw:focus-within,.rw.open{background:rgba(255,255,255,.045)}
.rw.gone{height:0;opacity:0;transform:translateX(18px);pointer-events:none}
.rw .ic{flex:none;display:flex;width:18px;justify-content:center;transition:opacity .4s,filter .4s}
.rw .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.rw .nm .x{color:var(--tx3);transition:opacity .2s}
.rw.dim .nm{color:var(--tx3)}
.rw .vals{flex:none;display:flex;align-items:center;gap:8px;transition:opacity .22s,transform .32s var(--ease)}
.vals span{flex:none;text-align:right;color:var(--tx2);overflow:hidden;text-overflow:ellipsis}
.vals .g{color:var(--tx3)}
.vals .st{color:var(--tx3);transition:color .35s}
.rw.on .vals .st{color:var(--c)}
.lnk{cursor:pointer;color:var(--tx2)!important;text-decoration:underline;text-decoration-color:rgba(255,255,255,.18);text-underline-offset:3px;transition:color .2s,text-decoration-color .2s}
.lnk:hover{color:var(--tx)!important;text-decoration-color:rgba(255,255,255,.6)}
.rw:hover .vals,.rw:focus-within .vals,.rw.open .vals{opacity:0;transform:translateX(-18px);pointer-events:none}
.rw:hover .nm .x,.rw:focus-within .nm .x,.rw.open .nm .x{opacity:0}
.acts{position:absolute;right:6px;top:0;bottom:0;display:flex;align-items:center;gap:6px;opacity:0;transform:translateX(12px);pointer-events:none;transition:opacity .22s,transform .32s var(--ease)}
.rw:hover .acts,.rw:focus-within .acts,.rw.open .acts{opacity:1;transform:none;pointer-events:auto}
.cap{font-size:12px;color:var(--tx3);margin-right:4px;overflow:hidden;text-overflow:ellipsis;text-align:right}
.cap b{color:var(--tx);font-weight:500}
.cap .why{color:var(--tx3)}
/* round icon buttons (a) */
.ab{flex:none;display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.075);box-shadow:inset 0 0 0 1px rgba(255,255,255,.05);transition:background .18s,box-shadow .18s,color .18s,opacity .2s;color:rgba(255,255,255,.82)}
.ab:hover{background:rgba(255,255,255,.16)}
.ab.go:hover{background:color-mix(in srgb,var(--c) 30%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c) 60%,transparent);color:#fff}
.ab.dis{opacity:.32;cursor:default}
.ab.dis:hover{background:rgba(255,255,255,.075)}
.ab.mo{width:22px;height:22px;background:none;box-shadow:none;color:var(--tx2)}
.ab.mo:hover,.rw.open .ab.mo{background:rgba(255,255,255,.1);color:var(--tx)}
/* text buttons (b) */
.tbn{flex:none;display:flex;align-items:baseline;gap:5px;height:24px;line-height:24px;padding:0 10px;border-radius:12px;font-size:12.5px;font-weight:500;background:rgba(255,255,255,.075);box-shadow:inset 0 0 0 1px rgba(255,255,255,.05);transition:background .18s,box-shadow .18s,opacity .2s}
.tbn .t{font-weight:400;color:var(--tx3);font-size:11.5px}
.tbn:hover{background:rgba(255,255,255,.15)}
.tbn.go:hover{background:color-mix(in srgb,var(--c) 28%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c) 55%,transparent)}
.tbn.go:hover .t{color:rgba(255,255,255,.7)}
.tbn.dis{color:var(--tx3);background:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.07);cursor:default}
.tbn.dis:hover{background:none}

/* preview over rows */
.rows.pvall .rw:not(.hit-r):not(.gone){opacity:.38}
.rw.hit-r{background:color-mix(in srgb,var(--c) 11%,transparent)}
.rw.hit-r::before{content:"";position:absolute;left:0;top:7px;bottom:7px;width:2px;border-radius:1px;background:var(--c)}
.rw.hit-r .vals .st{color:var(--c)}
.rw.flash{animation:flash 1.6s ease-out}
@keyframes flash{0%,30%{background:color-mix(in srgb,var(--c) 22%,transparent)}}
.more{height:20px;font-size:12px;line-height:20px;color:var(--tx3);white-space:nowrap}

.hold{display:flex!important;align-items:center;justify-content:flex-start;gap:0}
.hold em{font-style:normal;flex:none;width:21px;display:flex;align-items:center;gap:1px;font-size:11px;color:var(--tx3);transition:opacity .35s}
.hold svg{display:block}

/* settings */
.set{margin-top:10px;padding-top:6px;border-top:1px solid var(--line)}
.modes{position:relative;display:flex;gap:22px;height:38px;align-items:flex-start;margin-top:4px}
.modes button{font-size:25px;font-weight:600;letter-spacing:-.02em;line-height:32px;color:var(--tx3);transition:color .3s}
.modes button:hover{color:var(--tx2)}
.modes button[aria-checked="true"]{color:var(--tx)}
.bar{position:absolute;left:0;top:35px;height:2px;border-radius:1px;background:var(--c);transition:transform .45s var(--ease),width .45s var(--ease),background .35s,opacity .3s}
.rule{margin-top:4px;font-size:13.5px;line-height:20px;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.opts{display:flex;gap:18px;height:24px;margin-top:6px;align-items:flex-start;white-space:nowrap;transition:opacity .3s}
.opts button{position:relative;font-size:14px;color:var(--tx3);line-height:20px;transition:color .25s}
.opts button:hover{color:var(--tx2)}
.opts button[aria-checked="true"]{color:var(--tx);font-weight:500}
.opts button[aria-checked="true"]::after{content:"";position:absolute;left:50%;bottom:-4px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--c)}
.det.off .opts{opacity:.3;pointer-events:none}
.det.off .big .n{font-size:22px;color:var(--tx3)}

/* section action bar */
.sb{margin-top:auto;padding-top:12px;border-top:1px solid var(--line)}
.sbcap{height:18px;font-size:12px;line-height:18px;color:var(--tx3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:color .25s}
.sbcap b{color:var(--tx);font-weight:500}
.sbcap.on{color:var(--tx2)}
.sbb{display:flex;align-items:center;gap:6px;margin-top:8px}
.sa{display:flex;align-items:baseline;gap:7px;height:32px;line-height:32px;padding:0 14px;border-radius:16px;font-size:13.5px;white-space:nowrap;transition:background .2s,box-shadow .2s,opacity .3s,color .2s}
.sa b{font-weight:600}
.sa .t{font-size:12px;color:var(--tx3);transition:color .2s}
.sa.pri{background:rgba(255,255,255,.09);box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}
.sa.pri::before{content:"";align-self:center;width:7px;height:7px;border-radius:50%;background:var(--c);margin-right:1px}
.sa.pri:hover{background:color-mix(in srgb,var(--c) 26%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c) 55%,transparent)}
.sa.pri:hover .t{color:rgba(255,255,255,.7)}
.sa.sec{color:var(--tx2)}
.sa.sec:last-child{margin-left:auto;margin-right:-14px}
.sa.sec:hover{background:rgba(255,255,255,.07);color:var(--tx)}
.sa.dis{opacity:.4;cursor:default}
.sa.dis:hover{background:rgba(255,255,255,.09);box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}
.sa.sec.dis:hover{background:none;color:var(--tx2)}

/* more menu */
.menu{position:absolute;z-index:20;min-width:228px;padding:6px;border-radius:13px;background:#2a2b37;border:1px solid rgba(255,255,255,.09);box-shadow:0 18px 50px rgba(5,4,20,.55);opacity:0;transform:translateY(-4px) scale(.98);transform-origin:top right;pointer-events:none;transition:opacity .18s,transform .22s var(--ease)}
.menu.show{opacity:1;transform:none;pointer-events:auto}
.menu .mh{padding:5px 10px 6px;font-size:11px;color:var(--tx3);white-space:nowrap}
.menu button{display:flex;align-items:center;gap:9px;width:100%;height:30px;padding:0 10px;border-radius:8px;font-size:13px;white-space:nowrap;color:var(--tx)}
.menu button svg{flex:none;opacity:.75}
.menu button .t{margin-left:auto;padding-left:18px;font-size:12px;color:var(--tx3)}
.menu button:hover{background:rgba(255,255,255,.08)}
.menu button.dis{color:var(--tx3);cursor:default}
.menu button.dis:hover{background:none}
.menu button.dis svg{opacity:.35}

/* toast */
.toast{position:absolute;z-index:30;left:0;top:0;display:flex;align-items:center;gap:10px;height:40px;padding:0 8px 0 14px;border-radius:20px;background:rgba(34,35,46,.9);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);border:1px solid rgba(255,255,255,.09);box-shadow:0 14px 40px rgba(5,4,20,.45);white-space:nowrap;font-size:13px;opacity:0;transform:translate(-50%,8px);pointer-events:none;transition:opacity .3s,transform .4s var(--ease)}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast .ck{flex:none;display:grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--c)}
.toast .t{color:var(--tx3)}
.toast button{height:28px;padding:0 13px;border-radius:14px;font-weight:500;background:rgba(255,255,255,.09);transition:background .2s}
.toast button:hover{background:rgba(255,255,255,.17)}
.toast .x{width:28px;padding:0;display:grid;place-items:center;background:none;color:var(--tx3)}
.toast .x:hover{background:rgba(255,255,255,.08);color:var(--tx)}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important;animation-iteration-count:1!important}}
</style>
</head>
<body class="vb">
<div id="stage">
  <div class="mb">
    <div class="mb-l">
      <svg viewBox="0 0 17 20" width="13" height="16" aria-hidden="true"><path fill="#fff" d="M14.1 10.6c0-2.6 2.1-3.8 2.2-3.9-1.2-1.8-3.1-2-3.7-2-1.6-.2-3.1.9-3.9.9-.8 0-2-.9-3.4-.9C3.6 4.8 1.9 5.8 1 7.4c-1.9 3.3-.5 8.2 1.4 10.9.9 1.3 2 2.8 3.4 2.7 1.4-.1 1.9-.9 3.5-.9s2.1.9 3.5.9c1.5 0 2.4-1.3 3.3-2.7 1-1.5 1.5-3 1.5-3.1-.1 0-2.9-1.1-2.9-4.3zM11.5 3c.7-.9 1.2-2.1 1.1-3.3-1 0-2.3.7-3 1.6-.7.8-1.3 2-1.1 3.2 1.1.1 2.3-.6 3-1.5z"/></svg>
      <b>Finder</b><span>File</span><span>Edit</span><span>View</span><span>Go</span><span>Window</span><span>Help</span>
    </div>

      if(a.st==='f') A.push(wrap,goTab,stopS,{...sleep,more:1});
      else if(a.st==='w') A.push(goTab,sleep,hour,{...stopS,more:1},{...wrap,more:1});
      else if(a.st==='n') A.push(goTab,hour,{...stopS,more:1},{...wrap,more:1});

    }else{
      if(a.st==='w') A.push(goTab,sleep,hour,{...stopS,more:1});
      else A.push(goTab,hour,{...sleep,more:1});
    }
    return A;

    const toClose={k:'list',label:'Move to Close List',run:()=>{x.list='close';return {msg:`${x.n} is on the close list`,tail:'MinMacs Now includes it'}}};
    const fq={k:'quit',label:'Force Quit',dis:'only after a Quit is refused',more:1};

    else if(x.list==='kept'){A.push(quit,toClose,fq)}
    else if(x.list==='spared'){A.push({k:'quit',label:'Quit…',dis:'speed-3 drives it'},{k:'agent',label:'Go to Agent',tail:'speed-3',run:()=>goAgent('a1')},toClose,fq)}
    else A.push({k:'quit',label:'Quit…',dis:'7 agents run in it'},{k:'agent',label:'Go to Agents',run:()=>{select('agents');return null}},{...toClose,dis:'essential',more:1});
    return A;
  }

/* ---------- morph: update in place so CSS eases every value ---------- */
function tween(el,a,b,d){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches||!isFinite(a)){el.textContent=(+b).toFixed(d);return}
  const t0=performance.now(), id=(el._tw=(el._tw||0)+1);
  const step=t=>{if(el._tw!==id)return;const k=Math.min(1,(t-t0)/650),e=1-Math.pow(1-k,3);el.textContent=(a+(b-a)*e).toFixed(d);if(k<1)requestAnimationFrame(step)};
  requestAnimationFrame(step);
}
function morph(a,b){
  if(a.nodeType!==b.nodeType||a.nodeName!==b.nodeName){a.replaceWith(b.cloneNode(true));return}
  if(a.nodeType===3){if(a.nodeValue!==b.nodeValue)a.nodeValue=b.nodeValue;return}
  if(a.nodeType!==1)return;
  if(a.hasAttribute('data-keep'))return;
  if(a.classList.contains('tw')&&b.classList.contains('tw')){const o=parseFloat(a.dataset.v),n=parseFloat(b.dataset.v);if(o!==n){a.dataset.v=b.dataset.v;tween(a,o,n,+b.dataset.d)}return}
  for(const at of [...b.attributes]) if(a.getAttribute(at.name)!==at.value) a.setAttribute(at.name,at.value);
  for(const at of [...a.attributes]) if(!b.hasAttribute(at.name)) a.removeAttribute(at.name);
  if(a.classList.contains('cap')&&a._hov)return; // keep the hovered button's caption
  const ac=[...a.childNodes], bc=[...b.childNodes];
  if(ac.length!==bc.length){a.replaceChildren(...bc.map(n=>n.cloneNode(true)));return}
  ac.forEach((n,i)=>morph(n,bc[i]));
}
function patch(el,html){const t=document.createElement('div');t.innerHTML=html;
  if(!el.childNodes.length){el.innerHTML=html;return}
  const ac=[...el.childNodes], bc=[...t.childNodes];
  if(ac.length!==bc.length){el.innerHTML=html;return}
  ac.forEach((n,i)=>morph(n,bc[i]));
}

  if(b){const rw=b.closest('.rw'),{sid,acts}=rowActs(rw),a=acts[+b.dataset.act];
    if(!VB){const c=rw.querySelector('.cap');c._hov=1;c.innerHTML=capText(a)}
    setPv(a&&a.go&&!a.dis?{sec:sid==='awake'?'awake':sid,ids:a.ids,name:a.label,trim:a.k==='trim'?1:0}:null);
    return}
  const mi=e.target.closest('.menu button');
  if(mi&&menuFor){const rw=document.querySelector(`.rw[data-id="${menuFor}"]`);const {sid,acts}=rowActs(rw),a=acts[+mi.dataset.mi];setPv(a&&a.go&&!a.dis?{sec:sid,ids:a.ids,name:a.label}:null);return}
  if(e.target.closest('.menu'))return;
  if(pv) setPv(null);
});
document.addEventListener('mouseout',e=>{
  const b=e.target.closest('.rw [data-act]');
  if(b&&!b.contains(e.relatedTarget)){const rw=b.closest('.rw'),c=rw.querySelector('.cap');if(c){c._hov=0;const {acts}=rowActs(rw);c.innerHTML=capText(acts[inlIdx(rw)[0]])}}
});

document.addEventListener('click',e=>{
  if(e.target.closest('#tundo')){if(lastSnap){unsnap(lastSnap);lastSnap=null;render()}hideToast();return}
  if(e.target.closest('#tx')){hideToast();return}
  const go=e.target.closest('[data-go]'); if(go){const id=go.dataset.go; if(id==='agents')select('agents'); else goAgent(id); return}
  const mo=e.target.closest('[data-more]'); if(mo){const rw=mo.closest('.rw'); if(menuFor===rw.dataset.id){closeMenu();return} closeMenu(); openMenu(rw,mo); return}
  const mi=e.target.closest('.menu button'); if(mi){const rw=document.querySelector(`.rw[data-id="${menuFor}"]`);const {sid,acts}=rowActs(rw);const a=acts[+mi.dataset.mi]; if(a.dis)return; run(a,sid);return}
  if(!e.target.closest('.menu')) closeMenu();
  const ab=e.target.closest('.rw [data-act]'); if(ab){const rw=ab.closest('.rw'),{sid,acts}=rowActs(rw);run(acts[+ab.dataset.act],sid);return}
  const sa=e.target.closest('.sa'); if(sa){run(secActs(sel)[+sa.dataset.sa],sel);return}
  const it=e.target.closest('.it'); if(it){select(it.dataset.s);return}
  const mb=e.target.closest('.modes button'); if(mb){setMode(+mb.dataset.m);return}
  const ob=e.target.closest('.opts button'); if(ob){cur().v=+ob.dataset.v;render();return}
  const ic=e.target.closest('.mi'); if(ic&&ic.dataset.s){select(ic.dataset.s);return}
  if(e.target.closest('#undo')){FLAGS.restored=1;FLAGS.srvBack=1;render();toast({msg:'Reopened 2 apps and started 3 servers again'},null,'apps');return}
  if(e.target.closest('#redo')){FLAGS.restored=0;FLAGS.srvBack=0;render();return}
  const sw=e.target.closest('.sw'); if(sw){sw.setAttribute('aria-checked',String(sw.getAttribute('aria-checked')!=='true'));renderIcons()}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){closeMenu();if(pv)setPv(null);return}
  const it=e.target.closest&&e.target.closest('.it'); if(!it) return;
  const i=S.findIndex(s=>s.id===it.dataset.s);
  const j=e.key==='ArrowDown'?Math.min(S.length-1,i+1):e.key==='ArrowUp'?Math.max(0,i-1):-1;
  if(j<0) return; e.preventDefault(); select(S[j].id); $('it-'+S[j].id).focus();
});

function fit(){const st=$('stage'),k=Math.min(innerWidth/1280,innerHeight/800);st.style.transform=`translate(${(innerWidth-1280*k)/2}px,${(innerHeight-800*k)/2}px) scale(${k})`;aim()}
addEventListener('resize',fit);
renderIdx(); renderDet(false); renderToday(); renderIcons(); fit();
document.fonts&&document.fonts.ready.then(()=>{placeBar(true);aim()});
</script>
</body>
</html>
