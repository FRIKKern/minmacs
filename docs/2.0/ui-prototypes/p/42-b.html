<title>Workstream Margin Board</title>
<!--
  COMPOSITION: "Workstream Margin Board"  (42-b, from 36-a "Index Holds the Mode")

  Same system as 42-a for every other tab (mode in the open index entry, right side is
  right now). The Workstreams tab, which opens first, takes a bolder composition: the
  sheet widens to 1200 and the right side becomes a board plus a margin note.
  Board: one row per workstream, columns are the sections it holds (Servers teal,
  Worktree and PR green, Caches and browser amber), so reading across a row is reading
  one piece of work, and reading down a column is reading one section. Empty cells stay
  empty, except where a row has a story: lexicon-judge's question, media-scope's tests.
  Margin note (from 36-b): the Workstreams mode is not in the index for this tab; it is
  set in the margin beside exactly the rows it acts on. A thin coral bracket holds the
  ready rows (solid for Auto, dashed for Ask) and its arm points at the chosen mode,
  which is a vertical stack where each mode says in plain words what it does. Under it
  the values, the live countdown and the action itself ("Wrap Up 2 Now 4.4 GB"), whose
  result (what goes, what stays) shows right under it on hover.
  Top line: the big number (what Wrap Up frees) beside the sentence.

  ---- shared notes from 42-a ----

  Workstreams round. A seventh Live Index entry, first in the list: Workstreams, its mini
  graph is 8 short lanes, one per workstream, colored by stage (bright coral = ready to
  wrap up, white = needs you, gray = working or idle). It opens first.
  The Workstreams tab is composed in the same idea as every other tab: the mode lives in
  the opened index entry ("Wraps up a workstream 1 h after its PR merges and its agents
  finish"), the right side is pure right now. Hero column: the big number is what Wrap Up
  frees (4.4 GB), the tall graph is one column per workstream whose height is what it holds
  (servers + worktree + caches), so the two finished ones stand tallest and lit; the
  section action Wrap Up Ready sits under the graph it acts on. The list is rich rows:
  line 1 = name, tool, stage; line 2 = what it holds as section-colored marks (servers
  teal, worktree green, PR, caches amber, headless browser, keep-awake violet). Hover
  swaps line 2 for its actions, so the name and stage never move. A calm "No workstream"
  group closes the list. Every item on the other tabs names its workstream and links to it.
  Body grows 600 -> 620, index entries 70 -> 60.

  Owner update (real time, plain words, Keep Awake as one check):
  - Live: a 1 s clock drives everything. Ages and idle timers count up, load and memory
    breathe, and a 48 s script makes things come and go: a speed-3 subagent spawns (row
    slides in with a "New" tag), :5174 starts, media-scope's tests pass, the subagent
    shows "Finished" and folds away, :5174 stops. Live / Paused pill in the header.
  - Plain words at the point of choice: the open index entry says what the picked mode
    does ("Auto stops servers nobody used for 2 h, then sends a notice with Undo");
    hovering another mode previews it ("If you pick it: ..."). Under the values, a live
    countdown to the next thing that happens on its own ("Auto stops :6006 and :4000 in
    38 s"); when it reaches zero Auto really acts and sends a notice with Undo.
  - Buttons say exactly what and to what ("Stop 3 Servers Now 1.45 GB"); hovering one
    swaps the graph caption for its result (what goes, what stays) and lights the items.
  - Keep Awake left the index and the tabs. It is one checkbox in the footer, "Keep
    working with the lid closed", with "4 agents working · the lid can close" and the
    gray note about 20 % battery, Wi-Fi and heat. No values.

  Grid. Sheet 1040 wide, 32 px margins, 8 px spacing scale (8/16/24/32/40).
  Two zones: the Live Index (320) | the stage (rest), split again 190 | 1fr like ftop's
  own large layout: one tall graph on the left, the list on the right.

  Where the setting lives, and why. The mode belongs to the section, not to the
  content, so it moves INTO the section's own entry in the Live Index. The picked
  entry opens into a quiet card: name, its mini graph, its number, and under it
  Off / Ask / Auto, the rule in one sentence and the value words. The other
  entries show their mode the way they always did (dot + verb), so the index reads
  as six settings at a glance and one of them open. The setting is never a block
  under the content, and its spot follows the tab you picked (it slides down the
  index), so it is never "the same thing in the same place".

  Focal point per tab. With the form gone from the right, the right side is pure
  "right now": one sentence on top, then the hero column (a big ftop number and
  one tall graph that says what it means), then the items. The section action sits
  under the hero graph because it acts on exactly the colored part of that graph.

  Reading path. Index name -> its mode (left, same row of the eye) -> sentence ->
  big number -> graph -> rows. Left half is "what I decided", right half is
  "what is happening".

  Type. Three sizes: 24 (section names), 14 (text and rows), 11.5 (labels), plus
  the big ftop number (48).
-->

b{font-weight:500;color:var(--tx)}

   #1d1a3c}

.sheet{position:absolute;top:34px;background:var(--glass);backdrop-filter:blur(36px) saturate(1.5);-webkit-backdrop-filter:blur(36px) saturate(1.5);border:1px solid rgba(255,255,255,.085);border-radius:22px;box-shadow:0 34px 100px rgba(6,4,24,.5),inset 0 1px 0 rgba(255,255,255,.035);animation:drop .6s var(--ease) both}

.head{display:flex;align-items:center;gap:12px;height:52px;padding:0 32px;white-space:nowrap}

.mg .tr{position:absolute;left:0;right:0;top:9px;height:6px;border-radius:3px;background:var(--g1)}

.nb .cp{font-size:var(--t3);line-height:15px;color:var(--tx3)}
.it.sel .nb .n{color:var(--tx)}

.rw{position:relative;display:flex;align-items:center;gap:10px;height:40px;margin:0 -10px;padding:0 10px;border-radius:10px;white-space:nowrap;overflow:hidden;transition:height .42s var(--ease),opacity .32s,background .25s}

/* ---------- morph: patch the live DOM so things ease instead of jump ---------- */
const TW=new WeakMap();
function tween(el,from,to,f){
  if(RM||isNaN(from)||isNaN(to)){el.textContent=fmtN(to,f);return}
  const id=(TW.get(el)||0)+1;TW.set(el,id);const t0=performance.now(),d=620;
  const step=t=>{if(TW.get(el)!==id)return;const p=Math.min(1,(t-t0)/d),e=1-Math.pow(1-p,3);el.textContent=fmtN(from+(to-from)*e,f);if(p<1)requestAnimationFrame(step)};
  requestAnimationFrame(step);
}
const KEEP=['hit','flash'];
function copyAttrs(a,b){for(const t of [...a.attributes])if(!b.hasAttribute(t.name))a.removeAttribute(t.name);for(const t of [...b.attributes]){let v=t.value;if(t.name==='class'&&a.classList){const k=KEEP.filter(c=>a.classList.contains(c));if(k.length)v=(v+' '+k.join(' ')).trim()}if(a.getAttribute(t.name)!==v)a.setAttribute(t.name,v)}}
function morph(a,b){
  if(a.nodeType!==b.nodeType||a.nodeName!==b.nodeName){a.replaceWith(b);return}
  if(a.nodeType!==1){if(a.nodeValue!==b.nodeValue)a.nodeValue=b.nodeValue;return}
  if(a.classList.contains('num')){const o=a.getAttribute('data-v'),n=b.getAttribute('data-v');copyAttrs(a,b);if(o!==n)tween(a,+o,+n,b.getAttribute('data-f'));return}
  copyAttrs(a,b);
  const ac=[...a.childNodes],bc=[...b.childNodes];
  if(ac.length!==bc.length){a.replaceChildren(...bc);return}
  for(let i=0;i<ac.length;i++)morph(ac[i],bc[i]);
}
function patch(el,html){
  const t=document.createElement('div');t.innerHTML=html;
  const ac=[...el.childNodes],bc=[...t.childNodes];
  if(ac.length!==bc.length){el.replaceChildren(...bc);return}
  for(let i=0;i<ac.length;i++)morph(ac[i],bc[i]);
}

/* ---------- shared wiring ---------- */
function wire(){
  document.addEventListener('click',e=>{
    const t=e.target;
    const d=t.closest('[data-do]');if(d){e.stopPropagation();unlight($('sheet'));run(d.getAttribute('data-do'));return}
    const wl=t.closest('[data-ws]');if(wl){e.stopPropagation();gotoWS(wl.getAttribute('data-ws'));return}
    const go=t.closest('[data-goto]');if(go){e.stopPropagation();gotoAgent(go.getAttribute('data-goto'));return}
    const md=t.closest('[data-mode]');if(md){e.stopPropagation();const [s,i]=md.getAttribute('data-mode').split(':');setMode(s,+i);return}
    const vl=t.closest('[data-val]');if(vl){e.stopPropagation();const [s,i]=vl.getAttribute('data-val').split(':');setVal(s,+i);return}
    if(t.closest('#tundo')){act(S.today?'Reopened <b>2 apps</b>, started <b>3 servers</b> again':'Closed the <b>2 apps</b> and stopped the <b>3 servers</b> again',()=>{S.today=S.today?0:1});return}
    if(t.closest('#tbtn')){undo();return}
    if(t.closest('#live')){SIM.paused=SIM.paused?0:1;render();toast(SIM.paused?'Paused the live view':'Live again',false);return}
    if(t.closest('#lidck')){act(S.lid?'Closing the lid will sleep the Mac and pause agents':'Agents keep working with the lid closed',()=>{S.lid=S.lid?0:1});return}
    if(t.closest('#one')){act(S.one?'One icon per section in the menu bar':'One icon in the menu bar',()=>{S.one=S.one?0:1});return}
    if(t.closest('#login')){act(S.login?'MinMacs will not open at login':'MinMacs opens at login',()=>{S.login=S.login?0:1});return}
    const mi=t.closest('.mi[data-s]');if(mi){select(mi.getAttribute('data-s'));return}
    const it=t.closest('[data-sec]');if(it){select(it.getAttribute('data-sec'));return}
  });
  document.addEventListener('keydown',e=>{
    if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='z'){e.preventDefault();undo();return}
    const it=e.target.closest&&e.target.closest('[data-sec]');
    if(it&&(e.key==='Enter'||e.key===' ')&&e.target===it){e.preventDefault();select(it.getAttribute('data-sec'))}
    if(it&&(e.key==='ArrowDown'||e.key==='ArrowUp')){e.preventDefault();const i=SEC.indexOf(S.sel)+(e.key==='ArrowDown'?1:-1);const s=SEC[(i+SEC.length)%SEC.length];select(s);const n=document.querySelector(`[data-sec="${s}"]`);n&&n.focus()}
  });
  const sheet=$('sheet');
  sheet.addEventListener('mouseover',e=>{
    const md=e.target.closest('[data-mode]');
    if(md){const [ms,mi]=md.getAttribute('data-mode').split(':');if(!HOV_MODE||HOV_MODE.s!==ms||HOV_MODE.i!==+mi){HOV_MODE={s:ms,i:+mi};render()}}
    else if(HOV_MODE){HOV_MODE=null;render()}
    const sb=e.target.closest('[data-sa]');
    if(sb){if(HOV_SA!==sb.dataset.sa){HOV_SA=sb.dataset.sa;render()}}else if(HOV_SA){HOV_SA=null;render()}
    const sa=e.target.closest('[data-t]');
    if(sa){const k=sa.getAttribute('data-t').split(' ').filter(Boolean);if(k.length)light(sheet,k,true);return}
    const r=e.target.closest('.rw[data-k]');
    if(r&&!sheet.classList.contains('hlon')){light(sheet,[r.getAttribute('data-k')],false)}
  });
  sheet.addEventListener('mouseleave',()=>{if(HOV_MODE||HOV_SA){HOV_MODE=null;HOV_SA=null;render()}});
  sheet.addEventListener('mouseout',e=>{
    const sa=e.target.closest('[data-t]'),r=e.target.closest('.rw[data-k]');
    const to=e.relatedTarget;
    if(sa&&!(to&&sa.contains(to)))unlight(sheet);
    else if(r&&!(to&&r.contains(to))&&!sheet.classList.contains('hlon'))unlight(sheet);
  });
  addEventListener('resize',fit);
}

  const x={id:'s5174',p:':5174',k:'vite',ic:'vite',mb:96,ag:'speed3'};Object.defineProperty(x,'idle',{get(){return 0}});

function sweep(){ // fold away what finished: Finished for 3 s, then the row eases out, then it leaves the lists
  for(const id in SIM.fin){if(SIM.t-SIM.fin[id]<5)continue;
    const i=AG.findIndex(a=>a.id===id);if(i>=0)AG.splice(i,1);

/* Auto passes: when Auto has something due, it waits a short grace time (shown as a countdown), then acts and sends a notice with Undo */
function due(s){
  if(MODE(s)!==2) return [];
  if(s==='apps') return LOAD()>=VN('apps')?aff('apps'):[];
  if(s==='ws'||s==='servers'||s==='trees') return aff(s);
  return [];
}
function autoPasses(){
  ['ws','servers','trees','apps'].forEach(s=>{

  if(S.sel==='ws') return boardHTML();
  const s=S.sel, m=MODE(s), b=bigOf(s);
  const key=m?`<span class="key"><i style="${m===2?`background:${C[s]}`:`box-shadow:inset 0 0 0 1.5px ${C[s]}`}"></i>${m===2?'Auto acts on these':'Ask shows these'}</span>`:`<span class="key">${NAME[s]} is off</span>`;
  return `<div class="lab">Right now${key}</div>
  <p class="ins">${insight(s)}</p>
  <div class="split">
    <div class="hero">
      <div class="big"><span class="bn">${b[0]}</span><span class="bu">${b[1]}</span></div>
      <div class="graph">${heroGraph(s)}</div>
      <p class="cap${resOf(s)?' res':''}">${resOf(s)||capOf(s)}</p>
      <div class="sas">${sectionActs(s).map(saBtn).join('')}</div>
    </div>
    <div class="list r-${s}">${rowsFor(s)}</div>
  </div>`;
}
function inClass(){const s=S.sel;return `in m${MODE(s)}`}
function pills(){
  document.querySelectorAll('.modes').forEach(md=>{
    const on=md.querySelector('[aria-checked="true"]'),p=md.querySelector('.pill');
    if(on&&p){p.style.width=on.offsetWidth+'px';p.style.transform=`translateX(${on.offsetLeft}px)`}
  });
}
function render(){
  patch($('idx'),idxHTML());
  const inEl=$('in');inEl.className=inClass()+(inEl.classList.contains('swap')?' swap':'');
  inEl.style.setProperty('--c',C[S.sel]);
  $('det').classList.toggle('off',!MODE(S.sel));
  if(!inEl.classList.contains('swap')) patch(inEl,detHTML());
  pills();renderToday();renderIcons();
  if(LIT){const l=LIT;light($('sheet'),l.keys,l.dim)}
  place();
}
let swapT;
function select(s){
  if(S.sel===s)return;
  S.sel=s;unlight($('sheet'));
  const inEl=$('in');inEl.classList.add('swap');
  clearTimeout(swapT);
  $('brk').style.opacity=0;
  swapT=setTimeout(()=>{inEl.innerHTML=detHTML();inEl.classList.remove('swap');render();const n=$('note');if(n){n.style.transition='none';place();void n.offsetWidth;n.style.transition=''}},RM?0:200);
  patch($('idx'),idxHTML());pills();renderIcons();
}
function init(){
  wire();
  $('in').innerHTML=detHTML();
  autoPasses();render();fit();
  setTimeout(()=>{pills();aim()},60);
  setInterval(tick,1000);
}
init();

</script>
</body>
</html>
