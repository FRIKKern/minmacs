<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Row Poster</title>
<!--
  53 · Three tabs, one row language.
  Sheet 780 x 600 hangs from the MinMacs icon. Header: a segmented control of three words
  (Workstreams, Performance, Settings) and one live line on the right.
  Every view is a list of rows in grouped containers. A closed row is: stage mark, name, stage words,
  agent dots, a thin stacked bar of what it holds (servers teal, worktree green, caches amber,
  browser blue) and its size. Hover a row for its actions.
  a (Accordion Rows): one row opens in place at a time; the open row shows its anatomy as a 2 x 2:
    Agents (live), Servers (mini heartbeat), Worktree and PR, Caches and browser, each with its actions,
    and a footer that says exactly what Wrap Up stops and removes.
  b (Row Poster): master/detail. The list is on the left; the picked row's full anatomy is composed on
    the right like a small poster: big name, big number, a wide stacked bar with legend, four blocks, Wrap Up.
  The Wrap Up rule is woven into the "Ready to wrap up" group header as a mode chip with a live countdown;
  the leftovers rule sits the same way in the Leftovers header. Settings is the same rows; a mode row
  opens to three plain-word choices. Advanced mode unfolds the full tab set into the same control.
-->
<style>
:root{
  --glass:rgba(28,29,38,.9);
  --line:rgba(255,255,255,.06);
  --tx:rgba(255,255,255,.94);
  --tx2:rgba(235,235,245,.62);
  --tx3:rgba(235,235,245,.36);
  --g1:rgba(255,255,255,.07);
  --g2:rgba(255,255,255,.14);
  --g3:rgba(255,255,255,.38);
  --box:rgba(255,255,255,.035);
  --ease:cubic-bezier(.3,.7,.2,1);
  --ws:#FF8A66; --ag:#EE85B5; --ap:#5B9BFF; --sv:#3FD0B8; --tr:#4CC96B; --dk:#F2B544;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#1a1636}
body{font-family:-apple-system,"SF Pro Text",system-ui,sans-serif;color:var(--tx);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;font-size:13px;line-height:18px;cursor:default;user-select:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;text-align:left;line-height:inherit}
b{font-weight:500;color:var(--tx)}
:focus{outline:none}
:focus-visible{outline:2px solid rgba(255,255,255,.55);outline-offset:2px;border-radius:8px}
#stage{position:absolute;left:0;top:0;width:1280px;height:800px;transform-origin:0 0;overflow:hidden;
  background:
   radial-gradient(760px 560px at 10% 6%,#4b3c9e 0%,rgba(75,60,158,0) 70%),
   radial-gradient(700px 520px at 84% 2%,#22618f 0%,rgba(34,97,143,0) 70%),
   radial-gradient(820px 620px at 88% 104%,#a0436f 0%,rgba(160,67,111,0) 70%),
   radial-gradient(640px 520px at 18% 100%,#3a2463 0%,rgba(58,36,99,0) 75%),
   #1d1a3c}
/* menu bar */
.mb{position:absolute;left:0;right:0;top:0;height:26px;display:flex;align-items:center;justify-content:space-between;padding:0 12px 0 16px;background:rgba(18,14,40,.32);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);font-size:13px;color:rgba(255,255,255,.92);z-index:5}
.mb-l,.mb-r{display:flex;align-items:center;gap:18px}
.mb-l b{font-weight:700}
.mb-r{gap:14px}
.icons{display:flex;align-items:center;gap:12px}
.mi{position:relative;display:flex;align-items:center;justify-content:center;width:16px;height:22px;transition:width .45s var(--ease),opacity .35s,margin .45s var(--ease)}
.mi.off{width:0;opacity:0;margin-left:-12px;overflow:hidden}
.mi.on::before{content:"";position:absolute;left:-6px;right:-6px;top:0;bottom:0;border-radius:6px;background:rgba(255,255,255,.2)}
.mi svg{position:relative}
#clock{min-width:118px;text-align:right}

/* sheet */
.sheet{position:absolute;top:34px;left:478px;width:780px;height:600px;background:var(--glass);backdrop-filter:blur(36px) saturate(1.5);-webkit-backdrop-filter:blur(36px) saturate(1.5);border:1px solid rgba(255,255,255,.085);border-radius:22px;box-shadow:0 34px 100px rgba(6,4,24,.5),inset 0 1px 0 rgba(255,255,255,.035);animation:drop .6s var(--ease) both}
@keyframes drop{from{opacity:0;transform:translateY(-10px)}}
.clip{position:absolute;inset:0;border-radius:22px;overflow:hidden}
.nub{position:absolute;top:-8px;left:0;width:18px;height:8px;margin-left:-9px;transition:left .45s var(--ease)}
.nub svg{display:block}
.head{position:absolute;left:24px;right:24px;top:0;height:60px;display:flex;align-items:center;justify-content:space-between;gap:16px;white-space:nowrap}

/* segmented control */
.tabs{position:relative;display:flex;align-items:center;padding:3px;border-radius:10px;background:rgba(255,255,255,.055);box-shadow:inset 0 0 0 1px rgba(255,255,255,.04)}
.thumb{position:absolute;top:3px;left:3px;height:28px;width:80px;border-radius:7px;background:rgba(255,255,255,.13);box-shadow:0 1px 2px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.06);transition:left .45s var(--ease),width .45s var(--ease)}
.tab{position:relative;z-index:1;height:28px;display:flex;align-items:center;padding:0 14px;border-radius:7px;color:var(--tx2);font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;max-width:140px;transition:color .25s,max-width .55s var(--ease),padding .55s var(--ease),opacity .4s}
.tab:hover{color:var(--tx)}
.tab.sel{color:var(--tx)}
.tab.adv{max-width:0;padding:0;opacity:0;pointer-events:none}
.tabs.advon .tab.adv{max-width:120px;padding:0 12px;opacity:1;pointer-events:auto}
.tabs.advon .tab{padding:0 12px}
.tab .w2{display:inline-block;max-width:0;opacity:0;overflow:hidden;transition:max-width .55s var(--ease),opacity .4s}
.tab .w1{display:inline-block;max-width:100px;overflow:hidden;transition:max-width .55s var(--ease),opacity .4s}
.tabs.advon .tab .w1{max-width:0;opacity:0}
.tabs.advon .tab .w2{max-width:40px;opacity:1}
.tab.fresh::after{content:"";position:absolute;right:4px;top:5px;width:5px;height:5px;border-radius:50%;background:var(--ws);box-shadow:0 0 8px var(--ws);animation:freshdot 4.5s ease forwards}
@keyframes freshdot{0%,70%{opacity:1}100%{opacity:0}}
.hlive{display:flex;align-items:center;gap:8px;color:var(--tx3);font-size:12px}
.hlive .pd{width:6px;height:6px;border-radius:50%;background:#7fe0a4;box-shadow:0 0 0 0 rgba(127,224,164,.5);animation:beat 2.4s ease-out infinite}
@keyframes beat{0%{box-shadow:0 0 0 0 rgba(127,224,164,.45)}70%{box-shadow:0 0 0 6px rgba(127,224,164,0)}100%{box-shadow:0 0 0 0 rgba(127,224,164,0)}}
.hlive b{color:var(--tx2);font-weight:500}
.ribbon{position:absolute;left:24px;right:24px;top:60px;height:0;overflow:hidden;z-index:4;transition:height .45s var(--ease)}
.ribbon.on{height:40px}
.ribbon .in{display:flex;align-items:center;gap:10px;height:32px;padding:0 14px;border-radius:10px;background:rgba(255,138,102,.12);color:#FFC4B1;font-size:12px}
.ribbon .in b{color:#FFD9CC}

/* pane */
.pane{position:absolute;left:24px;right:24px;top:60px;bottom:14px;transition:top .45s var(--ease)}
.ribbon.on~.pane{top:100px}
.scr{height:100%;overflow-y:auto;scrollbar-width:none;padding-bottom:28px;-webkit-mask-image:linear-gradient(#000 calc(100% - 22px),transparent);mask-image:linear-gradient(#000 calc(100% - 22px),transparent)}
.scr::-webkit-scrollbar{display:none}
.view{animation:viewin .4s var(--ease) both}
@keyframes viewin{from{opacity:0;transform:translateY(4px)}}

.hl1{display:flex;align-items:baseline;justify-content:space-between;gap:16px;padding:2px 4px 4px}
.hl1 h2{font-size:20px;line-height:26px;font-weight:600;letter-spacing:-.015em}
.hl1 h2 .dim{color:var(--tx3)}
.hl1 .aside{color:var(--tx3);font-size:12px;white-space:nowrap}

/* groups */
.grp{margin-top:12px}
.gh{display:flex;align-items:center;gap:10px;height:32px;padding:0 4px 0 6px;white-space:nowrap}
.gh .gl{font-weight:600;font-size:13px}
.gh .gc{color:var(--tx3);font-size:12px;margin-left:-4px}
.gh .gn{color:var(--tx3);font-size:12px;overflow:hidden;text-overflow:ellipsis;min-width:0}
.gh .gr{margin-left:auto;display:flex;align-items:center;gap:8px}
.gbox{background:var(--box);border-radius:14px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.045);overflow:hidden}

/* rows */
.rw{position:relative;border-top:1px solid var(--line);transition:background .25s}
.rw:first-child{border-top:0}
.rw.fold{animation:fold .42s var(--ease) forwards;overflow:hidden}
@keyframes fold{from{max-height:300px;opacity:1}to{max-height:0;opacity:0}}
.rw.new>.row{animation:glow 4.5s ease}
@keyframes glow{0%{background:rgba(255,138,102,.18)}100%{background:transparent}}
.rw.new{animation:slidein .5s var(--ease)}
@keyframes slidein{from{max-height:0;opacity:0}to{max-height:60px;opacity:1}}
.rw.hit>.row{background:rgba(255,138,102,.1)}
.row{position:relative;display:flex;align-items:center;gap:10px;height:40px;padding:0 14px 0 12px;cursor:pointer;transition:background .25s}
.row:hover{background:rgba(255,255,255,.03)}
.rw.open>.row{background:rgba(255,255,255,.04)}
.mk{flex:none;width:16px;height:16px;display:flex;align-items:center;justify-content:center}
.nm{flex:none;font-weight:500;white-space:nowrap}
.sub{flex:1 1 auto;min-width:0;color:var(--tx2);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub .q{color:var(--tx)}
.nw{display:inline-block;margin-left:6px;padding:0 6px;height:16px;line-height:16px;border-radius:8px;font-size:10px;font-weight:600;color:#FFC4B1;background:rgba(255,138,102,.18);vertical-align:1px}
.fin .sub,.fin .nm{color:var(--tx3)}
.rt{flex:none;display:flex;align-items:center;gap:12px;margin-left:auto}
.dots{display:flex;gap:4px;width:44px;justify-content:flex-end}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--ag);opacity:.55}
.dots i.w{opacity:1;animation:dotpulse 1.8s ease-in-out infinite}
.dots i.n{background:transparent;box-shadow:inset 0 0 0 1.5px var(--ag);opacity:1}
.dots i.dn{animation:dotin .5s var(--ease)}
@keyframes dotpulse{50%{opacity:.45}}
@keyframes dotin{from{transform:scale(0)}}
.sbar{width:120px;height:4px;border-radius:2px;background:rgba(255,255,255,.06);display:flex;gap:1px;overflow:hidden}
.sbar i{display:block;height:100%;min-width:2px;transition:width .6s var(--ease)}
.val{width:58px;text-align:right;color:var(--tx2);white-space:nowrap}
.val.hi{color:var(--tx)}
.chev{flex:none;width:10px;color:var(--tx3);transition:transform .35s var(--ease)}
.rw.open>.row .chev{transform:rotate(90deg)}
.ha{position:absolute;top:0;bottom:0;display:flex;align-items:center;gap:6px;padding-left:28px;opacity:0;pointer-events:none;transition:opacity .2s;background:linear-gradient(90deg,rgba(40,40,52,0),#2a2a37 24px)}
.row:hover .ha{opacity:1;pointer-events:auto}
.rw.open>.row .ha{opacity:0;pointer-events:none}

/* stage marks */
.m-w{width:8px;height:8px;border-radius:50%;background:#fff;position:relative}
.m-w::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:1.5px solid rgba(255,255,255,.5);animation:ring 2.2s ease-out infinite}
@keyframes ring{0%{transform:scale(.5);opacity:1}100%{transform:scale(1.25);opacity:0}}
.m-n{width:9px;height:9px;transform:rotate(45deg);border-radius:2px;background:var(--ag);animation:npulse 1.6s ease-in-out infinite}
@keyframes npulse{50%{opacity:.5}}
.m-i{width:9px;height:9px;border-radius:50%;box-shadow:inset 0 0 0 1.5px rgba(235,235,245,.42)}
.m-f{width:9px;height:2px;border-radius:1px;background:rgba(235,235,245,.4)}
.m-k{width:9px;height:9px;border-radius:2px;box-shadow:inset 0 0 0 1.5px rgba(235,235,245,.42)}
.m-l{width:10px;height:10px;border-radius:50%;border:1.5px dashed rgba(235,235,245,.42)}

/* buttons */
.b{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 11px;border-radius:13px;font-size:12px;font-weight:500;background:var(--g1);color:var(--tx);white-space:nowrap;transition:background .2s,color .2s,box-shadow .2s}
.b:hover{background:rgba(255,255,255,.14)}
.b u{text-decoration:none;color:var(--tx3);font-weight:400}
.b.pri{background:rgba(255,138,102,.2);color:#FFC4B1}
.b.pri:hover{background:rgba(255,138,102,.32);color:#fff}
.b.pri u{color:rgba(255,196,177,.7)}
.b.blue{background:rgba(91,155,255,.22);color:#BFD6FF}
.b.blue:hover{background:rgba(91,155,255,.36);color:#fff}
.b.blue u{color:rgba(191,214,255,.7)}
.b.blk{background:transparent;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);color:var(--tx3);cursor:default}
.b.blk u{color:var(--tx3)}
.b.sm{height:22px;padding:0 9px;border-radius:11px;font-size:11px}
.lk{color:var(--tx);border-bottom:1px solid rgba(255,255,255,.22);cursor:pointer}
.lk:hover{border-color:rgba(255,255,255,.6)}

/* mode chip */
.chip{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 8px 0 7px;border-radius:11px;background:var(--g1);font-size:12px;font-weight:500;color:var(--tx)}
.chip:hover{background:var(--g2)}
.chip.on{background:rgba(255,255,255,.16)}
.md{flex:none;width:9px;height:9px;border-radius:50%;box-shadow:inset 0 0 0 1.5px rgba(235,235,245,.5)}
.md.m1{background:linear-gradient(90deg,#fff 50%,transparent 50%);box-shadow:inset 0 0 0 1.5px #fff}
.md.m2{background:var(--ws);box-shadow:none}
.nx{color:var(--tx2);font-size:12px}

/* detail (a) */
.dw{display:grid;grid-template-rows:0fr;transition:grid-template-rows .42s var(--ease)}
.dw.on{grid-template-rows:1fr}
.dw>div{overflow:hidden;min-height:0}
.det{padding:4px 16px 16px 38px;opacity:0;transition:opacity .3s .08s}
.dw.on .det{opacity:1}
.anat{display:grid;grid-template-columns:1fr 1fr;column-gap:28px;row-gap:14px}
.blk h6{font-size:11px;font-weight:500;color:var(--tx3);line-height:22px;margin-bottom:2px;display:flex;align-items:center;gap:6px}
.blk h6 .c{width:6px;height:6px;border-radius:2px}
.it{display:flex;align-items:center;gap:8px;min-height:24px;line-height:16px;font-size:12px;color:var(--tx2)}
.it>.g{flex:none;width:16px;display:flex;justify-content:center}
.it .t{flex:1 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .t b{font-size:12px}
.it .v{flex:none;color:var(--tx2);text-align:right}
.it.sub2{padding-left:16px}
.it.sub2 .t::before{content:"";display:inline-block;width:8px;height:8px;margin-right:6px;border-left:1px solid var(--g3);border-bottom:1px solid var(--g3);border-bottom-left-radius:3px;vertical-align:3px}
.it.new{animation:glowt 4.5s ease,slidein .5s var(--ease)}
@keyframes glowt{0%{background:rgba(255,138,102,.18)}100%{background:transparent}}
.it.fin .t{color:var(--tx3)}
.it.none{color:var(--tx3)}
.it.lft .ha2{opacity:0;transition:opacity .2s}.it.lft:hover .ha2{opacity:1}.it.lft:hover{background:rgba(255,255,255,.025)}.it.lft{border-radius:8px;margin:0 -8px;padding:0 8px}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.hb{flex:none;display:block;overflow:visible}
.hb path{fill:none;stroke:var(--sv);stroke-width:1.3;stroke-linejoin:round;stroke-linecap:round}
.hb .idle{stroke:rgba(63,208,184,.45);stroke-dasharray:2 3}
.hb .now{fill:var(--sv)}
.wfoot{display:flex;align-items:center;gap:16px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.wfoot p{flex:1;min-width:0;font-size:12px;color:var(--tx2);line-height:17px}
.wfoot p b{font-size:12px}
.wfoot .bb{flex:none;display:flex;gap:6px}

/* chooser */
.chooser{padding:2px 0 0}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mode{display:flex;flex-direction:column;gap:3px;padding:10px 12px 11px;border-radius:12px;background:rgba(255,255,255,.035);box-shadow:inset 0 0 0 1px rgba(255,255,255,.05);transition:background .25s,box-shadow .25s}
.mode:hover{background:rgba(255,255,255,.06)}
.mode .mt{display:flex;align-items:center;gap:7px;font-weight:600;font-size:13px}
.mode .ms{font-size:12px;line-height:16px;color:var(--tx2)}
.mode.sel{background:rgba(255,138,102,.1);box-shadow:inset 0 0 0 1.5px rgba(255,138,102,.55)}
.vrow{display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin-top:12px;font-size:12px;color:var(--tx2)}
.vals{display:inline-flex;padding:2px;border-radius:9px;background:rgba(255,255,255,.055)}
.vals button{height:22px;padding:0 9px;border-radius:7px;font-size:12px;color:var(--tx2);transition:background .2s,color .2s}
.vals button:hover{color:var(--tx)}
.vals button.sel{background:rgba(255,255,255,.15);color:var(--tx)}
.vals.dim{opacity:.4;pointer-events:none}
.next{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:12px;color:var(--tx)}
.next svg{flex:none}
.rulebox{padding:12px 14px 14px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.02)}

/* toggles */
.cb{flex:none;width:16px;height:16px;border-radius:5px;box-shadow:inset 0 0 0 1.5px var(--g3);display:flex;align-items:center;justify-content:center;transition:background .25s,box-shadow .25s}
.cb svg{opacity:0;transition:opacity .2s}
.cb.on{background:var(--ap);box-shadow:none}
.cb.on svg{opacity:1}
.sw{flex:none;position:relative;width:34px;height:20px;border-radius:10px;background:rgba(255,255,255,.14);transition:background .3s}
.sw::after{content:"";position:absolute;left:2px;top:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.35);transition:transform .35s var(--ease)}
.sw.on{background:var(--ws)}
.sw.on::after{transform:translateX(14px)}
.row.r2{height:50px}.row.tall{height:66px}
.row .two{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:1px}
.row .two .nm{line-height:17px}
.row .two .sub{flex:none;line-height:15px}
.row .two .sub.g3{color:var(--tx3)}

/* meters */
.meters{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) 212px;gap:12px;margin-top:4px}
.meter{padding:12px 14px 12px;border-radius:14px;background:var(--box);box-shadow:inset 0 0 0 1px rgba(255,255,255,.045)}
.meter .top{display:flex;align-items:baseline;gap:6px;white-space:nowrap}
.meter .big{font-size:26px;line-height:30px;font-weight:500;letter-spacing:-.01em}
.meter .u{color:var(--tx3);font-size:13px}
.meter .r{margin-left:auto;color:var(--tx3);font-size:12px}
.fbar{position:relative;height:6px;border-radius:3px;background:rgba(255,255,255,.07);margin:8px 0 6px;overflow:hidden;display:flex}
.fbar i{display:block;height:100%;transition:width .7s var(--ease)}
.meter .cap{font-size:12px;color:var(--tx3);white-space:nowrap}
.meter .cap em{font-style:normal;color:#FF9DB5}
.nowbox{display:flex;flex-direction:column;justify-content:center;gap:5px;padding:12px 14px;border-radius:14px;background:var(--box);box-shadow:inset 0 0 0 1px rgba(255,255,255,.045)}
.nowbox .b{justify-content:center;height:30px;border-radius:15px;font-size:13px}
.nowbox .rs{font-size:12px;color:var(--tx3);text-align:center;white-space:nowrap}
.nowbox .rs button{color:var(--tx2);border-bottom:1px solid rgba(255,255,255,.2)}
.ico{flex:none;width:18px;height:18px;display:flex;align-items:center;justify-content:center}
.cpu{width:40px;text-align:right;color:var(--tx2)}

/* lanes (servers) */
.lane{flex:none}

/* treemap */
.tmap{position:relative;display:flex;flex-direction:column;gap:3px;height:222px;margin:14px 0 6px}
.tmb{display:flex;flex-direction:column;justify-content:flex-start;align-items:flex-start;text-align:left}.tmb b,.tmb span{max-width:100%;overflow:hidden;text-overflow:ellipsis}
.tmb.sel{box-shadow:inset 0 0 0 2px rgba(255,255,255,.75)}
.cap3{font-size:11px;color:var(--tx3)}
.lstrip{display:flex;align-items:center;gap:10px;margin-top:12px;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.04)}
.lstrip .lt{flex:1;min-width:0;display:flex;flex-direction:column;font-size:12px;color:var(--tx2);line-height:16px}
.lstrip .lt span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lstrip .la{display:flex;gap:6px;flex:none}
.tmr{display:flex;gap:3px;min-height:0}

/* ---------- format ---------- */
function fmt(x){if(x<=0)return '0 MB';if(x<1)return Math.round(x*1000)+' MB';if(x>=10)return (Math.round(x*10)/10).toFixed(1).replace(/\.0$/,'')+' GB';const d=Math.abs(x*10-Math.round(x*10));return (d>.3?x.toFixed(2):x.toFixed(1)).replace(/\.0$/,'')+' GB'}
const sum=(a,f)=>a.reduce((t,x)=>t+f(x),0);
function dur(m){m=Math.max(0,m);if(m<1)return 'under 1 min';if(m<60)return Math.floor(m)+' min';if(m<1440){const h=Math.floor(m/60),r=Math.floor(m%60);return h+' h'+(r?' '+r+' m':'')}const d=Math.floor(m/1440),h=Math.floor(m%1440/60);return d+' d'+(h?' '+h+' h':'')}
function cd(m){m=Math.max(0,m);if(m<60){const mm=Math.floor(m),s=Math.floor((m-mm)*60);return (mm?mm+' m ':'')+s+' s'}if(m<1440){const h=Math.floor(m/60),r=Math.floor(m%60);return h+' h '+r+' m'}const d=Math.floor(m/1440),h=Math.floor(m%1440/60),r=Math.floor(m%60);return d+' d '+h+' h '+r+' m'}
const nb=t=>String(t).replace(/(\d) (GB|MB|%|h|m|s|min|d)(?![\w])/g,'$1&nbsp;$2');

function nextText(k){

  if(k==='apps'){const l=LOAD(),t=thr('apps');return nb(l>t?(m===2?'Above '+t+' %: closing now':'Above '+t+' %: MinMacs Now is lit'):`Waits for load above ${t} % · now ${l} %`)}
  if(k==='left'){const v=ST.R.left.v;const when=v===0?(1440-((16*60+42+T)%1440)+540)%1440:v===1?toSunday():(5*1440-T);return nb((m===2?'Auto cleans ':'Shows the button ')+(v===0?'tomorrow 09:00':v===1?'Sunday 09:00':'1 Nov 09:00')+' · in '+cd(when))}
  if(k==='srv'){const s=idleSrv().filter(s=>!s.left);if(!s.length)return 'No unused servers.';const t=thr('srv');const nx=s.map(x=>[x,t-idleOf(x)]).sort((a,b)=>a[1]-b[1])[0];if(m===1)return nb(`${s.filter(x=>idleOf(x)>=t).length} over ${RULES.srv.vals[ST.R.srv.v]} · waits for your press`);return nb(nx[1]<=0?`Stopping ${nx[0].p} now`:`Auto stops ${nx[0].p} in ${cd(nx[1])}`)}

  return '';
}

/* heartbeat svg */
function hb(s,w,h){
  w=w||88;h=h||16;
  if(s.idle&&!s.kept){
    const t=thr('srv'),p=Math.min(1,idleOf(s)/Math.max(t,idleOf(s)>t?idleOf(s):t));
    return `<svg class="hb" data-hb="${s.id}" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><path class="idle" d="M0 ${h-2}H${w}"/><path d="M${w-1} ${h-7}v7" stroke="rgba(255,138,102,.7)" style="stroke:rgba(255,138,102,.75)"/><circle class="now" data-hbi="${s.id}" cx="${(p*(w-4)).toFixed(1)}" cy="${h-2}" r="2.4"/></svg>`;
  }
  if(s.kept)return `<svg class="hb" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><path class="idle" d="M0 ${h-2}H${w}" style="stroke:rgba(235,235,245,.3)"/></svg>`;
  return `<svg class="hb" data-hb="${s.id}" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><path d="${hbPath(s.id,w,h)}"/><circle class="now" cx="${w}" cy="${h-2}" r="2"/></svg>`;
}
function hbPath(id,w,h){const a=HIST[id],n=a.length,dx=w/(n-1);let d='';a.forEach((v,i)=>{const x=(i*dx).toFixed(1),y=(h-2-v*(h-4)).toFixed(1);d+=(i?'L':'M')+x+' '+y});return d}

  const stay=[];if(w.pr)stay.push('PR #'+w.pr.n+' stays on GitHub');if(!w.pr)stay.push('the branch stays');
  return {go:go.length?go.join(', '):'nothing to stop',stay:stay.join(', ')};
}
const pvWrap=w=>{const x=wrapWhat(w);return `<span class=tg><span class=go>Goes</span></span>${x.go[0].toUpperCase()+x.go.slice(1)}. ${fmt(wsFree(w))} back.<span class=tg style="margin-top:6px"><span class=stay>Stays</span></span>${x.stay[0].toUpperCase()+x.stay.slice(1)}. One Undo brings it back.`};

/* ---------- workstream rows ---------- */

  if(w.st==='i')return nb(`Idle ${dur(agAge(a))} · #${w.pr.n} ${w.pr.s}`);
  if(w.st==='r')return nb(kept(w.id)?'Kept · Auto skips it':w.noag?`Ready · merged ${dur(mergedAgo(w))} ago, no agent`:`Ready · PR merged ${dur(mergedAgo(w))} ago`);
}

function wsRow(w){

function agItem(a,w){

function wsDetail(w,L){

  const m=16*60+42+Math.floor(T),h=Math.floor(m/60)%24,mm=m%60;$('clock').innerHTML=`Tue 27 Oct&nbsp;&nbsp;${h}:${String(mm).padStart(2,'0')}`;
  if(tk%4===0)autos();
  if(tk%30===0){EV[evI%EV.length]();evI++;render()}
},250);

/* ---------- boot ---------- */
function fit(){const s=Math.min(innerWidth/1280,innerHeight/800);$('stage').style.transform=`scale(${s})`;$('stage').style.left=Math.max(0,(innerWidth-1280*s)/2)+'px';placeNub();followThumb(0)}
buildTabs();buildIcons();syncTabs();render();fit();addEventListener('resize',fit);
</script>
