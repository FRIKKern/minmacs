<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Number Row</title>
<!--
  47-b, Number Row (continues 41-b, Corner Drawer Spotlight; minimal round)

  Sheet 640 x 508. The six live numbers sit in one row across the top (8, 12, 63 %, 7, 14, 38 GB), each with a
  tiny gray label and a 5 px mode dot; the current one is white, the rest dim. Pane 584 wide below it,
  footer 52 with the lid check and Today.
  Scale 4 8 12 16 24. Type: 20, 13, 11 + ftop numbers 26 (row) and 34 (totals).

  Servers: the big total, then one horizontal stacked bar (width = memory now; teal in use, gray to coral
  as an idle server nears 2 h), then a live activity strip with one lane per server in the same order:
  busy lanes show request ticks for the last 10 minutes, idle lanes show an idle clock filling to the 2 h
  mark, the kept postgres lane is a dashed line.

  Drawer open: the number row shrinks to the left, the pane narrows beside the drawer and lights what the
  rule would act on.
-->
<style>
:root{
  --glass:rgba(28,29,38,.88);
  --line:rgba(255,255,255,.07);
  --tx:rgba(255,255,255,.94);
  --tx2:rgba(235,235,245,.62);
  --tx3:rgba(235,235,245,.34);
  --g1:rgba(255,255,255,.07);
  --g2:rgba(255,255,255,.18);
  --g3:rgba(255,255,255,.38);
  --rowbg:#2b2b39;
  --ease:cubic-bezier(.3,.7,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#1a1636}
body{font-family:-apple-system,"SF Pro Text",system-ui,sans-serif;color:var(--tx);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;font-size:13px;line-height:18px;cursor:default;user-select:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;text-align:left;line-height:inherit}
b{font-weight:500;color:var(--tx)}
:focus{outline:none}
:focus-visible{outline:2px solid rgba(255,255,255,.55);outline-offset:2px;border-radius:8px}
#stage{position:absolute;left:0;top:0;width:1280px;height:800px;transform-origin:0 0;overflow:hidden;
  background:
   radial-gradient(760px 560px at 10% 6%,#4b3c9e 0%,rgba(75,60,158,0) 70%),
   radial-gradient(700px 520px at 84% 2%,#22618f 0%,rgba(34,97,143,0) 70%),
   radial-gradient(820px 620px at 88% 104%,#a0436f 0%,rgba(160,67,111,0) 70%),
   radial-gradient(640px 520px at 18% 100%,#3a2463 0%,rgba(58,36,99,0) 75%),
   #1d1a3c}

/* menu bar */
.mb{position:absolute;left:0;right:0;top:0;height:26px;display:flex;align-items:center;justify-content:space-between;padding:0 12px 0 16px;background:rgba(18,14,40,.32);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);font-size:13px;color:rgba(255,255,255,.92);z-index:5}
.mb-l,.mb-r{display:flex;align-items:center;gap:18px}
.mb-l b{font-weight:700}
.mb-r{gap:14px}
.icons{position:relative;display:flex;align-items:center;gap:12px}
.hl{position:absolute;top:-3px;left:0;height:22px;width:28px;border-radius:6px;background:rgba(255,255,255,.2);transition:transform .45s var(--ease),opacity .3s;pointer-events:none}
.mi{position:relative;display:flex;width:16px;overflow:visible;cursor:pointer;transition:width .4s var(--ease),opacity .3s,margin .4s var(--ease)}
.mi.off{width:0;opacity:0;margin-left:-12px;overflow:hidden}
.mi .bdg{position:absolute;right:-3px;top:-2px;width:6px;height:6px;border-radius:50%;background:#fff;box-shadow:0 0 0 1.5px rgba(30,26,60,.9)}
#clock{min-width:118px;text-align:right}

/* sheet */
.sheet{position:absolute;top:34px;left:312px;width:940px;height:660px;background:var(--glass);backdrop-filter:blur(36px) saturate(1.5);-webkit-backdrop-filter:blur(36px) saturate(1.5);border:1px solid rgba(255,255,255,.085);border-radius:22px;box-shadow:0 34px 100px rgba(6,4,24,.5),inset 0 1px 0 rgba(255,255,255,.035);animation:drop .6s var(--ease) both}
@keyframes drop{from{opacity:0;transform:translateY(-10px)}}
.clip{position:absolute;inset:0;border-radius:22px;overflow:hidden}
.nub{position:absolute;top:-8px;left:0;width:18px;height:8px;margin-left:-9px;transition:transform .45s var(--ease)}
.nub svg{display:block}

.head{position:absolute;left:32px;right:32px;top:0;height:56px;display:flex;align-items:center;justify-content:space-between;gap:24px;white-space:nowrap}
.today{display:flex;align-items:center;gap:12px;transition:opacity .25s}
.sheet.tst .today{opacity:0}
.today .lbl{font-size:11px;color:var(--tx3)}
.today .txt{color:var(--tx2)}
.today .undo{height:24px;padding:0 10px;border-radius:12px;font-size:11px;font-weight:500;color:var(--tx2);background:var(--g1);transition:background .2s,color .2s}
.today .undo:hover{background:rgba(255,255,255,.13);color:var(--tx)}
.lidw{display:flex;flex-direction:column;align-items:flex-end;transition:opacity .3s}
.sheet.open .lidw{opacity:0;pointer-events:none}
.lid{display:flex;align-items:center;gap:8px;color:var(--tx);border-radius:8px;padding:1px 4px;margin:0 -4px}
.lid .cb{flex:none;width:16px;height:16px;border-radius:5px;box-shadow:inset 0 0 0 1.5px var(--g3);display:flex;align-items:center;justify-content:center;transition:background .25s,box-shadow .25s}
.lid .cb svg{opacity:0;transition:opacity .2s}
.lid[aria-checked="true"] .cb{background:#5B9BFF;box-shadow:none}
.lid[aria-checked="true"] .cb svg{opacity:1}
.lid .lv{color:var(--tx3)}
.lidw .ln{font-size:11px;line-height:14px;color:var(--tx3);margin-top:1px}

.body{position:absolute;left:32px;right:32px;top:56px;height:576px}

/* ---------- Live Index ---------- */
.idx{position:absolute;left:0;top:0;width:312px;height:576px;display:flex;flex-direction:column}
.it{display:flex;align-items:center;flex:1;margin:0 -10px;padding:0 10px;border-radius:14px;transition:background .25s}
.it:hover{background:rgba(255,255,255,.035)}
.it .dot{flex:none;width:9px;height:9px;border-radius:50%;box-shadow:inset 0 0 0 1.5px rgba(235,235,245,.28);transition:background .35s,box-shadow .35s}
.it .nm{flex:1 1 auto;min-width:0;max-width:150px;margin-left:12px;font-size:22px;line-height:28px;font-weight:600;letter-spacing:-.02em;color:rgba(235,235,245,.36);white-space:nowrap;overflow:hidden;transition:color .3s,max-width .5s var(--ease),opacity .3s,margin .5s var(--ease)}
.it:hover .nm{color:var(--tx2)}
.it.sel .nm{color:var(--tx)}
.mg{flex:none;position:relative;width:56px;height:24px;margin-left:auto;display:flex;align-items:flex-end;justify-content:space-between;transition:opacity .4s,filter .4s,margin .5s var(--ease)}
.it.m0 .mg{opacity:.28;filter:grayscale(1)}
.mg i{display:block;transition:height .55s var(--ease),width .55s var(--ease),left .55s var(--ease),background .35s,opacity .35s,box-shadow .35s}
.mg .tr{position:absolute;left:0;right:0;top:9px;height:6px;border-radius:3px;background:var(--g1)}
.mg .tr i{position:absolute;top:0;bottom:0;border-radius:3px}
.mg.mc i{flex:none;border-radius:2px}
.mg.dots{flex-wrap:wrap;align-content:center;row-gap:4px;justify-content:flex-start;column-gap:2px}
.mg.dots i{width:5px;height:5px;border-radius:50%}
.mg.ring{justify-content:flex-end;align-items:center}
.nb{flex:none;width:80px;margin-left:12px;display:flex;flex-direction:column;align-items:flex-end;white-space:nowrap;overflow:hidden;transition:width .5s var(--ease),opacity .3s,margin .5s var(--ease)}
.nb .n{font-size:13px;font-weight:500;line-height:18px;color:var(--tx2);transition:color .3s}
.nb .n u{text-decoration:none;font-size:11px;font-weight:400;color:var(--tx3);margin-left:3px}
.nb .cp{font-size:11px;line-height:14px;color:var(--tx3)}
.it.sel .nb .n{color:var(--tx)}

/* ---------- pane ---------- */
.pane{position:absolute;left:348px;top:0;width:528px;height:576px;transition:transform .6s var(--ease)}
.pin{position:absolute;inset:0;transition:opacity .2s,transform .35s var(--ease)}
.pin.swap{opacity:0;transform:translateY(6px)}
.f{position:absolute;inset:0;display:flex;flex-direction:column}

/* the mode mark: one fixed corner, every tab, says what happens next */
.mark{position:absolute;right:-10px;top:-4px;z-index:3;display:flex;flex-direction:column;align-items:flex-end;padding:4px 10px 5px;border-radius:12px;font-size:11px;line-height:14px;color:var(--tx2);white-space:nowrap;transition:background .25s,color .25s,opacity .3s}
.mark:hover{background:var(--g1);color:var(--tx)}
.mark .m1{display:flex;align-items:center;gap:7px;height:18px}
.mark .m1 b{font-weight:500}
.mark .m2{color:var(--tx3)}
.pips{display:flex;gap:3px}
.pips i{width:5px;height:5px;border-radius:50%;background:var(--g2);transition:background .35s,box-shadow .35s}
.mark .mv{color:var(--tx3)}
.mark svg{opacity:.5;transition:transform .3s var(--ease)}
.mark:hover svg{transform:translateX(2px);opacity:.8}

.hd{font-size:22px;line-height:28px;font-weight:600;letter-spacing:-.018em;color:var(--tx);max-width:350px}
.hd .s{color:var(--tx3)}
.cap{font-size:11px;line-height:14px;color:var(--tx3);white-space:nowrap}
.cap b{color:var(--tx2);font-weight:500}
.big{font-size:34px;line-height:38px;font-weight:500;letter-spacing:-.01em;white-space:nowrap}
.big u{text-decoration:none;font-size:13px;font-weight:400;color:var(--tx3);margin-left:4px;letter-spacing:0}

.btn{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 13px;border-radius:15px;background:var(--g1);font-size:13px;font-weight:500;white-space:nowrap;transition:background .2s,opacity .3s}
.btn:hover{background:rgba(255,255,255,.14)}
.btn .tl{font-weight:400;color:var(--tx3)}
.btn.pri{background:color-mix(in srgb,var(--c) 24%,transparent)}
.btn.pri:hover{background:color-mix(in srgb,var(--c) 36%,transparent)}
.btn.pri .tl{color:rgba(255,255,255,.55)}
.btn[disabled]{opacity:.35;pointer-events:none}

/* rows */
.rw{position:relative;display:flex;align-items:center;gap:10px;height:30px;margin:0 -8px;padding:0 8px;border-radius:8px;white-space:nowrap;transition:height .4s var(--ease),opacity .32s,background .25s}
.rw:hover{background:var(--rowbg)}
.rw.leave,.fc.leave{height:0!important;opacity:0;pointer-events:none;margin-top:0}
.rw .ic{flex:none;display:flex;width:18px;justify-content:center}
.rw .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.rw .nm .x{color:var(--tx3)}
.rw .v{flex:none;width:58px;text-align:right;color:var(--tx2)}
.rw .v2{flex:none;width:40px;text-align:right;color:var(--tx3)}
.rw .st{flex:none;text-align:right;color:var(--tx3)}
.rw.dim .nm{color:var(--tx2)}
.meta{display:flex;align-items:center;gap:10px;transition:opacity .2s}
.lk{color:var(--tx2);cursor:pointer;border-bottom:1px solid rgba(255,255,255,.14);transition:color .2s,border-color .2s}
.lk:hover{color:var(--tx);border-color:rgba(255,255,255,.5)}
.acts{position:absolute;right:0;top:0;bottom:0;display:flex;align-items:center;gap:4px;padding:0 4px 0 32px;background:linear-gradient(90deg,rgba(43,43,57,0),var(--rowbg) 28px);opacity:0;transform:translateX(8px);pointer-events:none;transition:opacity .2s,transform .3s var(--ease);border-radius:0 8px 8px 0}
.rw:hover .acts,.rw:focus-within .acts{opacity:1;transform:none;pointer-events:auto}
.rw:hover .meta,.rw:focus-within .meta{opacity:0}
.ab{height:22px;padding:0 9px;border-radius:11px;background:rgba(255,255,255,.08);font-size:11px;font-weight:500;white-space:nowrap;display:inline-flex;align-items:center;gap:5px;transition:background .2s}
.ab:hover{background:rgba(255,255,255,.17)}
.ab .tl{font-weight:400;color:var(--tx3)}
.ab.dis{background:none;color:var(--tx3);cursor:default;font-weight:400;padding:0 4px}
.ab.dis .tl{color:rgba(235,235,245,.24)}

/* live: arrivals glow, departures say Finished, then fold */
.newp{display:inline-block;margin-left:6px;padding:0 6px;height:16px;line-height:16px;border-radius:8px;font-size:10px;font-weight:600;letter-spacing:.02em;color:#fff;background:color-mix(in srgb,var(--c) 45%,transparent);vertical-align:1px}
.nw{animation:arrive 5s var(--ease)}
@keyframes arrive{0%{opacity:0;transform:translateY(-6px);background:color-mix(in srgb,var(--c) 26%,transparent)}10%{opacity:1;transform:none;background:color-mix(in srgb,var(--c) 22%,transparent)}100%{background:rgba(0,0,0,0)}}
.nwc{animation:arriveC 5s var(--ease)}
@keyframes arriveC{0%{opacity:0;transform:scale(.6)}10%{opacity:1;transform:none;box-shadow:0 0 0 2px rgba(255,255,255,.8),0 0 16px var(--c)}100%{box-shadow:0 0 0 0 rgba(255,255,255,0)}}
.fin{background:rgba(255,255,255,.06)}
.fin .nm>span:first-child{color:var(--tx)}

/* setting marks (only while the setting face is open) */
.rw::before,.fc::before{content:"";position:absolute;left:-6px;top:50%;width:6px;height:6px;margin-top:-3px;border-radius:50%;opacity:0;transform:scale(.4);transition:opacity .3s,transform .35s var(--ease),background .3s,box-shadow .3s}
.fc::before{left:-2px}
.setv .aff.rw::before,.setv .aff.fc::before{opacity:1;transform:none}
.setv .aff.ma.rw::before,.setv .aff.ma.fc::before{background:var(--c)}
.setv .aff.mq.rw::before,.setv .aff.mq.fc::before{box-shadow:inset 0 0 0 1.5px var(--c)}
.setv [data-t]:not(.aff){opacity:.42}
.setv .aff .nm{color:var(--tx)}
.setv i.aff,.setv .bd.aff .ringwrap{box-shadow:0 0 0 1.5px color-mix(in srgb,var(--c) 80%,transparent),0 0 14px color-mix(in srgb,var(--c) 40%,transparent)!important}
[data-t]{transition:opacity .35s,height .4s var(--ease),background .25s,box-shadow .35s,flex-grow .55s var(--ease)}

/* plan: hovering a section action lights what it touches */
.plan [data-t]:not(.hit){opacity:.22}
.plan .rw.hit,.plan .fc.hit{background:color-mix(in srgb,var(--c) 15%,transparent)}
.plan i.hit,.plan .bd.hit .ringwrap{box-shadow:0 0 0 1.5px rgba(255,255,255,.75),0 0 14px var(--c)!important}

/* ---------- Workstreams: Ledger ---------- */
.lg-h{display:flex;align-items:center;height:20px;margin-top:28px;white-space:nowrap}
.lg-h .cap:first-child{flex:1}
.mx{display:grid;grid-template-columns:20px 40px 30px 52px 20px 116px;column-gap:10px;align-items:center;justify-items:center}
.mx>span{display:flex;align-items:center;justify-content:center;height:18px}
.mx>:last-child{justify-self:end;justify-content:flex-end}
.lg-h .mx{color:var(--tx3);font-size:11px}
.lg-h .mx svg{opacity:.7}
.ledger{margin-top:6px}
.ledger .gsp{height:10px}
.wsr{height:43px}
.wsr .nm{display:flex;flex-direction:column;justify-content:center}
.wsr .nm .x{font-size:11px;line-height:14px}
.wsr .mx{color:var(--tx2);font-size:13px}
.wsr .sg{color:var(--tx3);white-space:nowrap}
.wsr .no{display:block;width:4px;height:4px;border-radius:50%;background:rgba(255,255,255,.12)}
.wsr .sv{display:flex;align-items:center;gap:3px;font-size:11px;color:var(--tx3)}
.wsr.rdy .nm>span:first-child{font-weight:500}
.setv .wsr.aff::before{display:none}
.setv .wsr.aff{background:color-mix(in srgb,var(--c) 10%,transparent)}
.setv .wsr.aff.mq{background:color-mix(in srgb,var(--c) 6%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c) 30%,transparent)}
.nows{display:flex;flex-wrap:wrap;align-items:baseline;column-gap:14px;row-gap:4px;margin-top:20px;white-space:nowrap}
.nows>span{font-size:11px;line-height:14px;color:var(--tx3)}
.nows>span:first-child{flex:0 0 100%}
.nows .lk{color:var(--tx2)}
.flash{background:color-mix(in srgb,var(--c) 18%,transparent)!important}

/* ---------- Workstreams: Spotlight (wide) ---------- */
.sheet.wide .idx .nm{max-width:0;opacity:0;margin-left:0}
.sheet.wide .idx .nb{width:0;opacity:0;margin-left:0}
.sheet.wide .idx .mg{margin-left:12px}
.pane{transition:transform .6s var(--ease),left .6s var(--ease),width .6s var(--ease)}
.sheet.wide .pane{left:104px;width:772px}
.sheet.wide.open .pane{transform:none;width:496px}
.sp-h{display:flex;align-items:center;justify-content:space-between;margin-top:24px;height:30px;white-space:nowrap}
.sp-h .cap b{color:var(--tx)}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:12px}
.wc{position:relative;display:flex;flex-direction:column;padding:16px 18px 14px;border-radius:18px;background:rgba(255,255,255,.045);box-shadow:inset 0 0 0 1px rgba(255,255,255,.06);transition:opacity .35s,transform .4s var(--ease),box-shadow .35s,background .25s,height .4s var(--ease)}
.wc:hover{background:rgba(255,255,255,.06)}
.wc.leave{opacity:0;transform:scale(.96)}
.wc-h{display:flex;align-items:center;gap:12px}
.wc-h .ic{flex:none;width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.06)}
.wc-t{flex:1;min-width:0;display:flex;flex-direction:column;white-space:nowrap;overflow:hidden}
.wc-t b{font-weight:600;overflow:hidden;text-overflow:ellipsis}
.wc-t .x{font-size:11px;line-height:14px;color:var(--tx3)}
.wc-s{flex:none;font-size:11px;font-weight:600;color:var(--c);display:flex;align-items:center;gap:6px}
.wc-s i{width:7px;height:7px;border-radius:50%;background:var(--c)}
.wc-l{margin-top:12px;display:flex;flex-direction:column}
.wc-r{display:flex;align-items:center;gap:10px;height:26px;white-space:nowrap}
.wc-r .gi{flex:none;width:16px;display:flex;justify-content:center}
.wc-r .tx{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.wc-r .tx .dt{color:var(--tx3)}
.wc-r .vv{flex:none;color:var(--tx2)}
.sheet.open .wc-r .dt{display:none}
.wc-f{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:auto;padding-top:12px;white-space:nowrap}
.wc-f .cap{overflow:hidden;text-overflow:ellipsis}
.wc .btn.pri{height:28px}
.wc.kept{opacity:.6}
.setv .wc.aff{box-shadow:inset 0 0 0 1.5px var(--c),0 0 24px color-mix(in srgb,var(--c) 22%,transparent)}
.setv .wc.aff.mq{box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--c) 55%,transparent)}
.plan .wc.hit{box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.7),0 0 24px color-mix(in srgb,var(--c) 30%,transparent)}
.calm2{grid-column:1/-1;height:120px;display:flex;align-items:center;justify-content:center;border-radius:18px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06);color:var(--tx3)}
.sp-h2{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-top:32px;white-space:nowrap}
.sp-h2 .nows2{font-size:11px;line-height:14px;color:var(--tx3);overflow:hidden;text-overflow:ellipsis}
.sp-h2 .nows2 .lk{color:var(--tx2)}
.sheet.open .sp-h2 .nows2{display:none}
.cards>*,.tiles>*{min-width:0}
.sheet.open .sp-h .dt{display:none}
.sheet.open .tl2 .t3 .cs{display:none}
.sheet.open .tl2{padding:0 10px}
.sheet.open .tl2 .t1 .ic{display:none}
.sheet.open .tl2 .t2,.sheet.open .tl2 .t3{padding-left:0}
.sheet.open .wc-f{flex-direction:column;align-items:flex-start;gap:6px}
.sheet.open .wc-s span{display:none}
.wc-f,.wc-s span,.tl2 .t1 .ic{transition:none}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.tl2{position:relative;display:flex;flex-direction:column;justify-content:center;height:80px;padding:0 12px;border-radius:14px;background:rgba(255,255,255,.025);transition:background .25s,opacity .35s,transform .4s var(--ease)}
.tl2:hover{background:var(--rowbg)}
.tl2.leave{opacity:0;transform:scale(.92)}
.tl2 .t1{display:flex;align-items:center;gap:8px;white-space:nowrap;min-width:0}
.tl2 .t1 .ic{flex:none;display:flex}
.tl2 .t1 .n{font-weight:500;overflow:hidden;text-overflow:ellipsis;min-width:0}
.tl2 .t2{margin-top:3px;font-size:11px;line-height:14px;color:var(--tx3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-left:25px}
.tl2 .t3{margin-top:6px;display:flex;align-items:center;gap:8px;padding-left:25px;font-size:11px;line-height:14px;color:var(--tx3);white-space:nowrap;overflow:hidden}
.tl2 .t3 span{display:flex;align-items:center;gap:3px}
.tl2.fin{background:rgba(255,255,255,.07)}
.tl2 .newp{flex:none}

/* ---------- Agents: Queue ---------- */
.focus{margin-top:24px}
.fc{position:relative;display:flex;align-items:center;gap:14px;height:60px;margin:0 -12px;padding:0 12px;border-radius:14px;transition:background .25s,opacity .35s,height .4s var(--ease)}
.fc:hover{background:rgba(255,255,255,.04)}
.fc+.fc{margin-top:4px}
.fc .fi{flex:none;width:32px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:50%;position:relative}
.fc .fi svg{width:28px;height:28px}
.fc .fi .pulse{position:absolute;right:-1px;top:-1px;width:9px;height:9px;border-radius:50%;background:#fff;box-shadow:0 0 0 2px #23232f}
.fc .ft{flex:1;min-width:0;overflow:hidden}
.fc .fn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fc .fn b{font-weight:600}
.fc .fs{font-size:11px;line-height:14px;color:var(--tx3);white-space:nowrap;margin-top:2px;overflow:hidden;text-overflow:ellipsis}
.fc .fb{display:flex;gap:6px;align-items:center}
.fc .fb .sec{opacity:0;transform:translateX(6px);transition:opacity .2s,transform .3s var(--ease)}
.fc:hover .fb .sec,.fc:focus-within .fb .sec{opacity:1;transform:none}
.calm{height:60px;display:flex;align-items:center;color:var(--tx3)}
.roster{display:grid;grid-template-columns:1fr 1fr;column-gap:36px;margin-top:28px}
.roster .rw{height:50px;margin:0 -8px}
.roster .rw .nm{display:flex;flex-direction:column;justify-content:center}
.roster .rw .nm .x{font-size:11px;line-height:14px}
.roster .more{display:flex;align-items:center;height:50px;color:var(--tx3);font-size:11px;line-height:14px;white-space:normal}
.hold{display:flex;gap:6px;align-items:center}
.hold span{display:flex;align-items:center;gap:2px;font-size:11px;color:var(--tx3)}
.stripb{margin-top:auto}
.strip{display:flex;gap:4px}
.strip i{flex:1 1 0;height:24px;border-radius:7px;transition:flex-grow .55s var(--ease),background .35s,box-shadow .35s,opacity .35s,margin .55s var(--ease)}
.strip i.sub{height:24px;flex-grow:.55}
.srow{display:flex;align-items:center;justify-content:space-between;margin-top:14px}

/* ---------- Apps ---------- */
.atop{display:flex;align-items:flex-start;gap:36px;height:184px}
.gauge{position:relative;flex:none;width:176px;height:176px}
.gauge svg{position:absolute;inset:0}
.gauge circle{fill:none;transition:stroke-dasharray .9s var(--ease),stroke-dashoffset .9s var(--ease),opacity .3s}
.gauge .ctr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.gauge .cap{margin-top:2px}
.aside{flex:1;min-width:0;padding-top:44px}
.aside .hd{max-width:none}
.btns{display:flex;gap:8px;margin-top:20px}
.aside .btns{flex-direction:column;align-items:flex-start;gap:6px}
.aside .btns .btn:not(.pri){background:none;padding-left:13px}
.aside .btns .btn:not(.pri):hover{background:var(--g1)}
.bar{position:relative;height:6px;border-radius:3px;background:var(--g1);overflow:hidden}
.bar i{position:absolute;top:0;bottom:0;border-radius:3px;transition:left .9s var(--ease),width .9s var(--ease),opacity .3s,box-shadow .3s}
.mh{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:8px;white-space:nowrap}
.mh .l{color:var(--tx2)}
.mem{margin-top:24px}
.rows{margin-top:18px}
.r-apps .st{width:128px}
.r-apps .v{width:56px}

/* ---------- Servers ---------- */
.badges{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;margin-top:auto;margin-left:-4px;margin-right:-4px}
.bd{display:flex;flex-direction:column;align-items:center;text-align:center;padding:10px 0 12px;border-radius:14px;transition:opacity .35s,background .25s,transform .4s var(--ease)}
.bd:hover{background:rgba(255,255,255,.04)}
.bd.leave{opacity:0;transform:scale(.85)}
.bd.nw{animation:arriveB 5s var(--ease)}
@keyframes arriveB{0%{opacity:0;transform:scale(.8)}10%{opacity:1;transform:none;background:color-mix(in srgb,var(--c) 18%,transparent)}100%{background:rgba(0,0,0,0)}}
.ringwrap{position:relative;width:58px;height:58px;border-radius:50%;transition:box-shadow .35s}
.ringwrap svg{position:absolute;inset:0}
.ringwrap circle{fill:none;transition:stroke-dashoffset .9s var(--ease),opacity .3s,stroke .35s}
.ringwrap .in{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:500;color:var(--tx2)}
.ringwrap .now{width:8px;height:8px;border-radius:50%;background:var(--c);box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 18%,transparent)}
.bd .p{margin-top:12px;font-weight:500}
.bd .k,.bd .o,.bd .cd{font-size:11px;line-height:14px;color:var(--tx3);white-space:nowrap}
.bd .o{margin-top:6px;color:var(--tx2);white-space:normal;max-width:66px;min-height:28px}
.bd .cd{color:var(--c)}
.bcap{margin-top:16px;padding:0 4px}
.sfoot{margin-top:auto;display:flex;align-items:flex-end;gap:28px}
.sfoot .mem2{flex:1;min-width:0}

/* ---------- Worktrees ---------- */
.wtop{display:flex;gap:24px;height:196px}
.wnum{flex:none;width:204px;display:flex;flex-direction:column}
.wnum .t{margin-top:8px;color:var(--tx2);white-space:normal}
.wnum .btn{margin-top:auto;align-self:flex-start}
.sky{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:flex-end}
.cols{display:flex;align-items:flex-end;gap:4px;height:140px}
.cols i{flex:1 1 0;border-radius:5px;transition:height .55s var(--ease),flex-grow .55s var(--ease),background .35s,opacity .35s,box-shadow .35s,margin .55s var(--ease)}
.cols i.z{flex-grow:.0001;margin-right:-4px;height:0!important}
.cols .gap{flex:none;width:8px}
.leg{display:flex;gap:14px;margin-top:12px}
.leg span{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--tx3);white-space:nowrap}
.leg i{width:9px;height:9px;border-radius:3px}
.hatch{background:repeating-linear-gradient(135deg,rgba(76,201,107,.55) 0 3px,rgba(76,201,107,.16) 3px 6px)!important}
.r-trees{margin-top:32px}
.r-trees .st{width:150px}
.r-trees .v2{width:40px}

/* ---------- Disk ---------- */
.zoom{position:relative;height:372px;margin-top:28px}
.zoom .col{position:absolute;top:0;width:52px;height:372px;border-radius:12px;background:var(--g1);overflow:hidden}
.zoom .col i{position:absolute;left:0;right:0;transition:top .6s var(--ease),height .6s var(--ease),background .35s,opacity .35s,box-shadow .35s}

.zoom .lab .nm .x{font-size:11px;line-height:14px}

.zcap{display:flex;margin-top:12px}

.dfoot{margin-top:auto;display:flex;align-items:center;gap:16px;padding-left:196px}
.dfoot.dk{flex-direction:column;align-items:flex-start;gap:8px;padding-left:196px}

/* hover card */
.card{position:absolute;z-index:8;width:268px;padding:14px 14px 10px;border-radius:16px;background:#2c2c3a;border:1px solid rgba(255,255,255,.1);box-shadow:0 18px 50px rgba(0,0,0,.4);opacity:0;transform:translateY(4px);pointer-events:none;transition:opacity .18s,transform .25s var(--ease)}
.card.show{opacity:1;transform:none;pointer-events:auto}
.card .ct{font-weight:600}
.card .cs{margin-top:2px;font-size:11px;line-height:14px}

.card .cf span:nth-child(odd){color:var(--tx3)}
.card .cf span:nth-child(even){color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .ca{margin-top:10px;padding-top:6px;border-top:1px solid var(--line);display:flex;flex-direction:column}

.card .ca button .tl{color:var(--tx3);font-size:11px}
.card .ca button.dis{color:var(--tx3);pointer-events:none}

/* result preview for section buttons: what goes, what stays */
.pv{position:absolute;z-index:9;width:280px;padding:10px 12px;border-radius:12px;background:rgba(48,48,62,.98);border:1px solid rgba(255,255,255,.1);box-shadow:0 14px 40px rgba(0,0,0,.4);font-size:11px;line-height:15px;color:var(--tx2);white-space:normal;opacity:0;transform:translateY(4px);pointer-events:none;transition:opacity .18s,transform .25s var(--ease)}
.pv.show{opacity:1;transform:none}

.pv .pg{display:block}
.pv .pg+.pg{margin-top:4px}

.drawer{position:absolute;top:0;right:0;bottom:0;width:276px;padding:0 24px 22px;background:rgba(36,36,48,.92);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-left:1px solid rgba(255,255,255,.08);box-shadow:-24px 0 60px rgba(6,4,24,.28);transform:translateX(102%);transition:transform .6s var(--ease);display:flex;flex-direction:column;z-index:6}

.mlist{position:relative;margin-top:4px}
.md{display:block;width:100%;height:76px;padding:4px 0 0 18px;transition:opacity .3s}
.md .mw{display:block;font-size:22px;line-height:28px;font-weight:600;letter-spacing:-.02em;color:var(--tx3);transition:color .3s}

.md[aria-checked="true"] .mw{color:var(--tx)}
.md[aria-checked="true"] .mt{color:var(--tx2)}
.mbar{position:absolute;left:0;top:6px;width:3px;height:60px;border-radius:2px;background:var(--c);transition:transform .45s var(--ease),background .35s}
.vl{margin-top:20px;transition:opacity .3s}
.vl.dim{opacity:.3;pointer-events:none}
.ruler{position:relative;height:6px;margin:12px 0 0;border-radius:3px;background:var(--g1)}
.ruler .fill{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--c);opacity:.7;transition:width .45s var(--ease)}
.ruler .tk{position:absolute;top:-5px;width:2px;height:16px;margin-left:-1px;border-radius:1px;background:#fff;transition:left .45s var(--ease)}
.ruler .st{position:absolute;top:2px;width:2px;height:2px;margin-left:-1px;border-radius:1px;background:var(--g3)}
.rlab{position:relative;height:28px}
.rlab button{position:absolute;top:8px;transform:translateX(-50%);font-size:13px;color:var(--tx3);white-space:nowrap;transition:color .25s}
.rlab button:hover{color:var(--tx2)}
.rlab button[aria-checked="true"]{color:var(--tx);font-weight:500}
.rule{margin-top:16px;font-size:11px;line-height:15px;color:var(--tx3)}
.touch{margin-top:14px;padding-top:14px;border-top:1px solid var(--line);display:flex;gap:10px;color:var(--tx2)}
.touch .mk{flex:none;width:7px;height:7px;border-radius:50%;margin-top:6px}
.glob{margin-top:auto;padding-top:14px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:12px}
.sw{display:flex;align-items:center;justify-content:space-between;color:var(--tx2);white-space:nowrap;transition:color .2s}
.sw i{width:30px;height:18px;border-radius:9px;background:rgba(255,255,255,.14);position:relative;transition:background .25s;flex:none}
.sw i::after{content:"";position:absolute;left:2px;top:2px;width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .25s var(--ease)}
.sw[aria-checked="true"]{color:var(--tx)}
.sw[aria-checked="true"] i{background:#5B9BFF}
.sw[aria-checked="true"] i::after{transform:translateX(12px)}

/* toast */
.toast{position:absolute;left:20px;top:8px;display:flex;align-items:center;gap:14px;min-height:40px;max-width:540px;padding:6px 6px 6px 16px;border-radius:20px;background:rgba(52,52,66,.97);border:1px solid rgba(255,255,255,.1);box-shadow:0 14px 40px rgba(0,0,0,.35);color:var(--tx2);opacity:0;transform:translateY(-6px);pointer-events:none;transition:opacity .3s,transform .4s var(--ease);z-index:9}

/* live simulation control, outside the product */

/* what the setting touches now, per section */
function affected(s){
  if(!s.mode) return [];
  const t=thr(s);
  if(s.id==='ws') return ready().filter(w=>mergedAgo(w)>=t).map(w=>w.id);
  if(s.id==='agents') return waiting().filter(a=>age(a)>=t).map(a=>a.id);
  if(s.id==='apps') return noise().map(a=>a.id);
  if(s.id==='servers') return idleSrv().filter(x=>idleOf(x)>=t).map(x=>x.id);
  if(s.id==='trees') return merged().filter(w=>treeAge(w)>=t).map(w=>w.id);

}

  if(s.id==='trees'){const c=merged().filter(w=>!has(w.id,'spared')).map(w=>({o:w,m:t-treeAge(w)})).sort((a,b)=>a.m-b.m);return c[0]?{l:'removes '+c[0].o.n,o:c[0].o,m:Math.max(0,c[0].m)}:null}
  if(s.id==='agents'){const c=waiting().filter(a=>!has(a.id,'fwd')).map(a=>({o:a,m:t-age(a)})).sort((a,b)=>a.m-b.m);return c[0]?{l:'brings '+c[0].o.n+' forward',o:c[0].o,m:Math.max(0,c[0].m)}:null}

  return null;
}

const AUTOW={

function modeText(s,i){

}
const RULE={

  agents:'An agent waits when it asks you something, like lexicon-judge does now.',
  apps:'Noise is Chrome\'s noise tabs and apps on the close list. Work apps and anything an agent drives stay.',
  servers:'Unused means no request reached it. Servers an agent is using stay.',

/* the live line in the drawer, plain text (it ticks) */
function nextText(s){

  if(s.id==='apps'){const L=LOAD(),x=noise().map(a=>a.n.replace('Google ',''));return x.length?`Load is ${L} % now. ${auto?'Auto quits':'Ask shows a button for'} ${and(x)} once it passes ${thr(s)} %.`:`Load is ${L} %. No noise apps are open.`}
  if(s.id==='disk'){const g=sum(safeDK(),d=>d.gb);return g?(auto?`Next: Auto cleans ${fmt(g)} ${s.v===0?'tonight':s.v===1?'on Sunday':'on 1 Nov'}, in ${dur(n.m)}.`:`${fmt(g)} is safe to clean. Nothing happens until you press.`):'Nothing safe is left to clean.'}
  if(!auto){
    if(s.id==='ws') return A.length?`${A.length} ready · ${fmt(sum(A.map(i=>byId[i]),wsFree))}. Wrap Up waits for your press.`:'Nothing is ready that long.';
    if(s.id==='agents') return A.length?`${byId[A[0]].n} has waited ${dur(age(byId[A[0]]))}. Its dot shows in the menu bar.`:'Nobody has waited that long.';
    if(s.id==='servers') return A.length?`${A.length} unused for ${s.vals[s.v]} or more. Each waits for your press.`:'No server is unused that long.';
    if(s.id==='trees') return A.length?`${A.length} merged ${s.vals[s.v]} ago or more. Each waits for your press.`:'Nothing was merged that long ago.';
  }
  const sp={ws:ready(),servers:idleSrv(),trees:merged(),agents:[]}[s.id].filter(x=>has(x.id,'spared')).map(x=>x.p||x.n);
  const tail=sp.length?` ${and(sp)} stay${sp.length>1?'':'s'}, you undid ${sp.length>1?'them':'it'}.`:'';
  if(!n) return 'Nothing is coming up.'+tail;
  return (n.m<=0?`Auto ${n.l} now.`:`Next: Auto ${n.l} in ${durC(n.m)}.`)+tail;
}
function markNext(s){

/* ---------- actions ---------- */
const A=(a,l,tl,dis,id)=>({a,l,tl,dis,id});
function acts(kind,o){
  if(kind==='ws'){
    const r=[], sv=wsSrv(o);
    if(o.st==='r') r.push(A('wrapws','Wrap Up',fmt(wsFree(o))));
    else r.push(A('','Wrap Up',o.id==='ws-med'&&TESTS?'tests running':o.block,1));
    if(o.ag&&!gone(o.ag)) r.push(A('nav','Go to Tab','',0,o.ag));
    if(o.pr) r.push(A('openpr','Open PR',o.st==='r'?'#'+o.pr.n:''));
    if(sv.length&&o.st!=='r') r.push(A('stopws','Stop Servers',fmt(wsMem(o))));
    if(o.st==='r'&&!has(o.id,'keep')) r.push(A('keep','Keep'));
    if(wsTree(o)) r.push(A('editor','Open in Editor'));
    return r;
  }
  if(kind==='agent'){
    const r=[];
    if(o.st==='f') r.push(A('wrap','Wrap Up',fmt(agHeld(o.id))));
    r.push(A('nav','Go to Tab'));
    if(o.ws) r.push(A('gows','Workstream','',0,o.ws));
    if(o.st!=='f'&&agServers(o.id).length) r.push(A('stopall','Stop Its Servers'));
    return r;
  }
  if(kind==='app'){
    if(o.cls==='spared') return [A('','Quit','Playwright drives it',1)];
    const r=[A('quit','Quit',fmt(memOf(o)))];
    if(o.id==='chrome'&&!has('chrome','trim')) r.push(A('trim','Trim Tabs','14'));
    if(isNoise(o)) r.push(A('keep','Keep'));
    else if(o.cls==='unsorted') r.push(A('list','Move to Close List'));
    return r;
  }
  if(kind==='srv'){
    if(o.kept) return [A('open','Open in Browser'),A('','Stop','Docker runs it',1)];
    const r=[A('stop','Stop',fmt(o.mb/1000)),A('open','Open in Browser')];
    if(o.ws) r.push(A('gows','Workstream',byId[o.ws].n,0,o.ws));
    if(o.idle&&!has(o.id,'keep')) r.push(A('keep','Keep'));
    return r;
  }
  if(kind==='wt'){
    if(o.id==='wt-bp7') return [A('','Remove','1 commit not in main',1),A('commit','Show Commit'),A('editor','Open in Editor')];
    if(o.k==='u'||o.k==='f') return [A('finder','Show in Finder'),A('editor','Open in Editor')].concat(o.ws?[A('gows','Workstream',byId[o.ws].n,0,o.ws)]:[]);
    const r=[A('rmtree','Remove',o.id==='wt-bp8'?'bundle saved':fmt(o.gb)),A('finder','Show in Finder')];
    if(o.ws) r.push(A('gows','Workstream','',0,o.ws));
    if(o.k==='m'&&!has(o.id,'keep')) r.push(A('keep','Keep'));
    return r;
  }
  if(kind==='dk'){
    if(o.rep) return [A('finder','Show in Finder'),A('','Clean','report only',1)];
    const r=[A('clean','Clean',fmt(o.gb))];
    if(o.safe&&!has(o.id,'keep')) r.push(A('keep','Keep'));
    r.push(A('finder','Show in Finder'));
    return r;
  }
  return [];
}
const abtn=(x,id)=>x.dis?`<span class="ab dis">${x.l}<span class="tl">${x.tl}</span></span>`:`<button class="ab" data-act="${x.a}" data-id="${x.id||id}">${x.l}${x.tl?`<span class="tl">${x.tl}</span>`:''}</button>`;

function runAct(a,id){

  if(info[a]){ if(a==='nav'&&o.st==='n') commit(info[a],()=>{fl(id).seen=1},[id]); else toast(info[a],false); return }
  const M={

    rmtree:()=>[`Moved <b>${name}</b> to the Trash${o.id==='wt-bp8'?', a git bundle saved':''}${o.srv&&!gone(o.srv)?', stopped '+byId[o.srv].p:''}.`,()=>{fl(id).gone=1;if(o.srv)fl(o.srv).gone=1},[id].concat(o.srv?[o.srv]:[])],
    clean:()=>[o.tool?`${o.tool} cleaned its own <b>${o.n}</b>, ${fmt(o.gb)}.`:`Moved <b>${o.n}</b> to the Trash, ${fmt(o.gb)}.`,()=>{fl(id).gone=1},[id]],

    wrap:()=>{const w=byId[o.ws];return [wrapMsg(w),()=>wrapWs(w.id),wsLeave(w).concat([id])]},
    wrapws:()=>[wrapMsg(o),()=>wrapWs(id),wsLeave(o)],
    stopws:()=>{const s=wsSrv(o);return [`Stopped ${s.map(x=>'<b>'+x.p+'</b>').join(' and ')} for ${o.n}, freed ${fmt(wsMem(o))}.`,()=>s.forEach(x=>fl(x.id).gone=1),s.map(x=>x.id)]}
  };

/* ---------- live DOM: patch in place when only numbers and timers moved, else ease-swap ---------- */
function swap(el,html){
  const old={};el.querySelectorAll('[data-a]').forEach(n=>old[n.dataset.a]=n.getAttribute('style')||'');
  const oldN={};el.querySelectorAll('[data-n]').forEach(n=>oldN[n.dataset.n]=+n.dataset.v);
  el.innerHTML=html;
  if(RM) return;
  const todo=[];
  el.querySelectorAll('[data-a]').forEach(n=>{const k=n.dataset.a;if(k in old){const nu=n.getAttribute('style')||'';if(nu!==old[k]){n.setAttribute('style',old[k]+';transition:none');todo.push([n,nu])}}});
  if(todo.length){el.offsetWidth;todo.forEach(([n,nu])=>n.setAttribute('style',nu))}
  el.querySelectorAll('[data-n]').forEach(n=>{const k=n.dataset.n;if(k in oldN&&oldN[k]!==+n.dataset.v)tween(n,oldN[k],+n.dataset.v,+n.dataset.d||0)});
}
function tween(n,a,b,d){const t0=performance.now(),D=700;const st=t=>{const p=Math.min(1,(t-t0)/D),e=1-Math.pow(1-p,3);n.textContent=(a+(b-a)*e).toFixed(d);if(p<1)requestAnimationFrame(st);else n.textContent=n.dataset.txt||b.toFixed(d)};requestAnimationFrame(st)}
const num=(k,v,d,txt)=>`<span data-n="${k}" data-v="${v}" data-d="${d||0}" data-txt="${txt||''}">${txt||v.toFixed(d||0)}</span>`;
const gnum=(k,gb)=>{const t=fN(gb),u=fU(gb);return `${num(k,u==='MB'?Math.round(gb*1000):gb,u==='MB'?0:(t.split('.')[1]||'').length,t)}<u>${u}</u>`};
const tk=(txt,cls,style)=>`<span data-tk${cls?` class="${cls}"`:''}${style?` style="${style}"`:''}>${txt}</span>`;
const SWAPS={n:0};
function sig(h){return h.replace(/ style="[^"]*"/g,'').replace(/ data-(v|txt)="[^"]*"/g,'').replace(/(<[^>]+data-(?:tk|n)[ =>][^>]*>)[^<]*/g,'$1')}
function put(el,html,force){
  const s=sig(html);
  if(!force&&el._sig===s){patch(el,html);return false}
  el._sig=s; SWAPS.n++; swap(el,html); return true;
}
function patch(el,html){
  const tmp=document.createElement('div');tmp.innerHTML=html;
  const a=el.querySelectorAll('*'),b=tmp.querySelectorAll('*');
  if(a.length!==b.length){el._sig=null;put(el,html,true);return}
  for(let i=0;i<b.length;i++){
    const o=a[i],n=b[i];
    const ns=n.getAttribute('style'),os=o.getAttribute('style');
    if(ns!==os){if(ns===null)o.removeAttribute('style');else o.setAttribute('style',ns)}
    if(n.hasAttribute('data-tk')&&o.innerHTML!==n.innerHTML) o.innerHTML=n.innerHTML;
    if(n.hasAttribute('data-n')){const x=+o.dataset.v,y=+n.dataset.v;o.dataset.txt=n.dataset.txt;if(x!==y){o.dataset.v=y;if(RM)o.textContent=n.textContent;else tween(o,x,y,+n.dataset.d||0)}}
  }
}

function sig(h){return h.replace(/<[^>]*\sdata-g[\s>=][^>]*>/g,'<G>').replace(/ style="[^"]*"/g,'').replace(/ data-(v|txt)="[^"]*"/g,'').replace(/(<[^>]+data-(?:tk|n)[ =>][^>]*>)[^<]*/g,'$1')}
function patch(el,html){
  const tmp=document.createElement('div');tmp.innerHTML=html;
  const a=el.querySelectorAll('*'),b=tmp.querySelectorAll('*');

/* ---------- servers: one hour of memory per server, one sample per tick (0.1 simulated min) ---------- */
const HN=600;
const SORD=['s5432','s3000','s5173','s5174','s4100','s3334','s4000','s6006'];   /* stack, bottom to top */
const BORD=['s3000','s5173','s5174','s4100','s3334','s4000','s6006','s5432'];   /* bar, left to right */
const SHADE={s3000:.82,s5173:.56,s5174:.42,s4100:.68};
const RATE={s3000:14,s5173:8,s5174:4,s4100:5};
const SMAX=2800;
const HS={},RQ={},SWK={};
let TK=0;
function poisson(l){const L=Math.exp(-l);let k=0,p=1;do{k++;p*=Math.random()}while(p>L);return k-1}
function initHist(){
  SORD.forEach(id=>{const x=byId[id];HS[id]=[];RQ[id]=[];let w=0;
    for(let k=0;k<HN;k++){const ago=(HN-1-k)/10;let v,r=0;
      if(SIMG.has(id)) v=0;
      else if(x.use||(x.idle!=null&&x.idle-ago<0)){w=Math.max(-.05,Math.min(.05,w*.985+(Math.random()-.5)*.006));r=x.use?poisson(RATE[id]/10):0;v=x.mb*(1+w+.025*Math.sin(k/37+id.length))}
      else v=x.mb;
      HS[id].push(v);RQ[id].push(r)}
    SWK[id]=w});
}
function sampleSrv(){
  TK++;
  SORD.forEach(id=>{const x=byId[id],h=HS[id],on=!gone(id);
    const r=on&&x.use?poisson(RATE[id]/10):0;
    if(x.use) SWK[id]=Math.max(-.05,Math.min(.06,SWK[id]*.985+(Math.random()-.5)*.006+r*.003));
    const tg=on?(x.use?x.mb*(1+SWK[id]+.025*Math.sin((HN+TK)/37+id.length)):x.mb):0;
    const l=h[HN-1],v=l+(tg-l)*.16;
    h.push(v<2?0:v);h.shift();RQ[id].push(r);RQ[id].shift()});
}
const curMB=id=>HS[id][HN-1];
const rpm=id=>RQ[id].slice(-10).reduce((a,b)=>a+b,0);
const GRAY=[255,255,255,.15],CORAL=[255,122,92,.95];
const rgba=c=>`rgba(${Math.round(c[0])},${Math.round(c[1])},${Math.round(c[2])},${c[3].toFixed(3)})`;
function idleFrac(min){const s=sec('servers');return s.mode?Math.max(0,Math.min(1,min/thr(s))):0}
function idleColor(min){const e=Math.pow(idleFrac(min),1.7);return rgba(GRAY.map((g,i)=>g+(CORAL[i]-g)*e))}
const USE=id=>`rgba(63,208,184,${SHADE[id]||.5})`;
function colAt(x,ago){
  if(x.kept) return 'rgba(255,255,255,.1)';
  if(x.use) return USE(x.id);
  const i=idleOf(x)-ago;
  if(i<0) return 'rgba(63,208,184,.5)';
  if(has(x.id,'keep')) return 'rgba(255,255,255,.16)';
  return idleColor(i);
}
const colNow=x=>colAt(x,0);
/* plain words for one server, right now */
function srvState(x){
  const s=sec('servers'),t=thr(s);
  if(x.kept) return ['kept, Docker runs it','var(--tx3)'];
  if(x.use) return [`in use · ${rpm(x.id)} req/min`,'var(--tx3)'];

  if(has(x.id,'keep')) return [`idle ${d} · you kept it`,'var(--tx3)'];
  if(!s.mode) return ['idle '+d,'var(--tx3)'];
  const f=idleFrac(i),c=f>.55?'#FF8E72':'var(--tx3)';
  if(i>=t) return [s.mode===2&&!has(x.id,'spared')?`idle ${d} · stops now`:`idle ${d}, past ${s.vals[s.v]}`,c];
  return [`idle ${d} of ${s.vals[s.v]}`,c];
}
function srvLine(){

  if(!i.length) return 'Every server is in use. Nothing sits idle.';

/* a: stacked area of the last hour */
function fServersA(){
  const GH=240,VW=300,sc=GH/SMAX;
  let base=new Array(HN).fill(0);const bands=[];
  const pick=[];for(let k=0;k<HN;k++){if(k===0||k===HN-1||(TK+k)%3===0)pick.push(k)}
  const X=k=>(k/(HN-1)*VW).toFixed(2),Y=v=>(GH-v*sc).toFixed(2);
  SORD.forEach(id=>{const h=HS[id];if(!h.some(v=>v>1))return;const x=byId[id];
    const top=base.map((b,k)=>b+h[k]);
    const d='M'+pick.map(k=>X(k)+' '+Y(top[k])).join('L')+'L'+pick.slice().reverse().map(k=>X(k)+' '+Y(base[k])).join('L')+'Z';
    let ks=-1;if(gone(id)){for(let k=HN-1;k>=0;k--)if(h[k]>5){ks=k;break}}
    bands.push({id,x,d,t:GH-top[HN-1]*sc,b:GH-base[HN-1]*sc,on:!gone(id)&&h[HN-1]>5,ks,ky:ks>=0?GH-(base[ks]+h[ks]/2)*sc:0});
    base=top});
  const grad=b=>{const x=b.x;let o=0,c1=null,c2=null;
    if(!x.use&&!x.kept){const iN=idleOf(x);if(iN<60){o=(60-iN)/60;c1='rgba(63,208,184,.5)';c2=has(x.id,'keep')?'rgba(255,255,255,.16)':idleColor(0)}}
    const st=[];for(let j=0;j<=8;j++)st.push([j/8,colAt(x,60*(1-j/8))]);
    const all=c1?st.filter(q=>q[0]<o).concat([[o,c1],[o,c2]],st.filter(q=>q[0]>=o)):[[0,st[0][1]],[0,st[0][1]]].concat(st);
    return `<linearGradient id="g47${b.id}" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="${VW}" y2="0">${all.map(q=>`<stop data-g offset="${q[0].toFixed(4)}" stop-color="${q[1]}"/>`).join('')}</linearGradient>`};
  const paths=bands.map(b=>`<path data-g data-t="${b.id}" data-card="srv:${b.id}" data-leave="${b.id}" d="${b.d}" fill="url(#g47${b.id})"/>`).join('');
  const LH=30,Lb=bands.filter(b=>b.on).map(b=>({b,c:(b.t+b.b)/2})).sort((p,q)=>p.c-q.c);
  let last=-1e9;Lb.forEach(l=>{l.y=Math.max(l.c-LH/2,last+LH);last=l.y});
  const over=Lb.length?Lb[Lb.length-1].y+LH-GH:0;if(over>0)Lb.forEach(l=>l.y-=over);
  for(let k=Lb.length-2;k>=0;k--)if(Lb[k].y>Lb[k+1].y-LH)Lb[k].y=Lb[k+1].y-LH;
  const leads=`<svg class="sgl" width="14" height="${GH}" viewBox="0 0 14 ${GH}" style="overflow:visible">${Lb.map(l=>`<path data-g d="M0 ${l.c.toFixed(1)}C7 ${l.c.toFixed(1)} 7 ${(l.y+LH/2).toFixed(1)} 14 ${(l.y+LH/2).toFixed(1)}" fill="none" stroke="rgba(255,255,255,.16)"/>`).join('')}</svg>`;
  const labs=Lb.map(l=>{const x=l.b.x,[st,sc2]=srvState(x),mb=x.use?curMB(x.id):x.mb;
    return `<div class="sl" data-lab="${x.id}" data-t="${x.id}" data-card="srv:${x.id}" data-leave="${x.id}" style="top:${l.y.toFixed(1)}px"><div class="sl1"><span><b>${x.p}</b> ${x.k}${isNew(x.id)?' <span class="newp" style="--c:'+C.servers+'">New</span>':''}</span>${tk(fmt(Math.round(mb)/1000),'sv')}</div>${tk(st,'sl2','color:'+sc2)}</div>`}).join('');
  const pulses=bands.filter(b=>b.on&&b.x.use).map(b=>{const hit=RQ[b.id][HN-1]>0;return `<i class="pls" style="top:${b.t.toFixed(1)}px;opacity:${hit?1:0};transition:${hit?'none':'opacity 1.4s, top .5s'}"></i>`}).join('');
  const tags=bands.filter(b=>b.ks>=0&&b.ks<HN-8).map(b=>`<span class="stag" style="left:${(b.ks/(HN-1)*100).toFixed(2)}%;top:${b.ky.toFixed(1)}px">${b.x.p} stopped</span>`).join('');
  return `<div class="f" style="--c:${C.servers}">
    ${srvTop()}
    <div class="sg" style="height:${GH}px"><div class="sga">${tags}<svg viewBox="0 0 ${VW} ${GH}" preserveAspectRatio="none" height="${GH}" aria-label="Memory per server, last hour"><defs>${bands.map(grad).join('')}</defs>${paths}</svg>${pulses}</div>${leads}<div class="sgr">${labs}</div></div>

    <div class="sfoot2"><p class="cap">${srvCap()}</p>${saBtn('idle',1)}</div>

const IDXL={ws:'workstreams',agents:'agents',apps:'load',servers:'servers',trees:'worktrees',disk:'to clean'};
function idxVal(s){
  if(s.id==='ws') return [WS.filter(w=>!gone(w.id)).length,0,''];
  if(s.id==='agents') return [AG.filter(a=>!gone(a.id)).length,0,''];
  if(s.id==='apps') return [LOAD(),0,'%'];
  if(s.id==='servers') return [live(SRV).length,0,''];
  if(s.id==='trees') return [WT.filter(w=>!gone(w.id)).length,0,''];
  const g=sum(DK.filter(d=>!gone(d.id)),d=>d.gb);return g>=10?[Math.round(g),0,'GB']:[g,1,'GB'];
}
function idxHTML(){
  return S.map(s=>{const [v,d,u]=idxVal(s),m=s.mode;
    return `<button class="nx${s.id===sel?' sel':''}" data-sec="${s.id}" role="tab" aria-selected="${s.id===sel}" aria-label="${s.name}, ${MODES[m]}">
      <span class="n">${num('ix'+s.id,v,d)}${u?`<u>${u}</u>`:''}</span>

}

/* ---------- Workstreams: Spotlight, small ---------- */
function wsCard(w){
  const a=w.ag&&byId[w.ag], s=sec('ws'), sv=wsSrv(w), t=wsTree(w), kept=has(w.id,'keep');
  const n=s.mode===2&&!kept&&!has(w.id,'spared')?Math.max(0,thr(s)-mergedAgo(w)):null;
  const foot=kept?'kept':s.mode!==2?'':has(w.id,'spared')?'Auto leaves it':n<=0?'Auto now':'Auto in '+durC(n);
  const rows=[...sv.map(x=>`<div class="wc-r"><span class="gi">${gl('servers',C.servers,13)}</span><span class="tx">${x.p} ${x.k}</span><span class="vv">${fmt(x.mb/1000)}</span></div>`),
    t?`<div class="wc-r"><span class="gi">${gl('trees',C.trees,13)}</span><span class="tx">${w.br}</span><span class="vv">${fmt(t.gb)}</span></div>`:''].join('');
  return `<div class="wc${kept?' kept':''}${isNew(w.id)?' nw':''}" data-t="${w.id}" data-leave="${w.id}" style="--c:${C.ws}">
    <div class="wc-h"><span class="wc-t"><b>${w.n}</b>${tk('#'+w.pr.n+' merged '+dur(mergedAgo(w))+' ago','x')}</span>${tk(foot,'wc-s'+(s.mode===2&&!kept?' auto':''))}</div>
    <div class="wc-l">${rows}</div>
    <div class="wc-f"><button class="btn pri" style="--c:${C.ws}" data-act="wrapws" data-id="${w.id}">Wrap Up<span class="tl">${fmt(wsFree(w))}</span></button></div></div>`;
}
function wsTile(w){
  const a=byId[w.ag];
  const stg=isFin(w.id)?['finished','var(--tx)']:w.st==='n'?['needs you '+dur(age(a)),'var(--tx)']:w.st==='i'?['idle '+dur(age(a)),'var(--tx3)']:w.id==='ws-med'?[TESTS?'tests running':'tests passed',TESTS?'var(--tx2)':C.trees]:['working '+dur(age(a)),'var(--tx2)'];
  return `<div class="tl2${isNew(w.id)?' nw':''}${isFin(w.id)?' fin':''}" data-t="${w.id}" data-leave="${w.id}" data-card="ws:${w.id}" style="--c:${C.ws}">
    <div class="t1"><span class="ic">${ICON[a.t]}</span><span class="n">${w.n}</span>${newp(w.id)}</div>
    ${tk(stg[0]+(w.id==='ws-s3'?' · +'+SUBS.length:''),'t2','color:'+stg[1])}</div>`;
}
function fWS(){
  const r=WS.filter(w=>w.st==='r'&&!gone(w.id)), rf=sum(ready(),wsFree), s=sec('ws');
  const g=['n','w','i'].flatMap(k=>WS.filter(w=>w.st===k&&!gone(w.id)));
  const hd=ready().length?`${NUMW(ready().length)} workstream${ready().length>1?'s are':' is'} done.<br><span class="s">${s.mode===2?'Auto wraps them up and tells you.':'Wrap Up gives back '+fmt(rf)+'.'}</span>`
    :`Nothing is left to wrap up.<br><span class="s">${going().length} workstreams are going.</span>`;
  const nows=[!gone('s6006')&&`<span class="lk" data-sec="servers">:6006</span>`,!gone('wt-bp8')&&`<span class="lk" data-sec="trees">bp8-sweep-studio403</span>`,!gone('dk-dd')&&`<span class="lk" data-sec="disk">DerivedData</span>`].filter(Boolean);
  return `<div class="f" style="--c:${C.ws}">
    <p class="hd one">${hd}</p>

    <div class="cards">${r.map(wsCard).join('')||'<div class="calm2" style="height:110px">Nothing is done yet. Finished work lands here, with its Wrap Up.</div>'}</div>
    <div class="sp-h2"><span class="cap"><b style="color:var(--tx)">Still going</b> · ${g.filter(w=>!isFin(w.id)).length}</span>${nows.length?`<span class="nows2">No workstream: ${nows.join(', ')}</span>`:''}</div>
    <div class="tiles">${g.map(wsTile).join('')}</div>

/* ---------- Agents ---------- */
function fAgents(){
  const need=waiting(), fin=finished(), W=holders().length;
  const hd=need.length?`<b>${need[0].n}</b> is waiting for you.<br><span class="s">${W} others are working.</span>`:`Nobody is waiting for you.<br><span class="s">${W} agents are working.</span>`;
  const focus=[...need.map(a=>`<div class="fc" data-t="${a.id}" data-leave="${a.id}"><span class="fi">${ICON[a.t]}<i class="pulse"></i></span><div class="ft"><div class="fn"><b>${a.n}</b> <span style="color:var(--tx2)">asks “${a.q}”</span></div><div class="fs">${WHERE(a)} · ${tk('waiting '+dur(age(a)))}</div></div><div class="fb"><button class="btn pri" style="--c:#fff" data-act="nav" data-id="${a.id}">Go to Tab</button></div></div>`),
    ...fin.map(a=>{const s=agServers(a.id),t=agTree(a.id);return `<div class="fc" data-t="${a.id}" data-leave="${a.id}"><span class="fi">${ICON[a.t]}</span><div class="ft"><div class="fn"><b>${a.n}</b> ${tk('finished '+dur(age(a))+' ago','','color:'+C.agents)}</div><div class="fs">${WHERE(a)} · holds ${[...s.map(x=>x.p),...(t?[t.n]:[])].join(' and ')||'nothing'}</div></div><div class="fb"><button class="btn pri" style="--c:${C.agents}" data-act="wrap" data-id="${a.id}">Wrap Up<span class="tl">${fmt(agHeld(a.id))}</span></button></div></div>`})];
  const rest=named().filter(a=>a.st!=='f'&&!(a.st==='n'&&!has(a.id,'seen')));
  const st=a=>isFin(a.id)?'finished':a.st==='w'?(a.id==='media'&&TESTS?'tests running':'working '+dur(age(a))):a.st==='n'?'needs you '+dur(age(a)):'idle '+dur(age(a));
  const roster=rest.map(a=>`<div class="rw${a.st==='i'?' dim':''}${isNew(a.id)?' nw':''}${isFin(a.id)?' fin':''}" data-t="${a.id}" data-leave="${a.id}" style="--c:${C.agents}"><span class="ic">${ICON[a.t]}</span><span class="nm"><span>${a.n}${newp(a.id)}</span>${tk(st(a)+(a.id==='speed3'?' · '+SUBS.length+' subagents':' · '+(a.w==='app'?'Codex app':a.w)),'x')}</span><span class="meta">${holdMarks(a)}</span>${actsHTML('agent',a,2)}</div>`).join('')
    +`<div class="more">5 more idle over 1 h,<br>holding nothing</div>`;
  const L=stripList();
  const cnt={w:holders().length,s:SUBS.filter(x=>!isFin(x)).length,n:waiting().length,i:named().filter(a=>a.st==='i').length+5,f:finished().length};
  const strip=L.map(x=>`<i data-a="sa${x.id}" data-t="${x.id}" class="${x.sub?'sub ':''}${isNew(x.id)?'nwc':''}" style="background:${x.bg};box-shadow:${x.sh}"></i>`).join('');
  return `<div class="f" style="--c:${C.agents}">
    <p class="hd">${hd}</p>
    <div class="focus">${focus.join('')||'<div class="calm">Nothing needs you. Every finished agent is wrapped up.</div>'}</div>
    <div class="roster">${roster}</div>
    <div class="stripb"><p class="cap"><b>${cnt.w}</b> working · <b>${cnt.s}</b> subagents · <b>${cnt.n}</b> needs you · <b>${cnt.i}</b> idle · <b>${cnt.f}</b> finished</p><div class="strip">${strip}</div></div>
  </div>`;
}

/* ---------- Apps ---------- */
function fApps(){
  const L=LOAD(),n=noise(),nc=sum(n,cpuOf),nm2=sum(n,memOf),M=MEM(),s=sec('apps');
  const ch=APPS.find(a=>a.id==='chrome');
  let hd;
  if(!gone('chrome')&&isNoise(ch)&&!has('chrome','trim')) hd=`Chrome holds 8.7 GB.<br><span class="s">14 of its tabs are noise.</span>`;
  else if(n.length) hd=`${n.map(a=>a.n.replace('Google ','')).join(' and ')} ${n.length>1?'are':'is'} noise.<br><span class="s">${fmt(nm2)} to free.</span>`;
  else hd=`Only work is running.<br><span class="s">Nothing is noise.</span>`;
  const GS=V==='a'?132:120,R=GS/2-8,M2=GS/2;
  const gauge=`<div class="gauge"><svg viewBox="0 0 ${GS} ${GS}" width="${GS}" height="${GS}"><circle cx="${M2}" cy="${M2}" r="${R}" stroke="var(--g1)" stroke-width="9"/>
    <circle data-a="gt" cx="${M2}" cy="${M2}" r="${R}" stroke="rgba(255,255,255,.6)" stroke-width="11" pathLength="100" transform="rotate(-90 ${M2} ${M2})" style="stroke-dasharray:.7 100;stroke-dashoffset:${-thr(s)};opacity:${s.mode?1:0}"/>
    <circle data-a="gk" data-t="cpu-kept" cx="${M2}" cy="${M2}" r="${R}" stroke="var(--g3)" stroke-width="9" stroke-linecap="round" pathLength="100" transform="rotate(-90 ${M2} ${M2})" style="stroke-dasharray:${Math.max(0,L-nc-1)} 100"/>
    <circle data-a="gn" data-t="cpu-noise" cx="${M2}" cy="${M2}" r="${R}" stroke="${C.apps}" stroke-width="9" stroke-linecap="round" pathLength="100" transform="rotate(-90 ${M2} ${M2})" style="stroke-dasharray:${Math.max(0,nc-1)} 100;stroke-dashoffset:${-(L-nc)};opacity:${nc?1:0}"/></svg>
    <div class="ctr"><span class="big">${num('load',L)}<u>%</u></span><span class="cap">load</span></div></div>`;
  const rows=APPS.filter(a=>!gone(a.id)).map(a=>`<div class="rw${isNoise(a)?'':' dim'}" data-t="${a.id}" data-leave="${a.id}" style="--c:${C.apps}"><span class="ic">${ICON[a.ic]}</span><span class="nm">${a.n}${a.id==='chrome'&&isNoise(a)&&!has('chrome','trim')?'<span class="x"> · 14 noise tabs</span>':isNoise(a)?'<span class="x"> · noise</span>':a.ws?`<span class="x"> · ${lk(a.ws)}</span>`:has(a.id,'keep')?'<span class="x"> · kept</span>':''}</span><span class="meta"><span class="v">${fmt(memOf(a))}</span></span>${actsHTML('app',a,3)}</div>`).join('');
  return `<div class="f" style="--c:${C.apps}">
    <p class="hd">${hd}</p>
    <div class="arow">${gauge}<div class="aside"><div class="mh"><span class="l"><b>${num('mem',M,1)}</b> / 32 GB memory</span></div>
      <div class="bar"><i data-a="mk" style="left:0;width:${(M-nm2)/32*100}%;background:var(--g3)"></i><i data-a="mn" data-t="mem-noise" style="left:calc(${(M-nm2)/32*100}% + 2px);width:calc(${nm2/32*100}% - 2px);background:${C.apps};opacity:${nm2?1:0}"></i></div>
      <p class="cap acap">${nm2?'Blue is noise, '+fmt(nm2)+'.':'No noise is open.'}${s.mode===2&&nm2?' Auto quits it above '+s.vals[s.v]+'.':''}</p>
      <div class="btns">${saBtn('now',1)}${saBtn('restore')}</div></div></div>
    <div class="agrid">${rows}</div>
  </div>`;
}

/* ---------- Worktrees ---------- */
function fTrees(){
  const m=merged(),mg=sum(m,w=>w.gb),CH=V==='a'?82:74;
  const order=['m','s','u','f'];
  const fill=w=>w.k==='m'?(has(w.id,'keep')?'var(--g3)':C.trees):w.k==='s'?'':w.k==='u'?'rgba(255,255,255,.3)':'rgba(255,255,255,.12)';
  const cols=order.map((k,gi)=>WT.filter(w=>w.k===k).map(w=>`<i data-a="c${w.id}" data-t="${w.id}" data-card="wt:${w.id}" class="${w.k==='s'?'hatch ':''}${gone(w.id)?'z':''}" style="height:${gone(w.id)?0:8+w.gb/3.2*CH}px;background:${fill(w)}"></i>`).join('')+(gi<3?'<span class="gap"></span>':'')).join('');
  const stale=WT.filter(w=>w.k==='s'&&!gone(w.id));
  const rows=[...WT.filter(w=>w.k==='m'&&!gone(w.id)),...stale].map(w=>`<div class="rw${w.k==='s'||has(w.id,'keep')?' dim':''}" data-t="${w.id}" data-leave="${w.id}" style="--c:${C.trees}"><span class="ic">${gl('trees',w.k==='m'?C.trees:'rgba(235,235,245,.4)',14)}</span><span class="nm">${w.n}${w.ws&&byId[w.ws].n!==w.n?`<span class="x"> · ${lk(w.ws)}</span>`:''}</span><span class="meta"><span class="st" style="${w.id==='wt-bp7'?'color:var(--tx2)':''}">${has(w.id,'keep')?'kept':w.why}${w.srv&&!gone(w.srv)?' · '+byId[w.srv].p:''}</span>${tk(shortIdle(treeAge(w)),'v2')}<span class="v">${fmt(w.gb)}</span></span>${actsHTML('wt',w,3)}</div>`).join('');
  const sg=sum(stale,w=>w.gb),s=sec('trees'),n=nextAuto(s);
  return `<div class="f" style="--c:${C.trees}">
    <div class="wtop"><div class="wnum"><span class="big">${mg?gnum('wg',mg):'0<u>GB</u>'}</span>
      <p class="t">${m.length?`in ${m.length} merged worktree${m.length>1?'s':''}. Every commit in ${m.length>1?'them':'it'} is in main.`:'Nothing merged is left. Every worktree is in use or kept.'}</p></div>
      <div class="sky"><div class="cols">${cols}</div>
      <div class="leg"><span><i style="background:${C.trees}"></i>merged</span><span><i class="hatch"></i>stale</span><span><i style="background:rgba(255,255,255,.3)"></i>in use</span><span><i style="background:rgba(255,255,255,.12)"></i>fine</span></div></div></div>
    <div class="rows r-trees">${rows}</div>
    <div class="dfoot" style="padding-left:0;justify-content:space-between;gap:16px">${tk(s.mode===1?'Nothing is removed until you press.':s.mode===2?(n?'Next: Auto removes '+n.o.n+' in '+durC(n.m)+'.':''):'Not watching.','cap')}${saBtn('merged',1)}</div>
  </div>`;
}

/* ---------- Disk ---------- */
function fDisk(){
  const H=V==='a'?248:216,LH=V==='a'?40:36,D=994,used=812,full=38.4,s=sec('disk');
  let y=H;const seg=[];
  DK.forEach(d=>{const h=gone(d.id)?0:d.gb/full*H;y-=h;seg.push({d,top:y,h})});
  const rem=sum(DK.filter(d=>!gone(d.id)),d=>d.gb);
  const usedNow=used-(full-rem);
  const uh=usedNow/D*H, sh=rem/D*H, ut=H-uh;
  const colr=d=>d.rep?'rgba(255,255,255,.22)':d.safe&&!has(d.id,'keep')?C.disk:'color-mix(in srgb,'+C.disk+' 38%,transparent)';
  const disk=`<div class="col" style="left:0"><i data-a="du" style="top:${ut+sh}px;height:${uh-sh}px;background:var(--g2)"></i><i data-a="dr" style="top:${ut}px;height:${Math.max(sh,0)}px;background:${C.disk}"></i></div>`;
  const zt=seg.length?Math.min(...seg.map(s=>s.top)):H;
  const wedge=`<svg class="wedge" width="56" height="${H}" viewBox="0 0 56 ${H}"><path d="M0 ${ut} L56 ${zt} L56 ${H} L0 ${ut+sh} Z" fill="${C.disk}" opacity=".08"/><path d="M0 ${ut}L56 ${zt}M0 ${ut+sh}L56 ${H}" stroke="${C.disk}" stroke-opacity=".25" fill="none"/></svg>`;
  const zoom=`<div class="col" style="left:96px">${seg.map(s=>`<i data-a="z${s.d.id}" data-t="${s.d.id}" style="top:${s.top+1}px;height:${Math.max(0,s.h-2)}px;background:${colr(s.d)}"></i>`).join('')}</div>`;
  const Lb=seg.filter(s=>!gone(s.d.id)).map(s=>({s,c:s.top+s.h/2})).sort((a,b)=>a.c-b.c);
  let last=-1e9;
  Lb.forEach(l=>{l.y=Math.max(l.c-LH/2,last+LH);last=l.y});
  const over=Lb.length?Lb[Lb.length-1].y+LH-H:0; if(over>0) Lb.forEach(l=>l.y-=over);
  for(let i=Lb.length-2;i>=0;i--) if(Lb[i].y>Lb[i+1].y-LH) Lb[i].y=Lb[i+1].y-LH;
  const leads=`<svg class="leads" width="20" height="${H}" viewBox="0 0 20 ${H}">${Lb.map(l=>`<path d="M0 ${l.c}H5L15 ${l.y+LH/2}H20" fill="none" stroke="rgba(255,255,255,.16)"/>`).join('')}</svg>`;
  const labs=leads+Lb.map(l=>{const d=l.s.d;return `<div class="lab" data-a="lb${d.id}" style="top:${l.y+1}px"><div class="rw${d.safe&&!has(d.id,'keep')?'':' dim'}" data-t="${d.id}" data-leave="${d.id}" style="--c:${C.disk}"><span class="nm"><span>${d.n}</span><span class="x">${has(d.id,'keep')?'kept':d.x}${d.safe&&!has(d.id,'keep')?' · safe':''}</span></span><span class="meta"><span class="v">${fmt(d.gb)}</span></span>${actsHTML('dk',d,3)}</div></div>`}).join('');
  const sf=sum(safeDK(),d=>d.gb),n=nextAuto(s);
  return `<div class="f" style="--c:${C.disk}">
    <p class="hd">${rem?`${fmt(rem)} you can get back.<br><span class="s">${sf?fmt(sf)+' of it is safe.':'None of it is marked safe.'}</span>`:`Nothing left to clean.<br><span class="s">${fmt(D-usedNow)} free.</span>`}</p>
    <div class="zoom">${disk}${wedge}${zoom}${labs}</div>
    <div class="zcap"><span class="cap"><b>${Math.round(usedNow)}</b> / 994 GB</span><span class="cap">zoom on <b>${rem?fmt(rem):'0 GB'}</b> · solid is safe to clean</span></div>
    <div class="dfoot dk">${tk(s.mode===2&&n?'Auto cleans it '+(s.v===0?'tonight':s.v===1?'on Sunday':'on 1 Nov')+', in '+dur(n.m)+'.':s.mode===1?'Nothing happens until you press.':'Not watching.','cap')}${saBtn('safe',1)}</div>
  </div>`;
}
const FRONT={ws:fWS,agents:fAgents,apps:fApps,servers:fServers,trees:fTrees,disk:fDisk};

/* ---------- footer: the lid check + today ---------- */
function todayHTML(){
  return today&1?`<span class="txt">Brought back <b>2 apps</b> and <b>3 servers</b> today.</span>`:
    `<span class="txt">Auto today: <b>2 apps</b>, <b>${CNT.srv} servers</b>${CNT.ws?`, <b>${CNT.ws} wrap-up${CNT.ws>1?'s':''}</b>`:''}</span><button class="undo" data-today>Undo</button>`;
}
function lidHTML(){
  const h=holders().length;
  return `<button class="lid" role="checkbox" aria-checked="${lid}" data-lid><i class="cb">${CHECK}</i><span>Keep working with the lid closed</span>${tk(lid?'· '+h+' working':'· off','lv')}</button>
    <span class="ln">${lid?'Stops at 20 % battery, if Wi-Fi drops, or if the Mac runs hot.':'Closing the lid sleeps the Mac and pauses every agent.'}</span>`;
}

/* ---------- render ---------- */
function render(){
  put($('today'),todayHTML()); put($('lid'),lidHTML()); put($('idx'),idxHTML());
  put($('pin'),markHTML(cur())+FRONT[sel]()); applyMarks();
  if(open) put($('dw'),drawerHTML(cur()));
  placeNub(); menuBadge();
  $('sheet').classList.toggle('open',open);
}
function refresh(){
  if(busy) return;
  $('clock').textContent=clockText();
  put($('today'),todayHTML()); put($('lid'),lidHTML()); put($('idx'),idxHTML());
  const sw=put($('pin'),markHTML(cur())+FRONT[sel]());
  if(open) put($('dw'),drawerHTML(cur()));
  if(sw||open) applyMarks();
  menuBadge();
}
function go(id){
  if(id===sel) return;
  sel=id; hideCard(); hidePv(); put($('idx'),idxHTML());
  const p=$('pin'),d=$('dw');
  if(RM){render();return}
  busy=1; p.classList.add('swap'); if(open) d.classList.add('swap');
  setTimeout(()=>{busy=0;put(p,markHTML(cur())+FRONT[sel](),true);if(open)put(d,drawerHTML(cur()),true);applyMarks();placeNub();requestAnimationFrame(()=>{p.classList.remove('swap');d.classList.remove('swap')})},170);
}
function goWs(id){
  const f=()=>{const e=$('pin').querySelector(`[data-t="${id}"]`);if(!e)return;e.classList.add('flash');setTimeout(()=>e.classList.remove('flash'),1400)};
  if(sel!=='ws'){go('ws');setTimeout(f,RM?0:260)}else f();
}
function setOpen(v){
  open=v; hideCard(); hidePv();
  if(open) put($('dw'),drawerHTML(cur()),true);
  $('sheet').classList.toggle('open',open);
  put($('pin'),markHTML(cur())+FRONT[sel]()); applyMarks();
}

/* ---------- setting face: drawer ---------- */
function rulerHTML(s){
  const n=s.vals.length,p=i=>(i+.5)/n*100;
  return `<div class="ruler"><span class="fill" data-a="rf" style="width:${p(s.v)}%"></span>${s.vals.map((_,i)=>`<span class="st" style="left:${p(i)}%"></span>`).join('')}<span class="tk" data-a="rt" style="left:${p(s.v)}%"></span></div>
    <div class="rlab" role="radiogroup">${s.vals.map((v,i)=>`<button role="radio" aria-checked="${i===s.v}" data-val="${i}" style="left:${p(i)}%">${v}</button>`).join('')}</div>`;
}
function drawerHTML(s){
  return `<div class="dw-hd" style="--c:${s.c}">${gl(s.id,s.c,15)}<span>${s.name}</span><button class="done" data-close>Done</button></div>
    <div class="mlist" role="radiogroup" style="--c:${s.c}">${MODES.map((m,i)=>`<button class="md" role="radio" aria-checked="${i===s.mode}" data-mode="${i}"><span class="mw">${m}</span><span class="mt">${nb(modeText(s,i))}</span></button>`).join('')}<i class="mbar" data-a="mbar" style="transform:translateY(${s.mode*62}px);background:${s.mode?s.c:'var(--g3)'}"></i></div>
    <div class="vl${s.mode?'':' dim'}" style="--c:${s.c}"><span class="cap">${s.lab}</span>${rulerHTML(s)}</div>
    <p class="rule">${RULE[s.id]}</p>
    <div class="touch"><i class="mk" style="${s.mode===2?`background:${s.c}`:s.mode===1?`box-shadow:inset 0 0 0 1.5px ${s.c}`:'background:var(--g2)'}"></i>${tk(nb(nextText(s)))}</div>`;
}

/* ---------- marks: what the open setting touches ---------- */
function applyMarks(){
  const p=$('pin'),s=cur();
  p.classList.toggle('setv',open);
  p.querySelectorAll('.aff').forEach(e=>e.classList.remove('aff','ma','mq'));
  if(!open) return;
  const A=new Set(affected(s));
  p.querySelectorAll('[data-t]').forEach(e=>{if(e.dataset.t.split(' ').some(id=>A.has(id))){e.classList.add('aff',s.mode===2?'ma':'mq')}});
  if(s.id==='apps'&&A.size) p.querySelectorAll('[data-t="cpu-noise"],[data-t="mem-noise"],[data-t="cpu-kept"]').forEach(e=>e.classList.add('aff'));
  if(s.id==='servers') p.querySelectorAll('[data-t="m-idle"]').forEach(e=>e.classList.toggle('aff',A.size>0));
}

/* ---------- menu bar ---------- */
function buildIcons(){
  $('icons').insertAdjacentHTML('beforeend',ORDER.map(k=>`<span class="mi" data-mi="${k}">${gl(k,'#fff',16)}</span>`).join('')+`<span class="mi off" data-mi="one">${gl('one','#fff',16)}</span>`);
}
function placeNub(){
  document.querySelectorAll('.mi').forEach(m=>{const k=m.dataset.mi;m.classList.toggle('off',one?k!=='one':k==='one'||(sec(k).mode===0&&k!==sel))});
  setTimeout(()=>{
    const st=$('stage').getBoundingClientRect(),sc=st.width/1280;
    const t=document.querySelector(one?'.mi[data-mi="one"]':`.mi[data-mi="${sel}"]`);
    const r=t.getBoundingClientRect(),ir=$('icons').getBoundingClientRect();
    const cx=(r.left+r.width/2-st.left)/sc;
    $('hl').style.transform=`translateX(${(r.left-ir.left)/sc-6}px)`;
    $('nub').style.transform=`translateX(${cx-GEO.SX}px)`;
  },RM?0:420);
}
function menuBadge(){
  /* Agents Ask: a dot on its icon while someone waits that long */
  const s=sec('agents'),m=document.querySelector('.mi[data-mi="agents"]');if(!m)return;
  const on=s.mode===1&&affected(s).length>0;let b=m.querySelector('.bdg');
  if(on&&!b)m.insertAdjacentHTML('beforeend','<i class="bdg"></i>');else if(!on&&b)b.remove();
}
/* ---------- hover card + result preview ---------- */
let cardT, cardFor=null;
function cardHTML(kind,o){
  let t,s,sc,f=[];
  if(kind==='srv'){t=o.p+' '+o.k;sc=C.servers;s=o.use?'In use now':o.kept?'Stays, Docker runs it':has(o.id,'keep')?'Stays, you kept it':'Unused '+dur(idleOf(o));
    f=[['Workstream',o.ws?lk(o.ws):o.o],['Worktree',o.wt||'none'],['Memory',fmt(o.mb/1000)]]}
  if(kind==='wt'){t=o.n;sc=o.k==='m'?C.trees:'var(--tx2)';s=o.k==='m'?(has(o.id,'keep')?'Stays, you kept it':'Merged '+dur(treeAge(o))+' ago'):o.k==='s'?'Stale '+dur(treeAge(o))+', '+o.why:o.k==='u'?'In use':'Fine, has fresh commits';
    f=[['Size',fmt(o.gb)],['Workstream',o.ws?lk(o.ws):'none'],['Server',o.srv&&!gone(o.srv)?byId[o.srv].p:'none']]}
  if(kind==='ws'){const a=byId[o.ag],sv=wsSrv(o),tr=wsTree(o);t=o.n;sc=o.st==='n'?'var(--tx)':o.st==='i'?'var(--tx2)':C.ws;
    s=isFin(o.id)?'Finished':o.st==='n'?'Needs you '+dur(age(a))+': “'+a.q+'”':o.st==='i'?'Idle '+dur(age(a)):o.id==='ws-med'&&TESTS?'Working, tests running':'Working '+dur(age(a));
    f=[['Agent',WHERE(a)+(o.id==='ws-s3'?' + '+SUBS.length+' subagents':'')],['Branch',o.br+(o.id==='ws-s3'?', 3 ahead':'')],['PR',o.pr?'#'+o.pr.n+' '+o.pr.s+(o.id==='ws-par'?', checks pass':''):'none'],['Servers',sv.length?sv.map(x=>x.p).join(', '):'none'],['Holds',fmt(wsFree(o))+(o.brw?', '+o.brw:'')]]}
  return `<div class="ct">${t}</div><div class="cs" style="color:${sc}">${s}</div><div class="cf">${f.map(x=>`<span>${x[0]}</span><span>${x[1]}</span>`).join('')}</div>
    <div class="ca">${acts(kind,o).map(x=>x.dis?`<button class="dis">${x.l}<span class="tl">${x.tl}</span></button>`:`<button data-act="${x.a}" data-id="${x.id||o.id}">${x.l}<span class="tl">${x.tl||''}</span></button>`).join('')}</div>`;
}
function rel(el){const st=$('stage').getBoundingClientRect(),sc=st.width/1280,sh=$('sheet').getBoundingClientRect(),r=el.getBoundingClientRect();return {x:(r.left-sh.left)/sc,y:(r.top-sh.top)/sc,w:r.width/sc,h:r.height/sc}}
function showCard(el){
  const [kind,id]=el.dataset.card.split(':');const o=byId[id];if(!o||gone(id))return;
  clearTimeout(cardT);cardFor=el;
  const c=$('card');c.innerHTML=cardHTML(kind,o);
  const an=$('pin').querySelector(`[data-lab="${id}"]`);
  const r=rel(an&&el.tagName==='path'?an:el);
  let x=r.x+r.w/2-124,y=r.y+r.h+8;
  x=Math.max(12,Math.min(GEO.SW-260,x));
  if(y+c.offsetHeight>GEO.SH-12) y=r.y-c.offsetHeight-8;
  if(an){x=r.x-256;y=Math.max(12,Math.min(GEO.SH-c.offsetHeight-12,r.y-24))}
  c.style.left=x+'px';c.style.top=y+'px';c.style.setProperty('--c',C[kind==='srv'?'servers':kind==='ws'?'ws':'trees']);
  c.classList.add('show');
}
function hideCard(){clearTimeout(cardT);$('card').classList.remove('show');cardFor=null}
let pvFor=null;
function showPv(b){
  const a=SA[b.dataset.sa];if(!a.res||!a.on())return;pvFor=b;
  const p=$('pv');p.innerHTML=a.res().map(t=>`<span class="pg">${nb(t)}</span>`).join('');
  const r=rel(b);let x=r.x+r.w-280;x=Math.max(16,x);
  p.style.left=x+'px';p.style.top=(r.y-p.offsetHeight-10)+'px';
  if(r.y-p.offsetHeight-10<60) p.style.top=(r.y+r.h+10)+'px';
  p.classList.add('show');
}
function hidePv(){$('pv').classList.remove('show');pvFor=null}
$('sheet').addEventListener('mouseover',e=>{
  const el=e.target.closest('[data-card]');
  if(el&&el!==cardFor) showCard(el);
  else if(!el&&!e.target.closest('#card')&&cardFor){clearTimeout(cardT);cardT=setTimeout(hideCard,180)}
  else if(el||e.target.closest('#card')) clearTimeout(cardT);
  const sa=e.target.closest('[data-sa]');
  const p=$('pin');
  if(sa&&!sa.disabled){const a=SA[sa.dataset.sa],T2=new Set(a.t());p.classList.add('plan');p.querySelectorAll('[data-t]').forEach(n=>n.classList.toggle('hit',n.dataset.t.split(' ').some(i=>T2.has(i))));if(sa!==pvFor)showPv(sa)}
  else {if(p.classList.contains('plan')){p.classList.remove('plan');p.querySelectorAll('.hit').forEach(n=>n.classList.remove('hit'))}if(pvFor)hidePv()}
});

/* ---------- Auto: acts when a timer crosses its value, then a notice with Undo ---------- */
function autoCheck(){
  if(performance.now()-lastAuto<6000||busy) return;
  for(const s of S){
    if(s.mode!==2) continue;
    const t=thr(s);
    if(s.id==='servers'){const x=idleSrv().find(x=>idleOf(x)>=t&&!has(x.id,'spared'));if(x){lastAuto=performance.now();commit(`<span class="au">Auto</span> stopped <b>${x.p} ${x.k}</b>, unused ${dur(idleOf(x))}. ${fmt(x.mb/1000)} back.`,()=>{fl(x.id).gone=1;CNT.srv++},[x.id],[x.id]);return}}
    if(s.id==='ws'){const w=ready().find(w=>mergedAgo(w)>=t&&!has(w.id,'spared'));if(w){lastAuto=performance.now();commit(`<span class="au">Auto</span> ${wrapMsg(w).replace('Wrapped','wrapped')}`,()=>{wrapWs(w.id);CNT.ws=(CNT.ws||0)+1},wsLeave(w),[w.id]);return}}
    if(s.id==='trees'){const w=merged().find(w=>treeAge(w)>=t&&!has(w.id,'spared'));if(w){lastAuto=performance.now();commit(`<span class="au">Auto</span> moved <b>${w.n}</b> to the Trash, merged ${dur(treeAge(w))} ago.`,()=>{fl(w.id).gone=1;if(w.srv)fl(w.srv).gone=1},[w.id],[w.id]);return}}
    if(s.id==='apps'&&LOAD()>t&&noise().length){const n=noise().filter(a=>!has(a.id,'spared'));if(n.length){lastAuto=performance.now();commit(`<span class="au">Auto</span> quit <b>${and(n.map(a=>a.n))}</b>, load passed ${t} %.`,()=>n.forEach(a=>fl(a.id).gone=1),n.map(a=>a.id),n.map(a=>a.id));return}}
    if(s.id==='agents'){const a=waiting().find(a=>age(a)>=t&&!has(a.id,'fwd'));if(a){lastAuto=performance.now();fl(a.id).fwd=1;toast(`<span class="au">Auto</span> brought <b>${a.n}</b> forward in ${PLACE(a)}. It asks “${a.q}”`,false);return}}
  }
}

/* ---------- simulation: things come and go ---------- */
function arrive(ids){ids.forEach(id=>{SIMG.delete(id);NEW.set(id,performance.now())});const t=performance.now();setTimeout(()=>{if([...NEW.values()].includes(t)||1)refresh()},5100)}
function depart(ids){
  ids=ids.filter(id=>!gone(id)||SUBS.includes(id)); if(!ids.length) return;
  ids.forEach(id=>FIN.set(id,performance.now()));
  setTimeout(()=>{
    const els=ids.flatMap(id=>[...$('pin').querySelectorAll(`[data-leave~="${id}"]`)]);
    if(!RM) els.forEach(e=>e.classList.add('leave'));
    setTimeout(()=>{ids.forEach(id=>{FIN.delete(id);if(SUBS.includes(id))SUBS=SUBS.filter(x=>x!==id);else SIMG.add(id)});refresh()},RM?0:400);
  },2600);
}
let subN=2;
const EV=[
  ()=>{subN++;const id='sa'+subN;SUBS.push(id);NEW.set(id,performance.now());NEW.set('subs',performance.now());setTimeout(refresh,5100)},
  ()=>{TESTS=false},
  ()=>{if(!has('s5174','gone'))arrive(['s5174'])},
  ()=>{const id=SUBS[SUBS.length-1];if(SUBS.length>2)depart([id])},
  ()=>{const a=byId.icons;if(!gone('icons'))depart(['icons','ws-ic'])},
  ()=>{byId.docs.m=0;byId.docs.t0=T;arrive(['docs','ws-docs'])},
  ()=>{if(!gone('s5174'))depart(['s5174'])},
  ()=>{TESTS=true},
  ()=>{if(!gone('docs'))depart(['docs','ws-docs'])},
  ()=>{byId.icons.m=0;byId.icons.t0=T;arrive(['icons','ws-ic'])}
];
let paused=false, tickN=0, evI=0;
function jitter(){
  const r=()=>Math.random()-.5;
  J.load=Math.max(-4,Math.min(4,J.load*.6+r()*3));
  J.mem=Math.max(-.35,Math.min(.35,J.mem*.6+r()*.25));
  APPS.forEach(a=>{J.app[a.id]=Math.max(-a.cpu*.07,Math.min(a.cpu*.07,(J.app[a.id]||0)*.6+r()*a.cpu*.08))});
}
function tick(){
  if(paused) return;
  T+=0.1; tickN++; sampleSrv();
  if(tickN%2===0) jitter();
  if(tickN%8===3){EV[evI%EV.length]();evI++}
  autoCheck();
  refresh();
}
$('pz').onclick=()=>{paused=!paused;$('sim').classList.toggle('paused',paused);$('pz').textContent=paused?'Play':'Pause';$('simt').textContent=paused?'Paused · nothing moves until you press Play':'Live · time runs 6× here, so you can watch things change'};

/* ---------- clicks ---------- */
document.addEventListener('click',e=>{
  const t=e.target;
  const it=t.closest('[data-sec]'); if(it){go(it.dataset.sec);return}
  if(t.closest('[data-open]')){setOpen(true);return}
  if(t.closest('[data-close]')){setOpen(false);return}
  const md=t.closest('[data-mode]'); if(md){const s=cur(),m=+md.dataset.mode;if(m===s.mode)return;const was=MODES[s.mode];commit(`${s.name} is <b>${MODES[m]}</b> now, was ${was}. ${modeText(s,m)}`,()=>{s.mode=m});return}
  const vl=t.closest('[data-val]'); if(vl){const s=cur(),v=+vl.dataset.val;if(v===s.v)return;const was=s.vals[s.v];commit(`${s.name}: <b>${s.lab.charAt(0).toLowerCase()+s.lab.slice(1)} ${s.vals[v]}</b>, was ${was}.`,()=>{s.v=v});return}
  const sw=t.closest('[data-sw]'); if(sw){const k=sw.dataset.sw;commit(k==='one'?(one?'Each section has its own menu bar icon again.':'<b>One icon</b> in the menu bar now.'):(login?'MinMacs will not open at login.':'MinMacs opens at login.'),()=>{if(k==='one')one=!one;else login=!login});return}
  if(t.closest('[data-lid]')){commit(lid?'Closing the lid sleeps the Mac again. Agents pause with it.':'<b>Your agents keep working</b> with the lid closed.',()=>{lid=!lid});return}
  if(t.closest('[data-today]')){commit('Brought back <b>2 apps</b> and <b>3 servers</b> Auto closed today.',()=>{today|=1});return}
  const gw=t.closest('span[data-gows]'); if(gw){hideCard();goWs(gw.dataset.gows);return}
  const sa=t.closest('[data-sa]'); if(sa){const a=SA[sa.dataset.sa];if(!a.on())return;const [msg,fn]=a.run();$('pin').classList.remove('plan');commit(msg,fn,a.t());return}
  const ac=t.closest('[data-act]'); if(ac){runAct(ac.dataset.act,ac.dataset.id);return}
  const mi=t.closest('[data-mi]'); if(mi&&mi.dataset.mi!=='one'){go(mi.dataset.mi);return}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&open){setOpen(false);return}
  if(['ArrowDown','ArrowUp','ArrowLeft','ArrowRight'].includes(e.key)&&e.target.closest('.idx')){const i=ORDER.indexOf(sel)+(e.key==='ArrowDown'||e.key==='ArrowRight'?1:-1);if(ORDER[i]){go(ORDER[i]);setTimeout(()=>document.querySelector(`[data-sec="${ORDER[i]}"]`).focus(),200)}e.preventDefault()}
});
/* ---------- stage ---------- */
function fit(){const s=Math.min(innerWidth/1280,innerHeight/800);$('stage').style.transform=`scale(${s})`;$('stage').style.left=(innerWidth-1280*s)/2+'px';$('stage').style.top=(innerHeight-800*s)/2+'px'}
addEventListener('resize',()=>{fit();placeNub()});
buildIcons(); initHist(); fit(); render(); setInterval(tick,1000);
</script>
