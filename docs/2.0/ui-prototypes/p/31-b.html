<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ruler Through Rows</title>
<!--
COMPOSITION (31-b "Ruler Through Rows"): the setting lives in the graph, and the graph is woven
through the rows.

Sheet 1000 x 722 under its menu bar icon. Grid: 28 | Live Index 312 | 32 | detail 600 | 28.
Detail grid, the same four columns on every line so everything aligns:
  icon 16 | 8 | name 156 | 8 | TRACK 316 | 16 | tag 80
Top: big ftop number (140) beside a two-line insight. Then the instrument head: the mode legend sits
in the name columns, the ruler axis with its draggable knob sits in the track column. Below it every
row carries its own piece of the graph in the track column (an idle bar, an age bar, a load slice, a
run of cleaning days, a battery span), and the rule's value is one white line dropped from the knob
through all of them like a ruler. The tag column answers "when": outlined in Ask, filled in Auto.
Foot: the rule sentence on the left, the section action on the right, on one baseline.

Focal point: the white ruler line and where each row's piece meets it. Reading path: big number ->
insight -> knob -> down the line -> tags -> action.
Per tab: Agents (time since change, line = finished for), Apps (a load waterfall, line = 70 %),
Servers (idle time, line = 2 h), Worktrees (days since merge, line = 1 day), Disk (five weeks of
cleaning days, the lines are the cadence), Keep Awake (battery from 100 to 0, line = 20 %).
Type: 24 (index names), 13 (text), 11.5 (captions, tags, axis) plus the ftop numbers (16, 34).
Spacing scale: 4 / 8 / 12 / 16 / 24 / 32.
-->
<style>
:root{
  --glass:rgba(28,29,38,.88);
  --line:rgba(255,255,255,.06);
  --tx:rgba(255,255,255,.94);
  --tx2:rgba(235,235,245,.6);
  --tx3:rgba(235,235,245,.34);
  --g1:rgba(255,255,255,.07);
  --g2:rgba(255,255,255,.2);
  --g3:rgba(255,255,255,.42);
  --rowbg:rgba(255,255,255,.05);
  --ease:cubic-bezier(.3,.7,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#1a1636}
body{font-family:-apple-system,"SF Pro Text",system-ui,sans-serif;color:var(--tx);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;font-size:13px;cursor:default;user-select:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;text-align:left}
b{font-weight:500}
:focus{outline:none}
:focus-visible{outline:2px solid rgba(255,255,255,.55);outline-offset:2px;border-radius:8px}
#stage{position:absolute;left:0;top:0;width:1280px;height:800px;transform-origin:0 0;overflow:hidden;
  background:
   radial-gradient(760px 560px at 10% 6%,#4b3c9e 0%,rgba(75,60,158,0) 70%),
   radial-gradient(700px 520px at 84% 2%,#22618f 0%,rgba(34,97,143,0) 70%),
   radial-gradient(820px 620px at 88% 104%,#a0436f 0%,rgba(160,67,111,0) 70%),
   radial-gradient(640px 520px at 18% 100%,#3a2463 0%,rgba(58,36,99,0) 75%),
   #1d1a3c}

/* menu bar */
.mb{position:absolute;left:0;right:0;top:0;height:26px;display:flex;align-items:center;justify-content:space-between;padding:0 12px 0 16px;background:rgba(18,14,40,.32);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);font-size:13px;color:rgba(255,255,255,.92);z-index:5}
.mb-l,.mb-r{display:flex;align-items:center;gap:18px}
.mb-l b{font-weight:700}
.mb-r{gap:14px}
.icons{position:relative;display:flex;align-items:center;gap:12px}
.hl{position:absolute;top:-3px;height:22px;width:28px;border-radius:6px;background:rgba(255,255,255,.2);transition:transform .45s var(--ease),opacity .3s;pointer-events:none}
.mi{position:relative;display:flex;width:16px;overflow:hidden;cursor:pointer;transition:width .4s var(--ease),opacity .3s,margin .4s var(--ease)}
.mi.off{width:0;opacity:0;margin-left:-12px}

/* sheet */
.sheet{position:absolute;top:34px;left:250px;width:1000px;background:var(--glass);backdrop-filter:blur(36px) saturate(1.5);-webkit-backdrop-filter:blur(36px) saturate(1.5);border:1px solid rgba(255,255,255,.085);border-radius:22px;box-shadow:0 34px 100px rgba(6,4,24,.5),inset 0 1px 0 rgba(255,255,255,.035);animation:drop .6s var(--ease) both}
@keyframes drop{from{opacity:0;transform:translateY(-10px)}}
.nub{position:absolute;top:-8px;left:0;width:18px;height:8px;margin-left:-9px;transition:transform .45s var(--ease)}
.nub svg{display:block}
.head{display:flex;align-items:center;gap:12px;height:52px;padding:0 28px;white-space:nowrap}
.head .lbl{font-size:11.5px;color:var(--tx3)}
.head .txt{font-size:13px;color:var(--tx2)}
.head .txt b{color:var(--tx)}
.head .undo{margin-left:auto;font-size:13px;font-weight:500;padding:4px 12px;border-radius:12px;background:rgba(255,255,255,.07);transition:background .2s}
.head .undo:hover{background:rgba(255,255,255,.13)}
.body{display:grid;grid-template-columns:312px 600px;column-gap:32px;padding:0 28px 16px;height:618px;grid-template-rows:minmax(0,1fr)}

/* ---------- left: live index ---------- */
.idx{display:flex;flex-direction:column;min-height:0}
.leg{font-size:11.5px;color:var(--tx3);height:22px;line-height:14px;white-space:nowrap;display:flex;align-items:flex-start;justify-content:flex-end;gap:6px}
.leg i{display:inline-block;width:12px;height:5px;border-radius:3px;margin-top:5px;background:linear-gradient(90deg,#EE85B5,#5B9BFF 22%,#3FD0B8 42%,#4CC96B 60%,#F2B544 78%,#B18CFF)}
.it{display:flex;align-items:center;gap:12px;flex:1;max-height:96px;min-height:0;border-radius:14px;padding:0 6px;margin:0 -6px;width:calc(100% + 12px);transition:background .25s}
.it .dot{flex:none;width:9px;height:9px;border-radius:50%;box-shadow:inset 0 0 0 1.5px rgba(235,235,245,.28);transition:background .35s,box-shadow .35s,transform .3s}
.it .nm{flex:1;font-size:24px;font-weight:600;letter-spacing:-.022em;color:rgba(235,235,245,.36);transition:color .3s;white-space:nowrap}
.it:hover .nm{color:var(--tx2)}
.it.sel .nm,.it.hit .nm{color:var(--tx)}
.it.hit .dot{transform:scale(1.25)}
.mg{flex:none;position:relative;width:56px;height:24px;display:flex;align-items:flex-end;justify-content:space-between;transition:opacity .4s,filter .4s}
.it.m0 .mg{opacity:.28;filter:grayscale(1)}
.mg i{display:block;transition:height .55s var(--ease),width .55s var(--ease),left .55s var(--ease),background .35s,opacity .35s,box-shadow .35s}
.mg .tr{position:absolute;left:0;right:0;top:9px;height:6px;border-radius:3px;background:var(--g1)}
.mg .tr i{position:absolute;top:0;bottom:0;border-radius:3px}
.mg .tr .tk{top:-4px;bottom:-4px;width:2px;margin-left:-1px;border-radius:1px;background:#fff}
.mg.mc i{flex:none;border-radius:2px}
.mg.dots{flex-wrap:wrap;align-content:center;justify-content:space-between;row-gap:4px}
.mg.dots i{width:6px;height:6px;border-radius:50%}
.mg.ring{justify-content:flex-end;align-items:center}
.nb{flex:none;width:86px;display:flex;flex-direction:column;align-items:flex-end;white-space:nowrap}
.nb .n{font-size:16px;font-weight:500;line-height:19px;color:var(--tx2);transition:color .3s}
.nb .n u{text-decoration:none;font-size:11.5px;font-weight:400;color:var(--tx3);margin-left:3px}
.nb .cp{font-size:11.5px;line-height:15px;color:var(--tx3)}
.it.sel .nb .n{color:var(--tx)}
.it.m0 .nb .n{color:var(--tx3);font-weight:400;font-size:13px}

/* ---------- detail ---------- */
.det{position:relative;min-width:0}
.det .in{display:flex;flex-direction:column;height:100%;transition:opacity .22s,transform .35s var(--ease)}
.det .in.swap{opacity:0;transform:translateY(6px)}
.top{display:grid;grid-template-columns:140px 1fr;column-gap:20px;align-items:start;height:48px}
.big{display:flex;align-items:baseline;gap:6px;white-space:nowrap;line-height:40px}
.big .n{font-size:34px;font-weight:500;letter-spacing:-.02em}
.big .u{font-size:13px;color:var(--tx2)}
.ins{font-size:13px;line-height:20px;color:var(--tx2);padding-top:2px}
.ins b{color:var(--tx)}
.weave{position:relative;margin-top:34px}
.gl{display:grid;grid-template-columns:16px 156px 316px 80px;column-gap:8px;align-items:center}
.gl>:nth-child(4){margin-left:8px}
.hd{height:44px;align-items:stretch}
.hd .lg{grid-column:1 / span 2;display:flex;flex-direction:column;justify-content:space-between;padding:3px 0 1px}
.hd .lgc{font-size:11.5px;line-height:14px;color:var(--tx3);white-space:nowrap}
.legend{display:flex;align-items:center;gap:14px;height:18px;white-space:nowrap}
.legend button{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--tx3);transition:color .25s}
.legend button:hover{color:var(--tx2)}
.legend button[aria-checked="true"]{color:var(--tx);font-weight:500}
.legend i{width:16px;height:8px;border-radius:4px}
.legend .sw0{box-shadow:inset 0 0 0 1px var(--g2);opacity:.6}
.legend .sw1{box-shadow:inset 0 0 0 1.5px var(--c)}
.legend .sw2{background:var(--c)}
.legend button[aria-checked="false"] i{opacity:.45}
.hd .val{display:flex;flex-direction:column;align-items:flex-end;justify-content:center;gap:0;font-size:11.5px;line-height:14px}
.hd .val button{color:var(--tx3);transition:color .25s}
.hd .val button:hover{color:var(--tx2)}
.hd .val button[aria-checked="true"]{color:var(--tx);font-weight:500}
svg.ax,svg.tr{display:block;overflow:visible}
svg text{font-family:inherit;fill:var(--tx3);font-size:11.5px}
svg .snap{cursor:pointer;transition:fill .25s}
svg .snap:hover{fill:var(--tx2)}
svg .snap.on{fill:var(--tx);font-weight:500}
svg .knob{cursor:grab}
svg .knob:focus-visible .kc{stroke:rgba(255,255,255,.6);stroke-width:6}
.drag svg .knob{cursor:grabbing}
.det svg *{transition:stroke-dasharray .6s var(--ease),stroke .35s,fill .35s,opacity .35s,transform .55s var(--ease),width .55s var(--ease),x .55s var(--ease),cx .55s var(--ease),r .35s}
.drag .det svg *,.drag .rline{transition-duration:.18s}
.rline{position:absolute;top:34px;bottom:30px;width:1.5px;margin-left:-.75px;background:#fff;border-radius:1px;pointer-events:none;transition:left .55s var(--ease),opacity .35s,bottom .45s var(--ease);z-index:1}
.weave .rline{bottom:32px}.weave.hasmore .rline{bottom:62px}
.rline.fix{background:none;border-left:1.5px dashed rgba(255,255,255,.3);width:0}
.rline.thin{width:1px;background:var(--c)}
.rows{position:relative}
.rw{position:relative;height:54px;margin:0 -8px;padding:8px 8px 0;border-radius:10px;transition:height .42s var(--ease),opacity .32s,background .25s,padding .42s var(--ease)}
.rw.gone{height:0;opacity:0;padding-top:0;pointer-events:none;overflow:hidden}
.rw:hover{background:var(--rowbg)}
.rw.flash{animation:flash 1.8s var(--ease)}
@keyframes flash{0%,40%{background:color-mix(in srgb,var(--c) 24%,transparent)}100%{background:transparent}}
.l1{height:20px;white-space:nowrap}
.l1 .ic{display:flex;justify-content:center}
.l1 .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;font-size:13px;color:var(--tx);transition:color .25s}
.l1 .nm .x{color:var(--tx3)}
.rw.dim .l1 .nm{color:var(--tx2)}
.rc{display:flex;justify-content:flex-end}
.rt{font-size:11.5px;color:var(--tx3);white-space:nowrap}
.tag{display:inline-flex;align-items:center;height:17px;padding:0 7px;border-radius:9px;font-size:11.5px;font-weight:500;white-space:nowrap;transition:background .3s,box-shadow .3s,color .3s}
.tag.o{box-shadow:inset 0 0 0 1.2px var(--c);color:var(--c)}
.tag.f{background:var(--c);color:#16161e}
.l2{position:relative;height:18px;margin-left:24px;font-size:11.5px;line-height:18px;color:var(--tx3);white-space:nowrap}
.l2 .fx{display:block;width:156px;overflow:hidden;text-overflow:ellipsis;transition:opacity .2s}
.acts{position:absolute;left:0;top:0;display:flex;gap:4px;opacity:0;transform:translateY(3px);pointer-events:none;transition:opacity .2s,transform .3s var(--ease);z-index:2}
.rw:hover .acts,.rw:focus-within .acts{opacity:1;transform:none;pointer-events:auto}
.rw:hover .fx,.rw:focus-within .fx{opacity:0}
.ab{height:18px;padding:0 8px;border-radius:9px;background:rgba(58,58,74,.98);font-size:11.5px;font-weight:500;line-height:18px;color:var(--tx);white-space:nowrap;transition:background .2s}
.ab:hover{background:rgba(84,84,100,.98)}
.ab.dis{background:none;color:var(--tx3);cursor:default;font-weight:400;padding:0}
.lk{color:var(--tx2);cursor:pointer;border-bottom:1px solid rgba(255,255,255,.14);transition:color .2s,border-color .2s}
.lk:hover{color:var(--tx);border-color:rgba(255,255,255,.5)}
.more{height:30px;font-size:11.5px;line-height:30px;color:var(--tx3);white-space:nowrap;padding-left:24px}
.ft{display:flex;align-items:center;gap:16px;margin-top:auto;padding-top:16px;border-top:1px solid var(--line)}
.rule{flex:1;min-width:0;font-size:13px;line-height:20px;color:var(--tx2)}
.rule b{color:var(--tx)}
.sa{display:flex;gap:8px;flex:none}
.btn{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 12px;border-radius:14px;background:rgba(255,255,255,.08);font-size:13px;font-weight:500;white-space:nowrap;transition:background .2s,opacity .2s}
.btn:hover{background:rgba(255,255,255,.15)}
.btn .tl{font-weight:400;font-size:11.5px;color:var(--tx3)}
.btn.pri{background:color-mix(in srgb,var(--c) 26%,transparent)}
.btn.pri:hover{background:color-mix(in srgb,var(--c) 38%,transparent)}
.btn.pri .tl{color:rgba(255,255,255,.55)}
.btn[disabled]{opacity:.35;pointer-events:none}
.btn.quiet{background:none;padding:0 6px}
.btn.quiet:hover{background:rgba(255,255,255,.08)}
.hlon .rows .rw[data-k]:not(.hit){opacity:.25}
.hlon .rw.hit{background:color-mix(in srgb,var(--c) 13%,transparent)}

.foot{display:flex;align-items:center;gap:28px;height:52px;padding:0 28px;border-top:1px solid var(--line)}
.sw{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--tx2);transition:color .2s}
.sw i{width:32px;height:19px;border-radius:10px;background:rgba(255,255,255,.14);position:relative;transition:background .25s;flex:none}
.sw i::after{content:"";position:absolute;left:2px;top:2px;width:15px;height:15px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .25s var(--ease)}
.sw[aria-checked="true"]{color:var(--tx)}
.sw[aria-checked="true"] i{background:#5B9BFF}
.sw[aria-checked="true"] i::after{transform:translateX(13px)}
.foot .hint{margin-left:auto;font-size:11.5px;color:var(--tx3)}

.toast{position:absolute;left:50%;bottom:64px;display:flex;align-items:center;gap:14px;height:40px;max-width:660px;padding:0 6px 0 16px;border-radius:20px;background:rgba(50,50,64,.97);border:1px solid rgba(255,255,255,.1);box-shadow:0 14px 40px rgba(0,0,0,.35);font-size:13px;color:var(--tx2);white-space:nowrap;opacity:0;transform:translate(-50%,10px);pointer-events:none;transition:opacity .3s,transform .4s var(--ease);z-index:4}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast b{color:var(--tx)}
.toast .tt{overflow:hidden;text-overflow:ellipsis}
.toast button{flex:none;height:28px;padding:0 13px;border-radius:14px;background:rgba(255,255,255,.1);font-weight:500;color:var(--tx);transition:background .2s}
.toast button:hover{background:rgba(255,255,255,.18)}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important}}
</style>
</head>
<body>
<div id="stage">
  <div class="mb">
    <div class="mb-l">
      <svg viewBox="0 0 17 20" width="13" height="16" aria-hidden="true"><path fill="#fff" d="M14.1 10.6c0-2.6 2.1-3.8 2.2-3.9-1.2-1.8-3.1-2-3.7-2-1.6-.2-3.1.9-3.9.9-.8 0-2-.9-3.4-.9C3.6 4.8 1.9 5.8 1 7.4c-1.9 3.3-.5 8.2 1.4 10.9.9 1.3 2 2.8 3.4 2.7 1.4-.1 1.9-.9 3.5-.9s2.1.9 3.5.9c1.5 0 2.4-1.3 3.3-2.7 1-1.5 1.5-3 1.5-3.1-.1 0-2.9-1.1-2.9-4.3zM11.5 3c.7-.9 1.2-2.1 1.1-3.3-1 0-2.3.7-3 1.6-.7.8-1.3 2-1.1 3.2 1.1.1 2.3-.6 3-1.5z"/></svg>
      <b>Finder</b><span>File</span><span>Edit</span><span>View</span><span>Go</span><span>Window</span><span>Help</span>
    </div>
    <div class="mb-r">
      <div class="icons" id="icons"><i class="hl" id="hl"></i></div>
      <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M2 6.3a8.6 8.6 0 0 1 12 0M4.2 8.6a5.4 5.4 0 0 1 7.6 0"/><circle cx="8" cy="11.6" r="1.3" fill="#fff" stroke="none"/></svg>
      <svg viewBox="0 0 26 14" width="25" height="13" aria-hidden="true"><rect x=".7" y=".7" width="21.6" height="12.6" rx="3.6" fill="none" stroke="rgba(255,255,255,.55)" stroke-width="1.2"/><rect x="2.6" y="2.6" width="11.6" height="8.8" rx="2" fill="#fff"/><path d="M24 5v4" stroke="rgba(255,255,255,.55)" stroke-width="1.4" stroke-linecap="round"/></svg>
      <span>Tue 27 Oct&nbsp;&nbsp;16:42</span>
    </div>
  </div>

  <div class="sheet" id="sheet" role="dialog" aria-label="MinMacs">
    <div class="nub" id="nub"><svg viewBox="0 0 18 8" width="18" height="8" aria-hidden="true"><path d="M0 8 C5 8 6.5 0 9 0 C11.5 0 13 8 18 8 Z" fill="rgba(36,36,48,.96)"/></svg></div>
    <div class="head" id="today"></div>
    <div class="body">
      <div class="idx" id="idx" role="tablist" aria-orientation="vertical"></div>
      <div class="det" id="det"><div class="in" id="in"></div></div>
    </div>
    <div class="foot">
      <button class="sw" id="one" role="switch" aria-checked="false"><i></i>One icon in the menu bar</button>
      <button class="sw" id="login" role="switch" aria-checked="true"><i></i>Open at login</button>
      <span class="hint">Drag the white knob along the ruler to change the rule</span>
    </div>
    <div class="toast" id="toast" role="status"><span class="tt" id="tt"></span><button id="tbtn">Undo</button></div>
  </div>
</div>

<script>
const VARIANT='b';
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const G={
  agents:'<circle cx="5.6" cy="5.8" r="2.2"/><circle cx="11" cy="5.8" r="2.2"/><path d="M1.8 13.2c.6-2.2 2-3.3 3.8-3.3s3.2 1.1 3.8 3.3M9.2 10.3c.6-.3 1.2-.4 1.8-.4 1.8 0 3.2 1.1 3.8 3.3"/>',
  apps:'<rect x="4.2" y="4.2" width="7.6" height="7.6" rx="1.6"/><path d="M6.6 1.8v2.4M9.4 1.8v2.4M6.6 11.8v2.4M9.4 11.8v2.4M1.8 6.6h2.4M1.8 9.4h2.4M11.8 6.6h2.4M11.8 9.4h2.4"/>',
  servers:'<rect x="2.5" y="2.8" width="11" height="4.2" rx="1.4"/><rect x="2.5" y="9" width="11" height="4.2" rx="1.4"/><path d="M5.2 4.9h.01M5.2 11.1h.01" stroke-width="2.2"/>',
  trees:'<circle cx="4.6" cy="3.6" r="1.6"/><circle cx="4.6" cy="12.4" r="1.6"/><circle cx="11.4" cy="5.4" r="1.6"/><path d="M4.6 5.2v5.6M11.4 7c0 2.7-2.4 3.4-5.4 4.2"/>',
  disk:'<ellipse cx="8" cy="4" rx="5.5" ry="2"/><path d="M2.5 4v8c0 1.1 2.5 2 5.5 2s5.5-.9 5.5-2V4M2.5 8c0 1.1 2.5 2 5.5 2s5.5-.9 5.5-2"/>',
  awake:'<path d="M1.8 8s2.3-4.3 6.2-4.3S14.2 8 14.2 8s-2.3 4.3-6.2 4.3S1.8 8 1.8 8z"/><circle cx="8" cy="8" r="1.9"/>',
  one:'<circle cx="8" cy="8" r="5.8"/><path d="M8 4.6v3.6l2.4 1.4"/>'
};
const gl=(k,c,s,w)=>`<svg viewBox="0 0 16 16" width="${s}" height="${s}" fill="none" stroke="${c}" stroke-width="${w||1.6}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${G[k]}</svg>`;
const MODES=['Off','Ask','Auto'];
const C={agents:'#EE85B5',apps:'#5B9BFF',servers:'#3FD0B8',trees:'#4CC96B',disk:'#F2B544',awake:'#B18CFF'};
const HOLLOW='rgb(31,31,42)';

/* ---------- fixture ---------- */

function fmt(x){
  if(x<.0005) return '0 GB';

  if(x>=10) return (Math.round(x*10)/10).toFixed(1)+' GB';

  return (d<.25?(Math.round(x*10)/10).toFixed(1):(Math.round(x*100)/100).toFixed(2))+' GB';
}

/* ---------- time words ---------- */
const NOW=16*60+42, WD=['Tue','Wed','Thu','Fri','Sat','Sun','Mon'];
const hm=t=>String(Math.floor(t/60)).padStart(2,'0')+':'+String(Math.round(t%60)).padStart(2,'0');
function at(min){ if(min<=0) return 'now'; const t=NOW+min, d=Math.floor(t/1440); return (d? WD[d%7]+' ':'')+hm(t%1440) }
function dayAt(days){ if(days<=0) return 'now'; const d=Math.ceil(days); const dt=27+d; return WD[d%7]+' '+(dt>31?(dt-31)+' Nov':dt) }
const NEXT=['tonight','Sunday','1 Nov'];

/* ---------- what each rule acts on, and when ---------- */
function due(s,o){
  /* returns null if the rule never touches o, else a time word */
  const T=thr(s);
  if(s.id==='servers'){ if(!o.idle||gone(o.id)||has(o.id,'keep')) return null; return at(T-o.idle) }
  if(s.id==='agents'){ if(o.st!=='f'||gone(o.id)) return null; return at(T-o.since) }
  if(s.id==='apps'){ if(!isNoise(o)) return null; return LOAD()>T?'now':'at '+T+' %' }
  if(s.id==='trees'){ if(o.k!=='m'||gone(o.id)||has(o.id,'keep')) return null; return dayAt(T-o.d) }
  if(s.id==='disk'){ if(!o.safe||gone(o.id)||has(o.id,'keep')) return null; return NEXT[s.v] }
  if(s.id==='awake'){ if(o.st!=='w'||gone(o.id)||has(o.id,'sleep')) return null; return s.mode===2?'awake':'asks' }
  return null;
}
/* mark style for a shape the rule acts on: Off none, Ask outlined, Auto filled */
const markCls=(s,on)=>!on||!s.mode?'':s.mode===2?'f':'o';
function tag(s,o,fallback){
  const d=due(s,o); if(d==null||!s.mode) return `<span class="rt">${fallback||''}</span>`;
  return `<span class="tag ${s.mode===2?'f':'o'}">${d}</span>`;
}

function acts(kind,o){
  const A=(a,l,dis)=>({a,l,dis});
  if(kind==='apps'){
    if(o.cls==='spared') return [A('','Quit… Playwright drives it',1)];
    if(o.cls==='kept') return [A('','Quit… essential',1)];
    const r=[];
    if(o.id==='chrome'&&!has('chrome','trim')) r.push(A('trim','Trim Tabs'));
    r.push(A('quit','Quit'));
    if(o.cls==='unsorted') r.push(has(o.id,'list')?A('unlist','Keep'):A('list','Move to Close List'));
    else r.push(has(o.id,'keep')?A('unkeep','Close List'):A('keep','Keep'));
    return r;
  }
  if(kind==='servers'){
    if(o.kept) return [A('','Stop… Docker keeps it',1)];
    if(o.use) return [A('nav','Open'),A('goto:'+o.ag,'Go to Agent')];
    return [A('stop','Stop'),has(o.id,'keep')?A('unkeep','Let It Stop'):A('keep','Keep'),A('nav','Open')];
  }
  if(kind==='trees'){
    if(o.id==='wt-bp7') return [A('','Remove… 1 commit not in main',1)];
    const r=[A('rmtree','Remove')];
    if(o.k==='m') r.push(has(o.id,'keep')?A('unkeep','Let It Go'):A('keep','Keep'));
    r.push(A('nav','Finder'));
    return r;
  }
  if(kind==='disk'){
    if(o.rep) return [A('','Clean… report only',1)];
    const r=[A('clean','Clean')];
    if(o.safe) r.push(has(o.id,'keep')?A('unkeep','Clean Later'):A('keep','Keep'));
    r.push(A('nav','Finder'));
    return r;
  }
  const r=[A('nav','Go to Tab')];
  if(o.st==='f') r.unshift(A('wrap','Wrap Up'));
  else if(o.st==='w') r.push(has(o.id,'sleep')?A('hold','Keep Awake'):A('sleep','Let It Sleep'));
  else if(agServers(o.id).length) r.push(A('stopsrv','Stop Servers'));
  return r;
}
const actBtns=(kind,o)=>`<span class="acts">${acts(kind,o).map(b=>b.dis?`<span class="ab dis">${b.l}</span>`:`<button class="ab" data-act="${b.a}" data-id="${o.id}" data-l="${b.l}">${b.l}</button>`).join('')}</span>`;
function runAct(a,id,l){
  const o=byId[id], name=o.p?o.p+' '+o.k:o.n;
  if(a.startsWith('goto:')){goAgent(a.slice(5));return}
  if(a==='nav'){
    const msg={'Go to Tab':`Switched to <b>${name}</b> in its ${WHERE(o)}.`,'Finder':`Showing <b>${name}</b> in Finder.`,'Open':`Opened <b>localhost${o.p}</b> in the browser.`}[l]||`Opened <b>${name}</b>.`;
    toast(msg,'Back');return
  }
  const pre=save(); let msg='';
  if(a==='quit'){msg=`Quit <b>${o.n}</b>. Freed ${fmt(memOf(o))}.`;fl(id).gone=1}
  else if(a==='trim'){msg=`Closed 14 noise tabs in <b>Chrome</b>. 31 work tabs stay. Freed 2.6 GB.`;fl(id).trim=1}
  else if(a==='keep'){fl(id).keep=1;msg=`<b>${o.p||o.n}</b> is kept. MinMacs leaves it alone.`}
  else if(a==='unkeep'){fl(id).keep=0;msg=`<b>${o.p||o.n}</b> is back on the list.`}
  else if(a==='list'){fl(id).list=1;msg=`<b>${o.n}</b> is now on the Close List.`}
  else if(a==='unlist'){fl(id).list=0;fl(id).keep=1;msg=`<b>${o.n}</b> is kept.`}
  else if(a==='stop'){msg=`Stopped <b>${o.p} ${o.k}</b>. Freed ${o.mb} MB.`;stopSrv(id)}
  else if(a==='rmtree'){msg=`Moved <b>${o.n}</b> to the Trash${o.id==='wt-bp8'?', a git bundle first':''}${o.srv&&!gone(o.srv)?', stopped '+byId[o.srv].p:''}.`;rmTree(o)}
  else if(a==='clean'){msg=o.tool?`Ran <b>${o.tool}</b>. Freed ${fmt(o.gb)}.`:`Moved <b>${o.n}</b> to the Trash. Freed ${fmt(o.gb)}.`;fl(id).gone=1}
  else if(a==='wrap'){msg=`Wrapped up <b>${o.n}</b>: stopped its server, removed its merged worktree.`;agServers(id).forEach(x=>stopSrv(x.id));const t=agTree(id);if(t)rmTree(t);fl(id).gone=1}
  else if(a==='stopsrv'){msg=`Stopped ${agServers(id).map(x=>'<b>'+x.p+'</b>').join(', ')} for ${o.n}.`;agServers(id).forEach(x=>stopSrv(x.id))}
  else if(a==='sleep'){fl(id).sleep=1;msg=`<b>${o.n}</b> no longer holds the Mac awake.`}
  else if(a==='hold'){fl(id).sleep=0;msg=`<b>${o.n}</b> keeps the Mac awake again.`}
  UNDO.push(pre); HL=null; renderAll(); toast(msg,'Undo');
}
function runSA(sid,i){
  const g=SA[sid][i]; if(!g||!g.on()) return;
  const msg=g.msg(); UNDO.push(save()); g.run(); HL=null; renderAll(); toast(msg,'Undo');
}

/* ---------- toast ---------- */
let tT=null, tMode='';
function toast(html,btn){
  $('tt').innerHTML=html; $('tbtn').textContent=btn||'OK'; $('tbtn').style.display=btn?'':'none'; tMode=btn||'';
  $('toast').classList.add('show'); clearTimeout(tT); tT=setTimeout(()=>$('toast').classList.remove('show'),btn?7000:2200);
}
$('tbtn').addEventListener('click',()=>{
  if(tMode==='Undo'&&UNDO.length){load(UNDO.pop());renderAll();renderIcons();toast('Back as it was.')}
  else if(tMode==='Back'){toast('Back in MinMacs.')}
});

  })[s.id][m];
}
const LEGEND=['no marks','outlined','filled, with a time'];
function detHTML(s){
  const H=HERO[s.id], b=H.big(s), m=s.mode, rowsH=H.rows(s);
  const lines=H.lines(s).map((l,i)=>`<i class="rline${l.fix?' fix':''}${l.thin?' thin':''}" style="left:${OFF+l.x}px;opacity:${l.fix?1:l.thin?(m===2?.35:.22):m?.85:.35}"></i>`).join('');
  return `<div class="top"><div class="big"><span class="n" data-tw="b-${s.id}">${b[0]}</span><span class="u">${b[1]}</span></div><p class="ins">${insight(s)}</p></div>
  <div class="weave${/class="more"/.test(rowsH)?' hasmore':''}">${headHTML(s)}<div class="rows">${rowsH}</div>${lines}</div>
  <div class="ft"><p class="rule">${rule(s)}</p>
    <div class="sa">${SA[s.id].map((g,i)=>{const on=g.on();return `<button class="btn${g.sec2?' quiet':' pri'}" data-sa="${s.id}:${i}"${on?'':' disabled'}>${g.verb}<span class="tl">${on?g.tail():'nothing now'}</span></button>`}).join('')}</div></div>`;
}

/* ---------- morph: update in place so CSS eases every value ---------- */
function morph(a,b){
  if(a.nodeType!==b.nodeType||a.nodeName!==b.nodeName){a.replaceWith(b.cloneNode(true));return}
  if(a.nodeType===3){if(a.nodeValue!==b.nodeValue)a.nodeValue=b.nodeValue;return}
  if(a.nodeType!==1)return;
  if(a.hasAttribute('data-tw')&&b.hasAttribute('data-tw')){ if(a.dataset.tw!==b.dataset.tw) a.dataset.tw=b.dataset.tw; a.dataset.target=b.textContent; return }
  for(const at of [...b.attributes]) if(a.getAttribute(at.name)!==at.value) a.setAttribute(at.name,at.value);
  for(const at of [...a.attributes]) if(!b.hasAttribute(at.name)) a.removeAttribute(at.name);
  const ac=[...a.childNodes], bc=[...b.childNodes];
  if(ac.length!==bc.length){a.replaceChildren(...bc.map(n=>n.cloneNode(true)));return}
  ac.forEach((n,i)=>morph(n,bc[i]));
}
function patch(el,html){const t=document.createElement(el.tagName);t.innerHTML=html;
  if(!el.childNodes.length){el.innerHTML=html;return}
  const ac=[...el.childNodes], bc=[...t.childNodes];
  if(ac.length!==bc.length){el.innerHTML=html;return}
  ac.forEach((n,i)=>morph(n,bc[i]));
}
/* numbers ease */
const TW={};
function tweens(){
  document.querySelectorAll('[data-tw]').forEach(el=>{
    const k=el.dataset.tw, txt=el.dataset.target??el.textContent, v=parseFloat(txt), dec=(txt.split('.')[1]||'').length, p=TW[k];
    delete el.dataset.target;
    TW[k]=v; if(p==null||p===v||RM||isNaN(v)){el.textContent=txt;return}
    const t0=performance.now(), D=600;
    (function step(t){const q=Math.min(1,(t-t0)/D), e=1-Math.pow(1-q,3); el.textContent=(p+(v-p)*e).toFixed(dec); if(q<1&&el.isConnected&&TW[k]===v) requestAnimationFrame(step); else if(q>=1) el.textContent=txt})(t0);
  });
}

/* ---------- highlight ---------- */
let HL=null, FLASH=null;
function applyHL(){
  const sh=$('sheet'); sh.classList.toggle('hlon',!!HL);
  sh.querySelectorAll('.det [data-k]').forEach(el=>{const t=(el.getAttribute('data-k')||'').split(' ');el.classList.toggle('hit',!!HL&&t.some(k=>k&&HL.has(k)))});
  if(FLASH){const r=sh.querySelector(`[data-row="${FLASH}"]`);if(r){r.classList.remove('flash');void r.offsetWidth;r.classList.add('flash')}FLASH=null}
}
function setHL(el){
  let keys=null;
  if(el&&el.dataset.sa){const [sid,i]=el.dataset.sa.split(':');const g=SA[sid][+i];if(g&&g.on()){keys=g.keys()}}
  else if(el&&el.dataset.row){keys=(el.dataset.k||'').split(' ')}
  HL=keys&&keys.length?new Set(keys):null; applyHL();
}
let hovEl=null;
document.addEventListener('pointerover',e=>{
  if(DRAG) return;
  const el=e.target.closest&&e.target.closest('[data-sa],.rw[data-row]');
  if(el===hovEl) return; hovEl=el; setHL(el);
});

/* ---------- render ---------- */
function renderIdx(){patch($('idx'),idxHTML())}
function renderDet(animate){
  const s=cur(), d=$('det'), inn=$('in');
  d.style.setProperty('--c',s.c);
  const fill=()=>{inn.innerHTML=detHTML(s); d.classList.toggle('off',!s.mode); applyHL(); tweens()};
  if(!animate){fill();return}
  inn.classList.add('swap');
  setTimeout(()=>{fill();requestAnimationFrame(()=>inn.classList.remove('swap'))},170);
}
function updateDet(){const s=cur(); $('det').classList.toggle('off',!s.mode); patch($('in'),detHTML(s))}
function renderToday(){
  const fr=HELD0-held();
  $('today').innerHTML = X.autoUndone
   ? `<span class="lbl">Today</span><span class="txt">Auto reopened 2 apps and started 3 servers again${fr>.001?` · you freed <b>${fmt(fr)}</b>`:''}</span><button class="undo" id="redo">Redo</button>`
   : `<span class="lbl">Today</span><span class="txt">Auto closed <b>2 apps</b>, stopped <b>3 servers</b>${fr>.001?` · you freed <b>${fmt(fr)}</b>`:''}</span><button class="undo" id="undo">Undo</button>`;
}
function renderAll(){renderIdx(); updateDet(); renderToday(); applyHL(); tweens()}
function renderIcons(){
  const one=$('one').getAttribute('aria-checked')==='true', box=$('icons');
  if(!box.querySelector('.mi')) box.insertAdjacentHTML('beforeend',S.map(s=>`<span class="mi" id="mi-${s.id}" data-s="${s.id}" title="${s.name}">${gl(s.id,'#fff',16)}</span>`).join('')+`<span class="mi off" id="mi-one" title="MinMacs">${gl('one','#fff',16)}</span>`);
  S.forEach(s=>$('mi-'+s.id).classList.toggle('off',one||s.mode===0));
  $('mi-one').classList.toggle('off',!one);
  setTimeout(aim,420); aim();
}
function anchor(){
  const one=$('one').getAttribute('aria-checked')==='true';
  if(one) return $('mi-one');
  const s=cur(); if(s.mode) return $('mi-'+s.id);
  return [...document.querySelectorAll('.mi:not(.off)')][0]||null;
}
function aim(){
  const a=anchor(), hl=$('hl'), box=$('icons');
  if(!a){hl.style.opacity=0;return}
  const x=a.offsetLeft+8;
  hl.style.opacity=1; hl.style.transform=`translateX(${x-14}px)`;
  const st=$('stage'), k=st.getBoundingClientRect().width/1280;
  const bx=(box.getBoundingClientRect().left-st.getBoundingClientRect().left)/k;
  $('nub').style.transform=`translateX(${bx+x-$('sheet').offsetLeft-1}px)`;
}
function select(id){ if(id===sel) return; sel=id; HL=null; hovEl=null; renderIdx(); renderDet(true); aim() }
function goAgent(id){ FLASH=id; if(sel!=='agents') select('agents'); else applyHL(); setTimeout(applyHL,260) }
function setMode(m){const s=cur(); if(s.mode===m) return; UNDO.push(save()); s.mode=m; renderAll(); renderIcons(); toast(`${s.name} is now <b>${MODES[m]}</b>. ${['No marks on the graph.','What it acts on is outlined.','What it acts on is filled, with a time.'][m]}`,'Undo')}
let valPre=null;
function setVal(v,quiet){const s=cur(); if(v==null||s.v===v) return false; if(!valPre) valPre=save(); s.v=v; renderAll(); if(!quiet) commitVal(); return true}
function commitVal(){ if(!valPre) return; const s=cur(); UNDO.push(valPre); valPre=null; toast(`${s.name}: ${s.lab.toLowerCase()} <b>${s.vals[s.v]}</b>.`,'Undo') }

/* ---------- drag the rule ---------- */
let DRAG=null;
function svgPt(svg,e){const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(svg.getScreenCTM().inverse())}
document.addEventListener('pointerdown',e=>{
  const k=e.target.closest&&e.target.closest('[data-knob]'); if(!k) return;
  const svg=k.ownerSVGElement; DRAG={id:svg.dataset.hero,moved:0}; $('sheet').classList.add('drag'); e.preventDefault();
});
document.addEventListener('pointermove',e=>{
  if(!DRAG) return; const svg=document.querySelector(`svg[data-hero="${DRAG.id}"]`); if(!svg) return;
  const p=svgPt(svg,e); const v=HERO[DRAG.id].pick(p.x); if(setVal(v,true)) DRAG.moved=1;
});
document.addEventListener('pointerup',()=>{ if(!DRAG) return; DRAG=null; $('sheet').classList.remove('drag'); commitVal() });

document.addEventListener('click',e=>{
  const g=e.target.closest('[data-goto]'); if(g){e.stopPropagation();goAgent(g.dataset.goto);return}
  const sa=e.target.closest('[data-sa]'); if(sa){const [sid,i]=sa.dataset.sa.split(':');runSA(sid,+i);return}
  const ab=e.target.closest('.ab[data-act]'); if(ab){runAct(ab.dataset.act,ab.dataset.id,ab.dataset.l);return}
  const it=e.target.closest('.it'); if(it){select(it.dataset.s);return}
  const mb=e.target.closest('.legend button'); if(mb){setMode(+mb.dataset.m);return}
  const sn=e.target.closest('.snap'); if(sn){setVal(+sn.dataset.v);return}
  const vv=e.target.closest('[data-vv]'); if(vv){setVal(+vv.dataset.vv);return}
  const mi=e.target.closest('.mi'); if(mi&&mi.dataset.s){select(mi.dataset.s);return}
  if(e.target.closest('#undo')){UNDO.push(save());X.autoUndone=1;renderAll();toast('Reopened 2 apps and started 3 servers.','Undo');return}
  if(e.target.closest('#redo')){UNDO.push(save());X.autoUndone=0;renderAll();toast('Closed 2 apps and stopped 3 servers again.','Undo');return}
  const sw=e.target.closest('.sw'); if(sw){sw.setAttribute('aria-checked',String(sw.getAttribute('aria-checked')!=='true'));renderIcons()}
});
document.addEventListener('keydown',e=>{
  const k=e.target.closest&&e.target.closest('[data-knob]');
  if(k){const s=cur(), d={ArrowRight:1,ArrowUp:1,ArrowLeft:-1,ArrowDown:-1}[e.key]; if(!d) return; e.preventDefault();
    const dir=s.id==='apps'?d:d; setVal(Math.max(0,Math.min(s.vals.length-1,s.v+dir))); requestAnimationFrame(()=>{const n=document.querySelector('[data-knob]'); n&&n.focus()}); return}
  const it=e.target.closest&&e.target.closest('.it'); if(!it) return;
  const L=S.map(s=>s.id), i=L.indexOf(it.dataset.s);
  const j=e.key==='ArrowDown'?Math.min(L.length-1,i+1):e.key==='ArrowUp'?Math.max(0,i-1):-1;
  if(j<0) return; e.preventDefault(); select(L[j]); $('it-'+L[j]).focus();
});
document.addEventListener('focusin',e=>{const el=e.target.closest&&e.target.closest('[data-sa],.rw[data-row]');if(el){hovEl=el;setHL(el)}});

function fit(){const st=$('stage'),k=Math.min(innerWidth/1280,innerHeight/800);st.style.transform=`translate(${(innerWidth-1280*k)/2}px,${(innerHeight-800*k)/2}px) scale(${k})`;aim()}
addEventListener('resize',fit);
renderIdx(); renderDet(false); renderToday(); renderIcons(); fit(); tweens();
document.fonts&&document.fonts.ready.then(aim);
</script>
</body>
