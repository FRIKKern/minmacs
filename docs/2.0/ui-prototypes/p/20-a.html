<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Live Index</title>
<style>
:root{
  --glass:rgba(28,29,38,.88);
  --line:rgba(255,255,255,.06);
  --tx:rgba(255,255,255,.94);
  --tx2:rgba(235,235,245,.58);
  --tx3:rgba(235,235,245,.3);
  --g1:rgba(255,255,255,.07);
  --g2:rgba(255,255,255,.2);
  --g3:rgba(255,255,255,.42);
  --ease:cubic-bezier(.3,.7,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#1a1636}
body{font-family:-apple-system,"SF Pro Text",system-ui,sans-serif;color:var(--tx);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;font-size:13px;cursor:default;user-select:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;text-align:left}
b{font-weight:500}
:focus{outline:none}
:focus-visible{outline:2px solid rgba(255,255,255,.55);outline-offset:3px;border-radius:8px}
#stage{position:absolute;left:0;top:0;width:1280px;height:800px;transform-origin:0 0;overflow:hidden;
  background:
   radial-gradient(760px 560px at 10% 6%,#4b3c9e 0%,rgba(75,60,158,0) 70%),
   radial-gradient(700px 520px at 84% 2%,#22618f 0%,rgba(34,97,143,0) 70%),
   radial-gradient(820px 620px at 88% 104%,#a0436f 0%,rgba(160,67,111,0) 70%),
   radial-gradient(640px 520px at 18% 100%,#3a2463 0%,rgba(58,36,99,0) 75%),
   #1d1a3c}

/* menu bar */
.mb{position:absolute;left:0;right:0;top:0;height:26px;display:flex;align-items:center;justify-content:space-between;padding:0 12px 0 16px;background:rgba(18,14,40,.32);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);font-size:13px;color:rgba(255,255,255,.92);z-index:5}
.mb-l,.mb-r{display:flex;align-items:center;gap:18px}
.mb-l b{font-weight:700}
.mb-r{gap:14px}
.icons{position:relative;display:flex;align-items:center;gap:12px}
.hl{position:absolute;top:-3px;height:22px;width:28px;border-radius:6px;background:rgba(255,255,255,.2);transition:transform .45s var(--ease),opacity .3s;pointer-events:none}
.mi{position:relative;display:flex;width:16px;overflow:hidden;cursor:pointer;transition:width .4s var(--ease),opacity .3s,margin .4s var(--ease)}
.mi.off{width:0;opacity:0;margin-left:-12px}

/* sheet */
.sheet{position:absolute;top:34px;left:440px;width:760px;background:var(--glass);backdrop-filter:blur(36px) saturate(1.5);-webkit-backdrop-filter:blur(36px) saturate(1.5);border:1px solid rgba(255,255,255,.085);border-radius:22px;box-shadow:0 34px 100px rgba(6,4,24,.5),inset 0 1px 0 rgba(255,255,255,.035);animation:drop .6s var(--ease) both}
@keyframes drop{from{opacity:0;transform:translateY(-10px)}}
.nub{position:absolute;top:-8px;left:0;width:18px;height:8px;margin-left:-9px;transition:transform .45s var(--ease)}
.nub svg{display:block}

.head{display:flex;align-items:center;gap:12px;height:54px;padding:0 30px;white-space:nowrap}
.head .lbl{font-size:12px;color:var(--tx3)}
.head .txt{font-size:13px;color:var(--tx2)}
.head .txt b{color:var(--tx)}
.head .undo{margin-left:auto;font-size:13px;font-weight:500;padding:4px 12px;border-radius:12px;background:rgba(255,255,255,.07);transition:background .2s}
.head .undo:hover{background:rgba(255,255,255,.13)}

.body{display:grid;padding:4px 30px 22px;height:510px}

/* ---------- left column: the live index ---------- */
.idx{display:flex;flex-direction:column}
.leg{font-size:11px;color:var(--tx3);height:22px;line-height:14px;white-space:nowrap;display:flex;align-items:flex-start;gap:6px}
.leg i{display:inline-block;width:12px;height:5px;border-radius:3px;margin-top:5px;background:linear-gradient(90deg,#5B9BFF,#3FD0B8 30%,#4CC96B 50%,#F2B544 72%,#B18CFF)}
.it .dot{flex:none;width:9px;height:9px;border-radius:50%;box-shadow:inset 0 0 0 1.5px rgba(235,235,245,.28);transition:background .35s,box-shadow .35s}
.it .nm{font-weight:600;letter-spacing:-.022em;color:rgba(235,235,245,.36);transition:color .3s;white-space:nowrap}
.it:hover .nm{color:var(--tx2)}
.it.sel .nm{color:var(--tx)}
.mg,.tg{transition:opacity .4s,filter .4s}
.it.m0 .mg,.it.m0 .tg{opacity:.28;filter:grayscale(1)}
.mg i,.tg i{display:block;transition:height .55s var(--ease),width .55s var(--ease),left .55s var(--ease),flex-grow .55s var(--ease),background .35s,opacity .35s,box-shadow .35s}

/* variant a: graph inline to the right of the name */
.va .body{grid-template-columns:318px 1fr;column-gap:34px}
.va .leg{justify-content:flex-end}
.va .it{display:flex;align-items:center;gap:12px;height:88px}
.va .it .nm{flex:1;font-size:25px}
.va .mg{flex:none;position:relative;width:56px;height:24px;display:flex;align-items:flex-end;justify-content:space-between}
.va .mg .tr{position:absolute;left:0;right:0;top:9px;height:6px;border-radius:3px;background:var(--g1)}
.va .mg .tr i{position:absolute;top:0;bottom:0;border-radius:3px}
.va .mg .tr .tk{top:-4px;bottom:-4px;width:2px;margin-left:-1px;border-radius:1px;background:#fff}
.va .mg.mc i{flex:none;border-radius:2px}
.va .mg.dots{flex-wrap:wrap;align-content:center;justify-content:space-between;row-gap:4px}
.va .mg.dots i{width:6px;height:6px;border-radius:50%}
.va .mg.ring{justify-content:flex-end;align-items:center}
.va .nb{flex:none;width:84px;display:flex;flex-direction:column;align-items:flex-end;white-space:nowrap}
.va .nb .n{font-size:16px;font-weight:500;line-height:19px;color:var(--tx2);transition:color .3s}
.va .nb .n u{text-decoration:none;font-size:11px;font-weight:400;color:var(--tx3);margin-left:3px}
.va .nb .cp{font-size:11px;line-height:15px;color:var(--tx3)}
.va .it.sel .nb .n{color:var(--tx)}
.va .it.m0 .nb .n{color:var(--tx3);font-weight:400;font-size:13px}
.va .x{display:none}

/* variant b: two-line block, thin full-width graph, one number */
.vb .body{grid-template-columns:246px 1fr;column-gap:40px}
.vb .leg{padding-left:21px}
.vb .it{display:block;width:100%;height:86px;padding-top:6px}
.vb .top{display:flex;align-items:center;gap:12px;height:30px}
.vb .it .nm{font-size:23px}
.vb .it .md{margin-left:auto;font-size:12px;color:var(--tx3);transition:color .3s}
.vb .it.sel .md{color:var(--tx2)}
.vb .tg{position:relative;display:flex;gap:2px;height:6px;margin:9px 0 0 21px}
.vb .tg i{height:6px;border-radius:3px;flex-basis:0}
.vb .tg.abs{display:block;border-radius:3px;background:var(--g1)}
.vb .tg.abs i{position:absolute;top:0}
.vb .tg.abs .tk{top:-4px;height:14px;width:2px;margin-left:-1px;border-radius:1px;background:#fff}
.vb .cp{display:block;margin:9px 0 0 21px;font-size:12px;color:var(--tx3);white-space:nowrap;transition:color .3s}
.vb .cp b{color:var(--tx2);transition:color .3s}
.vb .it.sel .cp{color:var(--tx2)}
.vb .it.sel .cp b{color:var(--tx)}

/* ---------- right pane ---------- */
.det{position:relative;min-width:0}
.det .in{transition:opacity .22s,transform .35s var(--ease)}
.det .in.swap{opacity:0;transform:translateY(6px)}
.lab{display:flex;align-items:center;height:16px;font-size:12px;color:var(--tx3);white-space:nowrap}
.lab .key{margin-left:auto;display:flex;align-items:center;gap:6px;color:var(--tx2);transition:opacity .3s}
.mk{flex:none;width:7px;height:7px;border-radius:50%;transition:background .35s,box-shadow .35s,opacity .35s}
.mk.a{background:var(--c)}
.mk.s{box-shadow:inset 0 0 0 1.5px var(--c)}
.mk.n{opacity:0}
.big{display:flex;align-items:baseline;gap:6px;white-space:nowrap;height:44px;margin-top:4px}
.big .n{font-size:40px;font-weight:500;letter-spacing:-.02em;line-height:44px}
.big .u{font-size:15px;color:var(--tx2)}
.big .n2{margin-left:auto;font-size:13px;color:var(--tx2)}
.big .n2 b{color:var(--tx)}
.say{margin-top:4px;font-size:14px;line-height:20px;color:var(--tx2);min-height:20px}
.say b{color:var(--tx)}
.gr{margin-top:14px;transition:opacity .4s,filter .4s}
.det.off .gr,.det.off .rows .ic{filter:grayscale(1);opacity:.45}
.mt+.mt{margin-top:10px}
.mt .hd{display:flex;align-items:baseline;justify-content:space-between;height:16px;font-size:12px;color:var(--tx3);white-space:nowrap}
.mt .hd b{color:var(--tx)}
.mt .hd span:last-child{color:var(--tx2)}
.tb{position:relative;height:6px;margin-top:6px;border-radius:3px;background:var(--g1)}
.tb i{position:absolute;top:0;bottom:0;border-radius:3px;transition:left .55s var(--ease),width .55s var(--ease),background .35s}
.tb .tk{top:-4px;bottom:-4px;width:2px;margin-left:-1px;border-radius:1px;background:#fff}
.tb.seg{display:flex;gap:2px;background:none}
.tb.seg i{position:static;flex-basis:0;transition:flex-grow .55s var(--ease),background .35s}
.tl{position:relative;height:14px;font-size:10.5px;color:var(--tx3)}
.tl span{position:absolute;top:3px;transform:translateX(-50%);white-space:nowrap;transition:left .55s var(--ease)}
.cols{display:flex;align-items:flex-end;gap:5px;height:56px}
.cols .cl{flex:1;position:relative;height:100%;border-radius:4px;background:rgba(255,255,255,.04)}
.cols .cl i{position:absolute;left:0;right:0;bottom:0;border-radius:4px;transition:height .55s var(--ease),background .35s,box-shadow .35s}
.cleg{display:flex;gap:11px;margin-top:8px;font-size:11px;color:var(--tx3);white-space:nowrap}
.cleg span{display:flex;align-items:center;gap:5px}
.cleg i{width:8px;height:8px;border-radius:2px}

.rows{margin-top:12px}
.rw{display:flex;align-items:center;gap:8px;height:24px;font-size:13px;white-space:nowrap}
.rw .ic{flex:none;display:flex;width:18px;justify-content:center;transition:opacity .4s,filter .4s}
.rw .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.rw .nm .x,.rw .g{color:var(--tx3)}
.rw .v{flex:none;width:52px;text-align:right;color:var(--tx2)}
.rw .v2{flex:none;width:38px;text-align:right;color:var(--tx3)}
.rw .st{flex:none;width:80px;text-align:right;color:var(--tx3);transition:color .35s}
.rw.on .st{color:var(--c)}
.rw.dim .nm{color:var(--tx3)}
.rw .ow{flex:none;width:96px;color:var(--tx3);overflow:hidden;text-overflow:ellipsis}
.r-apps .st{width:72px}
.r-servers .rw{gap:7px}.r-servers .nm{flex:none;width:46px}.r-servers .ow{flex:1;width:auto;min-width:0}.r-servers .v{width:50px}.r-servers .st{width:102px}
.vb .r-servers .nm{width:108px}
.vb .r-apps .rw{gap:7px}
.vb .r-trees .nm{flex:none;width:92px}.vb .r-trees .ow{flex:1;width:auto}
.r-disk .st{width:92px}
.r-awake .ow{width:84px}.r-awake .st{width:90px}
.more{height:20px;padding-left:16px;font-size:12px;line-height:20px;color:var(--tx3);white-space:nowrap}

.set{margin-top:12px;padding-top:8px;border-top:1px solid var(--line)}
.modes{position:relative;display:flex;gap:24px;height:42px;align-items:flex-start;margin-top:6px}
.modes button{font-size:28px;font-weight:600;letter-spacing:-.02em;line-height:34px;color:var(--tx3);transition:color .3s}
.modes button:hover{color:var(--tx2)}
.modes button[aria-checked="true"]{color:var(--tx)}
.bar{position:absolute;left:0;top:38px;height:2px;border-radius:1px;background:var(--c);transition:transform .45s var(--ease),width .45s var(--ease),background .35s,opacity .3s}
.rule{margin-top:6px;font-size:14px;line-height:20px;color:var(--tx2)}
.opts{display:flex;gap:18px;height:26px;margin-top:8px;align-items:flex-start;white-space:nowrap;transition:opacity .3s}
.opts button{position:relative;font-size:15px;color:var(--tx3);line-height:20px;transition:color .25s}
.opts button:hover{color:var(--tx2)}
.opts button[aria-checked="true"]{color:var(--tx);font-weight:500}
.opts button[aria-checked="true"]::after{content:"";position:absolute;left:50%;bottom:-5px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--c)}
.det.off .opts{opacity:.3;pointer-events:none}
.det.off .big .n{font-size:22px;color:var(--tx3)}

.foot{display:flex;align-items:center;gap:28px;height:54px;padding:0 30px;border-top:1px solid var(--line)}
.sw{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--tx2);transition:color .2s}
.sw i{width:32px;height:19px;border-radius:10px;background:rgba(255,255,255,.14);position:relative;transition:background .25s;flex:none}
.sw i::after{content:"";position:absolute;left:2px;top:2px;width:15px;height:15px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .25s var(--ease)}
.sw[aria-checked="true"]{color:var(--tx)}
.sw[aria-checked="true"] i{background:#5B9BFF}
.sw[aria-checked="true"] i::after{transform:translateX(13px)}
.foot .hint{margin-left:auto;font-size:11px;color:var(--tx3)}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important}}
</style>
</head>

  {id:'servers',name:'Servers',c:'#3FD0B8',mode:2,lab:'Unused for',vals:['30 min','1 h','2 h','4 h','1 day'],num:[30,60,120,240,1440],v:2},
  {id:'trees',name:'Worktrees',c:'#4CC96B',mode:1,lab:'After merge',vals:['1 h','1 day','1 week'],num:[1/24,1,7],v:1},
  {id:'disk',name:'Disk',c:'#F2B544',mode:2,lab:'How often',vals:['daily','weekly','monthly'],v:1},
  {id:'awake',name:'Keep Awake',c:'#B18CFF',mode:2,lab:'Ends at battery',vals:['10 %','20 %','30 %','never'],num:[10,20,30,0],v:1}

const NEXT=['tonight','on Sunday','on 1 Nov'], NEXTS=['tonight','Sunday','1 Nov'];
let sel='apps', undone=false;
const $=id=>document.getElementById(id);
const cur=()=>S.find(s=>s.id===sel);
const sec=id=>S.find(s=>s.id===id);

/* ---------- derived live state ---------- */
const thr=s=>s.num?s.num[s.v]:0;
const hhmm=m=>{const t=16*60+42+m, d=t>=1440, x=t%1440; return d?'tomorrow':String(Math.floor(x/60)).padStart(2,'0')+':'+String(x%60).padStart(2,'0')};
const fmtIdle=m=>m>=1440?Math.round(m/1440)+' days':m>=60?Math.round(m/60)+' h':m+' min';
const treeReady=s=>WT.filter(w=>w.k==='m'&&w.d>=thr(s));
const treeGB=s=>treeReady(s).reduce((a,w)=>a+w.gb,0);
const f1=x=>(Math.round(x*10)/10).toFixed(1);
const f2=x=>x.toFixed(2).replace(/0$/,'');
const verb={apps:['','Ask shows','Auto frees'],servers:['','Ask shows','Auto stops'],trees:['','Ask shows','Auto removes'],disk:['','Ask shows','Auto cleans'],awake:['','Ask asks first','keep it awake']};

/* ---------- small drawing helpers ---------- */
function arc(p,col,sz,sw,op){
  return `<svg viewBox="0 0 20 20" width="${sz}" height="${sz}" aria-hidden="true"><circle cx="10" cy="10" r="7.6" fill="none" stroke="rgba(255,255,255,.1)" stroke-width="${sw}"/><circle cx="10" cy="10" r="7.6" fill="none" stroke="${col}" stroke-width="${sw}" stroke-linecap="round" pathLength="100" transform="rotate(-90 10 10)" style="stroke-dasharray:100;stroke-dashoffset:${100-Math.max(0,Math.min(100,p))};opacity:${p>0?(op??1):0};transition:stroke-dashoffset .6s var(--ease),stroke .35s,opacity .35s"/></svg>`;
}
const ICON={
  chrome:`<svg viewBox="0 0 18 18" width="17" height="17"><path d="M9 9L2.07 5A8 8 0 0 1 15.93 5Z" fill="#E8453C"/><path d="M9 9L15.93 5A8 8 0 0 1 9 17Z" fill="#F7BE2D"/><path d="M9 9L9 17A8 8 0 0 1 2.07 5Z" fill="#33A853"/><circle cx="9" cy="9" r="3.9" fill="#fff"/><circle cx="9" cy="9" r="3" fill="#4285F4"/></svg>`,
  cft:`<svg viewBox="0 0 18 18" width="17" height="17"><path d="M9 9L2.07 5A8 8 0 0 1 15.93 5Z" fill="#8f97a6"/><path d="M9 9L15.93 5A8 8 0 0 1 9 17Z" fill="#b7bdc8"/><path d="M9 9L9 17A8 8 0 0 1 2.07 5Z" fill="#6d7584"/><circle cx="9" cy="9" r="3.9" fill="#fff"/><circle cx="9" cy="9" r="3" fill="#7c8698"/></svg>`,
  spotify:`<svg viewBox="0 0 18 18" width="17" height="17"><circle cx="9" cy="9" r="8" fill="#1DB954"/><path d="M4.6 6.9c3-.9 6.1-.6 8.8.8M5.1 9.3c2.4-.7 4.9-.4 7 .7M5.6 11.6c1.9-.5 3.7-.3 5.3.5" fill="none" stroke="#0b1a10" stroke-width="1.25" stroke-linecap="round"/></svg>`,
  cmux:`<svg viewBox="0 0 18 18" width="17" height="17"><rect x="1" y="1" width="16" height="16" rx="4.2" fill="#2c2d3a"/><path d="M5 6.4l2.6 2.6L5 11.6M9.4 11.8h3.6" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
  cc:`<svg viewBox="0 0 18 18" width="17" height="17"><circle cx="9" cy="9" r="8" fill="#3a2a26"/><path d="M9 4.3v9.4M4.9 6.6l8.2 4.8M4.9 11.4l8.2-4.8" stroke="#E5896B" stroke-width="1.6" stroke-linecap="round"/></svg>`,
  cx:`<svg viewBox="0 0 18 18" width="17" height="17"><circle cx="9" cy="9" r="8" fill="#2b2d33"/><path d="M9 4.6l3.8 2.2v4.4L9 13.4l-3.8-2.2V6.8z" fill="none" stroke="#e9ebf0" stroke-width="1.4" stroke-linejoin="round"/></svg>`,
  cu:`<svg viewBox="0 0 18 18" width="17" height="17"><circle cx="9" cy="9" r="8" fill="#26272e"/><path d="M5.4 4.9l7.6 3.4-3.3 1.1-1.1 3.4z" fill="#e9ebf0"/></svg>`
};
const mk=(on,s)=>`<i class="mk ${on?(s.mode===2?'a':'s'):'n'}"></i>`;

/* ---------- left column: live minis ---------- */
function miniA(s){
  const c=s.c;
  if(s.id==='apps') return `<span class="mg"><span class="tr"><i style="left:0;width:${LOAD-NOISE}%;background:var(--g2)"></i><i style="left:${LOAD-NOISE}%;width:${NOISE}%;background:${c}"></i><i class="tk" style="left:${thr(s)}%"></i></span></span>`;
  if(s.id==='servers') return `<span class="mg mc">${SRV.map(x=>`<i style="width:7px;height:${Math.round(5+x.mb/640*19)}px;background:${x.idle?c:x.use?'var(--g3)':'var(--g2)'}"></i>`).join('')}</span>`;
  if(s.id==='trees'){const t=thr(s);return `<span class="mg mc">${WT.map(w=>`<i style="width:2.6px;height:${Math.round(4+w.gb/3.2*20)}px;background:${w.k==='m'?c:w.k==='u'?'var(--g3)':'var(--g2)'};opacity:${w.k==='m'&&w.d<t?.35:1}"></i>`).join('')}</span>`}
  if(s.id==='disk') return `<span class="mg ring">${arc(30.1/38.4*100,c,24,2.6)}</span>`;
  return `<span class="mg dots">${AG.map(a=>`<i style="background:${a.st==='w'?c:a.st==='n'?'transparent':'var(--g2)'};box-shadow:${a.st==='n'?'inset 0 0 0 1.4px var(--g3)':'none'}"></i>`).join('')}</span>`;

function numA(s){
  const off=!s.mode;
  const n={apps:[NOISE,'%'],servers:[3,'idle'],trees:[f1(treeGB(sec('trees'))),'GB'],disk:['30.1','GB'],awake:[4,'agents']}[s.id];
  return `<span class="nb"><span class="n">${off?'Off':n[0]}<u>${off?'':n[1]}</u></span><span class="cp">${off?(s.id==='awake'?'sleeps as usual':'not watching'):verb[s.id][s.mode]}</span></span>`;
}
function thinB(s){
  const c=s.c;
  if(s.id==='apps') return `<span class="tg abs"><i style="left:0;width:${LOAD-NOISE}%;height:6px;background:var(--g2)"></i><i style="left:${LOAD-NOISE}%;width:${NOISE}%;height:6px;background:${c}"></i><i class="tk" style="left:${thr(s)}%"></i></span>`;
  if(s.id==='servers') return `<span class="tg">${SRV.map(x=>`<i style="flex-grow:${x.mb};background:${x.idle?c:x.use?'var(--g3)':'var(--g2)'}"></i>`).join('')}</span>`;
  if(s.id==='trees'){const t=thr(s);return `<span class="tg">${WT.map(w=>`<i style="flex-grow:${w.gb};background:${w.k==='m'?c:w.k==='u'?'var(--g3)':'var(--g2)'};opacity:${w.k==='m'&&w.d<t?.35:1}"></i>`).join('')}</span>`}

function capB(s){

}
function keyLine(s,word){
  return `<span class="key" style="opacity:${s.mode?1:0}"><i class="mk ${s.mode===2?'a':'s'}"></i>${s.mode===2?'Auto':'Ask'} ${s.mode===2?word[0]:word[1]}</span>`;
}
function now(s){
  const m=s.mode, T=thr(s);
  if(s.id==='apps'){
    const over=LOAD>T;
    return {
      key:keyLine(s,['closes these','shows these']),
      big:[LOAD,'% load',undone?'<b>2</b> reopened':'<b>2</b> closed today'],
      say:!m?'Chrome and Spotify are the noisiest apps right now.':over?`Over the ${T} % line, so ${m===2?'Chrome and Spotify are closing':'you are asked to close Chrome and Spotify'}.`:`Under the ${T} % line, so nothing closes yet. Above it, Chrome and Spotify ${m===2?'go':'are shown'}.`,
      gr:meter(`Load <b>${LOAD}</b> %`,`${m?verb.apps[m]:'Noise'} <b>${NOISE}</b> %`,[[0,LOAD-NOISE,'var(--g2)'],[LOAD-NOISE,NOISE,s.c]],T,`${T} %`)+
         meter(`Memory <b>24.1</b> / 32 GB`,`${m?verb.apps[m]:'Noise'} <b>9.3</b> GB`,[[0,46.2,'var(--g2)'],[46.2,29.1,s.c]]),
      rows:APPROWS.map(r=>{const on=r.act&&m; return `<div class="rw${on?' on':''}${r.keep?' dim':''}">${mk(on,s)}<span class="ic">${ICON[r.ic]}</span><span class="nm">${r.n}<span class="x"> · ${r.x}</span></span><span class="v2">${r.cpu}</span><span class="v">${r.mem}</span><span class="st">${r.keep?r.keep:!m?'noise':over?(m===2?'closes now':'shown now'):`at ${T} %`}</span></div>`}).join('')
    };
  }
  if(s.id==='servers'){
    return {
      key:keyLine(s,['stops these','shows these']),
      big:[3,'idle',undone?'<b>3</b> started again':'<b>3</b> stopped today'],
      say:':6006 storybook has been idle 3 days and nobody owns it.',
      gr:`<div class="mt"><div class="hd"><span>Memory <b>2.19</b> GB</span><span>${m?verb.servers[m]:'Idle'} <b>1.45</b> GB</span></div><div class="tb seg">${SRV.map(x=>`<i style="flex-grow:${x.mb};background:${x.idle?s.c:x.use?'var(--g3)':'var(--g2)'}"></i>`).join('')}</div></div>`,
      rows:SRV.map(x=>{

        const ring=x.use?arc(100,'var(--g3)',16,2.4):x.kept?arc(100,'var(--g2)',16,2.4):arc(Math.min(100,x.idle/T*100),s.c,16,2.4);
        return `<div class="rw${on?' on':''}${x.use||x.kept?' dim':''}">${mk(on,s)}<span class="ic">${ring}</span><span class="nm">${x.p}<span class="x"> ${x.k}</span></span><span class="ow">${x.o}</span><span class="v">${x.mb} MB</span><span class="st">${st}</span></div>`}).join('')
       +`<div class="more">Ring fills until the server ${m===1?'is shown':'stops'}</div>`

      big:[4,'merged',`<b>${f1(gb)}</b> GB ready to free`],
      say:'auth-redirect still has server :4000 running. It stops with the worktree.',
      gr:`<div class="cols">${WT.map(w=>{const r=w.k==='m'&&w.d>=T; return `<div class="cl"><i style="height:${Math.round(8+w.gb/3.2*48)}px;background:${w.k==='m'?s.c:w.k==='u'?'var(--g3)':w.k==='s'?'transparent':'var(--g2)'};opacity:${w.k==='m'&&!r?.35:1};box-shadow:${w.k==='s'?'inset 0 0 0 1.5px var(--g3)':'none'}"></i></div>`}).join('')}</div>
         <div class="cleg"><span>Height = size</span><span><i style="background:${s.c}"></i>merged</span><span><i style="background:${s.c};opacity:.35"></i>waiting</span><span><i style="box-shadow:inset 0 0 0 1.5px var(--g3)"></i>stale</span><span><i style="background:var(--g3)"></i>in use</span><span><i style="background:var(--g2)"></i>fine</span></div>`,
      rows:WT.filter(w=>w.k==='m').map(w=>{const r=w.d>=T, on=r&&m; const st=!m?w.d+' days ago':r?(m===2?'goes now':'shown now'):'in '+Math.ceil(T-w.d)+' days';
        return `<div class="rw${on?' on':''}">${mk(on,s)}<span class="ic">${gl('trees',r?s.c:'var(--g3)',14)}</span><span class="nm">${w.n}</span><span class="ow x">merged ${w.d} days ago</span><span class="v">${w.gb<1?Math.round(w.gb*1000)+' MB':w.gb+' GB'}</span><span class="st">${st}</span></div>`}).join('')
    };
  }
  if(s.id==='disk'){
    const nx=NEXTS[s.v];
    let acc=0;
    return {
      key:keyLine(s,['cleans these','shows these']),
      big:['30.1','GB safe',m===2?'next '+NEXT[s.v]:m===1?'check '+NEXT[s.v]:''],
      say:'DerivedData is the largest. 4 of its 7 projects no longer exist.',
      gr:meter(`Disk <b>812</b> / 994 GB`,`<b>182</b> GB free`,[[0,77.83,'var(--g2)'],[77.83,.84,'var(--g3)'],[78.67,3.03,s.c]])+
         `<div class="mt"><div class="hd"><span>Clutter <b>38.4</b> GB</span><span>${m?verb.disk[m]:'Safe'} <b>30.1</b> GB</span></div><div class="tb seg">${DK.map(d=>`<i style="flex-grow:${d.gb};background:${d.safe?s.c:'var(--g2)'}"></i>`).join('')}</div></div>`,
      rows:DK.map(d=>{const on=d.safe&&m; const st=d.rep?'report only':!d.safe?'you decide':!m?'safe':m===2?'Trash '+nx:'shown '+nx;
        return `<div class="rw${on?' on':''}${d.safe?'':' dim'}">${mk(on,s)}<span class="ic"><i style="display:block;width:9px;height:9px;border-radius:3px;background:${d.safe?s.c:'var(--g2)'}"></i></span><span class="nm">${d.n}<span class="x">${d.x?' · '+d.x:''}</span></span><span class="v">${d.gb} GB</span><span class="st">${st}</span></div>`}).join('')
    };
  }
  // awake
  const bt=thr(s);
  return {
    key:keyLine(s,['keeps it awake for these','asks for these']),

    say:m===2?`Awake while they work. Sleeps after the last one${bt?`, at ${bt} % battery`:''}, on lost network or heat.`:m===1?'You are asked each time one of them starts.':'They are working, but the Mac sleeps as usual.',
    gr:meter(`Battery <b>64</b> % · on power`,bt?`${m===2?'Sleeps':'Ends'} at <b>${bt}</b> %`:'Battery never ends it',[[0,64,'rgba(255,255,255,.55)']],bt||0,bt?`${bt} %`:''),
    rows:AG.slice(0,6).map(a=>{const on=a.st==='w'&&m;
      return `<div class="rw${on?' on':''}${a.st==='i'?' dim':''}">${mk(on,s)}<span class="ic">${ICON[a.t]}</span><span class="nm">${a.n}<span class="x">${a.w?' · '+a.w:''}</span></span><span class="ow">${TOOL[a.t]}</span><span class="st">${a.a}</span></div>`}).join('')
     +`<div class="more">fix auth redirect finished 2h ago · 5 more idle over 1 h</div>`
  };
}
function rule(s){
  const T=s.vals[s.v], m=s.mode;
  return ({
    apps:['Not watching apps.',`Shows noise apps to close when load is above ${T}.`,`Closes noise apps when load is above ${T}.`],
    servers:['Not watching servers.',`Shows localhost servers nobody used for ${T}.`,`Stops localhost servers nobody used for ${T}.`],
    trees:['Not watching worktrees.',`Shows worktrees ${T} after they merge.`,`Removes worktrees ${T} after merge. Undo restores.`],
    disk:['Not watching the disk.',`Shows clutter that is safe to clean, ${T}.`,`Moves safe clutter to the Trash, ${T}.`],
    awake:['The Mac sleeps as usual.','Asks when an agent starts working.',`Awake while agents work${s.v===3?'.':`, until ${T} battery.`}`]
  })[s.id][m];
}
function detHTML(s){
  const n=now(s), off=!s.mode;
  const big=off?[s.id==='awake'?'Sleeps as usual':'Not watching','','']:n.big;
  return `<div class="lab">Right now${n.key}</div>
    <div class="big"><span class="n">${big[0]}</span><span class="u">${big[1]}</span><span class="n2">${big[2]}</span></div>
    <p class="say">${n.say}</p>

      <p class="rule">${rule(s)}</p>

    </div>`;
}

/* ---------- morph: update in place so CSS eases every value ---------- */
function morph(a,b){
  if(a.nodeType!==b.nodeType||a.nodeName!==b.nodeName){a.replaceWith(b.cloneNode(true));return}
  if(a.nodeType===3){if(a.nodeValue!==b.nodeValue)a.nodeValue=b.nodeValue;return}
  if(a.nodeType!==1)return;
  if(a.hasAttribute('data-keep'))return;
  for(const at of [...b.attributes]) if(a.getAttribute(at.name)!==at.value) a.setAttribute(at.name,at.value);
  for(const at of [...a.attributes]) if(!b.hasAttribute(at.name)) a.removeAttribute(at.name);
  const ac=[...a.childNodes], bc=[...b.childNodes];
  if(ac.length!==bc.length){a.replaceChildren(...bc.map(n=>n.cloneNode(true)));return}
  ac.forEach((n,i)=>morph(n,bc[i]));
}
function patch(el,html){const t=document.createElement(el.tagName);t.innerHTML=html;
  if(!el.childNodes.length){el.innerHTML=html;return}
  const ac=[...el.childNodes], bc=[...t.childNodes];
  if(ac.length!==bc.length){el.innerHTML=html;return}
  ac.forEach((n,i)=>morph(n,bc[i]));
}

function placeBar(instant){
  const s=cur(), b=$('bar'), t=document.querySelector(`.modes button[data-m="${s.mode}"]`);
  if(!b||!t) return;
  if(instant) b.style.transition='none';
  b.style.width=t.offsetWidth+'px'; b.style.transform=`translateX(${t.offsetLeft}px)`;
  b.style.opacity=s.mode?1:.35;
  if(instant){ void b.offsetWidth; b.style.transition='' }
}
function renderIdx(){patch($('idx'),idxHTML())}
function renderDet(animate){
  const s=cur(), d=$('det'), inn=$('in');
  d.style.setProperty('--c',s.c);
  const fill=()=>{inn.innerHTML=detHTML(s); d.classList.toggle('off',!s.mode); placeBar(true)};
  if(!animate){fill();return}
  inn.classList.add('swap');
  setTimeout(()=>{fill();requestAnimationFrame(()=>inn.classList.remove('swap'))},170);
}
function updateDet(){
  const s=cur(); $('det').classList.toggle('off',!s.mode);
  patch($('in'),detHTML(s)); placeBar(false);
}

  if(!box.querySelector('.mi')) box.insertAdjacentHTML('beforeend',S.map(s=>`<span class="mi" id="mi-${s.id}" data-s="${s.id}" title="${s.name}">${gl(s.id,'#fff',16)}</span>`).join('')+`<span class="mi off" id="mi-one" title="MinMacs">${gl('one','#fff',16)}</span>`);
  S.forEach(s=>$('mi-'+s.id).classList.toggle('off',one||s.mode===0));
  $('mi-one').classList.toggle('off',!one);
  setTimeout(aim,420); aim();
}
function anchor(){
  const one=$('one').getAttribute('aria-checked')==='true';
  if(one) return $('mi-one');
  const s=cur(); if(s.mode) return $('mi-'+s.id);
  return [...document.querySelectorAll('.mi:not(.off)')][0]||null;
}
function aim(){
  const a=anchor(), hl=$('hl'), box=$('icons');
  if(!a){hl.style.opacity=0;return}
  const x=a.offsetLeft+8;
  hl.style.opacity=1; hl.style.transform=`translateX(${x-14}px)`;
  const st=$('stage'), k=st.getBoundingClientRect().width/1280;
  const bx=(box.getBoundingClientRect().left-st.getBoundingClientRect().left)/k;
  $('nub').style.transform=`translateX(${bx+x-441}px)`;
}
function select(id){
  if(id===sel) return; sel=id;
  renderIdx(); renderDet(true); aim();
}
function setMode(m){
  const s=cur(); if(s.mode===m) return; s.mode=m;
  renderIdx(); updateDet(); renderIcons();
}

document.addEventListener('click',e=>{
  const it=e.target.closest('.it'); if(it){select(it.dataset.s);return}
  const mb=e.target.closest('.modes button'); if(mb){setMode(+mb.dataset.m);return}
  const ob=e.target.closest('.opts button'); if(ob){cur().v=+ob.dataset.v;renderIdx();updateDet();return}
  const mi=e.target.closest('.mi'); if(mi&&mi.dataset.s){select(mi.dataset.s);return}
  if(e.target.closest('#undo')){undone=true;renderToday();updateDet();return}
  if(e.target.closest('#redo')){undone=false;renderToday();updateDet();return}
  const sw=e.target.closest('.sw'); if(sw){sw.setAttribute('aria-checked',String(sw.getAttribute('aria-checked')!=='true'));renderIcons()}
});
document.addEventListener('keydown',e=>{
  const it=e.target.closest&&e.target.closest('.it'); if(!it) return;
  const i=S.findIndex(s=>s.id===it.dataset.s);
  const j=e.key==='ArrowDown'?Math.min(4,i+1):e.key==='ArrowUp'?Math.max(0,i-1):-1;
  if(j<0) return; e.preventDefault(); select(S[j].id); $('it-'+S[j].id).focus();
});

function fit(){const st=$('stage'),k=Math.min(innerWidth/1280,innerHeight/800);st.style.transform=`translate(${(innerWidth-1280*k)/2}px,${(innerHeight-800*k)/2}px) scale(${k})`;aim()}
addEventListener('resize',fit);
renderIdx(); renderDet(false); renderToday(); renderIcons(); fit();
document.fonts&&document.fonts.ready.then(()=>{placeBar(true);aim()});
</script>
</body>
</html>
