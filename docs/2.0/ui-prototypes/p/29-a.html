<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Suggestion Stack</title>
<style>
:root{
  --glass:rgba(28,29,38,.88);
  --line:rgba(255,255,255,.06);
  --tx:rgba(255,255,255,.94);
  --tx2:rgba(235,235,245,.6);
  --tx3:rgba(235,235,245,.32);
  --g1:rgba(255,255,255,.07);
  --g2:rgba(255,255,255,.2);
  --g3:rgba(255,255,255,.42);
  --rowbg:#2a2a38;
  --ease:cubic-bezier(.3,.7,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#1a1636}
body{font-family:-apple-system,"SF Pro Text",system-ui,sans-serif;color:var(--tx);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;font-size:13px;cursor:default;user-select:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;text-align:left}
b{font-weight:500}
:focus{outline:none}
:focus-visible{outline:2px solid rgba(255,255,255,.55);outline-offset:2px;border-radius:8px}
#stage{position:absolute;left:0;top:0;width:1280px;height:800px;transform-origin:0 0;overflow:hidden;
  background:
   radial-gradient(760px 560px at 10% 6%,#4b3c9e 0%,rgba(75,60,158,0) 70%),
   radial-gradient(700px 520px at 84% 2%,#22618f 0%,rgba(34,97,143,0) 70%),
   radial-gradient(820px 620px at 88% 104%,#a0436f 0%,rgba(160,67,111,0) 70%),
   radial-gradient(640px 520px at 18% 100%,#3a2463 0%,rgba(58,36,99,0) 75%),
   #1d1a3c}

/* menu bar */
.mb{position:absolute;left:0;right:0;top:0;height:26px;display:flex;align-items:center;justify-content:space-between;padding:0 12px 0 16px;background:rgba(18,14,40,.32);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);font-size:13px;color:rgba(255,255,255,.92);z-index:5}
.mb-l,.mb-r{display:flex;align-items:center;gap:18px}
.mb-l b{font-weight:700}
.mb-r{gap:14px}
.icons{position:relative;display:flex;align-items:center;gap:12px}
.hl{position:absolute;top:-3px;height:22px;width:28px;border-radius:6px;background:rgba(255,255,255,.2);transition:transform .45s var(--ease),opacity .3s;pointer-events:none}
.mi{position:relative;display:flex;width:16px;overflow:hidden;cursor:pointer;transition:width .4s var(--ease),opacity .3s,margin .4s var(--ease)}
.mi.off{width:0;opacity:0;margin-left:-12px}

/* sheet */
.sheet{position:absolute;top:34px;left:400px;width:820px;background:var(--glass);backdrop-filter:blur(36px) saturate(1.5);-webkit-backdrop-filter:blur(36px) saturate(1.5);border:1px solid rgba(255,255,255,.085);border-radius:22px;box-shadow:0 34px 100px rgba(6,4,24,.5),inset 0 1px 0 rgba(255,255,255,.035);animation:drop .6s var(--ease) both}
@keyframes drop{from{opacity:0;transform:translateY(-10px)}}
.nub{position:absolute;top:-8px;left:0;width:18px;height:8px;margin-left:-9px;transition:transform .45s var(--ease)}
.nub svg{display:block}

.head{display:flex;align-items:center;gap:12px;height:52px;padding:0 30px;white-space:nowrap}
.head .lbl{font-size:12px;color:var(--tx3)}
.head .txt{font-size:13px;color:var(--tx2)}
.head .txt b{color:var(--tx)}
.head .undo{margin-left:auto;font-size:13px;font-weight:500;padding:4px 12px;border-radius:12px;background:rgba(255,255,255,.07);transition:background .2s}
.head .undo:hover{background:rgba(255,255,255,.13)}

.body{display:grid;grid-template-columns:318px 1fr;column-gap:34px;padding:2px 30px 18px;height:616px;grid-template-rows:minmax(0,1fr)}
.idx{min-height:0}
.sb .it .nm{font-size:24px}

/* ---------- left: live index ---------- */
.idx{display:flex;flex-direction:column}
.leg{font-size:11px;color:var(--tx3);height:22px;line-height:14px;white-space:nowrap;display:flex;align-items:flex-start;justify-content:flex-end;gap:6px}
.leg i{display:inline-block;width:12px;height:5px;border-radius:3px;margin-top:5px;background:linear-gradient(90deg,#EE85B5,#5B9BFF 22%,#3FD0B8 42%,#4CC96B 60%,#F2B544 78%,#B18CFF)}
.it{display:flex;align-items:center;gap:12px;flex:1;max-height:92px;min-height:0;width:100%;border-radius:14px;padding:0 6px;margin:0 -6px;width:calc(100% + 12px);transition:background .25s}
.it .dot{flex:none;width:9px;height:9px;border-radius:50%;box-shadow:inset 0 0 0 1.5px rgba(235,235,245,.28);transition:background .35s,box-shadow .35s}
.it .nm{flex:1;font-size:25px;font-weight:600;letter-spacing:-.022em;color:rgba(235,235,245,.36);transition:color .3s;white-space:nowrap}
.it:hover .nm{color:var(--tx2)}
.it.sel .nm{color:var(--tx)}
.it.hit .dot{transform:scale(1.25)}
.it .dot{transition:background .35s,box-shadow .35s,transform .3s}
.it.hit .nm{color:var(--tx)}
.mg{flex:none;position:relative;width:56px;height:24px;display:flex;align-items:flex-end;justify-content:space-between;transition:opacity .4s,filter .4s}
.it.m0 .mg{opacity:.28;filter:grayscale(1)}
.mg i{display:block;transition:height .55s var(--ease),width .55s var(--ease),left .55s var(--ease),flex-grow .55s var(--ease),background .35s,opacity .35s,box-shadow .35s}
.mg .tr{position:absolute;left:0;right:0;top:9px;height:6px;border-radius:3px;background:var(--g1)}
.mg .tr i{position:absolute;top:0;bottom:0;border-radius:3px}
.mg .tr .tk{top:-4px;bottom:-4px;width:2px;margin-left:-1px;border-radius:1px;background:#fff}
.mg.mc i{flex:none;border-radius:2px}
.mg.dots{flex-wrap:wrap;align-content:center;justify-content:space-between;row-gap:4px}
.mg.dots i{width:6px;height:6px;border-radius:50%}
.mg.ring{justify-content:flex-end;align-items:center}
.mg.sb{align-items:center}
.mg.sb .tb{width:56px;margin:0}
.nb{flex:none;width:86px;display:flex;flex-direction:column;align-items:flex-end;white-space:nowrap}
.nb .n{font-size:16px;font-weight:500;line-height:19px;color:var(--tx2);transition:color .3s}
.nb .n u{text-decoration:none;font-size:11px;font-weight:400;color:var(--tx3);margin-left:3px}
.nb .cp{font-size:11px;line-height:15px;color:var(--tx3)}
.it.sel .nb .n{color:var(--tx)}
.it.m0 .nb .n{color:var(--tx3);font-weight:400;font-size:13px}

/* ---------- right pane ---------- */
.det{position:relative;min-width:0}
.det .in{transition:opacity .22s,transform .35s var(--ease)}
.det .in.swap{opacity:0;transform:translateY(6px)}
.lab{display:flex;align-items:center;height:16px;font-size:12px;color:var(--tx3);white-space:nowrap}
.lab .key{margin-left:auto;display:flex;align-items:center;gap:6px;color:var(--tx2);transition:opacity .3s}
.mk{flex:none;width:7px;height:7px;border-radius:50%;transition:background .35s,box-shadow .35s,opacity .35s}
.mk.a{background:var(--c)}
.mk.s{box-shadow:inset 0 0 0 1.5px var(--c)}
.mk.n{opacity:0}

/* suggestions: the insight sentences are the actions */
.sugs{margin-top:8px}
.sg{display:grid;grid-template-columns:8px minmax(0,1fr) auto;column-gap:12px;align-items:center;margin:0 -10px;padding:7px 10px;border-radius:12px;max-height:72px;overflow:hidden;transition:background .25s,opacity .35s,max-height .45s var(--ease),padding .45s var(--ease)}
.sg:hover{background:rgba(255,255,255,.045)}
.sg .bu{width:6px;height:6px;border-radius:50%;background:var(--c);align-self:start;margin-top:7px}
.sg.lo .bu{background:transparent;box-shadow:inset 0 0 0 1.4px var(--g3)}
.sg .t{font-size:13.5px;line-height:19px;color:var(--tx2)}
.sg .t b{color:var(--tx)}
.sg .t .src{font-size:11px;margin-right:6px;font-weight:500}
.sg.gone,.note.gone{max-height:0;opacity:0;padding-top:0;padding-bottom:0;pointer-events:none}
.note{font-size:13px;line-height:19px;color:var(--tx3);max-height:40px;overflow:hidden;padding:7px 0;transition:max-height .45s var(--ease),opacity .35s,padding .45s var(--ease)}
.btn{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 12px;border-radius:14px;background:rgba(255,255,255,.08);font-size:13px;font-weight:500;white-space:nowrap;transition:background .2s,color .2s}
.btn:hover{background:rgba(255,255,255,.15)}
.btn .tl{font-weight:400;font-size:12px;color:var(--tx3)}
.btn.pri{background:color-mix(in srgb,var(--c) 24%,transparent)}
.btn.pri:hover{background:color-mix(in srgb,var(--c) 36%,transparent)}
.btn.pri .tl{color:rgba(255,255,255,.55)}

.gr{margin-top:12px;transition:opacity .4s,filter .4s}
.det.off .gr,.det.off .rows .ic{filter:grayscale(1);opacity:.45}
.mt+.mt{margin-top:10px}
.mt .hd{display:flex;align-items:baseline;justify-content:space-between;height:16px;font-size:12px;color:var(--tx3);white-space:nowrap}
.mt .hd b{color:var(--tx)}
.mt .hd span:last-child{color:var(--tx2)}
.tb{position:relative;height:6px;margin-top:6px;border-radius:3px;display:flex}
.tb i{display:block;height:6px;border-radius:3px;flex-basis:0;margin-right:2px;transition:flex-grow .55s var(--ease),margin .55s var(--ease),background .35s,opacity .3s,box-shadow .3s}
.tb i:last-of-type{margin-right:0}
.tb i.z{margin-right:0}
.tb .tk{position:absolute;top:-4px;height:14px;width:2px;margin:0 0 0 -1px;border-radius:1px;background:#fff;transition:left .55s var(--ease),opacity .3s}
.tl2{position:relative;height:14px;font-size:10.5px;color:var(--tx3)}
.tl2 span{position:absolute;top:3px;transform:translateX(-50%);white-space:nowrap;transition:left .55s var(--ease)}
.cols{display:flex;align-items:flex-end;gap:5px;height:50px}
.cols .cl{flex:1;position:relative;height:100%;border-radius:4px;background:rgba(255,255,255,.035)}
.cols .cl i{position:absolute;left:0;right:0;bottom:0;border-radius:4px;transition:height .55s var(--ease),background .35s,box-shadow .35s,opacity .3s}
.cleg{display:flex;gap:11px;margin-top:7px;font-size:11px;color:var(--tx3);white-space:nowrap}
.cleg span{display:flex;align-items:center;gap:5px}
.cleg i{width:8px;height:8px;border-radius:2px}
.strip{display:flex;gap:4px;margin-top:6px}
.strip i{flex:1;height:14px;border-radius:5px;transition:flex-grow .55s var(--ease),background .35s,box-shadow .35s,opacity .3s,margin .55s}

/* highlight: hovering a suggestion shows exactly what it touches */
.hlon [data-k]:not(.hit):not(.gone){opacity:.22}
.hlon .sg:not(.hit):not(.gone){opacity:.4}
.hlon i.hit{box-shadow:0 0 0 1px rgba(255,255,255,.75),0 0 12px var(--c)}
.hlon .rw.hit{background:color-mix(in srgb,var(--c) 15%,transparent)}
.hlon .rw.hit .nm{color:var(--tx)}

.rows{margin-top:10px}
.rw{position:relative;display:flex;align-items:center;gap:8px;height:26px;margin:0 -8px;padding:0 8px;border-radius:8px;font-size:13px;white-space:nowrap;overflow:hidden;transition:height .42s var(--ease),opacity .32s,background .25s}
.rw.gone{height:0;opacity:0;pointer-events:none}
.rw:hover{background:var(--rowbg)}
.rw.flash{animation:flash 1.8s var(--ease)}
@keyframes flash{0%,40%{background:color-mix(in srgb,var(--c) 26%,transparent)}100%{background:transparent}}
.rw .ic{flex:none;display:flex;width:18px;justify-content:center;transition:opacity .4s,filter .4s}
.rw .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;transition:color .25s}
.rw .nm .x,.rw .g{color:var(--tx3)}
.rw .nm .x{font-size:12px}
.rw .meta{flex:none;display:flex;align-items:center;gap:8px;transition:opacity .2s}
.rw .v{flex:none;width:54px;text-align:right;color:var(--tx2)}
.rw .v2{flex:none;width:34px;text-align:right;color:var(--tx3)}
.rw .st{flex:none;width:84px;text-align:right;color:var(--tx3);transition:color .35s}
.rw.on .st{color:var(--c)}
.rw.dim .nm{color:var(--tx3)}
.rw .ow{flex:none;width:96px;color:var(--tx3);overflow:hidden;text-overflow:ellipsis}
.lk{color:var(--tx2);cursor:pointer;border-bottom:1px solid rgba(255,255,255,.14);transition:color .2s,border-color .2s}
.lk:hover{color:var(--tx);border-color:rgba(255,255,255,.5)}
.hold{flex:none;display:flex;gap:5px;width:52px;justify-content:flex-end}
.hold span{display:flex;align-items:center;gap:2px;font-size:11px;color:var(--tx3)}
.r-servers .nm{flex:none;width:104px}.r-servers .st{width:76px}.r-servers .ow{font-size:12px}.r-servers .meta{flex:1;min-width:0}.r-servers .ow{flex:1;width:auto;min-width:0}
.r-trees .nm{flex:1}.r-trees .st{width:118px}.r-trees .rw.dim .st{font-size:12px}.r-trees .v{width:50px}.r-apps .rw{gap:6px}.r-apps .v2{width:30px}
.r-agents .st{width:84px}
.r-awake .ow{width:80px}.r-awake .st{width:98px}
.acts{position:absolute;right:0;top:0;bottom:0;display:flex;align-items:center;gap:4px;padding:0 4px 0 30px;background:linear-gradient(90deg,rgba(42,42,56,0),var(--rowbg) 26px);opacity:0;transform:translateX(8px);pointer-events:none;transition:opacity .2s,transform .3s var(--ease)}
.rw:hover .acts,.rw:focus-within .acts{opacity:1;transform:none;pointer-events:auto}
.rw:hover .meta,.rw:focus-within .meta{opacity:0}
.ab{height:21px;padding:0 9px;border-radius:11px;background:rgba(255,255,255,.08);font-size:12px;font-weight:500;white-space:nowrap;display:inline-flex;align-items:center;gap:5px;transition:background .2s}
.ab:hover{background:rgba(255,255,255,.17)}
.ab .tl{font-weight:400;color:var(--tx3)}
.ab.dis{background:none;color:var(--tx3);cursor:default;font-weight:400;padding:0 4px}
.ab.dis .tl{color:rgba(235,235,245,.24)}
.more{height:20px;font-size:12px;line-height:20px;color:var(--tx3);white-space:nowrap}

.set{margin-top:10px;padding-top:8px;border-top:1px solid var(--line)}
.modes{position:relative;display:flex;gap:24px;height:40px;align-items:flex-start;margin-top:4px}
.modes button{font-size:26px;font-weight:600;letter-spacing:-.02em;line-height:32px;color:var(--tx3);transition:color .3s}
.modes button:hover{color:var(--tx2)}
.modes button[aria-checked="true"]{color:var(--tx)}
.bar{position:absolute;left:0;top:36px;height:2px;border-radius:1px;background:var(--c);transition:transform .45s var(--ease),width .45s var(--ease),background .35s,opacity .3s}
.rule{margin-top:4px;font-size:13.5px;line-height:19px;color:var(--tx2)}
.opts{display:flex;gap:18px;height:24px;margin-top:6px;align-items:flex-start;white-space:nowrap;transition:opacity .3s}
.opts button{position:relative;font-size:14px;color:var(--tx3);line-height:19px;transition:color .25s}
.opts button:hover{color:var(--tx2)}
.opts button[aria-checked="true"]{color:var(--tx);font-weight:500}
.opts button[aria-checked="true"]::after{content:"";position:absolute;left:50%;bottom:-4px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--c)}
.det.off .opts{opacity:.3;pointer-events:none}

/* suggested overview (variant b) */
.big{display:flex;align-items:baseline;gap:6px;white-space:nowrap;height:46px;margin-top:4px}
.big .n{font-size:40px;font-weight:500;letter-spacing:-.02em;line-height:46px}
.big .u{font-size:15px;color:var(--tx2)}
.big .n2{margin-left:auto;font-size:13px;color:var(--tx2)}
.big .n2 b{color:var(--tx)}
.doall{display:flex;align-items:center;gap:12px;margin-top:12px}
.doall .btn{height:32px;padding:0 16px;border-radius:16px;font-size:14px;background:rgba(255,255,255,.88);color:#1c1d26}
.doall .btn:hover{background:#fff}
.doall .btn .tl{color:rgba(28,29,38,.55)}
.doall .btn[disabled]{opacity:.35;pointer-events:none}
.doall p{font-size:12px;line-height:16px;color:var(--tx3)}
.slg{display:flex;gap:10px;margin-top:7px;font-size:10.5px;color:var(--tx3);white-space:nowrap}
.slg span{display:flex;align-items:center;gap:5px}
.slg i{width:8px;height:8px;border-radius:2px}
.fine{margin-top:4px;padding-top:8px;border-top:1px solid var(--line);font-size:12px;line-height:17px;color:var(--tx3)}

.foot{display:flex;align-items:center;gap:28px;height:52px;padding:0 30px;border-top:1px solid var(--line)}
.sw{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--tx2);transition:color .2s}
.sw i{width:32px;height:19px;border-radius:10px;background:rgba(255,255,255,.14);position:relative;transition:background .25s;flex:none}
.sw i::after{content:"";position:absolute;left:2px;top:2px;width:15px;height:15px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .25s var(--ease)}
.sw[aria-checked="true"]{color:var(--tx)}
.sw[aria-checked="true"] i{background:#5B9BFF}
.sw[aria-checked="true"] i::after{transform:translateX(13px)}
.foot .hint{margin-left:auto;font-size:11px;color:var(--tx3)}

/* toast */
.toast{position:absolute;left:50%;bottom:64px;display:flex;align-items:center;gap:14px;height:40px;max-width:640px;padding:0 6px 0 16px;border-radius:20px;background:rgba(50,50,64,.97);border:1px solid rgba(255,255,255,.1);box-shadow:0 14px 40px rgba(0,0,0,.35);font-size:13px;color:var(--tx2);white-space:nowrap;opacity:0;transform:translate(-50%,10px);pointer-events:none;transition:opacity .3s,transform .4s var(--ease);z-index:4}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast b{color:var(--tx)}
.toast .tt{overflow:hidden;text-overflow:ellipsis}
.toast button{flex:none;height:28px;padding:0 13px;border-radius:14px;background:rgba(255,255,255,.1);font-weight:500;color:var(--tx);transition:background .2s}
.toast button:hover{background:rgba(255,255,255,.18)}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important}}
</style>
</head>
<body>
<div id="stage">
  <div class="mb">
    <div class="mb-l">
      <svg viewBox="0 0 17 20" width="13" height="16" aria-hidden="true"><path fill="#fff" d="M14.1 10.6c0-2.6 2.1-3.8 2.2-3.9-1.2-1.8-3.1-2-3.7-2-1.6-.2-3.1.9-3.9.9-.8 0-2-.9-3.4-.9C3.6 4.8 1.9 5.8 1 7.4c-1.9 3.3-.5 8.2 1.4 10.9.9 1.3 2 2.8 3.4 2.7 1.4-.1 1.900-.9 3.500-.9s2.1.9 3.5.9c1.5 0 2.4-1.3 3.3-2.7 1-1.5 1.5-3 1.5-3.1-.1 0-2.9-1.1-2.9-4.3zM11.5 3c.7-.9 1.2-2.1 1.1-3.300-1 0-2.300.7-3 1.6-.7.8-1.3 2-1.1 3.2 1.1.1 2.300-.6 3-1.5z"/></svg>
      <b>Finder</b><span>File</span><span>Edit</span><span>View</span><span>Go</span><span>Window</span><span>Help</span>
    </div>
    <div class="mb-r">
      <div class="icons" id="icons"><i class="hl" id="hl"></i></div>
      <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M2 6.3a8.6 8.6 0 0 1 12 0M4.2 8.6a5.4 5.4 0 0 1 7.6 0"/><circle cx="8" cy="11.6" r="1.3" fill="#fff" stroke="none"/></svg>
      <svg viewBox="0 0 26 14" width="25" height="13" aria-hidden="true"><rect x=".7" y=".7" width="21.6" height="12.6" rx="3.6" fill="none" stroke="rgba(255,255,255,.55)" stroke-width="1.2"/><rect x="2.6" y="2.6" width="11.6" height="8.8" rx="2" fill="#fff"/><path d="M24 5v4" stroke="rgba(255,255,255,.55)" stroke-width="1.4" stroke-linecap="round"/></svg>
      <span>Tue 27 Oct&nbsp;&nbsp;16:42</span>
    </div>
  </div>

  <div class="sheet" id="sheet" role="dialog" aria-label="MinMacs">
    <div class="nub" id="nub"><svg viewBox="0 0 18 8" width="18" height="8" aria-hidden="true"><path d="M0 8 C5 8 6.5 0 9 0 C11.5 0 13 8 18 8 Z" fill="rgba(36,36,48,.96)"/></svg></div>
    <div class="head" id="today"></div>
    <div class="body">
      <div class="idx" id="idx" role="tablist" aria-orientation="vertical"></div>
      <div class="det" id="det"><div class="in" id="in"></div></div>
    </div>
    <div class="foot">
      <button class="sw" id="one" role="switch" aria-checked="false"><i></i>One icon in the menu bar</button>
      <button class="sw" id="login" role="switch" aria-checked="true"><i></i>Open at login</button>
      <span class="hint">Hover a suggestion to see what it touches</span>
    </div>

    r.push(A('quit','Quit',fmt(memOf(o))));

    else r.push(has(o.id,'keep')?A('unkeep','Move to Close List'):A('keep','Keep'));
    return r;
  }
  if(kind==='servers'){
    if(o.kept) return [A('','Stop…','Docker keeps it',1),A('nav','Restart')];
    const r=[];
    if(o.use) return [A('nav','Open in Browser'),A('goto:'+o.ag,'Go to Agent'),A('nav','Restart')];
    r.push(A('stop','Stop',o.mb+' MB'));
    r.push(has(o.id,'keep')?A('unkeep','Let It Stop'):A('keep','Keep'));
    r.push(A('nav','Open in Browser'));
    return r;
  }
  if(kind==='trees'){

    r.push(A('nav','Show in Finder'));
    if(o.k!=='m') r.push(A('nav','Open in Editor'));
    return r;
  }
  if(kind==='disk'){
    if(o.rep) return [A('','Clean…','report only',1),A('nav','Show in Finder')];
    const r=[A('clean','Clean',fmt(o.gb))];

function actBtns(kind,o){

function runAct(a,id,l){
  const o=byId[id], name=o.p?o.p+' '+o.k:o.n;
  if(a.startsWith('goto:')){goAgent(a.slice(5));return}
  if(a==='nav'){
    const msg={'Go to Tab':`Switched to <b>${name}</b> in ${o.w==='cmux'||o.w==='tmux'?'its '+o.w+' tab':o.w==='app'?'the Codex app':o.w==='thread'?'its Codex thread':o.w||'its tab'}.`,'Show in Finder':`Showing <b>${name}</b> in Finder.`,'Open in Browser':`Opened <b>localhost${o.p}</b> in the browser.`,
      'Restart':`Restarted <b>${name}</b>. It is up again.`,'Show Commit':`<b>a41f2c9</b> Seed dogfood studio data · 21 days ago · on no remote`,'Open in Editor':`Opened <b>${name}</b> in Cursor.`,'Show Windows':`Showing the <b>cmux</b> windows.`}[l]||`Opened <b>${name}</b>.`;
    toast(msg,'Back');return
  }
  const pre=save(); let msg='';
  if(a==='quit'){msg=`Quit <b>${o.n}</b>. Freed ${fmt(memOf(o))}.`;fl(id).gone=1}
  else if(a==='trim'){msg=`Closed 14 noise tabs in <b>Chrome</b>. Freed 2.6 GB.`;fl(id).trim=1}
  else if(a==='keep'){fl(id).keep=1;msg=`<b>${o.p||o.n}</b> is kept. MinMacs leaves it alone.`}
  else if(a==='unkeep'){fl(id).keep=0;msg=`<b>${o.p||o.n}</b> is back on the list.`}
  else if(a==='list'){fl(id).list=1;msg=`<b>${o.n}</b> is now on the Close List.`}
  else if(a==='unlist'){fl(id).list=0;fl(id).keep=1;msg=`<b>${o.n}</b> is kept.`}
  else if(a==='stop'){msg=`Stopped <b>${o.p} ${o.k}</b>. Freed ${o.mb} MB.`;stopSrv(id)}
  else if(a==='rmtree'){msg=`Moved <b>${o.n}</b> to the Trash${o.id==='wt-bp8'?', a git bundle first':''}${o.srv&&!gone(o.srv)?', stopped '+byId[o.srv].p:''}.`;rmTree(o)}
  else if(a==='clean'){msg=o.tool?`Ran <b>${o.tool}</b>. Freed ${fmt(o.gb)}.`:`Moved <b>${o.n}</b> to the Trash. Freed ${fmt(o.gb)}.`;fl(id).gone=1}
  else if(a==='wrap'){msg=`Wrapped up <b>${o.n}</b>: stopped its server, removed its merged worktree.`;agServers(id).forEach(x=>stopSrv(x.id));const t=agTree(id);if(t)rmTree(t);fl(id).gone=1}
  else if(a==='stopsrv'){msg=`Stopped ${agServers(id).map(x=>'<b>'+x.p+'</b>').join(', ')} for ${o.n}.`;agServers(id).forEach(x=>stopSrv(x.id))}
  else if(a==='sleep'){fl(id).sleep=1;msg=`<b>${o.n}</b> no longer holds the Mac awake.`}
  else if(a==='hold'){fl(id).sleep=0;msg=`<b>${o.n}</b> keeps the Mac awake again.`}
  UNDO.push(pre); HL=null; renderAll(); toast(msg,'Undo');
}
function runSug(id){
  const g=sugBy(id); if(!g||!g.on()) return;
  const msg=g.msg();
  if(g.nav){toast(msg,'Back');return}
  UNDO.push(save()); g.run(); HL=null; renderAll(); toast(msg,'Undo');
}
function runAll(){
  const list=doAllList(); if(!list.length) return;
  const fr=doAllFree();
  UNDO.push(save()); list.forEach(g=>{if(g.on())g.run()}); HL=null; renderAll();
  toast(`Did <b>${list.length}</b> safe things. Freed <b>${fmt(fr)}</b>.`,'Undo');
}

    const mg=sum(mergedWT(),w=>w.gb);
    return {key:keyLine(s,['removes these','shows these']),
      gr:mt(`<b>14</b> worktrees · height = size`,`Merged <b>${tw('wt-m',fmtN(mg))}</b> ${fmtU(mg)}`,`<div class="cols" style="margin-top:6px">${WT.map(w=>`<div class="cl"><i data-k="${w.id}" style="height:${gone(w.id)?0:Math.round(8+w.gb/3.2*42)}px;background:${w.k==='m'&&!has(w.id,'keep')?c:w.k==='u'?'var(--g3)':w.k==='s'?'transparent':'var(--g2)'};box-shadow:${w.k==='s'?'inset 0 0 0 1.5px var(--g3)':'none'}"></i></div>`).join('')}</div>
        <div class="cleg"><span><i style="background:${c}"></i>merged</span><span><i style="box-shadow:inset 0 0 0 1.5px var(--g3)"></i>stale</span><span><i style="background:var(--g3)"></i>in use</span><span><i style="background:var(--g2)"></i>fine</span><span>empty slot = removed</span></div>`),
      rows:WT.filter(w=>w.k==='m'||w.k==='s').map(w=>{const ready=w.k==='m'&&!has(w.id,'keep'), on=ready&&m;
        const st=has(w.id,'keep')?'kept by you':w.k==='s'?w.why:!m?'merged':(m===2?'goes now':'merged '+w.d+'d');
        const own=w.ag?lk(w.ag):w.k==='s'?'stale':'no agent';
        return `<div class="rw${gone(w.id)?' gone':''}${on?' on':''}${w.k==='s'?' dim':''}" data-k="${w.id}${w.srv?' '+w.srv:''}">${mk(on,s)}<span class="ic">${gl('trees',ready?c:'var(--g3)',14)}</span><span class="nm">${w.n}<span class="x"> · ${own}</span></span><span class="meta"><span class="v">${fmt(w.gb)}</span><span class="st">${st}</span></span>${actBtns('trees',w)}</div>`}).join('')
       +`<div class="more">8 more: 3 in use by agents, 5 fine</div>`};
  }
  if(s.id==='disk'){
    const freed=sum(DK.filter(d=>gone(d.id)),d=>d.gb)+sum(WT.filter(w=>gone(w.id)),w=>w.gb), used=812-freed, cl=sum(DK.filter(d=>!gone(d.id)),d=>d.gb), sf=sum(safeDK(),d=>d.gb);
    return {key:keyLine(s,['cleans these','shows these']),
      gr:mt(`Disk <b>${tw('dk-u',Math.round(used))}</b> / 994 GB`,`<b>${tw('dk-f',Math.round(994-used))}</b> GB free`,seg([{w:used-cl,bg:'var(--g2)'},...DK.map(d=>({k:d.id,w:gone(d.id)?0:d.gb,bg:d.safe&&!has(d.id,'keep')?c:'var(--g3)'})),{w:994-used,bg:'var(--g1)'}]))
        +mt(`Clutter <b>${tw('dk-c',fmtN(cl))}</b> ${fmtU(cl)} by kind`,`Safe <b>${tw('dk-s',fmtN(sf))}</b> ${fmtU(sf)}`,seg(DK.map(d=>({k:d.id,w:gone(d.id)?0:d.gb,bg:d.safe&&!has(d.id,'keep')?c:'var(--g2)'})))),
      rows:DK.map(d=>{const sf=d.safe&&!has(d.id,'keep'), on=sf&&m;
        const st=has(d.id,'keep')?'kept by you':d.rep?'report only':!d.safe?'you decide':!m?'safe':m===2?'Trash '+NEXT[s.v]:'shown '+NEXT[s.v];
        return `<div class="rw${gone(d.id)?' gone':''}${on?' on':''}${sf?'':' dim'}" data-k="${d.id}">${mk(on,s)}<span class="ic"><i style="display:block;width:9px;height:9px;border-radius:3px;background:${sf?c:'var(--g2)'}"></i></span><span class="nm">${d.n}<span class="x">${d.x?' · '+d.x:''}</span></span><span class="meta"><span class="v">${fmt(d.gb)}</span><span class="st">${st}</span></span>${actBtns('disk',d)}</div>`}).join('')};
  }
  /* awake */
  const bt=thr(s), h=holding().length;
  return {key:keyLine(s,['keeps it awake for these','asks for these']),
    gr:mt(`Battery <b>64</b> % · on power`,bt?`Sleeps at <b>${bt}</b> %`:'Battery never ends it',seg([{w:64,bg:'rgba(255,255,255,.55)'},{w:36,bg:'var(--g1)'}],bt||0,bt?`${bt} %`:''))
      +`<p class="rule" style="margin-top:2px">${!m?'The Mac sleeps as usual.':X.awake1h?`Awake until <b style="color:var(--tx)">17:42</b>, then it sleeps after the last agent.`:h?`Awake because <b style="color:var(--tx)">${h} agents</b> are working. It sleeps after the last one, at ${bt||'any'} % battery, on lost network or heat.`:'No agent holds it awake. It sleeps as usual.'}</p>`,
    rows:AG.slice(0,6).map(a=>{const on=a.st==='w'&&!has(a.id,'sleep')&&m;
      const st=a.st==='w'?(has(a.id,'sleep')?'lets it sleep':'holds it awake'):ST_WORD[a.st]+' '+a.a;
      return `<div class="rw${gone(a.id)?' gone':''}${on?' on':''}${a.st!=='w'?' dim':''}" data-k="${a.id}">${mk(on,s)}<span class="ic">${ICON[a.t]}</span><span class="nm"><span class="lk" data-goto="${a.id}">${a.n}</span><span class="x"> · ${a.w==='app'?'Codex app':a.w}</span></span><span class="meta"><span class="ow">${TOOL[a.t]}</span><span class="st">${st}</span></span>${actBtns('agents',a)}</div>`}).join('')
     +`<div class="more">6 more not working, so they do not hold it awake</div>`};
}
function rule(s){
  const T=s.vals[s.v], m=s.mode;
  return ({
    agents:['Not watching agents.',`Suggests Wrap Up when an agent finished ${T} ago.`,`Wraps up agents ${T} after they finish. Undo restores.`],
    apps:['Not watching apps.',`Shows noise apps to close when load is above ${T}.`,`Closes noise apps when load is above ${T}.`],
    servers:['Not watching servers.',`Shows localhost servers nobody used for ${T}.`,`Stops localhost servers nobody used for ${T}.`],
    trees:['Not watching worktrees.',`Shows worktrees ${T} after they merge.`,`Removes worktrees ${T} after merge. Undo restores.`],
    disk:['Not watching the disk.',`Shows clutter that is safe to clean, ${T}.`,`Moves safe clutter to the Trash, ${T}.`],
    awake:['The Mac sleeps as usual.','Asks when an agent starts working.',`Awake while agents work${s.v===3?'.':`, until ${T} battery.`}`]
  })[s.id][m];
}
/* overview of the best suggestions across all sections (variant b) */
const SUG_RANK=['d-safe','a-now','w-merged','d-dock','a-trim','g-wrap','s-idle','g-parity','g-lexicon','w-bp7'];
function sugParts(){
  const list=doAllList(); const by={};
  list.forEach(g=>{(by[g.sec]=by[g.sec]||{sec:g.sec,v:0,k:[]})});
  const s0=save(); let b=held();
  list.forEach(g=>{if(!g.on())return;const ks=g.keys();g.run();const a=held();by[g.sec].v+=b-a;by[g.sec].k.push(...ks);b=a});
  load(s0);
  return ['disk','apps','trees','agents','servers'].map(k=>by[k]?{sec:k,v:by[k].v,k:by[k].k.join(' ')}:{sec:k,v:0,k:''});
}
let ORDER=SUG_RANK.slice();
function rerank(){ORDER=SUG_RANK.map(sugBy).map(g=>({g,f:g.on()&&!g.nav?sugFree(g):0})).sort((a,b)=>b.f-a.f).map(r=>r.g.id)}
function sugView(){
  const list=ORDER.map(sugBy).filter(g=>g.on()&&sec(g.sec).mode);
  const ranked=list.slice(0,7).map(g=>({g}));
  const all=doAllList(), fr=doAllFree(), parts=sugParts();
  const shown=new Set(ranked.map(r=>r.g.id));
  return `<div class="lab">Right now, across every section<span class="key"><i class="mk" style="background:#fff"></i>Ranked by what they free</span></div>
    <div class="big"><span class="n">${tw('sg-n',fmtN(fr))}</span><span class="u">${fmtU(fr)} of memory and disk can be freed safely</span></div>
    <div class="mt" style="margin-top:6px">${seg(parts.map(p=>({k:p.k,w:p.v,bg:C[p.sec]})).concat([{w:fr<=0?1:0,bg:'var(--g1)'}]))}<div class="slg">${parts.filter(p=>p.v>.001).map(p=>`<span><i style="background:${C[p.sec]}"></i>${sec(p.sec).name} ${fmt(p.v)}</span>`).join('')}</div></div>
    <div class="doall"><button class="btn" id="doall" data-doall="1"${all.length?'':' disabled'}>Do All Safe<span class="tl">${all.length} · ${fmt(fr)}</span></button><p>Nothing unsaved is touched.<br>One Undo brings it all back.</p></div>
    <div class="sugs" style="margin-top:10px">${ORDER.map(id=>{const g=sugBy(id);if(!shown.has(id))return `<div class="sg gone" data-sug="${id}"></div>`;return sugLine(g,1).replace(`class="sg`,`class="sg${g.safe&&SAFE_ALL.includes(g.id)?'':' lo'}`)}).join('')}<p class="note${list.length?' gone':''}">Nothing left to suggest. MinMacs keeps watching.</p></div>
    <p class="fine">Filled dot = part of Do All Safe. Ring = your call. ${list.length>7?`${list.length-7} more in their sections.`:''}</p>`;
}
function detHTML(s){
  if(s.id==='sug') return sugView();
  const n=view(s);
  return `<div class="lab">Right now${n.key}</div>
    ${sugStack(s)}
    <div class="gr">${n.gr}</div>
    <div class="rows r-${s.id}">${n.rows}</div>
    <div class="set">
      <div class="modes" role="radiogroup" aria-label="${s.name} mode">${MODES.map((m,i)=>`<button role="radio" aria-checked="${i===s.mode}" data-m="${i}">${m}</button>`).join('')}<i class="bar" id="bar" data-keep></i></div>
      <p class="rule">${rule(s)}</p>
      <div class="opts" role="radiogroup" aria-label="${s.lab}">${s.vals.map((v,i)=>`<button role="radio" aria-checked="${i===s.v}" data-v="${i}">${v}</button>`).join('')}</div>
    </div>`;
}

/* ---------- morph: update in place so CSS eases every value ---------- */
function morph(a,b){
  if(a.nodeType!==b.nodeType||a.nodeName!==b.nodeName){a.replaceWith(b.cloneNode(true));return}
  if(a.nodeType===3){if(a.nodeValue!==b.nodeValue)a.nodeValue=b.nodeValue;return}
  if(a.nodeType!==1)return;
  if(a.hasAttribute('data-keep'))return;
  for(const at of [...b.attributes]) if(a.getAttribute(at.name)!==at.value) a.setAttribute(at.name,at.value);
  for(const at of [...a.attributes]) if(!b.hasAttribute(at.name)) a.removeAttribute(at.name);
  const ac=[...a.childNodes], bc=[...b.childNodes];
  if(ac.length!==bc.length){a.replaceChildren(...bc.map(n=>n.cloneNode(true)));return}
  ac.forEach((n,i)=>morph(n,bc[i]));
}
function patch(el,html){const t=document.createElement(el.tagName);t.innerHTML=html;
  if(!el.childNodes.length){el.innerHTML=html;return}
  const ac=[...el.childNodes], bc=[...t.childNodes];
  if(ac.length!==bc.length){el.innerHTML=html;return}
  ac.forEach((n,i)=>morph(n,bc[i]));
}
/* numbers ease down */
const TW={};
function tweens(){
  document.querySelectorAll('[data-tw]').forEach(el=>{
    const k=el.dataset.tw, txt=el.textContent, v=parseFloat(txt), dec=(txt.split('.')[1]||'').length, p=TW[k];
    TW[k]=v; if(p==null||p===v||RM||isNaN(v)) return;
    const t0=performance.now(), D=600;
    (function step(t){const q=Math.min(1,(t-t0)/D), e=1-Math.pow(1-q,3); el.textContent=(p+(v-p)*e).toFixed(dec); if(q<1&&el.isConnected&&TW[k]===v) requestAnimationFrame(step)})(t0);
  });
}

/* ---------- hover highlight ---------- */
let HL=null, FLASH=null;
function applyHL(){
  const sh=$('sheet'); sh.classList.toggle('hlon',!!HL);
  sh.querySelectorAll('[data-k]').forEach(el=>{const t=(el.getAttribute('data-k')||'').split(' ');el.classList.toggle('hit',!!HL&&t.some(k=>k&&HL.keys.has(k)))});
  sh.querySelectorAll('[data-sug]').forEach(el=>el.classList.toggle('hit',!!HL&&HL.sugs.has(el.dataset.sug)));
  sh.querySelectorAll('.it').forEach(el=>el.classList.toggle('hit',!!HL&&HL.secs.has(el.dataset.s)));
  if(FLASH){const r=sh.querySelector(`[data-row="${FLASH}"]`);if(r){r.classList.remove('flash');void r.offsetWidth;r.classList.add('flash')}FLASH=null}
}
function setHL(el){
  if(!el){if(HL){HL=null;applyHL()}return}
  let sugs=[];
  if(el.dataset.doall) sugs=doAllList(); else {const g=sugBy(el.dataset.sug); if(g&&g.on()) sugs=[g]}
  if(!sugs.length){if(HL){HL=null;applyHL()}return}
  const keys=new Set(), secs=new Set();
  sugs.forEach(g=>{g.keys().forEach(k=>keys.add(k));secs.add(g.sec)});
  // cross-section: light any index entry whose mini graph holds a touched key
  [['agents',AG],['apps',APPS],['servers',SRV],['trees',WT],['disk',DK]].forEach(([s,arr])=>{if(arr.some(o=>keys.has(o.id)))secs.add(s)});
  if(keys.has('tabs'))secs.add('apps');
  HL={keys,sugs:new Set(sugs.map(g=>g.id)),secs}; applyHL();
}
let hovEl=null;
document.addEventListener('pointerover',e=>{
  const el=e.target.closest&&e.target.closest('[data-sug],[data-doall]');
  if(el===hovEl) return; hovEl=el; setHL(el);
});

/* ---------- render ---------- */
function placeBar(instant){
  const s=cur(), b=$('bar'); if(!b) return; const t=document.querySelector(`.modes button[data-m="${s.mode}"]`); if(!t) return;
  if(instant) b.style.transition='none';
  b.style.width=t.offsetWidth+'px'; b.style.transform=`translateX(${t.offsetLeft}px)`; b.style.opacity=s.mode?1:.35;
  if(instant){void b.offsetWidth; b.style.transition=''}
}
function renderIdx(){patch($('idx'),idxHTML())}
function renderDet(animate){
  const s=cur(), d=$('det'), inn=$('in');
  d.style.setProperty('--c',s.c);
  if(s.id==='sug') rerank();
  const fill=()=>{inn.innerHTML=detHTML(s); d.classList.toggle('off',!s.mode); placeBar(true); applyHL(); tweens()};
  if(!animate){fill();return}
  inn.classList.add('swap');
  setTimeout(()=>{fill();requestAnimationFrame(()=>inn.classList.remove('swap'))},170);
}
function updateDet(){const s=cur(); $('det').classList.toggle('off',!s.mode); patch($('in'),detHTML(s)); placeBar(false)}
function renderToday(){
  const fr=HELD0-held();
  $('today').innerHTML = X.autoUndone
   ? `<span class="lbl">Today</span><span class="txt">Auto reopened 2 apps and started 3 servers again${fr>.001?` · you freed <b>${fmt(fr)}</b>`:''}</span><button class="undo" id="redo">Redo</button>`
   : `<span class="lbl">Today</span><span class="txt">Auto closed <b>2 apps</b>, stopped <b>3 servers</b>${fr>.001?` · you freed <b>${tw('fr',fmtN(fr))} ${fmtU(fr)}</b>`:''}</span><button class="undo" id="undo">Undo</button>`;
}
function renderAll(){renderIdx(); updateDet(); renderToday(); applyHL(); tweens()}
function renderIcons(){
  const one=$('one').getAttribute('aria-checked')==='true', box=$('icons');
  if(!box.querySelector('.mi')) box.insertAdjacentHTML('beforeend',S.map(s=>`<span class="mi" id="mi-${s.id}" data-s="${s.id}" title="${s.name}">${gl(s.id,'#fff',16)}</span>`).join('')+`<span class="mi off" id="mi-one" title="MinMacs">${gl('one','#fff',16)}</span>`);
  S.forEach(s=>$('mi-'+s.id).classList.toggle('off',one||s.mode===0));
  $('mi-one').classList.toggle('off',!one);
  setTimeout(aim,420); aim();
}
function anchor(){
  const one=$('one').getAttribute('aria-checked')==='true';
  if(one) return $('mi-one');
  const s=cur(); if(s.id!=='sug'&&s.mode) return $('mi-'+s.id);
  return [...document.querySelectorAll('.mi:not(.off)')][0]||null;
}
function aim(){
  const a=anchor(), hl=$('hl'), box=$('icons');
  if(!a){hl.style.opacity=0;return}
  const x=a.offsetLeft+8;
  hl.style.opacity=sel==='sug'&&!($('one').getAttribute('aria-checked')==='true')?0:1; hl.style.transform=`translateX(${x-14}px)`;
  const st=$('stage'), k=st.getBoundingClientRect().width/1280;
  const bx=(box.getBoundingClientRect().left-st.getBoundingClientRect().left)/k;
  $('nub').style.transform=`translateX(${bx+x-$('sheet').offsetLeft-1}px)`;
}
function select(id){ if(id===sel) return; sel=id; HL=null; hovEl=null; renderIdx(); renderDet(true); aim() }
function goAgent(id){ FLASH=id; if(sel!=='agents') select('agents'); else applyHL() }
function setMode(m){const s=cur(); if(s.mode===m) return; s.mode=m; renderAll(); renderIcons()}

document.addEventListener('click',e=>{
  const g=e.target.closest('[data-goto]'); if(g){e.stopPropagation();goAgent(g.dataset.goto);return}
  const r=e.target.closest('[data-run]'); if(r){runSug(r.dataset.run);return}
  if(e.target.closest('#doall')){runAll();return}
  const ab=e.target.closest('.ab[data-act]'); if(ab){runAct(ab.dataset.act,ab.dataset.id,ab.dataset.l);return}
  const it=e.target.closest('.it'); if(it){select(it.dataset.s);return}
  const mb=e.target.closest('.modes button'); if(mb){setMode(+mb.dataset.m);return}
  const ob=e.target.closest('.opts button'); if(ob){cur().v=+ob.dataset.v;renderAll();return}
  const mi=e.target.closest('.mi'); if(mi&&mi.dataset.s){select(mi.dataset.s);return}
  if(e.target.closest('#undo')){UNDO.push(save());X.autoUndone=1;renderAll();toast('Reopened 2 apps and started 3 servers.','Undo');return}
  if(e.target.closest('#redo')){UNDO.push(save());X.autoUndone=0;renderAll();toast('Closed 2 apps and stopped 3 servers again.','Undo');return}
  const sw=e.target.closest('.sw'); if(sw){sw.setAttribute('aria-checked',String(sw.getAttribute('aria-checked')!=='true'));renderIcons()}
});
document.addEventListener('keydown',e=>{
  const it=e.target.closest&&e.target.closest('.it'); if(!it) return;
  const L=SB?['sug',...S.map(s=>s.id)]:S.map(s=>s.id), i=L.indexOf(it.dataset.s);
  const j=e.key==='ArrowDown'?Math.min(L.length-1,i+1):e.key==='ArrowUp'?Math.max(0,i-1):-1;
  if(j<0) return; e.preventDefault(); select(L[j]); $('it-'+L[j]).focus();
});
document.addEventListener('focusin',e=>{const el=e.target.closest&&e.target.closest('[data-sug],[data-doall]');if(el){hovEl=el;setHL(el)}});

function fit(){const st=$('stage'),k=Math.min(innerWidth/1280,innerHeight/800);st.style.transform=`translate(${(innerWidth-1280*k)/2}px,${(innerHeight-800*k)/2}px) scale(${k})`;aim()}
addEventListener('resize',fit);
renderIdx(); renderDet(false); renderToday(); renderIcons(); fit(); tweens();
document.fonts&&document.fonts.ready.then(()=>{placeBar(true);aim()});
</script>
