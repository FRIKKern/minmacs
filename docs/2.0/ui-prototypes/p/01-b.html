<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>One Panel, Every Size</title>
<style>
:root{
  --glass:rgba(27,28,39,.84);
  --line:rgba(255,255,255,.07);
  --tx:rgba(255,255,255,.93);
  --tx2:rgba(235,235,245,.5);
  --tx3:rgba(235,235,245,.3);
  --mm:#5B9BFF;--lh:#3FD0B8;--wf:#4CC96B;--nn:#F2B544;--in:#B18CFF;
  --ease:cubic-bezier(.3,.7,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#1a1636}
body{font-family:-apple-system,"SF Pro Text",system-ui,sans-serif;color:var(--tx);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;font-size:13px;cursor:default;user-select:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
#stage{position:absolute;left:0;top:0;width:1280px;height:800px;transform-origin:0 0;overflow:hidden;
  background:
   radial-gradient(760px 560px at 10% 6%,#4b3c9e 0%,rgba(75,60,158,0) 70%),
   radial-gradient(700px 520px at 84% 2%,#22618f 0%,rgba(34,97,143,0) 70%),
   radial-gradient(820px 620px at 88% 104%,#a0436f 0%,rgba(160,67,111,0) 70%),
   radial-gradient(640px 520px at 18% 100%,#3a2463 0%,rgba(58,36,99,0) 75%),
   #1d1a3c}

/* menu bar */
.mb{position:absolute;left:0;right:0;top:0;height:26px;display:flex;align-items:center;justify-content:space-between;padding:0 10px 0 16px;background:rgba(18,14,40,.32);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);font-size:13px;color:rgba(255,255,255,.92)}
.mb-l,.mb-r{display:flex;align-items:center;gap:18px}
.mb-l b{font-weight:700}
.mb-r{gap:14px}
.mbi{display:flex;align-items:center;gap:5px;height:22px;padding:0 7px;border-radius:5px}
.mbi.on{background:rgba(255,255,255,.2)}
.mbi .n{font-size:12.5px}
.mbi .n small{color:rgba(255,255,255,.5);font-size:12px}
.mb-sep{width:8px}

/* panel */
.panel{position:absolute;top:34px;right:12px;width:1020px;padding:22px 24px 14px;background:var(--glass);backdrop-filter:blur(34px) saturate(1.5);-webkit-backdrop-filter:blur(34px) saturate(1.5);border:1px solid rgba(255,255,255,.085);border-radius:22px;box-shadow:0 30px 90px rgba(6,4,24,.5),inset 0 1px 0 rgba(255,255,255,.035)}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));column-gap:28px;row-gap:26px}
.blk{display:flex;flex-direction:column;min-width:0}
.blk.mm{grid-column:span 2;flex-direction:row;gap:26px}
.mm .meters{width:216px;flex:none;display:flex;flex-direction:column}
.mm .apps{flex:1;min-width:0;display:flex;flex-direction:column}
.hd{display:flex;align-items:center;gap:10px;height:30px;margin-bottom:12px}
.hd .r{margin-left:auto;font-size:12px;color:var(--tx2)}
.big{font-size:22px;font-weight:500;letter-spacing:-.01em;line-height:1}
.unit{font-size:13px;color:var(--tx2);margin-left:3px}
.bdg{position:relative;display:inline-block;width:30px;height:30px;flex:none}
.bdg>svg{position:absolute;left:0;top:0}
.bdg .g{position:absolute;inset:0;display:grid;place-items:center}
.arc{transition:stroke-dasharray .9s var(--ease)}

/* cores + memory */
.cols{display:flex;align-items:flex-end;height:112px;gap:5px}
.cols .gap{width:6px}
.col{width:16px;height:100%;border-radius:5px;background:rgba(255,255,255,.065);position:relative;overflow:hidden}
.col i{position:absolute;left:0;right:0;bottom:0;border-radius:5px;background:var(--mm);transition:height 1.1s var(--ease)}
.col.e i{background:#93BEFF}
.col b{position:absolute;left:3px;right:3px;height:2px;border-radius:1px;background:rgba(255,255,255,.85);transition:bottom 1.1s var(--ease)}
.mem{margin-top:18px}
.mem .hd{margin-bottom:10px}
.mbar{height:6px;border-radius:3px;background:rgba(255,255,255,.08);position:relative;overflow:hidden}
.mbar i{position:absolute;top:0;bottom:0;left:0;transition:width .9s var(--ease)}
.mline{display:flex;justify-content:space-between;margin-top:9px;font-size:12px;color:var(--tx2)}
.mline b{color:var(--tx);font-weight:500}

/* rows */
.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:8px;height:28px;max-height:28px;margin:0 -7px;padding:0 7px;border-radius:8px;overflow:hidden;white-space:nowrap;
  transition:max-height .45s var(--ease),opacity .3s,transform .45s var(--ease),background .2s}
.row:hover{background:rgba(255,255,255,.045)}
.row:active{transform:scale(.985)}
.row.gone{max-height:0;opacity:0;transform:translateX(14px);pointer-events:none}
.row.rel{background:rgba(255,255,255,.07)}
.nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.nm .sub{color:var(--tx2);font-size:12px;margin-left:3px}
.ft{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--tx2)}
.ft svg{flex:none}
.v{text-align:right;width:52px;flex:none}
.v.c{width:40px}
.v small,.pill small,.unit2{color:var(--tx2);font-size:12px;margin-left:2px}
.blk.preview .row:not(.plan){opacity:.36}
.blk.preview .row.plan{background:color-mix(in srgb,var(--c) 14%,transparent)}
.cap{font-size:11px;color:var(--tx3);text-align:right;flex:none}
.more{font-size:12px;color:var(--tx3);height:24px;display:flex;align-items:center}
.foot{margin-top:auto;padding-top:12px;display:flex;gap:8px;align-items:center}
.kept{display:flex;align-items:center;gap:6px;height:30px;margin-top:4px}
.kept .lb{font-size:12px;color:var(--tx2);margin-right:4px;display:flex;align-items:center;gap:5px}
.ki{transition:width .45s var(--ease),opacity .35s,margin .45s;width:20px;overflow:hidden;border-radius:5.5px}
.ki.gone{width:0;opacity:0;margin-left:-6px}

/* pills */
.pill{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 14px;border-radius:15px;font-weight:500;white-space:nowrap;
  background:color-mix(in srgb,var(--c) 17%,transparent);color:var(--c);transition:background .2s,opacity .2s,transform .15s}
.pill:hover{background:color-mix(in srgb,var(--c) 26%,transparent)}
.pill:active{transform:scale(.97)}
.pill small{margin-left:0}
.pill.ghost{background:rgba(255,255,255,.07);color:var(--tx)}
.pill.ghost:hover{background:rgba(255,255,255,.12)}
.pill[disabled]{opacity:.4;pointer-events:none}

/* icons */
.ai{width:20px;height:20px;border-radius:5.5px;flex:none;position:relative;display:grid;place-items:center;overflow:hidden}
.ai.r{border-radius:50%}
.ai.bd{box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)}
.ai svg{display:block}
.ai .lt{font-size:10px;font-weight:700;color:#fff;letter-spacing:-.02em}

/* insomnia */
.in .status{font-size:12px;color:var(--in);margin:-4px 0 14px}
.reads{display:flex;gap:22px}
.rd{display:flex;align-items:center;gap:8px}
.rd .sb{width:24px;height:24px;border-radius:50%;background:rgba(255,255,255,.07);display:grid;place-items:center}
.rd b{font-weight:500}
.tgs{display:grid;grid-template-columns:repeat(4,1fr);margin-top:16px;gap:4px}
.tg{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11.5px;color:var(--tx2)}
.tg .o{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.08);transition:background .25s,transform .15s}
.tg .o svg{stroke:rgba(235,235,245,.55);transition:stroke .25s}
.tg.on .o{background:var(--in)}
.tg.on .o svg{stroke:#1b1630}
.tg.on{color:var(--tx)}
.tg:active .o{transform:scale(.94)}

/* workstreams footer */
.ws{display:flex;align-items:center;gap:6px;margin-top:20px;padding-top:12px;border-top:1px solid var(--line)}
.chip{display:flex;align-items:center;gap:8px;height:34px;padding:0 10px;border-radius:10px;white-space:nowrap;transition:background .2s,opacity .35s,max-width .45s var(--ease);max-width:400px;overflow:hidden}
.chip:hover,.chip.rel{background:rgba(255,255,255,.06)}
.chip.gone{max-width:0;opacity:0;padding:0;pointer-events:none}
.chip .ft{margin-left:2px}
.chip .pill{height:26px;padding:0 11px;margin-left:6px}
.ws .rv{margin-left:auto;font-size:12px;color:var(--tx2);white-space:nowrap;display:flex;align-items:center;gap:7px;padding:0 6px;height:34px}

/* toast */
.toast{position:absolute;left:50%;top:calc(100% + 12px);transform:translate(-50%,-10px);opacity:0;pointer-events:none;display:flex;align-items:center;gap:14px;height:40px;padding:0 5px 0 16px;border-radius:20px;
  background:rgba(44,45,60,.97);border:1px solid rgba(255,255,255,.1);box-shadow:0 14px 40px rgba(0,0,0,.4);font-size:13px;white-space:nowrap;transition:opacity .3s,transform .4s var(--ease);z-index:5}
.toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast .ok{width:16px;height:16px;border-radius:50%;background:rgba(76,201,107,.2);display:grid;place-items:center}
.toast .pill{height:30px;--c:#fff}


/* ---- variant b ---- */
.panel{position:absolute;top:34px;right:12px;width:auto;padding:0;overflow:hidden;
  transition:width .55s var(--ease),height .55s var(--ease),border-radius .55s var(--ease)}
.inner{position:absolute;right:0;top:0}
.inner.ghost{pointer-events:none;transition:opacity .22s}
.kk{display:inline-flex;align-items:center;flex:none;will-change:transform}
.row.kk{display:flex}
.fin{animation:fin .34s .16s both}
@keyframes fin{from{opacity:0;transform:translateY(4px)}}
.sz-strip,.sz-corner{width:max-content}
.strip{display:flex;align-items:center;gap:24px;padding:8px 22px 8px 9px;cursor:pointer}
.si{display:flex;align-items:center;gap:9px}
.corner{display:flex;gap:10px;padding:9px;cursor:pointer}
.sz-small{width:360px}
.small{padding:20px 22px 20px;display:flex;flex-direction:column;gap:18px}
.sm1{display:flex;align-items:center;gap:10px}
.sm1 .sp{flex:1}
.sm2{font-size:12px;color:var(--tx2);padding-left:40px;margin-top:4px;white-space:nowrap}
.sz-medium{width:1000px}
.sz-large{width:1256px}
.med{padding:22px 24px 22px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));column-gap:28px;row-gap:26px}
.lg{padding:22px 20px 22px;display:grid;grid-template-columns:205px 337px minmax(0,1fr) minmax(0,1fr);column-gap:22px;row-gap:26px}
.c1r1{grid-column:1;grid-row:1}.c1r2{grid-column:1;grid-row:2}.c2{grid-column:2;grid-row:1 / span 2}
.c3r1{grid-column:3;grid-row:1}.c3r2{grid-column:3;grid-row:2}.c4r1{grid-column:4;grid-row:1}.c4r2{grid-column:4;grid-row:2}
.cl{display:flex;flex-direction:column;min-width:0}
.cl .hd .r b{color:var(--tx);font-weight:500}
.lg .cols{gap:5px}
.lg .col{width:15px}
.rv2{font-size:12px;color:var(--tx2);display:flex;align-items:center;gap:7px;height:28px;margin-top:6px}
.tgs.s4 .tg{font-size:11.5px}
.status2{font-size:12px;color:var(--in);margin:-4px 0 14px}
.status2.off{color:var(--tx2)}
.lg .reads{flex-direction:column;gap:8px;margin-bottom:2px}

/* switcher */
.sw{position:absolute;left:50%;bottom:30px;transform:translateX(-50%);display:flex;gap:2px;padding:4px;border-radius:16px;background:rgba(27,28,39,.78);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);border:1px solid rgba(255,255,255,.085);box-shadow:0 16px 50px rgba(6,4,24,.4)}
.sw button{display:flex;align-items:center;gap:8px;height:32px;padding:0 13px;border-radius:12px;color:var(--tx2);font-size:12.5px;transition:background .2s,color .2s}
.sw button:hover{color:var(--tx)}
.sw button.on{background:rgba(255,255,255,.12);color:var(--tx)}
.sh{display:block;border:1.4px solid currentColor;border-radius:3px;opacity:.9}
.sw kbd{font:inherit;font-size:11px;color:var(--tx3)}
.capline{position:absolute;left:0;right:0;bottom:84px;text-align:center;font-size:12.5px;color:rgba(235,235,245,.62);transition:opacity .25s}
.toast{top:auto;bottom:112px;position:absolute}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important}
}
</style>
</head>
<body>
<div id="stage">
  <div class="mb">
    <div class="mb-l">
      <svg viewBox="0 0 17 20" width="13" height="16" aria-hidden="true"><path fill="#fff" d="M14.1 10.6c0-2.6 2.1-3.8 2.2-3.9-1.2-1.8-3.1-2-3.7-2-1.6-.2-3.1.9-3.9.9-.8 0-2-.9-3.4-.9C3.6 4.8 1.9 5.8 1 7.4c-1.9 3.3-.5 8.2 1.4 10.9.9 1.3 2 2.8 3.4 2.7 1.4-.1 1.9-.9 3.5-.9s2.1.9 3.5.9c1.5 0 2.4-1.3 3.3-2.7 1-1.5 1.5-3 1.5-3.1-.1 0-2.9-1.1-2.9-4.3zM11.5 3c.7-.9 1.2-2.1 1.1-3.3-1 0-2.3.7-3 1.6-.7.8-1.3 2-1.1 3.2 1.1.1 2.3-.6 3-1.5z"/></svg>
      <b>cmux</b><span>File</span><span>Edit</span><span>View</span><span>Window</span><span>Help</span>
    </div>
    <div class="mb-r" id="mbr"></div>
  </div>
  <div class="panel" id="panel"></div>
  <div class="capline" id="capline"></div>
  <div class="sw" id="sw">
    <button data-sz="strip"><i class="sh" style="width:22px;height:7px;border-radius:4px"></i>Strip<kbd>1</kbd></button>
    <button data-sz="corner"><i class="sh" style="width:14px;height:7px;border-radius:4px"></i>Corner<kbd>2</kbd></button>
    <button data-sz="small"><i class="sh" style="width:10px;height:14px"></i>Small<kbd>3</kbd></button>
    <button data-sz="medium"><i class="sh" style="width:20px;height:12px"></i>Medium<kbd>4</kbd></button>
    <button data-sz="large"><i class="sh" style="width:26px;height:15px"></i>Large<kbd>5</kbd></button>
  </div>
  <div class="toast" id="toast"></div>
</div>
<script>
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const C = {mm:'#5B9BFF',lh:'#3FD0B8',wf:'#4CC96B',nn:'#F2B544',in:'#B18CFF'};
const GRAY = 'rgba(235,235,245,.55)';

/* ---------- glyphs ---------- */
const G = {
  mm:'<rect x="4.2" y="4.2" width="7.6" height="7.6" rx="1.6"/><path d="M6.6 1.8v2.4M9.4 1.8v2.4M6.6 11.8v2.4M9.4 11.8v2.4M1.8 6.6h2.4M1.8 9.4h2.4M11.8 6.6h2.4M11.8 9.4h2.4"/>',
  mem:'<rect x="2" y="4.5" width="12" height="6" rx="1.4"/><path d="M4.5 10.5v2M7 10.5v2M9.5 10.5v2M12 10.5v2M5 7h0M8 7h0M11 7h0"/>',
  lh:'<rect x="2.5" y="2.8" width="11" height="4.2" rx="1.4"/><rect x="2.5" y="9" width="11" height="4.2" rx="1.4"/><path d="M5.2 4.9h.01M5.2 11.1h.01" stroke-width="2.2"/>',
  wf:'<circle cx="4.6" cy="3.6" r="1.6"/><circle cx="4.6" cy="12.4" r="1.6"/><circle cx="11.4" cy="5.4" r="1.6"/><path d="M4.6 5.2v5.6M11.4 7c0 2.7-2.4 3.4-5.4 4.2"/>',
  nn:'<path d="M12.6 2.2 8.9 5.9"/><path d="M7.2 6.2l2.6 2.6-1.3 4.6c-.1.4-.6.6-.9.3L2.3 8.4c-.3-.3-.2-.8.3-.9z"/><path d="M5 9.4l-1.4 1.4M6.8 11.2l-1.2 1.2"/>',
  in:'<path d="M1.8 8s2.3-4.3 6.2-4.3S14.2 8 14.2 8s-2.3 4.3-6.2 4.3S1.8 8 1.8 8z"/><circle cx="8" cy="8" r="1.9"/>',
  bat:'<rect x="1.8" y="5" width="10.6" height="6" rx="1.6"/><path d="M14.2 7v2"/><path d="M4 7.2v1.6M6 7.2v1.6M8 7.2v1.6" />',
  plug:'<path d="M5.5 2v3M10.5 2v3M4 5h8v2.5a4 4 0 0 1-8 0zM8 11.5V14"/>',
  therm:'<path d="M6.4 9.6V3.4a1.6 1.6 0 1 1 3.2 0v6.2a2.8 2.8 0 1 1-3.2 0z"/><path d="M8 7v4.2"/>',
  lid:'<path d="M3 4.5h10v6H3z"/><path d="M1.5 12.5h13"/>',
  net:'<path d="M2 6.3a8.6 8.6 0 0 1 12 0M4.2 8.6a5.4 5.4 0 0 1 7.6 0M6.5 10.9a2.1 2.1 0 0 1 3 0"/><path d="M8 13h.01" stroke-width="2"/>',
  bolt:'<path d="M8.8 1.8 3.6 9h4l-.8 5.2L12.4 7h-4z"/>',
  review:'<path d="M2.5 3.5h11v7h-6l-3 2.5v-2.5h-2z"/><path d="M5.5 7l1.5 1.4L10.5 5.6"/>',
  check:'<path d="M4 8.3l2.6 2.5L12 5.4"/>',
  sort:'<path d="M3 4.5h10M3 8h7M3 11.5h4"/>'
};
function gl(k,c,s){s=s||16;return `<svg viewBox="0 0 16 16" width="${s}" height="${s}" fill="none" stroke="${c}" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${G[k]}</svg>`}
const RA = 13.2, LA = 2*Math.PI*RA;
function dash(p){return `${(LA*Math.max(0,Math.min(1,p))).toFixed(2)} ${LA.toFixed(2)}`}
function badge(k,c,p,id,gk){
  return `<span class="bdg"><svg viewBox="0 0 30 30" width="30" height="30" aria-hidden="true"><circle cx="15" cy="15" r="14.2" fill="rgba(255,255,255,.065)"/>${p==null?'':`<circle cx="15" cy="15" r="${RA}" fill="none" stroke="${c}" stroke-opacity=".2" stroke-width="2"/><circle ${id?`id="${id}"`:''} class="arc" cx="15" cy="15" r="${RA}" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round" transform="rotate(-90 15 15)" style="stroke-dasharray:${dash(p)}"/>`}</svg><span class="g">${gl(gk||k,c,15)}</span></span>`;
}
function mk(t,c){
  const P = {
    use:`<circle cx="5" cy="5" r="3.2" fill="${c}" stroke="none"/>`,
    idle:`<circle cx="5" cy="5" r="3.1"/>`,
    merged:`<path d="M1.9 5.3l2.1 2.1 4.2-4.8"/>`,
    stale:`<path d="M5 1.7 8.7 8.2H1.3z"/>`,
    kept:`<rect x="2" y="2" width="6" height="6" rx="1.2" fill="${c}" stroke="none"/>`,
    spared:`<path d="M5 1.2 8.4 2.5v2.7c0 2-1.4 3.3-3.4 3.7C3 8.5 1.6 7.2 1.6 5.2V2.5z"/>`,
    trim:`<circle cx="5" cy="5" r="3.1"/><path d="M5 1.9a3.1 3.1 0 0 1 0 6.2z" fill="${c}" stroke="none"/>`,
    unsorted:`<circle cx="5" cy="5" r="3.1" stroke-dasharray="1.5 1.3"/>`,
    ask:`<rect x="2.4" y="2.4" width="5.2" height="5.2" rx="1" transform="rotate(45 5 5)"/>`,
    report:`<path d="M1.8 5h6.4"/>`,
    done:`<circle cx="5" cy="5" r="3.6"/><path d="M3.3 5.1l1.2 1.2 2.2-2.5"/>`
  };
  return `<svg viewBox="0 0 10 10" width="10" height="10" fill="none" stroke="${c}" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${P[t]}</svg>`;
}

/* ---------- app / tool icons ---------- */
const sv = (b)=>`<svg viewBox="0 0 20 20" width="20" height="20" aria-hidden="true">${b}</svg>`;
const lt = (bg,t,extra)=>`<span class="ai ${extra||''}" style="background:${bg}"><span class="lt">${t}</span></span>`;
const IC = {

    return `<div class="small">
     ${sec(B('mm',s.load/100)+N('load',s.load,0,'%'), pill('mm','now','Now',s.now.length?true:false), K('l-mm',mmLine))}
     ${sec(B('lh',s.lhN?s.idle.length/s.lhN:0)+N('idle',s.idle.length,0,'idle'), pill('lh','idle','Close Idle',s.idle.length?true:false), K('l-lh',lhLine))}
     ${sec(B('wf',s.wfAct/s.wfN)+N('merged',s.merged.length,0,'merged'), pill('wf','merged','Remove Merged',s.merged.length?true:false), K('l-wf',wfLine))}
     ${sec(B('nn',s.used/994)+N('rec',s.rec,1,'GB'), pill('nn','safe','Clean Safe',s.safe.length?true:false), K('l-nn',nnLine))}
     ${sec(B('in',awake?1:0)+NIN(), pill('in','sleep',awake?'Let It Sleep':'Keep Awake',true,true), inStatus())}
    </div>` },
  medium(){ const s=S();
    const mmR = top3(live('mm',r=>r.mark!=='spared')), lhR=top3(live('lh')), wfR=top3(live('wf')), nnR=top3(live('nn'));
    const rest=(all,shown)=>all.filter(r=>!shown.includes(r));
    const mmRest = rest(live('mm'),mmR), lhRest=rest(live('lh'),lhR), wfRest=rest(live('wf'),wfR), nnRest=rest(live('nn'),nnR);
    const cnt=(rs,f,w)=>{const n=rs.filter(f).length; return n?`${n} ${w}`:''};
    const join=(a)=>{a=a.filter(Boolean); return a.length?'Also '+a.join(', '):''};
    return `<div class="med">
     ${cell('','mm', hd(B('mm',s.load/100)+N('load',s.load,0,'%'), `<b>${s.mem.toFixed(1)}</b> / 32 GB`)+`<div class="rows">${mmR.map(rowB).join('')}</div>`
        + more(join([cnt(mmRest,r=>r.mark==='unsorted','unsorted'),cnt(mmRest,r=>r.mark==='spared','spared'),'5 kept']))
        + foot(pill('mm','now','MinMacs Now',nowTxt(s.now))))}
     ${cell('','lh', hd(B('lh',s.lhN?s.idle.length/s.lhN:0)+N('lhN',s.lhN,0,'servers'))+`<div class="rows">${lhR.map(rowB).join('')}</div>`
        + more(join([cnt(lhRest,r=>r.mark==='idle','idle'),cnt(lhRest,r=>r.mark==='use','in use'),cnt(lhRest,r=>r.mark==='kept','kept')]))
        + foot(pill('lh','idle','Close Idle',sumTxt(s.idle))))}
     ${cell('','wf', hd(B('wf',s.wfAct/s.wfN)+N('wfN',s.wfN,0,'worktrees'))+`<div class="rows">${wfR.map(rowB).join('')}</div>`
        + more(join([cnt(wfRest,r=>r.mark==='merged','merged'),cnt(wfRest,r=>r.mark==='stale','stale'),'8 in use or fine']))
        + foot(pill('wf','merged','Remove Merged',sumTxt(s.merged))))}
     ${cell('','nn', hd(B('nn',s.used/994)+N('free',s.free,s.free%1?1:0,'GB free'), `<b>${s.rec.toFixed(1)}</b> GB reclaimable`)+`<div class="rows">${nnR.map(rowB).join('')}</div>`
        + more(nnRest.length?`Also ${gbPlain(sum(nnRest,r=>r.gb))} that asks first or is report only`:'')
        + foot(pill('nn','safe','Clean Safe',s.safe.length?gbPlain(sum(s.safe,r=>r.gb))+' to Trash':false)))}
     ${cell('in','in', hd(B('in',awake?1:0)+NIN())+`<div style="margin:-6px 0 0">${inStatus()}</div>`+toggles()
        + foot(pill('in','sleep',awake?'Let It Sleep':'Keep Awake',true,true)))}
     ${cell('','ws', hd(B('ws',null)+N('wsN',s.ws.length,0,'agents'))+`<div class="rows">${s.ws.map(wsRow).join('')}</div>`
        + foot(wrapped?'':pill('wf','wrap','Wrap Up','fix auth redirect')))}
    </div>` },
  large(){ const s=S();
    const P=[74,83,68,60,79,51,65,72], E=[41,35], T=[82,90,78,72,88,66,76,84,58,52];
    const cols = P.map((v,i)=>`<div class="col"><i style="height:${v}%"></i><b style="bottom:calc(${T[i]}% - 1px)"></b></div>`).join('')+'<span class="gap"></span>'+E.map((v,i)=>`<div class="col e"><i style="height:${v}%"></i><b style="bottom:calc(${T[8+i]}% - 1px)"></b></div>`).join('');
    const used=Math.max(0,s.mem-3.4)/32*100;
    return `<div class="lg">
     ${cell('c1r1','mm', hd(B('mm',s.load/100)+N('load',s.load,0,'%'))+`<div class="cols" id="cols">${cols}</div>
        <div class="mem"><div class="hd">${B('mm',s.mem/32,'mem')}${N('mem',s.mem,1,'/ 32 GB')}<span class="r">Normal</span></div>
        <div class="mbar"><i style="width:${used}%;background:#8DB8FF"></i><i style="left:${used}%;width:${3.4/32*100}%;background:#3E6FC4"></i></div>
        <div class="mline"><span>Compressed <b>3.4</b> GB</span><span>Swap <b>1.1</b> GB</span></div></div>`)}
     ${cell('c1r2','in', hd(B('in',awake?1:0)+NIN())+`<div style="margin:-6px 0 14px">${inStatus()}</div>
        <div class="reads"><div class="rd"><span class="sb">${gl('bat',GRAY,14)}</span><span><b>64</b><span class="unit2">%</span></span><span class="unit2" style="margin-left:-2px">on adapter</span></div><div class="rd"><span class="sb">${gl('therm',GRAY,14)}</span><b>Nominal</b></div></div>`
        + toggles() + foot(pill('in','sleep',awake?'Let It Sleep':'Keep Awake',true,true)))}
     ${cell('c2','mm', `<div class="hd"><span class="ft">${gl('sort',GRAY,14)}<span>The plan for Now, then the rest</span></span><span class="cap" style="margin-left:auto;width:52px">Memory</span></div>`
        + `<div class="rows">${live('mm').concat(KROWS).map(rowB).join('')}</div>`
        + foot(pill('mm','now','MinMacs Now',nowTxt(s.now)), pill('mm','restore','Restore','11:05',true)))}
     ${cell('c3r1','lh', hd(B('lh',s.lhN?s.idle.length/s.lhN:0)+N('lhN',s.lhN,0,'servers'))+`<div class="rows">${live('lh').map(rowB).join('')}</div>`
        + foot(pill('lh','idle','Close Idle',sumTxt(s.idle))))}
     ${cell('c3r2','nn', hd(B('nn',s.used/994)+N('free',s.free,s.free%1?1:0,'GB free'), `<b>${s.rec.toFixed(1)}</b> GB reclaimable`)+`<div class="rows">${live('nn').map(rowB).join('')}</div>`
        + foot(pill('nn','safe','Clean Safe',s.safe.length?gbPlain(sum(s.safe,r=>r.gb))+' to Trash':false)))}
     ${cell('c4r1','wf', hd(B('wf',s.wfAct/s.wfN)+N('wfN',s.wfN,0,'worktrees'))+`<div class="rows">${live('wf').map(rowB).join('')}</div>`
        + more('Not shown: 3 in use, 5 fine') + `<div class="foot" style="padding-top:0">${pill('wf','merged','Remove Merged',sumTxt(s.merged))}</div>`)}
     ${cell('c4r2','ws', hd(B('ws',null)+N('wsN',s.ws.length,0,'agents'))+`<div class="rows">${s.ws.map(wsRow).join('')}</div>`
        + `<div class="rv2">${gl('review',GRAY,14)}<span>Reviewed 9m ago · Haiku · 14k tokens today</span></div>`
        + foot(wrapped?'':pill('wf','wrap','Wrap Up','fix auth redirect')))}
    </div>` }
};
const CAPS = {
  strip:'Strip keeps one figure per expert: load, idle servers, merged worktrees, space to reclaim, awake.',
  corner:'Corner keeps five gauges and nothing to read. Click it to open Small.',
  small:'Small keeps each expert’s figure, what its action would do, and the button.',
  medium:'Medium adds the top three rows of each expert and the workstreams.',
  large:'Large shows every row, the cores and memory, never bigger type.'
};

/* ---------- FLIP between layouts ---------- */
const stage = document.getElementById('stage'), panel = document.getElementById('panel');
let size = 'medium', inner = null;
const LAST = {}, LASTA = {};
function scale(){ return Math.min(innerWidth/1280, innerHeight/800) }
function pos(el){ const s=scale(), st=stage.getBoundingClientRect(), r=el.getBoundingClientRect(); return {x:(r.left-st.left)/s, y:(r.top-st.top)/s} }
function markFade(el){ for(const c of el.children){ if(c.dataset.k) continue; if(c.querySelector('[data-k]')) markFade(c); else c.classList.add('fin'); } }
function render(sz){
  const same = sz===size && inner;
  const old = {};
  if(inner) inner.querySelectorAll('[data-k]').forEach(e=>old[e.dataset.k]=pos(e));
  const nu = document.createElement('div'); nu.className='inner sz-'+sz; nu.innerHTML = LAYOUT[sz]();
  const keys = new Set([...nu.querySelectorAll('[data-k]')].map(e=>e.dataset.k));
  if(inner){
    const g = inner; g.classList.add('ghost');
    if(same) g.style.visibility='hidden';
    g.querySelectorAll('[data-k]').forEach(e=>{ if(keys.has(e.dataset.k)) e.style.visibility='hidden'; else if(same) e.style.visibility='visible' });
    g.getBoundingClientRect(); g.style.opacity='0'; setTimeout(()=>g.remove(), RM?0:260);
  }
  panel.appendChild(nu); inner = nu; size = sz;
  const W = nu.offsetWidth, H = nu.offsetHeight;
  panel.style.width = (W+2)+'px'; panel.style.height = (H+2)+'px';
  panel.style.borderRadius = (sz==='strip'||sz==='corner') ? (H/2+1)+'px' : '22px';
  if(!RM && Object.keys(old).length){
    const moved=[];
    nu.querySelectorAll('[data-k]').forEach(e=>{
      const o = old[e.dataset.k];
      if(o){ const n=pos(e), dx=o.x-n.x, dy=o.y-n.y; if(Math.abs(dx)+Math.abs(dy)>.5){ e.style.transition='none'; e.style.transform=`translate(${dx}px,${dy}px)`; moved.push(e) } }
      else if(!e.parentElement.closest('.fin')) e.classList.add('fin');
    });
    if(!same) markFade(nu);
    nu.getBoundingClientRect();
    requestAnimationFrame(()=>moved.forEach(e=>{ e.style.transition='transform .56s cubic-bezier(.3,.7,.2,1)'; e.style.transform=''; }));
  }
  post();
  document.querySelectorAll('#sw button').forEach(b=>b.classList.toggle('on',b.dataset.sz===sz));
  const cl=document.getElementById('capline'); cl.textContent = CAPS[sz];
}
function post(){
  inner.querySelectorAll('[data-tw]').forEach(el=>{
    const k=el.dataset.tw, to=parseFloat(el.textContent), dec=+el.dataset.dec, from=LAST[k]; LAST[k]=to;
    if(from!=null && Math.abs(from-to)>1e-6 && !RM){ const t0=performance.now(); const st=(t)=>{const q=Math.min(1,(t-t0)/700), e=1-Math.pow(1-q,3); el.textContent=(from+(to-from)*e).toFixed(dec); if(q<1) requestAnimationFrame(st)}; el.textContent=from.toFixed(dec); requestAnimationFrame(st) }
  });
  inner.querySelectorAll('[data-arc]').forEach(el=>{
    const k=el.dataset.arc, p=+el.dataset.p, from=LASTA[k]; LASTA[k]=p;
    if(from!=null && Math.abs(from-p)>1e-6 && !RM){ el.style.transition='none'; el.style.strokeDasharray=dash(from); el.getBoundingClientRect(); el.style.transition=''; el.style.strokeDasharray=dash(p) }
  });
  const ld=document.getElementById('mb-load'); if(ld) ld.innerHTML = Math.round(S().load)+'<small>%</small>';
  const ml=document.getElementById('mb-lh'); if(ml) ml.textContent = S().idle.length;
}

/* ---------- actions ---------- */
let toastT, undoFn=null;
function toast(msg,undo){
  const t=document.getElementById('toast'); undoFn=undo;
  t.innerHTML = `<span class="ok">${gl('check','#4CC96B',12)}</span><span>${msg}</span>${undo?'<button class="pill ghost" id="undo">Undo</button>':''}`;
  t.classList.add('on'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('on'),9000);
  const u=document.getElementById('undo'); if(u) u.onclick=()=>{ t.classList.remove('on'); const f=undoFn; undoFn=null; f&&f(); };
}
function go(rs,msg,extra){
  rs.forEach(r=>r.gone=true); extra&&extra(true); render(size);
  toast(msg,()=>{ rs.forEach(r=>r.gone=false); extra&&extra(false); render(size); });
}
const ACT = {
  now(){ const rs=plan('mm','now'); go(rs, cap1(rs.map(r=>DONE[r.id].replace('closes','quit').replace('trims','trimmed')).join(', '))+` · ${gbPlain(sum(rs,r=>r.gb))} back`) },
  idle(){ const rs=plan('lh','idle'); go(rs,`Closed ${rs.length} idle server${rs.length>1?'s':''} · ${gbPlain(sum(rs,r=>r.gb))} back`) },
  merged(){ const rs=plan('wf','merged'); go(rs,`Removed ${rs.length} merged worktree${rs.length>1?'s':''} · ${gbPlain(sum(rs,r=>r.gb))} to Trash`) },
  safe(){ const rs=plan('nn','safe'); go(rs,`Moved ${gbPlain(sum(rs,r=>r.gb))} to Trash`) },
  wrap(){ const rs=[ALL.p4000,ALL['w-auth']].filter(r=>!r.gone); go(rs,'Wrapped up fix auth redirect · :4000 stopped, worktree removed',(v)=>{wrapped=v}) },
  sleep(){ awake=!awake; render(size); const now=awake; toast(now?'Keeping the Mac awake for speed-3':'Insomnia off · the Mac sleeps as usual',()=>{awake=!now; render(size)}) },
  restore(){ toast('Restore would reopen 2 apps and 14 tabs from 11:05') }
};
stage.addEventListener('click',e=>{
  const a=e.target.closest('[data-act]'); if(a){ if(!a.disabled) ACT[a.dataset.act](); return }
  const t=e.target.closest('[data-tg]'); if(t){ const g=TGB.find(x=>x.id===t.dataset.tg); g.on=!g.on; t.classList.toggle('on',g.on); return }
  const s=e.target.closest('[data-sz]'); if(s){ if(s.dataset.sz!==size) render(s.dataset.sz); return }
  const gg=e.target.closest('[data-go]'); if(gg){ render(gg.dataset.go); return }
});
document.addEventListener('keydown',e=>{
  const m={'1':'strip','2':'corner','3':'small','4':'medium','5':'large'}[e.key];
  if(m && m!==size) render(m);
  if((e.metaKey||e.ctrlKey)&&e.key==='z') document.getElementById('undo')?.click();
});

/* calm core motion */
setInterval(()=>{ if(RM) return; const c=document.querySelectorAll('.inner:not(.ghost) #cols .col'); const P=[74,83,68,60,79,51,65,72,41,35], T=[82,90,78,72,88,66,76,84,58,52];
  c.forEach((col,i)=>{ const v=Math.max(8,Math.min(94,P[i]+(Math.random()*10-5))); col.querySelector('i').style.height=v+'%'; col.querySelector('b').style.bottom=`calc(${Math.min(97,Math.max(v+4,T[i]+(Math.random()*6-3)))}% - 1px)` }) },1400);

function fit(){ const s=scale(); stage.style.transform=`translate(${(innerWidth-1280*s)/2}px,${(innerHeight-800*s)/2}px) scale(${s})` }
addEventListener('resize',fit);
fit(); renderMB(); render('medium');
</script>
</body>
</html>
