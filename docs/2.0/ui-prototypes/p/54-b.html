<title>Holdings Map</title>
<!--
  COMPOSITION (54-b, Holdings Map; three tabs, the Advanced moment is the star)

  Sheet 760 x 580 hangs from the MinMacs icon. Head: three words with icons (Workstreams, Performance,
  Settings) and a quiet live line.

  Workstreams = a live map. Each workstream is an island: its agent sits on the left as a node (a ring
  that pulses while it works, white when it waits for you), subagents orbit it and come and go, and
  what it holds hangs off it on thin lines: servers (teal, a ripple on every request, a hollow ring
  when unused), the worktree with its PR (green), caches (amber squares sized by GB), a headless
  browser. Islands sit in a staggered 3 x 3 field, needs-you first, ready last; ready islands get a
  dashed coral edge and their own Wrap Up. When islands come and go, the others glide to their new spot.
  Leftovers float unowned at the right edge: bubbles sized by what they cost, no lines to anyone,
  drifting slowly, with "Clean Up Leftovers · 31 GB" at their foot. The Wrap Up rule sits in the map
  header ("Wrap Up · Ask · 1 h") and opens in place.

  Performance: as in 54-a (bars with the bright end MinMacs Now frees, apps by fate, agents' load
  nested under their app and linked to their workstream).

  Settings: modes, the Mac column, and Advanced. Turning Advanced on is the moment: the Workstreams
  tab swells, and its holdings pour out of it as colored dots (pink agents, teal servers, green
  worktrees, amber caches) that arc down through the sheet and land in four new tabs as they unfold,
  each landing with a count ("8 agents", "7 servers"). Performance turns into Apps. Off: the dots fly
  back home into Workstreams and the tabs fold behind them.
-->

const wsDisk=w=>wsTree(w)?wsTree(w).gb:0;
const wsMem=w=>sum(wsSrv(w),x=>x.mb/1000);
const wsFree=w=>wsDisk(w)+wsMem(w);
const wsAg=w=>w.ag&&!gone(w.ag)?byId[w.ag]:null;
const ready=()=>WS.filter(w=>w.rdy&&!gone(w.id)&&!has(w.id,'keep'));
const wsAll=()=>WS.filter(w=>!gone(w.id));
const going=()=>WS.filter(w=>!w.rdy&&!gone(w.id));
const mergedAgo=w=>T-w.mm;
const leftLive=()=>LEFT.filter(id=>!gone(id)&&!has(id,'keep')).map(id=>byId[id]);

const subsOf=w=>w.id==='ws-s3'?SUBS:[];

/* ---------- plain words for each mode ---------- */
const AUTOW={
  ws:v=>`Wraps it up for you ${v} after its PR merges and its agents finish, then sends a notice with Undo.`,
  apps:v=>`Quits the apps on Will close for you when load passes ${v}, then sends a notice with Undo.`,
  left:v=>`Cleans them for you ${v} and sends a notice with Undo.`,
  agents:v=>`Brings its tab forward after ${v} of waiting and sends a notice.`,
  servers:v=>`Stops a server for you after ${v} unused, then sends a notice with Undo.`,
  trees:v=>`Moves a worktree to the Trash for you ${v} after merge, then sends a notice with Undo.`,
  disk:v=>`Cleans the safe caches for you ${v}, then sends a notice with Undo.`
};
function modeText(s,i){
  if(i===0) return 'Not watching. Nothing is shown, nothing happens.';
  if(i===1) return 'Shows a button. Nothing happens until you press it.';
  return AUTOW[s.id](s.vals[s.v]);
}
const SHORTM=['not watching','shows a button, waits for you','does it for you, with Undo'];
function nextAuto(s){
  const t=thr(s);
  if(s.id==='ws'){const c=ready().filter(w=>!has(w.id,'spared')&&!wsAg(w)?.st!=='w').map(w=>({o:w,m:t-mergedAgo(w)})).sort((a,b)=>a.m-b.m);return c[0]?{l:'wraps up '+c[0].o.n,o:c[0].o,m:Math.max(0,c[0].m)}:null}
  if(s.id==='servers'){const c=idleSrv().filter(x=>!has(x.id,'spared')).map(x=>({o:x,m:t-idleOf(x)})).sort((a,b)=>a.m-b.m);return c[0]?{l:'stops '+c[0].o.p,o:c[0].o,m:Math.max(0,c[0].m)}:null}
  if(s.id==='trees'){const c=merged().filter(w=>!has(w.id,'spared')).map(w=>({o:w,m:t-treeAge(w)})).sort((a,b)=>a.m-b.m);return c[0]?{l:'removes '+c[0].o.n,o:c[0].o,m:Math.max(0,c[0].m)}:null}
  if(s.id==='agents'){const c=waiting().filter(a=>!has(a.id,'fwd')).map(a=>({o:a,m:t-stAge(a)})).sort((a,b)=>a.m-b.m);return c[0]?{l:'brings '+c[0].o.n+' forward',o:c[0].o,m:Math.max(0,c[0].m)}:null}
  if(s.id==='left'){const g=leftFree();const m=s.v===0?toNight():toSunday();return g?{l:'cleans up '+fmt(g),m}:null}
  if(s.id==='disk'){const g=sum(safeDK(),d=>d.gb);const m=s.v===0?toNight():toSunday();return g?{l:'cleans '+fmt(g),m}:null}
  return null;
}
function nextLine(s){
  if(!s.mode) return 'Not watching.';
  const auto=s.mode===2, n=nextAuto(s);
  if(s.id==='apps'){const L=LOAD(),x=noise().map(a=>a.n.replace('Google ',''));return x.length?`Load is <b>${L} %</b> now. ${auto?'Auto quits':'A button shows for'} ${and(x)} once it passes ${s.vals[s.v]}.`:`Load is <b>${L} %</b>. Nothing on Will close is open.`}
  if(s.id==='left'||s.id==='disk'){if(!n)return 'Nothing is left to clean.';const when=s.v===0?'tonight':'on Sunday';return auto?`Next: Auto ${n.l} ${when}, <b>in ${durC(n.m)}</b>.`:`${n.l.replace('cleans up ','').replace('cleans ','')} could go. Nothing happens until you press.`}
  if(!auto){
    if(s.id==='ws'){const r=ready();return r.length?`<b>${r.length} ready</b> · ${fmt(sum(r,wsFree))}. Wrap Up waits for your press.`:'Nothing is ready to wrap up.'}
    if(s.id==='servers'){const i=idleSrv().filter(x=>idleOf(x)>=thr(s));return i.length?`<b>${i.length} unused</b> for ${s.vals[s.v]} or more. Each waits for your press.`:'No server is unused that long.'}
    if(s.id==='trees'){const m=merged().filter(w=>treeAge(w)>=thr(s));return m.length?`<b>${m.length} merged</b> ${s.vals[s.v]} ago or more. Each waits for your press.`:'Nothing was merged that long ago.'}
    if(s.id==='agents'){const w=waiting();return w.length?`<b>${w[0].n}</b> has waited ${dur(stAge(w[0]))}. A dot shows in the menu bar.`:'Nobody is waiting.'}
  }
  const sp={ws:ready(),servers:idleSrv(),trees:merged(),agents:[]}[s.id].filter(x=>has(x.id,'spared')).map(x=>x.p||x.n);
  const tail=sp.length?` ${and(sp)} stay${sp.length>1?'':'s'}, you undid ${sp.length>1?'them':'it'}.`:'';
  if(!n) return 'Nothing is coming up.'+tail;
  return (n.m<=0?`Auto ${n.l} now.`:`Next: Auto ${n.l} <b>in ${durC(n.m)}</b>.`)+tail;
}

/* ---------- actions ---------- */
const A=(a,l,tl,dis,id)=>({a,l,tl,dis,id});
function acts(kind,o){
  if(kind==='ws'){
    const r=[], sv=wsSrv(o), ag=wsAg(o);
    if(o.rdy) r.push(A('wrapws','Wrap Up',fmt(wsFree(o))));
    else r.push(A('','Wrap Up',o.id==='ws-med'&&TESTS?'tests running':o.block,1));
    if(ag) r.push(A('nav','Go to Tab','',0,ag.id));
    if(o.pr) r.push(A('openpr','Open PR','#'+o.pr.n));
    if(sv.length&&!o.rdy) r.push(A('stopws','Stop Servers',fmt(wsMem(o))));
    if(o.rdy&&!has(o.id,'keep')) r.push(A('keep','Keep'));
    if(wsTree(o)&&r.length<4) r.push(A('editor','Open in Editor'));
    return r;
  }
  if(kind==='agent'){
    const r=[];
    if(o.st==='f') r.push(A('wrapws','Wrap Up',fmt(wsFree(byId[o.ws])),0,o.ws));
    if(o.st==='n') r.push(A('nav','Answer in Tab','',0,o.id)); else r.push(A('nav','Go to Tab'));
    r.push(A('gows','Workstream','',0,o.ws));
    if(o.st!=='f'&&wsSrv(byId[o.ws]).length) r.push(A('stopws','Stop Its Servers','',0,o.ws));
    return r;
  }
  if(kind==='app'){
    if(o.cls==='spared') return [A('','Quit','Playwright drives it',1),A('gows','Workstream','speed-3',0,'ws-s3')];
    if(o.cls==='kept') return [A('','Quit','kept',1)];
    const r=[A('quit','Quit',fmt(memOf(o)))];
    if(o.id==='chrome'&&!has('chrome','trim')) r.push(A('trim','Trim Tabs','14'));
    if(isNoise(o)) r.push(A('keep','Keep'));
    else if(o.cls==='unsorted') r.push(A('list','Move to Will close'));
    return r;
  }
  if(kind==='srv'){
    if(o.kept) return [A('open','Open in Browser'),A('','Stop','Docker runs it',1)];
    const r=[A('stop','Stop',fmt(o.mb/1000)),A('open','Open in Browser')];
    if(o.ws) r.push(A('gows','Workstream','',0,o.ws));
    if(o.idle&&!has(o.id,'keep')) r.push(A('keep','Keep'));
    return r;
  }
  if(kind==='wt'){
    if(o.id==='wt-bp7') return [A('','Remove','1 commit not in main',1),A('editor','Open in Editor')];
    if(o.k==='u'||o.k==='f') return [A('finder','Show in Finder'),A('editor','Open in Editor')].concat(o.ws?[A('gows','Workstream','',0,o.ws)]:[]);
    const r=[A('rmtree','Remove',o.id==='wt-bp8'?'bundle saved':fmt(o.gb)),A('finder','Show in Finder')];
    if(o.ws) r.push(A('gows','Workstream','',0,o.ws));
    if(!has(o.id,'keep')) r.push(A('keep','Keep'));
    return r;
  }
  if(kind==='dk'){
    if(o.rep) return [A('finder','Show in Finder'),A('','Clean','report only',1)];
    const r=[A('clean','Clean',fmt(o.gb))];
    if(!has(o.id,'keep')) r.push(A('keep','Keep'));
    r.push(A('finder','Show in Finder'));
    return r;
  }
  return [];
}
const kindOf=o=>o.p?'srv':o.why?'wt':o.gb!==undefined&&DK.includes(o)?'dk':o.segs?'agent':o.cls?'app':'ws';
const abtn=(x,id)=>x.dis?`<span class="ab dis">${x.l}<span class="tl">${x.tl}</span></span>`:`<button class="ab" data-act="${x.a}" data-id="${x.id||id}">${x.l}${x.tl?`<span class="tl">${x.tl}</span>`:''}</button>`;
const actsHTML=(kind,o,max)=>`<span class="acts">${acts(kind,o).slice(0,max||4).map(x=>abtn(x,o.id)).join('')}</span>`;
function nm(o){return o.p?o.p+' '+o.k:o.n}
function wrapWs(id){const w=byId[id];wsSrv(w).forEach(x=>fl(x.id).gone=1);if(wsTree(w))fl(w.wt).gone=1;if(w.ag)fl(w.ag).gone=1;fl(id).gone=1}
function wsLeave(w){return [w.id].concat(wsSrv(w).map(x=>x.id),wsTree(w)?[w.wt]:[],w.ag?[w.ag]:[])}
function wrapParts(w){const p=[];const s=wsSrv(w);if(s.length)p.push('stopped '+and(s.map(x=>x.p)));if(wsTree(w))p.push('removed '+w.br+(w.cache.length?' and its caches':''));if(w.brw)p.push('closed '+w.brw);return p.join(', ')||'nothing was left'}
const wrapMsg=w=>`Wrapped up <b>${w.n}</b>, ${fmt(wsFree(w))} back: ${wrapParts(w)}.`;
function cleanLeft(o){fl(o.id).gone=1}
function runAct(a,id){
  const o=byId[id], name=nm(o);
  if(a==='gows'){hideCard();goWs(id);return}
  const info={nav:`Switched to <b>${name}</b> in ${o.where||'its tab'}.`,openpr:o.pr?`Opened <b>#${o.pr.n}</b> on GitHub.`:'',
    open:`Opened <b>localhost${o.p}</b> in the browser.`,finder:`Showing <b>${name}</b> in Finder.`,editor:`Opened <b>${o.br||name}</b> in Cursor.`};
  if(info[a]){hideCard();if(a==='nav'&&o.st==='n')commit(info[a],()=>{fl(id).seen=1});else toast(info[a],false);return}
  const M={
    quit:()=>[`Quit <b>${name}</b>, freed ${fmt(memOf(o))}. Restore brings it back.`,()=>{fl(id).gone=1},[id]],
    trim:()=>[`Closed <b>14 noise tabs</b> in Chrome. 31 work tabs stay.`,()=>{fl(id).trim=1},[]],
    keep:()=>[`<b>${name}</b> stays. MinMacs leaves it alone.`,()=>{fl(id).keep=1},[]],
    list:()=>[`<b>${name}</b> is on Will close now.`,()=>{fl(id).list=1},[]],
    stop:()=>[`Stopped <b>${name}</b>, freed ${fmt(o.mb/1000)}.`,()=>{fl(id).gone=1},[id]],
    rmtree:()=>[`Moved <b>${name}</b> to the Trash${o.id==='wt-bp8'?', a git bundle saved':''}${o.srv&&!gone(o.srv)?', stopped '+byId[o.srv].p:''}.`,()=>{fl(id).gone=1;if(o.srv)fl(o.srv).gone=1},[id]],
    clean:()=>[o.tool?`${o.tool} cleaned its own <b>${o.n}</b>, ${fmt(o.gb)}.`:`Moved <b>${o.n}</b> to the Trash, ${fmt(o.gb)}.`,()=>{fl(id).gone=1},[id]],
    wrapws:()=>[wrapMsg(o),()=>wrapWs(id),wsLeave(o)],
    stopws:()=>{const s=wsSrv(o);return [`Stopped ${s.map(x=>'<b>'+x.p+'</b>').join(' and ')} for ${o.n}, freed ${fmt(wsMem(o))}.`,()=>s.forEach(x=>fl(x.id).gone=1),s.map(x=>x.id)]}
  };
  if(!M[a]) return;
  const [msg,fn,leave]=M[a]();
  hideCard();
  commit(msg,fn,leave);
}

/* ---------- commit / undo / toast ---------- */
let tT, lastAuto=-1e9, busy=0, advAt=-1e9;
function hideToast(){$('toast').classList.remove('show')}
function toast(msg,undo){$('tt').innerHTML=nb(msg);$('tbtn').style.display=undo===false?'none':'';$('toast').classList.add('show');clearTimeout(tT);tT=setTimeout(hideToast,6500)}
function commit(msg,fn,leave,spare){
  const pre=snap();
  const doit=()=>{fn();UNDO.push({s:pre,spare:spare||[]});LEAVE.clear();busy=0;refresh();toast(msg)};
  hidePv();
  if(leave&&leave.length&&!RM){busy=1;leave.forEach(id=>LEAVE.add(id));refresh();setTimeout(doit,420)} else doit();
}
$('tbtn').onclick=()=>{const u=UNDO.pop();if(!u)return;restoreSnap(u.s);u.spare.forEach(id=>fl(id).spared=1);refresh();hideToast()};

/* ---------- DOM morph: keeps hover and focus while numbers tick ---------- */
function morph(a,b){
  if(a.nodeType!==b.nodeType||a.nodeName!==b.nodeName){a.replaceWith(b);return b}
  if(a.nodeType===3||a.nodeType===8){if(a.nodeValue!==b.nodeValue)a.nodeValue=b.nodeValue;return a}
  for(const at of [...a.attributes]) if(!b.hasAttribute(at.name)) a.removeAttribute(at.name);
  for(const at of [...b.attributes]) if(a.getAttribute(at.name)!==at.value) a.setAttribute(at.name,at.value);
  morphKids(a,b);return a;
}
function morphKids(a,b){
  const ak=[...a.childNodes], bk=[...b.childNodes];
  const keyed=new Map(), un=[];
  ak.forEach(n=>{const k=n.nodeType===1&&n.getAttribute('data-k');if(k)keyed.set(k,n);else un.push(n)});
  let ui=0;const out=[];
  for(const n of bk){
    const k=n.nodeType===1&&n.getAttribute('data-k');
    let m=k?keyed.get(k):un[ui++];
    if(k&&m)keyed.delete(k);
    out.push(m?morph(m,n):n);
  }
  keyed.forEach(n=>n.remove());for(;ui<un.length;ui++)un[ui].remove();
  out.forEach((n,i)=>{if(a.childNodes[i]!==n)a.insertBefore(n,a.childNodes[i]||null)});
  while(a.childNodes.length>out.length)a.lastChild.remove();
}
function put(el,html){const t=document.createElement(el.tagName);t.innerHTML=html;morphKids(el,t)}

}
function vals(s){return s.vals.map((v,i)=>`<button class="vchip" role="radio" aria-checked="${i===s.v}" data-val="${s.id}:${i}" style="--c:${s.c}">${v}</button>`).join('')}
function mxText(s){

function modeBlock(s,title){

    const kind=o.p?'srv':o.why?'wt':'dk';
    const st=o.p?'Nobody uses it · unused 3 d':o.why?(o.k==='s'?'Stale · '+o.why:'Merged · no workstream holds it'):o.lx;
    const f=o.p?[['Kind',o.k],['Memory',o.mb+' MB'],['Owner','no workstream']]:o.why?[['Size',fmt(o.gb)],['Last commit',dur(treeAge(o))+' ago'],['Owner','no workstream']]:[['Size',fmt(o.gb)],['What',o.x],['Owner','no workstream']];
    const a=acts(kind,o);
    return `<div class="ct">${nm(o)}</div><div class="cs" style="color:${C.disk}">${st}</div><div class="cf">${f.map(([x,y])=>`<span>${x}</span><span>${nb(y)}</span>`).join('')}</div><div class="ca">${a.slice(0,3).map(x=>x.dis?`<span class="dis"><span>${x.l}</span><span class="tl" style="font-size:11px">${x.tl}</span></span>`:`<button data-act="${x.a}" data-id="${x.id||o.id}"><span>${x.l}</span><span class="tl">${x.tl||''}</span></button>`).join('')}</div>`;
  }
  return '';
}
function fillCard(key){const h=cardHTML(key);if(!h){hideCard();return}const c=$('card');if(c._h!==h){c.innerHTML=h;c._h=h}}
function showCard(el){
  clearTimeout(cardT);clearTimeout(cardHideT);
  const key=el.dataset.card;
  cardT=setTimeout(()=>{
    cardFor=key;fillCard(key);const c=$('card'),r=rel(el);
    const h=c.offsetHeight||200;let x=r.x+r.w+8,y=r.y-6;
    if(x+300>752)x=r.x-308;
    if(key.startsWith('left')){x=r.x-308;y=r.y-20}
    x=Math.max(12,Math.min(760-312,x));y=Math.max(12,Math.min(580-h-12,y));
    c.style.left=x+'px';c.style.top=y+'px';c.classList.add('show');
  },key.startsWith('ws')?320:220);
}
function hideCard(){clearTimeout(cardT);$('card').classList.remove('show');cardFor=null}
function showPv(b){
  const k=b.dataset.sa,a=SA[k];if(!a||!a.on())return;
  PV=k;refresh();
  const p=$('pv');p.innerHTML=a.res().map(x=>`<p>${nb(x)}</p>`).join('');
  const r=rel(b);const h=p.offsetHeight||90;
  let x=Math.min(760-316,Math.max(12,r.x+r.w-300)),y=r.y+r.h+8;if(y+h>570)y=r.y-h-8;
  p.style.left=x+'px';p.style.top=y+'px';p.classList.add('show');
}
function hidePv(){if(!PV&&!$('pv').classList.contains('show'))return;PV=null;$('pv').classList.remove('show');refresh()}
document.addEventListener('mouseover',e=>{
  const c=e.target.closest('[data-card]');
  if(c){if(cardFor!==c.dataset.card)showCard(c);else clearTimeout(cardHideT)}
  else if(e.target.closest('#card')){clearTimeout(cardHideT)}
  else if(cardFor||$('card').classList.contains('show')){clearTimeout(cardT);clearTimeout(cardHideT);cardHideT=setTimeout(hideCard,160)}
  else clearTimeout(cardT);
  const sa=e.target.closest('[data-sa]');
  if(sa&&PV!==sa.dataset.sa&&sa.dataset.sa!=='restore')showPv(sa);
  else if(!sa&&PV)hidePv();
  const md=e.target.closest('[data-mode]');
  if(md){const [s,i]=md.dataset.mode.split(':');if(!MH||MH.s!==s||MH.i!=+i){MH={s,i:+i};refresh()}}
  else if(MH){MH=null;refresh()}
});

/* ---------- Auto: acts when a timer crosses its value, then a notice with Undo ---------- */
function autoCheck(){
  if(performance.now()-lastAuto<6000||busy||performance.now()-advAt<8000) return;
  const auto=k=>S[k].mode===2;
  if(auto('ws')){const w=ready().find(w=>mergedAgo(w)>=thr(S.ws)&&!has(w.id,'spared'));if(w){lastAuto=performance.now();commit(`<span class="au">Auto</span> ${wrapMsg(w).replace('Wrapped','wrapped')}`,()=>wrapWs(w.id),wsLeave(w),[w.id]);return}}
  if(auto('apps')&&LOAD()>thr(S.apps)){const n=noise().filter(a=>!has(a.id,'spared'));if(n.length){lastAuto=performance.now();commit(`<span class="au">Auto</span> quit <b>${and(n.map(a=>a.n))}</b>, load passed ${S.apps.vals[S.apps.v]}.`,()=>n.forEach(a=>fl(a.id).gone=1),n.map(a=>a.id),n.map(a=>a.id));return}}
  if(!ADV) return;
  if(auto('servers')){const x=idleSrv().find(x=>idleOf(x)>=thr(S.servers)&&!has(x.id,'spared'));if(x){lastAuto=performance.now();commit(`<span class="au">Auto</span> stopped <b>${x.p} ${x.k}</b>, unused ${dur(idleOf(x))}. ${fmt(x.mb/1000)} back.`,()=>{fl(x.id).gone=1},[x.id],[x.id]);return}}
  if(auto('trees')){const w=merged().find(w=>treeAge(w)>=thr(S.trees)&&!has(w.id,'spared'));if(w){lastAuto=performance.now();commit(`<span class="au">Auto</span> moved <b>${w.n}</b> to the Trash, merged ${dur(treeAge(w))} ago.`,()=>{fl(w.id).gone=1;if(w.srv)fl(w.srv).gone=1},[w.id],[w.id]);return}}
  if(auto('agents')){const a=waiting().find(a=>stAge(a)>=thr(S.agents)&&!has(a.id,'fwd'));if(a){lastAuto=performance.now();fl(a.id).fwd=1;toast(`<span class="au">Auto</span> brought <b>${a.n}</b> forward in its ${a.where}. It asks “${a.q}”`,false);return}}
}

/* ---------- simulation: things come and go ---------- */
function setSt(id,st){const a=byId[id];const l=lastSeg(a);if(l&&l[1]===null)l[1]=T;a.segs.push([T,null,st]);a.st=st}
function arrive(ids){ids.forEach(id=>{SIMG.delete(id);NEW.set(id,performance.now())});setTimeout(refresh,5100)}
function depart(ids,then){
  ids=ids.filter(id=>!gone(id)||SUBS.includes(id));if(!ids.length)return;
  ids.forEach(id=>FIN.set(id,performance.now()));refresh();
  setTimeout(()=>{ids.forEach(id=>LEAVE.add(id));refresh();
    setTimeout(()=>{ids.forEach(id=>{FIN.delete(id);LEAVE.delete(id);if(SUBS.includes(id))SUBS=SUBS.filter(x=>x!==id);else SIMG.add(id)});if(then)then();refresh()},RM?0:450)},2600);
}
let subN=2;
const EV=[
  ()=>{subN++;const id='sa'+subN;SUBS.push(id);NEW.set(id,performance.now());setTimeout(refresh,1700)},
  ()=>{TESTS=false},
  ()=>{if(!has('s5174','gone')){byId.s5174.t0=T;arrive(['s5174'])}},
  ()=>{const id=SUBS[SUBS.length-1];if(SUBS.length>2)depart([id])},
  ()=>{if(!gone('icons'))depart(['ws-ic'],()=>SIMG.add('icons'))},
  ()=>{const a=byId.docs;a.segs=[[T,null,'w']];a.st='w';arrive(['docs','ws-docs'])},
  ()=>{if(!gone('s5174'))depart(['s5174'])},
  ()=>{TESTS=true;if(byId.lanec.st==='w')setSt('lanec','i')},
  ()=>{if(!gone('ws-docs'))depart(['ws-docs'],()=>SIMG.add('docs'))},
  ()=>{const a=byId.icons;a.segs.push([T,null,'w']);const l=a.segs[a.segs.length-2];if(l&&l[1]===null)l[1]=T;a.st='w';arrive(['icons','ws-ic']);if(byId.lanec.st==='i')setSt('lanec','w')}
];
let paused=false,tickN=0,evI=0;
function jitter(){
  const r=()=>Math.random()-.5;
  J.load=Math.max(-4,Math.min(4,J.load*.6+r()*3));J.mem=Math.max(-.35,Math.min(.35,J.mem*.6+r()*.25));
  APPS.forEach(a=>{J.app[a.id]=Math.max(-a.cpu*.07,Math.min(a.cpu*.07,(J.app[a.id]||0)*.6+r()*a.cpu*.08))});
  AG.forEach(a=>{J.app['ag'+a.id]=a.st==='w'?r()*3:0});
}
function reqTick(){SRV.forEach(s=>{const busy=s.use&&!gone(s.id);const v=busy?(Math.random()<.45?.25+Math.random()*.75:Math.random()*.12):0;REQ[s.id].push(v);REQ[s.id].shift()})}
function tick(){
  if(paused)return;
  T+=.1;tickN++;reqTick();
  if(tickN%2===0)jitter();
  if(tickN%8===3){EV[evI%EV.length]();evI++}
  autoCheck();refresh();
}
$('pz').onclick=()=>{paused=!paused;$('sim').classList.toggle('paused',paused);$('pz').textContent=paused?'Play':'Pause';$('simt').textContent=paused?'Paused · nothing moves until you press Play':'Live · time runs 6× here, so you can watch things change'};

/* ---------- clicks ---------- */
document.addEventListener('click',e=>{
  const t=e.target;
  if(RP&&!t.closest('#rpop')&&!t.closest('[data-rp]'))setRP(false);
  const tb=t.closest('[data-tab]');if(tb){go(tb.dataset.tab);return}
  if(t.closest('[data-rp]')){setRP(!RP);return}
  const md=t.closest('[data-mode]');if(md){const [k,i]=md.dataset.mode.split(':'),s=S[k],m=+i;if(m===s.mode)return;const was=MODES[s.mode];MH=null;commit(`${s.name}: <b>${MODES[m]}</b> now, was ${was}. ${modeText(s,m)}`,()=>{s.mode=m});return}
  const vl=t.closest('[data-val]');if(vl){const [k,i]=vl.dataset.val.split(':'),s=S[k],v=+i;if(v===s.v)return;const was=s.vals[s.v];commit(`${s.name}: <b>${s.lab?s.lab+' ':''}${s.vals[v]}</b> now, was ${was}.`,()=>{s.v=v});return}
  const sw=t.closest('[data-sw]');if(sw){const k=sw.dataset.sw;commit(k==='one'?(one?'Each tab has its own menu bar icon again.':'<b>One icon</b> in the menu bar now.'):(login?'MinMacs will not open at login.':'MinMacs opens at login.'),()=>{if(k==='one'){one=!one;buildIcons()}else login=!login});return}
  if(t.closest('[data-adv]')){const v=!ADV;const pre=snap();setAdv(v);UNDO.push({s:pre,spare:[]});toast(v?'<b>Advanced mode</b> is on: Agents, Apps, Servers, Worktrees and Disk.':'<b>Advanced mode</b> is off. Back to three tabs.');return}
  if(t.closest('[data-lid]')){commit(lid?'Closing the lid sleeps the Mac again. Agents pause with it.':'<b>Your agents keep working</b> with the lid closed.',()=>{lid=!lid});return}
  const gw=t.closest('[data-gows]');if(gw){hideCard();goWs(gw.dataset.gows);return}
  const sa=t.closest('[data-sa]');if(sa){const a=SA[sa.dataset.sa];if(!a.on())return;const [msg,fn]=a.run();const tg=a.t();PV=null;commit(msg,fn,tg);return}
  const ac=t.closest('[data-act]');if(ac){runAct(ac.dataset.act,ac.dataset.id);return}
  const mi=t.closest('[data-mi]');if(mi){if(mi.dataset.mi!=='one')go(mi.dataset.mi);return}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if(RP)setRP(false);hideCard();return}
  if((e.key==='ArrowRight'||e.key==='ArrowLeft')&&e.target.closest('.tabs')){const L=tabList(),i=L.indexOf(tab)+(e.key==='ArrowRight'?1:-1);if(L[i]){go(L[i]);setTimeout(()=>$('tabs').querySelector(`[data-tab="${L[i]}"]`).focus(),200)}e.preventDefault()}
});

/* ---------- stage ---------- */
function fit(){const s=Math.min(innerWidth/1280,innerHeight/800);$('stage').style.transform=`scale(${s})`;$('stage').style.left=(innerWidth-1280*s)/2+'px';$('stage').style.top=(innerHeight-800*s)/2+'px'}
addEventListener('resize',()=>{fit();placeNub();placeHL()});
fit();buildIcons();$('pin').innerHTML=FRONT[tab]();renderTabs(false);refresh();setInterval(tick,1000);
</script>
