<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quiet Command Line</title>
<style>
:root{
  --glass:rgba(28,29,38,.9);
  --line:rgba(255,255,255,.06);
  --tx:rgba(255,255,255,.94);
  --tx2:rgba(235,235,245,.6);
  --tx3:rgba(235,235,245,.32);
  --g1:rgba(255,255,255,.07);
  --g2:rgba(255,255,255,.2);
  --g3:rgba(255,255,255,.42);
  --ease:cubic-bezier(.3,.7,.2,1);
  --c:#5B9BFF;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#1a1636}
body{font-family:-apple-system,"SF Pro Text",system-ui,sans-serif;color:var(--tx);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;font-size:13px;cursor:default;user-select:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;text-align:left}
input{font:inherit;color:inherit;border:0;background:none;outline:none}
b{font-weight:500}
:focus{outline:none}
.it:focus-visible,.modes button:focus-visible,.opts button:focus-visible,.sw:focus-visible,.undo:focus-visible{outline:2px solid rgba(255,255,255,.45);outline-offset:3px;border-radius:8px}
#stage{position:absolute;left:0;top:0;width:1280px;height:800px;transform-origin:0 0;overflow:hidden;
  background:
   radial-gradient(760px 560px at 10% 6%,#4b3c9e 0%,rgba(75,60,158,0) 70%),
   radial-gradient(700px 520px at 84% 2%,#22618f 0%,rgba(34,97,143,0) 70%),
   radial-gradient(820px 620px at 88% 104%,#a0436f 0%,rgba(160,67,111,0) 70%),
   radial-gradient(640px 520px at 18% 100%,#3a2463 0%,rgba(58,36,99,0) 75%),
   #1d1a3c}

/* menu bar */
.mb{position:absolute;left:0;right:0;top:0;height:26px;display:flex;align-items:center;justify-content:space-between;padding:0 12px 0 16px;background:rgba(18,14,40,.32);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);font-size:13px;color:rgba(255,255,255,.92);z-index:5}
.mb-l,.mb-r{display:flex;align-items:center;gap:18px}
.mb-l b{font-weight:700}
.mb-r{gap:14px}
.icons{position:relative;display:flex;align-items:center;gap:12px}
.hl{position:absolute;top:-3px;height:22px;width:28px;border-radius:6px;background:rgba(255,255,255,.2);transition:transform .45s var(--ease),opacity .3s;pointer-events:none}
.mi{position:relative;display:flex;width:16px;overflow:hidden;cursor:pointer;transition:width .4s var(--ease),opacity .3s,margin .4s var(--ease)}
.mi.off{width:0;opacity:0;margin-left:-12px}

/* sheet */
.sheet{position:absolute;top:34px;left:372px;width:868px;background:var(--glass);backdrop-filter:blur(36px) saturate(1.5);-webkit-backdrop-filter:blur(36px) saturate(1.5);border:1px solid rgba(255,255,255,.085);border-radius:22px;box-shadow:0 34px 100px rgba(6,4,24,.5),inset 0 1px 0 rgba(255,255,255,.035);animation:drop .6s var(--ease) both}
@keyframes drop{from{opacity:0;transform:translateY(-10px)}}
.nub{position:absolute;top:-8px;left:0;width:18px;height:8px;margin-left:-9px;transition:transform .45s var(--ease)}
.nub svg{display:block}

/* head: Today line, and the toast that slides over it */
.head{position:relative;height:52px;margin:0 30px;white-space:nowrap}
.head>div{position:absolute;inset:0;display:flex;align-items:center;gap:12px;transition:opacity .3s,transform .4s var(--ease)}
.head .lbl{font-size:12px;color:var(--tx3)}
.head .txt{font-size:13px;color:var(--tx2);overflow:hidden;text-overflow:ellipsis}
.head .txt b{color:var(--tx)}
.undo{margin-left:auto;flex:none;display:flex;align-items:center;gap:7px;font-size:13px;font-weight:500;height:26px;padding:0 12px;border-radius:13px;background:rgba(255,255,255,.07);transition:background .2s}
.undo:hover{background:rgba(255,255,255,.13)}
.toast{opacity:0;transform:translateY(-8px);pointer-events:none}
.toast .tdot{flex:none;width:7px;height:7px;border-radius:50%;background:var(--tc,#fff)}
.toast .txt{color:var(--tx)}
.toast .txt .g{color:var(--tx2)}
.head.t .today{opacity:0;transform:translateY(8px);pointer-events:none}
.head.t .toast{opacity:1;transform:none;pointer-events:auto}

.body{display:grid;grid-template-columns:306px 1fr;column-gap:34px;padding:2px 30px 18px;height:624px}

/* ---------- left: the live index ---------- */
.idx{display:flex;flex-direction:column}
.leg{font-size:11px;color:var(--tx3);height:22px;line-height:14px;white-space:nowrap;display:flex;align-items:flex-start;justify-content:flex-end;gap:6px}
.leg i{display:inline-block;width:12px;height:5px;border-radius:3px;margin-top:5px;background:linear-gradient(90deg,#FF9070,#5B9BFF 25%,#3FD0B8 45%,#4CC96B 62%,#F2B544 80%,#B18CFF)}
.it{flex:1;display:flex;align-items:center;gap:12px;width:100%;border-radius:12px}
.it .dot{flex:none;width:9px;height:9px;border-radius:50%;box-shadow:inset 0 0 0 1.5px rgba(235,235,245,.28);transition:background .35s,box-shadow .35s}
.it .nm{flex:1;min-width:0;font-size:23px;font-weight:600;letter-spacing:-.022em;color:rgba(235,235,245,.36);transition:color .3s;white-space:nowrap}
.it:hover .nm{color:var(--tx2)}
.it.sel .nm{color:var(--tx)}
.mg{flex:none;position:relative;width:56px;height:24px;display:flex;align-items:flex-end;justify-content:space-between;transition:opacity .4s,filter .4s}
.it.m0 .mg{opacity:.28;filter:grayscale(1)}
.mg i{display:block;transition:height .6s var(--ease),width .6s var(--ease),left .6s var(--ease),background .35s,opacity .35s,box-shadow .35s}
.mg .tr{position:absolute;left:0;right:0;top:9px;height:6px;border-radius:3px;background:var(--g1)}
.mg .tr i{position:absolute;top:0;bottom:0;border-radius:3px}
.mg .tr .tk{top:-4px;bottom:-4px;width:2px;margin-left:-1px;border-radius:1px;background:#fff}
.mg.mc i{flex:none;border-radius:2px}
.mg.dots{flex-wrap:wrap;align-content:center;justify-content:space-between;row-gap:4px}
.mg.dots i{width:6px;height:6px;border-radius:50%}
.mg.ring{justify-content:flex-end;align-items:center}
.nb{flex:none;width:80px;display:flex;flex-direction:column;align-items:flex-end;white-space:nowrap}
.nb .n{font-size:16px;font-weight:500;line-height:19px;color:var(--tx2);transition:color .3s}
.nb .n u{text-decoration:none;font-size:11px;font-weight:400;color:var(--tx3);margin-left:3px}
.nb .cp{font-size:11px;line-height:15px;color:var(--tx3)}
.it.sel .nb .n{color:var(--tx)}

/* ---------- right: right now + actions + rows + settings ---------- */
.det{position:relative;min-width:0}
.det .in{transition:opacity .2s,transform .35s var(--ease)}
.det .in.swap{opacity:0;transform:translateY(6px)}
.lab{display:flex;align-items:center;height:16px;font-size:12px;color:var(--tx3);white-space:nowrap}
.lab .key{margin-left:auto;display:flex;align-items:center;gap:6px;color:var(--tx3)}
.lab .key i{width:7px;height:7px;border-radius:50%;background:var(--c)}
.big{display:flex;align-items:baseline;gap:6px;white-space:nowrap;height:46px;margin-top:2px}
.big .n{font-size:40px;font-weight:500;letter-spacing:-.02em;line-height:46px}
.big .u{font-size:15px;color:var(--tx2)}
.big .n2{margin-left:auto;font-size:13px;color:var(--tx2)}
.big .n2 b{color:var(--tx)}
.say{margin-top:2px;font-size:14px;line-height:20px;color:var(--tx2);height:40px;transition:color .2s}
.say b{color:var(--tx)}
.say.pv{color:var(--tx)}
.say.pv b{color:var(--c)}
.say .why{color:var(--tx3)}
.gr{margin-top:8px;transition:opacity .4s,filter .4s}
.det.off .gr{filter:grayscale(1);opacity:.5}
.mt+.mt{margin-top:10px}
.mt .hd{display:flex;align-items:baseline;justify-content:space-between;height:16px;font-size:12px;color:var(--tx3);white-space:nowrap}
.mt .hd b{color:var(--tx)}
.mt .hd span:last-child{color:var(--tx2)}
.tb{position:relative;height:6px;margin-top:6px;border-radius:3px;background:var(--g1)}
.tb i{position:absolute;top:0;bottom:0;border-radius:3px;transition:left .6s var(--ease),width .6s var(--ease),background .35s,opacity .3s,box-shadow .3s}
.tb .tk{top:-4px;bottom:-4px;width:2px;margin-left:-1px;border-radius:1px;background:#fff}
.cols{display:flex;align-items:flex-end;gap:5px;height:48px}
.cols .cl{flex:1;position:relative;height:100%;border-radius:4px;background:rgba(255,255,255,.035)}
.cols .cl i{position:absolute;left:0;right:0;bottom:0;border-radius:4px;transition:height .6s var(--ease),background .35s,opacity .3s,box-shadow .35s}
.cleg{display:flex;gap:12px;margin-top:7px;font-size:11px;color:var(--tx3);white-space:nowrap}
.cleg span{display:flex;align-items:center;gap:5px}
.cleg i{width:8px;height:8px;border-radius:2px}
.adots{display:flex;align-items:center;gap:9px;height:22px;margin-top:6px}
.adots i{width:13px;height:13px;border-radius:50%;transition:background .35s,box-shadow .35s,opacity .3s,transform .35s var(--ease)}
.det.pvg [data-g]:not(.hit){opacity:.28}
.det.pvg [data-g].hit{box-shadow:0 0 0 1.5px rgba(255,255,255,.55)}
.det.pvg .adots i.hit{transform:scale(1.18)}

/* section actions */
.sas{display:flex;gap:10px;margin-top:14px;height:32px}
.sa{display:flex;align-items:center;gap:8px;height:32px;padding:0 14px;border-radius:16px;background:rgba(255,255,255,.06);font-size:13.5px;font-weight:500;white-space:nowrap;transition:background .2s,opacity .3s,box-shadow .2s}
.sa .tl{font-weight:400;color:var(--tx2)}
.sa.pri{background:color-mix(in srgb,var(--c) 20%,transparent)}
.sa:hover,.sa:focus{background:rgba(255,255,255,.11)}
.sa.pri:hover,.sa.pri:focus{background:color-mix(in srgb,var(--c) 30%,transparent)}
.sa:focus{box-shadow:inset 0 0 0 1px rgba(255,255,255,.16)}
.sa.dis{opacity:.42;cursor:default}
.sa .kc{margin:0 -4px 0 2px;opacity:0;transition:opacity .2s}
.sa:focus .kc,.sa:hover .kc{opacity:1}

/* key cap */
.kc{display:inline-flex;align-items:center;justify-content:center;flex:none;min-width:15px;height:15px;padding:0 3px;margin-right:6px;border-radius:4px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.2);font-size:9.5px;font-weight:600;line-height:1;color:var(--tx2);font-family:-apple-system,"SF Pro Text",system-ui,sans-serif}

/* rows */
.rows{margin-top:12px}
.rw{position:relative;display:block;height:41px;margin:0 -10px;padding:4px 10px 0;border-radius:11px;overflow:hidden;transition:background .2s,opacity .3s,height .4s var(--ease),padding .4s var(--ease)}
.rw.out{height:0;padding-top:0;opacity:0}
.rw:hover,.rw:focus,.rw:focus-within{background:rgba(255,255,255,.045)}
.rows.pv .rw{opacity:.42}
.rows.pv .rw.hit{opacity:1;background:color-mix(in srgb,var(--c) 13%,transparent)}
.rw.flash{animation:flash 1.4s var(--ease)}
@keyframes flash{0%,40%{background:color-mix(in srgb,var(--c) 22%,transparent)}}
.l1{display:flex;align-items:center;gap:8px;height:19px;font-size:13px;white-space:nowrap}
.l1 .ic{flex:none;display:flex;width:18px;justify-content:center}
.l1 .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.l1 .x{color:var(--tx3)}
.l1 .v{flex:none;width:58px;text-align:right;color:var(--tx2)}
.l1 .v2{flex:none;width:40px;text-align:right;color:var(--tx3)}
.l1 .st{flex:none;width:104px;text-align:right;color:var(--tx3);transition:color .35s}
.l1 .st.on{color:var(--c)}
.l1 .st.hot{color:var(--tx)}
.hm{display:flex;gap:6px;flex:none}
.hm span{display:flex;align-items:center;gap:3px;height:17px;padding:0 5px;border-radius:9px;background:color-mix(in srgb,var(--m) 14%,transparent);font-size:10.5px;color:color-mix(in srgb,var(--m) 80%,#fff)}
.l2{position:relative;height:17px;margin:2px 0 0 26px;font-size:12px;white-space:nowrap}
.l2 .sub{position:absolute;inset:0;color:var(--tx3);overflow:hidden;text-overflow:ellipsis;line-height:17px;transition:opacity .2s}
.l2 .acts{position:absolute;inset:0;display:flex;align-items:center;gap:6px;opacity:0;transform:translateX(4px);transition:opacity .2s,transform .3s var(--ease);pointer-events:none}
.rw:hover .sub,.rw:focus .sub,.rw:focus-within .sub{opacity:0}
.rw:hover .acts,.rw:focus .acts,.rw:focus-within .acts{opacity:1;transform:none;pointer-events:auto}
.ag{color:var(--tx2);cursor:pointer;border-bottom:1px solid rgba(255,144,112,.45)}
.ag:hover{color:#FFB39C}
.ab{display:flex;align-items:center;height:19px;padding:0 7px;border-radius:10px;color:var(--tx2);transition:background .15s,color .15s}
.ab:hover{background:rgba(255,255,255,.08);color:var(--tx)}
.ab.pri{color:var(--tx);background:color-mix(in srgb,var(--c) 20%,transparent)}
.ab.pri:hover{background:color-mix(in srgb,var(--c) 32%,transparent)}
.ab .tl{color:var(--tx3);margin-left:6px}
.ab.dis{color:var(--tx3);cursor:default}
.ab.dis:hover{background:none;color:var(--tx3)}
.ab .why{margin-left:6px;color:rgba(235,235,245,.24)}
.more{height:22px;padding-top:4px;font-size:12px;color:var(--tx3);white-space:nowrap}

/* settings */
.setwrap{position:relative;margin-top:10px}
.set{padding-top:10px;border-top:1px solid var(--line);transition:opacity .25s}
.mrow{display:flex;align-items:center;justify-content:space-between;height:36px}
.modes{position:relative;display:flex;gap:20px}
.modes button{font-size:24px;font-weight:600;letter-spacing:-.02em;line-height:30px;color:var(--tx3);transition:color .3s}
.modes button:hover{color:var(--tx2)}
.modes button[aria-checked="true"]{color:var(--tx)}
.bar{position:absolute;left:0;top:31px;height:2px;border-radius:1px;background:var(--c);transition:transform .45s var(--ease),width .45s var(--ease),background .35s,opacity .3s}
.opts{display:flex;gap:15px;white-space:nowrap;transition:opacity .3s}
.opts button{position:relative;font-size:14px;color:var(--tx3);line-height:20px;transition:color .25s}
.opts button:hover{color:var(--tx2)}
.opts button[aria-checked="true"]{color:var(--tx);font-weight:500}
.opts button[aria-checked="true"]::after{content:"";position:absolute;left:50%;bottom:-6px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--c)}
.det.off .opts{opacity:.3;pointer-events:none}
.rule{margin-top:6px;font-size:13px;line-height:18px;color:var(--tx2)}

/* command results (variant b) */
.cmdres{position:absolute;left:0;right:0;top:0;padding-top:10px;border-top:1px solid var(--line);opacity:0;pointer-events:none;transition:opacity .25s}
.det.cmdon .set{opacity:0;pointer-events:none}
.det.cmdon .cmdres{opacity:1;pointer-events:auto}
.cr-h{display:flex;justify-content:space-between;height:18px;font-size:11px;color:var(--tx3);white-space:nowrap}
.cr{display:flex;align-items:center;gap:9px;height:26px;margin:0 -10px;padding:0 10px;border-radius:9px;font-size:13px;white-space:nowrap;color:var(--tx2);cursor:pointer}
.cr i{flex:none;width:7px;height:7px;border-radius:50%}
.cr .lb{color:var(--tx)}
.cr .lb em{font-style:normal;color:var(--tx2)}
.cr .g{color:var(--tx3);overflow:hidden;text-overflow:ellipsis;min-width:0}
.cr .tl{margin-left:auto;flex:none;color:var(--tx2)}
.cr .ret{flex:none;width:15px;opacity:0}
.cr.on{background:rgba(255,255,255,.07)}
.cr.on .ret{opacity:1}
.cr.none{cursor:default;color:var(--tx3)}

/* foot */
.foot{display:flex;align-items:center;gap:26px;height:54px;padding:0 30px;border-top:1px solid var(--line)}
.sw{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--tx2);white-space:nowrap;transition:color .2s}
.sw i{width:32px;height:19px;border-radius:10px;background:rgba(255,255,255,.14);position:relative;transition:background .25s;flex:none}
.sw i::after{content:"";position:absolute;left:2px;top:2px;width:15px;height:15px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .25s var(--ease)}
.sw[aria-checked="true"]{color:var(--tx)}
.sw[aria-checked="true"] i{background:#5B9BFF}
.sw[aria-checked="true"] i::after{transform:translateX(13px)}
.keys{margin-left:auto;display:flex;gap:16px;font-size:11px;color:var(--tx3);white-space:nowrap}
.keys span{display:flex;align-items:center}
.keys .kc{margin-right:3px;color:var(--tx3);box-shadow:inset 0 0 0 1px rgba(255,255,255,.13)}
.keys .kc+.kc{margin-left:0}
.keys span .kc:last-of-type{margin-right:6px}
.cmd{flex:1;min-width:0;display:flex;align-items:center;gap:10px;height:34px;padding:0 8px 0 14px;border-radius:17px;background:rgba(255,255,255,.04);transition:background .25s,box-shadow .25s}
.cmd:focus-within{background:rgba(255,255,255,.07);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.cmd svg{flex:none}
.cmd input{flex:1;min-width:0;height:34px;font-size:13.5px}
.cmd input::placeholder{color:var(--tx3)}
.cmd .cnt{flex:none;font-size:11px;color:var(--tx3);white-space:nowrap}
.vb .foot{gap:22px}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important}}
</style>
</head>

  <div class="mb">

      <svg viewBox="0 0 17 20" width="13" height="16" aria-hidden="true"><path fill="#fff" d="M14.1 10.6c0-2.6 2.1-3.8 2.2-3.9-1.2-1.8-3.1-2-3.7-2-1.6-.2-3.1.9-3.9.9-.8 0-2-.9-3.4-.9C3.6 4.8 1.9 5.8 1 7.4c-1.9 3.3-.5 8.2 1.4 10.9.9 1.3 2 2.8 3.4 2.7 1.4-.1 1.9-.9 3.5-.9s2.1.9 3.5.9c1.5 0 2.4-1.3 3.3-2.7 1-1.5 1.5-3 1.5-3.1-.1 0-2.9-1.1-2.9-4.3zM11.5 3c.7-.9 1.2-2.1 1.1-3.3-1 0-2.3.7-3 1.6-.7.8-1.3 2-1.1 3.2 1.1.1 2.3-.6 3-1.5z"/></svg>

    </div>

      <div class="icons" id="icons"><i class="hl" id="hl"></i></div>
      <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M2 6.3a8.6 8.6 0 0 1 12 0M4.2 8.6a5.4 5.4 0 0 1 7.6 0"/><circle cx="8" cy="11.6" r="1.3" fill="#fff" stroke="none"/></svg>
      <svg viewBox="0 0 26 14" width="25" height="13" aria-hidden="true"><rect x=".7" y=".7" width="21.6" height="12.6" rx="3.6" fill="none" stroke="rgba(255,255,255,.55)" stroke-width="1.2"/><rect x="2.6" y="2.6" width="11.6" height="8.8" rx="2" fill="#fff"/><path d="M24 5v4" stroke="rgba(255,255,255,.55)" stroke-width="1.4" stroke-linecap="round"/></svg>

  <div class="sheet" id="sheet" role="dialog" aria-label="MinMacs">

      <div class="det" id="det"><div class="in" id="in"></div></div>

  </div>
</div>

<script>
const VB=document.body.classList.contains('vb');
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const $=id=>document.getElementById(id);
const G={

}

}
function agDot(a,c){
  if(a.gone) return 'background:transparent;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)';
  if(a.st==='w') return `background:${c};box-shadow:none`;
  if(a.st==='n') return `background:transparent;box-shadow:inset 0 0 0 1.6px ${c}`;

}

}
function idxNum(s){
  let n,u,cap=s.mode?verb[s.id][s.mode]:(s.id==='awake'?'sleeps as usual':'not watching');
  if(s.id==='agents'){n=tw('i-ag',holdingWork(),0);u='working';const f=finished().length;if(s.mode)cap=f?`${f} to wrap up`:'none finished'}

  else {n=tw('i-aw',holding().length,0);u='agents'}
  return `<span class="nb"><span class="n">${n}<u>${u}</u></span><span class="cp">${cap}</span></span>`;
}

    if(it.refused) return [A({key:'F',label:'Force Quit',pri:1,pv:`Force quits <b>FigmaAgent</b>. It has no open documents. Frees <b>13 MB</b>.`,touch:[it.k],run:()=>{byK('figma').gone=1},msg:'Force quit FigmaAgent <span class="g">· 13 MB freed</span>'}),keep];
    if(it.kept) return [Object.assign(quit,{pri:1}),move];
    if(it.k==='chrome'&&it.tabs) return [A({key:'T',label:'Trim Tabs',tail:'14 tabs',pri:1,pv:`Closes <b>14</b> noise tabs: youtube.com ×6, x.com ×5, reddit.com ×3. Keeps 31 work tabs.`,touch:[it.k],run:()=>{const x=byK('chrome');x.tabs=0;x.cpu=13;x.mem=5.1},msg:'Trimmed 14 tabs in Chrome <span class="g">· 3.6 GB freed</span>'}),quit,keep];
    if(it.cls==='noise') return [Object.assign(quit,{pri:1}),keep];
    return [Object.assign(move,{pri:1}),keep,quit];
  }
  if(sid==='servers'){
    const stop=A({key:'S',label:'Stop',pv:`Stops <b>${it.p} ${it.kind}</b>. Frees <b>${it.mb} MB</b>.${it.ag?'':' Nobody owns it.'}`,touch:[it.k],run:()=>{byK(it.k).gone=1},msg:`Stopped ${it.p} ${it.kind} <span class="g">· ${it.mb} MB freed</span>`});

/* ---------- morph: patch in place so CSS eases graphs ---------- */
function morph(a,b){
  if(a.nodeType!==b.nodeType||a.nodeName!==b.nodeName){a.replaceWith(b.cloneNode(true));return}
  if(a.nodeType===3){if(a.nodeValue!==b.nodeValue)a.nodeValue=b.nodeValue;return}
  if(a.nodeType!==1||a.hasAttribute('data-keep'))return;
  for(const at of [...b.attributes]) if(a.getAttribute(at.name)!==at.value) a.setAttribute(at.name,at.value);
  for(const at of [...a.attributes]) if(!b.hasAttribute(at.name)) a.removeAttribute(at.name);
  const ac=[...a.childNodes], bc=[...b.childNodes];
  if(ac.length!==bc.length||a.id==='rows'&&ac.some((n,i)=>n.dataset&&bc[i].dataset&&n.dataset.k!==bc[i].dataset.k)){a.replaceChildren(...bc.map(n=>n.cloneNode(true)));return}
  ac.forEach((n,i)=>morph(n,bc[i]));
}
function patch(el,html){
  const t=document.createElement('div');t.innerHTML=html;
  const ac=[...el.childNodes], bc=[...t.childNodes];
  if(!ac.length||ac.length!==bc.length){el.innerHTML=html;return}
  ac.forEach((n,i)=>morph(n,bc[i]));
}

const PREV={}, RAF={};
function tweens(){
  document.querySelectorAll('.tw').forEach(el=>{
    const id=el.dataset.tw, v=+el.dataset.v, d=+el.dataset.d, p=PREV[id]; PREV[id]=v;
    if(p==null||p===v||RM){el.textContent=fx(v,d);return}
    cancelAnimationFrame(RAF[id]); const t0=performance.now();
    const step=t=>{const k=Math.min(1,(t-t0)/650), e=1-Math.pow(1-k,3);
      document.querySelectorAll(`.tw[data-tw="${id}"]`).forEach(x=>x.textContent=fx(p+(v-p)*e,d));

    RAF[id]=requestAnimationFrame(step);
  });
}

let Q='', QI=0, QM=[];
function allCmds(){
  const out=[];
  S.forEach(s=>{
    secActs(s.id).forEach(a=>{if(!a.dis) out.push({sid:s.id,a,lb:a.label,tg:'',tl:a.tail,w:(a.label+' '+(a.w||'')+' '+s.name).toLowerCase(),lvl:0})});
    rowsOf(s.id).forEach(it=>rowActs(s.id,it).forEach(a=>{if(a.dis||a.go) return;
      const name=it.n||(it.p+' '+it.kind);
      const state=[it.idle?'idle':'',it.st==='m'?'merged':'',it.st==='s'?'stale':'',it.cls||'',it.st==='f'?'finished done':'',it.st==='w'?'working':'',it.safe?'safe':'',it.tool||'',it.o||'',it.ag?agName(it.ag):''].join(' ');
      const size=it.mb?it.mb+' MB':it.gb!=null?gb(it.gb,it.gb>=10?1:2):it.mem!=null?gb(it.mem,1):'';
      out.push({sid:s.id,a,lb:a.label,tg:name,tl:a.tail||size,w:(a.label+' '+name+' '+state+' '+s.name).toLowerCase(),lvl:1});
    }));
  });
  return out;
}
function match(q){
  const toks=q.toLowerCase().trim().split(/\s+/).filter(Boolean); if(!toks.length) return [];
  const res=[];
  allCmds().forEach(c=>{
    const words=c.w.split(/[\s·,()]+/).filter(Boolean); let sc=0, ok=true;
    for(const t of toks){const i=words.findIndex(w=>w.startsWith(t)||w.replace(/^:/,'').startsWith(t)); if(i<0){ok=false;break} sc+=i}
    if(!ok) return;
    const lbw=c.lb.toLowerCase().split(' ');
    if(lbw[0].startsWith(toks[0])) sc-=4;
    sc+=c.lvl?2:-5;
    res.push({...c,sc});
  });
  const seen=new Set();
  return res.sort((x,y)=>x.sc-y.sc).filter(c=>{const k=c.lb+'|'+(c.tg||c.sid);if(seen.has(k))return false;seen.add(k);return true});
}
