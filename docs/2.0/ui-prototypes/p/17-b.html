<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quiet Dials</title>
<style>
:root{
  --glass:rgba(28,29,38,.86);
  --tx:rgba(255,255,255,.94);
  --tx2:rgba(235,235,245,.56);
  --tx3:rgba(235,235,245,.32);
  --track:rgba(255,255,255,.08);
  --ease:cubic-bezier(.3,.7,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#1a1636}
body{font-family:-apple-system,"SF Pro Text",system-ui,sans-serif;color:var(--tx);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;font-size:13px;cursor:default;user-select:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;text-align:left}
button:focus-visible,.val:focus-visible{outline:2px solid rgba(255,255,255,.55);outline-offset:3px;border-radius:8px}
#stage{position:absolute;left:0;top:0;width:1280px;height:800px;transform-origin:0 0;overflow:hidden;
  background:
   radial-gradient(760px 560px at 10% 6%,#4b3c9e 0%,rgba(75,60,158,0) 70%),
   radial-gradient(700px 520px at 84% 2%,#22618f 0%,rgba(34,97,143,0) 70%),
   radial-gradient(820px 620px at 88% 104%,#a0436f 0%,rgba(160,67,111,0) 70%),
   radial-gradient(640px 520px at 18% 100%,#3a2463 0%,rgba(58,36,99,0) 75%),
   #1d1a3c}

/* menu bar */
.mb{position:absolute;left:0;right:0;top:0;height:26px;display:flex;align-items:center;justify-content:space-between;padding:0 12px 0 16px;background:rgba(18,14,40,.32);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);font-size:13px;color:rgba(255,255,255,.92)}
.mb-l,.mb-r{display:flex;align-items:center;gap:18px}
.mb-l b{font-weight:700}
.mb-r{gap:14px}
.icons{display:flex;align-items:center;gap:12px}
.mi{display:flex;width:16px;overflow:hidden;transition:width .4s var(--ease),opacity .3s,margin .4s var(--ease)}
.mi.off{width:0;opacity:0;margin-left:-12px}

/* window */
.win{position:absolute;left:50%;top:128px;width:536px;transform:translateX(-50%);background:var(--glass);backdrop-filter:blur(36px) saturate(1.5);-webkit-backdrop-filter:blur(36px) saturate(1.5);border:1px solid rgba(255,255,255,.085);border-radius:22px;box-shadow:0 40px 110px rgba(6,4,24,.5),inset 0 1px 0 rgba(255,255,255,.035);padding:0 34px 30px}
.tb{height:46px;display:flex;align-items:center;position:relative;margin:0 -16px}
.lights{display:flex;gap:8px}
.lights i{width:12px;height:12px;border-radius:50%}
.lights i:nth-child(1){background:#ff5f57}.lights i:nth-child(2){background:#febc2e}.lights i:nth-child(3){background:#28c840}
.tb h1{position:absolute;left:0;right:0;text-align:center;font-size:13px;font-weight:600;color:var(--tx2);pointer-events:none}

/* today */
.today{display:flex;align-items:center;gap:10px;height:24px;margin-top:10px;font-size:12.5px;color:var(--tx2);white-space:nowrap}
.today .lbl{color:var(--tx3);width:44px;flex:none}
.today b{font-weight:500;color:var(--tx)}
.today .undo{margin-left:auto;color:var(--tx);font-weight:500;padding:2px 9px;border-radius:11px;background:rgba(255,255,255,.07);transition:background .2s}
.today .undo:hover{background:rgba(255,255,255,.13)}

/* list */
.list{margin-top:30px;display:flex;flex-direction:column;gap:26px}
.row{display:grid;grid-template-columns:44px minmax(0,1fr) auto;column-gap:16px;align-items:center}
.dial{position:relative;width:44px;height:44px;border-radius:50%;transition:transform .35s var(--ease)}
.dial:hover{transform:scale(1.05)}
.dial:active{transform:scale(.95)}
.dial svg.arc{position:absolute;inset:0;transform:rotate(-90deg)}
.dial .tr{fill:none;stroke:var(--track);stroke-width:2.5;transition:stroke .3s}
.dial:hover .tr{stroke:rgba(255,255,255,.14)}
.dial .ar{fill:none;stroke:var(--c);stroke-width:2.5;stroke-linecap:round;transition:stroke-dashoffset .7s var(--ease),opacity .35s}
.dial .gl{position:absolute;inset:0;display:grid;place-items:center;color:rgba(235,235,245,.34);transition:color .4s}
.row:not([data-m="0"]) .gl{color:rgba(255,255,255,.92)}
.txt{min-width:0}
.top{display:flex;align-items:baseline;gap:8px;white-space:nowrap}
.nm{font-size:14.5px;font-weight:500;transition:color .3s}
.row[data-m="0"] .nm{color:var(--tx2)}
.md{font-size:12px;color:var(--tx3);display:flex;gap:5px;align-items:baseline}
.md .nx{opacity:0;transform:translateX(-3px);transition:opacity .2s,transform .3s var(--ease)}
.row.peek .md .nx{opacity:1;transform:none}
.rule{margin-top:4px;font-size:12.5px;line-height:17px;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row[data-m="0"] .rule{color:var(--tx3)}
.stk{display:grid}
.stk>span{grid-area:1/1;white-space:nowrap}
.fact{transition:opacity .2s}
.fact:not(:empty)::before{content:"·";margin-right:5px}
.row.peek .fact{opacity:0}
.val{color:var(--tx);cursor:pointer;padding:0 1px;border-radius:3px;text-decoration:underline;text-decoration-color:rgba(255,255,255,.26);text-underline-offset:3px;text-decoration-thickness:1px;transition:text-decoration-color .2s,background .2s}
.val:hover{text-decoration-color:var(--c)}
.val.bump{animation:bump .45s var(--ease)}
@keyframes bump{35%{background:color-mix(in srgb,var(--c) 30%,transparent)}}
.live{text-align:right;min-width:84px;transition:opacity .3s}
.live .n{display:block;font-size:17px;font-weight:400;line-height:20px;color:var(--tx)}
.live .n small{font-size:11px;color:var(--tx2);font-weight:400;margin-left:2px}
.live .u{display:block;font-size:11px;line-height:14px;color:var(--tx3);white-space:nowrap}
.row[data-m="0"] .live{opacity:0}

/* footer */
.foot{display:flex;gap:30px;margin-top:34px;padding-left:60px}
.sw{display:flex;align-items:center;gap:9px;font-size:12.5px;color:var(--tx2);transition:color .2s}
.sw i{width:28px;height:16px;border-radius:8px;background:rgba(255,255,255,.12);position:relative;transition:background .25s;flex:none}
.sw i::after{content:"";position:absolute;left:2px;top:2px;width:12px;height:12px;border-radius:50%;background:#fff;transition:transform .3s var(--ease)}
.sw[aria-checked="true"]{color:var(--tx)}
.sw[aria-checked="true"] i{background:rgba(255,255,255,.42)}
.sw[aria-checked="true"] i::after{transform:translateX(12px)}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important}}
</style>
</head>
<body>
<div id="stage">
  <div class="mb">
    <div class="mb-l">
      <svg viewBox="0 0 17 20" width="13" height="16" aria-hidden="true"><path fill="#fff" d="M14.1 10.6c0-2.6 2.1-3.8 2.2-3.9-1.2-1.8-3.1-2-3.7-2-1.6-.2-3.1.9-3.9.9-.8 0-2-.9-3.4-.9C3.6 4.8 1.9 5.8 1 7.4c-1.9 3.3-.5 8.2 1.4 10.9.9 1.3 2 2.8 3.4 2.7 1.4-.1 1.9-.9 3.5-.9s2.1.9 3.5.9c1.5 0 2.4-1.3 3.3-2.7 1-1.5 1.5-3 1.5-3.1-.1 0-2.9-1.1-2.9-4.3zM11.5 3c.7-.9 1.2-2.1 1.1-3.3-1 0-2.3.7-3 1.6-.7.8-1.3 2-1.1 3.2 1.1.1 2.3-.6 3-1.5z"/></svg>
      <b>MinMacs</b><span>Edit</span><span>Window</span><span>Help</span>
    </div>
    <div class="mb-r">
      <div class="icons" id="icons"></div>
      <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M2 6.3a8.6 8.6 0 0 1 12 0M4.2 8.6a5.4 5.4 0 0 1 7.6 0"/><circle cx="8" cy="11.6" r="1.3" fill="#fff" stroke="none"/></svg>
      <svg viewBox="0 0 26 14" width="25" height="13" aria-hidden="true"><rect x=".7" y=".7" width="21.6" height="12.6" rx="3.6" fill="none" stroke="rgba(255,255,255,.55)" stroke-width="1.2"/><rect x="2.6" y="2.6" width="11.6" height="8.8" rx="2" fill="#fff"/><path d="M24 5v4" stroke="rgba(255,255,255,.55)" stroke-width="1.4" stroke-linecap="round"/></svg>
      <span>Tue 27 Oct&nbsp;&nbsp;16:42</span>
    </div>
  </div>

  <div class="win" role="dialog" aria-label="Settings">
    <div class="tb"><div class="lights"><i></i><i></i><i></i></div><h1>Settings</h1></div>
    <div class="today" id="today"></div>
    <div class="list" id="list"></div>
    <div class="foot">
      <button class="sw" id="one" role="switch" aria-checked="false"><i></i>One icon in the menu bar</button>
      <button class="sw" id="login" role="switch" aria-checked="true"><i></i>Open at login</button>
    </div>
  </div>
</div>

<script>
const G = {
  apps:'<rect x="4.2" y="4.2" width="7.6" height="7.6" rx="1.6"/><path d="M6.6 1.8v2.4M9.4 1.8v2.4M6.6 11.8v2.4M9.4 11.8v2.4M1.8 6.6h2.4M1.8 9.4h2.4M11.8 6.6h2.4M11.8 9.4h2.4"/>',
  servers:'<rect x="2.5" y="2.8" width="11" height="4.2" rx="1.4"/><rect x="2.5" y="9" width="11" height="4.2" rx="1.4"/><path d="M5.2 4.9h.01M5.2 11.1h.01" stroke-width="2.2"/>',
  trees:'<circle cx="4.6" cy="3.6" r="1.6"/><circle cx="4.6" cy="12.4" r="1.6"/><circle cx="11.4" cy="5.4" r="1.6"/><path d="M4.6 5.2v5.6M11.4 7c0 2.7-2.4 3.4-5.4 4.2"/>',
  disk:'<ellipse cx="8" cy="4" rx="5.5" ry="2"/><path d="M2.5 4v8c0 1.1 2.5 2 5.5 2s5.5-.9 5.5-2V4M2.5 8c0 1.1 2.5 2 5.5 2s5.5-.9 5.5-2"/>',
  awake:'<path d="M1.8 8s2.3-4.3 6.2-4.3S14.2 8 14.2 8s-2.3 4.3-6.2 4.3S1.8 8 1.8 8z"/><circle cx="8" cy="8" r="1.9"/>',
  one:'<circle cx="8" cy="8" r="5.8"/><path d="M8 4.6v3.6l2.4 1.4"/>'
};
const gl=(k,s,c='currentColor')=>`<svg viewBox="0 0 16 16" width="${s}" height="${s}" fill="none" stroke="${c}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${G[k]}</svg>`;
const MODES=['Off','Ask','Auto'];
const NEXT={daily:'next tonight',weekly:'next on Sunday',monthly:'next on 1 Nov'};
let undone=false;
/* rule[m] with {v} = the tunable value; live(m) = number at the right; tail(m) = second fact after the rule */
const S=[
  {id:'apps',name:'Apps',c:'#5B9BFF',mode:2,vals:['60 %','70 %','80 %','90 %'],v:1,
   rule:['Not watching apps','Shows noise apps to close above {v} load','Closes noise apps above {v} load'],
   live:m=>m===1?['2','to close']:undone?['2','reopened']:['2','closed today'], tail:()=>''},
  {id:'servers',name:'Servers',c:'#3FD0B8',mode:2,vals:['30 min','1 h','2 h','4 h','1 day'],v:2,
   rule:['Not watching servers','Shows localhost servers idle for {v}','Stops servers nobody used for {v}'],
   live:m=>[undone?'6':'3','idle now'], tail:m=>m===2&&!undone?'3 stopped today':''},
  {id:'trees',name:'Worktrees',c:'#4CC96B',mode:1,vals:['1 h','1 day','1 week'],v:1,
   rule:['Not watching worktrees','Shows worktrees {v} after they merge','Removes merged ones after {v}, with Undo'],
   live:m=>['4','merged'], tail:m=>'5.7 GB'},
  {id:'disk',name:'Disk',c:'#F2B544',mode:2,vals:['daily','weekly','monthly'],v:1,
   rule:['Not watching caches','Shows caches safe to clean, {v}','Moves safe clutter to the Trash {v}'],
   live:m=>['30<small>GB</small>','safe to clean'], tail:function(){return NEXT[this.vals[this.v]]}},
  {id:'awake',name:'Keep Awake',c:'#B18CFF',mode:2,vals:['10 %','20 %','30 %','never'],v:1,
   rule:['The Mac sleeps as usual','Asks when an agent starts working','Awake while agents work, until battery {v}'],
   live:m=>['4','agents now'], tail:()=>''}
];
const factOf=s=>s.mode?s.tail.call(s,s.mode):'';
const R=20, C=2*Math.PI*R, frac=m=>[0,.5,1][m];

function ruleHTML(s){
  const r=s.rule[s.mode].replace('{v}',`<span class="val" role="button" tabindex="0" data-v="${s.id}" title="Click to change">${s.vals[s.v]}</span>`);
  return r;
}
function liveHTML(s){
  const [n,u]=s.live.call(s,s.mode||2);
  return `<span class="n">${n}</span><span class="u">${u}</span>`;
}
function rowHTML(s){
  return `<div class="row" id="row-${s.id}" data-m="${s.mode}" style="--c:${s.c}">
    <button class="dial" data-id="${s.id}" aria-label="${s.name}: ${MODES[s.mode]}. Click to change.">
      <svg class="arc" viewBox="0 0 44 44" width="44" height="44" aria-hidden="true">
        <circle class="tr" cx="22" cy="22" r="${R}"/>
        <circle class="ar" cx="22" cy="22" r="${R}" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-frac(s.mode))}" style="opacity:${s.mode?1:0}"/>
      </svg>
      <span class="gl">${gl(s.id,17)}</span>
    </button>
    <div class="txt">
      <div class="top"><span class="nm">${s.name}</span><span class="md"><span class="mw">${MODES[s.mode]}</span><span class="stk"><span class="fact">${factOf(s)}</span><span class="nx">then ${MODES[(s.mode+1)%3]}</span></span></span></div>
      <div class="rule">${ruleHTML(s)}</div>
    </div>
    <div class="live">${liveHTML(s)}</div>
  </div>`;
}
function refresh(id){
  const s=S.find(x=>x.id===id), row=document.getElementById('row-'+id);
  row.dataset.m=s.mode;
  row.querySelector('.rule').innerHTML=ruleHTML(s);
  row.querySelector('.live').innerHTML=liveHTML(s);
  row.querySelector('.fact').textContent=factOf(s);
  row.querySelector('.mw').textContent=MODES[s.mode];
  row.querySelector('.nx').textContent='then '+MODES[(s.mode+1)%3];
  const d=row.querySelector('.dial'); d.setAttribute('aria-label',`${s.name}: ${MODES[s.mode]}. Click to change.`);
  const ar=row.querySelector('.ar'); ar.style.strokeDashoffset=C*(1-frac(s.mode)); ar.style.opacity=s.mode?1:0;
}
function step(id){ const s=S.find(x=>x.id===id); s.mode=(s.mode+1)%3; refresh(id); renderIcons(); }
function bumpVal(id){
  const s=S.find(x=>x.id===id); s.v=(s.v+1)%s.vals.length; refresh(id);
  const v=document.querySelector(`#row-${id} .val`); if(v){ v.classList.add('bump'); v.focus({preventScroll:true}); }
}
function renderToday(){
  document.getElementById('today').innerHTML = undone
    ? `<span class="lbl">Today</span><span>Reopened <b>2 apps</b>, restarted <b>3 servers</b></span><button class="undo" id="redo">Redo</button>`
    : `<span class="lbl">Today</span><span>Closed <b>2 apps</b>, stopped <b>3 servers</b></span><button class="undo" id="undo">Undo</button>`;
}
function renderIcons(){
  const one=document.getElementById('one').getAttribute('aria-checked')==='true';
  const box=document.getElementById('icons');
  if(!box.children.length) box.innerHTML=S.map(s=>`<span class="mi" id="mi-${s.id}">${gl(s.id,16,'#fff')}</span>`).join('')+`<span class="mi off" id="mi-one">${gl('one',16,'#fff')}</span>`;
  S.forEach(s=>document.getElementById('mi-'+s.id).classList.toggle('off',one||s.mode===0));
  document.getElementById('mi-one').classList.toggle('off',!one);
}
document.getElementById('list').innerHTML=S.map(rowHTML).join('');
renderToday(); renderIcons();

document.addEventListener('click',e=>{
  const d=e.target.closest('.dial'); if(d){ step(d.dataset.id); return }
  const v=e.target.closest('.val'); if(v){ bumpVal(v.dataset.v); return }
  if(e.target.closest('#undo')||e.target.closest('#redo')){ undone=!undone; renderToday(); ['apps','servers'].forEach(refresh); return }
  const sw=e.target.closest('.sw'); if(sw){ sw.setAttribute('aria-checked',String(sw.getAttribute('aria-checked')!=='true')); renderIcons(); }
});
document.addEventListener('keydown',e=>{
  const v=e.target.closest&&e.target.closest('.val');
  if(v&&(e.key==='Enter'||e.key===' ')){ e.preventDefault(); bumpVal(v.dataset.v); }
});
const list=document.getElementById('list');
const peek=(e,on)=>{const d=e.target.closest('.dial'); if(d) d.closest('.row').classList.toggle('peek',on)};
list.addEventListener('mouseover',e=>peek(e,true));
list.addEventListener('mouseout',e=>peek(e,false));
list.addEventListener('focusin',e=>peek(e,true));
list.addEventListener('focusout',e=>peek(e,false));

function fit(){const st=document.getElementById('stage'),k=Math.min(innerWidth/1280,innerHeight/800);st.style.transform=`translate(${(innerWidth-1280*k)/2}px,${(innerHeight-800*k)/2}px) scale(${k})`}
addEventListener('resize',fit); fit();
</script>
</body>
</html>
