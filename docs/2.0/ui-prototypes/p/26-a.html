<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hover Cards</title>
<style>
:root{
  --glass:rgba(28,29,38,.88);
  --line:rgba(255,255,255,.06);
  --tx:rgba(255,255,255,.94);
  --tx2:rgba(235,235,245,.58);
  --tx3:rgba(235,235,245,.3);
  --g1:rgba(255,255,255,.07);
  --g2:rgba(255,255,255,.2);
  --g3:rgba(255,255,255,.42);
  --go:#FF9F45;
  --ease:cubic-bezier(.3,.7,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#1a1636}
body{font-family:-apple-system,"SF Pro Text",system-ui,sans-serif;color:var(--tx);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;font-size:13px;cursor:default;user-select:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;text-align:left}
b{font-weight:500}
:focus{outline:none}
:focus-visible{outline:2px solid rgba(255,255,255,.55);outline-offset:2px;border-radius:8px}
#stage{position:absolute;left:0;top:0;width:1280px;height:800px;transform-origin:0 0;overflow:hidden;
  background:
   radial-gradient(760px 560px at 10% 6%,#4b3c9e 0%,rgba(75,60,158,0) 70%),
   radial-gradient(700px 520px at 84% 2%,#22618f 0%,rgba(34,97,143,0) 70%),
   radial-gradient(820px 620px at 88% 104%,#a0436f 0%,rgba(160,67,111,0) 70%),
   radial-gradient(640px 520px at 18% 100%,#3a2463 0%,rgba(58,36,99,0) 75%),
   #1d1a3c}

/* menu bar */
.mb{position:absolute;left:0;right:0;top:0;height:26px;display:flex;align-items:center;justify-content:space-between;padding:0 12px 0 16px;background:rgba(18,14,40,.32);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);font-size:13px;color:rgba(255,255,255,.92);z-index:5}
.mb-l,.mb-r{display:flex;align-items:center;gap:18px}
.mb-l b{font-weight:700}
.mb-r{gap:14px}
.icons{position:relative;display:flex;align-items:center;gap:12px}
.hl{position:absolute;top:-3px;height:22px;width:28px;border-radius:6px;background:rgba(255,255,255,.2);transition:transform .45s var(--ease),opacity .3s;pointer-events:none}
.mi{position:relative;display:flex;width:16px;overflow:hidden;cursor:pointer;transition:width .4s var(--ease),opacity .3s,margin .4s var(--ease)}
.mi.off{width:0;opacity:0;margin-left:-12px}

/* sheet */
.sheet{position:absolute;top:34px;left:444px;width:790px;background:var(--glass);backdrop-filter:blur(36px) saturate(1.5);-webkit-backdrop-filter:blur(36px) saturate(1.5);border:1px solid rgba(255,255,255,.085);border-radius:22px;box-shadow:0 34px 100px rgba(6,4,24,.5),inset 0 1px 0 rgba(255,255,255,.035);animation:drop .6s var(--ease) both}
@keyframes drop{from{opacity:0;transform:translateY(-10px)}}
.nub{position:absolute;top:-8px;left:0;width:18px;height:8px;margin-left:-9px;transition:transform .45s var(--ease)}
.nub svg{display:block}
.head{display:flex;align-items:center;gap:12px;height:50px;padding:0 28px;white-space:nowrap}
.head .lbl{font-size:12px;color:var(--tx3)}
.head .txt{font-size:13px;color:var(--tx2)}
.head .txt b{color:var(--tx)}
.head .undo{margin-left:auto;font-size:13px;font-weight:500;padding:4px 12px;border-radius:12px;background:rgba(255,255,255,.07);transition:background .2s}
.head .undo:hover{background:rgba(255,255,255,.13)}
.body{display:grid;grid-template-columns:300px 1fr;column-gap:30px;padding:2px 28px 18px;height:556px}

/* left: live index */
.idx{display:flex;flex-direction:column}
.leg{font-size:11px;color:var(--tx3);height:20px;line-height:14px;white-space:nowrap;display:flex;justify-content:flex-end;gap:6px}
.leg i{display:inline-block;width:12px;height:5px;border-radius:3px;margin-top:5px;background:linear-gradient(90deg,#FF7AA8,#5B9BFF 22%,#3FD0B8 42%,#4CC96B 60%,#F2B544 78%,#B18CFF)}
.it{display:flex;align-items:center;gap:12px;height:86px;border-radius:14px;margin:0 -10px;padding:0 10px;transition:background .3s}
.it .dot{flex:none;width:9px;height:9px;border-radius:50%;box-shadow:inset 0 0 0 1.5px rgba(235,235,245,.28);transition:background .35s,box-shadow .35s}
.it .nm{flex:1;font-size:24px;font-weight:600;letter-spacing:-.022em;color:rgba(235,235,245,.36);transition:color .3s;white-space:nowrap}
.it:hover .nm{color:var(--tx2)}
.it.sel .nm{color:var(--tx)}
.it.touch{background:rgba(255,255,255,.045)}
.it.touch .nm{color:var(--tx)}
.it.touch .mg{filter:drop-shadow(0 0 5px var(--c))}
.mg{flex:none;position:relative;width:56px;height:24px;display:flex;align-items:flex-end;justify-content:space-between;transition:opacity .4s,filter .4s}
.it.m0 .mg{opacity:.28;filter:grayscale(1)}
.mg i{display:block;transition:height .55s var(--ease),width .55s var(--ease),left .55s var(--ease),background .35s,opacity .35s,box-shadow .35s}
.mg .tr{position:absolute;left:0;right:0;top:9px;height:6px;border-radius:3px;background:var(--g1)}
.mg .tr i{position:absolute;top:0;bottom:0;border-radius:3px}
.mg .tr .tk{top:-4px;bottom:-4px;width:2px;margin-left:-1px;border-radius:1px;background:#fff}
.mg.mc i{flex:none;border-radius:2px}
.mg.dots{flex-wrap:wrap;align-content:center;row-gap:4px}
.mg.dots i{width:6px;height:6px;border-radius:50%}
.mg.ring{justify-content:flex-end;align-items:center}
.nb{flex:none;width:86px;display:flex;flex-direction:column;align-items:flex-end;white-space:nowrap}
.nb .n{font-size:16px;font-weight:500;line-height:19px;color:var(--tx2);transition:color .3s}
.nb .n u{text-decoration:none;font-size:11px;font-weight:400;color:var(--tx3);margin-left:3px}
.nb .cp{font-size:11px;line-height:15px;color:var(--tx3)}
.it.sel .nb .n{color:var(--tx)}
.it.m0 .nb .n{color:var(--tx3);font-weight:400;font-size:13px}

/* right pane */
.det{position:relative;min-width:0}
.det .in{transition:opacity .22s,transform .35s var(--ease)}
.det .in.swap{opacity:0;transform:translateY(6px)}
.lab{display:flex;align-items:center;height:16px;font-size:12px;color:var(--tx3);white-space:nowrap}
.lab .key{margin-left:auto;display:flex;align-items:center;gap:6px;color:var(--tx2);transition:opacity .3s}
.mk{flex:none;width:7px;height:7px;border-radius:50%;transition:background .35s,box-shadow .35s,opacity .35s}
.mk.a{background:var(--c)}
.mk.s{box-shadow:inset 0 0 0 1.5px var(--c)}
.mk.n{opacity:0}
.big{display:flex;align-items:baseline;gap:6px;white-space:nowrap;height:44px;margin-top:2px}
.big .n{font-size:40px;font-weight:500;letter-spacing:-.02em;line-height:44px}
.big .u{font-size:15px;color:var(--tx2)}
.big .n2{margin-left:auto;font-size:13px;color:var(--tx2)}
.big .n2 b{color:var(--tx)}
.say{margin-top:2px;font-size:14px;line-height:20px;color:var(--tx2);min-height:20px}
.say b{color:var(--tx)}
.gr{margin-top:12px;transition:opacity .4s,filter .4s}
.det.off .gr,.det.off .rows .ic{filter:grayscale(1);opacity:.45}
.mt+.mt{margin-top:9px}
.mt .hd{display:flex;align-items:baseline;justify-content:space-between;height:16px;font-size:12px;color:var(--tx3);white-space:nowrap}
.mt .hd b{color:var(--tx)}
.mt .hd span:last-child{color:var(--tx2)}
.tb{position:relative;height:6px;margin-top:6px;border-radius:3px;background:var(--g1)}
.tb i{position:absolute;top:0;bottom:0;border-radius:3px;transition:left .55s var(--ease),width .55s var(--ease),background .35s,opacity .35s,box-shadow .35s}
.tb .tk{top:-4px;bottom:-4px;width:2px;margin-left:-1px;border-radius:1px;background:#fff}
.tb.seg{display:flex;gap:2px;background:none}
.tb.seg i{position:static;flex-basis:0;transition:flex-grow .55s var(--ease),background .35s,opacity .35s,box-shadow .35s,margin .55s var(--ease)}
.tb.seg i.z{margin-right:-2px}
.tl{position:relative;height:13px;font-size:10.5px;color:var(--tx3)}
.tl span{position:absolute;top:2px;transform:translateX(-50%);white-space:nowrap;transition:left .55s var(--ease)}
.cols{display:flex;align-items:flex-end;gap:5px;height:44px}
.cols .cl{flex:1;position:relative;height:100%;border-radius:4px;background:rgba(255,255,255,.04)}
.cols .cl i{position:absolute;left:0;right:0;bottom:0;border-radius:4px;transition:height .55s var(--ease),background .35s,box-shadow .35s,opacity .35s}
.cleg{display:flex;gap:11px;margin-top:7px;font-size:11px;color:var(--tx3);white-space:nowrap}
.cleg span{display:flex;align-items:center;gap:5px}
.cleg i{width:8px;height:8px;border-radius:2px}
.cleg i.o{border-radius:50%}

/* plan highlight: hovering a section action shows exactly what it touches */
.det.plan .rw:not(.hit):not(.gone){opacity:.32}
.det.plan .gr i[data-h]:not(.hit){opacity:.3}
.det.plan .gr i.hit{box-shadow:0 0 0 1.5px rgba(255,255,255,.85)}
.rw.hit{background:color-mix(in srgb,var(--c) 14%,transparent)}
.rw.hit .mk{background:var(--c);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 30%,transparent)}

/* section actions */
.sas{display:flex;gap:8px;margin-top:13px;height:30px}
.sa{display:flex;align-items:center;gap:8px;height:30px;padding:0 12px;border-radius:9px;background:rgba(255,255,255,.07);font-size:13px;font-weight:500;white-space:nowrap;transition:background .2s,opacity .3s}
.sa:hover{background:rgba(255,255,255,.13)}
.sa.pri{background:color-mix(in srgb,var(--c) 20%,transparent)}
.sa.pri:hover{background:color-mix(in srgb,var(--c) 30%,transparent)}
.sa .tail{color:var(--tx2);font-weight:400}
.sa.dis{opacity:.42;cursor:default;background:rgba(255,255,255,.05)}
.sa.dis .tail{color:var(--tx3)}
.sa svg{flex:none}

/* rows */
.rows{margin-top:10px}
.rw{display:grid;align-items:center;column-gap:8px;height:26px;font-size:13px;white-space:nowrap;border-radius:7px;margin:0 -8px;padding:0 8px;overflow:hidden;cursor:pointer;transition:height .45s var(--ease),opacity .35s,transform .45s var(--ease),background .2s}
.rw:hover,.rw.hot{background:rgba(255,255,255,.065)}
.rw.pinr{background:rgba(255,255,255,.1);box-shadow:inset 2px 0 0 var(--c)}
.rw.gone{height:0;opacity:0;transform:translateX(14px);pointer-events:none}
.rw.xl{animation:xl 1.8s var(--ease)}
@keyframes xl{0%,40%{background:color-mix(in srgb,var(--c) 26%,transparent);box-shadow:inset 0 0 0 1px var(--c)}100%{background:rgba(255,255,255,.1)}}
.rw>span{min-width:0;overflow:hidden;text-overflow:ellipsis}
.rw .ic{display:flex;justify-content:center;transition:opacity .4s,filter .4s}
.rw .x,.rw .g{color:var(--tx3)}
.rw .v{text-align:right;color:var(--tx2)}
.rw .v2{text-align:right;color:var(--tx3)}
.rw .st{text-align:right;color:var(--tx3);transition:color .35s}
.rw.on .st{color:var(--c)}
.rw.dim .nm{color:var(--tx3)}
.rw .ow{color:var(--tx3)}
.r-agents .rw{grid-template-columns:7px 18px minmax(0,1fr) 64px 88px}
.r-apps .rw{grid-template-columns:7px 18px minmax(0,1fr) 36px 58px 76px}
.r-servers .rw{grid-template-columns:7px 18px 110px minmax(0,1fr) 50px 74px}
.r-servers .ow{font-size:12px}
.r-trees .rw{grid-template-columns:7px 18px minmax(0,1fr) 58px 92px}
.r-disk .rw{grid-template-columns:7px 18px minmax(0,1fr) 58px 84px}
.r-awake .rw{grid-template-columns:7px 18px minmax(0,1fr) 100px}
.holds{display:flex;gap:7px;justify-content:flex-start;align-items:center}
.holds span{display:flex;align-items:center;gap:2px;font-size:11px;color:var(--tx3)}
.more{height:22px;padding-left:15px;font-size:12px;line-height:22px;color:var(--tx3);white-space:nowrap;border-radius:7px;margin:0 -8px;padding-right:8px;padding-left:23px}
.more.xl{animation:xl 1.8s var(--ease)}

/* settings */
.set{margin-top:10px;padding-top:8px;border-top:1px solid var(--line)}
.modes{position:relative;display:flex;gap:22px;height:36px;align-items:flex-start;margin-top:2px}
.modes button{font-size:26px;font-weight:600;letter-spacing:-.02em;line-height:32px;color:var(--tx3);transition:color .3s}
.modes button:hover{color:var(--tx2)}
.modes button[aria-checked="true"]{color:var(--tx)}
.bar{position:absolute;left:0;top:35px;height:2px;border-radius:1px;background:var(--c);transition:transform .45s var(--ease),width .45s var(--ease),background .35s,opacity .3s}
.rule{margin-top:6px;font-size:14px;line-height:20px;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.opts{display:flex;gap:18px;height:24px;margin-top:5px;align-items:flex-start;white-space:nowrap;transition:opacity .3s}
.opts button{position:relative;font-size:15px;color:var(--tx3);line-height:20px;transition:color .25s}
.opts button:hover{color:var(--tx2)}
.opts button[aria-checked="true"]{color:var(--tx);font-weight:500}
.opts button[aria-checked="true"]::after{content:"";position:absolute;left:50%;bottom:-4px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--c)}
.det.off .opts{opacity:.3;pointer-events:none}
.det.off .big .n{font-size:22px;color:var(--tx3)}

.foot{display:flex;align-items:center;gap:28px;height:50px;padding:0 28px;border-top:1px solid var(--line)}
.sw{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--tx2);transition:color .2s;white-space:nowrap}
.sw i{width:32px;height:19px;border-radius:10px;background:rgba(255,255,255,.14);position:relative;transition:background .25s;flex:none}
.sw i::after{content:"";position:absolute;left:2px;top:2px;width:15px;height:15px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .25s var(--ease)}
.sw[aria-checked="true"]{color:var(--tx)}
.sw[aria-checked="true"] i{background:#5B9BFF}
.sw[aria-checked="true"] i::after{transform:translateX(13px)}
.foot .hint{margin-left:auto;font-size:11px;color:var(--tx3);white-space:nowrap}

/* hover card, outside the sheet on its left */
.card{position:absolute;left:0;top:0;width:var(--cw);padding:14px 8px 8px;background:rgba(30,31,41,.9);backdrop-filter:blur(36px) saturate(1.5);-webkit-backdrop-filter:blur(36px) saturate(1.5);border:1px solid rgba(255,255,255,.09);border-radius:16px;box-shadow:0 26px 70px rgba(6,4,24,.5),inset 0 1px 0 rgba(255,255,255,.04);opacity:0;transform:translateX(8px);pointer-events:none;transition:opacity .22s,transform .3s var(--ease),top .3s var(--ease);z-index:6}
.card.show{opacity:1;transform:none;pointer-events:auto}
.card.pinned{border-color:rgba(255,255,255,.16)}
.va{--cw:302px}.vb{--cw:320px}
.cin{padding:0 8px}
.ch{display:flex;align-items:baseline;gap:10px}
.ct{flex:1;min-width:0;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pin{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--tx3);white-space:nowrap}
.pinned .pin{color:var(--tx2);cursor:pointer}
.cs{margin-top:2px;font-size:12px;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cst{display:flex;gap:7px;margin-top:9px;font-size:12.5px;line-height:17px}
.cst .cmk{flex:none;padding-top:2px}
.cst b{font-weight:600}
.facts{margin-top:8px}
.f{display:grid;grid-template-columns:22px 76px minmax(0,1fr);column-gap:8px;align-items:center;min-height:28px}
.f.pl{grid-template-columns:22px minmax(0,1fr) auto}
.f.pl .fl{color:var(--tx);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.f.pl .fv{color:var(--tx2)}
.bd{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--bc) 17%,transparent)}
.fl{font-size:12px;color:var(--tx2);white-space:nowrap}
.fv{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:baseline;gap:5px}
.fv .n{font-size:15px;font-weight:500}
.fv .u{font-size:11px;color:var(--tx2);margin-left:-3px}
.fv .g2{color:var(--tx2);overflow:hidden;text-overflow:ellipsis}
.fv svg{flex:none;align-self:center}
.f.link{cursor:pointer;border-radius:7px;margin:0 -6px;padding:0 6px;transition:background .2s}
.f.link:hover{background:rgba(255,255,255,.08)}
.csep{height:1px;background:var(--line);margin:9px 8px 6px}
.ca{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;height:28px;padding:0 10px 0 8px;border-radius:7px;font-size:13px;white-space:nowrap;transition:background .15s}
.ca:hover{background:rgba(255,255,255,.1)}
.ca:first-child>span:first-child{font-weight:500}
.ca .tail{color:var(--tx3);overflow:hidden;text-overflow:ellipsis}
.ca.dis{cursor:default}
.ca.dis:hover{background:none}
.ca.dis>span:first-child{color:var(--tx3);font-weight:400}
.ca.dis .tail{color:rgba(235,235,245,.26)}
/* variant b: per-item graph + before/after */
.cgr{margin-top:11px;padding:10px 10px 9px;border-radius:11px;background:rgba(255,255,255,.035)}
.cgr .cap{font-size:11.5px;line-height:15px;color:var(--tx2);margin-top:7px}
.cgr .cap b{color:var(--tx)}
.gx{display:flex;align-items:center;gap:12px}
.gx .gt{flex:1;min-width:0}
.gx .gt .l1{font-size:12.5px;white-space:nowrap}
.gx .gt .l1 b{font-size:15px}
.gx .gt .l2{font-size:11.5px;color:var(--tx2);margin-top:2px;line-height:15px}
.arcw{position:relative;flex:none;width:44px;height:44px}
.arcw span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:500}
.cbar{position:relative;display:flex;gap:2px;height:6px;margin-top:6px}
.cbar i{height:6px;border-radius:3px;flex-basis:0}
.cbh{display:flex;justify-content:space-between;font-size:11px;color:var(--tx3);white-space:nowrap}
.cbh b{color:var(--tx);font-weight:500}
.ckey{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:7px;font-size:11px;color:var(--tx2);white-space:nowrap}
.ckey span{display:grid;grid-template-columns:7px auto;column-gap:5px;align-items:center}
.ckey span b{grid-column:2;font-size:12px;font-weight:500;color:var(--tx)}
.ckey i{width:7px;height:7px;border-radius:2px}
.ccols{display:flex;align-items:flex-end;gap:4px;height:26px;margin-top:6px}
.ccols i{flex:1;border-radius:3px}
.ba{margin:10px 0 0;padding:0 2px}
.ba .bh{display:flex;align-items:baseline;gap:6px;font-size:12px;color:var(--tx2);white-space:nowrap}
.ba .bh .k{font-size:11px;color:var(--tx3)}
.ba .bh .k svg{vertical-align:0}
.ba .bv{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-top:3px;font-size:12.5px;color:var(--tx2);white-space:nowrap}
.ba .bv .w{font-size:13px;font-weight:500;color:var(--tx)}
.ba .bv .w s{text-decoration:none;font-weight:400;color:var(--tx2)}
.ba .bv .w svg{margin:0 4px;vertical-align:0}
.ba .bt{display:flex;gap:2px;height:5px;margin-top:6px}
.ba .bt i{border-radius:3px;height:5px}

/* toast */
.toast{position:absolute;left:0;top:0;display:flex;align-items:center;gap:14px;height:40px;padding:0 8px 0 16px;border-radius:20px;background:rgba(30,31,41,.9);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);border:1px solid rgba(255,255,255,.09);box-shadow:0 16px 40px rgba(6,4,24,.45);font-size:13px;color:var(--tx2);white-space:nowrap;opacity:0;transform:translateY(8px);pointer-events:none;transition:opacity .3s,transform .4s var(--ease);z-index:7}
.toast.show{opacity:1;transform:none;pointer-events:auto}
.toast b{color:var(--tx)}
.toast .tick{display:flex}
.toast button{font-weight:500;padding:5px 12px;border-radius:14px;background:rgba(255,255,255,.08);color:var(--tx);transition:background .2s}
.toast button:hover{background:rgba(255,255,255,.15)}
.toast.nu{padding-right:16px}
.toast.nu button{display:none}

@keyframes pulse{50%{opacity:.35}}
.pulse{animation:pulse 1.8s ease-in-out infinite}

  return {s, w, mb:s.reduce((t,x)=>t+x.mb,0), gb:(w?w.gb:0)+s.reduce((t,x)=>t+x.mb,0)/1000, awake:a.st==='w'&&!ST.asleep[a.id]};
}

/* ---------- actions (each one is a real state change, Undo restores) ---------- */
function removeTree(id){ST.gone[id]=1;const w=wt(id);if(w&&w.srv)ST.gone[w.srv]=1}
function wrap(id){const a=ag(id);ST.gone[id]=1;(a.srv||[]).forEach(s=>ST.gone[s]=1);if(a.wt)removeTree(a.wt)}
function doAct(msg,fn,undo=true){
  if(undo) UNDO.push(JSON.stringify(ST));
  fn&&fn(); unpin(); render(); toast(msg,undo);
}
function nav(msg){toast(msg,false);unpin()}

/* ---------- small drawing helpers ---------- */
function arc(p,col,sz,sw){
  return `<svg viewBox="0 0 20 20" width="${sz}" height="${sz}" aria-hidden="true"><circle cx="10" cy="10" r="7.6" fill="none" stroke="rgba(255,255,255,.1)" stroke-width="${sw}"/><circle cx="10" cy="10" r="7.6" fill="none" stroke="${col}" stroke-width="${sw}" stroke-linecap="round" pathLength="100" transform="rotate(-90 10 10)" style="stroke-dasharray:100;stroke-dashoffset:${100-Math.max(0,Math.min(100,p))};opacity:${p>0?1:0};transition:stroke-dashoffset .6s var(--ease),stroke .35s,opacity .35s"/></svg>`;
}
const mk=(on,s)=>`<i class="mk ${on?(s.mode===2?'a':'s'):'n'}"></i>`;
const tw=(v,dp,u)=>`<span data-tw="${v}" data-dp="${dp||0}">${(+v).toFixed(dp||0)}</span>${u?`<u>${u}</u>`:''}`;
function meter(l,r,segs,tick,tl){
  return `<div class="mt"><div class="hd"><span>${l}</span><span>${r}</span></div><div class="tb">${segs.map(g=>`<i${g[3]?` data-h="${g[3]}"`:''} style="left:${g[0]}%;width:${g[1]}%;background:${g[2]}"></i>`).join('')}${tick!=null?`<i class="tk" style="left:${tick}%;opacity:${tick>0?1:0}"></i>`:''}</div>${tl?`<div class="tl"><span style="left:${tick}%">${tl}</span></div>`:''}</div>`;
}
const segbar=items=>`<div class="tb seg">${items.map(g=>`<i data-h="${g.id||''}" class="${g.w>0?'':'z'}" style="flex-grow:${g.w};background:${g.c}"></i>`).join('')}</div>`;
function keyLine(s,word){return `<span class="key" style="opacity:${s.mode?1:0}"><i class="mk ${s.mode===2?'a':'s'}"></i>${s.mode===2?'Auto':'Ask'} ${s.mode===2?word[0]:word[1]}</span>`}
const agDot=a=>a.st==='w'?'var(--c)':a.st==='n'?'#fff':a.st==='f'?'transparent':'var(--g2)';

/* ---------- left: the live index ---------- */
function mini(s){
  const c=s.c;
  if(s.id==='agents'){
    const dots=AG.map(a=>({st:a.st,g:!live(a.id)})).concat(Array.from({length:5},()=>({st:'i'})));
    return `<span class="mg dots" style="column-gap:4px">${dots.map(d=>`<i style="background:${d.st==='w'?c:d.st==='n'?'#fff':d.st==='f'?'transparent':'var(--g2)'};box-shadow:${d.st==='f'?`inset 0 0 0 1.5px ${c}`:'none'};opacity:${d.g?0:1}"></i>`).join('')}</span>`;
  }
  if(s.id==='apps'){const L=loadNow(),N=noiseCpu();return `<span class="mg"><span class="tr"><i style="left:0;width:${L-N}%;background:var(--g2)"></i><i style="left:${L-N}%;width:${N}%;background:${c}"></i><i class="tk" style="left:${thr(s)}%"></i></span></span>`}
  if(s.id==='servers') return `<span class="mg mc">${SRV.map(x=>`<i style="width:7px;height:${live(x.id)?Math.round(5+x.mb/640*19):0}px;background:${x.idle&&!ST.kept[x.id]?c:x.use?'var(--g3)':'var(--g2)'}"></i>`).join('')}</span>`;
  if(s.id==='trees'){const T=thr(s);return `<span class="mg mc">${WT.concat(WT_REST).map(w=>{const g=w.id&&!live(w.id);return `<i style="width:2.6px;height:${g?0:Math.round(4+w.gb/3.2*20)}px;background:${w.k==='m'&&!ST.kept[w.id]?c:w.k==='u'?'var(--g3)':'var(--g2)'};opacity:${w.k==='m'&&w.d<T?.35:1}"></i>`}).join('')}</span>`}
  if(s.id==='disk') return `<span class="mg ring">${arc(safeDisk().reduce((t,d)=>t+d.gb,0)/38.4*100,c,24,2.6)}</span>`;
  const bt=thr(s), on=holders().length||ST.awake1h;
  return `<span class="mg"><span class="tr"><i style="left:0;width:64%;background:var(--g2)"></i><i style="left:${bt}%;width:${on?64-bt:0}%;background:${c}"></i><i class="tk" style="left:${bt}%;opacity:${bt?1:0}"></i></span></span>`;
}
function num(s){
  if(!s.mode) return `<span class="nb"><span class="n">Off</span><span class="cp">${s.id==='awake'?'sleeps as usual':'not watching'}</span></span>`;
  const v={agents:[working().length,0,'working'],apps:[noiseCpu(),0,'%'],servers:[srvIdle().length,0,'idle'],trees:[treesMerged().reduce((t,w)=>t+w.gb,0),2,'GB'],disk:[safeDisk().reduce((t,d)=>t+d.gb,0),1,'GB'],awake:[holders().length,0,'agents']}[s.id];
  const verb={apps:['','Ask shows','Auto frees'],servers:['','Ask shows','Auto stops'],trees:['','Ask shows','Auto removes'],disk:['','Ask shows','Auto cleans'],awake:['','Ask asks first','keep it awake']};
  const cp=s.id==='agents'?(agLive().some(a=>a.st==='n')?'1 needs you':'none need you'):verb[s.id][s.mode];
  return `<span class="nb"><span class="n">${tw(v[0],v[1],v[2])}</span><span class="cp">${cp}</span></span>`;
}
function dot(s){return s.mode===2?`background:${s.c};box-shadow:none`:s.mode===1?`background:transparent;box-shadow:inset 0 0 0 1.5px ${s.c}`:''}
function idxHTML(){
  return `<div class="leg"><i></i>Colored part = what each one acts on</div>`+S.map(s=>`<button class="it${s.id===sel?' sel':''} m${s.mode}" style="--c:${s.c}" role="tab" aria-selected="${s.id===sel}" data-s="${s.id}" id="it-${s.id}"><i class="dot" style="${dot(s)}"></i><span class="nm">${s.name}</span>${mini(s)}${num(s)}</button>`).join('');
}

      :d.id==='d-nm'?`<div class="ccols">${[3.1,2.9,2.4,1.4].map(v=>`<i style="height:${Math.round(6+v/3.1*20)}px;background:${c}"></i>`).join('')}</div><div class="cap">One column per merged worktree. All four are merged into main.</div>`
      :`<div class="cap">${d.rep?'Shown so you know where the space is.':d.safe?'Rebuilds when a tool needs it.':'You decide, nothing cleans it on its own.'}</div>`);
    if(clean.run) ba={verb:clean.t.replace(/ .*/,''),what:'Disk free',from:diskFree(),to:diskFree()+d.gb,u:'GB',c,up:1};
  }
  return {title:d.n,sub:d.path,tone,c,word,status,facts,acts,graph,ba};
}
function appCard(a){
  const s=sec('apps'), c=s.c, p=appNow(a), k=ST.kept[a.id];
  let tone,word,status;
  if(a.spared){tone='stay';word='Spared.';status='Playwright drives it for speed-3’s tests.'}
  else if(a.ess){tone='stay';word='Essential.';status='4 agents run in it, so nothing ever closes it.'}
  else if(k){tone='stay';word='Stays.';status='You chose Keep. MinMacs Now passes it by.'}
  else if(a.id==='chrome'&&ST.trim){tone='stay';word='Trimmed.';status='Only the 31 work tabs are left, so it stays open.'}
  else if(p.close){tone='go';word='Closes';status=a.id==='chrome'?'on MinMacs Now. Or trim only its 14 noise tabs and keep the 31 work tabs.':'on MinMacs Now. It is not playing, and Restore reopens it.'}
  else{tone='idle';word='Unsorted.';status='MinMacs has not seen it as work or noise yet. You choose.'}
  const facts=[{k:'apps',c,l:'CPU',v:n(p.cpu,'%')},{k:'mem',c,l:'Memory',v:n(mbs(p.mb).split(' ')[0],mbs(p.mb).split(' ')[1])}];
  if(a.id==='chrome') facts.push({k:'tab',c,l:'Noise tabs',v:ST.trim?`0${g2('31 work tabs left')}`:`14${g2('of 45 tabs')}`});
  if(a.ag) facts.push(fAgent(a.ag,'tests'));
  if(a.ess) facts.push({k:'agents',c:C.agents,l:'Agents',v:`<span style="color:${C.agents}">speed-3</span>${g2('and 3 more')}`,link:['agents','ag-speed3']});
  const quit={t:'Quit',tail:mbs(p.mb),run:()=>doAct(`Quit <b>${a.n}</b> · ${mbs(p.mb)} freed`,()=>ST.gone[a.id]=1)};
  const keep=k?{t:'Stop Keeping',tail:'',run:()=>doAct(`<b>${a.n}</b> is no longer kept`,()=>delete ST.kept[a.id])}:{t:'Keep',tail:'never close it',run:()=>doAct(`Keeping <b>${a.n}</b>`,()=>ST.kept[a.id]=1)};
  let acts;
  if(a.id==='chrome') acts=[ST.trim?{t:'Trim Tabs…',why:'no noise tabs left'}:{t:'Trim Tabs',tail:'14 noise tabs',run:()=>doAct('Trimmed <b>14 noise tabs</b> in Chrome · 2.9 GB freed',()=>ST.trim=1)},quit,keep];
  else if(a.uns) acts=[ST.cl[a.id]?{t:'Take Off Close List',tail:'',run:()=>doAct(`<b>${a.n}</b> is off the close list`,()=>delete ST.cl[a.id])}:{t:'Move to Close List',tail:'MinMacs Now closes it',run:()=>doAct(`<b>${a.n}</b> is on the close list`,()=>ST.cl[a.id]=1)},quit,keep];
  else if(a.spared) acts=[{t:'Quit…',why:'Playwright drives it'},{t:'Go to Agent',tail:'speed-3',run:()=>jump('agents','ag-speed3')}];
  else if(a.ess) acts=[{t:'Quit…',why:'4 agents run in it'},{t:'Go to Agents',tail:'4 in cmux',run:()=>jump('agents','ag-speed3')}];
  else acts=[quit,keep];
  let graph='',ba=null;
  if(VB){
    const L=loadNow(), M=memNow();
    graph=`<div class="cbh"><span>CPU <b>${p.cpu} %</b></span><span>of ${L} % load</span></div><div class="cbar"><i style="flex-grow:${p.cpu};background:${c}"></i><i style="flex-grow:${L-p.cpu};background:var(--g2)"></i><i style="flex-grow:${100-L};background:var(--g1)"></i></div>
     <div class="cbh" style="margin-top:9px"><span>Memory <b>${mbs(p.mb)}</b></span><span>of ${f1(M)} / 32 GB</span></div><div class="cbar"><i style="flex-grow:${p.mb/1000};background:${c}"></i><i style="flex-grow:${M-p.mb/1000};background:var(--g2)"></i><i style="flex-grow:${32-M};background:var(--g1)"></i></div>`
     +(a.id==='chrome'&&!ST.trim?`<div class="cbh" style="margin-top:9px"><span>Tabs <b>45</b></span><span>14 noise, colored</span></div><div class="cbar"><i style="flex-grow:31;background:var(--g2)"></i><i style="flex-grow:14;background:${c}"></i></div>`:'')
     +`<div class="cap">Colored part is this app.</div>`;
    const main=acts[0];
    if(a.id==='chrome'&&!ST.trim) ba={verb:'Trim Tabs',what:'Memory',from:M,to:M-2.9,u:'GB',c,max:32};
    else if(main&&main.run&&main.t==='Quit') ba={verb:'Quit',what:'Memory',from:M,to:M-p.mb/1000,u:'GB',c,max:32};
  }
  return {title:a.n,sub:a.id==='chrome'?'45 tabs in 3 windows':a.x,tone,c,word,status,facts,acts,graph,ba};
}

function baHTML(b){
  const dp=b.dp??1, fm=v=>(+v).toFixed(dp);
  const hi=Math.max(b.from,b.to), lo=Math.min(b.from,b.to), max=b.max||hi||1;
  return `<div class="ba"><div class="bh"><span class="k">${b.verb?b.verb+' · ':''}Before ${TO} After</span></div><div class="bv"><span>${b.what}</span><span class="w"><s>${fm(b.from)}</s>${TO}${fm(b.to)}${b.u?' '+b.u:''}</span></div>
   ${(hi-lo)/max<.06?'':`<div class="bt"><i style="flex:${lo/max} 0 0;background:var(--g2)"></i><i style="flex:${(hi-lo)/max} 0 0;background:${b.c};opacity:${b.up?1:.9}${b.up?'':';background:repeating-linear-gradient(135deg,'+b.c+' 0 3px,transparent 3px 5px)'}"></i>${b.max?`<i style="flex:${(b.max-hi)/b.max} 0 0;background:var(--g1)"></i>`:''}</div>`}</div>`;
}
function cardHTML(cd){
  const sc=cd.tone==='work'?cd.c:TONE[cd.tone||'go'];
  const mkr=(MK[cd.tone==='work'?'work':cd.tone||'go']||MK.go)(sc);
  return `<div class="cin"><div class="ch"><div class="ct">${cd.title}</div><span class="pin" id="pinx">${pinned?PIN+' Pinned':cd.plan?'The plan':'Press to pin'}</span></div>
   ${cd.sub?`<div class="cs">${cd.sub}</div>`:''}
   <div class="cst" style="color:${sc}"><span class="cmk">${mkr}</span><span><b>${cd.word}</b> ${cd.status}</span></div>
   ${VB&&cd.graph?`<div class="cgr">${cd.graph}</div>`:''}
   <div class="facts">${cd.facts.map(f=>`<div class="f${f.pl?' pl':''}${f.link?' link':''}"${f.link?` data-link="${f.link.join(':')}"`:''}>${badge(f.k,f.c)}<span class="fl">${f.l}</span><span class="fv">${f.v}${f.link?ARROW(f.c):''}</span></div>`).join('')}</div>
   ${VB&&cd.ba?baHTML(cd.ba):''}</div>
   <div class="csep"></div>
   <div class="cacts">${cd.acts.map((a,i)=>`<button class="ca${a.run?'':' dis'}" data-ai="${i}"${a.run?'':' aria-disabled="true"'}><span>${a.t}</span><span class="tail">${a.run?(a.tail||''):(a.why||'')}</span></button>`).join('')}</div>`;
}
function planCard(a){
  const p=a.plan();
  return {title:p.title,sub:p.sub,tone:p.tone||'go',c:cur().c,word:p.word,status:p.status,plan:1,
    facts:p.facts.map(f=>({...f,pl:1})),acts:[{t:a.t,tail:a.tail,run:a.run}],graph:'',ba:p.ba?{...p.ba,verb:''}:null};
}

/* ---------- card placement & pinning ---------- */
let pinned=false, cardKey=null, CA=[], hideT=null;
const card=$('card');
function scaleK(){return $('stage').getBoundingClientRect().width/1280}
function stageY(el){const st=$('stage').getBoundingClientRect();return (el.getBoundingClientRect().top-st.top)/scaleK()}
function showCard(key,cd,anchor){
  clearTimeout(hideT);
  CA=cd.acts; cardKey=key;
  card.innerHTML=cardHTML(cd);
  card.classList.toggle('pinned',pinned);
  card.style.setProperty('--c',cd.c);
  const sh=$('sheet');
  card.style.left=(sh.offsetLeft-14-card.offsetWidth)+'px';
  const y=stageY(anchor)-16;
  card.style.top=Math.max(36,Math.min(y,800-12-card.offsetHeight))+'px';
  card.classList.add('show');
  document.querySelectorAll('.rw.hot').forEach(r=>r.classList.remove('hot'));
  if(anchor.classList.contains('rw')) anchor.classList.add('hot');
}
function hideCard(){card.classList.remove('show');cardKey=null;clearPlan();document.querySelectorAll('.rw.hot,.rw.pinr').forEach(r=>r.classList.remove('hot','pinr'))}
function unpin(){pinned=false;card.classList.remove('pinned');document.querySelectorAll('.rw.pinr').forEach(r=>r.classList.remove('pinr'))}
function showItem(id,row){const cd=cardFor(id);if(!cd)return;clearPlan();showCard(id,cd,row)}
function clearPlan(){const d=$('det');d.classList.remove('plan');d.querySelectorAll('.hit').forEach(e=>e.classList.remove('hit'));document.querySelectorAll('.it.touch').forEach(e=>e.classList.remove('touch'))}
function showPlan(i,btn){
  const a=V.acts[i]; if(!a||!a.plan||!a.run) return;
  clearPlan();
  const d=$('det'), hits=new Set(a.hits||[]);
  d.classList.add('plan');
  d.querySelectorAll('.rw[data-id]').forEach(r=>{if(hits.has(r.dataset.id)||hits.has(r.dataset.id.replace('aw-','')))r.classList.add('hit')});
  d.querySelectorAll('.gr i[data-h]').forEach(g=>{if(hits.has(g.dataset.h)||hits.has(cur().id)&&g.dataset.h===cur().id)g.classList.add('hit')});
  (a.touch||[]).forEach(t=>$('it-'+t)&&$('it-'+t).classList.add('touch'));
  showCard('plan'+i,planCard(a),btn);
}
function jump(secId,id){
  unpin(); hideCard();
  const go=()=>{
    const el=id==='more'?document.querySelector(`.more[data-more="${secId}"]`):document.querySelector(`.rw[data-id="${id}"]`);
    if(!el) return;
    el.classList.remove('xl'); void el.offsetWidth; el.classList.add('xl');
    if(el.classList.contains('rw')&&!el.classList.contains('gone')){pinned=true;showItem(id,el);el.classList.add('pinr')}
  };
  if(sel!==secId){select(secId);setTimeout(go,260)}else go();
}

/* ---------- morph: update in place so CSS eases every value ---------- */
function morph(a,b){
  if(a.nodeType!==b.nodeType||a.nodeName!==b.nodeName){a.replaceWith(b.cloneNode(true));return}
  if(a.nodeType===3){if(a.nodeValue!==b.nodeValue)a.nodeValue=b.nodeValue;return}
  if(a.nodeType!==1)return;
  if(a.hasAttribute('data-keep'))return;
  const keepCls=['hot','pinr','xl','hit'].filter(k=>a.classList.contains(k));
  for(const at of [...b.attributes]) if(a.getAttribute(at.name)!==at.value) a.setAttribute(at.name,at.value);
  for(const at of [...a.attributes]) if(!b.hasAttribute(at.name)) a.removeAttribute(at.name);
  keepCls.forEach(k=>a.classList.add(k));
  const ac=[...a.childNodes], bc=[...b.childNodes];
  if(ac.length!==bc.length){a.replaceChildren(...bc.map(n=>n.cloneNode(true)));return}
  ac.forEach((n,i)=>morph(n,bc[i]));
}
function patch(el,html){const t=document.createElement(el.tagName);t.innerHTML=html;
  if(!el.childNodes.length){el.innerHTML=html;return}
  const ac=[...el.childNodes], bc=[...t.childNodes];
  if(ac.length!==bc.length){el.innerHTML=html;return}
  ac.forEach((n,i)=>morph(n,bc[i]));
}
/* numbers ease down to their new value */
function tweens(){
  document.querySelectorAll('[data-tw]').forEach(el=>{
    const t=+el.dataset.tw, dp=+el.dataset.dp;
    if(el._v==null||RM){el._v=t;el.textContent=t.toFixed(dp);return}
    if(el._v===t){return}
    const f=el._v, t0=performance.now(); el._v=t;
    const step=now=>{const k=Math.min(1,(now-t0)/700), e=1-Math.pow(1-k,3);el.textContent=(f+(t-f)*e).toFixed(dp);if(k<1&&el._v===t)requestAnimationFrame(step)};
    requestAnimationFrame(step);
  });
}

function placeBar(instant){
  const s=cur(), b=$('bar'), t=document.querySelector(`.modes button[data-m="${s.mode}"]`);
  if(!b||!t) return;
  if(instant) b.style.transition='none';
  b.style.width=t.offsetWidth+'px'; b.style.transform=`translateX(${t.offsetLeft}px)`;
  b.style.opacity=s.mode?1:.35;
  if(instant){ void b.offsetWidth; b.style.transition='' }
}
function renderIdx(){patch($('idx'),idxHTML());tweens()}
function renderDet(animate){
  const s=cur(), d=$('det'), inn=$('in');
  d.style.setProperty('--c',s.c);
  const fill=()=>{inn.innerHTML=detHTML(s); d.classList.toggle('off',!s.mode); placeBar(true); tweens()};
  if(!animate){fill();return}
  inn.classList.add('swap');
  setTimeout(()=>{fill();requestAnimationFrame(()=>inn.classList.remove('swap'))},170);
}
function updateDet(){const s=cur();$('det').classList.toggle('off',!s.mode);patch($('in'),detHTML(s));placeBar(false);tweens()}
function render(){renderIdx();updateDet();renderToday();renderIcons()}
function renderToday(){
  $('today').innerHTML = ST.autoUndone
   ? `<span class="lbl">Today</span><span class="txt">Reopened 2 apps and started 3 servers again</span><button class="undo" id="redo">Redo</button>`
   : `<span class="lbl">Today</span><span class="txt">Auto closed <b>2 apps</b>, stopped <b>3 servers</b></span><button class="undo" id="aundo">Undo</button>`;
}
function renderIcons(){
  const one=$('one').getAttribute('aria-checked')==='true', box=$('icons');
  if(!box.querySelector('.mi')) box.insertAdjacentHTML('beforeend',S.map(s=>`<span class="mi" id="mi-${s.id}" data-s="${s.id}" title="${s.name}">${gl(s.id,'#fff',16)}</span>`).join('')+`<span class="mi off" id="mi-one" title="MinMacs">${gl('one','#fff',16)}</span>`);
  S.forEach(s=>$('mi-'+s.id).classList.toggle('off',one||s.mode===0));
  $('mi-one').classList.toggle('off',!one);
  setTimeout(aim,420); aim();
}
function anchor(){
  const one=$('one').getAttribute('aria-checked')==='true';
  if(one) return $('mi-one');
  const s=cur(); if(s.mode) return $('mi-'+s.id);
  return [...document.querySelectorAll('.mi:not(.off)')][0]||null;
}
function aim(){
  const a=anchor(), hl=$('hl'), box=$('icons');
  if(!a){hl.style.opacity=0;return}
  const x=a.offsetLeft+8;
  hl.style.opacity=1; hl.style.transform=`translateX(${x-14}px)`;
  const st=$('stage'), k=scaleK();
  const bx=(box.getBoundingClientRect().left-st.getBoundingClientRect().left)/k;
  $('nub').style.transform=`translateX(${bx+x-$('sheet').offsetLeft-1}px)`;
}

/* ---------- toast ---------- */
let toastT=null;
const TICK=`<svg viewBox="0 0 14 14" width="13" height="13" fill="none" stroke="#4CC96B" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="7" cy="7" r="5.8" stroke-opacity=".5"/><path d="M4.6 7.2l1.6 1.6 3.2-3.4"/></svg>`;
function toast(msg,undo){
  const t=$('toast');
  t.querySelector('.tick').innerHTML=TICK;
  $('tmsg').innerHTML=msg; t.classList.toggle('nu',!undo);
  const sh=$('sheet');
  t.classList.add('show');
  t.style.left=(sh.offsetLeft+sh.offsetWidth/2-t.offsetWidth/2)+'px';
  t.style.top=(sh.offsetTop+sh.offsetHeight+14)+'px';
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),undo?7000:2600);
}
$('tundo').addEventListener('click',()=>{
  if(!UNDO.length) return;
  ST=JSON.parse(UNDO.pop()); unpin(); hideCard(); render(); toast('Undone, everything is back',false);
});

function select(id){
  if(id===sel) return; sel=id; unpin(); hideCard();
  renderIdx(); renderDet(true); aim();
}
function setMode(m){const s=cur(); if(s.mode===m) return; s.mode=m; renderIdx(); updateDet(); renderIcons()}

/* ---------- events ---------- */
const inside=(t,el)=>el.contains(t);
document.addEventListener('mouseover',e=>{
  const t=e.target;
  if(inside(t,card)){clearTimeout(hideT);return}
  if(pinned) return;
  const r=t.closest('#det .rw[data-id]');
  if(r&&!r.classList.contains('gone')){if(cardKey!==r.dataset.id)showItem(r.dataset.id,r);else clearTimeout(hideT);return}
  const sa=t.closest('#det .sa');
  if(sa){if(cardKey!=='plan'+sa.dataset.sa){if(!sa.classList.contains('dis'))showPlan(+sa.dataset.sa,sa);else{hideCard()}}clearTimeout(hideT);return}
  if(cardKey&&cardKey.startsWith('plan')&&!t.closest('.sas')){clearTimeout(hideT);hideT=setTimeout(hideCard,260);return}
  if(!inside(t,$('sheet'))){clearTimeout(hideT);hideT=setTimeout(hideCard,450)}
});
document.addEventListener('click',e=>{
  const t=e.target;
  const ca=t.closest('.ca'); if(ca){const a=CA[+ca.dataset.ai]; if(a&&a.run){hideCard();a.run()} return}
  const lk=t.closest('.f.link'); if(lk){const [s,id]=lk.dataset.link.split(':');jump(s,id);return}
  if(t.closest('#pinx')&&pinned){unpin();hideCard();return}
  if(inside(t,card)) return;
  const r=t.closest('#det .rw[data-id]');
  if(r&&!r.classList.contains('gone')){
    if(pinned&&cardKey===r.dataset.id){unpin();showItem(r.dataset.id,r);return}
    pinned=true; showItem(r.dataset.id,r); r.classList.add('pinr'); card.classList.add('pinned'); return;
  }
  const sa=t.closest('#det .sa'); if(sa){const a=V.acts[+sa.dataset.sa]; if(a&&a.run){hideCard();a.run()} return}
  const it=t.closest('.it'); if(it){select(it.dataset.s);return}
  const mb=t.closest('.modes button'); if(mb){setMode(+mb.dataset.m);return}
  const ob=t.closest('.opts button'); if(ob){cur().v=+ob.dataset.v;renderIdx();updateDet();return}
  const mi=t.closest('.mi'); if(mi&&mi.dataset.s){select(mi.dataset.s);return}
  if(t.closest('#aundo')){ST.autoUndone=1;renderToday();updateDet();return}
  if(t.closest('#redo')){ST.autoUndone=0;renderToday();updateDet();return}
  const sw=t.closest('.sw'); if(sw){sw.setAttribute('aria-checked',String(sw.getAttribute('aria-checked')!=='true'));renderIcons();return}
  if(!inside(t,$('sheet'))&&!t.closest('.toast')){unpin();hideCard()}
});
document.addEventListener('focusin',e=>{const r=e.target.closest&&e.target.closest('#det .rw[data-id]');if(r&&!pinned)showItem(r.dataset.id,r)});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){unpin();hideCard();return}
  const r=e.target.closest&&e.target.closest('#det .rw[data-id]');
  if(r&&(e.key==='Enter'||e.key===' ')){e.preventDefault();pinned=true;showItem(r.dataset.id,r);r.classList.add('pinr');card.classList.add('pinned');return}
  const it=e.target.closest&&e.target.closest('.it'); if(!it) return;
  const i=S.findIndex(s=>s.id===it.dataset.s);
  const j=e.key==='ArrowDown'?Math.min(S.length-1,i+1):e.key==='ArrowUp'?Math.max(0,i-1):-1;
  if(j<0) return; e.preventDefault(); select(S[j].id); $('it-'+S[j].id).focus();
});

function fit(){const st=$('stage'),k=Math.min(innerWidth/1280,innerHeight/800);st.style.transform=`translate(${(innerWidth-1280*k)/2}px,${(innerHeight-800*k)/2}px) scale(${k})`;aim()}
addEventListener('resize',fit);
renderIdx(); renderDet(false); renderToday(); renderIcons(); fit();
document.fonts&&document.fonts.ready.then(()=>{placeBar(true);aim()});
/* first frame: show the card the owner liked, on the finished agent */
setTimeout(()=>{const r=document.querySelector('.rw[data-id="ag-auth"]'); if(r&&!pinned&&!cardKey) showItem('ag-auth',r)},700);
</script>
