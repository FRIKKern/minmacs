<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Graph Is the Menu</title>
<style>
:root{
  --glass:rgba(28,29,38,.88);
  --line:rgba(255,255,255,.06);
  --tx:rgba(255,255,255,.94);
  --tx2:rgba(235,235,245,.58);
  --tx3:rgba(235,235,245,.3);
  --g1:rgba(255,255,255,.07);
  --g2:rgba(255,255,255,.2);
  --g3:rgba(255,255,255,.42);
  --ag:#FF86A8;
  --ease:cubic-bezier(.3,.7,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#1a1636}
body{font-family:-apple-system,"SF Pro Text",system-ui,sans-serif;color:var(--tx);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;font-size:13px;cursor:default;user-select:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;text-align:left}
b{font-weight:500}
:focus{outline:none}
:focus-visible{outline:2px solid rgba(255,255,255,.55);outline-offset:3px;border-radius:8px}
#stage{position:absolute;left:0;top:0;width:1280px;height:800px;transform-origin:0 0;overflow:hidden;
  background:
   radial-gradient(760px 560px at 10% 6%,#4b3c9e 0%,rgba(75,60,158,0) 70%),
   radial-gradient(700px 520px at 84% 2%,#22618f 0%,rgba(34,97,143,0) 70%),
   radial-gradient(820px 620px at 88% 104%,#a0436f 0%,rgba(160,67,111,0) 70%),
   radial-gradient(640px 520px at 18% 100%,#3a2463 0%,rgba(58,36,99,0) 75%),
   #1d1a3c}
.mb{position:absolute;left:0;right:0;top:0;height:26px;display:flex;align-items:center;justify-content:space-between;padding:0 12px 0 16px;background:rgba(18,14,40,.32);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);font-size:13px;color:rgba(255,255,255,.92);z-index:5}
.mb-l,.mb-r{display:flex;align-items:center;gap:18px}
.mb-l b{font-weight:700}
.mb-r{gap:14px}
.icons{position:relative;display:flex;align-items:center;gap:12px}
.hl{position:absolute;top:-3px;height:22px;width:28px;border-radius:6px;background:rgba(255,255,255,.2);transition:transform .45s var(--ease),opacity .3s;pointer-events:none}
.mi{position:relative;display:flex;width:16px;overflow:hidden;cursor:pointer;transition:width .4s var(--ease),opacity .3s,margin .4s var(--ease)}
.mi.off{width:0;opacity:0;margin-left:-12px}

.sheet{position:absolute;top:34px;left:400px;width:840px;background:var(--glass);backdrop-filter:blur(36px) saturate(1.5);-webkit-backdrop-filter:blur(36px) saturate(1.5);border:1px solid rgba(255,255,255,.085);border-radius:22px;box-shadow:0 34px 100px rgba(6,4,24,.5),inset 0 1px 0 rgba(255,255,255,.035);animation:drop .6s var(--ease) both}
@keyframes drop{from{opacity:0;transform:translateY(-10px)}}
.nub{position:absolute;top:-8px;left:0;width:18px;height:8px;margin-left:-9px;transition:transform .45s var(--ease)}
.nub svg{display:block}
.head{display:flex;align-items:center;gap:12px;height:50px;padding:0 30px;white-space:nowrap}
.head .lbl{font-size:12px;color:var(--tx3)}
.head .txt{font-size:13px;color:var(--tx2)}
.head .txt b{color:var(--tx)}
.head .fr{margin-left:auto;font-size:12px;color:var(--tx3)}
.head .fr b{color:var(--tx2)}
.body{display:grid;padding:2px 30px 18px;height:612px}

/* live index */
.idx{display:flex;flex-direction:column;min-width:0}
.leg{font-size:11px;color:var(--tx3);height:20px;line-height:14px;white-space:nowrap;display:flex;align-items:flex-start;gap:6px}
.leg i{display:inline-block;width:12px;height:5px;border-radius:3px;margin-top:5px;background:linear-gradient(90deg,#FF86A8,#5B9BFF 22%,#3FD0B8 40%,#4CC96B 58%,#F2B544 78%,#B18CFF)}
.it{position:relative}
.it .dot{flex:none;width:9px;height:9px;border-radius:50%;box-shadow:inset 0 0 0 1.5px rgba(235,235,245,.28);transition:background .35s,box-shadow .35s}
.it .nm{font-weight:600;letter-spacing:-.022em;color:rgba(235,235,245,.36);transition:color .3s;white-space:nowrap}
.it:hover .nm{color:var(--tx2)}
.it.sel .nm{color:var(--tx)}
.it.m0 .mg,.it.m0 .tg{opacity:.28;filter:grayscale(1)}
.mg,.tg{transition:opacity .4s,filter .4s}
.mg i,.tg i{display:block;transition:height .55s var(--ease),width .55s var(--ease),left .55s var(--ease),flex-grow .55s var(--ease),background .35s,opacity .35s,box-shadow .35s,transform .35s var(--ease)}

/* right pane shared */
.det{position:relative;min-width:0}
.det .in{transition:opacity .22s,transform .35s var(--ease)}
.det .in.swap{opacity:0;transform:translateY(6px)}
.lab{display:flex;align-items:center;height:16px;font-size:12px;color:var(--tx3);white-space:nowrap}
.lab .key{margin-left:auto;display:flex;align-items:center;gap:6px;color:var(--tx2);transition:opacity .3s}
.mk{flex:none;width:7px;height:7px;border-radius:50%;background:var(--c)}
.big{display:flex;align-items:baseline;gap:6px;white-space:nowrap;height:44px;margin-top:2px}
.big .n{font-size:38px;font-weight:500;letter-spacing:-.02em;line-height:44px}
.big .u{font-size:15px;color:var(--tx2)}
.big .n2{margin-left:auto;font-size:13px;color:var(--tx2)}
.big .n2 b{color:var(--tx)}
.say{margin-top:2px;font-size:14px;line-height:20px;color:var(--tx2);min-height:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:color .25s}
.say b{color:var(--tx)}
.say.plan{color:var(--tx)}
.say.plan b{color:var(--c)}
.det.off .gfx{filter:grayscale(1);opacity:.5}

.own{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 8px 0 6px;border-radius:10px;font-size:12px;color:var(--ag);background:rgba(255,134,168,.1);white-space:nowrap;transition:background .2s}
.own:hover{background:rgba(255,134,168,.2)}
.own svg{flex:none}
.own.no{color:var(--tx3);background:none;padding:0;cursor:default}

.holds{display:inline-flex;align-items:center;gap:9px;font-size:11px;color:var(--tx3);white-space:nowrap}
.holds span{display:inline-flex;align-items:center;gap:4px}
.holds i{width:7px;height:7px;border-radius:2px}
.holds i.eye{border-radius:50%}

/* settings */
.set{padding-top:6px;border-top:1px solid var(--line)}
.modes{position:relative;display:flex;gap:24px;height:40px;align-items:flex-start;margin-top:4px}
.modes button{font-size:26px;font-weight:600;letter-spacing:-.02em;line-height:32px;color:var(--tx3);transition:color .3s}
.modes button:hover{color:var(--tx2)}
.modes button[aria-checked="true"]{color:var(--tx)}
.bar{position:absolute;left:0;top:35px;height:2px;border-radius:1px;background:var(--c);transition:transform .45s var(--ease),width .45s var(--ease),background .35s,opacity .3s}
.rule{margin-top:2px;font-size:13.5px;line-height:19px;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.opts{display:flex;gap:18px;height:24px;margin-top:7px;align-items:flex-start;white-space:nowrap;transition:opacity .3s}
.opts button{position:relative;font-size:14px;color:var(--tx3);line-height:19px;transition:color .25s}
.opts button:hover{color:var(--tx2)}
.opts button[aria-checked="true"]{color:var(--tx);font-weight:500}
.opts button[aria-checked="true"]::after{content:"";position:absolute;left:50%;bottom:-5px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--c)}
.det.off .opts{opacity:.3;pointer-events:none}

/* section action button */
.sa{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 15px;border-radius:17px;font-size:13.5px;font-weight:600;white-space:nowrap;background:var(--c);color:#0e1020;transition:filter .2s,opacity .3s,transform .2s var(--ease),box-shadow .25s}
.sa .tl{font-weight:400;opacity:.62;font-size:12.5px}
.sa:hover{filter:brightness(1.08);box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 22%,transparent)}
.sa:active{transform:scale(.98)}
.sa.ghost{background:rgba(255,255,255,.07);color:var(--tx)}
.sa.ghost .tl{color:var(--tx3);opacity:1}
.sa.ghost:hover{background:rgba(255,255,255,.12);box-shadow:none}
.sa[disabled]{opacity:.35;pointer-events:none}

/* verbs */
.vb{display:inline-flex;align-items:baseline;gap:5px;height:26px;line-height:26px;padding:0 9px;border-radius:13px;font-size:12.5px;font-weight:500;white-space:nowrap;color:var(--tx);background:rgba(255,255,255,.07);transition:background .2s,color .2s}
.vb .tl{font-weight:400;font-size:11.5px;color:var(--tx3)}
.vb:hover{background:rgba(255,255,255,.14)}
.vb.pr{background:color-mix(in srgb,var(--c) 24%,transparent);color:#fff}
.vb.pr:hover{background:color-mix(in srgb,var(--c) 36%,transparent)}
.vb.dis{background:none;color:var(--tx3);cursor:default;padding-left:4px}
.vb.dis .tl{color:var(--tx3);opacity:.8}

/* toast */
.toast{position:absolute;right:22px;top:6px;z-index:9;display:flex;align-items:center;gap:14px;height:40px;padding:0 8px 0 18px;border-radius:20px;background:rgba(44,45,58,.97);box-shadow:0 14px 40px rgba(0,0,0,.4),inset 0 0 0 1px rgba(255,255,255,.08);font-size:13px;color:var(--tx2);white-space:nowrap;transform:translateY(-8px);opacity:0;pointer-events:none;transition:opacity .3s,transform .4s var(--ease)}
.toast.on{opacity:1;transform:none;pointer-events:auto}
.toast b{color:var(--tx)}
.toast .tu{height:28px;padding:0 13px;border-radius:14px;font-weight:600;color:var(--tx);background:rgba(255,255,255,.1);transition:background .2s}
.toast .tu:hover{background:rgba(255,255,255,.18)}
.toast .tu[hidden]{display:none}
.toast.solo{padding-right:18px}

.foot{display:flex;align-items:center;gap:28px;height:50px;padding:0 30px;border-top:1px solid var(--line)}
.sw{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--tx2);transition:color .2s}
.sw i{width:32px;height:19px;border-radius:10px;background:rgba(255,255,255,.14);position:relative;transition:background .25s;flex:none}
.sw i::after{content:"";position:absolute;left:2px;top:2px;width:15px;height:15px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .25s var(--ease)}
.sw[aria-checked="true"]{color:var(--tx)}
.sw[aria-checked="true"] i{background:#5B9BFF}
.sw[aria-checked="true"] i::after{transform:translateX(13px)}
.foot .hint{margin-left:auto;font-size:11px;color:var(--tx3);white-space:nowrap}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important}}

/* ===== A: the graph is the menu ===== */
.body{grid-template-columns:312px 1fr;column-gap:34px}
.leg{justify-content:flex-end}
.it{display:block;height:96px;padding-top:12px;cursor:pointer;border-radius:14px}
.it .r1{display:flex;align-items:center;gap:12px;height:40px}
.it .nm{flex:1;font-size:22px;min-width:0}
.mg{flex:none;position:relative;width:58px;height:24px;display:flex;align-items:flex-end;justify-content:space-between}
.mg .tr{position:absolute;left:0;right:0;top:9px;height:6px;border-radius:3px;background:var(--g1)}
.mg .tr i{position:absolute;top:0;bottom:0;border-radius:3px}
.mg .tr .tk{top:-4px;bottom:-4px;width:2px;margin-left:-1px;border-radius:1px;background:#fff}
.mg.mc i{flex:none;border-radius:2px}
.mg.dots{flex-wrap:wrap;align-content:center;justify-content:space-between;row-gap:4px}
.mg.dots i{width:6px;height:6px;border-radius:50%}
.mg.ring{justify-content:flex-end;align-items:center}
.nb{flex:none;width:78px;display:flex;flex-direction:column;align-items:flex-end;white-space:nowrap}
.nb .n{font-size:16px;font-weight:500;line-height:19px;color:var(--tx2);transition:color .3s}
.nb .n u{text-decoration:none;font-size:11px;font-weight:400;color:var(--tx3);margin-left:3px}
.nb .cp{font-size:11px;line-height:15px;color:var(--tx3)}
.it.sel .nb .n{color:var(--tx)}
.it.m0 .nb .n{color:var(--tx3);font-weight:400;font-size:13px}
/* the hover action under each index name */
.it .r2{display:flex;gap:6px;height:28px;margin:6px 0 0 21px;opacity:0;transform:translateY(-3px);transition:opacity .25s,transform .3s var(--ease)}
.it:hover .r2,.it:focus-within .r2{opacity:1;transform:none}
.ia{display:inline-flex;align-items:baseline;gap:7px;height:26px;line-height:26px;padding:0 11px;border-radius:13px;font-size:12.5px;font-weight:600;white-space:nowrap;color:var(--ic);background:color-mix(in srgb,var(--ic) 15%,transparent);transition:background .2s}
.ia .tl{font-weight:400;font-size:11.5px;color:var(--tx3)}
.ia:hover{background:color-mix(in srgb,var(--ic) 27%,transparent)}
.ia.ghost{color:var(--tx2);background:rgba(255,255,255,.06)}
.ia[disabled]{opacity:.4;pointer-events:none}
.it.pv .mg i:not(.p):not(.tk){opacity:.18!important}
.it.pv .mg i.p{box-shadow:0 0 8px var(--ic)}
.it.pv .mg.ring svg{filter:drop-shadow(0 0 4px var(--ic))}

/* graph */
.gw{position:relative;margin-top:12px}
.cc{display:flex;align-items:flex-end;height:150px}
.col{position:relative;flex:1 1 0;min-width:0;max-width:72px;height:100%;margin-right:6px;display:flex;flex-direction:column;justify-content:flex-end;cursor:pointer;transition:flex-grow .6s var(--ease),margin .6s var(--ease),opacity .45s}
.col:last-child{margin-right:0}
.col::before{content:"";position:absolute;inset:0;border-radius:7px;background:rgba(255,255,255,.035);transition:background .2s}
.col:hover::before{background:rgba(255,255,255,.07)}
.col .cb{position:relative;border-radius:7px;transition:height .6s var(--ease),background .35s,box-shadow .3s,opacity .3s}
.col.gone{flex-grow:.0001;margin-right:0;opacity:0;pointer-events:none}
.col.gone .cb{height:0!important}
.col.pin::after{content:"";position:absolute;inset:-3px;border-radius:9px;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.75);pointer-events:none}
.cc.hv .col:not(.hov) .cb{opacity:.55}
.lbls{display:flex;height:34px;margin-top:6px}
.lbls .cl{flex:1 1 0;min-width:0;max-width:72px;margin-right:6px;display:flex;flex-direction:column;align-items:center;font-size:11px;line-height:14px;color:var(--tx3);white-space:nowrap;overflow:hidden;transition:flex-grow .6s var(--ease),margin .6s var(--ease),opacity .4s}
.lbls .cl:last-child{margin-right:0}
.lbls .cl b{font-weight:500;color:var(--tx2)}
.lbls .cl.gone{flex-grow:.0001;margin-right:0;opacity:0}
.lbls .cl svg{margin-top:1px}
.grp{display:flex;height:22px;margin-top:6px}
.grp span{flex:1 1 0;min-width:0;margin-right:6px;padding-top:6px;border-top:1.5px solid var(--g1);font-size:11px;color:var(--tx3);text-align:center;white-space:nowrap;overflow:hidden;transition:flex-grow .6s var(--ease),opacity .4s,margin .6s var(--ease)}
.grp span:last-child{margin-right:0}
.grp span.c{border-color:var(--c);color:var(--tx2)}
.grp span.z{flex-grow:.0001;opacity:0;margin-right:0}
.cap{display:flex;gap:14px;margin-top:6px;height:16px;font-size:11px;color:var(--tx3);white-space:nowrap}
.cap span{display:inline-flex;align-items:center;gap:5px}
.cap i{width:8px;height:8px;border-radius:2px}
/* preview: hovering a section action highlights exactly what it touches */
.det.pv .col:not(.p) .cb,.det.pv .ar:not(.p),.det.pv .pk:not(.p),.det.pv .chip:not(.p){opacity:.18}
.det.pv .col.p .cb{box-shadow:0 0 0 2px rgba(255,255,255,.5),0 0 22px color-mix(in srgb,var(--c) 60%,transparent)}
.det.pv .ar.p{background:color-mix(in srgb,var(--c) 12%,transparent)}
.det.pv .pk.p .pc{box-shadow:0 0 0 2px #fff,0 0 16px var(--c)}
.det.pv.nohi .col .cb,.det.pv.nohi .ar,.det.pv.nohi .pk{opacity:1!important;box-shadow:none}

/* agents as horizontal bars */
.ars{margin-top:12px}
.ar{display:flex;align-items:center;gap:9px;height:29px;padding:0 6px;margin:0 -6px;border-radius:8px;cursor:pointer;white-space:nowrap;transition:background .2s,opacity .35s,height .5s var(--ease),margin .5s}
.ar:hover,.ar.hov{background:rgba(255,255,255,.05)}
.ar.pin{box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.6)}
.ar.gone{height:0;opacity:0;pointer-events:none;overflow:hidden}
.ar .sd{flex:none;width:8px;height:8px;border-radius:50%;transition:background .3s,box-shadow .3s}
.ar .ic{flex:none;display:flex}
.ar .an{flex:none;width:108px;overflow:hidden;text-overflow:ellipsis;font-size:13px}
.ar .wh{flex:none;width:84px;font-size:12px;color:var(--tx3)}
.ar .hb{flex:1;position:relative;height:8px;border-radius:4px;background:var(--g1);display:flex;overflow:hidden}
.ar .hb i{height:100%;transition:width .6s var(--ease)}
.ar .aw{flex:none;width:8px;height:8px;border-radius:50%;transition:opacity .3s,background .3s}
.ar .tm{flex:none;width:84px;text-align:right;font-size:12px;color:var(--tx3)}
.ar.st-w .tm{color:var(--ag)}
.ar.st-n .tm{color:var(--tx)}
.chips{display:flex;align-items:center;gap:4px;height:28px;margin-top:2px;padding-left:23px;font-size:12px;color:var(--tx3);white-space:nowrap}
.chip{display:flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:13px;cursor:pointer;color:var(--tx2);transition:background .2s,opacity .3s}
.chip:hover,.chip.hov{background:rgba(255,255,255,.07)}
.chip.pin{box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.6)}

/* keep awake pucks */
.bat{margin-top:12px}
.bat .hd{display:flex;justify-content:space-between;height:16px;font-size:12px;color:var(--tx3);white-space:nowrap}
.bat .hd b{color:var(--tx)}
.tb{position:relative;height:6px;margin-top:6px;border-radius:3px;background:var(--g1)}
.tb i{position:absolute;top:0;bottom:0;border-radius:3px;transition:left .55s var(--ease),width .55s var(--ease)}
.tb .tk{top:-4px;bottom:-4px;width:2px;margin-left:-1px;border-radius:1px;background:#fff}
.pks{display:grid;grid-template-columns:repeat(6,1fr);row-gap:6px;margin-top:16px}
.pk{display:flex;flex-direction:column;align-items:center;gap:5px;height:66px;padding-top:4px;border-radius:12px;cursor:pointer;transition:background .2s,opacity .35s}
.pk:hover,.pk.hov{background:rgba(255,255,255,.05)}
.pk.pin{box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.6)}
.pk .pc{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.05);transition:box-shadow .35s,background .35s}
.pk.hold .pc{box-shadow:0 0 0 2px var(--c);background:color-mix(in srgb,var(--c) 14%,transparent)}
.pk .pn{max-width:64px;font-size:10.5px;line-height:12px;color:var(--tx3);text-align:center}
.pk.hold .pn{color:var(--tx2)}
.pk.gone{opacity:.25}

/* readout: the hovered thing and its verbs */
.ro{position:relative;height:66px;margin-top:10px;padding:10px 0 0;border-top:1px solid var(--line)}
.ro .l1{display:flex;align-items:center;gap:8px;height:22px;white-space:nowrap;min-width:0}
.ro .l1 .t{font-size:14px;font-weight:600}
.ro .l1 .f{min-width:0;overflow:hidden;text-overflow:ellipsis;font-size:12.5px;color:var(--tx3)}
.ro .l1 .own,.ro .l1 .own.no,.ro .l1 .holds{margin-left:auto;flex:none}
.ro .l2{display:flex;gap:5px;margin-top:6px;height:26px;white-space:nowrap}
.ro .hint{font-size:12.5px;line-height:22px;color:var(--tx3)}
.ro .hint b{color:var(--tx2)}
.ro .in2{transition:opacity .18s}
.acts{display:flex;align-items:center;gap:10px;height:34px;margin:10px 0 14px}
.acts .note{margin-left:auto;font-size:11.5px;color:var(--tx3);white-space:nowrap}

</style>
</head>
<body class="var-a">
<div id="stage">

const plural=(n,w)=>n+' '+w+(n===1?'':'s');

function planWords(id,k){

  const v={apps:'Quits',servers:'Stops',trees:'Removes',disk:'Cleans'}[id];

/* item actions */
function acts(id,x){
  const L=[];
  const add=(k,label,tail,o={})=>L.push({k,label,tail:tail||'',...o});
  if(id==='agents'||id==='awake'){
    const a=x;
    if(a.gone){add('back','Bring Back','undo the wrap-up',{pr:1});return L}
    add('tab','Go to Tab');
    if(id==='awake'){
      if(a.awake&&!a.sleep) add('sleep','Let It Sleep','',{pr:1}); else if(a.awake) add('wake','Keep It Awake','',{pr:1});
      add('hour','Keep Awake 1 h',st.until?'until '+st.until:'until 17:42',{dis:!!st.until});
      return L;
    }
    if(a.st==='f'||a.st==='i') add('wrap','Wrap Up',freeGB(a)?f1(freeGB(a))+' GB':'',{pr:a.st==='f'}); else add('wrap','Wrap Up…',a.st==='w'?'working':'needs you',{dis:1});
    const sv=SRVOF(a).filter(s=>!s.gone);
    if(sv.length) add('stopsrv','Stop Its Servers',String(sv.length));
    if(a.awake&&!a.sleep) add('sleep','Let It Sleep');
    return L;
  }
  if(id==='apps'){
    if(x.gone){add('back','Restore','reopen',{pr:1});return L}
    if(x.k==='chrome'&&!x.trim) add('trim','Trim Tabs','14 tabs · 3.3 GB',{pr:1});
    if(x.lock) add('quit','Quit…',x.lock,{dis:1});
    else if(x.refused) add('force','Force Quit',sz(x.gb),{pr:1});
    else add('quit','Quit',sz(x.gb),{pr:x.k!=='chrome'||x.trim});
    if(!x.lock) add(x.plan?'keep':'add',x.plan?'Keep':'Move to Close List');
    return L;
  }
  if(id==='servers'){
    if(x.gone){add('back','Restart','start again',{pr:1});return L}
    if(x.cls==='use'){add('open','Open in Browser');add('restart','Restart');add('stop','Stop',sz(x.gb))}
    else{add('stop','Stop',sz(x.gb),{pr:1});add(x.plan?'keep':'add',x.plan?'Keep':'Add to Close Idle');add('open','Open in Browser')}
    if(x.own) add('agent','Go to Agent');
    return L;
  }
  if(id==='trees'){
    if(x.gone){add('back','Bring Back','from the Trash',{pr:1});return L}
    if(x.lock) add('rm','Remove…',x.lock,{dis:1});
    else add('rm','Remove',x.bundle?'bundles first':sz(x.gb),{pr:x.cls==='m'||x.cls==='s'});
    if(x.cls==='m') add(x.plan?'keep':'add',x.plan?'Keep':'Add Back');
    if(x.cls==='u') add('editor','Open in Editor'); else add('commit','Show Commit');
    if(x.cls!=='u') add('finder','Show in Finder');
    return L;
  }
  if(id==='disk'){
    if(x.gone){add('back','Put Back','from the Trash',{pr:1,dis:x.how!=='to the Trash',tail:x.how!=='to the Trash'?'re-downloads on use':'from the Trash'});return L}
    if(x.lock) add('clean','Clean…',x.lock,{dis:1});
    else add('clean','Clean',x.how==='to the Trash'?sz(x.gb)+' to the Trash':x.how,{pr:1});
    if(!x.lock) add(x.plan?'keep':'add',x.plan?'Keep':'Add to Clean Safe');
    add('finder','Show in Finder');
    return L;
  }
  return L;
}

/* ---------- undo + toast ---------- */
let snap=null, toastT=null;
function toast(html,undo){
  const t=$('toast'); $('tmsg').innerHTML=html;
  $('tundo').hidden=!undo; t.classList.toggle('solo',!undo);
  t.classList.add('on'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('on'),undo?7000:2600);
}
function commit(fn,msg,freed){
  snap=JSON.stringify(st);
  fn(); if(freed) st.freed+=freed;
  render(); toast(msg,true);
}
function undo(){
  if(!snap) return; st=JSON.parse(snap); snap=null; render();
  toast('Undone. Everything is back as it was.',false);
}

function runSection(id,k){
  const p=planOf(id), gb=planGB(id);
  if(id==='agents'){ if(!p.length) return;
    commit(()=>p.forEach(wrap),`Wrapped up <b>${p.map(a=>a.n).join(', ')}</b> · ${f1(gb)} GB freed`,gb); return }
  if(id==='apps'&&k==='restore'){ commit(()=>{st.restored=1},'Reopened <b>2 apps</b> and <b>14 tabs</b> from 11:05',0); return }
  if(id==='awake'){
    if(k==='hour'){ commit(()=>{st.until='17:42'},'The Mac stays awake until <b>17:42</b>',0); return }
    if(!p.length) return;
    commit(()=>p.forEach(a=>a.sleep=1),`<b>The Mac can sleep.</b> ${plural(p.length,'agent')} keep working until it does`,0); return }
  if(!p.length) return;
  const v={apps:'Quit',servers:'Stopped',trees:'Removed',disk:'Cleaned'}[id];
  commit(()=>p.forEach(x=>x.gone=1),`${v} <b>${plural(p.length,NOUN[id])}</b> · ${id==='apps'?f1(gb)+' GB':szs(gb)} freed`,gb);
}
function wrap(a){a.gone=1; SRVOF(a).forEach(s=>s.gone=1); TREEOF(a).filter(t=>t.cls==='m').forEach(t=>t.gone=1)}

function runItem(id,k,key){
  const x=id==='awake'||id==='agents'?agent(key):st[id].find(i=>i.k===key); if(!x) return;
  const A=acts(id,x).find(a=>a.k===k); if(!A||A.dis) return;
  const N=`<b>${x.n}</b>`;
  switch(k){
    case 'tab': toast(`Switched to ${N} in its ${x.where}`); return;
    case 'open': toast(`Opened <b>localhost${x.n}</b> in the browser`); return;
    case 'restart': toast(`Restarted ${N} ${x.x}`); return;
    case 'commit': toast(`Showing the last commit of ${N}`); return;
    case 'finder': toast(`Showing ${N} in Finder`); return;
    case 'editor': toast(`Opened ${N} in Cursor`); return;
    case 'agent': goAgent(x.own); return;
  }
  if(id==='agents'||id==='awake'){
    if(k==='wrap'){const gb=freeGB(x);commit(()=>wrap(x),`Wrapped up ${N} · stopped its servers, removed its worktree · ${f1(gb)} GB`,gb);return}
    if(k==='stopsrv'){const sv=SRVOF(x).filter(s=>!s.gone);const gb=sv.reduce((s,v)=>s+v.gb,0);commit(()=>sv.forEach(s=>s.gone=1),`Stopped ${sv.map(s=>s.n).join(', ')} for ${N} · ${sz(gb)}`,gb);return}
    if(k==='sleep'){commit(()=>{x.sleep=1},`${N} no longer holds the Mac awake`);return}
    if(k==='wake'){commit(()=>{x.sleep=0},`${N} holds the Mac awake again`);return}
    if(k==='hour'){commit(()=>{st.until='17:42'},'The Mac stays awake until <b>17:42</b>');return}
    if(k==='back'){commit(()=>{x.gone=0;SRVOF(x).forEach(s=>s.gone=0);TREEOF(x).forEach(t=>t.gone=0)},`Brought back ${N}, its server and worktree`);return}
  }
  if(k==='back'){commit(()=>{x.gone=0;x.refused=0},`${{apps:'Reopened',servers:'Started',trees:'Brought back',disk:'Put back'}[id]} ${N}`,-(x.gb));return}
  if(k==='keep'){commit(()=>{x.plan=0;x.kept=1},`Kept ${N}. ${sacts(id)[0].label} leaves it alone`);return}
  if(k==='add'){commit(()=>{x.plan=1;x.kept=0},`Added ${N} to ${sacts(id)[0].label}`);return}
  if(k==='trim'){commit(()=>{x.trim=1;x.gb=5.4;x.cpu=14;x.x='31 work tabs'},`Trimmed 14 noise tabs in ${N} · 3.3 GB freed`,3.3);return}
  if(k==='quit'&&x.refuse&&!x.refused){x.refused=1;render();toast(`${N} did not quit. It is not responding, so Force Quit is there now.`);return}
  const v={quit:'Quit',force:'Force quit',stop:'Stopped',rm:'Removed',clean:'Cleaned'}[k];
  if(v){const extra=k==='rm'&&x.bundle?' · kept a git bundle':k==='clean'&&x.how!=='to the Trash'?' · ran '+x.how:'';
    commit(()=>{x.gone=1},`${v} ${N} · ${sz(x.gb)}${extra}`,x.gb);}
}
function goAgent(k){ select('agents'); setTimeout(()=>V.focus&&V.focus(k),260) }

/* ---------- morph so CSS eases every value ---------- */
function morph(a,b){
  if(a.nodeType!==b.nodeType||a.nodeName!==b.nodeName){a.replaceWith(b.cloneNode(true));return}
  if(a.nodeType===3){if(a.nodeValue!==b.nodeValue)a.nodeValue=b.nodeValue;return}
  if(a.nodeType!==1)return;
  if(a.hasAttribute('data-keep'))return;
  for(const at of [...b.attributes]) if(a.getAttribute(at.name)!==at.value) a.setAttribute(at.name,at.value);
  for(const at of [...a.attributes]) if(!b.hasAttribute(at.name)) a.removeAttribute(at.name);
  const ac=[...a.childNodes], bc=[...b.childNodes];
  if(ac.length!==bc.length){a.replaceChildren(...bc.map(n=>n.cloneNode(true)));return}
  ac.forEach((n,i)=>morph(n,bc[i]));
}
function patch(el,html){const t=document.createElement(el.tagName);t.innerHTML=html;
  if(!el.childNodes.length){el.innerHTML=html;return}
  const ac=[...el.childNodes], bc=[...t.childNodes];
  if(ac.length!==bc.length){el.innerHTML=html;return}
  ac.forEach((n,i)=>morph(n,bc[i]));
}
/* numbers ease down: <b class="tw" data-k data-v data-f> */
const TW={}; const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const tw=(k,v,f)=>`<span class="tw" data-k="${k}" data-v="${v}" data-f="${f}">${fmtN(v,f)}</span>`;
function fmtN(v,f){v=+v;return f==='g'?f1(v).replace(/\.0$/,''):f==='0'?String(Math.round(v)):f==='1'?f1(v):f==='2'?f2(v).replace(/0$/,''):String(v)}
function tweens(){
  document.querySelectorAll('.tw').forEach(el=>{
    const k=el.dataset.k, v=+el.dataset.v, f=el.dataset.f, p=TW[k]; TW[k]=v;
    if(p==null||p===v||RM){el.textContent=fmtN(v,f);return}
    const t0=performance.now(), d=650;
    const step=t=>{const q=Math.min(1,(t-t0)/d), e=1-Math.pow(1-q,3); if(el.dataset.k!==k) return; el.textContent=fmtN(p+(v-p)*e,f); if(q<1) requestAnimationFrame(step)};
    el.textContent=fmtN(p,f); requestAnimationFrame(step);
  });
}

function ownLink(x){

function holdMarks(a){

const STW={w:'working',n:'needs you',i:'idle',f:'finished'};
function agentDot(a,size){

function rule(s){

function renderIcons(){

function anchor(){

function coreClick(e){

  return `<div class="grp">${g.map(([k,w])=>{const n=st.trees.filter(t=>t.cls===k&&!t.gone).length;return `<span class="${k==='m'?'c':''}${n?'':' z'}" style="flex-grow:${n||.0001}">${n} ${w}</span>`}).join('')}</div>`;
}
function capRow(items){return `<div class="cap">${items.map(([c,t])=>c?`<span><i style="${c}"></i>${t}</span>`:`<span>${t}</span>`).join('')}</div>`}

function agentRows(){
  const named=st.agents.slice(0,7), more=st.agents.slice(7);
  const rows=named.map(a=>{
    const sv=SRVOF(a).filter(x=>!x.gone).reduce((s,x)=>s+x.gb,0), tr=TREEOF(a).filter(x=>!x.gone).reduce((s,x)=>s+x.gb,0);
    const W=v=>Math.min(100,v/3.4*100);
    const p=a.plan&&a.st==='f'&&!a.gone;
    return `<div class="ar st-${a.st}${a.gone?' gone':''}${p?' p':''}${pin===a.k?' pin':''}${hov===a.k?' hov':''}" data-k="${a.k}" role="button" tabindex="0">
      <i class="sd" style="${agentDot(a,8)}"></i><span class="ic">${ICON[a.tool]}</span><span class="an">${a.n}</span><span class="wh">${a.where}</span>
      <span class="hb"><i style="width:${W(sv)}%;background:${SC.servers}"></i><i style="width:${W(tr)}%;background:${SC.trees}"></i>${a.k==='speed-3'?`<i style="width:${W(.4)}%;background:${SC.disk}"></i>`:''}</span>
      <i class="aw" style="background:${SC.awake};opacity:${a.awake&&!a.sleep&&!a.gone?1:0}"></i>
      <span class="tm">${STW[a.st]} ${a.t}</span></div>`}).join('');
  return `<div class="ars">${rows}<div class="chips"><span style="margin-right:6px">5 more, idle over 1 h</span>${more.map(a=>`<span class="chip${pin===a.k?' pin':''}${hov===a.k?' hov':''}" data-k="${a.k}" role="button" tabindex="0" aria-label="${a.n}">${ICON[a.tool]}</span>`).join('')}</div></div>`;
}
function pucks(){
  return `<div class="pks">${st.agents.map(a=>{const h=a.awake&&!a.sleep&&!a.gone;
    return `<div class="pk${h?' hold p':''}${a.gone?' gone':''}${pin===a.k?' pin':''}${hov===a.k?' hov':''}" data-k="${a.k}" role="button" tabindex="0"><span class="pc">${ICON[a.tool]}</span><span class="pn">${a.n}</span></div>`}).join('')}</div>`;
}

function graph(s){
  const id=s.id, c=s.c;
  if(id==='agents') return agentRows()+capRow([[`background:${SC.servers}`,'servers'],[`background:${SC.trees}`,'worktree'],[`background:${SC.disk}`,'caches'],[`background:${SC.awake};border-radius:50%`,'keeps it awake'],[null,'Bar = what it holds']]);
  if(id==='apps') return cols('apps',8.7,x=>`${ICON[x.ic]}<b>${sz(x.gb).replace(' ',' ')}</b>`)+capRow([[null,'Height = memory'],[`background:${c}`,'MinMacs Now quits'],[`background:var(--g3)`,'kept'],[`background:var(--g2)`,'unsorted']]);
  if(id==='servers') return cols('servers',.64,x=>`<b>${x.n}</b>${x.x}`)+capRow([[null,'Height = memory'],[`background:${c}`,'idle, Close Idle stops'],[`background:var(--g3)`,'in use'],[`background:var(--g2)`,'kept']]);
  if(id==='trees') return cols('trees',3.2,null)+grpRow()+capRow([[null,'Height = size'],[`background:${c}`,'Remove Merged takes'],[`box-shadow:inset 0 0 0 1.5px var(--g3)`,'stale'],[`background:var(--g3)`,'agent works in it']]);
  if(id==='disk') return cols('disk',14.2,x=>`<b>${szs(x.gb)}</b>${({'d-xc':'DerivedData','d-nm':'modules','d-npm':'npm','d-dk':'Docker','d-pw':'Playwright','d-sim':'Simulators'})[x.k]}`)+capRow([[null,'Height = size'],[`background:${c}`,'Clean Safe takes'],[`background:var(--g2)`,'you decide'],[`box-shadow:inset 0 0 0 1.5px var(--g3)`,'report only']]);
  const bt=thr(s);
  return `<div class="bat"><div class="hd"><span>Battery <b>64</b> % · on power</span><span>${bt?`Sleeps at <b>${bt}</b> %`:'Battery never ends it'}</span></div><div class="tb"><i style="left:0;width:64%;background:rgba(255,255,255,.55)"></i><i class="tk" style="left:${bt}%;opacity:${bt?1:0}"></i></div></div>`+pucks()+capRow([[`box-shadow:inset 0 0 0 2px ${c};border-radius:50%`,'holds the Mac awake'],[null,'It also sleeps on lost network or heat']]);
}

function bigOf(s){
  const id=s.id;
  if(id==='agents'){const w=st.agents.filter(a=>a.st==='w'&&!a.gone).length;return [tw('b-ag',w,'0'),'working',`<b>1</b> needs you · <b>${st.agents.filter(a=>a.st==='i'&&!a.gone).length}</b> idle`]}
  if(id==='apps') return [tw('b-ap',LOAD-goneCPU(),'0'),'% load',planOf('apps').length?`MinMacs Now frees <b>${tw('b-ap2',planGB('apps'),'1')}</b> GB`:'nothing left to close'];
  if(id==='servers') return [tw('b-sv',planOf('servers').length,'0'),'idle',`of <b>${st.servers.filter(x=>!x.gone).length}</b> running`];
  if(id==='trees') return [tw('b-tr',planOf('trees').length,'0'),'merged',planOf('trees').length?`<b>${tw('b-tr2',planGB('trees'),'2')}</b> GB ready to free`:'nothing ready to free'];
  if(id==='disk') return [tw('b-dk',planGB('disk'),'1'),'GB safe',`<b>${tw('b-dk2',182+st.disk.filter(d=>d.gone).reduce((a,d)=>a+d.gb,0),'g')}</b> GB free of 994`];
  return [tw('b-aw',holders().length,'0'),'agents keep it awake',st.until?`awake until <b>${st.until}</b>`:''];
}
function sayOf(s){
  const id=s.id;
  if(id==='agents') return planOf('agents').length?'fix auth redirect finished 2h ago. It still holds :4000.':'Nothing finished is holding anything right now.';
  if(id==='apps') return planOf('apps').length?'Chrome and Spotify are the noise: 22 % of the load, 9.3 GB.':'No noise apps left open.';
  if(id==='servers') return st.servers.find(x=>x.k==='s6006'&&!x.gone)?':6006 storybook has been idle 3 days and nobody owns it.':'Every server left running has an owner.';
  if(id==='trees') return 'auth-redirect still runs :4000. It stops with its worktree.';
  if(id==='disk') return 'DerivedData is the largest. 4 of its 7 projects no longer exist.';
  const h=holders();
  return h.length?`Awake while ${h.length===1?h[0].n:plural(h.length,'agent')} work${h.length===1?'s':''}. Sleeps after the last one.`:st.until?'Awake until 17:42, then it sleeps as usual.':'Nothing holds it awake. It sleeps as usual.';
}
const KEY={agents:'colored = finished, Wrap Up takes it',apps:'colored = MinMacs Now quits',servers:'colored = Close Idle stops',trees:'colored = Remove Merged takes',disk:'colored = Clean Safe takes',awake:'ring = holds it awake'};
V.det=s=>{
  const b=bigOf(s), A=sacts(s.id);
  return `<div class="lab">Right now${keyLine(s,KEY[s.id])}</div>
   <div class="big"><span class="n">${b[0]}</span><span class="u">${b[1]}</span><span class="n2">${b[2]}</span></div>
   <p class="say" id="say">${sayOf(s)}</p>
   <div class="gw gfx" id="gw">${graph(s)}</div>
   <div class="ro" id="ro" data-keep></div>
   <div class="acts">${A.map(a=>`<button class="sa${a.ghost?' ghost':''}" data-sa="${a.k}" data-sid="${s.id}"${a.n?'':' disabled'}>${a.label}<span class="tl">${a.tail}</span></button>`).join('')}</div>
   ${setHTML(s)}`;
};

/* ---------- readout ---------- */
function itemOf(k){if(!k) return [null,null]; const [id,x]=find(k); if(!x) return [null,null]; return [sel==='awake'&&id==='agents'?'awake':id,x]}
function roHTML(){
  const k=hov||pin; const [id,x]=itemOf(k);
  if(!x||(id!==sel&&!(sel==='awake'&&id==='awake'))){
    const w={agents:'an agent',apps:'a column',servers:'a column',trees:'a column',disk:'a column',awake:'an agent'}[sel];
    return `<div class="in2"><div class="hint">Point at ${w} to act on it. Click to hold it here.</div><div class="hint"><b>${sacts(sel)[0].label}</b> below acts on all the colored ones at once.</div></div>`;
  }
  let ic='', facts='';
  if(id==='agents'){ic=ICON[x.tool]; facts=`${TOOL[x.tool]} · ${STW[x.st]} ${x.t}`}
  if(id==='awake'){ic=ICON[x.tool]; facts=`${TOOL[x.tool]} · ${x.where} · ${STW[x.st]} ${x.t}`}
  if(id==='apps'){ic=ICON[x.ic]; facts=`${x.cpu} % CPU · ${sz(x.gb)} · ${x.x}`}
  if(id==='servers'){ic=gl('servers',SC.servers,15); facts=`${x.x} · ${sz(x.gb)} · ${x.cls==='use'?'in use':x.cls==='kept'?'kept':'idle '+x.idle}`}
  if(id==='trees'){ic=gl('trees',SC.trees,15); facts=`${sz(x.gb)} · ${x.x}`}
  if(id==='disk'){ic=`<i style="display:block;width:10px;height:10px;border-radius:3px;background:${SC.disk}"></i>`; facts=`${szs(x.gb)} · ${x.x}`}
  if(x.gone) facts=({agents:'wrapped up',awake:'wrapped up',apps:'quit',servers:'stopped',trees:'in the Trash',disk:'cleaned'})[id]+' just now';
  const right=id==='agents'?holdMarks(x):id==='awake'?`<span class="holds">${x.awake&&!x.sleep&&!x.gone?'holds it awake':'not holding it'}</span>`:ownLink(x);
  return `<div class="in2"><div class="l1">${ic}<span class="t">${x.n}</span><span class="f">${facts}</span>${right}</div>
    <div class="l2">${acts(id,x).map(a=>`<button class="vb${a.pr&&!a.dis?' pr':''}${a.dis?' dis':''}" data-ia="${a.k}" data-k="${x.k}" data-id="${id}"${a.dis?' aria-disabled="true"':''}>${a.label}${a.tail?`<span class="tl">${a.tail}</span>`:''}</button>`).join('')}</div></div>`;
}
function renderRO(){const r=$('ro'); if(r) r.innerHTML=roHTML()}
function marks(){
  document.querySelectorAll('#gw [data-k]').forEach(el=>{el.classList.toggle('hov',el.dataset.k===hov);el.classList.toggle('pin',el.dataset.k===pin)});
  const cc=$('cc'); if(cc) cc.classList.toggle('hv',!!hov);
}
V.after=()=>{renderRO(); marks(); if(pv) applyPV(pv.sid,pv.k)};
V.focus=k=>{pin=k; hov=null; renderRO(); marks()};

/* ---------- preview a section action ---------- */
function applyPV(sid,k){
  const d=$('det');
  if(sid===sel){d.classList.add('pv'); d.classList.toggle('nohi',k==='restore'||k==='hour'); const say=$('say'); if(say){say.innerHTML=planWords(sid,k); say.classList.add('plan')}}
  const it=$('it-'+sid); if(it&&k!=='restore'&&k!=='hour') it.classList.add('pv');
}
function clearPV(){
  pv=null; $('det').classList.remove('pv','nohi');
  document.querySelectorAll('.it.pv').forEach(e=>e.classList.remove('pv'));
  const say=$('say'); if(say){say.innerHTML=sayOf(cur()); say.classList.remove('plan')}
}

document.addEventListener('mouseover',e=>{
  const a=e.target.closest('[data-sa]');
  if(a){ if(!pv||pv.k!==a.dataset.sa||pv.sid!==a.dataset.sid){clearPV(); pv={sid:a.dataset.sid,k:a.dataset.sa}; applyPV(pv.sid,pv.k)} }
  else if(pv) clearPV();
  const g=e.target.closest('#gw [data-k]');
  if(g&&g.dataset.k!==hov){hov=g.dataset.k; renderRO(); marks()}
});
document.addEventListener('mouseout',e=>{
  const zone=e.target.closest&&e.target.closest('#gw,#ro');
  if(!zone) return;
  const to=e.relatedTarget;
  if(to&&to.closest&&to.closest('#gw,#ro')) { if(!to.closest('[data-k]')&&to.closest('#gw')&&hov){hov=null;renderRO();marks()} return }
  if(hov){hov=null; renderRO(); marks()}
});
document.addEventListener('click',e=>{
  if(coreClick(e)) return;
  const sa=e.target.closest('[data-sa]');
  if(sa){ runSection(sa.dataset.sid,sa.dataset.sa); clearPV(); return }
  const ia=e.target.closest('[data-ia]');
  if(ia){ runItem(ia.dataset.id,ia.dataset.ia,ia.dataset.k); return }
  const g=e.target.closest('#gw [data-k]');
  if(g){ pin=pin===g.dataset.k?null:g.dataset.k; renderRO(); marks(); return }
  const it=e.target.closest('.it'); if(it){ pin=null; hov=null; select(it.dataset.s); return }
});
document.addEventListener('keydown',e=>{
  const g=e.target.closest&&e.target.closest('#gw [data-k]');
  if(g&&(e.key==='Enter'||e.key===' ')){e.preventDefault(); pin=g.dataset.k; renderRO(); marks(); return}
  const it=e.target.closest&&e.target.closest('.it'); if(!it) return;
  if(e.key==='Enter'){pin=null;select(it.dataset.s);return}
  const i=S.findIndex(s=>s.id===it.dataset.s);
  const j=e.key==='ArrowDown'?Math.min(S.length-1,i+1):e.key==='ArrowUp'?Math.max(0,i-1):-1;
  if(j<0) return; e.preventDefault(); pin=null; select(S[j].id); $('it-'+S[j].id).focus();
});
boot();

</script>
</body>
</html>
