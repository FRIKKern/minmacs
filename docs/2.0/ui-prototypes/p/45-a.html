<!doctype html>
<html lang="en" data-v="a">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Edge Rail Flow</title>
<!--
  COMPOSITION (45-a, Edge Rail Flow; continues 41-b Corner Drawer Spotlight, made small)

  Sheet 608 x 472 hangs from the menu bar icon of the picked section.
  Rows: header 40 (Today line left, the mode mark right) | body 392 | footer 40 (the lid check).
  Body: an edge rail 16 wide on the left edge, then one pane 552 wide. Base unit 4.
  Type: 20 (headlines), 13 (body), 11 (captions) + ftop numbers 34.

  Rail: six short bars in section colors, nothing else. Bar length is how much that section has to act on
  (GB to free, servers unused, agents working); full color = Auto, half = Ask, gray = Off; a white dot
  beside a bar = something needs you; a bar pulses when something arrives there. Touch the rail and the
  bars slide apart into labels with the live count and mode verb, plus the two global switches.

  Mode mark: header, top right, every tab, says what happens next with a live countdown. Pressing it
  opens the corner drawer from the right (Off / Ask / Auto in plain words, the value ruler, the rule).
  At this size the front cannot sit beside the drawer, so the pane turns into "what this rule touches
  now": the section's items as a short list, lit live as you change the mode or value.

  Servers: a live flow. Servers on the left as pills whose fill is their memory, their workstreams on the right, joined by thin lines. Busy lines carry small dots (requests) flowing to the server; idle lines are dim and still, with a clock chip "40 min of 2 h" that turns into "stops in 2 min" near the rule. :6006 hangs alone with no owner (Auto never stops it, it waits for you); :5432 runs for Docker. Headline right: the unused cost as a big number.
  Workstreams: headline + Wrap Up action -> two ready cards (focal) -> still-going tiles.
  Agents: who waits -> roster -> the one-cell-per-agent strip.  Apps: load ring + noise rows + "Stays" chips.
  Worktrees: big merged number + size columns -> rows.  Disk: zoom on what can come back.
  Live simulation (time 6x), Undo on every action, Keep Awake = one check in the footer.
-->
<style>
:root{
  --glass:rgba(28,29,38,.9);
  --line:rgba(255,255,255,.07);
  --tx:rgba(255,255,255,.94);
  --tx2:rgba(235,235,245,.62);
  --tx3:rgba(235,235,245,.36);
  --g1:rgba(255,255,255,.07);
  --g2:rgba(255,255,255,.18);
  --g3:rgba(255,255,255,.38);
  --rowbg:#2b2b39;
  --ease:cubic-bezier(.3,.7,.2,1);
  --SL:624px; --SW:608px; --SH:472px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#1a1636}
body{font-family:-apple-system,"SF Pro Text",system-ui,sans-serif;color:var(--tx);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;font-size:13px;line-height:18px;cursor:default;user-select:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;text-align:left;line-height:inherit}
b{font-weight:500;color:var(--tx)}
:focus{outline:none}
:focus-visible{outline:2px solid rgba(255,255,255,.55);outline-offset:2px;border-radius:8px}
#stage{position:absolute;left:0;top:0;width:1280px;height:800px;transform-origin:0 0;overflow:hidden;
  background:
   radial-gradient(760px 560px at 10% 6%,#4b3c9e 0%,rgba(75,60,158,0) 70%),
   radial-gradient(700px 520px at 84% 2%,#22618f 0%,rgba(34,97,143,0) 70%),
   radial-gradient(820px 620px at 88% 104%,#a0436f 0%,rgba(160,67,111,0) 70%),
   radial-gradient(640px 520px at 18% 100%,#3a2463 0%,rgba(58,36,99,0) 75%),
   #1d1a3c}

/* menu bar */
.mb{position:absolute;left:0;right:0;top:0;height:26px;display:flex;align-items:center;justify-content:space-between;padding:0 12px 0 16px;background:rgba(18,14,40,.32);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);font-size:13px;color:rgba(255,255,255,.92);z-index:5}
.mb-l,.mb-r{display:flex;align-items:center;gap:18px}
.mb-l b{font-weight:700}
.mb-r{gap:14px}
.icons{position:relative;display:flex;align-items:center;gap:12px}
.hl{position:absolute;top:-3px;left:0;height:22px;width:28px;border-radius:6px;background:rgba(255,255,255,.2);transition:transform .45s var(--ease),opacity .3s;pointer-events:none}
.mi{position:relative;display:flex;width:16px;overflow:visible;cursor:pointer;transition:width .4s var(--ease),opacity .3s,margin .4s var(--ease)}
.mi.off{width:0;opacity:0;margin-left:-12px;overflow:hidden}
.mi .bdg{position:absolute;right:-3px;top:-2px;width:6px;height:6px;border-radius:50%;background:#fff;box-shadow:0 0 0 1.5px rgba(30,26,60,.9)}
#clock{min-width:118px;text-align:right}

/* sheet */
.sheet{position:absolute;top:34px;left:var(--SL);width:var(--SW);height:var(--SH);background:var(--glass);backdrop-filter:blur(36px) saturate(1.5);-webkit-backdrop-filter:blur(36px) saturate(1.5);border:1px solid rgba(255,255,255,.085);border-radius:20px;box-shadow:0 30px 90px rgba(6,4,24,.5),inset 0 1px 0 rgba(255,255,255,.035);animation:drop .6s var(--ease) both}
@keyframes drop{from{opacity:0;transform:translateY(-10px)}}
.clip{position:absolute;inset:0;border-radius:20px;overflow:hidden}
.nub{position:absolute;top:-8px;left:0;width:18px;height:8px;margin-left:-9px;transition:transform .45s var(--ease)}
.nub svg{display:block}
:root{--PL:32px;--PR:24px}
html[data-v="b"]{--PL:24px;--PR:32px}

.head{position:absolute;left:var(--PL);right:var(--PR);top:0;height:44px;display:flex;align-items:center;justify-content:space-between;gap:16px;white-space:nowrap}
.today{flex:1;min-width:0;display:flex;align-items:center;gap:10px;transition:opacity .25s}
.sheet.tst .today{opacity:0}
.today .lbl{flex:none;font-size:11px;color:var(--tx3)}
.today .txt{min-width:0;overflow:hidden;text-overflow:ellipsis;color:var(--tx2);font-size:12px}
.today .undo{flex:none;height:22px;padding:0 9px;border-radius:11px;font-size:11px;font-weight:500;color:var(--tx2);background:var(--g1);transition:background .2s,color .2s}
.today .undo:hover{background:rgba(255,255,255,.13);color:var(--tx)}
#markw{flex:none;transition:opacity .3s}
.sheet.open #markw{opacity:0;pointer-events:none}

.foot{position:absolute;left:var(--PL);right:var(--PR);bottom:0;height:40px;display:flex;align-items:center;justify-content:space-between;gap:16px;border-top:1px solid var(--line);white-space:nowrap}
.lid{display:flex;align-items:center;gap:9px;border-radius:8px;padding:2px 4px;margin:0 -4px}
.lid .cb{flex:none;width:16px;height:16px;border-radius:5px;box-shadow:inset 0 0 0 1.5px var(--g3);display:flex;align-items:center;justify-content:center;transition:background .25s,box-shadow .25s}
.lid .cb svg{opacity:0;transition:opacity .2s}
.lid[aria-checked="true"] .cb{background:#5B9BFF;box-shadow:none}
.lid[aria-checked="true"] .cb svg{opacity:1}
.lid .lt{display:flex;flex-direction:column}
.lid .lv{font-size:11px;line-height:13px;color:var(--tx3)}
.lnote{font-size:11px;line-height:14px;color:var(--tx3);text-align:right;white-space:normal;max-width:236px}

.body{position:absolute;left:0;right:0;top:44px;height:388px}

/* ---------- edge rail ---------- */
.rail{position:absolute;left:0;top:0;bottom:0;width:20px;z-index:7;display:flex;flex-direction:column;justify-content:center;border-radius:0 16px 16px 0;transition:width .38s var(--ease),background .3s,box-shadow .3s}
.rail:hover,.rail:focus-within,.rail.peek{width:212px;background:#252532;box-shadow:20px 0 50px rgba(6,4,24,.4),inset -1px 0 0 rgba(255,255,255,.07)}
.rin{display:flex;flex-direction:column}
.re{position:relative;display:flex;align-items:center;height:26px;padding:0 0 0 7px;white-space:nowrap;overflow:hidden;transition:height .38s var(--ease),background .25s}
.rail:hover .re,.rail:focus-within .re,.rail.peek .re{height:40px}
.rail:hover .re:hover{background:rgba(255,255,255,.04)}
.rmw{position:relative;flex:none;width:5px;height:24px;display:flex;align-items:center}
.rm{display:block;width:3px;border-radius:2px;transition:height .6s var(--ease),background .35s,opacity .35s,width .3s,box-shadow .3s}
.re.sel .rm{width:5px;margin-left:-1px;box-shadow:0 0 10px color-mix(in srgb,var(--c) 70%,transparent)}
.rd{position:absolute;left:7px;top:1px;width:5px;height:5px;border-radius:50%;background:#fff;box-shadow:0 0 6px rgba(255,255,255,.7)}
.rm.nwr{animation:rpulse 1.4s var(--ease) 2}
@keyframes rpulse{40%{box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 35%,transparent),0 0 12px var(--c)}}
.rl{flex:1;min-width:0;display:flex;flex-direction:column;margin-left:16px;opacity:0;transform:translateX(-6px);transition:opacity .2s,transform .3s var(--ease)}
.rail:hover .rl,.rail:focus-within .rl,.rail.peek .rl{opacity:1;transform:none;transition-delay:.08s}
.rn{font-size:15px;line-height:19px;font-weight:600;letter-spacing:-.01em;color:var(--tx2)}
.re.sel .rn{color:var(--tx)}
.rc{font-size:11px;line-height:14px;color:var(--tx3)}
.rg{position:absolute;left:22px;right:16px;bottom:14px;display:flex;flex-direction:column;gap:8px;padding-top:12px;border-top:1px solid var(--line);opacity:0;pointer-events:none;transition:opacity .2s}
.rail:hover .rg,.rail:focus-within .rg,.rail.peek .rg{opacity:1;pointer-events:auto;transition-delay:.12s}
.sw{display:flex;align-items:center;justify-content:space-between;font-size:11px;color:var(--tx2);white-space:nowrap}
.sw i{width:26px;height:16px;border-radius:8px;background:rgba(255,255,255,.14);position:relative;transition:background .25s;flex:none}
.sw i::after{content:"";position:absolute;left:2px;top:2px;width:12px;height:12px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .25s var(--ease)}
.sw[aria-checked="true"]{color:var(--tx)}
.sw[aria-checked="true"] i{background:#5B9BFF}
.sw[aria-checked="true"] i::after{transform:translateX(10px)}
html[data-v="b"] .rail{left:auto;right:0;border-radius:16px 0 0 16px}
html[data-v="b"] .rail:hover,html[data-v="b"] .rail:focus-within,.rail.peek{box-shadow:-20px 0 50px rgba(6,4,24,.4),inset 1px 0 0 rgba(255,255,255,.07)}
html[data-v="b"] .re{flex-direction:row-reverse;padding:0 7px 0 0}
html[data-v="b"] .rl{margin:0 0 0 16px;padding-left:4px;transform:translateX(6px)}
html[data-v="b"] .rail:hover .rl,html[data-v="b"] .rail.peek .rl{transform:none}
html[data-v="b"] .rd{left:-7px}
html[data-v="b"] .rg{left:20px;right:22px}

/* ---------- pane ---------- */
.pane{position:absolute;left:var(--PL);right:var(--PR);top:0;height:388px}
.pin{position:absolute;inset:0;transition:opacity .2s,transform .35s var(--ease)}
.pin.swap{opacity:0;transform:translateY(6px)}
.f{position:absolute;inset:0;display:flex;flex-direction:column;padding:4px 0 12px}

.mark{display:flex;flex-direction:column;align-items:flex-end;padding:3px 10px 4px;margin-right:-10px;border-radius:11px;font-size:11px;line-height:14px;color:var(--tx2);white-space:nowrap;transition:background .25s,color .25s}
.mark:hover{background:var(--g1);color:var(--tx)}
.mark .m1{display:flex;align-items:center;gap:7px;height:16px}
.mark .m1 b{font-weight:500}
.mark .m2{color:var(--tx3)}
.pips{display:flex;gap:3px}
.pips i{width:5px;height:5px;border-radius:50%;background:var(--g2)}
.mark .mv{color:var(--tx3)}
.mark svg{opacity:.5;transition:transform .3s var(--ease)}
.mark:hover svg{transform:translateX(2px);opacity:.8}

.hrow{display:flex;align-items:flex-end;justify-content:space-between;gap:16px}
.hd{font-size:20px;line-height:26px;font-weight:600;letter-spacing:-.016em;color:var(--tx);white-space:nowrap}
.hd .s{color:var(--tx3)}
.cap{font-size:11px;line-height:14px;color:var(--tx3);white-space:nowrap}
.cap b{color:var(--tx2);font-weight:500}
.big{font-size:34px;line-height:38px;font-weight:500;letter-spacing:-.01em;white-space:nowrap}
.big u{text-decoration:none;font-size:13px;font-weight:400;color:var(--tx3);margin-left:4px;letter-spacing:0}

.btn{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 13px;border-radius:15px;background:var(--g1);font-size:13px;font-weight:500;white-space:nowrap;transition:background .2s,opacity .3s}
.btn:hover{background:rgba(255,255,255,.14)}
.btn .tl{font-weight:400;color:var(--tx3)}
.btn.pri{background:color-mix(in srgb,var(--c) 24%,transparent)}
.btn.pri:hover{background:color-mix(in srgb,var(--c) 36%,transparent)}
.btn.pri .tl{color:rgba(255,255,255,.55)}
.btn[disabled]{opacity:.35;pointer-events:none}

/* rows */
.rw{position:relative;display:flex;align-items:center;gap:10px;height:30px;margin:0 -8px;padding:0 8px;border-radius:8px;white-space:nowrap;transition:height .4s var(--ease),opacity .32s,background .25s}
.rw:hover{background:var(--rowbg)}
.rw.leave,.fc.leave{height:0!important;opacity:0;pointer-events:none;margin-top:0}
.rw .ic{flex:none;display:flex;width:18px;justify-content:center}
.rw .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.rw .nm .x{color:var(--tx3)}
.rw .v{flex:none;width:58px;text-align:right;color:var(--tx2)}
.rw .v2{flex:none;width:40px;text-align:right;color:var(--tx3)}
.rw .st{flex:none;text-align:right;color:var(--tx3)}
.rw.dim .nm{color:var(--tx2)}
.meta{display:flex;align-items:center;gap:10px;transition:opacity .2s}
.lk{color:var(--tx2);cursor:pointer;border-bottom:1px solid rgba(255,255,255,.14);transition:color .2s,border-color .2s}
.lk:hover{color:var(--tx);border-color:rgba(255,255,255,.5)}
.acts{position:absolute;right:0;top:0;bottom:0;display:flex;align-items:center;gap:4px;padding:0 4px 0 32px;background:linear-gradient(90deg,rgba(43,43,57,0),var(--rowbg) 28px);opacity:0;transform:translateX(8px);pointer-events:none;transition:opacity .2s,transform .3s var(--ease);border-radius:0 8px 8px 0}
.rw:hover .acts,.rw:focus-within .acts{opacity:1;transform:none;pointer-events:auto}
.rw:hover .meta,.rw:focus-within .meta{opacity:0}
.ab{height:22px;padding:0 9px;border-radius:11px;background:rgba(255,255,255,.08);font-size:11px;font-weight:500;white-space:nowrap;display:inline-flex;align-items:center;gap:5px;transition:background .2s}
.ab:hover{background:rgba(255,255,255,.17)}
.ab .tl{font-weight:400;color:var(--tx3)}
.ab.dis{background:none;color:var(--tx3);cursor:default;font-weight:400;padding:0 4px}
.ab.dis .tl{color:rgba(235,235,245,.24)}

/* live */
.newp{display:inline-block;margin-left:6px;padding:0 6px;height:16px;line-height:16px;border-radius:8px;font-size:10px;font-weight:600;letter-spacing:.02em;color:#fff;background:color-mix(in srgb,var(--c) 45%,transparent);vertical-align:1px}
.nw{animation:arrive 5s var(--ease)}
@keyframes arrive{0%{opacity:0;transform:translateY(-6px);background:color-mix(in srgb,var(--c) 26%,transparent)}10%{opacity:1;transform:none;background:color-mix(in srgb,var(--c) 22%,transparent)}100%{background:rgba(0,0,0,0)}}
.nwc{animation:arriveC 5s var(--ease)}
@keyframes arriveC{0%{opacity:0;transform:scale(.6)}10%{opacity:1;transform:none;box-shadow:0 0 0 2px rgba(255,255,255,.8),0 0 16px var(--c)}100%{box-shadow:0 0 0 0 rgba(255,255,255,0)}}
.fin{background:rgba(255,255,255,.06)}

/* setting marks: lit while the drawer is open */
.rw::before{content:"";position:absolute;left:-6px;top:50%;width:6px;height:6px;margin-top:-3px;border-radius:50%;opacity:0;transform:scale(.4);transition:opacity .3s,transform .35s var(--ease),background .3s,box-shadow .3s}
.setv .aff.rw::before{opacity:1;transform:none}
.setv .aff.ma.rw::before{background:var(--c)}
.setv .aff.mq.rw::before{box-shadow:inset 0 0 0 1.5px var(--c)}
.setv [data-t]:not(.aff){opacity:.42}
.setv .aff.rw{background:color-mix(in srgb,var(--c) 11%,transparent)}
.setv .aff.mq.rw{background:color-mix(in srgb,var(--c) 6%,transparent)}
.setv .aff .nm{color:var(--tx)}
[data-t]{transition:opacity .35s,height .4s var(--ease),background .25s,box-shadow .35s,flex-grow .55s var(--ease)}

/* plan: hovering a section action lights what it touches */
.plan [data-t]:not(.hit){opacity:.22}
.plan .rw.hit{background:color-mix(in srgb,var(--c) 15%,transparent)}
.plan i.hit,.plan .pill.hit,.plan .sat.hit,.plan .wc.hit,.plan .chp.hit{box-shadow:0 0 0 1.5px rgba(255,255,255,.75),0 0 14px var(--c)!important}

/* ---------- Workstreams ---------- */
.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.wc{position:relative;display:flex;flex-direction:column;min-width:0;padding:12px 14px 12px;border-radius:16px;background:rgba(255,255,255,.045);box-shadow:inset 0 0 0 1px rgba(255,255,255,.06);transition:opacity .35s,transform .4s var(--ease),box-shadow .35s,background .25s}
.wc:hover{background:rgba(255,255,255,.06)}
.wc.leave{opacity:0;transform:scale(.96)}
.wc-h{display:flex;align-items:center;gap:10px}
.wc-h .ic{flex:none;width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.06)}
.wc-t{flex:1;min-width:0;display:flex;flex-direction:column;white-space:nowrap;overflow:hidden}
.wc-t b{font-weight:600;overflow:hidden;text-overflow:ellipsis}
.wc-t .x{font-size:11px;line-height:14px;color:var(--tx3);overflow:hidden;text-overflow:ellipsis}
.wc-s{flex:none;font-size:11px;font-weight:600;color:var(--c);display:flex;align-items:center;gap:6px}
.wc-s i{width:6px;height:6px;border-radius:50%;background:var(--c)}
.wc-l{margin-top:8px;display:flex;flex-direction:column}
.wc-r{display:flex;align-items:center;gap:9px;height:21px;white-space:nowrap;font-size:12px}
.wc-r .gi{flex:none;width:14px;display:flex;justify-content:center}
.wc-r .tx{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.wc-r .tx .dt{color:var(--tx3)}
.wc-r .vv{flex:none;color:var(--tx2)}
.wc-f{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:auto;padding-top:10px;white-space:nowrap}
.wc-f .cap{overflow:hidden;text-overflow:ellipsis}
.wc .btn.pri{height:26px;padding:0 11px;font-size:12px}
.wc.kept{opacity:.6}
.calm2{grid-column:1/-1;height:150px;display:flex;align-items:center;justify-content:center;border-radius:16px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06);color:var(--tx3)}
.sp-h2{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-top:14px;white-space:nowrap}
.sp-h2 .nows2{min-width:0;font-size:11px;line-height:14px;color:var(--tx3);overflow:hidden;text-overflow:ellipsis}
.sp-h2 .nows2 .lk{color:var(--tx2)}
.sp-h2 .cap b{color:var(--tx)}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}
.tiles>*{min-width:0}
.tl2{position:relative;display:flex;flex-direction:column;justify-content:center;height:50px;padding:0 10px;border-radius:12px;background:rgba(255,255,255,.03);transition:background .25s,opacity .35s,transform .4s var(--ease)}
.tl2:hover{background:var(--rowbg)}
.tl2.leave{opacity:0;transform:scale(.92)}
.tl2 .t1{display:flex;align-items:center;gap:7px;white-space:nowrap;min-width:0}
.tl2 .t1 .ic{flex:none;display:flex}
.tl2 .t1 .n{font-weight:500;overflow:hidden;text-overflow:ellipsis;min-width:0}
.tl2 .t2{margin-top:1px;font-size:11px;line-height:14px;color:var(--tx3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-left:21px}
.tl2 .t3{margin-top:2px;display:flex;align-items:center;gap:7px;padding-left:21px;font-size:11px;line-height:14px;color:var(--tx3);white-space:nowrap;overflow:hidden}
.tl2 .t3 span{display:flex;align-items:center;gap:3px}
.tl2.fin{background:rgba(255,255,255,.07)}
.tl2 .newp{flex:none}
.flash{background:color-mix(in srgb,var(--c) 18%,transparent)!important}

/* ---------- Agents ---------- */
.focus{margin-top:12px}
.fc{position:relative;display:flex;align-items:center;gap:12px;height:52px;margin:0 -10px;padding:0 10px;border-radius:14px;transition:background .25s,opacity .35s,height .4s var(--ease)}
.fc:hover{background:rgba(255,255,255,.04)}
.fc+.fc{margin-top:4px}
.fc .fi{flex:none;width:28px;height:28px;display:flex;align-items:center;justify-content:center;border-radius:50%;position:relative}
.fc .fi svg{width:24px;height:24px}
.fc .fi .pulse{position:absolute;right:-1px;top:-1px;width:8px;height:8px;border-radius:50%;background:#fff;box-shadow:0 0 0 2px #23232f}
.fc .ft{flex:1;min-width:0;overflow:hidden}
.fc .fn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fc .fn b{font-weight:600}
.fc .fs{font-size:11px;line-height:14px;color:var(--tx3);white-space:nowrap;margin-top:2px;overflow:hidden;text-overflow:ellipsis}

const A=(a,l,tl,dis,id)=>({a,l,tl,dis,id});
function acts(kind,o){
  if(kind==='ws'){
    const r=[], sv=wsSrv(o);
    if(o.st==='r') r.push(A('wrapws','Wrap Up',fmt(wsFree(o))));
    else r.push(A('','Wrap Up',o.id==='ws-med'&&TESTS?'tests running':o.block,1));
    if(o.ag&&!gone(o.ag)) r.push(A('nav','Go to Tab','',0,o.ag));
    if(o.pr) r.push(A('openpr','Open PR',o.st==='r'?'#'+o.pr.n:''));
    if(sv.length&&o.st!=='r') r.push(A('stopws','Stop Servers',fmt(wsMem(o))));
    if(o.st==='r'&&!has(o.id,'keep')) r.push(A('keep','Keep'));
    if(wsTree(o)) r.push(A('editor','Open in Editor'));
    return r;
  }
  if(kind==='agent'){
    const r=[];
    if(o.st==='f') r.push(A('wrap','Wrap Up',fmt(agHeld(o.id))));
    r.push(A('nav','Go to Tab'));
    if(o.ws) r.push(A('gows','Workstream','',0,o.ws));
    if(o.st!=='f'&&agServers(o.id).length) r.push(A('stopall','Stop Its Servers'));
    return r;
  }
  if(kind==='app'){
    if(o.cls==='spared') return [A('','Quit','Playwright drives it',1)];
    const r=[A('quit','Quit',fmt(memOf(o)))];
    if(o.id==='chrome'&&!has('chrome','trim')) r.push(A('trim','Trim Tabs','14'));
    if(isNoise(o)) r.push(A('keep','Keep'));
    else if(o.cls==='unsorted') r.push(A('list','Move to Close List'));
    return r;
  }
  if(kind==='srv'){
    if(o.kept) return [A('open','Open in Browser'),A('','Stop','Docker runs it',1)];
    const r=[A('stop','Stop',fmt(o.mb/1000)),A('open','Open in Browser')];
    if(o.ws) r.push(A('gows','Workstream',byId[o.ws].n,0,o.ws));
    if(o.idle&&!has(o.id,'keep')) r.push(A('keep','Keep'));
    return r;
  }
  if(kind==='wt'){
    if(o.id==='wt-bp7') return [A('','Remove','1 commit not in main',1),A('commit','Show Commit'),A('editor','Open in Editor')];
    if(o.k==='u'||o.k==='f') return [A('finder','Show in Finder'),A('editor','Open in Editor')].concat(o.ws?[A('gows','Workstream',byId[o.ws].n,0,o.ws)]:[]);
    const r=[A('rmtree','Remove',o.id==='wt-bp8'?'bundle saved':fmt(o.gb)),A('finder','Show in Finder')];
    if(o.ws) r.push(A('gows','Workstream','',0,o.ws));
    if(o.k==='m'&&!has(o.id,'keep')) r.push(A('keep','Keep'));
    return r;
  }
  if(kind==='dk'){
    if(o.rep) return [A('finder','Show in Finder'),A('','Clean','report only',1)];
    const r=[A('clean','Clean',fmt(o.gb))];
    if(o.safe&&!has(o.id,'keep')) r.push(A('keep','Keep'));
    r.push(A('finder','Show in Finder'));
    return r;
  }
  return [];
}

    stopall:()=>{const s=agServers(id);return [`Stopped ${s.map(x=>'<b>'+x.p+'</b>').join(' and ')} for ${name}.`,()=>s.forEach(x=>fl(x.id).gone=1),s.map(x=>x.id)]},
    wrap:()=>{const w=byId[o.ws];return [wrapMsg(w),()=>wrapWs(w.id),wsLeave(w).concat([id])]},
    wrapws:()=>[wrapMsg(o),()=>wrapWs(id),wsLeave(o)],
    stopws:()=>{const s=wsSrv(o);return [`Stopped ${s.map(x=>'<b>'+x.p+'</b>').join(' and ')} for ${o.n}, freed ${fmt(wsMem(o))}.`,()=>s.forEach(x=>fl(x.id).gone=1),s.map(x=>x.id)]}

/* ---------- live DOM: patch in place when only numbers and timers moved, else ease-swap ---------- */
function swap(el,html){
  const old={};el.querySelectorAll('[data-a]').forEach(n=>old[n.dataset.a]=n.getAttribute('style')||'');
  const oldN={};el.querySelectorAll('[data-n]').forEach(n=>oldN[n.dataset.n]=+n.dataset.v);
  el.innerHTML=html;
  if(RM) return;
  const todo=[];
  el.querySelectorAll('[data-a]').forEach(n=>{const k=n.dataset.a;if(k in old){const nu=n.getAttribute('style')||'';if(nu!==old[k]){n.setAttribute('style',old[k]+';transition:none');todo.push([n,nu])}}});
  if(todo.length){el.offsetWidth;todo.forEach(([n,nu])=>n.setAttribute('style',nu))}
  el.querySelectorAll('[data-n]').forEach(n=>{const k=n.dataset.n;if(k in oldN&&oldN[k]!==+n.dataset.v)tween(n,oldN[k],+n.dataset.v,+n.dataset.d||0)});
}
function tween(n,a,b,d){const t0=performance.now(),D=700;const st=t=>{const p=Math.min(1,(t-t0)/D),e=1-Math.pow(1-p,3);n.textContent=(a+(b-a)*e).toFixed(d);if(p<1)setTimeout(()=>st(performance.now()),16);else n.textContent=n.dataset.txt||b.toFixed(d)};setTimeout(()=>st(performance.now()),16)}
const num=(k,v,d,txt)=>`<span data-n="${k}" data-v="${v}" data-d="${d||0}" data-txt="${txt||''}">${txt||v.toFixed(d||0)}</span>`;
const gnum=(k,gb)=>{const t=fN(gb),u=fU(gb);return `${num(k,u==='MB'?Math.round(gb*1000):gb,u==='MB'?0:(t.split('.')[1]||'').length,t)}<u>${u}</u>`};
const tk=(txt,cls,style)=>`<span data-tk${cls?` class="${cls}"`:''}${style?` style="${style}"`:''}>${txt}</span>`;
const SWAPS={n:0};
function sig(h){return h.replace(/ style="[^"]*"/g,'').replace(/ data-(v|txt)="[^"]*"/g,'').replace(/(<[^>]+data-(?:tk|n)[ =>][^>]*>)[^<]*/g,'$1')}
function put(el,html,force){
  const s=sig(html);
  if(!force&&el._sig===s){patch(el,html);return false}
  el._sig=s; SWAPS.n++; swap(el,html); return true;
}
function patch(el,html){
  const tmp=document.createElement('div');tmp.innerHTML=html;
  const a=el.querySelectorAll('*'),b=tmp.querySelectorAll('*');
  if(a.length!==b.length){el._sig=null;put(el,html,true);return}
  for(let i=0;i<b.length;i++){
    const o=a[i],n=b[i];
    const ns=n.getAttribute('style'),os=o.getAttribute('style');
    if(ns!==os){if(ns===null)o.removeAttribute('style');else o.setAttribute('style',ns)}
    if(n.hasAttribute('data-tk')&&o.innerHTML!==n.innerHTML) o.innerHTML=n.innerHTML;
    if(n.hasAttribute('data-n')){const x=+o.dataset.v,y=+n.dataset.v;o.dataset.txt=n.dataset.txt;if(x!==y){o.dataset.v=y;if(RM)o.textContent=n.textContent;else tween(o,x,y,+n.dataset.d||0)}}
  }
}

function idxNum(s){
  const v=(a,u)=>({v:a,u});

  if(s.id==='ws'){const g=sum(ready(),wsFree);r=g?v(fN(g),fU(g)):v(String(going().length),'going')}
  if(s.id==='agents'){const n=waiting().length;r=n?v(String(n),'waits'):v(String(holders().length),'working')}
  if(s.id==='apps'){const g=sum(noise(),memOf);r=g?v(fN(g),fU(g)):v('0','GB')}
  if(s.id==='servers') r=v(String(idleSrv().length),'unused');
  if(s.id==='trees'){const g=sum(merged(),w=>w.gb);r=g?v(fN(g),fU(g)):v('0','GB')}
  if(s.id==='disk'){const g=sum(safeDK(),d=>d.gb);r=g?v(fN(g),fU(g)):v('0','GB')}
  r.cap=s.mode?s.verb[s.mode]:'Off';
  return r;
}
function railMag(s){
  if(s.id==='ws') return Math.min(1,sum(ready(),wsFree)/5);
  if(s.id==='agents') return Math.min(1,holders().length/7);
  if(s.id==='apps') return Math.min(1,sum(noise(),memOf)/10);
  if(s.id==='servers') return Math.min(1,idleSrv().length/4);
  if(s.id==='trees') return Math.min(1,sum(merged(),w=>w.gb)/6);
  if(s.id==='disk') return Math.min(1,sum(safeDK(),d=>d.gb)/32);
  return 0;
}
function railDot(s){

  const CX=276,CY=140,RO=[118,62],RS=[186,110];

  const L=live(SRV);
  const s3=L.filter(x=>x.ws==='ws-s3');
  const ang=x=>x.ws==='ws-s3'?180+(s3.indexOf(x)-(s3.length-1)/2)*19:SANG[x.id];
  const owners=new Set(L.map(ownerOf).filter(Boolean));
  let lines='',dots='',sats='',labs='',ows='';
  L.forEach(x=>{
    const p=pos(RS,ang(x)),st=sState(x),k=ownerOf(x),r=Math.round(5+Math.sqrt(x.mb/640)*8);
    if(k){const o=pos(RO,OANG[k]);
      lines+=`<line data-t="${x.id}" x1="${o.x}" y1="${o.y}" x2="${p.x}" y2="${p.y}" stroke="${st==='busy'?'rgba(255,255,255,.3)':'rgba(255,255,255,.1)'}" stroke-width="${st==='busy'?1.3:1}"/>`;
      if(st==='busy'){const[n,du]=DOTS[x.id]||[2,2],d=`M${o.x.toFixed(1)} ${o.y.toFixed(1)} L${p.x.toFixed(1)} ${p.y.toFixed(1)}`;for(let j=0;j<n;j++)dots+=`<i class="fd" style="offset-path:path('${d}');animation-duration:${du*.8}s;animation-delay:${(-j*du*.8/n).toFixed(2)}s;--o:${Math.round((j+.5)/n*100)}%"></i>`}}
    const w=st==='idle'?idleWords(x):null;
    sats+=`<div class="sat ${st}${isNew(x.id)?' nwc':''}" data-a="st${x.id}" data-t="${x.id}" data-leave="${x.id}" data-card="srv:${x.id}" style="left:${p.x}px;top:${p.y}px;width:${r*2}px;height:${r*2}px;--c:${C.servers}">${w?`<svg width="${r*2+10}" height="${r*2+10}"><circle cx="${r+5}" cy="${r+5}" r="${r+4}" stroke="var(--g1)" stroke-width="2"/><circle cx="${r+5}" cy="${r+5}" r="${r+4}" stroke="${C.servers}" stroke-width="2" stroke-linecap="round" pathLength="100" style="stroke-dasharray:100 100;stroke-dashoffset:${100-w[1]*100}"/></svg>`:''}</div>`;
    const l2=st==='busy'?fmt(x.mb/1000):st==='kept'?'kept · '+(x.o||'by you'):w[0];
    const l1=st==='busy'?`<b>${x.p}</b>`:`<b>${x.p}</b> ${fmt(x.mb/1000)}`;
    let side=p.c<-.35?'l':p.c>.35?'r':p.s<0?'t':'b'; if(x.id==='s4000') side='t';
    const g=r+(w?9:7);
    const pl=side==='l'?`left:${p.x-g}px;top:${p.y}px;transform:translate(-100%,-50%);text-align:right`:side==='r'?`left:${p.x+g}px;top:${p.y}px;transform:translate(0,-50%)`:side==='t'?`left:${p.x}px;top:${p.y-g}px;transform:translate(-50%,-100%);text-align:center`:`left:${p.x}px;top:${p.y+g}px;transform:translate(-50%,0);text-align:center`;
    labs+=`<span class="slab" data-a="sl${x.id}" style="${pl};--c:${C.servers}">${l1}<br>${tk(l2,w&&w[2]?'cd':'')}</span>`;
  });
  owners.forEach(k=>{const o=pos(RO,OANG[k]),inf=ownerInfo(k);
    ows+=`<div class="ow2" ${inf.card?`data-card="${inf.card}"`:''} style="left:${o.x}px;top:${o.y}px">${inf.ic}</div>`;
    const side=k==='docker'||(o.s<-.3&&o.c<0)?'l':o.s<-.3?'r':'b';
    const pl=side==='l'?`left:${o.x-19}px;top:${o.y}px;transform:translate(-100%,-50%);text-align:right`:side==='r'?`left:${o.x+19}px;top:${o.y}px;transform:translate(0,-50%)`:`left:${o.x}px;top:${o.y+17}px;transform:translateX(-50%);text-align:center`;
    labs+=`<span class="olab" style="${pl}">${inf.n}</span>`});
  const i=idleSrv(),tot=sum(L,x=>x.mb/1000),idg=sum(i,x=>x.mb/1000);
  const ctr=`<div class="ctr2" style="left:${CX}px;top:${CY}px"><span class="big">${gnum('stot',tot)}</span><span class="cap">in ${L.length} servers</span>${tk(idg?fmt(idg)+' unused':'none unused','cap','color:'+C.servers)}</div>`;
  return `<div class="f" style="--c:${C.servers}">
    <div class="hrow"><p class="hd">${srvHead()}</p>${saBtn('idle',1)}</div>
    <div class="orb"><svg class="ln" width="552" height="290"><ellipse cx="${CX}" cy="${CY}" rx="${RO[0]}" ry="${RO[1]}" fill="none" stroke="rgba(255,255,255,.06)" stroke-dasharray="2 4"/>${lines}</svg>${dots}${ctr}${sats}${ows}${labs}</div>
    <div class="sfoot"><p class="cap" style="max-width:none">${tk(nb('Dots are requests. A still line is unused; its ring fills toward '+sec('servers').vals[sec('servers').v]+'. '+srvRule()))}</p></div>
  </div>`;
}
const fServers=()=>VAR==='b'?fServersOrbit():fServersFlow();

function fTrees(){
  const m=merged(),mg=sum(m,w=>w.gb);
  const order=['m','s','u','f'];
  const fill=w=>w.k==='m'?(has(w.id,'keep')?'var(--g3)':C.trees):w.k==='s'?'':w.k==='u'?'rgba(255,255,255,.3)':'rgba(255,255,255,.12)';
  const cols=order.map((k,gi)=>WT.filter(w=>w.k===k).map(w=>`<i data-a="c${w.id}" data-t="${w.id}" data-card="wt:${w.id}" class="${w.k==='s'?'hatch ':''}${gone(w.id)?'z':''}" style="height:${gone(w.id)?0:8+w.gb/3.2*94}px;background:${fill(w)}"></i>`).join('')+(gi<3?'<span class="gap"></span>':'')).join('');
  const stale=WT.filter(w=>w.k==='s'&&!gone(w.id));
  const rows=[...WT.filter(w=>w.k==='m'&&!gone(w.id)),...stale].map(w=>`<div class="rw${w.k==='s'||has(w.id,'keep')?' dim':''}" data-t="${w.id}" data-leave="${w.id}" style="--c:${C.trees}"><span class="ic">${gl('trees',w.k==='m'?C.trees:'rgba(235,235,245,.4)',14)}</span><span class="nm">${w.n}${w.ws&&byId[w.ws].n!==w.n?`<span class="x"> · ${lk(w.ws)}</span>`:''}</span><span class="meta"><span class="st" style="${w.id==='wt-bp7'?'color:var(--tx2)':''}">${has(w.id,'keep')?'kept':w.why}${w.srv&&!gone(w.srv)?' · '+byId[w.srv].p:''}</span>${tk(shortIdle(treeAge(w)),'v2')}<span class="v">${fmt(w.gb)}</span></span>${actsHTML('wt',w)}</div>`).join('');

      <div class="sky"><div class="cols">${cols}</div>

    <div class="rows r-trees">${rows}</div>
    <div class="dfoot">${tk(s.mode===1?'Height is size. Nothing is removed until you press.':s.mode===2?(n?'Next: Auto removes '+n.o.n+' in '+durC(n.m)+'.':''):'Height is size.','cap')}${saBtn('merged',1)}</div>
  </div>`;
}
function fDisk(){
  const H=228,D=994,used=812,full=38.4,s=sec('disk');
  let y=H; const seg=[];
  DK.forEach(d=>{const h=gone(d.id)?0:d.gb/full*H;y-=h;seg.push({d,top:y,h})});
  const rem=sum(DK.filter(d=>!gone(d.id)),d=>d.gb);
  const usedNow=used-(full-rem);
  const uh=usedNow/D*H, sh=rem/D*H, ut=H-uh;
  const colr=d=>d.rep?'rgba(255,255,255,.22)':d.safe&&!has(d.id,'keep')?C.disk:'color-mix(in srgb,'+C.disk+' 38%,transparent)';
  const disk=`<div class="col" style="left:0"><i data-a="du" style="top:${ut+sh}px;height:${uh-sh}px;background:var(--g2)"></i><i data-a="dr" style="top:${ut}px;height:${Math.max(sh,0)}px;background:${C.disk}"></i></div>`;
  const zt=seg.length?Math.min(...seg.map(s=>s.top)):H;
  const wedge=`<svg class="wedge" width="64" height="${H}" viewBox="0 0 64 ${H}"><path d="M0 ${ut} L64 ${zt} L64 ${H} L0 ${ut+sh} Z" fill="${C.disk}" opacity=".08"/><path d="M0 ${ut}L64 ${zt}M0 ${ut+sh}L64 ${H}" stroke="${C.disk}" stroke-opacity=".25" fill="none"/></svg>`;
  const zoom=`<div class="col" style="left:108px">${seg.map(s=>`<i data-a="z${s.d.id}" data-t="${s.d.id}" style="top:${s.top+1}px;height:${Math.max(0,s.h-2)}px;background:${colr(s.d)}"></i>`).join('')}</div>`;
  const Lb=seg.filter(s=>!gone(s.d.id)).map(s=>({s,c:s.top+s.h/2})).sort((a,b)=>a.c-b.c);
  const LH=38; let last=-1e9;
  Lb.forEach(l=>{l.y=Math.max(l.c-LH/2,last+LH);last=l.y});
  const over=Lb.length?Lb[Lb.length-1].y+LH-H:0; if(over>0) Lb.forEach(l=>l.y-=over);
  for(let i=Lb.length-2;i>=0;i--) if(Lb[i].y>Lb[i+1].y-LH) Lb[i].y=Lb[i+1].y-LH;
  const leads=`<svg class="leads" width="24" height="${H}" viewBox="0 0 24 ${H}">${Lb.map(l=>`<path d="M0 ${l.c}H6L18 ${l.y+19}H24" fill="none" stroke="rgba(255,255,255,.16)"/>`).join('')}</svg>`;

  const sf=sum(safeDK(),d=>d.gb),n=nextAuto(s);
  return `<div class="f" style="--c:${C.disk}">
    <p class="hd">${nb(rem?`${fmt(rem)} you can get back.<br><span class="s">${sf?fmt(sf)+' of it is safe.':'None of it is marked safe.'}</span>`:`Nothing left to clean.<br><span class="s">${fmt(D-usedNow)} free.</span>`)}</p>
    <div class="zoom">${disk}${wedge}${zoom}${labs}</div>
    <div class="zcap"><span class="cap"><b>${Math.round(usedNow)}</b> / 994 GB</span><span class="cap">zoom on <b>${rem?fmt(rem):'0 GB'}</b> · solid is safe</span></div>
    <div class="dfoot dk">${tk(s.mode===2&&n?'Or Auto cleans it '+(s.v===0?'tonight':s.v===1?'on Sunday':'on 1 Nov')+', in '+dur(n.m)+'.':s.mode===1?'Nothing happens until you press.':'','cap')}${saBtn('safe',1)}</div>
  </div>`;

const FRONT={ws:fWS,agents:fAgents,apps:fApps,servers:fServers,trees:fTrees,disk:fDisk};

/* ---------- touch list: what the open rule touches now (beside the drawer) ---------- */
function touchRows(s){
  const t=thr(s),au=s.mode===2;
  const when=(left,sp)=>!s.mode?'':sp?'you undid it':left<=0?(au?'now':'has a button'):'in '+durC(left);
  if(s.id==='ws') return [...WS.filter(w=>w.st==='r'&&!gone(w.id)).map(w=>({id:w.id,ic:w.ag?ICON[byId[w.ag].t]:gl('ws','rgba(235,235,245,.5)',15),n:w.n,x:has(w.id,'keep')?'kept':'PR merged '+dur(mergedAgo(w))+' ago',tm:has(w.id,'keep')?'kept':when(t-mergedAgo(w),has(w.id,'spared')),v:fmt(wsFree(w))})),
    ...going().map(w=>({id:w.id,ic:ICON[byId[w.ag].t],n:w.n,x:w.st==='n'?'needs you':w.st==='i'?'idle, PR not merged':'still working',tm:'stays',v:''}))];
  if(s.id==='agents') return named().map(a=>({id:a.id,ic:ICON[a.t],n:a.n,x:a.st==='n'?'asks “'+a.q+'”':a.st==='f'?'finished':a.st==='i'?'idle '+dur(age(a)):'working',tm:a.st==='n'?when(t-age(a)):'',v:a.st==='n'?dur(age(a)):''}));
  if(s.id==='apps') return APPS.filter(a=>!gone(a.id)).map(a=>({id:a.id,ic:ICON[a.ic],n:a.n,x:isNoise(a)?'noise':a.cls==='unsorted'?'not sorted':a.cls==='spared'?'Playwright drives it':'essential',tm:isNoise(a)&&s.mode?(au?'at '+s.vals[s.v]:'has a button'):'stays',v:fmt(memOf(a))}));
  if(s.id==='servers') return srvRows().map(x=>{const st=sState(x);return {id:x.id,ic:gl('servers',st==='idle'?C.servers:'rgba(235,235,245,.4)',14),n:x.p+' '+x.k,x:st==='busy'?'in use · '+(x.ws?byId[x.ws].n:''):st==='kept'?'kept, '+(x.o||'you kept it'):'unused '+dur(idleOf(x))+(x.ws?' · '+byId[x.ws].n:' · no owner'),
    tm:st!=='idle'?'stays':!x.ws&&au?'waits for you':when(t-idleOf(x),has(x.id,'spared')),v:fmt(x.mb/1000)}});
  if(s.id==='trees') return WT.filter(w=>(w.k==='m'||w.k==='s')&&!gone(w.id)).map(w=>({id:w.id,ic:gl('trees',w.k==='m'?C.trees:'rgba(235,235,245,.4)',14),n:w.n,x:w.k==='m'?'merged '+dur(treeAge(w))+' ago':'stale, '+w.why,tm:w.k==='m'&&!has(w.id,'keep')?when(t-treeAge(w),has(w.id,'spared')):'stays',v:fmt(w.gb)}));
  if(s.id==='disk') return DK.filter(d=>!gone(d.id)).map(d=>({id:d.id,ic:gl('disk',d.safe?C.disk:'rgba(235,235,245,.4)',14),n:d.n,x:d.x,tm:d.safe&&!has(d.id,'keep')&&s.mode?(au?(s.v===0?'tonight':s.v===1?'Sunday':'1 Nov'):'has a button'):'stays',v:fmt(d.gb)}));
  return [];
}
function fTouch(){
  const s=cur(),A=affected(s),R=touchRows(s).slice(0,9);
  const lead=!s.mode?'Not watching. Nothing is lit.':!A.length?`Nothing is due at ${s.vals[s.v]} yet.`:s.mode===2?`${NUMW(A.length)} lit: Auto acts on ${A.length===1?'it':'them'} now.`:`${NUMW(A.length)} lit: ${A.length===1?'it gets':'each gets'} a button.`;
  const sub=!s.mode?'Pick Ask or Auto to see what it would touch.':nextText(s);
  return `<div class="tlist" style="--c:${s.c}">
    <p class="hd">${tk(lead)}</p><p class="cap top">${tk(sub)}</p>
    <div class="rows">${R.map(r=>`<div class="rw" data-t="${r.id}" style="--c:${s.c}"><span class="ic">${r.ic.replace(/width="17" height="17"/,'width="15" height="15"')}</span><span class="nm"><span>${r.n}</span>${tk(r.x,'x')}</span>${tk(r.tm,'tm')}<span class="v">${r.v}</span></div>`).join('')}</div>
    <p class="cap rest">Done closes this and shows the whole ${s.name} view.</p></div>`;

/* ---------- marks ---------- */
function applyMarks(){
  const p=$('pin'),s=cur();
  p.classList.toggle('setv',open);
  p.querySelectorAll('.aff').forEach(e=>e.classList.remove('aff','ma','mq'));
  if(!open) return;
  const A=new Set(affected(s));
  p.querySelectorAll('[data-t]').forEach(e=>{if(e.dataset.t.split(' ').some(id=>A.has(id))){e.classList.add('aff',s.mode===2?'ma':'mq')}});
}

/* ---------- menu bar ---------- */
function buildIcons(){
  $('icons').insertAdjacentHTML('beforeend',ORDER.map(k=>`<span class="mi" data-mi="${k}">${gl(k,'#fff',16)}</span>`).join('')+`<span class="mi off" data-mi="one">${gl('one','#fff',16)}</span>`);
}
const SL=624;
function placeNub(){
  document.querySelectorAll('.mi').forEach(m=>{const k=m.dataset.mi;m.classList.toggle('off',one?k!=='one':k==='one'||(sec(k).mode===0&&k!==sel))});
  setTimeout(()=>{
    const st=$('stage').getBoundingClientRect(),sc=st.width/1280;

function menuBadge(){
  const s=sec('agents'),m=document.querySelector('.mi[data-mi="agents"]');if(!m)return;

/* ---------- render ---------- */
const paneHTML=()=>open?fTouch():FRONT[sel]();
function render(){
  put($('today'),todayHTML()); put($('foot'),footHTML()); put($('rail'),railHTML()); put($('markw'),markHTML(cur()));
  put($('pin'),paneHTML()); applyMarks();
  if(open) put($('dw'),drawerHTML(cur()));
  placeNub(); menuBadge();
  $('sheet').classList.toggle('open',open);
}
function refresh(){
  if(busy) return;
  $('clock').textContent=clockText();
  put($('today'),todayHTML()); put($('foot'),footHTML()); put($('rail'),railHTML()); put($('markw'),markHTML(cur()));
  put($('pin'),paneHTML()); applyMarks();
  if(open) put($('dw'),drawerHTML(cur()));
  menuBadge();
}
function go(id){
  if(id===sel) return;
  sel=id; hideCard(); hidePv();
  const p=$('pin'),d=$('dw');
  if(RM){render();return}
  busy=1; p.classList.add('swap'); if(open) d.classList.add('swap');
  setTimeout(()=>{busy=0;put($('rail'),railHTML());put($('markw'),markHTML(cur()));put(p,paneHTML(),true);if(open)put(d,drawerHTML(cur()),true);applyMarks();placeNub();raf(()=>{p.classList.remove('swap');d.classList.remove('swap')})},170);
}
function goWs(id){
  const f=()=>{const e=$('pin').querySelector(`[data-t="${id}"]`);if(!e)return;e.classList.add('flash');setTimeout(()=>e.classList.remove('flash'),1400)};
  if(open) setOpen(false);
  if(sel!=='ws'){go('ws');setTimeout(f,RM?0:260)}else f();
}
function setOpen(v){
  open=v; hideCard(); hidePv();
  const p=$('pin');
  if(open) put($('dw'),drawerHTML(cur()),true);
  $('sheet').classList.toggle('open',open);
  if(RM){put(p,paneHTML(),true);applyMarks();return}
  busy=1;p.classList.add('swap');
  setTimeout(()=>{busy=0;put(p,paneHTML(),true);applyMarks();raf(()=>p.classList.remove('swap'))},open?200:120);
}

function cardHTML(kind,o){
  let t,s,sc,f=[];
  if(kind==='srv'){t=o.p+' '+o.k;sc=o.use?'var(--tx)':C.servers;s=o.use?'In use now · '+Math.round(RATE[o.id]||0)+' requests a minute':o.kept?'Stays, Docker runs it':has(o.id,'keep')?'Stays, you kept it':'Unused '+dur(idleOf(o))+(o.ws?'':' · nobody owns it');
    const sv=sec('servers'),left=thr(sv)-(o.idle?idleOf(o):0);
    f=[['Workstream',o.ws?lk(o.ws):o.o],['Worktree',o.wt||'none'],['Memory',fmt(o.mb/1000)],['Rule',o.use||o.kept?'in use, it stays':!o.ws?'no owner, waits for you':sv.mode===2?(left>0?'Auto stops it in '+durC(left):'Auto stops it now'):sv.mode===1?'gets a Stop button at '+sv.vals[sv.v]:'not watching']]}
  if(kind==='wt'){t=o.n;sc=o.k==='m'?C.trees:'var(--tx2)';s=o.k==='m'?(has(o.id,'keep')?'Stays, you kept it':'Merged '+dur(treeAge(o))+' ago'):o.k==='s'?'Stale '+dur(treeAge(o))+', '+o.why:o.k==='u'?'In use':'Fine, has fresh commits';
    f=[['Size',fmt(o.gb)],['Workstream',o.ws?lk(o.ws):'none'],['Server',o.srv&&!gone(o.srv)?byId[o.srv].p:'none']]}
  if(kind==='ws'){const a=byId[o.ag],sv=wsSrv(o);t=o.n;sc=o.st==='n'?'var(--tx)':o.st==='i'?'var(--tx2)':C.ws;
    s=isFin(o.id)?'Finished':o.st==='r'?'Ready to wrap up · PR merged '+dur(mergedAgo(o))+' ago':o.st==='n'?'Needs you '+dur(age(a))+': “'+a.q+'”':o.st==='i'?'Idle '+dur(age(a)):o.id==='ws-med'&&TESTS?'Working, tests running':'Working '+dur(age(a));
    f=[['Agent',WHERE(a)+(o.id==='ws-s3'?' + '+SUBS.length+' subagents':'')],['Branch',o.br+(o.id==='ws-s3'?', 3 ahead':'')],['PR',o.pr?'#'+o.pr.n+' '+o.pr.s+(o.id==='ws-par'?', checks pass':''):'none'],['Servers',sv.length?sv.map(x=>x.p).join(', '):'none'],['Holds',fmt(wsFree(o))+(o.brw?', '+o.brw:'')]]}
  if(kind==='app'){t=o.n;sc='var(--tx2)';s=o.cls==='spared'?'Stays, Playwright drives it for speed-3':'Stays, it is a work app';
    f=[['CPU',(Math.round(cpuOf(o)*10)/10)+' %'],['Memory',fmt(memOf(o))],['For',o.ws?lk(o.ws):'you']]}
  return `<div class="ct">${t}</div><div class="cs" style="color:${sc}">${s}</div><div class="cf">${f.map(x=>`<span>${x[0]}</span><span>${x[1]}</span>`).join('')}</div>
    <div class="ca">${acts(kind,o).map(x=>x.dis?`<button class="dis">${x.l}<span class="tl">${x.tl}</span></button>`:`<button data-act="${x.a}" data-id="${x.id||o.id}">${x.l}<span class="tl">${x.tl||''}</span></button>`).join('')}</div>`;
}
function rel(el){const st=$('stage').getBoundingClientRect(),sc=st.width/1280,sh=$('sheet').getBoundingClientRect(),r=el.getBoundingClientRect();return {x:(r.left-sh.left)/sc,y:(r.top-sh.top)/sc,w:r.width/sc,h:r.height/sc}}
function showCard(el){
  const [kind,id]=el.dataset.card.split(':');const o=byId[id];if(!o||gone(id))return;
  clearTimeout(cardT);cardFor=el;
  const c=$('card');c.innerHTML=cardHTML(kind,o);
  const r=rel(el);
  let x=r.x+r.w/2-126,y=r.y+r.h+8;
  x=Math.max(12,Math.min(608-264,x));
  if(y+c.offsetHeight>464) y=r.y-c.offsetHeight-8;
  if(y<8) y=8;
  c.style.left=x+'px';c.style.top=y+'px';
  c.classList.add('show');
}
function hideCard(){clearTimeout(cardT);$('card').classList.remove('show');cardFor=null}
let pvFor=null;
function showPv(b){
  const a=SA[b.dataset.sa];if(!a.res||!a.on())return;pvFor=b;
  const p=$('pv');p.innerHTML=a.res().map(t=>`<span class="pg">${nb(t)}</span>`).join('');
  const r=rel(b);let x=r.x+r.w-260;x=Math.max(12,x);
  p.style.left=x+'px';p.style.top=(r.y-p.offsetHeight-10)+'px';
  if(r.y-p.offsetHeight-10<48) p.style.top=(r.y+r.h+10)+'px';
  p.classList.add('show');
}
function hidePv(){$('pv').classList.remove('show');pvFor=null}
$('sheet').addEventListener('mouseover',e=>{
  const el=e.target.closest('[data-card]');
  if(el&&el!==cardFor) showCard(el);
  else if(!el&&!e.target.closest('#card')&&cardFor){clearTimeout(cardT);cardT=setTimeout(hideCard,180)}
  else if(el||e.target.closest('#card')) clearTimeout(cardT);
  const sa=e.target.closest('[data-sa]');
  const p=$('pin');
  if(sa&&!sa.disabled){const a=SA[sa.dataset.sa],T2=new Set(a.t());p.classList.add('plan');p.querySelectorAll('[data-t]').forEach(n=>n.classList.toggle('hit',n.dataset.t.split(' ').some(i=>T2.has(i))));if(sa!==pvFor)showPv(sa)}
  else {if(p.classList.contains('plan')){p.classList.remove('plan');p.querySelectorAll('.hit').forEach(n=>n.classList.remove('hit'))}if(pvFor)hidePv()}
});
/* ---------- Auto: acts when a timer crosses its value, then a notice with Undo ---------- */
function autoCheck(){
  if(performance.now()-lastAuto<6000||busy) return;
  for(const s of S){
    if(s.mode!==2) continue;
    const t=thr(s);
    if(s.id==='servers'){const x=idleSrv().find(x=>x.ws&&idleOf(x)>=t&&!has(x.id,'spared'));if(x){lastAuto=performance.now();commit(`<span class="au">Auto</span> stopped <b>${x.p} ${x.k}</b>, unused ${dur(idleOf(x))}. ${fmt(x.mb/1000)} back.`,()=>{fl(x.id).gone=1;CNT.srv++},[x.id],[x.id]);return}}
    if(s.id==='ws'){const w=ready().find(w=>mergedAgo(w)>=t&&!has(w.id,'spared'));if(w){lastAuto=performance.now();commit(`<span class="au">Auto</span> ${wrapMsg(w).replace('Wrapped','wrapped')}`,()=>{wrapWs(w.id);CNT.ws=(CNT.ws||0)+1},wsLeave(w),[w.id]);return}}
    if(s.id==='trees'){const w=merged().find(w=>treeAge(w)>=t&&!has(w.id,'spared'));if(w){lastAuto=performance.now();commit(`<span class="au">Auto</span> moved <b>${w.n}</b> to the Trash, merged ${dur(treeAge(w))} ago.`,()=>{fl(w.id).gone=1;if(w.srv)fl(w.srv).gone=1},[w.id],[w.id]);return}}
    if(s.id==='apps'&&LOAD()>t&&noise().length){const n=noise().filter(a=>!has(a.id,'spared'));if(n.length){lastAuto=performance.now();commit(`<span class="au">Auto</span> quit <b>${and(n.map(a=>a.n))}</b>, load passed ${t} %.`,()=>n.forEach(a=>fl(a.id).gone=1),n.map(a=>a.id),n.map(a=>a.id));return}}
    if(s.id==='agents'){const a=waiting().find(a=>age(a)>=t&&!has(a.id,'fwd'));if(a){lastAuto=performance.now();fl(a.id).fwd=1;toast(`<span class="au">Auto</span> brought <b>${a.n}</b> forward in ${PLACE(a)}. It asks “${a.q}”`,false);return}}
  }
}

/* ---------- simulation: things come and go ---------- */
function arrive(ids){ids.forEach(id=>{SIMG.delete(id);NEW.set(id,performance.now());const k=SECOF(id);if(k)RNEW[k]=performance.now()});const t=performance.now();setTimeout(()=>{if([...NEW.values()].includes(t)||1)refresh()},5100)}
function depart(ids){
  ids=ids.filter(id=>!gone(id)||SUBS.includes(id)); if(!ids.length) return;
  ids.forEach(id=>FIN.set(id,performance.now()));
  setTimeout(()=>{
    const els=ids.flatMap(id=>[...$('pin').querySelectorAll(`[data-leave~="${id}"]`)]);
    if(!RM) els.forEach(e=>e.classList.add('leave'));
    setTimeout(()=>{ids.forEach(id=>{FIN.delete(id);if(SUBS.includes(id))SUBS=SUBS.filter(x=>x!==id);else SIMG.add(id)});refresh()},RM?0:400);
  },2600);
}
let subN=2;
const EV=[
  ()=>{subN++;const id='sa'+subN;SUBS.push(id);NEW.set(id,performance.now());NEW.set('subs',performance.now());RNEW.agents=performance.now();setTimeout(refresh,5100)},
  ()=>{TESTS=false},
  ()=>{if(!has('s5174','gone'))arrive(['s5174'])},
  ()=>{const id=SUBS[SUBS.length-1];if(SUBS.length>2)depart([id])},
  ()=>{const a=byId.icons;if(!gone('icons'))depart(['icons','ws-ic'])},
  ()=>{byId.docs.m=0;byId.docs.t0=T;arrive(['docs','ws-docs'])},
  ()=>{if(!gone('s5174'))depart(['s5174'])},
  ()=>{TESTS=true},
  ()=>{if(!gone('docs'))depart(['docs','ws-docs'])},
  ()=>{byId.icons.m=0;byId.icons.t0=T;arrive(['icons','ws-ic'])}
];
let paused=false, tickN=0, evI=0;
function jitter(){
  const r=()=>Math.random()-.5;
  J.load=Math.max(-4,Math.min(4,J.load*.6+r()*3));
  Object.keys(RATE).forEach(k=>RATE[k]=Math.max(2,RATE[k]+r()*4));
  J.mem=Math.max(-.35,Math.min(.35,J.mem*.6+r()*.25));
  APPS.forEach(a=>{J.app[a.id]=Math.max(-a.cpu*.07,Math.min(a.cpu*.07,(J.app[a.id]||0)*.6+r()*a.cpu*.08))});
}
function tick(){
  if(paused) return;
  T+=0.1; tickN++;
  if(tickN%2===0) jitter();
  if(tickN%8===3){EV[evI%EV.length]();evI++}
  autoCheck();
  refresh();
}
$('pz').onclick=()=>{paused=!paused;document.body.classList.toggle('paused-all',paused);$('sim').classList.toggle('paused',paused);$('pz').textContent=paused?'Play':'Pause';$('simt').textContent=paused?'Paused · nothing moves until you press Play':'Live · time runs 6× here, so you can watch things change'};

/* ---------- clicks ---------- */
document.addEventListener('click',e=>{
  const t=e.target;
  const it=t.closest('[data-sec]'); if(it){go(it.dataset.sec);return}
  if(t.closest('[data-open]')){setOpen(!open);return}
  if(t.closest('[data-close]')){setOpen(false);return}
  const md=t.closest('[data-mode]'); if(md){const s=cur(),m=+md.dataset.mode;if(m===s.mode)return;const was=MODES[s.mode];commit(`${s.name} is <b>${MODES[m]}</b> now, was ${was}. ${modeText(s,m)}`,()=>{s.mode=m});return}
  const vl=t.closest('[data-val]'); if(vl){const s=cur(),v=+vl.dataset.val;if(v===s.v)return;const was=s.vals[s.v];commit(`${s.name}: <b>${s.lab.charAt(0).toLowerCase()+s.lab.slice(1)} ${s.vals[v]}</b>, was ${was}.`,()=>{s.v=v});return}
  const sw=t.closest('[data-sw]'); if(sw){const k=sw.dataset.sw;commit(k==='one'?(one?'Each section has its own menu bar icon again.':'<b>One icon</b> in the menu bar now.'):(login?'MinMacs will not open at login.':'MinMacs opens at login.'),()=>{if(k==='one')one=!one;else login=!login});return}
  if(t.closest('[data-lid]')){commit(lid?'Closing the lid sleeps the Mac again. Agents pause with it.':'<b>Your agents keep working</b> with the lid closed.',()=>{lid=!lid});return}
  if(t.closest('[data-today]')){commit('Brought back <b>2 apps</b> and <b>3 servers</b> Auto closed today.',()=>{today|=1});return}
  const gw=t.closest('span[data-gows]'); if(gw){hideCard();goWs(gw.dataset.gows);return}
  const sa=t.closest('[data-sa]'); if(sa){const a=SA[sa.dataset.sa];if(!a.on())return;const [msg,fn]=a.run();$('pin').classList.remove('plan');commit(msg,fn,a.t());return}
  const ac=t.closest('[data-act]'); if(ac){runAct(ac.dataset.act,ac.dataset.id);return}
  const mi=t.closest('[data-mi]'); if(mi&&mi.dataset.mi!=='one'){go(mi.dataset.mi);return}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&open){setOpen(false);return}
  if((e.key==='ArrowDown'||e.key==='ArrowUp')&&e.target.closest('.rail')){const i=ORDER.indexOf(sel)+(e.key==='ArrowDown'?1:-1);if(ORDER[i]){go(ORDER[i]);setTimeout(()=>document.querySelector(`[data-sec="${ORDER[i]}"]`).focus(),200)}e.preventDefault()}
});

/* ---------- stage ---------- */
function fit(){const s=Math.min(innerWidth/1280,innerHeight/800);$('stage').style.transform=`scale(${s})`;$('stage').style.left=(innerWidth-1280*s)/2+'px';$('stage').style.top=(innerHeight-800*s)/2+'px'}
addEventListener('resize',()=>{fit();placeNub()});
buildIcons(); fit(); render(); setInterval(tick,1000);
</script>
