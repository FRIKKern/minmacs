<title>Index Holds the Mode</title>
<!--
  COMPOSITION: "Index Holds the Mode"  (36-a)

  Grid. Sheet 1040 wide, 32 px margins, 8 px spacing scale (8/16/24/32/40).
  Two zones: the Live Index (320) | the stage (rest), split again 190 | 1fr like ftop's
  own large layout: one tall graph on the left, the list on the right.

  Where the setting lives, and why. The mode belongs to the section, not to the
  content, so it moves INTO the section's own entry in the Live Index. The picked
  entry opens into a quiet card: name, its mini graph, its number, and under it
  Off / Ask / Auto, the rule in one sentence and the value words. The other
  entries show their mode the way they always did (dot + verb), so the index reads
  as six settings at a glance and one of them open. The setting is never a block
  under the content, and its spot follows the tab you picked (it slides down the
  index), so it is never "the same thing in the same place".

  Focal point per tab. With the form gone from the right, the right side is pure
  "right now": one sentence on top, then the hero column (a big ftop number and
  one tall graph that says what it means), then the items. The section action sits
  under the hero graph because it acts on exactly the colored part of that graph.

  Reading path. Index name -> its mode (left, same row of the eye) -> sentence ->
  big number -> graph -> rows. Left half is "what I decided", right half is
  "what is happening".

  Type. Three sizes: 24 (section names), 14 (text and rows), 11.5 (labels), plus
  the big ftop number (48).
-->
<style>

  --line:rgba(255,255,255,.065);
  --tx:rgba(255,255,255,.94);

  --tx3:rgba(235,235,245,.34);
  --g1:rgba(255,255,255,.06);
  --g2:rgba(255,255,255,.2);
  --g3:rgba(255,255,255,.44);

  --ease:cubic-bezier(.3,.7,.2,1);
  --t1:24px; --t2:14px; --t3:11.5px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#1a1636}
body{font-family:-apple-system,"SF Pro Text",system-ui,sans-serif;color:var(--tx);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;font-size:var(--t2);cursor:default;user-select:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;text-align:left}
b{font-weight:500;color:var(--tx)}

#stage{position:absolute;left:0;top:0;width:1280px;height:800px;transform-origin:0 0;overflow:hidden;

   radial-gradient(760px 560px at 10% 6%,#4b3c9e 0%,rgba(75,60,158,0) 70%),
   radial-gradient(700px 520px at 84% 2%,#22618f 0%,rgba(34,97,143,0) 70%),

   radial-gradient(640px 520px at 18% 100%,#3a2463 0%,rgba(58,36,99,0) 75%),
   #1d1a3c}
.mb{position:absolute;left:0;right:0;top:0;height:26px;display:flex;align-items:center;justify-content:space-between;padding:0 12px 0 16px;background:rgba(18,14,40,.32);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);font-size:13px;color:rgba(255,255,255,.92);z-index:5}
.mb-l,.mb-r{display:flex;align-items:center;gap:18px}

.mb-r{gap:14px}
.icons{position:relative;display:flex;align-items:center;gap:12px}
.hl{position:absolute;top:-3px;height:22px;width:28px;border-radius:6px;background:rgba(255,255,255,.2);transition:transform .45s var(--ease),opacity .3s;pointer-events:none}
.mi{position:relative;display:flex;width:16px;overflow:hidden;cursor:pointer;transition:width .4s var(--ease),opacity .3s,margin .4s var(--ease)}

.sheet{position:absolute;top:34px;background:var(--glass);backdrop-filter:blur(36px) saturate(1.5);-webkit-backdrop-filter:blur(36px) saturate(1.5);border:1px solid rgba(255,255,255,.085);border-radius:22px;box-shadow:0 34px 100px rgba(6,4,24,.5),inset 0 1px 0 rgba(255,255,255,.035);animation:drop .6s var(--ease) both}
@keyframes drop{from{opacity:0;transform:translateY(-10px)}}
.nub{position:absolute;top:-8px;left:0;width:18px;height:8px;margin-left:-9px;transition:transform .45s var(--ease)}
.nub svg{display:block}

.head{display:flex;align-items:center;gap:12px;height:52px;padding:0 32px;white-space:nowrap}
.head .lbl{font-size:var(--t3);color:var(--tx3)}
.head .txt{font-size:13px;color:var(--tx2)}
.head .undo{margin-left:auto;font-size:13px;font-weight:500;height:26px;padding:0 12px;border-radius:13px;background:rgba(255,255,255,.07);transition:background .2s}
.head .undo:hover{background:rgba(255,255,255,.13)}

.foot{display:flex;align-items:center;gap:28px;height:52px;padding:0 32px;border-top:1px solid var(--line)}
.sw{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--tx2);transition:color .2s}
.sw i{width:32px;height:19px;border-radius:10px;background:rgba(255,255,255,.14);position:relative;transition:background .25s;flex:none}
.sw i::after{content:"";position:absolute;left:2px;top:2px;width:15px;height:15px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .25s var(--ease)}
.sw[aria-checked="true"]{color:var(--tx)}
.sw[aria-checked="true"] i{background:#5B9BFF}
.sw[aria-checked="true"] i::after{transform:translateX(13px)}
.foot .hint{margin-left:auto;font-size:var(--t3);color:var(--tx3)}

.toast{position:absolute;left:50%;bottom:66px;display:flex;align-items:center;gap:14px;height:40px;max-width:640px;padding:0 6px 0 16px;border-radius:20px;background:rgba(50,50,64,.97);border:1px solid rgba(255,255,255,.1);box-shadow:0 14px 40px rgba(0,0,0,.35);font-size:13px;color:var(--tx2);white-space:nowrap;opacity:0;transform:translate(-50%,10px);pointer-events:none;transition:opacity .3s,transform .4s var(--ease);z-index:6}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast.noundo{padding-right:16px}

.toast button{flex:none;height:28px;padding:0 13px;border-radius:14px;background:rgba(255,255,255,.1);font-weight:500;color:var(--tx);transition:background .2s}
.toast button:hover{background:rgba(255,255,255,.18)}
.toast.noundo button{display:none}

/* live index basics */
.it{position:relative;width:100%;border-radius:14px;cursor:pointer;transition:background .25s}
.it .dot{flex:none;width:9px;height:9px;border-radius:50%;box-shadow:inset 0 0 0 1.5px rgba(235,235,245,.28);transition:background .35s,box-shadow .35s,transform .3s}
.it .nm{flex:1;min-width:0;font-size:var(--t1);font-weight:600;letter-spacing:-.022em;color:rgba(235,235,245,.36);transition:color .3s;white-space:nowrap}
.it:hover .nm{color:var(--tx2)}
.it.sel .nm{color:var(--tx)}
.mg{flex:none;position:relative;width:56px;height:24px;display:flex;align-items:flex-end;justify-content:space-between;transition:opacity .4s,filter .4s}
.it.m0 .mg{opacity:.28;filter:grayscale(1)}
.mg i{display:block;transition:height .55s var(--ease),width .55s var(--ease),left .55s var(--ease),background .35s,opacity .35s,box-shadow .35s}
.mg .tr{position:absolute;left:0;right:0;top:9px;height:6px;border-radius:3px;background:var(--g1)}
.mg .tr i{position:absolute;top:0;bottom:0;border-radius:3px}
.mg .tr .tk{top:-4px;bottom:-4px;width:2px;margin-left:-1px;border-radius:1px;background:#fff}
.mg.mc i{flex:none;border-radius:2px}
.mg.dots{flex-wrap:wrap;align-content:center;justify-content:space-between;row-gap:4px}
.mg.dots i{width:6px;height:6px;border-radius:50%}
.mg.ring{justify-content:flex-end;align-items:center}
.nb{flex:none;width:84px;display:flex;flex-direction:column;align-items:flex-end;white-space:nowrap}
.nb .n{font-size:var(--t2);font-weight:500;line-height:18px;color:var(--tx2);transition:color .3s}
.nb .n u{text-decoration:none;font-size:var(--t3);font-weight:400;color:var(--tx3);margin-left:3px}
.nb .cp{font-size:var(--t3);line-height:15px;color:var(--tx3)}
.it.sel .nb .n{color:var(--tx)}

/* rows */
.rw{position:relative;display:flex;align-items:center;gap:10px;height:40px;margin:0 -10px;padding:0 10px;border-radius:10px;white-space:nowrap;overflow:hidden;transition:height .42s var(--ease),opacity .32s,background .25s}
.rw.gone{height:0;opacity:0;pointer-events:none}
.rw:hover{background:var(--rowbg)}
.rw.flash{animation:flash 1.8s var(--ease)}
@keyframes flash{0%,40%{background:color-mix(in srgb,var(--c) 26%,transparent)}100%{background:transparent}}
.rw .ic{flex:none;display:flex;width:18px;justify-content:center;transition:opacity .4s,filter .4s}
.rw .tx{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center}
.rw .nm{font-size:var(--t2);line-height:18px;color:var(--tx);overflow:hidden;text-overflow:ellipsis;transition:color .25s}
.rw .sub{font-size:var(--t3);line-height:15px;color:var(--tx3);overflow:hidden;text-overflow:ellipsis}
.rw.dim .nm{color:var(--tx2)}
.rw .meta{flex:none;display:flex;align-items:center;gap:10px;transition:opacity .2s}
.rw .v{flex:none;min-width:52px;text-align:right;color:var(--tx2)}
.rw .st{flex:none;min-width:70px;text-align:right;color:var(--tx3);transition:color .35s}
.rw.aff .st{color:var(--c)}
.hold{display:flex;gap:6px}
.hold span{display:flex;align-items:center;gap:2px;font-size:var(--t3);color:var(--tx3)}
.lk{color:var(--tx2);cursor:pointer;border-bottom:1px solid rgba(255,255,255,.14);transition:color .2s,border-color .2s}
.lk:hover{color:var(--tx);border-color:rgba(255,255,255,.5)}
.acts{position:absolute;right:0;top:0;bottom:0;display:flex;align-items:center;gap:4px;padding:0 8px 0 36px;background:linear-gradient(90deg,rgba(43,43,57,0),var(--rowbg) 30px);opacity:0;transform:translateX(8px);pointer-events:none;transition:opacity .2s,transform .3s var(--ease)}
.rw:hover .acts,.rw:focus-within .acts{opacity:1;transform:none;pointer-events:auto}
.rw:hover .meta,.rw:focus-within .meta{opacity:0}
.ab{height:24px;padding:0 10px;border-radius:12px;background:rgba(255,255,255,.08);font-size:12px;font-weight:500;white-space:nowrap;display:inline-flex;align-items:center;gap:5px;transition:background .2s}
.ab:hover{background:rgba(255,255,255,.17)}
.ab .tl{font-weight:400;color:var(--tx3)}
.ab.dis{background:none;color:var(--tx3);cursor:default;font-weight:400;padding:0 4px}
.ab.dis .tl{color:rgba(235,235,245,.24)}
.more{font-size:var(--t3);line-height:15px;color:var(--tx3);padding-top:8px;white-space:nowrap}

/* section action */
.sa{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 14px;border-radius:15px;background:rgba(255,255,255,.08);font-size:13px;font-weight:500;white-space:nowrap;transition:background .2s,opacity .3s}
.sa:hover{background:rgba(255,255,255,.15)}
.sa .tl{font-weight:400;font-size:12px;color:var(--tx3)}
.sa.pri{background:color-mix(in srgb,var(--c) 26%,transparent)}
.sa.pri:hover{background:color-mix(in srgb,var(--c) 38%,transparent)}
.sa.pri .tl{color:rgba(255,255,255,.58)}
.sa.dis{opacity:.4;pointer-events:none}

/* highlight plan */
.hlon [data-k]:not(.hit){opacity:.22}
.hlon .rw[data-k]:not(.hit){opacity:.32}
.hlon .hit{opacity:1}
.hlon i.hit,.hlon .seg.hit,.hlon .col.hit{box-shadow:0 0 0 1px rgba(255,255,255,.75),0 0 12px var(--c)}
.hlon .rw.hit{background:color-mix(in srgb,var(--c) 15%,transparent)}
.peek .seg.hit,.peek .col.hit,.peek i.hit{box-shadow:0 0 0 1px rgba(255,255,255,.7)}

/* graph primitives */
.meter{position:relative;border-radius:6px;background:var(--g1)}
.meter .seg{position:absolute;border-radius:5px;transition:height .6s var(--ease),bottom .6s var(--ease),width .6s var(--ease),left .6s var(--ease),background .35s,opacity .35s,box-shadow .3s}
.meter .tk{position:absolute;background:#fff;border-radius:1px;transition:bottom .55s var(--ease),left .55s var(--ease),opacity .3s}
.meter .tkl{position:absolute;font-size:var(--t3);color:var(--tx2);white-space:nowrap;transition:bottom .55s var(--ease),left .55s var(--ease),opacity .3s}
.cols{display:flex;align-items:flex-end}
.cols .col{position:relative;flex:1;height:100%;border-radius:5px;background:rgba(255,255,255,.035);transition:opacity .35s,box-shadow .3s}
.cols .col i{position:absolute;left:0;right:0;bottom:0;border-radius:5px;transition:height .6s var(--ease),background .35s,box-shadow .35s,opacity .35s}
.cols .col.gone i{height:0!important;opacity:0}
.det.off .graph{filter:grayscale(1);opacity:.45}
.graph{transition:filter .4s,opacity .4s}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{transition-duration:0s!important;animation-duration:0s!important}
}

.sheet{left:210px;width:1040px}
.body{display:grid;grid-template-columns:320px minmax(0,1fr);column-gap:40px;padding:0 32px 24px;height:600px}

/* ---------- index ---------- */
.idx{display:flex;flex-direction:column;min-height:0}
.leg{font-size:var(--t3);color:var(--tx3);height:24px;line-height:15px;white-space:nowrap;display:flex;align-items:flex-start;justify-content:flex-end;gap:6px;padding-right:0}
.leg i{display:inline-block;width:12px;height:5px;border-radius:3px;margin-top:5px;background:linear-gradient(90deg,#EE85B5,#5B9BFF 22%,#3FD0B8 42%,#4CC96B 60%,#F2B544 78%,#B18CFF)}
.it{margin:0 -14px;padding:0 14px;width:calc(100% + 28px);border-radius:16px}
.it:hover{background:rgba(255,255,255,.025)}
.it.sel{background:rgba(255,255,255,.05);box-shadow:inset 0 0 0 1px rgba(255,255,255,.04)}
.it .r1{display:flex;align-items:center;gap:12px;height:70px}
.it.sel .dot{transform:scale(1.15)}
.it .set{display:grid;grid-template-rows:0fr;transition:grid-template-rows .5s var(--ease)}
.it.sel .set{grid-template-rows:1fr}
.si{overflow:hidden;min-height:0;padding-left:21px;opacity:0;transition:opacity .3s}
.it.sel .si{opacity:1;transition:opacity .4s .12s}
.modes{position:relative;display:flex;gap:4px;height:28px;align-items:center;margin-left:-10px}
.modes .pill{position:absolute;left:0;top:0;height:28px;border-radius:14px;background:color-mix(in srgb,var(--c) 24%,transparent);transition:transform .45s var(--ease),width .45s var(--ease),background .35s,opacity .3s}
.modes button{position:relative;height:28px;padding:0 10px;font-size:var(--t2);font-weight:500;color:var(--tx3);transition:color .3s}
.modes button:hover{color:var(--tx2)}
.modes button[aria-checked="true"]{color:var(--tx)}
.rule{margin-top:8px;font-size:var(--t2);line-height:20px;color:var(--tx2);transition:color .3s}
.rule b{font-weight:500}
.opts{display:flex;gap:16px;height:24px;margin-top:8px;padding-bottom:16px;box-sizing:content-box;align-items:flex-start;white-space:nowrap;transition:opacity .3s}
.it.m0 .opts{opacity:.3;pointer-events:none}
.opts button{position:relative;font-size:var(--t2);color:var(--tx3);line-height:20px;transition:color .25s}
.opts button:hover{color:var(--tx2)}
.opts button[aria-checked="true"]{color:var(--tx);font-weight:500}
.opts button[aria-checked="true"]::after{content:"";position:absolute;left:50%;bottom:-4px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--c)}

/* ---------- stage (right) ---------- */
.det{position:relative;min-width:0;padding-top:4px}
.det .in{height:100%;display:flex;flex-direction:column;transition:opacity .22s,transform .35s var(--ease)}
.det .in.swap{opacity:0;transform:translateY(6px)}
.lab{display:flex;align-items:center;height:20px;font-size:var(--t3);color:var(--tx3);white-space:nowrap}
.lab .key{margin-left:auto;display:flex;align-items:center;gap:6px}
.lab .key i{width:7px;height:7px;border-radius:50%}
.ins{margin-top:4px;font-size:var(--t2);line-height:21px;color:var(--tx2);min-height:42px;max-width:540px;text-wrap:pretty}
.split{flex:1;min-height:0;display:grid;grid-template-columns:214px minmax(0,1fr);column-gap:32px;margin-top:24px}
.hero{display:flex;flex-direction:column;min-height:0}
.big{display:flex;align-items:baseline;gap:6px;height:52px;white-space:nowrap}
.big .bn{font-size:48px;font-weight:500;letter-spacing:-.03em;line-height:52px}
.big .bu{font-size:var(--t2);color:var(--tx3)}
.graph{margin-top:16px;height:244px;position:relative}
.cap{margin-top:12px;font-size:var(--t3);line-height:16px;color:var(--tx3);text-wrap:pretty}
.cap b{color:var(--tx2);font-weight:500}
.sas{margin-top:auto;display:flex;flex-direction:column;align-items:flex-start;gap:8px}
.list{min-width:0;overflow:hidden}
.rw .mk{flex:none;width:7px;height:7px;margin-right:-2px;border-radius:50%;opacity:0;transition:opacity .35s,background .35s,box-shadow .35s}
.rw.aff .mk{opacity:1}
.m2 .rw.aff .mk{background:var(--c)}
.m1 .rw.aff .mk{box-shadow:inset 0 0 0 1.5px var(--c)}
.list .rw{height:48px}
.list .rw.gone{height:0}
.r-apps .v{min-width:40px}
.r-awake .st{min-width:96px}
.r-agents .st{min-width:84px}

/* hero graph pieces */
.vm{position:absolute;bottom:22px;top:0}
.vm .seg{left:0;right:0}
.vm .tk{left:-6px;right:-6px;height:2px;margin-bottom:-1px}
.vlab{position:absolute;bottom:0;height:16px;font-size:var(--t3);color:var(--tx3);white-space:nowrap}
.vlab b{color:var(--tx2);font-weight:500}
.side{position:absolute;font-size:var(--t3);line-height:15px;color:var(--tx3);white-space:nowrap;transition:bottom .55s var(--ease),opacity .3s}
.side b{color:var(--tx2);font-weight:500}
.aring{position:absolute;left:23px;top:0}

.rc{position:absolute;left:23px;top:0;width:168px;height:168px;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
.rc .n{font-size:var(--t1);font-weight:600;line-height:28px}
.rc .u{font-size:var(--t3);color:var(--tx3)}
.rleg{position:absolute;left:0;right:0;top:186px;display:grid;grid-template-columns:1fr 1fr;row-gap:6px;font-size:var(--t3);color:var(--tx3);white-space:nowrap}
.rleg span{display:flex;align-items:center;gap:6px}
.rleg i{width:7px;height:7px;border-radius:50%}
.rleg b{color:var(--tx2);font-weight:500}
.hlon .aring circle[data-k]:not(.hit){opacity:.2}
.hlon .aring circle.hit,.peek .aring circle.hit{stroke:var(--c);stroke-width:10}
</style>

/* ---------- state + history ---------- */
const S={sel:'agents',mode:{agents:1,apps:2,servers:2,trees:1,disk:2,awake:2},val:{agents:0,apps:1,servers:2,trees:1,disk:1,awake:1},
  gone:[],kept:[],moved:[],sleep:[],plus:[],trim:0,today:1,one:0,login:1};
const H=[];
const has=(l,id)=>S[l].includes(id);

/* ---------- formatting ---------- */
const trimN=x=>String(+x.toFixed(2));
const r1=x=>+x.toFixed(1), r2=x=>Math.abs(x-r1(x))<0.03?r1(x):+x.toFixed(2);
function gbN(x){return x<1?Math.round(x*1000):x>=10?r1(x):r2(x)}
function gbU(x){return x<1?'MB':'GB'}
const fmt=x=>`${gbN(x)} ${gbU(x)}`;
function fmtN(v,f){if(f==='i')return String(Math.round(v));if(f==='g')return v>=10?v.toFixed(1):String(r2(v));if(f==='m')return String(Math.round(v));return String(Math.round(v))}
const N=(v,f)=>`<span class="num" data-v="${v}" data-f="${f}">${fmtN(v,f)}</span>`;
function NG(x){return x<1?{n:N(Math.round(x*1000),'m'),u:'MB'}:{n:N(+x.toFixed(2),'g'),u:'GB'}}
const andList=a=>a.length<2?(a[0]||''):a.slice(0,-1).join(', ')+' and '+a[a.length-1];
const mins=m=>m>=1440?`${Math.round(m/1440)} day${m>=2880?'s':''}`:m>=60?`${Math.round(m/60)} h`:`${m} min`;

/* ---------- derived ---------- */
const cpuOf=a=>a.id==='chrome'&&S.trim?15:a.cpu;
const memOf=a=>a.id==='chrome'&&S.trim?6.6:a.mem;
const LOAD=()=>63-sum(APPS.filter(a=>g(a.id)),a=>a.cpu)-(S.trim&&!g('chrome')?6:0);
const MEM=()=>24.1-sum(APPS.filter(a=>g(a.id)),a=>a.mem)-(S.trim&&!g('chrome')?2.1:0);
const closeList=()=>APPS.filter(a=>!g(a.id)&&!has('kept',a.id)&&(a.cls==='close'||has('moved',a.id)));
const idleSrv=()=>SRV.filter(x=>!g(x.id)&&x.idle&&!has('kept',x.id));
const mergedWT=()=>WT.filter(w=>!g(w.id)&&w.k==='m'&&!has('kept',w.id));
const safeDK=()=>DK.filter(d=>!g(d.id)&&d.safe&&!has('kept',d.id));
const reclaim=()=>sum(DK.filter(d=>!g(d.id)),d=>d.gb);
const USED=()=>812-sum(DK.filter(d=>g(d.id)),d=>d.gb)-sum(WT.filter(w=>g(w.id)),w=>w.gb);
const finished=()=>AG.filter(a=>a.st==='f'&&!g(a.id));
const holding=()=>AG.filter(a=>!g(a.id)&&((a.awake&&!has('sleep',a.id))||has('plus',a.id)));
const agHeld=a=>Math.round(10*agHeld0(a))/10;
const agHeld0=a=>sum(SRV.filter(x=>(a.srv||[]).includes(x.id)&&!g(x.id)),x=>x.mb/1000)+(a.wt&&!g(a.wt)&&WT.find(w=>w.id===a.wt).k==='m'?WT.find(w=>w.id===a.wt).gb:0);

/* which items does the current mode act on */
function aff(s){
  const m=MODE(s); if(!m) return [];
  if(s==='agents') return finished().filter(a=>a.fin>=VN('agents')).map(a=>a.id);
  if(s==='apps') return closeList().map(a=>a.id);
  if(s==='servers') return idleSrv().filter(x=>x.idle>=VN('servers')).map(x=>x.id);
  if(s==='trees') return mergedWT().filter(w=>w.age>=VN('trees')).map(w=>w.id);
  if(s==='disk') return safeDK().map(d=>d.id);
  if(s==='awake') return holding().map(a=>a.id);
}

/* ---------- words ---------- */
function rule(s){
  const m=MODE(s), v=`<b>${VS(s)}</b>`;
  const R={
    agents:['Not watching agents.',`Suggests Wrap Up once an agent has been finished for ${v}.`,`Wraps up an agent ${v} after it finishes: its servers stop, its merged worktree goes.`],
    apps:['Not watching apps.',`Shows noise apps to close when load passes ${v}.`,`Closes noise apps when load passes ${v}.`],
    servers:['Not watching servers.',`Shows servers nobody used for ${v}.`,`Stops servers nobody used for ${v}.`],
    trees:['Not watching worktrees.',`Shows worktrees ${v} after they merge.`,`Removes worktrees ${v} after they merge. Undo brings them back.`],
    disk:['Not watching the disk.',`Shows safe caches and build output, ${v}, ${['next tonight','next on Sunday','next on 1 Nov'][S.val.disk]}.`,`Moves safe clutter to the Trash ${v}, ${['next tonight','next on Sunday','next on 1 Nov'][S.val.disk]}.`],
    awake:['The Mac sleeps as usual.',`Asks when an agent starts working, then keeps it awake until ${S.val.awake===3?'it finishes':v+' battery'}.`,`Keeps the Mac awake while agents work${S.val.awake===3?', whatever the battery':`, until ${v} battery`}.`]
  };
  return R[s][m];
}
function insight(s){
  const m=MODE(s);
  if(s==='agents'){
    const f=finished(), j=!g('judge');
    const a=f.length?`<b>fix auth redirect</b> finished 2 h ago and still holds <b>${fmt(agHeld(f[0]))}</b>.`:`No finished agent holds anything now.`;
    return a+(j?` <b>lexicon-judge</b> has waited for you for 3 min.`:'');
  }
  if(s==='apps'){
    const cl=closeList(), L=LOAD(), T=VN('apps'), names=andList(cl.map(a=>a.sh));
    if(!cl.length) return `Nothing on the close list. Load is <b>${Math.round(L)} %</b>, memory <b>${trimN(MEM())} GB</b>.`;
    if(!m) return `${names} use <b>${fmt(sum(cl,memOf))}</b>. MinMacs is not watching apps.`;
    if(L>=T) return `Load <b>${Math.round(L)} %</b> is over the ${T} % line, so ${m===2?'Auto closes':'Ask suggests closing'} ${names} next.`;
    return `Load is under the ${T} % line, so nothing closes yet. Above it, ${names} ${cl.length>1?'go':'goes'} and free <b>${fmt(sum(cl,memOf))}</b>.`;
  }
  if(s==='servers'){
    const i=idleSrv(); if(!i.length) return `No server is idle. ${SRV.filter(x=>!g(x.id)).length} run for agents and Docker.`;
    return `<b>${i.length} server${i.length>1?'s':''}</b> idle, <b>${fmt(sum(i,x=>x.mb/1000))}</b> in all.`+(i.some(x=>x.id==='s6006')?` :6006 storybook has been idle 3 days and nobody owns it.`:'');
  }
  if(s==='trees'){
    const mg=mergedWT();
    return (mg.length?`<b>${mg.length} worktree${mg.length>1?'s':''}</b> merged into main. `:`No merged worktrees left. `)+(!g('t-bp7')?`<span style="white-space:nowrap">bp7-studio-dogfood</span> stays: 1 commit is not in main.`:'');
  }
  if(s==='disk'){
    const sf=safeDK(), free=994-USED();
    const lk=DK.filter(d=>!g(d.id)&&!d.safe&&!d.rep);
    return `<b>${Math.round(free)} GB</b> free. `+(sf.length?`<b>${fmt(sum(sf,d=>d.gb))}</b> is safe to clean now${lk.length?', ':'.'}`:`The safe clutter is gone. `)+(lk.length?`<b>${fmt(sum(lk,d=>d.gb))}</b> more after a look.`:'');
  }
  if(s==='awake'){
    const h=holding();
    if(!m) return `The Mac sleeps as usual, even while ${h.length} agents work.`;
    if(!h.length) return `Nothing holds the Mac awake. It sleeps as usual.`;
    return `Awake because <b>${h.length} agent${h.length>1?'s':''}</b> ${h.length>1?'work':'works'}. It sleeps when the last one finishes${S.val.awake===3?'':`, or when the battery falls to ${VS('awake')}`}.`;
  }
}
function idxNum(s){
  const m=MODE(s);
  if(!m) return {n:'Off',u:'',cp:s==='awake'?'sleeps as usual':'not watching'};
  if(s==='agents'){const f=finished().length;return {n:N(f,'i'),u:'finished',cp:['','Ask suggests','Auto wraps up'][m]}}
  if(s==='apps') return {n:N(Math.round(sum(closeList(),cpuOf)),'i'),u:'%',cp:['','Ask shows','Auto frees'][m]};
  if(s==='servers') return {n:N(idleSrv().length,'i'),u:'idle',cp:['','Ask shows','Auto stops'][m]};
  if(s==='trees'){const x=NG(sum(mergedWT(),w=>w.gb));return {n:x.n,u:x.u,cp:['','Ask shows','Auto removes'][m]}}
  if(s==='disk'){const x=NG(sum(safeDK(),d=>d.gb));return {n:x.n,u:x.u,cp:['','Ask shows','Auto cleans'][m]}}
  return {n:N(holding().length,'i'),u:'agents',cp:['','ask first','keep it awake'][m]};
}

/* ---------- rows ---------- */
const ab=(label,code,tail)=>`<button class="ab" data-do="${code}">${label}${tail?`<span class="tl">${tail}</span>`:''}</button>`;
const abDis=(label,why)=>`<span class="ab dis">${label}<span class="tl">${why}</span></span>`;
const agLink=id=>`<span class="lk" data-goto="${id}">${agent(id).n}</span>`;
function row(o){

function agState(a){return a.st==='w'?(has('sleep',a.id)?'working, may sleep':`working ${a.tm}`):a.st==='n'?`needs you ${a.tm}`:a.st==='i'?`idle ${a.tm}`:`finished ${a.tm}`}

function rowsFor(s){

    return row({id:x.id,k:x.id,gone:g(x.id),aff:A.includes(x.id),dim:!idle,ic:ICON[x.ic],nm:`${x.p} ${x.k}`,sub:x.ag?`${agLink(x.ag)}${x.id==='s4000'?', merged':''}`:x.o==='nobody'?'nobody owns it':`${x.o}`,v:fmt(x.mb/1000),st,acts:acts.join('')});

    else if(w.id==='t-bp7') acts=[abDis('Remove','1 commit not in main'),ab('Bundle and Remove',`bundle:${w.id}`),ab('Show Commit',`commit:${w.id}`)];

    return row({id:w.id,k:w.id,gone:g(w.id),aff:A.includes(w.id),dim:w.k!=='m'||has('kept',w.id),ic:ICON.tree,nm:w.n,sub,v:fmt(w.gb),st,acts:acts.join('')});

  }).join('');
  if(s==='awake'){
    const L=AG.filter(a=>a.st==='w'||a.st==='n'||a.st==='i');
    return L.map(a=>{
      const h=holding().includes(a);

      return row({id:a.id,k:a.id,gone:g(a.id),aff:A.includes(a.id),dim:!h,ic:ICON[a.t],nm:a.n,sub:`${TOOL[a.t]} · ${agState(a)}`,st,acts:acts.join('')});
    }).join('')+`<p class="more">fix auth redirect finished and 5 idle agents hold nothing</p>`;
  }
}

/* ---------- doing things ---------- */
function snap(){return JSON.stringify(S)}
function act(msg,fn){H.push(snap());fn();render();toast(msg,true)}
function undo(){if(!H.length)return;const sel=S.sel;Object.assign(S,JSON.parse(H.pop()));S.sel=sel;render();toast('Undone',false)}
const push=(l,...ids)=>ids.forEach(id=>{if(id&&!S[l].includes(id))S[l].push(id)});
function run(code){
  const [v,id]=code.split(':');
  const A=id&&agent(id), ap=id&&APPS.find(a=>a.id===id), sv=id&&SRV.find(x=>x.id===id), wt=id&&WT.find(w=>w.id===id), dk=id&&DK.find(d=>d.id===id);
  const name=(ap&&ap.n)||(sv&&`${sv.p} ${sv.k}`)||(wt&&wt.n)||(dk&&dk.n)||(A&&A.n)||'';
  switch(v){
    case 'quit':return act(`Quit <b>${name}</b> · ${fmt(memOf(ap))} freed`,()=>push('gone',id));
    case 'trim':return act(`Trimmed <b>14 tabs</b> in Chrome · 2.1 GB`,()=>{S.trim=1});
    case 'keep':return act(`Keeping <b>${name}</b>, MinMacs leaves it alone`,()=>{push('kept',id);S.moved=S.moved.filter(x=>x!==id)});
    case 'move':return act(`Moved <b>${name}</b> to the close list`,()=>push('moved',id));
    case 'stop':return act(`Stopped <b>${name}</b> · ${fmt(sv.mb/1000)} freed`,()=>push('gone',id));
    case 'remove':return act(`Moved <b>${name}</b> to the Trash · ${fmt(wt.gb)}`,()=>push('gone',id));
    case 'bundle':return act(`Saved a git bundle, moved <b>${name}</b> to the Trash`,()=>push('gone',id));
    case 'clean':return act(`Cleaned <b>${name}</b> · ${fmt(dk.gb)}`,()=>push('gone',id));
    case 'wrap':return act(`Wrapped up <b>${name}</b> · ${fmt(agHeld(A))} freed`,()=>push('gone',id,...(A.srv||[]),A.wt));
    case 'stopsrv':return act(`Stopped the servers of <b>${name}</b>`,()=>push('gone',...(A.srv||[])));
    case 'sleep':return act(`<b>${name}</b> no longer keeps the Mac awake`,()=>{push('sleep',id);S.plus=S.plus.filter(x=>x!==id)});
    case 'plus':return act(`<b>${name}</b> keeps the Mac awake until 17:42`,()=>{push('plus',id);S.sleep=S.sleep.filter(x=>x!==id)});
    case 'now':{const cl=closeList();return act(`Closed <b>${andList(cl.map(a=>a.sh))}</b> · ${fmt(sum(cl,memOf))} freed`,()=>push('gone',...cl.map(a=>a.id)))}
    case 'closeidle':{const i=idleSrv();return act(`Stopped <b>${i.length} idle servers</b> · ${fmt(sum(i,x=>x.mb/1000))}`,()=>push('gone',...i.map(x=>x.id)))}
    case 'rmmerged':{const m=mergedWT();return act(`Moved <b>${m.length} merged worktrees</b> to the Trash · ${fmt(sum(m,w=>w.gb))}`,()=>push('gone',...m.map(w=>w.id)))}
    case 'cleansafe':{const sf=safeDK();return act(`Moved <b>${fmt(sum(sf,d=>d.gb))}</b> of safe clutter to the Trash`,()=>push('gone',...sf.map(d=>d.id)))}
    case 'wrapfin':{const f=finished();return act(`Wrapped up <b>${andList(f.map(a=>a.n))}</b> · ${fmt(sum(f,agHeld))} freed`,()=>f.forEach(a=>push('gone',a.id,...(a.srv||[]),a.wt)))}
    case 'sleepall':{const h=holding();return act(`The Mac may sleep now; <b>${h.length} agents</b> no longer hold it`,()=>{push('sleep',...h.map(a=>a.id));S.plus=[]})}
    case 'restore':return toast(`Nothing to restore: the 11:05 run is already back`,false);
    case 'tab':return toast(`Opened <b>${name}</b> in ${A.app}`,false);
    case 'open':return toast(`Opened <b>localhost${sv.p}</b> in the browser`,false);
    case 'finder':return toast(`Showed <b>${name}</b> in Finder`,false);
    case 'editor':return toast(`Opened <b>${name}</b> in Cursor`,false);
    case 'commit':return toast(`<b>a41c9e2</b> “studio dogfood: seed fixtures”, not in main`,false);
    case 'goto':return gotoAgent(id);
  }
}
function setMode(s,i){if(S.mode[s]===i)return;act(`<b>${NAME[s]}</b> set to ${MODES[i]}`,()=>{S.mode[s]=i})}
function setVal(s,i){if(S.val[s]===i)return;act(`<b>${NAME[s]}</b>: ${VALS[s][i]}`,()=>{S.val[s]=i})}

let tT;
function toast(msg,undoable){const t=$('toast');$('tt').innerHTML=msg;t.classList.toggle('noundo',!undoable);t.classList.add('show');clearTimeout(tT);tT=setTimeout(()=>t.classList.remove('show'),5200)}

/* ---------- morph: patch the live DOM so things ease instead of jump ---------- */
const TW=new WeakMap();
function tween(el,from,to,f){
  if(RM||isNaN(from)||isNaN(to)){el.textContent=fmtN(to,f);return}
  const id=(TW.get(el)||0)+1;TW.set(el,id);const t0=performance.now(),d=620;
  const step=t=>{if(TW.get(el)!==id)return;const p=Math.min(1,(t-t0)/d),e=1-Math.pow(1-p,3);el.textContent=fmtN(from+(to-from)*e,f);if(p<1)requestAnimationFrame(step)};
  requestAnimationFrame(step);
}
function copyAttrs(a,b){for(const t of [...a.attributes])if(!b.hasAttribute(t.name))a.removeAttribute(t.name);for(const t of [...b.attributes])if(a.getAttribute(t.name)!==t.value)a.setAttribute(t.name,t.value)}
function morph(a,b){
  if(a.nodeType!==b.nodeType||a.nodeName!==b.nodeName){a.replaceWith(b);return}
  if(a.nodeType!==1){if(a.nodeValue!==b.nodeValue)a.nodeValue=b.nodeValue;return}
  if(a.classList.contains('num')){const o=a.getAttribute('data-v'),n=b.getAttribute('data-v');copyAttrs(a,b);if(o!==n)tween(a,+o,+n,b.getAttribute('data-f'));return}
  copyAttrs(a,b);
  const ac=[...a.childNodes],bc=[...b.childNodes];
  if(ac.length!==bc.length){a.replaceChildren(...bc);return}
  for(let i=0;i<ac.length;i++)morph(ac[i],bc[i]);
}
function patch(el,html){
  const t=document.createElement('div');t.innerHTML=html;
  const ac=[...el.childNodes],bc=[...t.childNodes];
  if(ac.length!==bc.length){el.replaceChildren(...bc);return}
  for(let i=0;i<ac.length;i++)morph(ac[i],bc[i]);
}

/* ---------- highlight: a section action lights what it touches first ---------- */
function light(root,keys,dim){

/* ---------- shared wiring ---------- */
function wire(){
  document.addEventListener('click',e=>{
    const t=e.target;
    const d=t.closest('[data-do]');if(d){e.stopPropagation();unlight($('sheet'));run(d.getAttribute('data-do'));return}
    const go=t.closest('[data-goto]');if(go){e.stopPropagation();gotoAgent(go.getAttribute('data-goto'));return}
    const md=t.closest('[data-mode]');if(md){e.stopPropagation();const [s,i]=md.getAttribute('data-mode').split(':');setMode(s,+i);return}
    const vl=t.closest('[data-val]');if(vl){e.stopPropagation();const [s,i]=vl.getAttribute('data-val').split(':');setVal(s,+i);return}
    if(t.closest('#tundo')){act(S.today?'Reopened <b>2 apps</b>, started <b>3 servers</b> again':'Closed the <b>2 apps</b> and stopped the <b>3 servers</b> again',()=>{S.today=S.today?0:1});return}
    if(t.closest('#tbtn')){undo();return}
    if(t.closest('#one')){act(S.one?'One icon per section in the menu bar':'One icon in the menu bar',()=>{S.one=S.one?0:1});return}
    if(t.closest('#login')){act(S.login?'MinMacs will not open at login':'MinMacs opens at login',()=>{S.login=S.login?0:1});return}
    const mi=t.closest('.mi[data-s]');if(mi){select(mi.getAttribute('data-s'));return}
    const it=t.closest('[data-sec]');if(it){select(it.getAttribute('data-sec'));return}
  });
  document.addEventListener('keydown',e=>{
    if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='z'){e.preventDefault();undo();return}
    const it=e.target.closest&&e.target.closest('[data-sec]');
    if(it&&(e.key==='Enter'||e.key===' ')&&e.target===it){e.preventDefault();select(it.getAttribute('data-sec'))}
    if(it&&(e.key==='ArrowDown'||e.key==='ArrowUp')){e.preventDefault();const i=SEC.indexOf(S.sel)+(e.key==='ArrowDown'?1:-1);const s=SEC[(i+SEC.length)%SEC.length];select(s);const n=document.querySelector(`[data-sec="${s}"]`);n&&n.focus()}
  });
  const sheet=$('sheet');
  sheet.addEventListener('mouseover',e=>{
    const sa=e.target.closest('[data-t]');
    if(sa){const k=sa.getAttribute('data-t').split(' ').filter(Boolean);if(k.length)light(sheet,k,true);return}
    const r=e.target.closest('.rw[data-k]');
    if(r&&!sheet.classList.contains('hlon')){light(sheet,[r.getAttribute('data-k')],false)}
  });
  sheet.addEventListener('mouseout',e=>{
    const sa=e.target.closest('[data-t]'),r=e.target.closest('.rw[data-k]');
    const to=e.relatedTarget;
    if(sa&&!(to&&sa.contains(to)))unlight(sheet);
    else if(r&&!(to&&r.contains(to))&&!sheet.classList.contains('hlon'))unlight(sheet);
  });
  addEventListener('resize',fit);
}

/* ===== 36-a: the mode lives in the Live Index entry ===== */
function setHTML(s){
  const m=MODE(s);
  return `<div class="set"><div class="si">
    <div class="modes" role="radiogroup" aria-label="${NAME[s]} mode"><i class="pill"></i>${MODES.map((w,i)=>`<button role="radio" aria-checked="${m===i}" data-mode="${s}:${i}">${w}</button>`).join('')}</div>
    <p class="rule">${rule(s)}</p>
    <div class="opts" role="radiogroup" aria-label="${NAME[s]} value">${VALS[s].map((v,i)=>`<button role="radio" aria-checked="${S.val[s]===i}" data-val="${s}:${i}">${v}</button>`).join('')}</div>
  </div></div>`;
}
function idxHTML(){
  return `<div class="leg"><i></i>Colored part = what each one acts on</div>`+SEC.map(s=>{
    const n=idxNum(s);
    return `<div class="it${S.sel===s?' sel':''} m${MODE(s)}" role="tab" tabindex="0" aria-selected="${S.sel===s}" data-sec="${s}" style="--c:${C[s]}"><div class="r1"><i class="dot" style="${dotStyle(s)}"></i><span class="nm">${NAME[s]}</span>${mini(s)}<span class="nb"><span class="n">${n.n}<u>${n.u}</u></span><span class="cp">${n.cp}</span></span></div>${setHTML(s)}</div>`;
  }).join('');
}

/* ----- hero graphs (tall, ftop columns) ----- */
const pct=(v,max)=>Math.max(0,Math.min(100,v/max*100));
function vstack(segs,max,cls){ // segs [{v,c,k}], bottom-up
  let b=0;return segs.map(s=>{const h=pct(s.v,max);const o=`<i class="seg${cls||''}"${s.k!=null?` data-k="${s.k}"`:''} style="bottom:${b}%;height:${h>0?`calc(${h}% - 2px)`:'0%'};background:${s.c};opacity:${h>0?1:0}"></i>`;b+=h;return o}).join('');
}
function heroGraph(s){
  const c=C[s], m=MODE(s), A=aff(s);
  if(s==='agents'){
    const L=[...AG.filter(a=>a.st==='w'),...AG.filter(a=>a.st==='n'),...AG.filter(a=>a.st==='f'),...AG.filter(a=>a.st==='i')];
    const all=[...L.map(a=>({k:a.id,col:g(a.id)?'rgba(255,255,255,.05)':a.st==='w'?(has('sleep',a.id)?'var(--g3)':c):a.st==='n'?'#fff':a.st==='f'?`color-mix(in srgb,${c} 38%,transparent)`:'var(--g2)'})),...Array.from({length:IDLE5},()=>({k:null,col:'var(--g2)'}))];
    const arcs=all.map((x,i)=>`<circle${x.k?` data-k="${x.k}"`:''} cx="84" cy="84" r="76" fill="none" stroke="${x.col}" stroke-width="8" stroke-linecap="round" pathLength="120" stroke-dasharray="6.4 113.6" transform="rotate(${-90+i*30+5} 84 84)"/>`).join('');
    const live=AG.filter(a=>!g(a.id)).length+IDLE5, w=AG.filter(a=>a.st==='w'&&!g(a.id)).length, f=finished().length;
    return `<svg class="aring" width="168" height="168" viewBox="0 0 168 168" aria-hidden="true">${arcs}</svg><div class="rc"><span class="n">${N(live,'i')}</span><span class="u">agents</span></div>
    <div class="rleg"><span><i style="background:${c}"></i><b>${N(w,'i')}</b> working</span><span><i style="background:#fff"></i><b>${N(g('judge')?0:1,'i')}</b> needs you</span><span><i style="box-shadow:inset 0 0 0 1.5px ${c}"></i><b>${N(f,'i')}</b> finished</span><span><i style="background:var(--g2)"></i><b>${N(IDLE5+(g('parity')?0:1),'i')}</b> idle</span></div>`;
  }
  if(s==='apps'){
    const cl=closeList(), L=LOAD(), M=MEM(), ns=sum(cl,cpuOf), nm=sum(cl,memOf), T=VN('apps');
    const ld=[{v:L-ns,c:'var(--g2)'},...APPS.map(a=>({v:cl.includes(a)?cpuOf(a):0,c,k:a.id}))];
    const mm=[{v:M-nm,c:'var(--g2)'},...APPS.map(a=>({v:cl.includes(a)?memOf(a):0,c,k:a.id}))];
    return `<div class="meter vm" style="left:0;width:56px">${vstack(ld,100)}<i class="tk" style="bottom:${T}%"></i></div>
      <span class="side" style="left:66px;bottom:calc(22px + ${T/100*222}px - 8px)"><b>${T} %</b></span>
      <div class="meter vm" style="left:110px;width:56px">${vstack(mm,32)}</div>
      <span class="vlab" style="left:0">Load</span><span class="vlab" style="left:110px">Memory</span>`;
  }
  if(s==='servers'){
    return `<div class="cols" style="height:222px;gap:6px">${SRV.map(x=>{const idle=x.idle&&!has('kept',x.id);const col=A.includes(x.id)?c:idle&&m?`color-mix(in srgb,${c} 40%,transparent)`:x.idle&&!has('kept',x.id)?'var(--g3)':'var(--g2)';return `<span class="col${g(x.id)?' gone':''}" data-k="${x.id}"><i style="height:${pct(x.mb,700)}%;background:${col}"></i></span>`}).join('')}</div>
      <div style="display:flex;gap:6px;margin-top:6px">${SRV.map(x=>`<span class="vlab" style="position:static;flex:1 1 0;min-width:0;text-align:center;letter-spacing:-.02em;opacity:${g(x.id)?.3:1}">${x.p.slice(1)}</span>`).join('')}</div>`;
  }
  if(s==='trees'){
    const all=[...WT,...WT_FINE.map((gb,i)=>({id:'f'+i,k:'f',gb}))];
    return `<div class="cols" style="height:244px;gap:4px">${all.map(w=>{const merged=w.k==='m'&&!has('kept',w.id);const col=A.includes(w.id)?c:merged?`color-mix(in srgb,${c} 40%,transparent)`:w.k==='u'?'var(--g3)':w.k==='s'?'var(--g2)':'rgba(255,255,255,.12)';return `<span class="col${g(w.id)?' gone':''}" data-k="${w.id}"><i style="height:${pct(w.gb,3.3)}%;background:${col}"></i></span>`}).join('')}</div>`;
  }
  if(s==='disk'){
    const U=USED(), safe=DK.filter(d=>d.safe), rest=DK.filter(d=>!d.safe);
    const segs=[...safe.map(d=>({v:g(d.id)?0:d.gb,c:has('kept',d.id)?'var(--g3)':c,k:d.id})),...rest.map(d=>({v:g(d.id)?0:d.gb,c:d.rep?'var(--g2)':`color-mix(in srgb,${c} 40%,transparent)`,k:d.id}))];
    const sg=sum(safe.filter(d=>!g(d.id)),d=>d.gb), rg=sum(rest.filter(d=>!g(d.id)),d=>d.gb);
    const H=188, sMid=pct(sg/2,38.4)/100*H, rMid=(pct(sg,38.4)+pct(rg/2,38.4))/100*H;
    return `<span class="vlab" style="top:0;bottom:auto">Disk <b>${N(Math.round(U),'i')}</b> / 994 GB used</span>
      <div class="meter" style="position:absolute;left:0;right:0;top:24px;height:6px">${(()=>{const r=reclaim();return `<i class="seg" style="left:0;top:0;bottom:0;width:calc(${pct(U-r,994)}% - 2px);background:var(--g2)"></i><i class="seg" data-k="${safeDK().map(d=>d.id).join(' ')}" style="left:${pct(U-r,994)}%;top:0;bottom:0;width:${pct(r,994)}%;background:${c}"></i>`})()}</div>
      <div class="meter vm" style="left:0;width:56px;top:56px;bottom:0">${vstack(segs,38.4)}</div>
      <span class="side" style="left:68px;bottom:${sMid-8}px;opacity:${sg?1:0}"><b>${NG(sg).n} ${NG(sg).u}</b> safe</span>
      <span class="side" style="left:68px;bottom:${rMid-8}px;opacity:${rg?1:0}"><b>${NG(rg).n} ${NG(rg).u}</b> look first</span>`;
  }
  if(s==='awake'){
    const T=VN('awake'), on=m&&holding().length, k=holding().map(a=>a.id).join(' ');
    return `<div class="meter vm" style="left:0;width:64px">${vstack([{v:m?T:0,c:'var(--g3)'},{v:64-(m?T:0),c:on?c:'var(--g3)',k}],100)}<i class="tk" style="bottom:${T}%;opacity:${T&&m?1:0}"></i></div>
      <span class="side" style="left:76px;bottom:calc(22px + ${T/100*222}px - 8px);opacity:${T&&m?1:0}">sleeps at <b>${T||20} %</b></span>
      <span class="vlab" style="left:0">Battery</span>`;
  }
}
function bigOf(s){
  if(s==='agents') return [N(AG.filter(a=>a.st==='w'&&!g(a.id)).length,'i'),'working'];
  if(s==='apps') return [N(Math.round(LOAD()),'i'),'% load'];
  if(s==='servers') return [N(idleSrv().length,'i'),'idle'];
  if(s==='trees'){const x=NG(sum(mergedWT(),w=>w.gb));return [x.n,`${x.u} merged`]}
  if(s==='disk'){const x=NG(sum(safeDK(),d=>d.gb));return [x.n,`${x.u} safe`]}
  return [N(64,'i'),'% battery'];
}
function capOf(s){
  const m=MODE(s), who=m===2?(s==='servers'?'Auto stops':'Auto removes'):'Ask shows';
  return {
    agents:`One arc per agent. Hollow pink: finished, still holding servers or a worktree.`,
    apps:`Colored: what ${m?MODES[m]:'Auto'} frees, <b>${Math.round(sum(closeList(),cpuOf))} %</b> load and <b>${fmt(sum(closeList(),memOf))}</b>. The line is the ${VS('apps')} rule.`,
    servers:`One column per server, height is memory.${m?` Bright: ${who} it now. Pale: idle less than ${VS('servers')}.`:''}`,
    trees:`One column per worktree, height is size.${m?` Bright: ${who} it now. Pale: merged less than ${VS('trees')} ago.`:''}`,
    disk:`Amber is what can go. Clean Safe takes the solid part, the rest needs a look first.`,
    awake:`${MODE('awake')&&VN('awake')?`Purple: the battery agents may use before it sleeps. `:''}On the power adapter. Also ends if the network drops or the Mac runs hot.`
  }[s];
}
function detHTML(){
  const s=S.sel, m=MODE(s), b=bigOf(s);
  const key=m?`<span class="key"><i style="${m===2?`background:${C[s]}`:`box-shadow:inset 0 0 0 1.5px ${C[s]}`}"></i>${m===2?'Auto acts on these':'Ask shows these'}</span>`:`<span class="key">${NAME[s]} is off</span>`;
  return `<div class="lab">Right now${key}</div>
  <p class="ins">${insight(s)}</p>
  <div class="split">
    <div class="hero">
      <div class="big"><span class="bn">${b[0]}</span><span class="bu">${b[1]}</span></div>
      <div class="graph">${heroGraph(s)}</div>
      <p class="cap">${capOf(s)}</p>
      <div class="sas">${sectionActs(s).map(saBtn).join('')}</div>
    </div>
    <div class="list r-${s}">${rowsFor(s)}</div>
  </div>`;
}
function inClass(){const s=S.sel;return `in m${MODE(s)}`}
function pills(){
  document.querySelectorAll('.modes').forEach(md=>{
    const on=md.querySelector('[aria-checked="true"]'),p=md.querySelector('.pill');
    if(on&&p){p.style.width=on.offsetWidth+'px';p.style.transform=`translateX(${on.offsetLeft}px)`}
  });
}
function render(){
  patch($('idx'),idxHTML());
  const inEl=$('in');inEl.className=inClass()+(inEl.classList.contains('swap')?' swap':'');
  inEl.style.setProperty('--c',C[S.sel]);
  $('det').classList.toggle('off',!MODE(S.sel));
  if(!inEl.classList.contains('swap')) patch(inEl,detHTML());
  pills();renderToday();renderIcons();
}
let swapT;
function select(s){
  if(S.sel===s)return;
  S.sel=s;unlight($('sheet'));
  const inEl=$('in');inEl.classList.add('swap');
  clearTimeout(swapT);
  swapT=setTimeout(()=>{inEl.innerHTML=detHTML();inEl.classList.remove('swap');render()},RM?0:200);
  patch($('idx'),idxHTML());pills();renderIcons();
}
function init(){
  wire();
  $('in').innerHTML=detHTML();
  render();fit();
  setTimeout(()=>{pills();aim()},60);
}
init();

</script>
