<title>Workstream Rivers</title>
<!--
COMPOSITION PLAN: "Every tab its own composition" + Workstreams (variant b)

Workstreams  (variant b, opens first) Time rivers. Each workstream is a horizontal river on one
            shared time axis (log scale: 1 week ago on the left, now on the right). Working rivers flow
            into "now"; needs-you ends in a white ping; idle thins out; Ready rivers end at their merge
            dot and trail a dotted "still holds" tail to now, where a holdings column shows what each
            still holds. The setting IS the axis: the value (1 h / 1 day / 1 week) is a white line
            through every river, picked on the axis labels, and a merge dot left of the line is due.
            The mode words, rule and live countdown hang above the line like a flag.
            Reading: "2 ready" -> flag -> white line down through the rivers -> the two ended
            rivers left of it -> what they still hold -> Wrap Up 2 Now.

LIVE (owner update)  The sheet runs a calm simulation: ages and idle timers tick, the menu bar clock moves,
            and every 6-8 s something arrives or leaves (a speed-3 subagent, :5174 vite, media-scope's
            tests pass, studio-icons finishes and folds away, docs-sweep arrives with a "New" glow).
            A live line in the head says what just happened, with Pause. Every setting carries a live
            "next" line with a countdown ("Auto stops :6006 at the next check, in 54 s"); at the check,
            sections on Auto really act and send a notice with Undo. Hovering a mode word rewrites the rule
            in place to say what that mode will do. Section buttons say exactly what they do
            ("Stop 3 Servers Now · 1.45 GB"); hovering one shows Goes / Stays before anything happens.
            Keep Awake left the index and tabs: one checkbox in the footer, "Keep working with the lid
            closed", with a gray note on 20 % battery, Wi-Fi and heat.

System shared by every tab
  Sheet 900 x 700, hangs from its menu bar icon. Left = Live Index (316 px, 6 entries), right = the pane (508 x 600).
  Type: 11 caption / 13 body / 24 display (index names + mode words) / 40 ftop number. Nothing else.
  Spacing scale 4 8 12 16 24 32. Section color is the only accent per tab.
  The setting is always the same three parts: mode words Off Ask Auto (24, sliding underline),
  one rule sentence (13), the value. Where it sits, and where the value lives, depends on the tab.

Agents      Grid of agent cards, 3 x 3 (each names its workstream; the setting now says when to tell you an agent waits). Focal: the big "4 working" and the grid.
            Reading: number -> insight -> cards row by row -> the finished card bottom-left.
            Setting = the last two cells of the grid, right beside the finished agent it acts on,
            joined by a short pink line. Section action Wrap Up Finished closes the grid on the right.
Apps        ftop columns hero. Left column = the setting: mode words, rule, then the load column
            (63 %) whose white tick IS the threshold; 60/70/80/90 sit on its ruler. Right: insight,
            one column per app (height = memory, blue = what Auto closes). Actions under the hero.
Servers     A ring of six port badges. Each arc fills toward the moment Auto stops it, so the
            setting sits in the hub: every arc is measured against the value in the middle.
            Close Idle top right, insight top left.
Worktrees   A forest of 14 columns grouped merged / fine / in use / stale (height = size).
            Setting hangs in the sky over the merged group, with a bracket down onto the trees it
            removes. Insight + Remove Merged on top.
Disk        One thin disk bar 812/994 GB zooms into one huge split bar of the 38.4 GB clutter.
            Under the bar two brackets: the safe 30.1 GB carries the setting (how often),
            the rest lists what asks first. Big number + Clean Safe on top.
Keep Awake  Removed as a tab: one footer checkbox (see LIVE).
-->

const nm2=a=>a.length>2?a.slice(0,-1).join(', ')+' and '+a[a.length-1]:a.join(' and ');
/* the live "what happens next" line under every setting */
function nextTxt(id,m){

    const w=r.slice().sort((a,b)=>b.fin-a.fin)[0];return `${A('Auto wraps up','Auto would wrap up')} <b>${w.n}</b> in ${dur((num('ws')-w.fin)*60)}`}

    return `${A('Brings','Sends a notice about')} <b>lexicon-judge</b>${m===2?' to the front':''} in ${dur(left)}`}
  if(id==='apps'){const n=noise();if(!n.length)return 'Nothing left to quit.';
    return `${A('Auto quits','Auto would quit')} ${nm2(n.map(a=>'<b>'+a.n.replace('Google ','')+'</b>'))} once load passes ${num('apps')}&nbsp;%. Now ${LOAD()}&nbsp;%.`}
  if(id==='servers'){const idle=idleSrv();if(!idle.length)return 'No idle servers.';

    const x=idle.slice().sort((a,b)=>b.idle-a.idle)[0];return `${A('Auto stops','Auto would stop')} <b>:${x.p}</b> in ${dur((th-x.idle)*60)}`}
  if(id==='trees'){const mg=mergedWT();if(!mg.length)return 'No merged worktrees left.';

function clock(min){const t=16*60+42+min;return `${String(Math.floor(t/60)%24).padStart(2,'0')}:${String(Math.round(t%60)).padStart(2,'0')}`}

/* ---------- item actions ---------- */
function act(id,v){
  const o=byId[id],nm=o.n||(':'+o.p);
  if(WS.includes(o)) return actWS(id,v);
  const msgs={
    tab:`Opened <b>${nm}</b> in its ${o.w}.`,open:`Opened <b>localhost:${o.p}</b> in the browser.`,finder:`Showed <b>${nm}</b> in Finder.`,editor:`Opened <b>${nm}</b> in Cursor.`
  };
  if(v==='goag'||v==='gows'){go(o.ws,true);hideCard();return}
  if(msgs[v]){ if(v==='tab'&&id==='lexicon') {push(); fl('lexicon').seen=1; paint(); toast(msgs[v]);} else toast(msgs[v],true); return;}
  const OUT=['quit','stop','rm','clean','wrap1'];
  const doIt=()=>{
    push();
    let m='';
    switch(v){
      case 'quit':fl(id).gone=1;m=`Quit <b>${nm}</b>. Freed ${fmt(memOf(o))}.`;break;
      case 'trim':fl('chrome').trim=1;m=`Closed 14 noise tabs in <b>Chrome</b>. 31 work tabs stay.`;break;
      case 'list':fl(id).list=1;m=`<b>${nm}</b> is on the close list.`;break;
      case 'keep':fl(id).keep=1;m=`<b>${nm}</b> stays.`;break;
      case 'unkeep':fl(id).keep=0;m=`<b>${nm}</b> is back on the plan.`;break;
      case 'restore1':case 'restart':case 'undorm':case 'undocl':fl(id).gone=0;m=`Brought back <b>${nm}</b>.`;break;
      case 'stop':fl(id).gone=1;m=`Stopped <b>:${o.p} ${o.k}</b>. Freed ${o.mb} MB.`;break;
      case 'rm':fl(id).gone=1;m=`Moved <b>${nm}</b> to the Trash${id==='wt-bp8'?' after a git bundle':''}. Freed ${fmt(o.gb)}.`;break;
      case 'clean':fl(id).gone=1;m=`Cleaned <b>${nm}</b>. Freed ${fmt(o.gb)}.`;break;
      case 'wrap1':m=wrap(o);break;
      case 'undo':unwrapWS(byId[o.ws]);m=`Brought back <b>${byId[o.ws].n}</b> with its server, worktree and caches.`;break;
      case 'sleep1':fl(id).sleep=1;m=`<b>${nm}</b> no longer keeps the Mac awake.`;break;
      case 'wake':fl(id).sleep=0;m=`<b>${nm}</b> keeps the Mac awake again.`;break;
      case 'k1h1':st.k1h=1;m=`The Mac stays awake until <b>17:42</b>.`;break;
      case 'stopag':agSrv(id).forEach(x=>fl(x.id).gone=1);m=`Stopped the servers of <b>${nm}</b>.`;break;
    }
    paint();toast(m);
  };
  hideCard();
  if(OUT.includes(v)){outgo([id]);setTimeout(doIt,RM?0:320)} else doIt();
}
const agSrvAll=id=>SRV.filter(x=>x.ag===id);

}
let dirty=false;
const busy=()=>$('hc').classList.contains('show')||planOn||pvOn||$('pane').classList.contains('hlon');
function simTick(){
  if(!SIM.paused){
    SIM.t++;
    const ev=SCRIPT.find(e=>e[0]===SIM.t);if(ev){EV[ev[1]]();dirty=true}
    if(SIM.t>60&&(SIM.t-60)%8===0){EV[LOOP[((SIM.t-60)/8-1)%LOOP.length]]();dirty=true}
    if(nextCheck()===300||SIM.t===60){if(runCheck())dirty=true}
    if(!has('lexicon','seen')&&!SIM.told&&md('agents')>0&&waited('lexicon')>=num('agents')){SIM.told=1;toast(md('agents')===2?`Brought <b>lexicon-judge</b>&rsquo;s tab to the front. It asks: &ldquo;Allow npm run build?&rdquo;`:`<b>lexicon-judge</b> has waited ${val('agents')} for you: &ldquo;Allow npm run build?&rdquo;`,true);log(`Told you <b>lexicon-judge</b> waits`)}
    if(settle())dirty=true;
    if(SIM.t%5===0)dirty=true;
  }
  if(dirty&&!busy()){dirty=false;paint()}
  tickTexts();
}
setInterval(simTick,1000);
$('lid').onclick=()=>{st.lid=!st.lid;$('lid').setAttribute('aria-checked',st.lid);tickTexts();toast(st.lid?'Close the lid and your agents keep working. Stops at 20&nbsp;% battery, if Wi-Fi drops, or if the Mac runs hot.':'The Mac sleeps when you close the lid, as usual.',true)};

/* ---------- stage scale ---------- */
function scale(){return parseFloat(stage.dataset.s||1)}
function fit(){const s=Math.min(innerWidth/1280,innerHeight/800);stage.dataset.s=s;stage.style.transform=`translate(${(innerWidth-1280*s)/2}px,${(innerHeight-800*s)/2}px) scale(${s})`;renderMenu()}
addEventListener('resize',fit);
const q=new URLSearchParams(location.search).get('tab');if(q&&sec(q))st.sel=q;
paint();fit();tickTexts();
document.fonts&&document.fonts.ready.then(()=>placeBars($('pane')));
</script>
</body>
