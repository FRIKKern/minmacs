<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>One Panel, Medium</title>
<style>
:root{
  --glass:rgba(27,28,39,.84);
  --line:rgba(255,255,255,.07);
  --tx:rgba(255,255,255,.93);
  --tx2:rgba(235,235,245,.5);
  --tx3:rgba(235,235,245,.3);
  --mm:#5B9BFF;--lh:#3FD0B8;--wf:#4CC96B;--nn:#F2B544;--in:#B18CFF;
  --ease:cubic-bezier(.3,.7,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#1a1636}
body{font-family:-apple-system,"SF Pro Text",system-ui,sans-serif;color:var(--tx);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;font-size:13px;cursor:default;user-select:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
#stage{position:absolute;left:0;top:0;width:1280px;height:800px;transform-origin:0 0;overflow:hidden;
  background:
   radial-gradient(760px 560px at 10% 6%,#4b3c9e 0%,rgba(75,60,158,0) 70%),
   radial-gradient(700px 520px at 84% 2%,#22618f 0%,rgba(34,97,143,0) 70%),
   radial-gradient(820px 620px at 88% 104%,#a0436f 0%,rgba(160,67,111,0) 70%),
   radial-gradient(640px 520px at 18% 100%,#3a2463 0%,rgba(58,36,99,0) 75%),
   #1d1a3c}

/* menu bar */
.mb{position:absolute;left:0;right:0;top:0;height:26px;display:flex;align-items:center;justify-content:space-between;padding:0 10px 0 16px;background:rgba(18,14,40,.32);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);font-size:13px;color:rgba(255,255,255,.92)}
.mb-l,.mb-r{display:flex;align-items:center;gap:18px}
.mb-l b{font-weight:700}
.mb-r{gap:14px}
.mbi{display:flex;align-items:center;gap:5px;height:22px;padding:0 7px;border-radius:5px}
.mbi.on{background:rgba(255,255,255,.2)}
.mbi .n{font-size:12.5px}
.mbi .n small{color:rgba(255,255,255,.5);font-size:12px}
.mb-sep{width:8px}

/* panel */
.panel{position:absolute;top:34px;right:12px;width:1020px;padding:22px 24px 14px;background:var(--glass);backdrop-filter:blur(34px) saturate(1.5);-webkit-backdrop-filter:blur(34px) saturate(1.5);border:1px solid rgba(255,255,255,.085);border-radius:22px;box-shadow:0 30px 90px rgba(6,4,24,.5),inset 0 1px 0 rgba(255,255,255,.035)}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));column-gap:28px;row-gap:26px}
.blk{display:flex;flex-direction:column;min-width:0}
.blk.mm{grid-column:span 2;flex-direction:row;gap:26px}
.mm .meters{width:216px;flex:none;display:flex;flex-direction:column}
.mm .apps{flex:1;min-width:0;display:flex;flex-direction:column}
.hd{display:flex;align-items:center;gap:10px;height:30px;margin-bottom:12px}
.hd .r{margin-left:auto;font-size:12px;color:var(--tx2)}
.big{font-size:22px;font-weight:500;letter-spacing:-.01em;line-height:1}
.unit{font-size:13px;color:var(--tx2);margin-left:3px}
.bdg{position:relative;display:inline-block;width:30px;height:30px;flex:none}
.bdg>svg{position:absolute;left:0;top:0}
.bdg .g{position:absolute;inset:0;display:grid;place-items:center}
.arc{transition:stroke-dasharray .9s var(--ease)}

/* cores + memory */
.cols{display:flex;align-items:flex-end;height:112px;gap:5px}
.cols .gap{width:6px}
.col{width:16px;height:100%;border-radius:5px;background:rgba(255,255,255,.065);position:relative;overflow:hidden}
.col i{position:absolute;left:0;right:0;bottom:0;border-radius:5px;background:var(--mm);transition:height 1.1s var(--ease)}
.col.e i{background:#93BEFF}
.col b{position:absolute;left:3px;right:3px;height:2px;border-radius:1px;background:rgba(255,255,255,.85);transition:bottom 1.1s var(--ease)}
.mem{margin-top:18px}
.mem .hd{margin-bottom:10px}
.mbar{height:6px;border-radius:3px;background:rgba(255,255,255,.08);position:relative;overflow:hidden}
.mbar i{position:absolute;top:0;bottom:0;left:0;transition:width .9s var(--ease)}
.mline{display:flex;justify-content:space-between;margin-top:9px;font-size:12px;color:var(--tx2)}
.mline b{color:var(--tx);font-weight:500}

/* rows */
.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:8px;height:28px;max-height:28px;margin:0 -7px;padding:0 7px;border-radius:8px;overflow:hidden;white-space:nowrap;
  transition:max-height .45s var(--ease),opacity .3s,transform .45s var(--ease),background .2s}
.row:hover{background:rgba(255,255,255,.045)}
.row:active{transform:scale(.985)}
.row.gone{max-height:0;opacity:0;transform:translateX(14px);pointer-events:none}
.row.rel{background:rgba(255,255,255,.07)}
.nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.nm .sub{color:var(--tx2);font-size:12px;margin-left:3px}
.ft{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--tx2)}
.ft svg{flex:none}
.v{text-align:right;width:52px;flex:none}
.v.c{width:40px}
.v small,.pill small,.unit2{color:var(--tx2);font-size:12px;margin-left:2px}
.blk.preview .row:not(.plan){opacity:.36}
.blk.preview .row.plan{background:color-mix(in srgb,var(--c) 14%,transparent)}
.cap{font-size:11px;color:var(--tx3);text-align:right;flex:none}
.more{font-size:12px;color:var(--tx3);height:24px;display:flex;align-items:center}
.foot{margin-top:auto;padding-top:12px;display:flex;gap:8px;align-items:center}
.kept{display:flex;align-items:center;gap:6px;height:30px;margin-top:4px}
.kept .lb{font-size:12px;color:var(--tx2);margin-right:4px;display:flex;align-items:center;gap:5px}
.ki{transition:width .45s var(--ease),opacity .35s,margin .45s;width:20px;overflow:hidden;border-radius:5.5px}
.ki.gone{width:0;opacity:0;margin-left:-6px}

/* pills */
.pill{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 14px;border-radius:15px;font-weight:500;white-space:nowrap;
  background:color-mix(in srgb,var(--c) 17%,transparent);color:var(--c);transition:background .2s,opacity .2s,transform .15s}
.pill:hover{background:color-mix(in srgb,var(--c) 26%,transparent)}
.pill:active{transform:scale(.97)}
.pill small{margin-left:0}
.pill.ghost{background:rgba(255,255,255,.07);color:var(--tx)}
.pill.ghost:hover{background:rgba(255,255,255,.12)}
.pill[disabled]{opacity:.4;pointer-events:none}

/* icons */
.ai{width:20px;height:20px;border-radius:5.5px;flex:none;position:relative;display:grid;place-items:center;overflow:hidden}
.ai.r{border-radius:50%}
.ai.bd{box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)}
.ai svg{display:block}
.ai .lt{font-size:10px;font-weight:700;color:#fff;letter-spacing:-.02em}

/* agents */
.ag .row{height:26px;max-height:26px}
.ag .row.gone{max-height:0}
.ag .ft{width:90px;flex:none}
.ag .row.wait .ft{color:#FFB37A}
.hold{display:flex;align-items:center;justify-content:flex-end;gap:6px;width:56px;flex:none;font-size:11.5px;color:var(--tx2)}
.hold span{display:flex;align-items:center;gap:2px}

/* insomnia, one line */
.aw{display:flex;align-items:center;gap:16px;margin-top:18px;padding-top:12px;border-top:1px solid var(--line);height:46px;white-space:nowrap}
.aw .lead{display:flex;align-items:center;gap:10px;padding:4px 8px 4px 4px;margin-left:-4px;border-radius:10px;transition:background .2s}
.aw .lead:hover{background:rgba(255,255,255,.05)}
.aw .lead b{font-size:15px;font-weight:500}
.aw .why{font-size:12px;color:var(--tx2)}
.aw .why em{font-style:normal;color:var(--in)}
.aw .gd{display:flex;align-items:center;gap:12px;font-size:12px;color:var(--tx2);padding-left:16px;border-left:1px solid var(--line);height:24px}
.aw .gd .g1{display:flex;align-items:center;gap:5px;padding:3px 6px;margin:0 -6px;border-radius:7px}
.aw .gd .g1:hover{background:rgba(255,255,255,.05)}
.aw .gd .lb{color:var(--tx3)}
.aw .end{margin-left:auto;display:flex;gap:14px;align-items:center}
.sw{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--tx2)}
.sw i{width:26px;height:15px;border-radius:8px;background:rgba(255,255,255,.14);position:relative;transition:background .2s}
.sw i::after{content:"";position:absolute;left:2px;top:2px;width:11px;height:11px;border-radius:50%;background:#fff;transition:transform .2s var(--ease)}
.sw.on i{background:var(--in)}
.sw.on i::after{transform:translateX(11px)}
.row.rel{background:rgba(255,255,255,.07)}

/* toast */
.toast{position:absolute;left:50%;top:calc(100% + 12px);transform:translate(-50%,-10px);opacity:0;pointer-events:none;display:flex;align-items:center;gap:14px;height:40px;padding:0 5px 0 16px;border-radius:20px;
  background:rgba(44,45,60,.97);border:1px solid rgba(255,255,255,.1);box-shadow:0 14px 40px rgba(0,0,0,.4);font-size:13px;white-space:nowrap;transition:opacity .3s,transform .4s var(--ease);z-index:5}
.toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast .ok{width:16px;height:16px;border-radius:50%;background:rgba(76,201,107,.2);display:grid;place-items:center}
.toast .pill{height:30px;--c:#fff}

/* hover card */
.card{position:absolute;z-index:30;width:300px;padding:14px 16px 14px;border-radius:16px;background:rgba(34,35,48,.96);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);border:1px solid rgba(255,255,255,.1);box-shadow:0 20px 60px rgba(4,3,20,.55);
  opacity:0;transform:translateY(4px) scale(.985);transition:opacity .16s,transform .2s var(--ease);pointer-events:none}
.card.on{opacity:1;transform:none;pointer-events:auto}
.card h4{font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px}
.card .st{font-size:12px;margin-top:5px;color:var(--c)}
.card dl{display:grid;grid-template-columns:auto 1fr;column-gap:16px;row-gap:6px;margin:12px 0 0;font-size:12px}
.card dt{color:var(--tx2)}
.card dd{text-align:right}
.card .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
.card .acts .pill{height:26px;padding:0 10px;font-size:12px}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important}
}
</style>
</head>
<body>
<div id="stage">
  <div class="mb">
    <div class="mb-l">
      <svg viewBox="0 0 17 20" width="13" height="16" aria-hidden="true"><path fill="#fff" d="M14.1 10.6c0-2.6 2.1-3.8 2.2-3.9-1.2-1.8-3.1-2-3.7-2-1.6-.2-3.1.9-3.9.9-.8 0-2-.9-3.4-.9C3.6 4.8 1.9 5.8 1 7.4c-1.9 3.3-.5 8.2 1.4 10.9.9 1.3 2 2.8 3.4 2.7 1.4-.1 1.9-.9 3.5-.9s2.1.9 3.5.9c1.5 0 2.4-1.3 3.3-2.7 1-1.5 1.5-3 1.5-3.1-.1 0-2.9-1.1-2.9-4.3zM11.5 3c.7-.9 1.2-2.1 1.1-3.3-1 0-2.3.7-3 1.6-.7.8-1.3 2-1.1 3.2 1.1.1 2.3-.6 3-1.5z"/></svg>
      <b>cmux</b><span>File</span><span>Edit</span><span>View</span><span>Window</span><span>Help</span>
    </div>
    <div class="mb-r" id="mbr"></div>
  </div>

  <div class="panel" id="panel">
    <div class="grid">
      <section class="blk mm" id="b-mm" style="--c:var(--mm)"></section>
      <section class="blk ag" id="b-ag" style="--c:#fff"></section>
      <section class="blk lh" id="b-lh" style="--c:var(--lh)"></section>
      <section class="blk wf" id="b-wf" style="--c:var(--wf)"></section>
      <section class="blk nn" id="b-nn" style="--c:var(--nn)"></section>
    </div>
    <div class="aw" id="aw"></div>
    <div class="toast" id="toast"></div>
  </div>
  <div class="card" id="card"></div>
</div>

<script>
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const C = {mm:'#5B9BFF',lh:'#3FD0B8',wf:'#4CC96B',nn:'#F2B544',in:'#B18CFF'};
const GRAY = 'rgba(235,235,245,.55)';

/* ---------- glyphs ---------- */
const G = {
  mm:'<rect x="4.2" y="4.2" width="7.6" height="7.6" rx="1.6"/><path d="M6.6 1.8v2.4M9.4 1.8v2.4M6.6 11.8v2.4M9.4 11.8v2.4M1.8 6.6h2.4M1.8 9.4h2.4M11.8 6.6h2.4M11.8 9.4h2.4"/>',
  mem:'<rect x="2" y="4.5" width="12" height="6" rx="1.4"/><path d="M4.5 10.5v2M7 10.5v2M9.5 10.5v2M12 10.5v2M5 7h0M8 7h0M11 7h0"/>',
  lh:'<rect x="2.5" y="2.8" width="11" height="4.2" rx="1.4"/><rect x="2.5" y="9" width="11" height="4.2" rx="1.4"/><path d="M5.2 4.9h.01M5.2 11.1h.01" stroke-width="2.2"/>',
  wf:'<circle cx="4.6" cy="3.6" r="1.6"/><circle cx="4.6" cy="12.4" r="1.6"/><circle cx="11.4" cy="5.4" r="1.6"/><path d="M4.6 5.2v5.6M11.4 7c0 2.7-2.4 3.4-5.4 4.2"/>',
  nn:'<path d="M12.6 2.2 8.9 5.9"/><path d="M7.2 6.2l2.6 2.6-1.3 4.6c-.1.4-.6.6-.9.3L2.3 8.4c-.3-.3-.2-.8.3-.9z"/><path d="M5 9.4l-1.4 1.4M6.8 11.2l-1.2 1.2"/>',
  in:'<path d="M1.8 8s2.3-4.3 6.2-4.3S14.2 8 14.2 8s-2.3 4.3-6.2 4.3S1.8 8 1.8 8z"/><circle cx="8" cy="8" r="1.9"/>',
  bat:'<rect x="1.8" y="5" width="10.6" height="6" rx="1.6"/><path d="M14.2 7v2"/><path d="M4 7.2v1.6M6 7.2v1.6M8 7.2v1.6" />',
  plug:'<path d="M5.5 2v3M10.5 2v3M4 5h8v2.5a4 4 0 0 1-8 0zM8 11.5V14"/>',
  therm:'<path d="M6.4 9.6V3.4a1.6 1.6 0 1 1 3.2 0v6.2a2.8 2.8 0 1 1-3.2 0z"/><path d="M8 7v4.2"/>',
  lid:'<path d="M3 4.5h10v6H3z"/><path d="M1.5 12.5h13"/>',
  net:'<path d="M2 6.3a8.6 8.6 0 0 1 12 0M4.2 8.6a5.4 5.4 0 0 1 7.6 0M6.5 10.9a2.1 2.1 0 0 1 3 0"/><path d="M8 13h.01" stroke-width="2"/>',
  bolt:'<path d="M8.8 1.8 3.6 9h4l-.8 5.2L12.4 7h-4z"/>',
  review:'<path d="M2.5 3.5h11v7h-6l-3 2.5v-2.5h-2z"/><path d="M5.5 7l1.5 1.4L10.5 5.6"/>',
  check:'<path d="M4 8.3l2.6 2.5L12 5.4"/>',
  ag:'<rect x="1.8" y="2.8" width="12.4" height="10.4" rx="2.2"/><path d="M4.7 6.3 6.8 8l-2.1 1.7M8.4 10h2.9"/>',
  sort:'<path d="M3 4.5h10M3 8h7M3 11.5h4"/>'
};
function gl(k,c,s){s=s||16;return `<svg viewBox="0 0 16 16" width="${s}" height="${s}" fill="none" stroke="${c}" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${G[k]}</svg>`}
const RA = 13.2, LA = 2*Math.PI*RA;
function dash(p){return `${(LA*Math.max(0,Math.min(1,p))).toFixed(2)} ${LA.toFixed(2)}`}
function badge(k,c,p,id,gk){
  return `<span class="bdg"><svg viewBox="0 0 30 30" width="30" height="30" aria-hidden="true"><circle cx="15" cy="15" r="14.2" fill="rgba(255,255,255,.065)"/>${p==null?'':`<circle cx="15" cy="15" r="${RA}" fill="none" stroke="${c}" stroke-opacity=".2" stroke-width="2"/><circle ${id?`id="${id}"`:''} class="arc" cx="15" cy="15" r="${RA}" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round" transform="rotate(-90 15 15)" style="stroke-dasharray:${dash(p)}"/>`}</svg><span class="g">${gl(gk||k,c,15)}</span></span>`;
}
function mk(t,c){
  const P = {
    use:`<circle cx="5" cy="5" r="3.2" fill="${c}" stroke="none"/>`,
    idle:`<circle cx="5" cy="5" r="3.1"/>`,
    merged:`<path d="M1.9 5.3l2.1 2.1 4.2-4.8"/>`,
    stale:`<path d="M5 1.7 8.7 8.2H1.3z"/>`,
    kept:`<rect x="2" y="2" width="6" height="6" rx="1.2" fill="${c}" stroke="none"/>`,
    spared:`<path d="M5 1.2 8.4 2.5v2.7c0 2-1.4 3.3-3.4 3.7C3 8.5 1.6 7.2 1.6 5.2V2.5z"/>`,
    trim:`<circle cx="5" cy="5" r="3.1"/><path d="M5 1.9a3.1 3.1 0 0 1 0 6.2z" fill="${c}" stroke="none"/>`,
    unsorted:`<circle cx="5" cy="5" r="3.1" stroke-dasharray="1.5 1.3"/>`,
    ask:`<rect x="2.4" y="2.4" width="5.2" height="5.2" rx="1" transform="rotate(45 5 5)"/>`,
    report:`<path d="M1.8 5h6.4"/>`,
    done:`<circle cx="5" cy="5" r="3.6"/><path d="M3.3 5.1l1.2 1.2 2.2-2.5"/>`
  };
  return `<svg viewBox="0 0 10 10" width="10" height="10" fill="none" stroke="${c}" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${P[t]}</svg>`;
}

/* ---------- app / tool icons ---------- */
const sv = (b)=>`<svg viewBox="0 0 20 20" width="20" height="20" aria-hidden="true">${b}</svg>`;
const lt = (bg,t,extra)=>`<span class="ai ${extra||''}" style="background:${bg}"><span class="lt">${t}</span></span>`;
const IC = {
  chrome:`<span class="ai r" style="background:conic-gradient(from 30deg,#EA4335 0 120deg,#34A853 0 240deg,#FBBC05 0)"><i style="position:absolute;inset:6px;border-radius:50%;background:#4A8BF5;box-shadow:0 0 0 1.6px #fff"></i></span>`,
  cft:`<span class="ai r" style="background:conic-gradient(from 30deg,#E6B33C 0 120deg,#C8CCD1 0 240deg,#979CA3 0)"><i style="position:absolute;inset:6px;border-radius:50%;background:#5C6168;box-shadow:0 0 0 1.6px #fff"></i></span>`,
  spotify:`<span class="ai r" style="background:#1ED760">${sv('<g fill="none" stroke="#0c0c0c" stroke-linecap="round"><path d="M5.3 8c3-1 6.6-.8 9.2.8" stroke-width="1.7"/><path d="M5.9 10.8c2.6-.7 5.4-.5 7.6.7" stroke-width="1.45"/><path d="M6.5 13.4c2-.5 4.1-.3 5.8.5" stroke-width="1.25"/></g>')}</span>`,
  figma:`<span class="ai bd" style="background:#1e1e22">${sv('<circle cx="8.2" cy="5.4" r="2.1" fill="#F24E1E"/><circle cx="11.8" cy="5.4" r="2.1" fill="#FF7262"/><circle cx="8.2" cy="9.6" r="2.1" fill="#A259FF"/><circle cx="11.8" cy="9.6" r="2.1" fill="#1ABCFE"/><circle cx="8.2" cy="13.8" r="2.1" fill="#0ACF83"/>')}</span>`,
  raycast:`<span class="ai" style="background:linear-gradient(135deg,#FF6363,#C92F3D)">${sv('<path d="M5.5 11.5 11.5 5.5M8.5 14.5l6-6" stroke="#fff" stroke-width="2.1" stroke-linecap="round"/>')}</span>`,
  cmux:`<span class="ai bd" style="background:#14151b">${sv('<path d="M5.6 7l3 3-3 3M10.4 13.4H14" fill="none" stroke="#7FE0C3" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>')}</span>`,

function tween(id,to,dec,suffix){

  if (RM || from===to){ el.innerHTML = to.toFixed(dec)+(suffix||''); return }
  const t0 = performance.now(), d=700;
  cancelAnimationFrame(el._raf);
  const step = (t)=>{ const k=Math.min(1,(t-t0)/d), e=1-Math.pow(1-k,3); el.innerHTML=(from+(to-from)*e).toFixed(dec)+(suffix||''); if(k<1) el._raf=requestAnimationFrame(step) };
  el._raf = requestAnimationFrame(step);
}
function arc(id,p){const el=document.getElementById(id); if(el) el.style.strokeDasharray=dash(p)}
const live = (ex,f)=>ROWS[ex].filter(r=>!r.gone&&(!f||f(r)));
const plan = (ex,key)=>live(ex,r=>r.plan===key&&!r.kept);
function setPill(id,label,rs,extra){
  const el=document.getElementById(id);
  if(!rs.length){ el.innerHTML=`${label}<small>nothing left</small>`; el.disabled=true; return }
  el.disabled=false; el.innerHTML=`${label}<small>${extra||rs.length+' · '+gbPlain(sum(rs,r=>r.gb))}</small>`;
}
function apply(){
  for(const id in ALL){ const r=ALL[id]; let el=document.getElementById('r-'+id); if(!el) continue;
    if(r._rk===undefined) r._rk=!!r.kept;
    if(r._rk!==!!r.kept){ r._rk=!!r.kept; const tmp=document.createElement('div'); tmp.innerHTML=rowHTML(r); const n=tmp.firstChild; el.replaceWith(n); el=n; }
    el.classList.toggle('gone',!!r.gone);
  }
  // MinMacs
  const gm = ROWS.mm.filter(r=>r.gone);
  const load = 63 - sum(gm,r=>r.cpu), mem = 24.1 - sum(gm,r=>r.gb);
  tween('n-load',load,0); tween('mb-load',load,0,'<small>%</small>'); arc('arc-mm',load/100);
  tween('n-mem',mem,1); arc('arc-mem',mem/32);
  const used = Math.max(0,mem-3.4)/32*100;
  document.getElementById('mb-used').style.width = used+'%';
  document.getElementById('mb-comp').style.left = used+'%';
  document.getElementById('k-chrome').classList.toggle('gone', !ALL.chrome.gone);
  const pn = plan('mm','now');
  setPill('pl-now','MinMacs Now',pn, pn.length? `${Math.round(sum(pn,r=>r.cpu))} % · ${gbPlain(sum(pn,r=>r.gb))}`:'');
  // LocoHost
  const ll = live('lh'), li = plan('lh','idle');
  tween('n-lh',ll.length,0); arc('arc-lh', ll.length? li.length/ll.length:0);
  tween('mb-lh',li.length,0);
  setPill('pl-idle','Close Idle',li);
  // WorkForest
  const wl = 14 - ROWS.wf.filter(r=>r.gone).length, wa = live('wf',r=>r.mark==='merged'||r.mark==='stale');
  tween('n-wf',wl,0); arc('arc-wf',wa.length/wl);
  setPill('pl-merged','Remove Merged',plan('wf','merged'));
  // Noo-Noo
  const ng = sum(ROWS.nn.filter(r=>r.gone),r=>r.gb);
  tween('n-free',182+ng, ng?1:0); tween('n-rec',38.4-ng,1); arc('arc-nn',(812-ng)/994);
  const ns = plan('nn','safe');
  setPill('pl-safe','Clean Safe',ns, ns.length? gbPlain(sum(ns,r=>r.gb))+' to Trash':'');
  // agents + awake
  ALL_AG.auth.gone = !!wrapped;
  document.getElementById('a-auth').classList.toggle('gone', !!wrapped);
  tween('n-ag', AG_TOTAL - (wrapped?1:0), 0);
  const wrapGb = (ALL.p4000.gone?0:.29) + (ALL['w-auth'].gone?0:1.8);
  setPill('pl-wrap','Wrap Up Finished', wrapped?[]:[1], wrapGb? '1 agent · '+gbPlain(wrapGb) : '1 agent');
  setAwake(awake);
}
const ALL_AG = {}; AG.forEach(a=>ALL_AG[a.id]=a);
let wrapped=false;

/* ---------- toast + undo ---------- */
let toastT, undoFn=null;
function toast(msg,undo){
  const t=document.getElementById('toast');
  undoFn = undo;
  t.innerHTML = `<span class="ok">${gl('check','#4CC96B',12)}</span><span>${msg}</span>${undo?'<button class="pill ghost" id="undo">Undo</button>':''}`;
  t.classList.add('on'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('on'),9000);
  const u=document.getElementById('undo'); if(u) u.onclick=()=>{ t.classList.remove('on'); const f=undoFn; undoFn=null; f&&f(); };
}
function goRows(rs,msg){
  rs.forEach(r=>r.gone=true); apply(); hideCard(true);
  toast(msg,()=>{ rs.forEach(r=>r.gone=false); apply(); });
}
const VERB={mm:'Closed',lh:'Closed',wf:'Removed',nn:'Cleaned'};
const ACT = {
  now:()=>{const rs=plan('mm','now'); const w=rs.map(r=>r.done).join(', '); goRows(rs,`${w[0].toUpperCase()+w.slice(1)} · ${gbPlain(sum(rs,r=>r.gb))} back`)},
  idle:()=>{const rs=plan('lh','idle'); goRows(rs,`Closed ${rs.length} idle server${rs.length>1?'s':''} · ${gbPlain(sum(rs,r=>r.gb))} back`)},
  merged:()=>{const rs=plan('wf','merged'); goRows(rs,`Removed ${rs.length} merged worktree${rs.length>1?'s':''} · ${gbPlain(sum(rs,r=>r.gb))} to Trash`)},
  safe:()=>{const rs=plan('nn','safe'); goRows(rs,`Moved ${gbPlain(sum(rs,r=>r.gb))} to Trash`)},
  wrap:()=>{const rs=[ALL.p4000,ALL['w-auth']].filter(r=>!r.gone); wrapped=true; rs.forEach(r=>r.gone=true); apply(); hideCard(true);
    toast('Wrapped up fix auth redirect · :4000 stopped, worktree removed',()=>{wrapped=false; rs.forEach(r=>r.gone=false); apply();})},
  sleep:()=>{ setAwake(!awake); const was=!awake; toast(awake?`Keeping the Mac awake while ${working()} agents work`:'The Mac sleeps as usual, even while agents work',()=>setAwake(was)); }
};
function setAwake(v){
  awake=v; const n=working();
  document.getElementById('n-in').textContent = v?'Awake':'Sleeps as usual';
  document.getElementById('in-st').innerHTML = v?`while <em>${n} agents</em> work, then sleeps`:'Insomnia is off until you turn it on';
  arc('arc-in', v?1:0);
  document.getElementById('pl-sleep').textContent = v?'Let It Sleep':'Keep Awake';
}

/* ---------- hover card ---------- */
const card = document.getElementById('card');
let showT, hideT, cardFor=null;
function cardData(key){
  if(ALL[key]){ const r=ALL[key]; const d=r.card;
    const st = r.kept? ['n','Stays, you kept it'] : d.st;
    const base = r.cpu!=null? [['CPU',r.cpu+' %'],['Memory',gbPlain(r.gb)]] : [['Size',gbPlain(r.gb)]];
    const facts = d.f.concat(base.filter(b=>!d.f.some(f=>f[0]===b[0]))).slice(0,5);
    return {t:r.name+(r.sub?` <span style="color:var(--tx2);font-weight:400">${r.sub}</span>`:''),ic:IC[r.ic],c:C[r.ex],st,f:facts,a:r.kept?['Undo Keep']:d.a,row:r};
  }
  const k = KEPT.find(k=>k.id===key); if(k) return {t:k.name,ic:IC[k.ic],c:C.mm,st:['n','Stays, an essential'],f:k.f,a:[]};
  const t = TG.find(t=>t.id===key); if(t) return {t:t.card.t,c:C.in,st:t.card.st,f:t.card.f,a:t.card.a,tg:t};
  if(key.startsWith('ag-')){ const w=ALL_AG[key.slice(3)]; return {t:w.card.t,ic:IC[w.ic],c:w.wait?'#FFB37A':C.wf,st:w.card.st,f:w.card.f,a:w.card.a} }
  if(key==='restore') return {t:'Restore',c:C.mm,st:['n','Brings back the last run'],f:[['Last run','11:05'],['Apps','2 closed'],['Tabs','14 trimmed']],a:['Restore All']};
  if(key==='review') return {t:'Review',c:C.in,st:['n','Done 9m ago'],f:[['Model','Haiku'],['Today','14k tokens']],a:['Review Now']};
  if(key==='insomnia') return {t:'Insomnia',c:C.in,st:awake?['go',`Stays awake while ${working()} agents work`]:['n','Off, the Mac sleeps as usual'],f:[['Holding it','speed-3, bp-lane-c, media-scope, studio-icons'],['Sleeps','When the last one finishes'],['Not holding','Agents that wait, idle or finished'],['Lid closed','Off, sleeps when the lid closes']],a:[]};
}
function showCard(el){
  const key = el.dataset.card, d = cardData(key); if(!d) return;
  cardFor = key;
  card.style.setProperty('--c', d.st[0]==='go'? d.c : 'rgba(235,235,245,.75)');
  card.innerHTML = `<h4>${d.ic||''}<span>${d.t}</span></h4><div class="st">${d.st[1]}</div>${d.f.length?`<dl>${d.f.map(f=>`<dt>${f[0]}</dt><dd>${f[1]}</dd>`).join('')}</dl>`:''}${d.a.length?`<div class="acts">${d.a.map((a,i)=>`<button class="pill ${i?'ghost':''}" style="--c:${d.c}" data-ca="${a}">${a}</button>`).join('')}</div>`:''}`;
  // position
  const s = scale(), st = document.getElementById('stage').getBoundingClientRect(), r = el.getBoundingClientRect();
  const x = (r.left-st.left)/s, y=(r.top-st.top)/s, w=r.width/s, h=r.height/s;
  card.classList.remove('on'); card.style.left='0px'; card.style.top='0px';
  const ch = card.offsetHeight;
  let left = x + w + 12; if(left+300 > 1268) left = x - 300 - 12; if(left<12) left = Math.min(1268-300, x);
  let top = y + h/2 - 22; if(top+ch>790) top = 790-ch;
  if(left===x){ top = y - ch - 8; if(top<30) top = y + h + 8; }
  card.style.left=left+'px'; card.style.top=Math.max(32,top)+'px';
  requestAnimationFrame(()=>card.classList.add('on'));
  card.querySelectorAll('[data-ca]').forEach(b=>b.onclick=()=>cardAct(d,b.dataset.ca));
}
function hideCard(now){ clearTimeout(showT); clearTimeout(hideT); if(now){card.classList.remove('on');cardFor=null;return} hideT=setTimeout(()=>{card.classList.remove('on');cardFor=null},140) }
function cardAct(d,a){
  const r = d.row;
  if(r && /^(Close|Quit|Trim|Remove|Clean) Now$/.test(a)){ goRows([r], r.done? `${r.done[0].toUpperCase()+r.done.slice(1)} · ${gbPlain(r.gb)} back` : `${VERB[r.ex]} ${r.name} · ${gbPlain(r.gb)} ${r.ex==='wf'||r.ex==='nn'?'to Trash':'back'}`); return }
  if(r && /^Keep/.test(a)){ r.kept=true; apply(); hideCard(true); toast(`Kept ${r.name}. It won’t be offered again`,()=>{r.kept=false; apply();}); return }
  if(r && a==='Undo Keep'){ r.kept=false; apply(); hideCard(true); return }
  if(d.tg && (a==='Turn On'||a==='Turn Off')){ document.getElementById(d.tg.id).click(); hideCard(true); return }
  if(a==='Wrap Up'){ ACT.wrap(); return }
  hideCard(true);
}
card.addEventListener('mouseenter',()=>clearTimeout(hideT));
card.addEventListener('mouseleave',()=>hideCard());

/* ---------- wiring ---------- */
function relate(ws,on){ if(!ws) return; ws.split(' ').filter(Boolean).forEach(w=>document.querySelectorAll(`[data-ws~="${w}"]`).forEach(e=>e.classList.toggle('rel',on))) }
const stage = document.getElementById('stage');
stage.addEventListener('mouseover',e=>{
  const el = e.target.closest('[data-card]');
  const pill = e.target.closest('[data-act]');
  if(pill && !pill._in){ pill._in=true; const blk=pill.closest('.blk'); const key=pill.dataset.act;
    const keyMap={now:['mm','now'],idle:['lh','idle'],merged:['wf','merged'],safe:['nn','safe']};
    if(keyMap[key]&&blk){ blk.classList.add('preview'); plan(...keyMap[key]).forEach(r=>{const x=document.getElementById('r-'+r.id); x&&x.classList.add('plan')}) }
    if(key==='wrap'){ ['r-p4000','r-w-auth','a-auth'].forEach(id=>{const x=document.getElementById(id);x&&x.classList.add('rel')}) }
  }
  if(el && el!==stage._hov){
    if(stage._hov) relate(stage._hov.dataset.ws,false);
    stage._hov=el; relate(el.dataset.ws,true);
    clearTimeout(hideT); clearTimeout(showT);
    showT=setTimeout(()=>showCard(el), card.classList.contains('on')?60:260);
  }
});
stage.addEventListener('mouseout',e=>{
  const pill = e.target.closest('[data-act]');
  if(pill && !pill.contains(e.relatedTarget)){ pill._in=false; document.querySelectorAll('.preview').forEach(b=>b.classList.remove('preview')); document.querySelectorAll('.row.plan').forEach(r=>r.classList.remove('plan')); if(pill.dataset.act==='wrap') document.querySelectorAll('.row.rel').forEach(r=>r.classList.remove('rel')) }
  const el = e.target.closest('[data-card]');
  if(el && !el.contains(e.relatedTarget)){ relate(el.dataset.ws,false); if(stage._hov===el) stage._hov=null; clearTimeout(showT); if(!card.contains(e.relatedTarget)) hideCard(); }
});
stage.addEventListener('click',e=>{
  const a = e.target.closest('[data-act]'); if(a && !a.disabled){ e.stopPropagation(); ACT[a.dataset.act](); return }
  const tg = e.target.closest('.sw'); if(tg){ tg.classList.toggle('on'); const t=TG.find(t=>t.id===tg.id); t.on=tg.classList.contains('on');
    t.card.st = t.on?['go','On, stays awake with the lid closed while agents work']:['n','Off, sleeps when the lid closes']; t.card.a = t.on?['Turn Off']:['Turn On']; hideCard(true); return }
});
document.addEventListener('keydown',e=>{ if(e.key==='Escape') hideCard(true); if((e.metaKey||e.ctrlKey)&&e.key==='z'&&undoFn){ document.getElementById('undo')?.click() } });

/* calm core motion: columns ease to small new readings */
function jitter(){
  if(RM) return;
  document.querySelectorAll('#cols .col').forEach((c,i)=>{
    const base = i<8?P_CORE[i]:E_CORE[i-8], tb=T_CORE[i];
    const v = Math.max(8,Math.min(96, base + (Math.random()*10-5)));
    c.querySelector('i').style.height = v+'%';
    c.querySelector('b').style.bottom = `calc(${Math.min(97,Math.max(v+4, tb + (Math.random()*6-3)))}% - 1px)`;
  });
}
setInterval(jitter,1400);

/* scale to frame */
function scale(){ return Math.min(innerWidth/1280, innerHeight/800) }
function fit(){ const s=scale(); stage.style.transform=`translate(${(innerWidth-1280*s)/2}px,${(innerHeight-800*s)/2}px) scale(${s})` }
addEventListener('resize',fit);

renderMB(); renderMM(); renderAG(); renderLH(); renderWF(); renderNN(); renderAW();
apply(); fit();
</script>
</body>
