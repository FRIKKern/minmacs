<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Five Round Buttons</title>
<style>
:root{
  --glass:rgba(28,29,38,.86);
  --line:rgba(255,255,255,.06);
  --tx:rgba(255,255,255,.93);
  --tx2:rgba(235,235,245,.55);
  --tx3:rgba(235,235,245,.32);
  --ease:cubic-bezier(.3,.7,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#1a1636}
body{font-family:-apple-system,"SF Pro Text",system-ui,sans-serif;color:var(--tx);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;font-size:13px;cursor:default;user-select:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible{outline:2px solid rgba(255,255,255,.55);outline-offset:3px;border-radius:8px}
#stage{position:absolute;left:0;top:0;width:1280px;height:800px;transform-origin:0 0;overflow:hidden;
  background:
   radial-gradient(760px 560px at 10% 6%,#4b3c9e 0%,rgba(75,60,158,0) 70%),
   radial-gradient(700px 520px at 84% 2%,#22618f 0%,rgba(34,97,143,0) 70%),
   radial-gradient(820px 620px at 88% 104%,#a0436f 0%,rgba(160,67,111,0) 70%),
   radial-gradient(640px 520px at 18% 100%,#3a2463 0%,rgba(58,36,99,0) 75%),
   #1d1a3c}

/* menu bar */
.mb{position:absolute;left:0;right:0;top:0;height:26px;display:flex;align-items:center;justify-content:space-between;padding:0 12px 0 16px;background:rgba(18,14,40,.32);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);font-size:13px;color:rgba(255,255,255,.92)}
.mb-l,.mb-r{display:flex;align-items:center;gap:18px}
.mb-l b{font-weight:700}
.mb-r{gap:14px}
.icons{display:flex;align-items:center;gap:12px}
.mi{display:flex;width:16px;overflow:hidden;color:#fff;transition:width .35s var(--ease),opacity .3s,margin .35s var(--ease)}
.mi.off{width:0;opacity:0;margin-left:-12px}

/* window */
.win{position:absolute;left:50%;top:132px;width:520px;transform:translateX(-50%);background:var(--glass);backdrop-filter:blur(34px) saturate(1.5);-webkit-backdrop-filter:blur(34px) saturate(1.5);border:1px solid rgba(255,255,255,.085);border-radius:22px;box-shadow:0 30px 90px rgba(6,4,24,.5),inset 0 1px 0 rgba(255,255,255,.035);padding:0 36px 26px}
.tb{height:44px;display:flex;align-items:center;margin:0 -20px}
.lights{display:flex;gap:8px}
.lights i{width:12px;height:12px;border-radius:50%}
.lights i:nth-child(1){background:#ff5f57}.lights i:nth-child(2){background:#febc2e}.lights i:nth-child(3){background:#28c840}

/* the five round buttons */
.orbs{display:grid;grid-template-columns:repeat(5,1fr);margin-top:14px}
.ob{display:flex;flex-direction:column;align-items:center;padding:6px 0 4px;border-radius:14px;--c:#888}
.orb{position:relative;width:58px;height:58px;border-radius:50%;display:grid;place-items:center;
  background:rgba(255,255,255,.08);color:rgba(235,235,245,.42);
  transition:background .35s var(--ease),color .35s var(--ease),box-shadow .35s var(--ease),transform .25s var(--ease)}
.orb::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid rgba(255,255,255,.9);opacity:0;transform:scale(.9);transition:opacity .3s var(--ease),transform .35s var(--ease)}
.ob[data-m="1"] .orb{background:color-mix(in srgb,var(--c) 15%,transparent);color:var(--c);box-shadow:inset 0 0 0 1.75px var(--c)}
.ob[data-m="2"] .orb{background:var(--c);color:#17161f}
.ob.sel .orb::after{opacity:1;transform:scale(1)}
.ob:hover .orb{transform:scale(1.04)}
.ob:active .orb{transform:scale(.96)}
.ob .nm{margin-top:14px;font-size:14px;font-weight:500;color:var(--tx);white-space:nowrap;transition:color .3s}
.ob[data-m="0"] .nm{color:var(--tx2)}
.ob .md{margin-top:3px;font-size:12px;color:var(--tx3);transition:color .3s}
.ob.sel .md{color:var(--tx2)}

/* detail: the smart line */
.detail{margin-top:34px;min-height:132px}
.dh{display:flex;align-items:center;justify-content:space-between;height:28px}
.dh .who{font-size:13px;font-weight:500;color:var(--tx2);display:flex;align-items:center;gap:8px}
.dh .who i{width:7px;height:7px;border-radius:50%;background:var(--c);transition:background .3s}
.seg{position:relative;display:grid;grid-template-columns:repeat(3,52px);height:28px;padding:2px;border-radius:14px;background:rgba(255,255,255,.06)}
.seg .th{position:absolute;top:2px;bottom:2px;left:2px;width:52px;border-radius:12px;background:rgba(255,255,255,.13);transition:transform .35s var(--ease)}
.seg button{position:relative;z-index:1;font-size:12.5px;font-weight:500;color:var(--tx2);border-radius:12px;transition:color .2s}
.seg button[aria-checked="true"]{color:var(--tx)}
.seg button:hover{color:var(--tx)}
.say{margin-top:16px;font-size:21px;line-height:29px;font-weight:400;letter-spacing:-.01em;color:var(--tx);transition:opacity .22s var(--ease),transform .3s var(--ease)}
.say.off{color:var(--tx2)}
.val{border-bottom:1.5px dotted rgba(255,255,255,.4);cursor:pointer;border-radius:3px;padding:0 1px;transition:background .15s,border-color .2s}
.val:hover{background:rgba(255,255,255,.08);border-bottom-color:var(--c)}
.val.bump{animation:bump .4s var(--ease)}
@keyframes bump{35%{background:color-mix(in srgb,var(--c) 38%,transparent)}}
.sees{margin-top:10px;font-size:14px;line-height:20px;color:var(--tx2);min-height:20px;transition:opacity .22s var(--ease),transform .3s var(--ease)}
.sees b{color:var(--tx);font-weight:500}
.sees.hint{color:var(--tx3)}
.fade{opacity:0;transform:translateY(4px)}

/* footer */
.foot{margin-top:28px;border-top:1px solid var(--line);padding-top:6px}
.fr{display:flex;align-items:center;height:42px;font-size:13px;color:var(--tx2);white-space:nowrap}
.fr b{color:var(--tx);font-weight:500}
.fr .undo{margin-left:auto;height:26px;padding:0 12px;border-radius:13px;background:rgba(255,255,255,.08);color:var(--tx);font-size:12.5px;font-weight:500;transition:background .15s}
.fr .undo:hover{background:rgba(255,255,255,.14)}
.fr.sws{gap:28px}
.sw{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--tx2);transition:color .2s}
.sw i{width:30px;height:18px;border-radius:9px;background:rgba(255,255,255,.14);position:relative;transition:background .25s var(--ease);flex:none}
.sw i::after{content:"";position:absolute;left:2px;top:2px;width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.3);transition:transform .25s var(--ease)}
.sw[aria-checked="true"]{color:var(--tx)}
.sw[aria-checked="true"] i{background:rgba(255,255,255,.55)}
.sw[aria-checked="true"] i::after{transform:translateX(12px)}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important}}
</style>
</head>
<body>
<div id="stage">
  <div class="mb">
    <div class="mb-l">
      <svg viewBox="0 0 17 20" width="13" height="16" aria-hidden="true"><path fill="#fff" d="M14.1 10.6c0-2.6 2.1-3.8 2.2-3.9-1.2-1.8-3.1-2-3.7-2-1.6-.2-3.1.9-3.9.9-.8 0-2-.9-3.4-.9C3.6 4.8 1.9 5.8 1 7.4c-1.9 3.3-.5 8.2 1.4 10.9.9 1.3 2 2.8 3.4 2.7 1.4-.1 1.9-.9 3.5-.9s2.1.9 3.5.9c1.5 0 2.4-1.3 3.3-2.7 1-1.5 1.5-3 1.5-3.1-.1 0-2.9-1.1-2.9-4.3zM11.5 3c.7-.9 1.2-2.1 1.1-3.3-1 0-2.3.7-3 1.6-.7.8-1.3 2-1.1 3.2 1.1.1 2.3-.6 3-1.5z"/></svg>
      <b>MinMacs</b><span>Edit</span><span>Window</span><span>Help</span>
    </div>
    <div class="mb-r">
      <div class="icons" id="icons"></div>
      <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M2 6.3a8.6 8.6 0 0 1 12 0M4.2 8.6a5.4 5.4 0 0 1 7.6 0"/><circle cx="8" cy="11.6" r="1.3" fill="#fff" stroke="none"/></svg>
      <svg viewBox="0 0 26 14" width="25" height="13" aria-hidden="true"><rect x=".7" y=".7" width="21.6" height="12.6" rx="3.6" fill="none" stroke="rgba(255,255,255,.55)" stroke-width="1.2"/><rect x="2.6" y="2.6" width="11.6" height="8.8" rx="2" fill="#fff"/><path d="M24 5v4" stroke="rgba(255,255,255,.55)" stroke-width="1.4" stroke-linecap="round"/></svg>
      <span>Tue 27 Oct&nbsp;&nbsp;16:42</span>
    </div>
  </div>

  <div class="win" role="dialog" aria-label="Settings">
    <div class="tb"><div class="lights"><i></i><i></i><i></i></div></div>
    <div class="orbs" id="orbs" role="tablist" aria-label="Sections"></div>
    <div class="detail" id="detail">
      <div class="dh">
        <span class="who" id="who"><i></i><span></span></span>
        <div class="seg" id="seg" role="radiogroup" aria-label="Mode">
          <i class="th"></i>
          <button role="radio" data-m="0">Off</button><button role="radio" data-m="1">Ask</button><button role="radio" data-m="2">Auto</button>
        </div>
      </div>
      <p class="say" id="say"></p>
      <p class="sees" id="sees"></p>
    </div>
    <div class="foot">
      <div class="fr" id="today"></div>
      <div class="fr sws">
        <button class="sw" id="one" role="switch" aria-checked="false"><i></i>One icon in the menu bar</button>
        <button class="sw" id="login" role="switch" aria-checked="true"><i></i>Open at login</button>
      </div>
    </div>
  </div>
</div>

<script>
const G = {
  apps:'<rect x="4.2" y="4.2" width="7.6" height="7.6" rx="1.6"/><path d="M6.6 1.8v2.4M9.4 1.8v2.4M6.6 11.8v2.4M9.4 11.8v2.4M1.8 6.6h2.4M1.8 9.4h2.4M11.8 6.6h2.4M11.8 9.4h2.4"/>',
  servers:'<rect x="2.5" y="2.8" width="11" height="4.2" rx="1.4"/><rect x="2.5" y="9" width="11" height="4.2" rx="1.4"/><path d="M5.2 4.9h.01M5.2 11.1h.01" stroke-width="2.2"/>',
  trees:'<circle cx="4.6" cy="3.6" r="1.6"/><circle cx="4.6" cy="12.4" r="1.6"/><circle cx="11.4" cy="5.4" r="1.6"/><path d="M4.6 5.2v5.6M11.4 7c0 2.7-2.4 3.4-5.4 4.2"/>',
  disk:'<ellipse cx="8" cy="4" rx="5.5" ry="2"/><path d="M2.5 4v8c0 1.1 2.5 2 5.5 2s5.5-.9 5.5-2V4M2.5 8c0 1.1 2.5 2 5.5 2s5.5-.9 5.5-2"/>',
  awake:'<path d="M1.8 8s2.3-4.3 6.2-4.3S14.2 8 14.2 8s-2.3 4.3-6.2 4.3S1.8 8 1.8 8z"/><circle cx="8" cy="8" r="1.9"/>',
  one:'<circle cx="8" cy="8" r="5.8"/><path d="M8 4.6v3.6l2.4 1.4"/>'
};
const gl=(k,s,w)=>`<svg viewBox="0 0 16 16" width="${s}" height="${s}" fill="none" stroke="currentColor" stroke-width="${w||1.6}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${G[k]}</svg>`;
const MODES=['Off','Ask','Auto'];
let undone=false;
const S=[
  {id:'apps',name:'Apps',c:'#5B9BFF',mode:2,vals:['60 %','70 %','80 %','90 %'],v:1,
   say:[()=>'Not watching apps.',v=>`Shows noise apps to close when the Mac is busy, above ${v} load.`,v=>`Closes noise apps when the Mac is busy, above ${v} load.`],
   sees:[null,()=>'<b>2</b> noise apps open now',()=>undone?'<b>0</b> closed today, 2 put back':'<b>2</b> closed today']},
  {id:'servers',name:'Servers',c:'#3FD0B8',mode:2,vals:['30 min','1 h','2 h','4 h','1 day'],v:2,
   say:[()=>'Not watching servers.',v=>`Shows localhost servers idle for ${v}.`,v=>`Stops servers nobody used for ${v}.`],
   sees:[null,()=>'<b>3</b> idle now',()=>undone?'<b>6</b> idle now, 3 started again':'<b>3</b> idle now, <b>3</b> stopped today']},
  {id:'trees',name:'Worktrees',c:'#4CC96B',mode:1,vals:['1 h','1 day','1 week'],v:1,
   say:[()=>'Not watching worktrees.',v=>`Shows merged git worktrees after ${v}.`,v=>`Removes merged worktrees after ${v}. Undo brings them back.`],
   sees:[null,()=>'<b>4</b> merged, <b>5.7 GB</b>',()=>'<b>4</b> merged, <b>5.7 GB</b>, go tonight']},
  {id:'disk',name:'Disk',c:'#F2B544',mode:2,vals:['daily','weekly','monthly'],v:1,
   say:[()=>'Not watching caches.',v=>`Shows caches and build output safe to clean, checked ${v}.`,v=>`Moves safe clutter to the Trash ${v}.`],
   sees:[null,()=>'<b>30 GB</b> safe to clean',s=>`<b>30 GB</b> safe to clean, next ${['tonight','on Sunday','on 1 Nov'][s.v]}`]},
  {id:'awake',name:'Keep Awake',c:'#B18CFF',mode:2,vals:['10 %','20 %','30 %','never'],v:1,
   say:[()=>'The Mac sleeps as usual.',v=>`Asks when an agent starts working. Battery stop: ${v}.`,v=>`Keeps the Mac awake while agents work, then sleeps. Battery stop: ${v}.`],
   sees:[null,()=>'<b>4</b> agents working now',()=>'<b>4</b> agents working now']}
];
let sel=0;
const $=id=>document.getElementById(id);

function buildOrbs(){
  $('orbs').innerHTML=S.map((s,i)=>`<button class="ob" role="tab" id="ob-${s.id}" data-i="${i}" style="--c:${s.c}" title="Press again to change mode">
    <span class="orb">${gl(s.id,24,1.5)}</span><span class="nm">${s.name}</span><span class="md"></span></button>`).join('');
}
function paintOrb(i){
  const s=S[i], b=$('ob-'+s.id);
  b.dataset.m=s.mode; b.classList.toggle('sel',i===sel); b.setAttribute('aria-selected',i===sel);
  b.querySelector('.md').textContent=MODES[s.mode];
}
function valSpan(s){return `<span class="val" title="Click to change">${s.vals[s.v]}</span>`}
function paintDetail(animate){
  const s=S[sel], d=$('detail');
  d.style.setProperty('--c',s.c);
  $('who').querySelector('span').textContent=s.name;
  $('who').querySelector('i').style.background=s.mode?s.c:'rgba(235,235,245,.25)';
  $('seg').querySelector('.th').style.transform=`translateX(${s.mode*52}px)`;
  $('seg').querySelectorAll('button').forEach(b=>b.setAttribute('aria-checked',String(+b.dataset.m===s.mode)));
  const write=()=>{
    $('say').innerHTML=s.say[s.mode](valSpan(s));
    $('say').classList.toggle('off',!s.mode);
    const f=s.sees[s.mode];
    $('sees').innerHTML=f?f(s):`Press ${s.name} again to turn on Ask`;
    $('sees').classList.toggle('hint',!f);
  };
  if(!animate){write();return}
  const els=[$('say'),$('sees')];
  els.forEach(e=>e.classList.add('fade'));
  setTimeout(()=>{write();requestAnimationFrame(()=>els.forEach(e=>e.classList.remove('fade')))},150);
}
function paintAll(animate){S.forEach((_,i)=>paintOrb(i));paintDetail(animate);renderIcons();}
function renderToday(){
  $('today').innerHTML=undone
    ?`<span>Put back <b>2 apps</b> and <b>3 servers</b></span><button class="undo" id="redo">Redo</button>`
    :`<span>Today: closed <b>2 apps</b>, stopped <b>3 servers</b></span><button class="undo" id="undo">Undo</button>`;
}
function renderIcons(){
  const one=$('one').getAttribute('aria-checked')==='true', box=$('icons');
  if(!box.children.length) box.innerHTML=S.map(s=>`<span class="mi" id="mi-${s.id}">${gl(s.id,16)}</span>`).join('')+`<span class="mi off" id="mi-one">${gl('one',16)}</span>`;
  S.forEach(s=>$('mi-'+s.id).classList.toggle('off',one||s.mode===0));
  $('mi-one').classList.toggle('off',!one);
}
document.addEventListener('click',e=>{
  const ob=e.target.closest('.ob');
  if(ob){const i=+ob.dataset.i;
    if(i===sel){S[i].mode=(S[i].mode+1)%3}else{sel=i}
    paintAll(true);return}
  const m=e.target.closest('.seg button');
  if(m){S[sel].mode=+m.dataset.m;paintAll(true);return}
  if(e.target.closest('.val')){const s=S[sel];s.v=(s.v+1)%s.vals.length;paintDetail(false);
    const v=$('say').querySelector('.val');v&&v.classList.add('bump');return}
  if(e.target.closest('#undo')){undone=true;renderToday();paintDetail(true);return}
  if(e.target.closest('#redo')){undone=false;renderToday();paintDetail(true);return}
  const sw=e.target.closest('.sw');
  if(sw){sw.setAttribute('aria-checked',String(sw.getAttribute('aria-checked')!=='true'));renderIcons()}
});
document.addEventListener('keydown',e=>{
  if(!e.target.closest||!e.target.closest('.orbs'))return;
  if(e.key==='ArrowRight'||e.key==='ArrowLeft'){sel=(sel+(e.key==='ArrowRight'?1:4))%5;paintAll(true);$('ob-'+S[sel].id).focus();e.preventDefault()}
});
function fit(){const st=$('stage'),k=Math.min(innerWidth/1280,innerHeight/800);st.style.transform=`translate(${(innerWidth-1280*k)/2}px,${(innerHeight-800*k)/2}px) scale(${k})`}
addEventListener('resize',fit);
buildOrbs();renderToday();paintAll(false);fit();
</script>
</body>
</html>
