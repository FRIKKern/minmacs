<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Six Compositions</title>
<!--
COMPOSITION PLAN: "Every tab its own composition" (variant a, bold)

System shared by every tab
  Sheet 900 x 700, hangs from its menu bar icon. Left = Live Index (300 px), right = the pane (508 x 600).
  Type: 11 caption / 13 body / 24 display (index names + mode words) / 40 ftop number. Nothing else.
  Spacing scale 4 8 12 16 24 32. Section color is the only accent per tab.
  The setting is always the same three parts: mode words Off Ask Auto (24, sliding underline),
  one rule sentence (13), the value. Where it sits, and where the value lives, depends on the tab.

Agents      Grid of workstream cards, 3 x 3. Focal: the big "4 working" and the grid.
            Reading: number -> insight -> cards row by row -> the finished card bottom-left.
            Setting = the last two cells of the grid, right beside the finished agent it acts on,
            joined by a short pink line. Section action Wrap Up Finished closes the grid on the right.
Apps        ftop columns hero. Left column = the setting: mode words, rule, then the load column
            (63 %) whose white tick IS the threshold; 60/70/80/90 sit on its ruler. Right: insight,
            one column per app (height = memory, blue = what Auto closes). Actions under the hero.
Servers     A ring of six port badges. Each arc fills toward the moment Auto stops it, so the
            setting sits in the hub: every arc is measured against the value in the middle.
            Close Idle top right, insight top left.
Worktrees   A forest of 14 columns grouped merged / fine / in use / stale (height = size).
            Setting hangs in the sky over the merged group, with a bracket down onto the trees it
            removes. Insight + Remove Merged on top.
Disk        One thin disk bar 812/994 GB zooms into one huge split bar of the 38.4 GB clutter.
            Under the bar two brackets: the safe 30.1 GB carries the setting (how often),
            the rest lists what asks first. Big number + Clean Safe on top.
Keep Awake  A big battery ring; the stop tick and its values (never/10/20/30 %) sit on the ring.
            Agents stand around the left of the ring; the ones keeping it awake are wired to it.
            Mode words + rule + guards along the bottom, actions bottom right.
-->
<style>
:root{
  --glass:rgba(28,29,38,.9);
  --line:rgba(255,255,255,.07);
  --tx:rgba(255,255,255,.94);
  --tx2:rgba(235,235,245,.62);
  --tx3:rgba(235,235,245,.34);
  --g1:rgba(255,255,255,.06);
  --g2:rgba(255,255,255,.16);
  --g3:rgba(255,255,255,.4);
  --cardbg:rgba(255,255,255,.035);
  --ease:cubic-bezier(.3,.7,.2,1);
  --c:#EE85B5;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#1a1636}
body{font-family:-apple-system,"SF Pro Text",system-ui,sans-serif;color:var(--tx);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;font-size:13px;line-height:20px;cursor:default;user-select:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;text-align:left;line-height:inherit}
b{font-weight:500;color:var(--tx)}
:focus{outline:none}
:focus-visible{outline:2px solid rgba(255,255,255,.55);outline-offset:2px;border-radius:8px}
#stage{position:absolute;left:0;top:0;width:1280px;height:800px;transform-origin:0 0;overflow:hidden;
  background:
   radial-gradient(760px 560px at 10% 6%,#4b3c9e 0%,rgba(75,60,158,0) 70%),
   radial-gradient(700px 520px at 84% 2%,#22618f 0%,rgba(34,97,143,0) 70%),
   radial-gradient(820px 620px at 88% 104%,#a0436f 0%,rgba(160,67,111,0) 70%),
   radial-gradient(640px 520px at 18% 100%,#3a2463 0%,rgba(58,36,99,0) 75%),
   #1d1a3c}

/* menu bar */
.mb{position:absolute;left:0;right:0;top:0;height:26px;display:flex;align-items:center;justify-content:space-between;padding:0 12px 0 16px;background:rgba(18,14,40,.32);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);font-size:13px;color:rgba(255,255,255,.92);z-index:5}
.mb-l,.mb-r{display:flex;align-items:center;gap:18px}
.mb-l b{font-weight:700}
.mb-r{gap:14px}
.icons{position:relative;display:flex;align-items:center;gap:12px}
.hl{position:absolute;top:-3px;left:-6px;height:22px;width:28px;border-radius:6px;background:rgba(255,255,255,.2);transition:transform .45s var(--ease),opacity .3s;pointer-events:none}
.mi{position:relative;display:flex;width:16px;overflow:hidden;cursor:pointer;transition:width .4s var(--ease),opacity .3s,margin .4s var(--ease)}
.mi.off{width:0;opacity:0;margin-left:-12px}

/* sheet */
.sheet{position:absolute;top:34px;left:352px;width:900px;background:var(--glass);backdrop-filter:blur(36px) saturate(1.5);-webkit-backdrop-filter:blur(36px) saturate(1.5);border:1px solid rgba(255,255,255,.085);border-radius:22px;box-shadow:0 34px 100px rgba(6,4,24,.5),inset 0 1px 0 rgba(255,255,255,.035);animation:drop .6s var(--ease) both}
@keyframes drop{from{opacity:0;transform:translateY(-10px)}}
.nub{position:absolute;top:-8px;left:0;width:18px;height:8px;margin-left:-9px;transition:transform .45s var(--ease)}
.nub svg{display:block}
.head{display:flex;align-items:center;gap:12px;height:52px;padding:0 28px;white-space:nowrap}
.head .lbl{font-size:11px;color:var(--tx3)}
.head .txt{color:var(--tx2)}
.head .undo{margin-left:auto;font-weight:500;height:26px;padding:0 12px;border-radius:13px;background:rgba(255,255,255,.07);transition:background .2s}
.head .undo:hover{background:rgba(255,255,255,.13)}
.body{display:grid;grid-template-columns:300px 508px;column-gap:36px;padding:0 28px;height:596px}
.foot{display:flex;align-items:center;gap:28px;height:52px;padding:0 28px;border-top:1px solid var(--line)}
.sw{display:flex;align-items:center;gap:10px;color:var(--tx2);transition:color .2s}
.sw i{width:32px;height:19px;border-radius:10px;background:rgba(255,255,255,.14);position:relative;transition:background .25s;flex:none}
.sw i::after{content:"";position:absolute;left:2px;top:2px;width:15px;height:15px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .25s var(--ease)}
.sw[aria-checked="true"]{color:var(--tx)}
.sw[aria-checked="true"] i{background:#5B9BFF}
.sw[aria-checked="true"] i::after{transform:translateX(13px)}
.foot .hint{margin-left:auto;font-size:11px;color:var(--tx3)}

/* live index */
.idx{display:flex;flex-direction:column;padding-bottom:8px}
.it{display:flex;align-items:center;gap:12px;flex:1;border-radius:14px;padding:0 8px;margin:0 -8px;transition:background .25s}
.it:hover{background:rgba(255,255,255,.03)}
.it .dot{flex:none;width:9px;height:9px;border-radius:50%;box-shadow:inset 0 0 0 1.5px rgba(235,235,245,.28);transition:background .35s,box-shadow .35s}
.it .nm{flex:1;font-size:24px;line-height:30px;font-weight:600;letter-spacing:-.022em;color:rgba(235,235,245,.36);transition:color .3s;white-space:nowrap}
.it:hover .nm{color:var(--tx2)}
.it.sel .nm{color:var(--tx)}
.mg{flex:none;position:relative;width:56px;height:24px;display:flex;align-items:flex-end;justify-content:space-between;transition:opacity .4s,filter .4s}
.it.m0 .mg{opacity:.28;filter:grayscale(1)}
.mg i{display:block;transition:height .55s var(--ease),width .55s var(--ease),left .55s var(--ease),background .35s,box-shadow .35s}
.mg .tr{position:absolute;left:0;right:0;top:9px;height:6px;border-radius:3px;background:var(--g1)}
.mg .tr i{position:absolute;top:0;bottom:0;left:0;border-radius:3px}
.mg .tr .tk{top:-4px;bottom:-4px;width:2px;margin-left:-1px;border-radius:1px;background:#fff;transition:left .55s var(--ease),opacity .3s}
.mg.cl i{flex:none;border-radius:2px}
.mg.dots{flex-wrap:wrap;align-content:center;row-gap:4px}
.mg.dots i{width:6px;height:6px;border-radius:50%}
.mg.ring{justify-content:flex-end;align-items:center}
.nb{flex:none;width:92px;display:flex;flex-direction:column;align-items:flex-end;white-space:nowrap}
.nb .n{font-size:13px;font-weight:600;line-height:18px;color:var(--tx2);transition:color .3s}
.nb .n u{text-decoration:none;font-size:11px;font-weight:400;color:var(--tx3);margin-left:3px}
.nb .cp{font-size:11px;line-height:15px;color:var(--tx3)}
.it.sel .nb .n{color:var(--tx)}
.it.m0 .nb .n{color:var(--tx3);font-weight:400}

/* pane */
.det{position:relative;min-width:0}
.pane{position:relative;width:508px;height:596px;transition:opacity .22s,transform .35s var(--ease)}
.pane.swap{opacity:0;transform:translateY(6px)}
.pane *{transition-timing-function:var(--ease)}
.cap{font-size:11px;line-height:16px;color:var(--tx3);white-space:nowrap}
.ins{color:var(--tx2);text-wrap:pretty}
.ins b{white-space:nowrap}
.big{display:flex;align-items:baseline;gap:6px;white-space:nowrap}
.big .n{font-size:40px;line-height:46px;font-weight:500;letter-spacing:-.02em}
.big .u{color:var(--tx2)}
.btn{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 14px;border-radius:15px;background:rgba(255,255,255,.08);font-weight:500;white-space:nowrap;transition:background .2s,opacity .3s}
.btn:hover{background:rgba(255,255,255,.15)}
.btn .tl{font-weight:400;color:var(--tx3)}
.btn.pri{background:color-mix(in srgb,var(--c) 26%,transparent)}
.btn.pri:hover{background:color-mix(in srgb,var(--c) 40%,transparent)}
.btn.pri .tl{color:rgba(255,255,255,.55)}
.btn[disabled]{opacity:.35;pointer-events:none}

/* the setting: one system, placed per tab */
.set{position:absolute}
.modes{position:relative;display:flex;gap:18px;height:34px;white-space:nowrap}
.modes button{font-size:24px;font-weight:600;letter-spacing:-.02em;line-height:30px;color:var(--tx3);transition:color .3s}
.modes button:hover{color:var(--tx2)}
.modes button[aria-checked="true"]{color:var(--tx)}
.modes .bar{position:absolute;left:0;top:31px;height:2px;border-radius:1px;background:var(--c);transition:transform .45s var(--ease),width .45s var(--ease)}
.rule{margin-top:6px;color:var(--tx2);text-wrap:pretty}
.vals{display:inline-flex;gap:12px;white-space:nowrap;vertical-align:top}
.vals button{position:relative;color:var(--tx3);transition:color .25s}
.vals button:hover{color:var(--tx2)}
.vals button[aria-checked="true"]{color:var(--tx);font-weight:500}
.vals button[aria-checked="true"]::after{content:"";position:absolute;left:50%;bottom:-3px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--c)}
.off .vals,.off .valon{opacity:.35;pointer-events:none}

/* highlight from section actions */
.hlon [data-k]:not(.hit){opacity:.2}
.hlon .hit{box-shadow:0 0 0 1px rgba(255,255,255,.7),0 0 16px color-mix(in srgb,var(--c) 70%,transparent)}
[data-k]{transition:opacity .3s,box-shadow .3s,transform .32s var(--ease)}
.hlon .badge.hit{box-shadow:none}
.hlon .badge.hit .rg{box-shadow:0 0 0 1.5px rgba(255,255,255,.8),0 0 18px color-mix(in srgb,var(--c) 70%,transparent)}
.apc{border-radius:8px}
.badge .rg{transition:transform .3s var(--ease),box-shadow .3s}
.out{opacity:0!important;transform:scale(.92)}
.flash{animation:flash 1.6s var(--ease)}
@keyframes flash{0%,40%{box-shadow:0 0 0 1.5px var(--c),0 0 18px var(--c)}100%{box-shadow:none}}

/* ---------- agents ---------- */
.ag-head{position:absolute;left:0;top:0;right:0;display:flex;justify-content:space-between;align-items:flex-end}
.ag-dots{display:flex;flex-direction:column;align-items:flex-end;gap:6px;padding-bottom:6px}
.ag-dots .row{display:flex;gap:5px}
.ag-dots i{width:8px;height:8px;border-radius:50%;transition:background .35s,box-shadow .35s}
.ag-ins{position:absolute;left:0;top:58px;width:508px}
.grid{position:absolute;left:0;top:124px;display:grid;grid-template-columns:repeat(3,160px);grid-auto-rows:122px;gap:14px}
.card{position:relative;border-radius:16px;background:var(--cardbg);border:1px solid rgba(255,255,255,.05);padding:14px 14px 0;transition:background .25s,opacity .3s,box-shadow .3s,transform .32s var(--ease)}
.card:hover{background:rgba(255,255,255,.07)}
.card .top{display:flex;justify-content:space-between;align-items:center;height:18px}
.card .stt{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--tx3);white-space:nowrap}
.card .nm{margin-top:12px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .wh{font-size:11px;line-height:16px;color:var(--tx3);white-space:nowrap}
.card .hold{position:absolute;left:14px;bottom:12px;height:16px;display:flex;align-items:center;gap:10px;font-size:11px;line-height:16px;color:var(--tx3)}
.card .hold span{display:flex;align-items:center;gap:3px;height:16px}
.card.w .stt{color:var(--c)}
.card.n .stt{color:var(--tx)}
.card.f .stt{color:var(--c)}
.card.i .nm{color:var(--tx2)}
.card.ghost{background:none;border:1px dashed rgba(255,255,255,.12)}
.card.ghost .nm,.card.ghost .wh{color:var(--tx3)}
.sm{width:7px;height:7px;border-radius:50%;flex:none}
.sm.w{background:var(--c)}
.sm.n{background:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.16)}
.sm.i{box-shadow:inset 0 0 0 1.5px var(--g3)}
.sm.f{box-shadow:inset 0 0 0 1.5px var(--c)}
.setcard{grid-column:span 2;position:relative;border-radius:16px;padding:14px 18px 0;background:color-mix(in srgb,var(--c) 7%,transparent);border:1px solid color-mix(in srgb,var(--c) 18%,transparent)}
.setcard::before{content:"";position:absolute;left:-15px;top:50%;width:14px;height:1px;background:var(--c);opacity:.7}
.setcard .rule{margin-top:8px}
.ag-foot{position:absolute;left:0;right:0;top:546px;display:flex;justify-content:space-between;align-items:center}

/* ---------- apps ---------- */
.ap-set{left:0;top:0;width:168px}
.ap-set .rule{width:168px}
.load{position:absolute;left:0;top:178px;width:60px;height:272px;border-radius:10px;background:rgba(255,255,255,.05);overflow:visible}
.load .f{position:absolute;left:0;right:0;bottom:0;border-radius:10px;background:var(--c);transition:height .6s var(--ease)}
.load .tk{position:absolute;left:-6px;width:72px;height:2px;margin-top:-1px;border-radius:1px;background:#fff;transition:top .5s var(--ease),opacity .3s}
.ruler{position:absolute;left:74px;top:178px;height:272px;width:80px}
.ruler button{position:absolute;left:0;height:20px;margin-top:-10px;display:flex;align-items:center;gap:6px;color:var(--tx3);white-space:nowrap;transition:color .25s}
.ruler button::before{content:"";width:6px;height:1px;background:var(--g3)}
.ruler button:hover{color:var(--tx2)}
.ruler button[aria-checked="true"]{color:var(--tx);font-weight:500}
.ruler button[aria-checked="true"]::before{background:#fff;width:10px}
.load-cap{position:absolute;left:0;top:462px;width:168px}
.ap-big{position:absolute;left:0;top:118px}
.ap-ins{position:absolute;left:198px;top:0;width:310px}
.apcols{position:absolute;left:198px;top:178px;width:310px;height:272px;display:flex;gap:7px;align-items:flex-end}
.apc{position:relative;flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}
.apc .bx{position:relative;width:100%;height:100%;border-radius:8px;background:rgba(255,255,255,.03)}
.apc .bx i{position:absolute;left:0;right:0;bottom:0;border-radius:8px;transition:height .6s var(--ease),background .35s,box-shadow .35s}
.apc.close .bx i{background:var(--c)}
.apc.uns .bx i{background:color-mix(in srgb,var(--c) 22%,transparent);box-shadow:inset 0 0 0 1.5px var(--c)}
.apc.kept .bx i{background:var(--g2)}
.apc.spared .bx i{background:repeating-linear-gradient(135deg,rgba(255,255,255,.2) 0 3px,rgba(255,255,255,.09) 3px 6px)}
.apc.ghost .bx i{background:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)}
.apic{position:absolute;left:198px;top:462px;width:310px;display:flex;gap:7px}
.apic div{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px}
.apic .v{font-size:11px;line-height:16px;color:var(--tx3)}
.apic .ghost{opacity:.35}
.ap-leg{position:absolute;left:198px;top:510px;display:flex;gap:14px}
.ap-leg span{display:flex;align-items:center;gap:6px}
.ap-leg i{width:8px;height:8px;border-radius:2px}
.ap-act{position:absolute;left:0;right:0;top:552px;display:flex;gap:10px;align-items:center}
.ap-act .cap{margin-left:auto}

/* ---------- servers ---------- */
.sv-ins{position:absolute;left:0;top:0;width:300px}
.sv-act{position:absolute;right:0;top:4px}
.orbit{position:absolute;left:0;top:0;pointer-events:none}
.badge{position:absolute;width:120px;margin-left:-60px;display:flex;flex-direction:column;align-items:center;text-align:center}
.badge .rg{position:relative;width:64px;height:64px;border-radius:50%;background:rgba(28,29,38,.9);transition:transform .3s var(--ease)}
.badge:hover .rg{transform:scale(1.05)}
.badge svg{position:absolute;left:0;top:0}
.badge .p{position:absolute;left:0;right:0;top:22px;font-weight:600;line-height:20px}
.badge .k{margin-top:8px;white-space:nowrap}
.badge .s{font-size:11px;line-height:16px;color:var(--tx3);white-space:nowrap}
.badge.ghost .p,.badge.ghost .k{color:var(--tx3)}
.arc{transition:stroke-dashoffset .7s var(--ease),stroke .35s}
.hub{left:159px;width:190px;text-align:center}
.hub .modes{justify-content:center}
.hub .rule{margin-top:8px}
.hub .vals{margin-top:4px}

/* ---------- worktrees ---------- */
.wt-ins{position:absolute;left:0;top:0;width:300px}
.wt-act{position:absolute;right:0;top:4px}
.wt-set{left:0;top:92px;width:300px}
.brk{position:absolute;height:10px;border:1px solid var(--c);border-bottom:0;border-radius:4px 4px 0 0;opacity:.6;transition:opacity .3s}
.forest{position:absolute;left:0;top:166px;width:508px;height:330px}
.tree{position:absolute;bottom:0;width:25px;border-radius:7px;transition:height .6s var(--ease),background .35s,box-shadow .35s,opacity .3s}
.tree.m{background:var(--c)}
.tree.s{background:color-mix(in srgb,var(--c) 18%,transparent);box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--c) 70%,transparent)}
.tree.u{background:rgba(255,255,255,.55)}
.tree.u::after{content:"";position:absolute;left:5px;right:5px;top:6px;height:2px;border-radius:1px;background:var(--c)}
.tree.f{background:var(--g2)}
.tree.ghost{background:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)}
.off .tree.m{background:var(--g3)}
.ground{position:absolute;left:0;right:0;top:496px;height:1px;background:var(--line)}
.glab{position:absolute;top:506px;white-space:nowrap}
.glab b{display:block;font-size:13px;line-height:20px}
.wt-leg{position:absolute;left:0;top:560px}

/* ---------- disk ---------- */
.dk-big{position:absolute;left:0;top:0}
.dk-act{position:absolute;right:0;top:10px}
.dk-ins{position:absolute;left:0;top:58px;width:508px}
.thin{position:absolute;left:0;top:160px;width:508px}
.thin .bar{position:relative;height:8px;margin-top:6px;border-radius:4px;background:var(--g1);overflow:hidden}
.thin .bar i{position:absolute;top:0;bottom:0;transition:left .6s var(--ease),width .6s var(--ease)}
.wedge{position:absolute;left:0;top:184px}
.huge{position:absolute;left:0;top:250px;width:508px;height:136px;display:flex}
.huge .sg{position:relative;height:100%;border-radius:12px;margin-right:3px;overflow:hidden;transition:flex-grow .6s var(--ease),margin .6s var(--ease),background .35s,box-shadow .3s,opacity .3s}
.huge .sg:last-child{margin-right:0}
.huge .sg.z{margin-right:0}
.huge .sg .lb{position:absolute;left:12px;top:14px;color:rgba(28,22,8,.86);white-space:nowrap}
.huge .sg .lb b{display:block;color:rgba(28,22,8,.9);font-weight:600}
.huge .sg .lb span{font-size:11px;line-height:16px}
.dk-set{left:0;top:424px;width:330px}
.dk-rest{position:absolute;right:0;top:428px;width:170px;text-align:right}
.dk-rest .r{display:flex;justify-content:flex-end;gap:8px;white-space:nowrap;color:var(--tx2);border-radius:6px;padding:0 6px;margin-right:-6px}
.dk-rest .r span{color:var(--tx3)}
.dk-rest .cap{margin-bottom:8px}
.ghostseg{background:none!important;box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)}

/* ---------- keep awake ---------- */
.ka-ins{position:absolute;left:0;top:0;width:508px}
.kring{position:absolute;left:0;top:0;pointer-events:none}
.kv{position:absolute;height:20px;margin:-10px 0 0 0;color:var(--tx3);white-space:nowrap;transition:color .25s}
.kv:hover{color:var(--tx2)}
.kv[aria-checked="true"]{color:var(--tx);font-weight:500}
.ka-c{position:absolute;left:250px;top:250px;width:160px;margin-left:-80px;text-align:center}
.ka-c .big{justify-content:center}
.agn{position:absolute;display:flex;align-items:center;gap:10px;flex-direction:row-reverse;white-space:nowrap;border-radius:10px;padding:2px 6px;margin:-2px -6px}

  }
  if(id==='trees'){
    return `<div class="mg cl">${WT.map(w=>`<i data-a="mi-${w.id}" style="width:2px;height:${gone(w.id)?2:Math.max(3,w.gb/3.2*24)}px;background:${gone(w.id)?'var(--g1)':w.k==='m'&&!has(w.id,'keep')?C.trees:'var(--g2)'}"></i>`).join('')}</div>`;
  }
  if(id==='disk'){
    const r=9,cf=2*Math.PI*r,safe=sum(safeDK(),d=>d.gb),all=sum(DK.filter(d=>!gone(d.id)),d=>d.gb);
    return `<div class="mg ring"><svg width="24" height="24" viewBox="0 0 24 24"><circle cx="12" cy="12" r="${r}" fill="none" stroke="rgba(255,255,255,.1)" stroke-width="3.2"/><circle data-a="mi-dk2" cx="12" cy="12" r="${r}" fill="none" stroke="rgba(242,181,68,.35)" stroke-width="3.2" stroke-linecap="round" stroke-dasharray="${cf}" transform="rotate(-90 12 12)" class="arc" style="stroke-dashoffset:${cf*(1-all/38.4*.95)}"/><circle data-a="mi-dk" cx="12" cy="12" r="${r}" fill="none" stroke="${C.disk}" stroke-width="3.2" stroke-linecap="round" stroke-dasharray="${cf}" transform="rotate(-90 12 12)" class="arc" style="stroke-dashoffset:${cf*(1-safe/38.4*.95)}"/></svg></div>`;

function idxNum(id){
  const m=md(id),verb=(o,a,au)=>m===0?'not watching':m===1?a:au;
  if(id==='agents'){const w=working().length;return {n:`${w}<u>working</u>`,c:lexiconWaiting()?'1 needs you':`${finished().length} finished`}}
  if(id==='apps'){const f=sum(noise(),memOf);return {n:`${fN(f)}<u>${fU(f)}</u>`,c:verb(0,'Ask shows','Auto frees')}}
  if(id==='servers'){const n=idleSrv().length;return {n:`${n}<u>idle</u>`,c:verb(0,'Ask shows','Auto stops')}}
  if(id==='trees'){const f=sum(mergedWT(),w=>w.gb);return {n:`${fN(f)}<u>${fU(f)}</u>`,c:verb(0,'Ask shows','Auto removes')}}
  if(id==='disk'){const f=sum(safeDK(),d=>d.gb);return {n:`${fN(f)}<u>${fU(f)}</u>`,c:verb(0,'Ask shows','Auto cleans')}}
  const h=holders().length;
  return m===0?{n:'0<u>agents</u>',c:'Mac sleeps as usual'}:{n:`${h}<u>agents</u>`,c:h?'keep it awake':'nothing keeps it awake'};
}
const lexiconWaiting=()=>!has('lexicon','seen');
function renderIdx(){
  return S.map(s=>{const m=md(s.id),c=C[s.id],k=idxNum(s.id);
    return `<button class="it${st.sel===s.id?' sel':''}${m===0?' m0':''}" role="tab" aria-selected="${st.sel===s.id}" data-sec="${s.id}">
      <i class="dot" style="background:${m===2?c:'transparent'};box-shadow:${m===1?'inset 0 0 0 1.5px '+c:m===2?'none':'inset 0 0 0 1.5px rgba(235,235,245,.28)'}"></i>
      <span class="nm">${s.name}</span>${mini(s.id)}
      <span class="nb"><span class="n">${k.n}</span><span class="cp">${k.c}</span></span></button>`}).join('');
}

/* ---------- the setting (one system) ---------- */
function modes(id){
  return `<div class="modes" role="radiogroup" aria-label="Mode" data-modes="${id}">${MODES.map((w,i)=>`<button role="radio" aria-checked="${md(id)===i}" data-mode="${i}">${w}</button>`).join('')}<i class="bar"></i></div>`;
}
function vals(id){
  return `<span class="vals" role="radiogroup" aria-label="Value">${sec(id).vals.map((w,i)=>`<button role="radio" aria-checked="${st.v[id]===i}" data-val="${i}" data-for="${id}">${w.replace(' ','&nbsp;')}</button>`).join('')}</span>`;
}
function rule(id){
  const m=md(id),V=vals(id),v=val(id);
  switch(id){
    case 'agents':return m===0?'Agents are listed. Nothing is suggested.':m===1?`Suggests Wrap Up when an agent finished ${V}&nbsp;ago.`:`Wraps up an agent that finished ${V}&nbsp;ago.`;
    case 'apps':return m===0?'Not watching apps. Nothing closes.':m===1?`Shows noise apps to close when load passes <b class="valon">${v}</b>.`:`Closes noise apps when load passes <b class="valon">${v}</b>.`;
    case 'servers':return m===0?'Not watching servers.':m===1?`Shows servers nobody used for`:`Stops servers nobody used for`;
    case 'trees':return m===0?'Not watching worktrees.':m===1?`Shows a worktree once it has been merged for ${V}`:`Removes a worktree once it has been merged for ${V}. Undo brings it back.`;
    case 'disk':return m===0?'Not watching clutter.':m===1?`Shows safe clutter ${V}, next ${sec('disk').next[st.v.disk]}.`:`Moves safe clutter to the Trash ${V}, next ${sec('disk').next[st.v.disk]}.`;
    case 'awake':{const n=num('awake'),g=n?`Ends at ${n}&nbsp;% battery, a lost network or serious heat.`:'Ends on a lost network or serious heat, never on battery.';
      return m===0?'The Mac sleeps as usual.':m===1?`Asks when an agent starts working. ${g}`:`Keeps the Mac awake while agents work, then lets it sleep. ${g}`}
  }
}
function placeBars(root){
  root.querySelectorAll('.modes').forEach(g=>{const b=g.querySelector('[aria-checked="true"]'),bar=g.querySelector('.bar');if(!b)return;
    bar.style.width=b.offsetWidth+'px';bar.style.transform=`translateX(${b.offsetLeft}px)`});
}

const R={};

R.agents=()=>{
  const c=C.agents, w=working().length;

  const f=finished(), fh=sum(f,a=>agHeld(a.id));
  let ins=[];
  if(lexiconWaiting()) ins.push(`<b>lexicon-judge</b> has waited 3&nbsp;min for you.`);
  if(f.length) ins.push(`<b>fix auth redirect</b> finished 2&nbsp;h ago and still holds <b>${fmt(fh)}</b>.`);
  else ins.push(`Every finished agent is wrapped up. <b>studio-parity</b> is idle but still holds :3334.`);
  const card=a=>{
    const g=gone(a.id);

    const stt=g?'wrapped up':a.st==='w'&&has(a.id,'sleep')?`working ${a.a}`:`${STW[a.st]} ${a.a}`;
    return `<div class="card ${a.st}${g?' ghost':''}" data-item="${a.id}" data-k="${a.id}">
      <div class="top">${ICON[a.t]}<span class="stt"><i class="sm ${g?'i':a.st}"></i>${stt}</span></div>

R.servers=()=>{
  const m=md('servers'),th=num('servers'),c=C.servers,idle=idleSrv(),fr=sum(idle,x=>x.mb/1000);
  const cx=254,cy=308,rx=190,ry=150;
  const order=['s3000','s5173','s3334','s4000','s6006','s5432'];
  const ang=[-90,-30,30,90,150,210];

    const g=gone(id),keep=has(id,'keep');

    if(g){s='stopped';}

    if(m===0)stroke='var(--g3)';

    const dash=(x.kept||keep)&&!g?`stroke-dasharray="3 4"`:'';

      <div class="rg"><svg width="64" height="64" viewBox="0 0 64 64"><circle cx="32" cy="32" r="${r}" fill="none" stroke="${ring}" stroke-width="4" ${dash}/>${inner}
      <circle class="arc" data-a="sv-${id}" cx="32" cy="32" r="${r}" fill="none" stroke="${stroke}" stroke-width="4" stroke-linecap="round" stroke-dasharray="${cf}" transform="rotate(-90 32 32)" style="stroke-dashoffset:${cf*(1-frac)};opacity:${frac>0?1:0}"/></svg>
      <span class="p">:${x.p}</span></div><div class="k">${x.k}</div><div class="s">${s}</div></div>`}).join('');
  let ins=m===0?`Not watching. Six servers run, <b>${idle.length}</b> of them idle.`:idle.length?`${idle.length} servers sit idle. <b>:6006 storybook</b> has been idle 3&nbsp;days and nobody owns it.`:`No idle servers left. :3000 and :5173 serve <b>speed-3</b>.`;

R.trees=()=>{
  const m=md('trees'),c=C.trees,mg=mergedWT(),fr=sum(mg,w=>w.gb);
  const W=25,gap=7,gg=22,H=330,sc=H/3.2*0.92;
  const groups=[['m','merged'],['f','fine'],['u','in use'],['s','stale']];
  let x=0;const pos={},gx={};
  groups.forEach(([k],gi)=>{const ws=WT.filter(w=>w.k===k);gx[k]=[x];ws.forEach((w,i)=>{pos[w.id]=x;x+=W+(i<ws.length-1?gap:0)});gx[k][1]=x;x+=gg});
  const off=(508-(x-gg))/2;
  const trees=WT.map(w=>{const g=gone(w.id),cls=g?'ghost':has(w.id,'keep')&&w.k==='m'?'f':w.k;
    return `<div class="tree ${cls}" data-item="${w.id}" data-k="${w.id}" data-a="wt-${w.id}" style="left:${pos[w.id]+off}px;height:${g?6:w.gb*sc}px"></div>`}).join('');
  const labs=groups.map(([k,l])=>{const ws=WT.filter(w=>w.k===k&&!gone(w.id));const gb=sum(ws,w=>w.gb);
    return `<div class="glab cap" style="left:${gx[k][0]+off}px"><b>${ws.length} ${l}</b>${fmt(gb)}</div>`}).join('');
  const bl=gx.m[0]+off,bw=gx.m[1]-gx.m[0];
  const tallest=Math.max(...WT.filter(w=>w.k==='m').map(w=>w.gb))*sc;
  const by=166+H-tallest-22;
  let ins=m===0?`Not watching. 14 worktrees, ${mg.length} of them merged.`:mg.length?`${mg.length} merged worktrees hold <b>${fmt(fr)}</b>. <b>bp7-studio-dogfood</b> has 1 commit not in main, so it stays.`:`Every merged worktree is gone. Two stale ones wait for you to look.`;
  return `<p class="ins wt-ins">${ins}</p>
    <button class="btn pri wt-act" data-sa="merged"${mg.length?'':' disabled'}>Remove Merged <span class="tl">${mg.length?mg.length+" · "+fmt(fr):"none left"}</span></button>
    <div class="set wt-set${m===0?' off':''}" style="top:${by-104}px">${modes('trees')}<p class="rule">${rule('trees')}</p></div>
    <i class="brk" style="left:${bl}px;width:${bw}px;top:${by}px;opacity:${m===0?.15:.6}"></i>
    <div class="forest${m===0?' off':''}">${trees}</div>
    <i class="ground"></i>${labs}
    <p class="cap wt-leg">Height = size on disk. Solid = merged, outline = stale, white = an agent works in it</p>`;

R.awake=()=>{
  const m=md('awake'),c=C.awake,h=holders(),n=num('awake'),cx=330,cy=268,r=104,cf=2*Math.PI*r;
  const on=m!==0&&(h.length>0||st.k1h);
  const pt=(p,rr)=>{const a=(p/100*360-90)*Math.PI/180;return [cx+rr*Math.cos(a),cy+rr*Math.sin(a)]};
  const [tx1,ty1]=pt(n,r-14),[tx2,ty2]=pt(n,r+14);
  const vlab=sec('awake').num.map((p,i)=>{const [x,y]=pt(p,r+34);const lab=sec('awake').vals[i];
    return `<button class="kv" role="radio" aria-checked="${st.v.awake===i}" data-val="${i}" data-for="awake" style="left:${x+(p===0?-16:4)}px;top:${y+(p===0?-4:0)}px">${lab.replace(' ','&nbsp;')}</button>`}).join('');
  const list=AG.filter(a=>!gone(a.id));
  const R2=192, step=50, n0=(list.length-1)/2;
  const nodes=list.map((a,i)=>{const dy=(i-n0)*step,dx=Math.sqrt(Math.max(0,R2*R2-dy*dy)),x=cx-dx,y=cy+dy;

      <line data-a="ka-tick" x1="${tx1}" y1="${ty1}" x2="${tx2}" y2="${ty2}" stroke="#fff" stroke-width="2.5" stroke-linecap="round" style="opacity:${n&&m!==0?1:0};transition:opacity .3s"/>

    ${nodes.map(o=>o.html).join('')}

};

    const facts=[['Tool',TOOL[a.t]],['Where',a.w],s.length?['Servers',s.map(x=>':'+x.p).join(', ')]:null,w?['Worktree',w.n+(w.k==='m'?' · merged':'')]:null].filter(Boolean);

    const facts=[['CPU',`${Math.round(cpuOf(a)*10)/10} %`],['Memory',fmt(memOf(a))]];

    const facts=[['Port',':'+x.p+' · '+x.k],['Memory',x.mb+' MB'],['Owner',x.ag?`<span class="lk" data-goto="${x.ag}">${byId[x.ag].n}</span>`:x.o||'nobody'],x.wt?['Worktree',x.wt]:null,x.idle?['Unused',idleTxt(x.idle)]:null].filter(Boolean);
    let acts=[];
    if(g) acts=[A('restart','Restart','')];
    else{acts.push(A('stop','Stop',x.mb+' MB'));if(!x.use&&!x.kept)acts.push(has(x.id,'keep')?A('unkeep','Let It Go',''):A('keep','Keep',''));acts.push(A('open','Open in Browser','localhost:'+x.p));if(x.ag)acts.push(A('goag','Go to Agent',byId[x.ag].n));}
    return {t:':'+x.p+' '+x.k,sb:'Server',status,facts,acts:acts.slice(0,4),sec:'servers'};

  if(WT.includes(o)){

    let acts=[];

  const facts=[['Size',fmt(d.gb)],['What',d.x],d.tool?['Command',d.tool]:null].filter(Boolean);
  let acts=[];
  if(g) acts=[A('undocl','Bring Back','')];
  else{if(!d.rep) acts.push(A('clean','Clean',d.tool?'its own command':'to the Trash'));else acts.push(A('clean','Clean…','report only',1));
    if(!d.rep) acts.push(has(d.id,'keep')?A('unkeep','Let It Go',''):A('keep','Keep',''));acts.push(A('finder','Show in Finder',''));}

function clock(min){const t=16*60+42+min;return `${String(Math.floor(t/60)%24).padStart(2,'0')}:${String(Math.round(t%60)).padStart(2,'0')}`}

/* ---------- item actions ---------- */
function act(id,v){
  const o=byId[id],nm=o.n||(':'+o.p);
  const msgs={
    tab:`Opened <b>${nm}</b> in its ${o.w}.`,open:`Opened <b>localhost:${o.p}</b> in the browser.`,finder:`Showed <b>${nm}</b> in Finder.`,editor:`Opened <b>${nm}</b> in Cursor.`
  };
  if(v==='goag'){go(o.ag,true);hideCard();return}
  if(msgs[v]){ if(v==='tab'&&id==='lexicon') {push(); fl('lexicon').seen=1; paint(); toast(msgs[v]);} else toast(msgs[v],true); return;}
  const OUT=['quit','stop','rm','clean','wrap1'];
  const doIt=()=>{
    push();
    let m='';
    switch(v){
      case 'quit':fl(id).gone=1;m=`Quit <b>${nm}</b>. Freed ${fmt(memOf(o))}.`;break;
      case 'trim':fl('chrome').trim=1;m=`Closed 14 noise tabs in <b>Chrome</b>. 31 work tabs stay.`;break;
      case 'list':fl(id).list=1;m=`<b>${nm}</b> is on the close list.`;break;
      case 'keep':fl(id).keep=1;m=`<b>${nm}</b> stays.`;break;
      case 'unkeep':fl(id).keep=0;m=`<b>${nm}</b> is back on the plan.`;break;
      case 'restore1':case 'restart':case 'undorm':case 'undocl':fl(id).gone=0;m=`Brought back <b>${nm}</b>.`;break;
      case 'stop':fl(id).gone=1;m=`Stopped <b>:${o.p} ${o.k}</b>. Freed ${o.mb} MB.`;break;
      case 'rm':fl(id).gone=1;m=`Moved <b>${nm}</b> to the Trash${id==='wt-bp8'?' after a git bundle':''}. Freed ${fmt(o.gb)}.`;break;
      case 'clean':fl(id).gone=1;m=`Cleaned <b>${nm}</b>. Freed ${fmt(o.gb)}.`;break;
      case 'wrap1':m=wrap(o);break;
      case 'undo':fl(id).gone=0;agSrvAll(id).forEach(x=>fl(x.id).gone=0);const w=WT.find(t=>t.ag===id);if(w)fl(w.id).gone=0;m=`Brought back <b>${nm}</b> with its server and worktree.`;break;
      case 'sleep1':fl(id).sleep=1;m=`<b>${nm}</b> no longer keeps the Mac awake.`;break;
      case 'wake':fl(id).sleep=0;m=`<b>${nm}</b> keeps the Mac awake again.`;break;
      case 'k1h1':st.k1h=1;m=`The Mac stays awake until <b>17:42</b>.`;break;
      case 'stopag':agSrv(id).forEach(x=>fl(x.id).gone=1);m=`Stopped the servers of <b>${nm}</b>.`;break;
    }
    paint();toast(m);
  };
  hideCard();
  if(OUT.includes(v)){outgo([id]);setTimeout(doIt,RM?0:320)} else doIt();
}
const agSrvAll=id=>SRV.filter(x=>x.ag===id);
function wrap(a){
  const s=agSrv(a.id),w=agWT(a.id),h=agHeld(a.id);
  s.forEach(x=>fl(x.id).gone=1); if(w&&w.k==='m') fl(w.id).gone=1; fl(a.id).gone=1;
  return `Wrapped up <b>${a.n}</b>: stopped ${s.map(x=>':'+x.p).join(', ')}, removed its merged worktree. Freed ${fmt(h)}.`;
}

const SA={

  merged:{keys:()=>mergedWT().map(w=>w.id),run:()=>{const n=mergedWT(),f=sum(n,w=>w.gb);n.forEach(w=>fl(w.id).gone=1);return `Moved <b>${n.length} merged worktrees</b> to the Trash. Freed ${fmt(f)}.`}},
  clean:{keys:()=>safeDK().map(d=>d.id),run:()=>{const n=safeDK(),f=sum(n,d=>d.gb);n.forEach(d=>fl(d.id).gone=1);return `Cleaned <b>${fmt(f)}</b>: DerivedData and node_modules to the Trash, npm by its own command.`}},

function hl(k){const keys=SA[k].keys();if(!keys.length)return;const p=$('pane');p.classList.add('hlon');keys.forEach(id=>p.querySelectorAll(`[data-k="${id}"]`).forEach(e=>e.classList.add('hit')))}

/* ---------- paint with easing (old style -> new style) ---------- */
function morph(el,html){
  const old={},oldN={};
  el.querySelectorAll('[data-a]').forEach(e=>old[e.dataset.a]=e.getAttribute('style')||'');
  el.querySelectorAll('[data-n]').forEach(e=>oldN[e.dataset.n]=e.textContent);
  el.innerHTML=html;
  const todo=[];
  el.querySelectorAll('[data-a]').forEach(e=>{const o=old[e.dataset.a],n=e.getAttribute('style')||'';if(o!=null&&o!==n){e.setAttribute('style',o);todo.push([e,n])}});
  if(todo.length){void el.offsetWidth;requestAnimationFrame(()=>todo.forEach(([e,n])=>e.setAttribute('style',n)))}
  el.querySelectorAll('[data-n]').forEach(e=>{const o=parseFloat(oldN[e.dataset.n]),n=parseFloat(e.textContent);if(isNaN(o)||isNaN(n)||o===n||RM)return;
    const dec=(e.textContent.split('.')[1]||'').length,t0=performance.now();
    const step=t=>{const k=Math.min(1,(t-t0)/600),q=1-Math.pow(1-k,3);e.textContent=(o+(n-o)*q).toFixed(dec);if(k<1)requestAnimationFrame(step)};requestAnimationFrame(step)});
}
let lastSel=null;
function paint(){

  document.documentElement.style.setProperty('--c',C[st.sel]);
  morph($('idx'),renderIdx());
  const p=$('pane');

    p.classList.add('swap');
    setTimeout(()=>{p.innerHTML='';morph(p,R[st.sel]());placeBars(p);p.classList.remove('swap')},180);
  } else {morph(p,R[st.sel]());placeBars(p)}

}

function go(id,flash){

  if(!sid)return;
  st.sel=sid;hideCard();paint();
  if(flash&&id!==sid) setTimeout(()=>{const e=document.querySelector(`#pane [data-k="${id}"]`);if(e){e.classList.remove('flash');void e.offsetWidth;e.classList.add('flash')}},260);
}
$('one').onclick=()=>{st.one=!st.one;$('one').setAttribute('aria-checked',st.one);renderMenu()};
$('login').onclick=()=>{st.login=!st.login;$('login').setAttribute('aria-checked',st.login)};
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){const i=S.findIndex(s=>s.id===st.sel),n=(i+(e.key==='ArrowDown'?1:-1)+S.length)%S.length;go(S[n].id);e.preventDefault()}
  if((e.metaKey||e.ctrlKey)&&e.key==='z'){$('tbtn').click()}
});

/* ---------- stage scale ---------- */
function scale(){return parseFloat(stage.dataset.s||1)}
function fit(){const s=Math.min(innerWidth/1280,innerHeight/800);stage.dataset.s=s;stage.style.transform=`translate(${(innerWidth-1280*s)/2}px,${(innerHeight-800*s)/2}px) scale(${s})`;renderMenu()}
addEventListener('resize',fit);
const q=new URLSearchParams(location.search).get('tab');if(q&&sec(q))st.sel=q;
paint();fit();
document.fonts&&document.fonts.ready.then(()=>placeBars($('pane')));
</script>
</body>
</html>
