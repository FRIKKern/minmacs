<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stage Board Columns</title>
<!--
  52-a · Three tabs, Stage Board Columns

  Sheet 780 x 620 hangs from the menu bar icon of the tab you are on. Three tabs in a segmented control:
  Workstreams · Performance · Settings. Advanced mode (a sentence in Settings) grows the control to
  Workstreams · Agents · Apps · Servers · Worktrees · Disk · Settings; Performance becomes Apps.

  Workstreams = a calm stage board. Stages: Needs you, Working, Idle, Ready to wrap up.
   a (cols):  four columns left to right; Leftovers is a footer shelf under the board.
              A card expands in place: its column widens, the others give way.
   b (lanes): one horizontal swimlane per stage, read top to bottom; long names fit;
              Leftovers is a fifth, quieter lane. A card expands to the full lane width.
  Each card shows its holdings as small section-colored marks (agents pink dots, servers teal squares,
  worktree green branch, PR number, caches amber bars, headless browser blue ring). The Wrap Up rule is
  woven into the Ready stage itself (mode word + value + live countdown), not parked under the board.
  Performance = two ftop meters (colored end = what MinMacs Now frees) + apps by fate, agent load linked
  to its workstream. Settings = sentences with changeable words (starred 14-b), then plain sentences
  with checks: lid, one icon, open at login, Advanced mode.
  Grid: 28 side gutter, unit 4, scale 4 8 12 16 24. Type 22 / 19 (sentences) / 13 / 12 / 11 + ftop 34.
-->
<style>
:root{
  --glass:rgba(28,29,38,.88);
  --line:rgba(255,255,255,.07);
  --tx:rgba(255,255,255,.94);
  --tx2:rgba(235,235,245,.62);
  --tx3:rgba(235,235,245,.36);
  --g1:rgba(255,255,255,.06);
  --g2:rgba(255,255,255,.13);
  --g3:rgba(255,255,255,.34);
  --ease:cubic-bezier(.3,.7,.2,1);
  --ws:#FF8A66;--ag:#EE85B5;--ap:#5B9BFF;--sv:#3FD0B8;--wt:#4CC96B;--dk:#F2B544;--fr:#FF6B8A;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#1a1636}
body{font-family:-apple-system,"SF Pro Text",system-ui,sans-serif;color:var(--tx);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;font-size:13px;line-height:18px;cursor:default;user-select:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;text-align:left;line-height:inherit;letter-spacing:inherit}
b{font-weight:500;color:var(--tx)}
:focus{outline:none}
:focus-visible{outline:2px solid rgba(255,255,255,.5);outline-offset:2px;border-radius:8px}
#stage{position:absolute;left:0;top:0;width:1280px;height:800px;transform-origin:0 0;overflow:hidden;
  background:
   radial-gradient(760px 560px at 10% 6%,#4b3c9e 0%,rgba(75,60,158,0) 70%),
   radial-gradient(700px 520px at 84% 2%,#22618f 0%,rgba(34,97,143,0) 70%),
   radial-gradient(820px 620px at 88% 104%,#a0436f 0%,rgba(160,67,111,0) 70%),
   radial-gradient(640px 520px at 18% 100%,#3a2463 0%,rgba(58,36,99,0) 75%),
   #1d1a3c}

/* menu bar */
.mb{position:absolute;left:0;right:0;top:0;height:26px;display:flex;align-items:center;justify-content:space-between;padding:0 12px 0 16px;background:rgba(18,14,40,.32);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);font-size:13px;color:rgba(255,255,255,.92);z-index:5}
.mb-l,.mb-r{display:flex;align-items:center;gap:18px}
.mb-l b{font-weight:700}
.mb-r{gap:14px}
.icons{position:relative;display:flex;align-items:center;gap:12px}
.hl{position:absolute;top:-3px;left:0;height:22px;border-radius:6px;background:rgba(255,255,255,.2);transition:transform .45s var(--ease),width .45s var(--ease),opacity .3s;pointer-events:none}
.mi{position:relative;display:flex;align-items:center;gap:5px;max-width:60px;overflow:hidden;cursor:pointer;white-space:nowrap;transition:max-width .5s var(--ease),opacity .35s,margin .5s var(--ease)}
.mi.off{max-width:0;opacity:0;margin-left:-12px}
.mi .mn{font-size:12px;font-weight:500}
.mi .dot{position:absolute;right:0;top:0;width:6px;height:6px;border-radius:50%;background:var(--ws);box-shadow:0 0 0 1.5px rgba(30,26,60,.9)}
#clock{min-width:118px;text-align:right}

/* sheet */
.sheet{position:absolute;top:34px;left:476px;width:780px;height:620px;background:var(--glass);backdrop-filter:blur(36px) saturate(1.5);-webkit-backdrop-filter:blur(36px) saturate(1.5);border:1px solid rgba(255,255,255,.085);border-radius:22px;box-shadow:0 34px 100px rgba(6,4,24,.5),inset 0 1px 0 rgba(255,255,255,.035);animation:drop .6s var(--ease) both}
@keyframes drop{from{opacity:0;transform:translateY(-10px)}}
.clip{position:absolute;inset:0;border-radius:22px;overflow:hidden}
.nub{position:absolute;top:-8px;left:0;width:18px;height:8px;margin-left:-9px;transition:transform .45s var(--ease)}
.nub svg{display:block}

.head{position:absolute;left:24px;right:28px;top:0;height:60px;display:flex;align-items:center;justify-content:space-between;gap:16px;white-space:nowrap}
.seg{position:relative;display:flex;padding:3px;border-radius:12px;background:rgba(255,255,255,.05);box-shadow:inset 0 0 0 1px rgba(255,255,255,.03)}
.seg .pill{position:absolute;top:3px;left:0;height:30px;border-radius:9px;background:rgba(255,255,255,.115);box-shadow:0 1px 2px rgba(0,0,0,.2),inset 0 1px 0 rgba(255,255,255,.05);transition:transform .5s var(--ease),width .5s var(--ease)}
.seg button{position:relative;z-index:1;display:flex;align-items:center;height:30px;padding:0 15px;border-radius:9px;font-size:13px;font-weight:500;color:var(--tx3);white-space:nowrap;overflow:hidden;max-width:150px;transition:color .25s,max-width .55s var(--ease),padding .55s var(--ease),opacity .4s}
.seg.many button{padding:0 11px}
.seg button:hover{color:var(--tx2)}
.seg button[aria-selected="true"]{color:var(--tx)}
.seg button.fold{max-width:0;padding-left:0;padding-right:0;opacity:0;pointer-events:none}
.seg button .nd{width:6px;height:6px;border-radius:50%;background:var(--ws);margin-left:7px;flex:none}
.seg button .lb{display:inline-block}
.seg button.arrive{animation:arrive 1.8s var(--ease) both}
@keyframes arrive{0%{color:#fff;text-shadow:0 0 14px rgba(255,255,255,.7)}60%{color:rgba(255,255,255,.85)}100%{}}
.lb.swap{animation:swap .5s var(--ease)}
@keyframes swap{from{opacity:0;filter:blur(3px);transform:translateY(4px)}}
.hlive{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--tx3);transition:opacity .3s}
.hlive i{width:6px;height:6px;border-radius:50%;background:var(--wt);box-shadow:0 0 0 3px rgba(76,201,107,.16)}
.hlive.off i{background:var(--g3);box-shadow:none}

.pane{position:absolute;left:28px;right:28px;top:60px;bottom:22px}
.pane.in{animation:paneIn .45s var(--ease)}
@keyframes paneIn{from{opacity:0;transform:translateY(6px)}}

/* ---------- Workstreams ---------- */
.wsv{display:flex;flex-direction:column;height:100%}
.hd{display:flex;align-items:center;justify-content:space-between;gap:20px;height:34px;margin-top:4px}
.hd h2{font-size:22px;line-height:28px;font-weight:600;letter-spacing:-.02em;white-space:nowrap}
.sub{display:flex;align-items:center;justify-content:space-between;gap:16px;height:20px;margin-top:4px;font-size:12px;color:var(--tx3);white-space:nowrap}
.sub .pvl{display:none;color:var(--tx2)}
.wsv.pv-all .sub .st,.wsv.pv-all .sub .lg,.wsv.pv-lo .sub .st,.wsv.pv-lo .sub .lg{display:none}
.wsv.pv-all .sub .pvl,.wsv.pv-lo .sub .pvl{display:block;animation:swap .3s var(--ease)}
.lg{display:flex;align-items:center;gap:12px}
.lg span{display:flex;align-items:center;gap:5px}
.bigb{display:flex;align-items:center;gap:8px;height:34px;padding:0 16px;border-radius:17px;background:color-mix(in srgb,var(--ws) 30%,transparent);font-weight:500;color:var(--tx);white-space:nowrap;transition:background .2s,opacity .3s}
.bigb:hover{background:color-mix(in srgb,var(--ws) 44%,transparent)}
.bigb .tl{color:rgba(255,255,255,.62);font-weight:400}
.bigb.dis{background:var(--g1);color:var(--tx3);cursor:default}

.board{flex:1;min-height:0;margin-top:16px;display:flex;gap:12px}
.col{flex:1 1 0;min-width:0;display:flex;flex-direction:column;transition:flex-grow .55s var(--ease);overflow:hidden}
.col.wide{flex-grow:2.5}
.sh{display:flex;align-items:center;gap:8px;height:22px;font-size:12px;font-weight:500;color:var(--tx2);white-space:nowrap}
.sh .n{color:var(--tx3);font-weight:400}
.sg{flex:none;width:12px;height:12px;display:flex;align-items:center;justify-content:center}
.cards{flex:1;min-height:0;overflow-y:auto;scrollbar-width:none;display:flex;flex-direction:column;gap:6px;padding:8px 1px 14px;-webkit-mask-image:linear-gradient(#000 calc(100% - 14px),transparent);mask-image:linear-gradient(#000 calc(100% - 14px),transparent)}
.cards::-webkit-scrollbar{display:none}
.col .empty{font-size:12px;color:var(--tx3);padding:10px 2px}

/* the woven rule (Ready stage) */
.rule{display:flex;flex-direction:column;align-items:flex-start;gap:1px;margin-top:6px}
.rmk{max-width:100%;overflow:hidden;display:flex;align-items:center;gap:6px;height:22px;padding:0 9px 0 8px;margin-left:-2px;border-radius:11px;background:rgba(255,138,102,.1);font-size:11px;font-weight:500;color:var(--ws);white-space:nowrap;transition:background .2s}
.rmk:hover,.rmk[aria-expanded="true"]{background:rgba(255,138,102,.2)}
.rmk.m0{background:var(--g1);color:var(--tx3)}
.rmk .mm{display:flex;gap:2px}
.rmk .mm i{width:4px;height:4px;border-radius:50%;background:currentColor;opacity:.3}
.rmk .mm i.on{opacity:1}
.rlive{font-size:11px;line-height:15px;color:var(--tx3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.rlive b{color:var(--tx2);font-weight:500}

.card{position:relative;flex:none;border-radius:13px;background:rgba(255,255,255,.04);box-shadow:inset 0 0 0 1px rgba(255,255,255,.045);padding:9px 11px 9px;transition:background .25s,box-shadow .3s,opacity .35s,filter .35s;cursor:pointer}
.card:hover{background:rgba(255,255,255,.07)}
.card.exp{background:rgba(255,255,255,.075);cursor:default}
.card.st-n{box-shadow:inset 0 0 0 1px rgba(255,138,102,.28)}
.card.kept .c1 .nm::after{content:" · kept";color:var(--tx3);font-weight:400}
.c1{display:flex;align-items:center;gap:8px;height:18px;font-size:13px;font-weight:500}
.c1 .ti{flex:none;width:16px;height:16px;display:flex}
.c1 .nm{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.c1 .sz{flex:none;font-size:12px;font-weight:400;color:var(--tx2)}
.c2{margin-top:3px;font-size:12px;line-height:16px;color:var(--tx3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c2 .q{color:var(--ws)}
.col .card.st-n .c2{white-space:normal}
.c3{margin-top:6px;height:14px;overflow:hidden;display:flex;align-items:center;gap:4px;transition:opacity .2s}
.card .hov{position:absolute;left:10px;right:10px;bottom:6px;height:22px;display:flex;align-items:center;gap:6px;opacity:0;pointer-events:none;transition:opacity .2s}
.card:not(.exp):hover .hov,.card:not(.exp):focus-within .hov{opacity:1;pointer-events:auto}
.card:not(.exp):hover .c3,.card:not(.exp):focus-within .c3{opacity:0}
.card.exp .c3,.card.exp .hov{display:none}
.card.dim{opacity:.35;filter:saturate(.4)}
.card.hit{box-shadow:inset 0 0 0 1.5px rgba(255,138,102,.75),0 0 24px rgba(255,138,102,.16)}
.card.new{animation:newg 4.5s var(--ease) both}
@keyframes newg{0%{box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.6),0 0 22px rgba(255,255,255,.18);transform:translateY(-4px);opacity:0}12%{opacity:1;transform:none}100%{}}
.card.bye{animation:bye 1.4s var(--ease) forwards;pointer-events:none;overflow:hidden}
@keyframes bye{0%,55%{max-height:200px;opacity:1}100%{max-height:0;opacity:0;padding-top:0;padding-bottom:0;margin-top:-8px}}
.newtag{font-size:10px;font-weight:600;letter-spacing:.02em;color:#fff;background:rgba(255,255,255,.16);border-radius:5px;padding:0 5px;line-height:15px;animation:fadeT 4.5s forwards}
@keyframes fadeT{0%,80%{opacity:1}100%{opacity:0}}

/* holdings marks */
.mk{flex:none;display:inline-block}
.mk.a{width:7px;height:7px;border-radius:50%;background:var(--ag)}
.mk.a.sub{width:5px;height:5px;opacity:.85}
.mk.a.fin{background:none;box-shadow:inset 0 0 0 1.3px var(--ag)}
.mk.a.wait{background:var(--ws)}
.mk.s{width:7px;height:7px;border-radius:2px;background:var(--sv)}
.mk.s.idle{background:none;box-shadow:inset 0 0 0 1.4px var(--sv)}
.mk.c{width:4px;height:9px;border-radius:1.5px;background:var(--dk)}
.mk.b{width:8px;height:8px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--ap)}
.mk.w{width:10px;height:10px;display:flex}
.mk.p{font-size:11px;line-height:14px;color:color-mix(in srgb,var(--wt) 85%,white)}
.mk.new{animation:mkn 3s var(--ease)}
@keyframes mkn{0%{transform:scale(2.2);box-shadow:0 0 0 4px rgba(255,255,255,.25)}100%{}}
.mgap{width:3px;flex:none}
.c3 .hold{margin-left:auto;font-size:11px;color:var(--tx2);white-space:nowrap;flex:none}

/* expanded */
.det{margin-top:10px}
.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:8px;height:24px;font-size:12px;color:var(--tx3);white-space:nowrap;transition:opacity .25s}
.row .ic{flex:none;width:10px;display:flex;justify-content:center}
.row .n{color:var(--tx);flex:none}
.row .x{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis}
.row .v{flex:none;color:var(--tx2)}
.row .hb{flex:none;display:flex}
.row .tg{flex:none;font-size:10px;font-weight:600;letter-spacing:.02em;width:0;overflow:hidden;opacity:0;transition:opacity .2s}
.row.new{animation:rown 4s var(--ease)}
@keyframes rown{0%{opacity:0;transform:translateX(-6px);background:rgba(255,255,255,.08)}15%{opacity:1;transform:none}}
.row.fin .n{color:var(--tx3);text-decoration:line-through;text-decoration-color:rgba(255,255,255,.25)}
.card.pv .row.g .tg{width:auto;opacity:1;color:var(--ws)}
.card.pv .row.k .tg{width:auto;opacity:1;color:var(--tx3)}
.card.pv .row.k{opacity:.6}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.ab{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:12px;background:var(--g1);font-size:11px;font-weight:500;color:var(--tx2);white-space:nowrap;transition:background .2s,color .2s}
.ab:hover{background:var(--g2);color:var(--tx)}
.ab .tl{color:var(--tx3);font-weight:400}
.ab.pri{background:color-mix(in srgb,var(--ws) 30%,transparent);color:var(--tx)}
.ab.pri:hover{background:color-mix(in srgb,var(--ws) 45%,transparent)}
.ab.pri .tl{color:rgba(255,255,255,.6)}
.ab.dis{background:none;box-shadow:inset 0 0 0 1px var(--g1);color:var(--tx3);cursor:default}
.ab.more{width:24px;padding:0;justify-content:center}
.pvt{margin-top:8px;font-size:11px;line-height:15px;color:var(--tx3);min-height:15px;white-space:normal}
.card.pv .pvt{color:var(--tx2)}
.xclose{position:absolute;right:8px;top:8px;width:22px;height:22px;border-radius:11px;display:flex;align-items:center;justify-content:center;color:var(--tx3)}
.xclose:hover{background:var(--g1);color:var(--tx)}
.card.exp .c1 .sz{margin-right:24px}

/* leftovers */
.shelf{flex:none;margin-top:2px;padding-top:10px;border-top:1px solid var(--line)}
.shelf .sp{flex:1 0 8px}
.shl{display:flex;flex-direction:column;justify-content:center;height:28px;margin-right:8px;white-space:nowrap}
.shl .t{font-size:12px;line-height:14px;font-weight:500;color:var(--tx2)}
.shl .x{font-size:10px;line-height:13px;color:var(--tx3)}
.shh{display:flex;align-items:center;gap:10px;height:28px;white-space:nowrap}
.shh .t{font-size:12px;font-weight:500;color:var(--tx2)}
.shh .x{font-size:12px;color:var(--tx3);overflow:hidden;text-overflow:ellipsis}
.shh .sp{flex:1}
.lob{display:flex;align-items:center;gap:8px;height:28px;padding:0 13px;border-radius:14px;background:color-mix(in srgb,var(--dk) 20%,transparent);font-size:12px;font-weight:500;color:var(--tx);white-space:nowrap;transition:background .2s}
.lob:hover{background:color-mix(in srgb,var(--dk) 32%,transparent)}
.lob .tl{color:rgba(255,255,255,.58);font-weight:400}
.lob.dis{background:var(--g1);color:var(--tx3);cursor:default}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{display:inline-flex;align-items:center;gap:7px;height:24px;padding:0 10px;border-radius:12px;background:rgba(255,255,255,.035);font-size:11px;color:var(--tx2);white-space:nowrap;transition:background .2s,opacity .3s,box-shadow .3s}
.chip:hover{background:rgba(255,255,255,.08);color:var(--tx)}
.chip .v{color:var(--tx3)}
.chip.kept{opacity:.5}
.chip.bye{animation:chipbye 1.2s var(--ease) forwards}
@keyframes chipbye{0%,40%{opacity:1}100%{opacity:0;transform:scale(.9)}}
.wsv.pv-lo .chip:not(.kept){box-shadow:inset 0 0 0 1.4px rgba(242,181,68,.7)}
.wsv.pv-lo .card{opacity:.4}
.lrule{display:flex;align-items:center;gap:6px;height:22px;padding:0 9px;border-radius:11px;background:rgba(242,181,68,.1);font-size:11px;font-weight:500;color:var(--dk);transition:background .2s}
.lrule:hover,.lrule[aria-expanded="true"]{background:rgba(242,181,68,.2)}
.lrule.m0{background:var(--g1);color:var(--tx3)}

/* ---------- lanes (b) ---------- */
.board.lanes{flex-direction:column;gap:0;overflow-y:auto;scrollbar-width:none;margin-top:12px}
.board.lanes::-webkit-scrollbar{display:none}
.lane{flex:none;display:grid;grid-template-columns:132px 1fr;column-gap:12px;padding:7px 0;border-top:1px solid var(--line)}
.lane:first-child{border-top:0;padding-top:4px}
.lane .lh{display:flex;flex-direction:column;gap:2px;padding-top:7px;min-width:0}
.lane .cards{min-width:0;flex-direction:row;flex-wrap:wrap;overflow:visible;padding:0;gap:8px;align-content:flex-start}
.lane .card{width:calc((100% - 8px)/2);padding:9px 12px 9px}
.lane .c2{display:flex;align-items:center;gap:10px}
.lane .c2 .stt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.lane .c1 .nm{flex:0 1 auto}
.lane .c1 .newtag{flex:none}
.lane .card.exp{width:100%}
.lane .c1 .mks{flex:none;display:flex;align-items:center;gap:5px;margin-left:auto;padding-left:10px}
.lane .card .hov{left:36px;bottom:7px;height:20px}
.lane .card:not(.exp):hover .c2,.lane .card:not(.exp):focus-within .c2{opacity:0}
.lane .c2{transition:opacity .2s}
.lane .card.exp .rows{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);column-gap:28px}
.lane .lo > div:last-child{min-width:0}
.lane .card.exp .c1 .mks{display:none}
.lane .empty{font-size:12px;color:var(--tx3);padding:8px 2px}
.lane.lo{opacity:1}
.lane.lo .lh .t{color:var(--tx3)}
.lane.lo .chips{margin-top:2px;gap:5px}
.lane .chip{padding:0 9px;gap:5px}
.lane.lo .lob{margin-top:8px;display:inline-flex}
.lane .rlive{margin-top:2px}

/* ---------- Performance ---------- */
.perf{display:flex;flex-direction:column;height:100%}
.meters{display:grid;grid-template-columns:1fr 1fr;gap:44px;padding-top:8px}
.mt .top{display:flex;align-items:center;gap:12px;height:40px}
.gauge{flex:none;width:30px;height:30px}
.bn{font-size:34px;line-height:40px;font-weight:500;letter-spacing:-.02em}
.un{font-size:14px;color:var(--tx3);margin-left:4px}
.mt .aside{margin-left:auto;font-size:12px;color:var(--tx3);white-space:nowrap}
.bar{position:relative;height:6px;border-radius:3px;background:rgba(255,255,255,.08);margin-top:12px;overflow:hidden}
.bar i{position:absolute;top:0;bottom:0;left:0;border-radius:3px;transition:width .9s var(--ease),left .9s var(--ease)}
.bar i.u{background:var(--ap)}
.bar i.f{background:var(--fr);border-radius:0 3px 3px 0}
.perf.pv-now .bar i.f{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.45}}
.cap{display:flex;justify-content:space-between;margin-top:8px;font-size:12px;color:var(--tx3);white-space:nowrap}
.cap .f{color:var(--fr)}

  p.innerHTML={ws:wsHTML,perf:perfHTML,set:setHTML,agents:agentsHTML,servers:serversHTML,trees:treesHTML,disk:diskHTML}[sel]();
  if(sc&&!anim){[...p.querySelectorAll('.cards,.board,.lst')].forEach((e,i)=>{if(sc[i]!=null)e.scrollTop=sc[i]})}

  if(exp){const c=p.querySelector(`.card[data-ws="${exp}"]`);if(c&&anim!==false)c.scrollIntoView({block:'nearest'})}
  renderHead();
}
function renderHead(){
  const W=working().length;
  $('hlive').className='hlive'+(D.lid?'':' off');
  $('hlive').innerHTML=`<i></i>${W} agent${W===1?'':'s'} working${D.lid?' · lid can close':''}`;
  $('nd').style.display=needsYou().length?'':'none';
  if($('mbdot')) $('mbdot').style.display=needsYou().length?'':'none';
}
function tickText(){
  document.querySelectorAll('[data-t]').forEach(e=>{
    const [k,id]=e.dataset.t.split(':');
    if(k==='st'){const w=ws(id);if(w&&!isGone(id))e.innerHTML=stateText(w)}
    else if(k==='rule')e.innerHTML=ruleLive();
    else if(k==='sub')e.innerHTML=subStats();
    else if(k==='live')e.innerHTML=liveLine(id);
    else if(k==='cpu')e.textContent=LOAD();
    else if(k==='mem')e.textContent=MEM().toFixed(1);
    else if(k==='cpubar')e.style.width=(LOAD()-FREES().c)+'%';
    else if(k==='cpuf'){e.style.left=(LOAD()-FREES().c)+'%'}
    else if(k==='membar')e.style.width=((MEM()-FREES().m)/32*100)+'%';
    else if(k==='memf'){e.style.left=((MEM()-FREES().m)/32*100)+'%'}
    else if(k==='srv'){const s=sv(id);if(s&&!s.busy&&!s.kept)e.textContent='idle '+(idleOf(s)<1440?dur(idleOf(s)):sdur(idleOf(s)))}
    else if(k==='lane'){const s=sv(id);if(s)e.innerHTML=s.busy?hbSVG(s,220,16):s.kept?e.innerHTML:srvRuleSVG(s,220)}
    else if(k==='agtot'){e.textContent=sum(AGL.filter(x=>live(ws(x.ws))),agC)+' %'}
    else if(k==='agc'){const x=AGL.find(o=>o.ws===id);e.textContent=agC(x)+' %'}
    else if(k==='ag'){const w=ws(id);if(w)e.textContent=agState(w)}
    else if(k==='cpuapp'){const a=D.apps.find(x=>x.id===id);if(a)e.innerHTML=cpuOf(a)+'<small>%</small>'}
  });
  document.querySelectorAll('.row .hb').forEach(e=>{const r=e.closest('.row');const card=e.closest('.card');if(!card)return;const w=ws(card.dataset.ws);const S=wSrv(w);const i=[...card.querySelectorAll('.row .hb')].indexOf(e);if(S[i])e.innerHTML=hbSVG(S[i],44,12)});
  document.querySelectorAll('[data-g]').forEach((c,i)=>{const p=i===0?LOAD()/100:MEM()/32;const C=2*Math.PI*11;c.setAttribute('stroke-dasharray',`${C*.75*p} ${C}`)});
  $('mbn').textContent=LOAD()+' %';
  const m=16*60+42+Math.floor(T),h=Math.floor(m/60)%24,mm=m%60;$('clock').innerHTML=`Tue 27 Oct&nbsp;&nbsp;${h}:${String(mm).padStart(2,'0')}`;
}

/* ---------- actions ---------- */
let lastSnap=null, toastTimer=null, toastUndo=null;
const snap=()=>JSON.stringify(D);
function toast(html,undoFn,label){
  $('tt').innerHTML=html; $('tbtn').textContent=label||'Undo'; $('tbtn').style.display=undoFn?'':'none';
  toastUndo=undoFn; $('toast').classList.add('on'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>$('toast').classList.remove('on'),7000);
}
function act(msg,fn,opts){
  const s=snap(); fn(); renderPane(false); renderIcons();
  toast(msg,()=>{D=JSON.parse(s); if(opts&&opts.spare) opts.spare.forEach(id=>fl(id).spared=1); BYET.clear(); renderPane(false); renderIcons(); toast(opts&&opts.spare?'Undone. Auto will leave '+opts.spareName+' alone.':'Undone. Everything is back.',null)});
  if(opts&&opts.bye) setTimeout(()=>renderPane(false),1450);
}
function bye(ids,msg){ids.forEach(id=>{BYET.set(id,nowMs());if(msg)BYET.set(id+'#msg',msg)})}
function wrapWs(w){wSrv(w).forEach(s=>fl(s.id).gone=1);if(w.wt)fl(w.wt.n).gone=1;const t=D.wt.find(x=>x.n===w.wt?.n);if(t)fl(t.id).gone=1;fl(w.id).gone=1;if(exp===w.id)exp=null}
function wrapMsg(w,auto){return `${auto?'<span class="au">Auto</span> w':'W'}rapped up <b>${w.n}</b>: ${and(wrapParts(w).map(p=>p.replace(/^stops/,'stopped').replace(/^removes/,'removed').replace(/^closes/,'closed')))}. ${fmt(wFree(w))} back.`}
function run(a,id){
  const w=ws(id);
  switch(a){
    case 'wrap':{const m=wrapMsg(w);const fr=fmt(wFree(w));bye([w.id],'Wrapped up · '+fr+' back');act(nb(m),()=>wrapWs(w),{bye:1});break}
    case 'wrapall':{const r=ready();const g=sum(r,wFree);r.forEach(x=>bye([x.id],'Wrapped up · '+fmt(wFree(x))+' back'));act(nb(`Wrapped up <b>${and(r.map(x=>x.n))}</b>: stopped their servers, removed their worktrees and node_modules. ${fmt(g)} back.`),()=>r.forEach(wrapWs),{bye:1});break}
    case 'nav':toast(`Switched to <b>${w.n}</b> in ${w.where||TOOLN[w.tool]}.`,null);if(w.st==='n'){setTimeout(()=>{if(live(w)&&w.st==='n'){w.st='w';w.t0=T;w.m0=0;w.q='';NEWT.set(w.id,nowMs());renderPane(false);toast(`You answered <b>${w.n}</b>. It is working again.`,null)}},3500)}break;
    case 'stopws':{const S=wSrv(w);act(nb(`Stopped ${and(S.map(s=>'<b>'+s.p+'</b>'))} for ${w.n}. ${fmt(sum(S,s=>s.mb/1000))} back.`),()=>S.forEach(s=>fl(s.id).gone=1));break}
    case 'navx':toast(`Switched to <b>${id}</b>.`,null);break;
    case 'openpr':toast(`Opened <b>#${w.pr.n}</b> on GitHub.`,null);break;
    case 'editor':toast(`Opened <b>${w.wt.n}</b> in Cursor.`,null);break;
    case 'keep':{const k=has(w.id,'keep');act(k?`<b>${w.n}</b> is no longer kept.`:`Keeping <b>${w.n}</b>. Wrap Up and Auto leave it alone.`,()=>{fl(w.id).keep=k?0:1});break}
    case 'cleanlo':{const l=loLive();const g=sum(l,x=>x.gb);bye(l.map(x=>x.id));act(nb(`Cleaned up ${l.length} leftovers: stopped :6006, removed ${l.filter(x=>x.kind==='Worktree').length} old worktrees, moved caches to the Trash. ${fmt(g)} back.`),()=>l.forEach(x=>{fl(x.id).gone=1;const s=sv(x.id);if(s)fl(s.id).gone=1}),{bye:1});break}
    case 'lo':{const x=D.lo.find(o=>o.id===id);bye([x.id]);act(nb(`${cap(x.done)} <b>${x.n}</b>. ${fmt(x.gb)} back.`),()=>fl(x.id).gone=1,{bye:1});break}
    case 'keeplo':{const x=D.lo.find(o=>o.id===id);const k=has(id,'keep');act(k?`<b>${x.n}</b> is no longer kept.`:`Keeping <b>${x.n}</b>. Clean Up leaves it alone.`,()=>fl(id).keep=k?0:1);break}
    case 'now':act(nb(`<b>MinMacs Now</b>: trimmed 14 noise tabs in Chrome and quit Spotify. 22 % CPU and 9.3 GB back. Restore brings them back.`),()=>{D.nowDone=true;D.apps.filter(a=>a.fate==='close').forEach(a=>fl(a.id).gone=1);D.restoreAt=clockHM();D.restoreTxt='2 apps · 14 tabs'});break;
    case 'restore':if(!D.restoreTxt)break;act(`Restored <b>${D.restoreTxt}</b>.`,()=>{D.nowDone=false;D.apps.forEach(a=>{if(has(a.id,'gone'))fl(a.id).gone=0});D.restoreTxt=''});break;
    case 'quit':{const a=D.apps.find(x=>x.id===id);act(a.id==='chrome'?'Trimmed <b>14 noise tabs</b> in Chrome. 31 work tabs stay.':`Quit <b>${a.n}</b>. ${fmt(a.mem)} back.`,()=>fl(id).gone=1);break}
    case 'keepapp':{const a=D.apps.find(x=>x.id===id);act(`Keeping <b>${a.n}</b>. MinMacs Now leaves it open.`,()=>a.fate='kept');break}
    case 'willclose':{const a=D.apps.find(x=>x.id===id);act(`<b>${a.n}</b> will close with MinMacs Now.`,()=>{a.fate='close';a.nt='Quits'});break}
    case 'unkeep':{const a=D.apps.find(x=>x.id===id);act(`<b>${a.n}</b> moved to Unsorted.`,()=>{a.fate='unsorted'});break}
    case 'gows':exp=id;selectTabForce('ws');break;
    case 'goset':selectTab('set');break;
    case 'stopsrv':{const s=sv(id);act(nb(`Stopped <b>${s.p} ${s.k}</b>. ${fmt(s.mb/1000)} back.`),()=>fl(id).gone=1);break}
    case 'keepsrv':{const s=sv(id);const k=has(id,'keep');act(k?`<b>${s.p}</b> is no longer kept.`:`Keeping <b>${s.p}</b>. The rule leaves it alone.`,()=>fl(id).keep=k?0:1);break}
    case 'stopidle':{const S=D.srv.filter(s=>srvLive(s)&&!s.busy&&!s.kept&&!has(s.id,'keep'));act(nb(`Stopped ${and(S.map(s=>'<b>'+s.p+'</b>'))}. ${fmt2(sum(S,s=>s.mb/1000))} back.`),()=>S.forEach(s=>fl(s.id).gone=1));break}
    case 'rmtree':{const t=D.wt.find(x=>x.id===id);act(nb(`Removed <b>${t.n}</b>. ${fmt(t.gb)} back.`),()=>fl(id).gone=1);break}
    case 'keeptree':{const t=D.wt.find(x=>x.id===id);const k=has(id,'keep');act(k?`<b>${t.n}</b> is no longer kept.`:`Keeping <b>${t.n}</b>.`,()=>fl(id).keep=k?0:1);break}
    case 'rmmerged':{const m=D.wt.filter(w=>w.k==='m'&&!isGone(w.id)&&!has(w.id,'keep'));act(nb(`Removed ${m.length} merged worktrees. ${fmt(sum(m,w=>w.gb))} back.`),()=>m.forEach(w=>fl(w.id).gone=1));break}
    case 'cleandk':{const d=D.dk.find(x=>x.id===id);act(nb(`Moved <b>${d.n}</b> to the Trash. ${fmt(d.gb)} back.`),()=>fl(id).gone=1);break}
    case 'keepdk':{const d=D.dk.find(x=>x.id===id);const k=has(id,'keep');act(k?`<b>${d.n}</b> is no longer kept.`:`Keeping <b>${d.n}</b>.`,()=>fl(id).keep=k?0:1);break}
    case 'cleansafe':{const s=D.dk.filter(d=>d.safe&&!isGone(d.id)&&!has(d.id,'keep'));act(nb(`Moved ${s.length} things to the Trash. ${fmt(sum(s,d=>d.gb))} back.`),()=>s.forEach(d=>fl(d.id).gone=1));break}
  }
}

/* ---------- popover ---------- */
let popOpen=false, popBtn=null;
function openPop(btn){
  const k=btn.dataset.k, kind=btn.dataset.pop, s=SET[k], st=D.M[k], pop=$('pop');
  pop.style.setProperty('--c',s.c);
  pop.classList.toggle('narrow',kind==='val');
  if(kind==='val') pop.innerHTML=s.vals.map((v,i)=>`<button class="po" role="menuitemradio" aria-checked="${i===st.v}" data-pv="${i}" data-k="${k}"><span class="ck2">${i===st.v?CK2:''}</span><span class="pt">${v}</span></button>`).join('');
  else pop.innerHTML=[2,1,0].map(i=>`<button class="po" role="menuitemradio" aria-checked="${i===st.mode}" data-pm="${i}" data-k="${k}"><span class="ck2">${i===st.mode?CK2:''}</span><span><span class="pt">${kind==='mini'?MT[i]:s.words[i]+`<i>${MT[i]}</i>`}</span><span class="pd">${DESC(k,i)}</span></span></button>`).join('')+(kind==='mini'?`<div class="pv2">${k==='ws'?'After merge':'How often'} ${s.vals.map((v,i)=>`<button role="menuitemradio" aria-checked="${i===st.v}" data-pv="${i}" data-k="${k}">${v}</button>`).join('')}</div>`:'');
  const kk=$('stage').getBoundingClientRect().width/1280, sr=$('sheet').getBoundingClientRect(), br=btn.getBoundingClientRect();
  pop.classList.add('on'); popOpen=true; popBtn=btn; btn.setAttribute('aria-expanded','true');

function closePop(){if(!popOpen)return null;$('pop').classList.remove('on');popOpen=false;const b=popBtn;if(b)b.setAttribute('aria-expanded','false');popBtn=null;return b}

  const wsv=$('wsv'), perf=$('perf'), adv=$('advv');
  if(pv&&!hoverPv){hoverPv=true;const t=pv.dataset.pv;
    if(t==='all'&&wsv){wsv.classList.add('pv-all');const r=ready().map(w=>w.id);wsv.querySelectorAll('.card').forEach(c=>c.classList.add(r.includes(c.dataset.ws)?'hit':'dim'))}
    if(t==='lo'&&wsv){wsv.classList.add('pv-lo');$('pvl').innerHTML=pvLoText()}
    if(t==='now'&&perf)perf.classList.add('pv-now');
    if(t==='adv'&&adv)adv.classList.add('pv');
  } else if(!pv&&hoverPv){hoverPv=false;
    if(wsv){wsv.classList.remove('pv-all','pv-lo');wsv.querySelectorAll('.card').forEach(c=>c.classList.remove('hit','dim'));const r=ready();if(r.length)$('pvl').innerHTML=pvAllText(r)}
    if(perf)perf.classList.remove('pv-now'); if(adv)adv.classList.remove('pv');
  }
  const ab=e.target.closest('.card .ab[data-act]'); abHover=!!ab;
  document.querySelectorAll('.card.pv').forEach(c=>{if(!ab||c!==ab.closest('.card')){c.classList.remove('pv');const p=c.querySelector('.pvt');if(p){const w=ws(c.dataset.ws);if(w)p.innerHTML=defaultPv(w)}}});
  if(ab){const c=ab.closest('.card'), w=ws(c.dataset.ws), a=ab.dataset.act, p=c.querySelector('.pvt');
    if(a==='wrap'){c.classList.add('pv');if(p)p.innerHTML=pvWrap(w);else{const s=c.querySelector('.stt');if(s)s.innerHTML=nb(cap(and(wrapParts(w))))}}
    if(a==='stopws'&&p){p.innerHTML=nb(`Stops ${and(wSrv(w).map(s=>s.p))}. The agent, worktree and PR stay. ${fmt(sum(wSrv(w),s=>s.mb/1000))} back.`)}
    if(a==='keep'&&p){p.innerHTML='Keep marks it so Wrap Up and Auto leave it alone. Nothing is stopped.'}
    if(a==='nav'&&p){p.innerHTML=`Brings ${w.where||'its window'} to the front. Nothing changes.`}
  } else {document.querySelectorAll('.card:not(.exp) .stt[data-t]').forEach(s=>{const w=ws(s.dataset.t.split(':')[1]);if(w&&!isGone(w.id))s.innerHTML=stateText(w)})}
});
document.addEventListener('focusin',e=>{const ch=e.target.closest('.chip[data-lo]');if(ch)showHC(ch)});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if(popOpen){const b=closePop();b&&b.focus();return}if(hcOn){hideHC(true);return}if(exp){const id=exp;exp=null;renderPane(false);const c=$('pane').querySelector(`.card[data-ws="${id}"]`);c&&c.focus();return}}
  if(popOpen&&(e.key==='ArrowDown'||e.key==='ArrowUp')){e.preventDefault();const bs=[...$('pop').querySelectorAll('button')],i=bs.indexOf(document.activeElement);bs[(i+(e.key==='ArrowDown'?1:-1)+bs.length)%bs.length].focus();return}
  if(e.target.closest('#seg')&&(e.key==='ArrowRight'||e.key==='ArrowLeft')){e.preventDefault();const vis=TABS.filter(t=>!t.adv||D.adv);const i=vis.findIndex(t=>t.id===sel);const n=vis[(i+(e.key==='ArrowRight'?1:-1)+vis.length)%vis.length];selectTab(n.id);$('tab-'+n.id).focus();return}
  if((e.key==='Enter'||e.key===' ')&&e.target.classList.contains('card')&&!e.target.classList.contains('exp')){e.preventDefault();exp=e.target.dataset.ws;renderPane(false);const c=$('pane').querySelector(`.card[data-ws="${exp}"] .ab`);c&&c.focus()}
});
$('tbtn').addEventListener('click',e=>{e.stopPropagation();const f=toastUndo;toastUndo=null;$('toast').classList.remove('on');if(f)f()});
$('pz').addEventListener('click',e=>{e.stopPropagation();paused=!paused;$('sim').classList.toggle('paused',paused);$('pz').textContent=paused?'Resume':'Pause'});

function fit(){const st=$('stage'),k=Math.min(innerWidth/1280,innerHeight/800);st.style.transform=`translate(${(innerWidth-1280*k)/2}px,${(innerHeight-800*k)/2}px) scale(${k})`;placeNub()}
addEventListener('resize',()=>{fit();closePop();hideHC(true)});
seedHB(); buildSeg(); renderIcons(); renderPane(false); fit(); placePill(false);
requestAnimationFrame(()=>{placePill(false);placeNub()});
</script>
</body>
