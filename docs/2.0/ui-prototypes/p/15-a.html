<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Grouped Inset List</title>
<style>
:root{
  --glass:rgba(28,29,38,.86);
  --group:rgba(255,255,255,.042);
  --line:rgba(255,255,255,.06);
  --tx:rgba(255,255,255,.94);
  --tx2:rgba(235,235,245,.56);
  --tx3:rgba(235,235,245,.32);
  --ease:cubic-bezier(.25,.8,.25,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#1a1636}
body{font-family:-apple-system,"SF Pro Text",system-ui,sans-serif;color:var(--tx);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;font-size:13px;cursor:default;user-select:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible{outline:2px solid rgba(255,255,255,.55);outline-offset:2px}
#stage{position:absolute;left:0;top:0;width:1280px;height:800px;transform-origin:0 0;overflow:hidden;
  background:
   radial-gradient(760px 560px at 10% 6%,#4b3c9e 0%,rgba(75,60,158,0) 70%),
   radial-gradient(700px 520px at 84% 2%,#22618f 0%,rgba(34,97,143,0) 70%),
   radial-gradient(820px 620px at 88% 104%,#a0436f 0%,rgba(160,67,111,0) 70%),
   radial-gradient(640px 520px at 18% 100%,#3a2463 0%,rgba(58,36,99,0) 75%),
   #1d1a3c}

/* menu bar */
.mb{position:absolute;left:0;right:0;top:0;height:26px;display:flex;align-items:center;justify-content:space-between;padding:0 12px 0 16px;background:rgba(18,14,40,.32);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);font-size:13px;color:rgba(255,255,255,.92);z-index:5}
.mb-l,.mb-r{display:flex;align-items:center;gap:20px}
.mb-l b{font-weight:700}
.mb-r{gap:16px}
.icons{display:flex;align-items:center}
.mi{display:flex;width:16px;margin-left:14px;overflow:hidden;transition:width .4s var(--ease),opacity .3s,margin .4s var(--ease)}
.mi:first-child{margin-left:0}
.mi.off{width:0;opacity:0;margin-left:0}
.mi.pop svg{animation:pop .45s var(--ease)}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.15)}100%{transform:scale(1)}}

/* window */
.win{position:absolute;left:50%;top:66px;width:560px;transform:translateX(-50%);background:var(--glass);backdrop-filter:blur(40px) saturate(1.6);-webkit-backdrop-filter:blur(40px) saturate(1.6);border:1px solid rgba(255,255,255,.09);border-radius:22px;box-shadow:0 40px 100px rgba(6,4,24,.55),0 0 0 .5px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.04);padding:0 20px 18px}
.tb{height:48px;display:flex;align-items:center;position:relative}
.lights{display:flex;gap:8px;margin-left:-2px}
.lights i{width:12px;height:12px;border-radius:50%;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.25)}
.lights i:nth-child(1){background:#ff5f57}.lights i:nth-child(2){background:#febc2e}.lights i:nth-child(3){background:#28c840}
.tb h1{position:absolute;left:0;right:0;text-align:center;font-size:13px;font-weight:600;color:var(--tx);pointer-events:none;letter-spacing:-.01em}

.group{background:var(--group);border-radius:13px;border:.5px solid rgba(255,255,255,.035)}
.stack{display:flex;flex-direction:column;gap:8px;margin:14px 0}

/* today */
.today{display:flex;align-items:center;gap:12px;height:46px;padding:0 10px 0 14px}
.today .ic{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.08);flex:none}
.today .t{display:flex;align-items:baseline;gap:10px;min-width:0;white-space:nowrap}
.today .t b{font-weight:600;font-size:13px}
.today .t span{color:var(--tx2);font-size:13px;transition:opacity .25s}
.pbtn{height:26px;padding:0 13px;border-radius:7px;background:rgba(255,255,255,.1);box-shadow:inset 0 .5px 0 rgba(255,255,255,.12),0 .5px 1px rgba(0,0,0,.3);font-size:13px;font-weight:500;margin-left:auto;transition:background .15s;flex:none}
.pbtn:hover{background:rgba(255,255,255,.15)}
.pbtn:active{background:rgba(255,255,255,.2)}

/* section */
.head{display:flex;align-items:center;height:50px;padding:0 10px 0 13px;gap:12px}
.bdg{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;flex:none;background:rgba(255,255,255,.07);transition:background .35s var(--ease)}
.bdg svg{transition:stroke .35s}
.sec[data-m="1"] .bdg{background:color-mix(in srgb,var(--c) 20%,transparent)}
.sec[data-m="2"] .bdg{background:var(--c)}
.who{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.nm{font-size:13.5px;font-weight:600;letter-spacing:-.005em;transition:color .3s}
.sec[data-m="0"] .nm{color:var(--tx2)}
.cap{font-size:12px;color:var(--tx3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:opacity .2s}
.cap b{font-weight:500;color:var(--tx2)}
.cap.swap{opacity:0}

/* native segmented control */
.seg{position:relative;display:grid;grid-template-columns:repeat(3,58px);height:28px;padding:2px;border-radius:8px;background:rgba(0,0,0,.22);box-shadow:inset 0 0 0 .5px rgba(255,255,255,.06);flex:none}
.seg .th{position:absolute;top:2px;left:2px;width:58px;height:24px;border-radius:6px;background:rgba(255,255,255,.16);box-shadow:0 1px 3px rgba(0,0,0,.35),inset 0 .5px 0 rgba(255,255,255,.18);transition:transform .38s var(--ease)}
.seg button{position:relative;z-index:1;font-size:12.5px;font-weight:500;color:var(--tx2);border-radius:6px;transition:color .25s}
.seg button[aria-checked="true"]{color:var(--tx)}
.seg button:not([aria-checked="true"]):hover{color:rgba(255,255,255,.8)}
.seg button+button::before{content:"";position:absolute;left:0;top:6px;bottom:6px;width:1px;background:rgba(255,255,255,.09);transition:opacity .2s}
.seg[data-m="0"] button:nth-child(3)::before,.seg[data-m="1"] button:nth-child(3)::before,
.seg[data-m="1"] button:nth-child(4)::before,.seg[data-m="2"] button:nth-child(4)::before{opacity:0}

/* sub-row */
.sub{display:grid;grid-template-rows:1fr;transition:grid-template-rows .42s var(--ease)}
.sec[data-m="0"] .sub{grid-template-rows:0fr}
.sub>div{overflow:hidden;min-height:0}
.subrow{display:flex;align-items:center;gap:12px;height:42px;margin-left:55px;padding-right:10px;border-top:1px solid var(--line);transition:opacity .3s}
.sec[data-m="0"] .subrow{opacity:0}
.rule{font-size:13px;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1;transition:opacity .2s}
.rule.swap{opacity:0}

/* pop-up button */
.pop{display:flex;align-items:center;gap:9px;height:26px;padding:0 7px 0 11px;border-radius:7px;background:rgba(255,255,255,.09);box-shadow:inset 0 .5px 0 rgba(255,255,255,.12),0 .5px 1px rgba(0,0,0,.3);font-size:13px;color:var(--tx);white-space:nowrap;flex:none;min-width:84px;justify-content:space-between;transition:background .15s}
.pop:hover,.pop.open{background:rgba(255,255,255,.14)}
.pop svg{opacity:.6}

/* footer switches */
.foot{display:grid;grid-template-columns:1fr 1px 1fr;align-items:center;height:46px}
.foot .div{height:22px;background:var(--line)}
.sw{display:flex;align-items:center;justify-content:space-between;gap:10px;height:100%;padding:0 12px 0 16px;font-size:13px;text-align:left}
.sw i{width:32px;height:19px;border-radius:10px;background:rgba(255,255,255,.14);position:relative;transition:background .25s;flex:none;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.2)}
.sw i::after{content:"";position:absolute;left:2px;top:2px;width:15px;height:15px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.35);transition:transform .3s var(--ease)}
.sw[aria-checked="true"] i{background:#5B9BFF}
.sw[aria-checked="true"] i::after{transform:translateX(13px)}

/* menu */
.menu{position:absolute;z-index:20;min-width:120px;padding:5px;border-radius:11px;background:rgba(44,45,58,.9);backdrop-filter:blur(30px) saturate(1.6);-webkit-backdrop-filter:blur(30px) saturate(1.6);border:.5px solid rgba(255,255,255,.14);box-shadow:0 18px 50px rgba(0,0,0,.5),0 0 0 .5px rgba(0,0,0,.5);opacity:0;transform:scale(.97);pointer-events:none;transition:opacity .14s,transform .18s var(--ease)}
.menu.on{opacity:1;transform:none;pointer-events:auto}
.menu button{display:flex;align-items:center;width:100%;height:26px;padding:0 14px 0 6px;border-radius:6px;font-size:13px;white-space:nowrap;text-align:left}
.menu button .ck{width:20px;display:flex;justify-content:center;flex:none}
.menu button:focus-visible{outline:none}
.menu button.hl{background:var(--mc);color:#12131a}
.menu button.hl svg{stroke:#12131a}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important}}
</style>
</head>
<body>
<div id="stage">
  <div class="mb">
    <div class="mb-l">
      <svg viewBox="0 0 17 20" width="13" height="16" aria-hidden="true"><path fill="#fff" d="M14.1 10.6c0-2.6 2.1-3.8 2.2-3.9-1.2-1.8-3.1-2-3.7-2-1.6-.2-3.1.9-3.9.9-.8 0-2-.9-3.4-.9C3.6 4.8 1.9 5.8 1 7.4c-1.9 3.3-.5 8.2 1.4 10.9.9 1.3 2 2.8 3.4 2.7 1.4-.1 1.9-.9 3.5-.9s2.1.9 3.5.9c1.5 0 2.4-1.3 3.3-2.7 1-1.5 1.5-3 1.5-3.1-.1 0-2.9-1.1-2.9-4.3zM11.5 3c.7-.9 1.2-2.1 1.1-3.3-1 0-2.3.7-3 1.6-.7.8-1.3 2-1.1 3.2 1.1.1 2.3-.6 3-1.5z"/></svg>
      <b>MinMacs</b><span>Edit</span><span>Window</span><span>Help</span>
    </div>
    <div class="mb-r">
      <div class="icons" id="icons"></div>
      <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M2 6.3a8.6 8.6 0 0 1 12 0M4.2 8.6a5.4 5.4 0 0 1 7.6 0"/><circle cx="8" cy="11.6" r="1.3" fill="#fff" stroke="none"/></svg>
      <svg viewBox="0 0 26 14" width="25" height="13" aria-hidden="true"><rect x=".7" y=".7" width="21.6" height="12.6" rx="3.6" fill="none" stroke="rgba(255,255,255,.55)" stroke-width="1.2"/><rect x="2.6" y="2.6" width="11.6" height="8.8" rx="2" fill="#fff"/><path d="M24 5v4" stroke="rgba(255,255,255,.55)" stroke-width="1.4" stroke-linecap="round"/></svg>
      <span>Tue 27 Oct&nbsp;&nbsp;16:42</span>
    </div>
  </div>

  <div class="win" id="win" role="dialog" aria-label="Settings">
    <div class="tb"><div class="lights"><i></i><i></i><i></i></div><h1>Settings</h1></div>

    <div class="group today">
      <span class="ic"><svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="rgba(235,235,245,.7)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="8" r="6"/><path d="M8 4.8V8l2.2 1.4"/></svg></span>
      <div class="t"><b>Today</b><span id="today-t"></span></div>
      <button class="pbtn" id="undo"></button>
    </div>

    <div class="stack" id="secs"></div>

    <div class="group foot">
      <button class="sw" id="one" role="switch" aria-checked="false"><span>One icon in the menu bar</span><i></i></button>
      <span class="div"></span>
      <button class="sw" id="login" role="switch" aria-checked="true"><span>Open at login</span><i></i></button>
    </div>
  </div>

  <div class="menu" id="menu" role="menu"></div>
</div>

<script>
const G = {
  apps:'<rect x="4.2" y="4.2" width="7.6" height="7.6" rx="1.6"/><path d="M6.6 1.8v2.4M9.4 1.8v2.4M6.6 11.8v2.4M9.4 11.8v2.4M1.8 6.6h2.4M1.8 9.4h2.4M11.8 6.6h2.4M11.8 9.4h2.4"/>',
  servers:'<rect x="2.5" y="2.8" width="11" height="4.2" rx="1.4"/><rect x="2.5" y="9" width="11" height="4.2" rx="1.4"/><path d="M5.2 4.9h.01M5.2 11.1h.01" stroke-width="2.2"/>',
  trees:'<circle cx="4.6" cy="3.6" r="1.6"/><circle cx="4.6" cy="12.4" r="1.6"/><circle cx="11.4" cy="5.4" r="1.6"/><path d="M4.6 5.2v5.6M11.4 7c0 2.7-2.4 3.4-5.4 4.2"/>',
  disk:'<ellipse cx="8" cy="4" rx="5.5" ry="2"/><path d="M2.5 4v8c0 1.1 2.5 2 5.5 2s5.5-.9 5.5-2V4M2.5 8c0 1.1 2.5 2 5.5 2s5.5-.9 5.5-2"/>',
  awake:'<path d="M13.2 9.6A5.6 5.6 0 0 1 6.4 2.8a5.6 5.6 0 1 0 6.8 6.8z"/>',
  one:'<rect x="2.2" y="2.2" width="11.6" height="11.6" rx="3.4"/><path d="M5.2 10.6V5.6l2.8 3 2.8-3v5"/>'
};
const gl=(k,c,s,w)=>`<svg viewBox="0 0 16 16" width="${s}" height="${s}" fill="none" stroke="${c}" stroke-width="${w||1.6}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${G[k]}</svg>`;
const chev='<svg viewBox="0 0 8 12" width="7" height="11" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1.5 4.3 4 1.8l2.5 2.5M1.5 7.7 4 10.2l2.5-2.5"/></svg>';
const check='<svg viewBox="0 0 12 12" width="11" height="11" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.2 6.4 4.8 9 9.8 3.2"/></svg>';
const MODES=['Off','Ask','Auto'];
const st={undone:false};
const nextRun={daily:'tomorrow',weekly:'on Sunday',monthly:'on 1 Nov'};
const S=[
  {id:'apps',name:'Apps',c:'#5B9BFF',mode:2,vals:['60 %','70 %','80 %','90 %'],v:1,
   rule:['','Show noise apps when load is over','Close noise apps when load is over'],
   cap:m=>['Not watching','<b>2</b> noise apps open now', st.undone?'<b>2</b> reopened, nothing closed':'<b>2</b> closed today'][m]},
  {id:'servers',name:'Servers',c:'#3FD0B8',mode:2,vals:['30 min','1 h','2 h','4 h','1 day'],v:2,
   rule:['','Show servers nobody used for','Stop servers nobody used for'],
   cap:m=>['Not watching','<b>3</b> idle now', st.undone?'<b>6</b> idle now, nothing stopped':'<b>3</b> idle now · <b>3</b> stopped today'][m]},
  {id:'trees',name:'Worktrees',c:'#4CC96B',mode:1,vals:['1 h','1 day','1 week'],v:1,
   rule:['','Show merged worktrees after','Remove merged worktrees after'],
   cap:m=>['Not watching','<b>4</b> merged · <b>5.7 GB</b>','<b>4</b> merged · <b>5.7 GB</b> · Undo brings them back'][m]},
  {id:'disk',name:'Disk',c:'#F2B544',mode:2,vals:['Daily','Weekly','Monthly'],v:1,
   rule:['','Look for caches and build output','Move safe clutter to the Trash'],
   cap:function(m){return m?`<b>30 GB</b> safe to clean · next ${nextRun[this.vals[this.v].toLowerCase()]}`:'Not watching'}},
  {id:'awake',name:'Keep Awake',c:'#B18CFF',mode:2,vals:['10 %','20 %','30 %','Never'],v:1,
   rule:['','Ask when an agent starts, end at battery','Stay awake while agents work, end at battery'],
   cap:m=>['The Mac sleeps as usual','<b>4</b> agents working now','<b>4</b> agents working, awake until done'][m]}
];
const $=id=>document.getElementById(id);
const capOf=s=>s.cap.call(s,s.mode);

function secHTML(s){
  return `<div class="group sec" id="sec-${s.id}" data-m="${s.mode}" style="--c:${s.c}">
    <div class="head">
      <span class="bdg">${gl(s.id,'#fff',15)}</span>
      <div class="who"><span class="nm">${s.name}</span><span class="cap" id="cap-${s.id}">${capOf(s)}</span></div>
      <div class="seg" role="radiogroup" aria-label="${s.name} mode" data-m="${s.mode}">
        <i class="th" style="transform:translateX(${s.mode*58}px)"></i>
        ${MODES.map((m,i)=>`<button role="radio" aria-checked="${i===s.mode}" data-s="${s.id}" data-m="${i}">${m}</button>`).join('')}
      </div>
    </div>
    <div class="sub"><div><div class="subrow">
      <span class="rule" id="rule-${s.id}">${s.rule[s.mode]||s.rule[1]}</span>
      <button class="pop" id="pop-${s.id}" data-s="${s.id}" aria-haspopup="menu"><span>${s.vals[s.v]}</span>${chev}</button>
    </div></div></div>
  </div>`;
}
function paintBadge(s){
  $('sec-'+s.id).querySelector('.bdg svg').setAttribute('stroke', s.mode===2?'#14151d': s.mode===1? s.c : 'rgba(235,235,245,.38)');
}
function swapText(el,html){
  if(el.innerHTML===html) return;
  el.classList.add('swap');
  setTimeout(()=>{el.innerHTML=html; el.classList.remove('swap')},140);
}
function renderToday(){
  $('today-t').innerHTML = st.undone ? 'Reopened 2 apps, restarted 3 servers' : 'Closed 2 apps, stopped 3 servers';
  $('undo').textContent = st.undone ? 'Redo' : 'Undo';
}
function renderIcons(pop){
  const one=$('one').getAttribute('aria-checked')==='true', box=$('icons');
  if(!box.children.length) box.innerHTML=S.map(s=>`<span class="mi" id="mi-${s.id}">${gl(s.id,'#fff',16)}</span>`).join('')+`<span class="mi off" id="mi-one">${gl('one','#fff',16)}</span>`;
  S.forEach(s=>$('mi-'+s.id).classList.toggle('off', one||s.mode===0));
  $('mi-one').classList.toggle('off',!one);
  if(pop){ const el=$('mi-'+pop); el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop'); }
}
function setMode(id,m){
  const s=S.find(x=>x.id===id); if(s.mode===m) return;
  const was=s.mode; s.mode=m;
  const sec=$('sec-'+id), seg=sec.querySelector('.seg');
  sec.dataset.m=m; seg.dataset.m=m;
  seg.querySelector('.th').style.transform=`translateX(${m*58}px)`;
  seg.querySelectorAll('button').forEach(b=>b.setAttribute('aria-checked',String(+b.dataset.m===m)));
  paintBadge(s);
  swapText($('cap-'+id),capOf(s));
  if(m) (was? swapText($('rule-'+id),s.rule[m]) : ($('rule-'+id).innerHTML=s.rule[m]));
  renderIcons(was===0&&m?id:null);
}

/* pop-up menu, opened so the chosen item sits on top of the button */
const menu=$('menu'); let openFor=null, hi=0;
function k(){ return $('stage').getBoundingClientRect().width/1280 }
function openMenu(s,btn){
  openFor=s; hi=s.v;
  menu.style.setProperty('--mc',s.c);
  menu.innerHTML=s.vals.map((v,i)=>`<button role="menuitemradio" aria-checked="${i===s.v}" data-i="${i}" class="${i===hi?'hl':''}"><span class="ck">${i===s.v?check:''}</span>${v}</button>`).join('');
  const r=btn.getBoundingClientRect(), sr=$('stage').getBoundingClientRect(), z=k();
  const bx=(r.left-sr.left)/z, by=(r.top-sr.top)/z, bw=r.width/z;
  menu.style.minWidth=(bw+24)+'px';
  let top=by-5-s.v*26; top=Math.max(32,Math.min(top,800-menu.offsetHeight-8));
  menu.style.left=(bx-15)+'px'; menu.style.top=top+'px';
  menu.style.transformOrigin=`20px ${by-top+13}px`;
  btn.classList.add('open'); menu.classList.add('on');
  requestAnimationFrame(()=>menu.querySelector('.hl')?.focus({preventScroll:true}));
}
function closeMenu(){ if(!openFor) return; $('pop-'+openFor.id).classList.remove('open'); menu.classList.remove('on'); $('pop-'+openFor.id).focus({preventScroll:true}); openFor=null }
function pick(i){
  const s=openFor; s.v=i; $('pop-'+s.id).firstElementChild.textContent=s.vals[i];
  closeMenu(); swapText($('cap-'+s.id),capOf(s));
}
function setHi(i){ hi=i; menu.querySelectorAll('button').forEach((b,j)=>b.classList.toggle('hl',j===i)); menu.children[i].focus({preventScroll:true}) }
menu.addEventListener('mousemove',e=>{const b=e.target.closest('button'); if(b&&+b.dataset.i!==hi) setHi(+b.dataset.i)});
menu.addEventListener('click',e=>{const b=e.target.closest('button'); if(b) pick(+b.dataset.i)});
document.addEventListener('keydown',e=>{
  if(!openFor) return;
  const n=openFor.vals.length;
  if(e.key==='Escape'){e.preventDefault();closeMenu()}
  else if(e.key==='ArrowDown'){e.preventDefault();setHi((hi+1)%n)}
  else if(e.key==='ArrowUp'){e.preventDefault();setHi((hi+n-1)%n)}
  else if(e.key==='Enter'||e.key===' '){e.preventDefault();pick(hi)}
});

document.addEventListener('mousedown',e=>{ if(openFor && !e.target.closest('#menu') && !e.target.closest('.pop')) closeMenu() });
document.addEventListener('click',e=>{
  const b=e.target.closest('.seg button'); if(b){ setMode(b.dataset.s,+b.dataset.m); return }
  const p=e.target.closest('.pop'); if(p){ const s=S.find(x=>x.id===p.dataset.s); openFor===s? closeMenu() : (closeMenu(), openMenu(s,p)); return }
  if(e.target.closest('#undo')){ st.undone=!st.undone; const t=$('today-t'); t.style.opacity=0; setTimeout(()=>{renderToday(); t.style.opacity=1},150);
    ['apps','servers'].forEach(id=>swapText($('cap-'+id),capOf(S.find(x=>x.id===id)))); return }
  const sw=e.target.closest('.sw'); if(sw){ sw.setAttribute('aria-checked',String(sw.getAttribute('aria-checked')!=='true')); renderIcons() }
});

function fit(){ const s=$('stage'), z=Math.min(innerWidth/1280,innerHeight/800); s.style.transform=`translate(${(innerWidth-1280*z)/2}px,${(innerHeight-800*z)/2}px) scale(${z})` }
addEventListener('resize',()=>{closeMenu();fit()});
$('secs').innerHTML=S.map(secHTML).join('');
S.forEach(paintBadge); renderToday(); renderIcons(); fit();
</script>
</body>
</html>
