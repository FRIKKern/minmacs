<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Day Strips</title>
<style>
:root{
  --glass:rgba(28,29,38,.88);
  --line:rgba(255,255,255,.06);
  --tx:rgba(255,255,255,.94);
  --tx2:rgba(235,235,245,.55);
  --tx3:rgba(235,235,245,.3);
  --ease:cubic-bezier(.3,.7,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#1a1636}
body{font-family:-apple-system,"SF Pro Text",system-ui,sans-serif;color:var(--tx);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;font-size:13px;cursor:default;user-select:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;text-align:left}
:focus{outline:none}
:focus-visible{outline:2px solid rgba(255,255,255,.55);outline-offset:3px;border-radius:8px}
#stage{position:absolute;left:0;top:0;width:1280px;height:800px;transform-origin:0 0;overflow:hidden;
  background:
   radial-gradient(760px 560px at 10% 6%,#4b3c9e 0%,rgba(75,60,158,0) 70%),
   radial-gradient(700px 520px at 84% 2%,#22618f 0%,rgba(34,97,143,0) 70%),
   radial-gradient(820px 620px at 88% 104%,#a0436f 0%,rgba(160,67,111,0) 70%),
   radial-gradient(640px 520px at 18% 100%,#3a2463 0%,rgba(58,36,99,0) 75%),
   #1d1a3c}

/* menu bar */
.mb{position:absolute;left:0;right:0;top:0;height:26px;display:flex;align-items:center;justify-content:space-between;padding:0 12px 0 16px;background:rgba(18,14,40,.32);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);font-size:13px;color:rgba(255,255,255,.92);z-index:5}
.mb-l,.mb-r{display:flex;align-items:center;gap:18px}
.mb-l b{font-weight:700}
.mb-r{gap:14px}
.icons{position:relative;display:flex;align-items:center;gap:12px;padding:0 8px;margin:0 -8px}
.hl{position:absolute;left:0;top:-3px;height:22px;width:28px;border-radius:6px;background:rgba(255,255,255,.2);transition:transform .45s var(--ease),opacity .3s;pointer-events:none}
.mi{position:relative;display:flex;width:16px;overflow:hidden;cursor:pointer;transition:width .4s var(--ease),opacity .3s,margin .4s var(--ease)}
.mi.off{width:0;opacity:0;margin-left:-12px}

/* sheet */
.sheet{position:absolute;top:34px;left:404px;width:760px;background:var(--glass);backdrop-filter:blur(36px) saturate(1.5);-webkit-backdrop-filter:blur(36px) saturate(1.5);border:1px solid rgba(255,255,255,.085);border-radius:22px;box-shadow:0 34px 100px rgba(6,4,24,.5),inset 0 1px 0 rgba(255,255,255,.035);animation:drop .6s var(--ease) both}
@keyframes drop{from{opacity:0;transform:translateY(-10px)}}
.nub{position:absolute;top:-8px;left:0;width:18px;height:8px;margin-left:-9px;transition:transform .45s var(--ease)}
.nub svg{display:block}

.body{display:grid;grid-template-columns:206px minmax(0,1fr);column-gap:38px;padding:24px 32px 24px}

/* index */
.idx{display:flex;flex-direction:column}
.it{display:flex;align-items:center;gap:13px;height:56px;white-space:nowrap}
.it .dot{flex:none;width:9px;height:9px;border-radius:50%;box-shadow:inset 0 0 0 1.5px rgba(235,235,245,.28);transition:background .35s,box-shadow .35s}
.it .nm{font-size:26px;font-weight:600;letter-spacing:-.022em;color:rgba(235,235,245,.34);transition:color .3s}
.it .md{margin-left:auto;font-size:12px;color:var(--tx3);transition:color .3s}
.it:hover .nm{color:var(--tx2)}
.it.sel .nm{color:var(--tx)}
.it.sel .md{color:var(--tx2)}

/* detail */
.det{position:relative;height:512px}
.det .in{transition:opacity .22s,transform .35s var(--ease)}
.det .in.swap{opacity:0;transform:translateY(6px)}
.lab{font-size:12px;color:var(--tx3);height:16px;line-height:16px;white-space:nowrap}

.big{display:flex;align-items:baseline;gap:6px;white-space:nowrap;height:44px}
.big .n{font-size:42px;font-weight:500;letter-spacing:-.02em;line-height:44px}
.big .u{font-size:15px;color:var(--tx2)}
.big .n2{margin-left:auto;font-size:13px;color:var(--tx2)}
.big .n2 b{font-weight:500;color:var(--tx)}
.ins{margin-top:6px;font-size:13px;line-height:18px;height:36px;color:var(--tx2);transition:opacity .2s}
.ins b{font-weight:500;color:var(--tx)}
.ins.fade{opacity:0}

/* live gauge: thin bar, colored segment = what Auto acts on, white tick = the setting */
.gb{position:relative;height:6px;margin-top:12px;border-radius:3px;background:rgba(255,255,255,.08)}
.gb .f{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:rgba(235,235,245,.34);transition:width .7s var(--ease)}
.gb .sg{position:absolute;top:0;bottom:0;border-radius:0 3px 3px 0;background:var(--c);transition:left .7s var(--ease),width .7s var(--ease),opacity .35s}
.gb .sg.full{border-radius:3px}
.gb .tk{position:absolute;top:-4px;width:2px;height:14px;margin-left:-1px;border-radius:1px;background:#fff;transition:left .7s var(--ease),opacity .35s}
.cap{margin-top:7px;font-size:12px;line-height:16px;height:16px;color:var(--tx3);white-space:nowrap}

/* 24-hour strip */
.tl{margin-top:12px}
.tl-h{display:flex;align-items:baseline;gap:10px;height:16px;font-size:12px;white-space:nowrap}
.tl-h .l{color:var(--tx3)}
.tl-h .r{margin-left:auto;color:var(--tx2);transition:opacity .2s}
.tl-h .r b{font-weight:500;color:var(--tx)}
.strip{position:relative;height:44px}
.strip .ln{position:absolute;top:22px;height:1px}
.strip .ln.p{left:0;background:rgba(255,255,255,.24)}
.strip .ln.f{right:0;background:repeating-linear-gradient(90deg,rgba(255,255,255,.16) 0 2px,transparent 2px 5px)}
.strip .hr{position:absolute;top:27px;width:1px;height:3px;margin-left:-.5px;background:rgba(255,255,255,.16)}
.strip .hn{position:absolute;top:31px;font-size:10px;line-height:12px;color:var(--tx3);transform:translateX(-50%)}
.strip .hn.l0{transform:none}
.strip .hn.l1{transform:translateX(-100%)}
.strip .nw{position:absolute;top:12px;width:1px;height:21px;margin-left:-.5px;background:rgba(255,255,255,.8)}
.strip .nwl{position:absolute;top:0;font-size:10px;line-height:12px;color:var(--tx2);transform:translateX(-50%)}
.strip .sp{position:absolute;top:21px;height:3px;border-radius:2px;background:var(--c);opacity:.75}
.strip .ev{position:absolute;top:15px;width:3px;height:15px;margin-left:-1.5px;border-radius:2px;background:var(--c);transition:transform .25s var(--ease),background .3s,box-shadow .3s}
.strip .ev::before{content:"";position:absolute;inset:-6px -6px}
.strip .ev.seen{top:19px;width:7px;height:7px;margin-left:-3.5px;border-radius:50%;background:rgba(28,29,38,1);box-shadow:inset 0 0 0 1.5px var(--c)}
.strip .ev.undone{background:transparent;box-shadow:inset 0 0 0 1px rgba(235,235,245,.35)}
.strip .ev.edge{width:0;height:0;margin-left:0;border-radius:0;background:none;border-style:solid;border-width:5px 6px 5px 0;border-color:transparent var(--c) transparent transparent;top:17.5px}
.strip .ev.edge.undone{border-color:transparent rgba(235,235,245,.35) transparent transparent;box-shadow:none}
.strip .ev.hot,.strip .ev:hover{transform:scale(1.35)}
.strip .nl{position:absolute;top:22px;height:1px;background:repeating-linear-gradient(90deg,var(--c) 0 2px,transparent 2px 5px);transition:width .7s var(--ease),opacity .35s}
.strip .nk{position:absolute;top:15px;width:7px;height:15px;margin-left:-3.5px;border-radius:4px;background:rgba(28,29,38,1);box-shadow:inset 0 0 0 1.5px var(--c);transition:left .7s var(--ease),opacity .35s}
.strip .nk.ghost{box-shadow:inset 0 0 0 1px var(--c);opacity:.5}
.strip .nk.far{width:0;height:0;margin-left:-6px;border-radius:0;background:none;box-shadow:none;border-style:solid;border-width:5px 0 5px 6px;border-color:transparent transparent transparent var(--c);top:17.5px}

/* rows */
.rows{margin-top:4px}
.row{display:grid;grid-template-columns:18px auto 1fr auto 112px;align-items:center;column-gap:10px;height:28px;border-radius:2px;white-space:nowrap;transition:background .2s,box-shadow .2s}
.row.hot{background:rgba(255,255,255,.045);box-shadow:-8px 0 0 rgba(255,255,255,.045),8px 0 0 rgba(255,255,255,.045)}
.row .ic{display:flex;width:18px;height:18px}
.row .nm{font-size:13px;color:var(--tx)}
.row .fa{font-size:12px;color:var(--tx3);overflow:hidden}
.row .va{font-size:12px;color:var(--tx2);text-align:right}
.row .mk{display:flex;align-items:center;justify-content:flex-end;gap:7px;font-size:12px;color:var(--tx3)}
.row .mk i{flex:none;width:6px;height:6px;border-radius:50%}
.row .mk.t{color:var(--c)}
.row .mk.t i{background:var(--c)}
.row .mk.h{color:var(--tx2)}
.row .mk.h i{box-shadow:inset 0 0 0 1.2px var(--c)}
.row.done .nm{color:var(--tx2)}
.row.undone .nm{color:var(--tx)}
.ub{font-size:12px;font-weight:500;padding:2px 9px;border-radius:10px;background:rgba(255,255,255,.07);transition:background .2s;color:var(--tx)}
.ub:hover{background:rgba(255,255,255,.14)}

/* agents grid (Keep Awake) */
.ag{display:grid;grid-template-columns:1fr 1fr;column-gap:28px;margin-top:6px}
.ag .a{display:flex;align-items:center;gap:9px;height:28px;white-space:nowrap}
.ag .a i{flex:none;width:7px;height:7px;border-radius:50%;box-shadow:inset 0 0 0 1.3px rgba(235,235,245,.3);transition:background .35s,box-shadow .35s}
.ag .a.w i{background:var(--c);box-shadow:none}
.ag.ask .a.w i{background:transparent;box-shadow:inset 0 0 0 1.3px var(--c)}
.ag.off .a.w i{background:rgba(235,235,245,.3)}
.ag .a b{font-weight:400;font-size:13px}
.ag .a span{margin-left:auto;font-size:12px;color:var(--tx3)}
.ag .a.w span{color:var(--tx2)}

/* settings */
.set{position:absolute;left:0;right:0;bottom:0;padding-top:16px;border-top:1px solid var(--line)}
.modes{position:relative;display:flex;gap:24px;height:34px;align-items:flex-start}
.modes button{font-size:26px;font-weight:600;letter-spacing:-.02em;line-height:30px;color:var(--tx3);transition:color .3s}
.modes button:hover{color:var(--tx2)}
.modes button[aria-checked="true"]{color:var(--tx)}
.bar{position:absolute;left:0;top:33px;height:2px;border-radius:1px;background:var(--c);transition:transform .45s var(--ease),width .45s var(--ease),background .35s,opacity .3s}
.rule{margin-top:10px;font-size:14px;line-height:20px;height:20px;color:var(--tx2);white-space:nowrap}
.choose{display:flex;align-items:flex-start;gap:16px;margin-top:8px;height:26px;white-space:nowrap;transition:opacity .3s}
.choose .lab{line-height:20px;height:20px}
.opts{display:flex;gap:18px;align-items:flex-start}
.opts button{position:relative;font-size:14px;color:var(--tx3);line-height:20px;transition:color .25s}
.opts button:hover{color:var(--tx2)}
.opts button[aria-checked="true"]{color:var(--tx);font-weight:500}
.opts button[aria-checked="true"]::after{content:"";position:absolute;left:50%;bottom:-5px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--c)}
.det.off .choose{opacity:.3;pointer-events:none}
.det.off .gb .sg{opacity:.25}
.det.off .gb .tk{opacity:.3}
.det.off .strip .nk,.det.off .strip .nl{opacity:0}

.foot{display:flex;align-items:center;gap:28px;height:56px;padding:0 32px;border-top:1px solid var(--line)}
.sw{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--tx2);transition:color .2s}
.sw i{width:32px;height:19px;border-radius:10px;background:rgba(255,255,255,.14);position:relative;transition:background .25s;flex:none}
.sw i::after{content:"";position:absolute;left:2px;top:2px;width:15px;height:15px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .25s var(--ease)}
.sw[aria-checked="true"]{color:var(--tx)}
.sw[aria-checked="true"] i{background:#5B9BFF}
.sw[aria-checked="true"] i::after{transform:translateX(13px)}
.foot .hint{margin-left:auto;font-size:11px;color:var(--tx3)}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important}}
</style>
</head>
<body>
<div id="stage">
  <div class="mb">
    <div class="mb-l">
      <svg viewBox="0 0 17 20" width="13" height="16" aria-hidden="true"><path fill="#fff" d="M14.1 10.6c0-2.6 2.1-3.8 2.2-3.9-1.2-1.8-3.1-2-3.7-2-1.6-.2-3.1.9-3.9.9-.8 0-2-.9-3.4-.9C3.6 4.8 1.9 5.8 1 7.4c-1.9 3.3-.5 8.2 1.4 10.9.9 1.3 2 2.8 3.4 2.7 1.4-.1 1.9-.9 3.5-.9s2.1.9 3.5.9c1.5 0 2.4-1.3 3.3-2.7 1-1.5 1.5-3 1.5-3.1-.1 0-2.9-1.1-2.9-4.3zM11.5 3c.7-.9 1.2-2.1 1.1-3.3-1 0-2.3.7-3 1.6-.7.8-1.3 2-1.1 3.2 1.1.1 2.3-.6 3-1.5z"/></svg>
      <b>Finder</b><span>File</span><span>Edit</span><span>View</span><span>Go</span><span>Window</span><span>Help</span>
    </div>
    <div class="mb-r">
      <div class="icons" id="icons"><i class="hl" id="hl"></i></div>
      <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M2 6.3a8.6 8.6 0 0 1 12 0M4.2 8.6a5.4 5.4 0 0 1 7.6 0"/><circle cx="8" cy="11.6" r="1.3" fill="#fff" stroke="none"/></svg>
      <svg viewBox="0 0 26 14" width="25" height="13" aria-hidden="true"><rect x=".7" y=".7" width="21.6" height="12.6" rx="3.6" fill="none" stroke="rgba(255,255,255,.55)" stroke-width="1.2"/><rect x="2.6" y="2.6" width="11.6" height="8.8" rx="2" fill="#fff"/><path d="M24 5v4" stroke="rgba(255,255,255,.55)" stroke-width="1.4" stroke-linecap="round"/></svg>
      <span>Tue 27 Oct&nbsp;&nbsp;16:42</span>
    </div>
  </div>

  <div class="sheet" id="sheet" role="dialog" aria-label="Settings">
    <div class="nub" id="nub"><svg viewBox="0 0 18 8" width="18" height="8" aria-hidden="true"><path d="M0 8 C5 8 6.5 0 9 0 C11.5 0 13 8 18 8 Z" fill="rgba(36,36,48,.96)"/></svg></div>
    <div class="body">
      <div class="idx" id="idx" role="tablist" aria-orientation="vertical"></div>
      <div class="det" id="det"><div class="in" id="in"></div></div>
    </div>
    <div class="foot">
      <button class="sw" id="one" role="switch" aria-checked="false"><i></i>One icon in the menu bar</button>
      <button class="sw" id="login" role="switch" aria-checked="true"><i></i>Open at login</button>
      <span class="hint">Each strip runs 06:00 to 06:00. Hover a mark to read it.</span>
    </div>
  </div>
</div>

<script>
const G = {
  apps:'<rect x="4.2" y="4.2" width="7.6" height="7.6" rx="1.6"/><path d="M6.6 1.8v2.4M9.4 1.8v2.4M6.6 11.8v2.4M9.4 11.8v2.4M1.8 6.6h2.4M1.8 9.4h2.4M11.8 6.6h2.4M11.8 9.4h2.4"/>',
  servers:'<rect x="2.5" y="2.8" width="11" height="4.2" rx="1.4"/><rect x="2.5" y="9" width="11" height="4.2" rx="1.4"/><path d="M5.2 4.9h.01M5.2 11.1h.01" stroke-width="2.2"/>',
  trees:'<circle cx="4.6" cy="3.6" r="1.6"/><circle cx="4.6" cy="12.4" r="1.6"/><circle cx="11.4" cy="5.4" r="1.6"/><path d="M4.6 5.2v5.6M11.4 7c0 2.7-2.4 3.4-5.4 4.2"/>',
  disk:'<ellipse cx="8" cy="4" rx="5.5" ry="2"/><path d="M2.5 4v8c0 1.1 2.5 2 5.5 2s5.5-.9 5.5-2V4M2.5 8c0 1.1 2.5 2 5.5 2s5.5-.9 5.5-2"/>',
  awake:'<path d="M1.8 8s2.3-4.3 6.2-4.3S14.2 8 14.2 8s-2.3 4.3-6.2 4.3S1.8 8 1.8 8z"/><circle cx="8" cy="8" r="1.9"/>',
  one:'<circle cx="8" cy="8" r="5.8"/><path d="M8 4.6v3.6l2.4 1.4"/>'
};
const gl=(k,c,s)=>`<svg viewBox="0 0 16 16" width="${s}" height="${s}" fill="none" stroke="${c}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${G[k]}</svg>`;
// small app icons, drawn
const AI={
  chrome:'<svg viewBox="0 0 18 18" width="18" height="18"><circle cx="9" cy="9" r="8" fill="#DB4437"/><path d="M9 9 L2.1 13 A8 8 0 0 1 1 9 A8 8 0 0 1 2.1 5 Z" fill="#0F9D58"/><path d="M9 9 L2.1 13 A8 8 0 0 0 9 17 A8 8 0 0 0 15.9 13 Z" fill="#0F9D58"/><path d="M9 9 L15.9 13 A8 8 0 0 0 17 9 A8 8 0 0 0 15.9 5 Z" fill="#F4B400"/><path d="M9 9 L15.9 13 L9 17 A8 8 0 0 0 15.9 13 Z" fill="#F4B400"/><circle cx="9" cy="9" r="3.9" fill="#fff"/><circle cx="9" cy="9" r="3" fill="#4285F4"/></svg>',
  cft:'<svg viewBox="0 0 18 18" width="18" height="18"><circle cx="9" cy="9" r="8" fill="#5f6b7a"/><circle cx="9" cy="9" r="3.9" fill="#d9dde3"/><circle cx="9" cy="9" r="3" fill="#8fa3bb"/><path d="M9 5.1h7M6 11.5l-3.6 4M12 11.5l3.4 3.9" stroke="#d9dde3" stroke-width="1.2"/></svg>',
  spotify:'<svg viewBox="0 0 18 18" width="18" height="18"><circle cx="9" cy="9" r="8" fill="#1ED760"/><path d="M4.6 6.8c3-1 6.4-.7 9 .8M5.1 9.4c2.5-.8 5.1-.5 7.3.7M5.6 11.8c1.9-.5 3.9-.3 5.5.6" fill="none" stroke="#0b0b0b" stroke-width="1.4" stroke-linecap="round"/></svg>',
  music:'<svg viewBox="0 0 18 18" width="18" height="18"><rect x="1" y="1" width="16" height="16" rx="4" fill="#FA3C55"/><path d="M7.2 12.2V5.6l5.2-1.1v6.4" fill="none" stroke="#fff" stroke-width="1.3"/><circle cx="6.1" cy="12.3" r="1.5" fill="#fff"/><circle cx="11.3" cy="11" r="1.5" fill="#fff"/></svg>',
  photos:'<svg viewBox="0 0 18 18" width="18" height="18"><rect x="1" y="1" width="16" height="16" rx="4" fill="#f4f4f6"/><g transform="translate(9 9)"><ellipse rx="1.6" ry="3.4" cy="-3" fill="#F6B43C"/><ellipse rx="1.6" ry="3.4" cy="-3" fill="#E9453F" transform="rotate(60)"/><ellipse rx="1.6" ry="3.4" cy="-3" fill="#A35BD8" transform="rotate(120)"/><ellipse rx="1.6" ry="3.4" cy="-3" fill="#3C8CF6" transform="rotate(180)"/><ellipse rx="1.6" ry="3.4" cy="-3" fill="#43C07B" transform="rotate(240)"/><ellipse rx="1.6" ry="3.4" cy="-3" fill="#C9D83C" transform="rotate(300)"/></g></svg>'
};
const badge=(k,c)=>`<svg viewBox="0 0 18 18" width="18" height="18" aria-hidden="true"><circle cx="9" cy="9" r="9" fill="rgba(255,255,255,.07)"/><g transform="translate(4 4) scale(.625)">${`<g fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${G[k]}</g>`}</g></svg>`;

const MODES=['Off','Ask','Auto'];
const NOW=642; // 16:42 as minutes after 06:00
const M=t=>{const[h,m]=t.split(':').map(Number);return (h*60+m-360+1440)%1440};
const HM=m=>{const x=(m+360)%1440;return String(Math.floor(x/60)).padStart(2,'0')+':'+String(x%60).padStart(2,'0')};
const P=m=>(m/1440*100).toFixed(3)+'%';

// today's events: act = something Auto did (has Undo), seen = something it noticed
const EV={
  a1:{t:'11:05',kind:'act',txt:'Closed Music, load was 84 %',back:'reopened'},
  a2:{t:'15:12',kind:'act',txt:'Closed Photos, load was 78 %',back:'reopened'},
  s1:{t:'09:15',kind:'act',txt:'Stopped :8787 wrangler, idle 2 h',back:'started'},
  s2:{t:'13:20',kind:'act',txt:'Stopped :6006 storybook, idle 3 days',back:'started'},
  s3:{t:'14:42',kind:'act',txt:'Stopped :4000 phoenix, idle 2 h',back:'started'},
  t1:{t:'09:02',kind:'seen',txt:'Found 4 merged worktrees'},
  t2:{t:'14:42',kind:'seen',txt:'auth-redirect lost its last server'},
  d1:{t:'Sun 25 Oct',edge:1,kind:'act',txt:'Moved 26.4 GB to the Trash',back:'put back'},
  d2:{t:'16:10',kind:'seen',txt:'DerivedData grew 4.1 GB'},
  k1:{t:'08:58',kind:'act',noUndo:1,txt:'Kept awake: speed-3 started'},
  k2:{t:'12:31',kind:'seen',txt:'Let the Mac sleep: no agent working'},

    };

  const stop=STOP[s.v];
  return {
    big:['4','agents working', m===2?'awake since 13:10':m===1?'asks first':'sleeps as usual'],
    ins: m===2?`Awake because speed-3, bp-lane-c, media-scope and studio-icons are working. It sleeps when they finish${stop?` or at <b>${stop} %</b> battery`:''}.`
       : m===1?'4 agents are working. MinMacs asks before it keeps the Mac awake for the next one.'

    next: m===2?{txt:`Sleeps when the 4 finish${stop?` or at <b>${stop} %</b>`:''}`}:m===1?{txt:'Asks when the next agent starts'}:null,

/* ---------- render ---------- */
function dot(s){
  return s.mode===2?`background:${s.c};box-shadow:none`:s.mode===1?`background:transparent;box-shadow:inset 0 0 0 1.5px ${s.c}`:'';
}
function renderIdx(){
  $('idx').innerHTML=S.map(s=>`<button class="it${s.id===sel?' sel':''}" role="tab" aria-selected="${s.id===sel}" data-s="${s.id}" id="it-${s.id}">
    <i class="dot" style="${dot(s)}"></i><span class="nm">${s.name}</span><span class="md">${MODES[s.mode]}</span></button>`).join('');
}
function bigHTML(b){return `<span class="n" data-num="${b[0]}">${b[0]}</span><span class="u">${b[1]}</span>${b[2]?`<span class="n2">${b[2]}</span>`:''}`}
function rowsHTML(s,md){
  if(md.agents){
    const cls=s.mode===2?'':s.mode===1?' ask':' off';
    return `<div class="ag${cls}" id="ag">${AGENTS.map(a=>`<div class="a${a[2]?' w':''}"><i></i><b>${a[0]}</b><span>${a[1]}</span></div>`).join('')}</div>`;
  }
  return md.rows.map(r=>{
    let mk='', cls='row';
    if(r.ev){
      const e=EV[r.ev]; cls+=' done'+(e.undone?' undone':'');
      const tm=e.edge?'25 Oct':e.t;
      mk=`<span class="mk">${e.undone?e.back:tm}<button class="ub" data-u="${r.ev}">${e.undone?'Redo':'Undo'}</button></span>`;
    } else if(r.keep) mk=`<span class="mk">${r.keep}</span>`;
    else if(r.mk) mk=`<span class="mk ${r.mk.c}">${r.mk.c?'<i></i>':''}${r.mk.x}</span>`;
    else mk='<span class="mk"></span>';
    return `<div class="${cls}"${r.ev?` data-e="${r.ev}"`:''}><span class="ic">${r.ic||''}</span><span class="nm">${r.nm}</span><span class="fa">${r.fa||''}</span><span class="va">${r.va}</span>${mk}</div>`;
  }).join('');
}
function stripHTML(s){
  const hours=[0,180,360,540,720,900,1080,1260,1440];
  let h=`<i class="ln p" style="width:${P(NOW)}"></i><i class="ln f" style="left:${P(NOW)}"></i>`;
  h+=hours.map(m=>`<i class="hr" style="left:${P(m)}"></i>`).join('');
  h+=[[0,'06','l0'],[360,'12',''],[720,'18',''],[1080,'00',''],[1440,'06','l1']].map(([m,t,c])=>`<span class="hn ${c}" style="left:${P(m)}">${t}</span>`).join('');
  (s.spans||[]).forEach(([a,b])=>{const x=M(a),y=b?M(b):NOW;h+=`<i class="sp" style="left:${P(x)};width:${P(y-x)}"></i>`});
  h+=`<i class="nl" id="nl"></i><i class="nk" id="nk"></i>`;
  h+=`<i class="nw" style="left:${P(NOW)}"></i><span class="nwl" style="left:${P(NOW)}">now</span>`;
  h+=s.ev.map(k=>{const e=EV[k];return `<button class="ev ${e.kind}${e.edge?' edge':''}${e.undone?' undone':''}" data-e="${k}" style="left:${P(e.min)}" aria-label="${e.t} ${e.txt}"></button>`}).join('');
  return h;
}
function detHTML(s){
  const md=model(s);
  return `<div class="lab">Right now</div>
    <div class="big" id="big">${bigHTML(md.big)}</div>
    <p class="ins" id="ins">${md.ins}</p>
    <div class="gb" id="gb"><i class="f"></i><i class="sg"></i><i class="tk"></i></div>
    <div class="cap" id="cap">${md.g.cap}</div>
    <div class="tl"><div class="tl-h"><span class="l">Today</span><span class="r" id="nxt"></span></div>
      <div class="strip" id="strip">${stripHTML(s)}</div></div>
    <div class="rows" id="rows">${rowsHTML(s,md)}</div>
    <div class="set">
      <div class="modes" role="radiogroup" aria-label="${s.name} mode">
        ${MODES.map((m,i)=>`<button role="radio" aria-checked="${i===s.mode}" data-m="${i}">${m}</button>`).join('')}
        <i class="bar" id="bar"></i></div>
      <p class="rule" id="rule">${s.rule[s.mode]}</p>
      <div class="choose"><span class="lab">${s.lab}</span>
        <div class="opts" role="radiogroup" aria-label="${s.lab}">${s.vals.map((v,i)=>`<button role="radio" aria-checked="${i===s.v}" data-v="${i}">${v}</button>`).join('')}</div></div>
    </div>`;
}
function nextText(md){return md.next?(md.next.min==null&&!md.next.far?'Next · ':'Next · ')+md.next.txt:'Nothing planned'}
function applyLive(s,instant){
  const md=model(s), gb=$('gb'); if(!gb) return;
  const f=gb.querySelector('.f'), sg=gb.querySelector('.sg'), tk=gb.querySelector('.tk');
  if(instant){[f,sg,tk].forEach(e=>e.style.transition='none')}
  const g=md.g;
  if(g.colored){ f.style.width='0'; sg.style.left='0'; sg.style.width=g.fill+'%'; sg.classList.add('full') }
  else if(g.seg!=null){ const end=g.segEnd||100; f.style.width=(end-g.seg)+'%'; sg.style.left=(end-g.seg)+'%'; sg.style.width=g.seg+'%'; sg.classList.toggle('full',false) }
  else { f.style.width=g.fill+'%'; sg.style.width='0' }
  if(g.tick!=null){ tk.style.left=g.tick+'%'; tk.style.opacity='' } else tk.style.opacity=0;
  if(instant){ void gb.offsetWidth; [f,sg,tk].forEach(e=>e.style.transition='') }
  $('cap').textContent=g.cap;
  // next mark on the strip
  const nk=$('nk'), nl=$('nl'), n=md.next;
  if(instant){nk.style.transition='none';nl.style.transition='none'}
  nk.className='nk';
  if(n&&(n.min!=null||n.far)){
    const at=n.far?1440:n.min;
    nk.classList.toggle('far',!!n.far); nk.classList.toggle('ghost',!!n.ghost);
    nk.style.left=P(at); nk.style.opacity='';
    nl.style.left=P(NOW); nl.style.width=P(at-NOW); nl.style.opacity=n.ghost?.4:.7;
  } else { nk.style.opacity=0; nk.style.left=P(NOW); nl.style.left=P(NOW); nl.style.width='0'; nl.style.opacity=0 }
  if(instant){void nk.offsetWidth;nk.style.transition='';nl.style.transition=''}
  $('nxt').innerHTML=nextText(md); $('nxt').dataset.base=$('nxt').innerHTML;
}
function placeBar(instant){
  const s=cur(), b=$('bar'), t=document.querySelector(`.modes button[data-m="${s.mode}"]`);
  if(!b||!t) return;
  if(instant) b.style.transition='none';
  b.style.width=t.offsetWidth+'px'; b.style.transform=`translateX(${t.offsetLeft}px)`;
  b.style.opacity=s.mode?1:.35;
  if(instant){ void b.offsetWidth; b.style.transition='' }
}
function renderDet(animate){
  const s=cur(), d=$('det'), inn=$('in');
  d.style.setProperty('--c',s.c);
  const fill=()=>{ inn.innerHTML=detHTML(s); d.classList.toggle('off',!s.mode); placeBar(true); applyLive(s,true) };
  if(!animate){ fill(); return }
  inn.classList.add('swap');
  setTimeout(()=>{ fill(); requestAnimationFrame(()=>inn.classList.remove('swap')) },170);
}
function tweenNum(el,to){
  const from=parseFloat(el.dataset.num), target=parseFloat(to);
  if(isNaN(from)||isNaN(target)||from===target||matchMedia('(prefers-reduced-motion: reduce)').matches){el.textContent=to;el.dataset.num=to;return}
  const dec=(String(to).split('.')[1]||'').length, t0=performance.now();
  const step=t=>{const k=Math.min(1,(t-t0)/500),e=1-Math.pow(1-k,3);el.textContent=(from+(target-from)*e).toFixed(dec);if(k<1)requestAnimationFrame(step);else{el.textContent=to}};
  el.dataset.num=to; requestAnimationFrame(step);
}
function updateInPlace(){
  const s=cur(), d=$('det'), md=model(s);
  d.classList.toggle('off',!s.mode);
  document.querySelectorAll('.modes button').forEach(b=>b.setAttribute('aria-checked',String(+b.dataset.m===s.mode)));
  document.querySelectorAll('.opts button').forEach(b=>b.setAttribute('aria-checked',String(+b.dataset.v===s.v)));
  $('rule').textContent=s.rule[s.mode];
  const n=$('big').querySelector('.n');
  $('big').querySelector('.u').textContent=md.big[1];
  const n2=$('big').querySelector('.n2');
  if(md.big[2]){ if(n2) n2.innerHTML=md.big[2]; else $('big').insertAdjacentHTML('beforeend',`<span class="n2">${md.big[2]}</span>`) } else if(n2) n2.remove();
  tweenNum(n,md.big[0]);
  const ins=$('ins');
  if(ins.innerHTML!==md.ins){ ins.classList.add('fade'); setTimeout(()=>{ins.innerHTML=md.ins;ins.classList.remove('fade')},180) }
  $('rows').innerHTML=rowsHTML(s,md);
  s.ev.forEach(k=>{const b=document.querySelector(`.strip .ev[data-e="${k}"]`); if(b) b.classList.toggle('undone',EV[k].undone)});
  applyLive(s,false); placeBar(false);
}
function renderIcons(){
  const one=$('one').getAttribute('aria-checked')==='true', box=$('icons');
  if(!box.querySelector('.mi')) box.insertAdjacentHTML('beforeend',S.map(s=>`<span class="mi" id="mi-${s.id}" data-s="${s.id}" title="${s.name}">${gl(s.id,'#fff',16)}</span>`).join('')+`<span class="mi off" id="mi-one" title="MinMacs">${gl('one','#fff',16)}</span>`);
  S.forEach(s=>$('mi-'+s.id).classList.toggle('off',one||s.mode===0));
  $('mi-one').classList.toggle('off',!one);
  setTimeout(aim,420); aim();
}
function anchor(){
  const one=$('one').getAttribute('aria-checked')==='true';
  if(one) return $('mi-one');
  const s=cur(); if(s.mode) return $('mi-'+s.id);
  return [...document.querySelectorAll('.mi:not(.off)')][0]||null;
}
function aim(){
  const a=anchor(), hl=$('hl'), box=$('icons');
  if(!a){ hl.style.opacity=0; return }
  const x=a.offsetLeft+8;
  hl.style.opacity=1; hl.style.transform=`translateX(${x-14}px)`;
  const st=$('stage'), k=st.getBoundingClientRect().width/1280;
  const bx=(box.getBoundingClientRect().left-st.getBoundingClientRect().left)/k;
  $('nub').style.transform=`translateX(${bx+x-$('sheet').offsetLeft-1}px)`;
}
function select(id){
  if(id===sel) return; sel=id;
  document.querySelectorAll('.it').forEach(e=>{const on=e.dataset.s===id; e.classList.toggle('sel',on); e.setAttribute('aria-selected',on)});
  renderDet(true); aim();
}
function setMode(m){
  const s=cur(); if(s.mode===m) return; s.mode=m;
  const it=$('it-'+s.id); it.querySelector('.dot').setAttribute('style',dot(s)); it.querySelector('.md').textContent=MODES[m];
  updateInPlace(); renderIcons();
}
// hover links a strip mark with its row, and reads the mark in the strip header
function hot(k,on){
  const e=EV[k]; if(!e) return;
  document.querySelectorAll(`[data-e="${k}"]`).forEach(x=>x.classList.toggle('hot',on));
  const r=$('nxt'); if(!r) return;
  r.innerHTML = on ? `<b>${e.t}</b> ${e.txt}${e.undone?' · undone':''}` : r.dataset.base;
}
document.addEventListener('mouseover',e=>{const x=e.target.closest('[data-e]'); if(x) hot(x.dataset.e,true)});
document.addEventListener('mouseout',e=>{const x=e.target.closest('[data-e]'); if(x&&!x.contains(e.relatedTarget)) hot(x.dataset.e,false)});
document.addEventListener('focusin',e=>{const x=e.target.closest('.ev'); if(x) hot(x.dataset.e,true)});
document.addEventListener('focusout',e=>{const x=e.target.closest('.ev'); if(x) hot(x.dataset.e,false)});

document.addEventListener('click',e=>{
  const it=e.target.closest('.it'); if(it){ select(it.dataset.s); return }
  const mb=e.target.closest('.modes button'); if(mb){ setMode(+mb.dataset.m); return }
  const ob=e.target.closest('.opts button'); if(ob){ cur().v=+ob.dataset.v; updateInPlace(); return }
  const u=e.target.closest('.ub'); if(u){ const k=u.dataset.u; EV[k].undone=!EV[k].undone; updateInPlace(); hot(k,true); return }
  const mi=e.target.closest('.mi'); if(mi&&mi.dataset.s){ select(mi.dataset.s); return }
  const sw=e.target.closest('.sw'); if(sw){ sw.setAttribute('aria-checked',String(sw.getAttribute('aria-checked')!=='true')); renderIcons() }
});
document.addEventListener('keydown',e=>{
  const it=e.target.closest&&e.target.closest('.it'); if(!it) return;
  const i=S.findIndex(s=>s.id===it.dataset.s);
  const j = e.key==='ArrowDown'?Math.min(4,i+1): e.key==='ArrowUp'?Math.max(0,i-1): -1;
  if(j<0) return; e.preventDefault(); select(S[j].id); $('it-'+S[j].id).focus();
});

function fit(){const st=$('stage'),k=Math.min(innerWidth/1280,innerHeight/800);st.style.transform=`translate(${(innerWidth-1280*k)/2}px,${(innerHeight-800*k)/2}px) scale(${k})`;aim()}
addEventListener('resize',fit);
renderIdx(); renderDet(false); renderIcons(); fit();
document.fonts&&document.fonts.ready.then(()=>{placeBar(true);aim()});
</script>
</body>
</html>
