<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sheet with a Graph</title>
<style>
:root{
  --glass:rgba(28,29,38,.88);
  --line:rgba(255,255,255,.06);
  --tx:rgba(255,255,255,.94);
  --tx2:rgba(235,235,245,.55);
  --tx3:rgba(235,235,245,.28);
  --trk:rgba(255,255,255,.07);
  --gr:rgba(235,235,245,.24);
  --ease:cubic-bezier(.3,.7,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#1a1636}
body{font-family:-apple-system,"SF Pro Text",system-ui,sans-serif;color:var(--tx);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;font-size:13px;cursor:default;user-select:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;text-align:left}
:focus{outline:none}
:focus-visible{outline:2px solid rgba(255,255,255,.55);outline-offset:3px;border-radius:8px}
#stage{position:absolute;left:0;top:0;width:1280px;height:800px;transform-origin:0 0;overflow:hidden;
  background:
   radial-gradient(760px 560px at 10% 6%,#4b3c9e 0%,rgba(75,60,158,0) 70%),
   radial-gradient(700px 520px at 84% 2%,#22618f 0%,rgba(34,97,143,0) 70%),
   radial-gradient(820px 620px at 88% 104%,#a0436f 0%,rgba(160,67,111,0) 70%),
   radial-gradient(640px 520px at 18% 100%,#3a2463 0%,rgba(58,36,99,0) 75%),
   #1d1a3c}

/* menu bar */
.mb{position:absolute;left:0;right:0;top:0;height:26px;display:flex;align-items:center;justify-content:space-between;padding:0 12px 0 16px;background:rgba(18,14,40,.32);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);font-size:13px;color:rgba(255,255,255,.92);z-index:5}
.mb-l,.mb-r{display:flex;align-items:center;gap:18px}
.mb-l b{font-weight:700}
.mb-r{gap:14px}
.icons{position:relative;display:flex;align-items:center;gap:12px}
.hl{position:absolute;top:-3px;height:22px;width:28px;border-radius:6px;background:rgba(255,255,255,.2);transition:transform .45s var(--ease),opacity .3s;pointer-events:none}
.mi{position:relative;display:flex;width:16px;overflow:hidden;cursor:pointer;transition:width .4s var(--ease),opacity .3s,margin .4s var(--ease)}
.mi.off{width:0;opacity:0;margin-left:-12px}

/* sheet */
.sheet{position:absolute;top:34px;left:404px;width:752px;background:var(--glass);backdrop-filter:blur(36px) saturate(1.5);-webkit-backdrop-filter:blur(36px) saturate(1.5);border:1px solid rgba(255,255,255,.085);border-radius:22px;box-shadow:0 34px 100px rgba(6,4,24,.5),inset 0 1px 0 rgba(255,255,255,.035);animation:drop .6s var(--ease) both}
@keyframes drop{from{opacity:0;transform:translateY(-10px)}}
.nub{position:absolute;top:-8px;left:0;width:18px;height:8px;margin-left:-9px;transition:transform .45s var(--ease)}
.nub svg{display:block}

.head{display:flex;align-items:center;gap:12px;height:52px;padding:0 36px;white-space:nowrap}
.head .lbl{font-size:12px;color:var(--tx3)}
.head .txt{font-size:13px;color:var(--tx2)}
.head .txt b{font-weight:500;color:var(--tx)}
.head .undo{margin-left:auto;font-size:13px;font-weight:500;padding:4px 12px;border-radius:12px;background:rgba(255,255,255,.07);transition:background .2s}
.head .undo:hover{background:rgba(255,255,255,.13)}

.body{display:grid;grid-template-columns:216px minmax(0,1fr);column-gap:44px;padding:4px 36px 22px}

/* index */
.idx{display:flex;flex-direction:column}
.it{display:flex;align-items:center;gap:14px;height:58px;white-space:nowrap}
.it .dot{flex:none;width:9px;height:9px;border-radius:50%;box-shadow:inset 0 0 0 1.5px rgba(235,235,245,.28);transition:background .35s,box-shadow .35s}
.it .nm{font-size:27px;font-weight:600;letter-spacing:-.022em;color:rgba(235,235,245,.34);transition:color .3s}
.it .md{margin-left:auto;font-size:12px;color:var(--tx3);transition:color .3s}
.it:hover .nm{color:var(--tx2)}
.it.sel .nm{color:var(--tx)}
.it.sel .md{color:var(--tx2)}

/* detail */
.det{position:relative;padding-top:4px;height:504px}
.det .in{transition:opacity .22s,transform .35s var(--ease)}
.det .in.swap{opacity:0;transform:translateY(6px)}
.modes{position:relative;display:flex;gap:26px;height:44px;align-items:flex-start}
.modes button{font-size:30px;font-weight:600;letter-spacing:-.02em;line-height:36px;color:var(--tx3);transition:color .3s}
.modes button:hover{color:var(--tx2)}
.modes button[aria-checked="true"]{color:var(--tx)}
.bar{position:absolute;left:0;top:41px;height:2px;border-radius:1px;background:var(--c);transition:transform .45s var(--ease),width .45s var(--ease),background .35s}
.rule{margin-top:12px;font-size:14px;line-height:20px;color:var(--tx2);min-height:20px;white-space:nowrap}
.lab{font-size:12px;color:var(--tx3);margin-bottom:6px;line-height:16px}
.choose{margin-top:14px;display:flex;align-items:baseline;gap:18px;transition:opacity .3s}
.choose .lab{margin:0;flex:none}
.opts{display:flex;gap:20px;height:26px;align-items:flex-start;white-space:nowrap}
.opts button{position:relative;font-size:15px;color:var(--tx3);line-height:20px;transition:color .25s}
.opts button:hover{color:var(--tx2)}
.opts button[aria-checked="true"]{color:var(--tx);font-weight:500}
.opts button[aria-checked="true"]::after{content:"";position:absolute;left:50%;bottom:-6px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--c)}
.now{margin-top:22px;padding-top:18px;border-top:1px solid var(--line);transition:opacity .3s}
.ins{margin-top:6px;font-size:13px;line-height:19px;color:var(--tx2);min-height:38px}
.ins b{font-weight:500;color:var(--tx)}
.big{display:flex;align-items:baseline;gap:6px;white-space:nowrap;height:46px}
.big .n{font-size:42px;font-weight:500;letter-spacing:-.02em;line-height:46px}
.big .u{font-size:15px;color:var(--tx2)}
.big .n2{margin-left:18px;font-size:15px;color:var(--tx2)}
.big .n2 b{font-weight:500;color:var(--tx)}
.det.off .choose{opacity:.3;pointer-events:none}
.det.off .big .n{font-size:20px;font-weight:500;color:var(--tx3)}

/* graph */
.gr{margin-top:16px;transition:opacity .4s,filter .4s}
.det.off .gr,.det.off .rows{opacity:.45;filter:saturate(0)}
.cap{display:flex;align-items:baseline;justify-content:space-between;gap:16px;font-size:12px;line-height:16px;color:var(--tx3);white-space:nowrap;margin-bottom:10px}
.cap b{font-weight:500;color:var(--tx2)}
.cap .k{color:var(--tx2)}
.cap .k b{color:var(--tx)}
.sw8{display:inline-block;width:8px;height:8px;border-radius:2px;background:var(--c);margin-right:7px}
.swt{display:inline-block;width:2px;height:10px;border-radius:1px;background:#fff;margin-right:8px;vertical-align:-1px}
.hb{position:relative;height:8px;border-radius:4px;background:var(--trk)}
.hb .s{position:absolute;top:0;bottom:0;border-radius:4px;transition:left .6s var(--ease),width .6s var(--ease),background .4s,opacity .4s}
.hb .t{position:absolute;top:-5px;width:2px;height:18px;margin-left:-1px;border-radius:1px;background:#fff;transition:left .6s var(--ease),opacity .4s}
.tl{position:relative;height:18px;margin-top:6px;font-size:11px;color:var(--tx3);white-space:nowrap}
.tl span{position:absolute;top:0;transform:translateX(-50%);transition:left .6s var(--ease),transform .6s var(--ease),opacity .4s}
.tl span.r{transform:none;right:0}
.tl span.l{transform:none;left:0}
/* columns */
.cols{position:relative;display:flex;align-items:flex-end;justify-content:space-between;height:60px;--cw:30px}
.col{position:relative;width:var(--cw);height:100%;border-radius:7px;background:var(--trk);overflow:hidden;flex:none}
.col i{position:absolute;left:0;right:0;bottom:0;border-radius:7px;transition:height .6s var(--ease),background .4s,box-shadow .4s,opacity .4s}
.lim{font-style:normal;position:absolute;left:-6px;right:46px;height:0;border-top:1px dashed rgba(255,255,255,.55);transition:bottom .6s var(--ease)}
.lim span{position:absolute;left:100%;top:-8px;margin-left:8px;font-size:11px;color:var(--tx2)}
.clab{display:flex;justify-content:space-between;margin-top:7px;--cw:30px;font-size:10.5px;color:var(--tx3);white-space:nowrap}
.clab span{width:var(--cw);text-align:center;flex:none;display:flex;justify-content:center}
.leg{display:flex;gap:16px;margin-top:8px;font-size:11px;color:var(--tx3);white-space:nowrap}
.leg span{display:flex;align-items:center;gap:6px}
.leg i{width:8px;height:8px;border-radius:2px}

/* rows */
.rows{margin-top:10px;transition:opacity .4s,filter .4s}
.row{display:flex;align-items:center;gap:12px;height:26px;white-space:nowrap}
.rows.tight .row{height:24px}
.row .ic{flex:none;width:20px;height:20px;display:flex;align-items:center;justify-content:center}
.row .nm{font-size:13px;color:var(--tx);overflow:hidden;text-overflow:ellipsis;min-width:0}
.row .sub{font-size:12px;color:var(--tx3);overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
.row .v{font-size:13px;color:var(--tx);text-align:right;flex:none}
.row .v small{font-size:11px;color:var(--tx3);margin-left:2px}
.row .v.w1{width:46px}
.row .v.w2{width:58px}
.row .tag{flex:none;width:var(--tw,84px);text-align:right;font-size:12px;color:var(--tx3);transition:color .3s}
.row .tag.on{color:var(--c)}
.row .tag.on::before{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--c);margin-right:7px;vertical-align:1px}
.row.dim .nm{color:var(--tx2)}
.more{font-size:12px;color:var(--tx3);padding-left:32px;line-height:24px;white-space:nowrap}
.bd{width:20px;height:20px;border-radius:50%;background:rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center}

.foot{display:flex;align-items:center;gap:28px;height:48px;padding:0 36px;border-top:1px solid var(--line)}
.sw{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--tx2);transition:color .2s}
.sw i{width:32px;height:19px;border-radius:10px;background:rgba(255,255,255,.14);position:relative;transition:background .25s;flex:none}
.sw i::after{content:"";position:absolute;left:2px;top:2px;width:15px;height:15px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .25s var(--ease)}
.sw[aria-checked="true"]{color:var(--tx)}
.sw[aria-checked="true"] i{background:#5B9BFF}
.sw[aria-checked="true"] i::after{transform:translateX(13px)}
.foot .hint{margin-left:auto;font-size:11px;color:var(--tx3)}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important}}
</style>
</head>
<body>
<div id="stage">
  <div class="mb">
    <div class="mb-l">
      <svg viewBox="0 0 17 20" width="13" height="16" aria-hidden="true"><path fill="#fff" d="M14.1 10.6c0-2.6 2.1-3.8 2.2-3.9-1.2-1.8-3.1-2-3.7-2-1.6-.2-3.1.9-3.9.9-.8 0-2-.9-3.4-.9C3.6 4.8 1.9 5.8 1 7.4c-1.9 3.3-.5 8.2 1.4 10.9.9 1.3 2 2.8 3.4 2.7 1.4-.1 1.9-.9 3.5-.9s2.1.9 3.5.9c1.5 0 2.4-1.3 3.3-2.7 1-1.5 1.5-3 1.5-3.1-.1 0-2.9-1.1-2.9-4.3zM11.5 3c.7-.9 1.2-2.1 1.1-3.3-1 0-2.3.7-3 1.6-.7.8-1.3 2-1.1 3.2 1.1.1 2.3-.6 3-1.5z"/></svg>
      <b>Finder</b><span>File</span><span>Edit</span><span>View</span><span>Go</span><span>Window</span><span>Help</span>
    </div>
    <div class="mb-r">
      <div class="icons" id="icons"><i class="hl" id="hl"></i></div>
      <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M2 6.3a8.6 8.6 0 0 1 12 0M4.2 8.6a5.4 5.4 0 0 1 7.6 0"/><circle cx="8" cy="11.6" r="1.3" fill="#fff" stroke="none"/></svg>
      <svg viewBox="0 0 26 14" width="25" height="13" aria-hidden="true"><rect x=".7" y=".7" width="21.6" height="12.6" rx="3.6" fill="none" stroke="rgba(255,255,255,.55)" stroke-width="1.2"/><rect x="2.6" y="2.6" width="11.6" height="8.8" rx="2" fill="#fff"/><path d="M24 5v4" stroke="rgba(255,255,255,.55)" stroke-width="1.4" stroke-linecap="round"/></svg>
      <span>Tue 27 Oct&nbsp;&nbsp;16:42</span>
    </div>
  </div>

  <div class="sheet" id="sheet" role="dialog" aria-label="Settings">
    <div class="nub" id="nub"><svg viewBox="0 0 18 8" width="18" height="8" aria-hidden="true"><path d="M0 8 C5 8 6.5 0 9 0 C11.5 0 13 8 18 8 Z" fill="rgba(36,36,48,.96)"/></svg></div>
    <div class="head" id="today"></div>
    <div class="body">
      <div class="idx" id="idx" role="tablist" aria-orientation="vertical"></div>
      <div class="det" id="det"><div class="in" id="in"></div></div>
    </div>
    <div class="foot">
      <button class="sw" id="one" role="switch" aria-checked="false"><i></i>One icon in the menu bar</button>
      <button class="sw" id="login" role="switch" aria-checked="true"><i></i>Open at login</button>
      <span class="hint">Click an icon above to jump here</span>
    </div>
  </div>
</div>

<script>
const G = {
  apps:'<rect x="4.2" y="4.2" width="7.6" height="7.6" rx="1.6"/><path d="M6.6 1.8v2.4M9.4 1.8v2.4M6.6 11.8v2.4M9.4 11.8v2.4M1.8 6.6h2.4M1.8 9.4h2.4M11.8 6.6h2.4M11.8 9.4h2.4"/>',
  servers:'<rect x="2.5" y="2.8" width="11" height="4.2" rx="1.4"/><rect x="2.5" y="9" width="11" height="4.2" rx="1.4"/><path d="M5.2 4.9h.01M5.2 11.1h.01" stroke-width="2.2"/>',
  trees:'<circle cx="4.6" cy="3.6" r="1.6"/><circle cx="4.6" cy="12.4" r="1.6"/><circle cx="11.4" cy="5.4" r="1.6"/><path d="M4.6 5.2v5.6M11.4 7c0 2.7-2.4 3.4-5.4 4.2"/>',
  disk:'<ellipse cx="8" cy="4" rx="5.5" ry="2"/><path d="M2.5 4v8c0 1.1 2.5 2 5.5 2s5.5-.9 5.5-2V4M2.5 8c0 1.1 2.5 2 5.5 2s5.5-.9 5.5-2"/>',
  awake:'<path d="M1.8 8s2.3-4.3 6.2-4.3S14.2 8 14.2 8s-2.3 4.3-6.2 4.3S1.8 8 1.8 8z"/><circle cx="8" cy="8" r="1.9"/>',
  one:'<circle cx="8" cy="8" r="5.8"/><path d="M8 4.6v3.6l2.4 1.4"/>',
  folder:'<path d="M2 4.5c0-.8.6-1.4 1.4-1.4h3l1.4 1.6h4.8c.8 0 1.4.6 1.4 1.4v5.5c0 .8-.6 1.4-1.4 1.4H3.4c-.8 0-1.4-.6-1.4-1.4z"/>',
  box:'<path d="M8 1.8l5.6 3v6.4L8 14.2l-5.6-3V4.8z"/><path d="M2.4 4.8L8 7.8l5.6-3M8 7.8v6.4"/>'
};
const gl=(k,c,s)=>`<svg viewBox="0 0 16 16" width="${s}" height="${s}" fill="none" stroke="${c}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${G[k]}</svg>`;
const badge=k=>`<span class="bd">${gl(k,'rgba(235,235,245,.6)',12)}</span>`;
/* app and agent icons, drawn inline */
const IC={
  chrome:'<svg width="18" height="18" viewBox="0 0 18 18"><circle cx="9" cy="9" r="8.5" fill="#34A853"/><path d="M9 9 L1.6 4.8 A8.5 8.5 0 0 1 16.4 4.8 Z" fill="#EA4335"/><path d="M9 9 L16.4 4.8 A8.5 8.5 0 0 1 9 17.5 Z" fill="#FBBC04"/><circle cx="9" cy="9" r="4" fill="#fff"/><circle cx="9" cy="9" r="3" fill="#4285F4"/></svg>',
  spotify:'<svg width="18" height="18" viewBox="0 0 18 18"><circle cx="9" cy="9" r="8.5" fill="#1ED760"/><path d="M4.6 6.8c3-.9 6.2-.6 8.9.8M5.1 9.4c2.4-.7 5-.4 7.2.7M5.6 11.8c1.9-.5 3.8-.3 5.5.6" fill="none" stroke="#121212" stroke-width="1.4" stroke-linecap="round"/></svg>',
  cmux:'<svg width="18" height="18" viewBox="0 0 18 18"><rect x=".5" y=".5" width="17" height="17" rx="4.5" fill="#2b2d3a" stroke="rgba(255,255,255,.12)"/><path d="M5 6.2l2.6 2.6L5 11.4M9.4 11.6h3.6" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  cursor:'<svg width="18" height="18" viewBox="0 0 18 18"><rect x=".5" y=".5" width="17" height="17" rx="4.5" fill="#141414" stroke="rgba(255,255,255,.14)"/><path d="M9 3.6l4.7 2.7v5.4L9 14.4l-4.7-2.7V6.3z" fill="none" stroke="#fff" stroke-width="1.2" stroke-linejoin="round"/><path d="M4.3 6.3L9 9l4.7-2.7M9 9v5.4" fill="none" stroke="#fff" stroke-width="1.2"/></svg>',
  claude:'<svg width="18" height="18" viewBox="0 0 18 18"><rect x=".5" y=".5" width="17" height="17" rx="4.5" fill="#D97757"/><path d="M9 3.6v10.8M3.6 9h10.8M5.2 5.2l7.6 7.6M12.8 5.2l-7.6 7.6" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/></svg>',
  codex:'<svg width="18" height="18" viewBox="0 0 18 18"><rect x=".5" y=".5" width="17" height="17" rx="4.5" fill="#f4f4f6"/><path d="M6 6.6l2.4 2.4L6 11.4M10 11.6h2.6" fill="none" stroke="#111" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>'
};
const U=(n,u)=>`${n}<small>${u}</small>`;
const MODES=['Off','Ask','Auto'];
const NEXT=['tonight','on Sunday','on 1 Nov'];
let sel='apps', undone=false;

/* fixture */
const SERVERS=[ // idle minutes; -1 in use; -2 kept
  {p:':3000',k:'next dev',o:'speed-3-base',m:'412',idle:-1},
  {p:':5173',k:'vite',o:'speed-3-base',m:'188',idle:-1},
  {p:':3334',k:'sanity',o:'studio-parity',m:'640',idle:40},
  {p:':4000',k:'phoenix',o:'auth-redirect',m:'290',idle:120},
  {p:':6006',k:'storybook',o:'nobody',m:'520',idle:4320},
  {p:':5432',k:'postgres',o:'Docker',m:'140',idle:-2}];
const IDLE_MIN=[30,60,120,240,1440];
const TREES=[ // st: m merged (age days), s stale, u in use
  {n:'lane-e-sort',st:'m',age:3,gb:2.3},{n:'auth-redirect',st:'m',age:2,gb:1.8,note:':4000'},
  {n:'sb-fieldsets',st:'m',age:5,gb:0.94},{n:'w19-fire',st:'m',age:9,gb:0.61},
  {n:'bp7-studio-dogfood',st:'s',gb:3.2},{n:'bp8-sweep-studio403',st:'s',gb:1.1},
  {n:'speed-3-base',st:'u',gb:2.6},{n:'studio-parity',st:'u',gb:1.9},{n:'bp-lane-c',st:'u',gb:1.4}];
const AFTER_D=[1/24,1,7];
const CLUTTER=[
  {n:'Xcode DerivedData',sub:'7 projects, 4 gone',gb:14.2,safe:1,ic:'folder'},
  {n:'node_modules',sub:'in merged worktrees',gb:9.8,safe:1,ic:'folder'},
  {n:'npm cache',sub:'npm’s own clean',gb:6.1,safe:1,ic:'box'},
  {n:'Docker build cache',gb:4.2,safe:0},{n:'Playwright, old versions',gb:3.3,safe:0},{n:'Simulator runtimes',gb:0.8,safe:0}];
const AGENTS=[
  {n:'speed-3',a:'Claude Code',ic:'claude',st:'working 2m',w:1},
  {n:'bp-lane-c',a:'Claude Code',ic:'claude',st:'working 14m',w:1},
  {n:'media-scope',a:'Codex',ic:'codex',st:'working 6m',w:1},
  {n:'studio-icons',a:'Cursor',ic:'cursor',st:'working 1m',w:1},
  {n:'lexicon-judge',a:'Claude Code',ic:'claude',st:'needs you 3m',w:0},
  {n:'studio-parity',a:'Claude Code',ic:'claude',st:'idle 40m',w:0}];

const fmtIdle=m=>m>=1440?Math.round(m/1440)+' d':m>=60?(m%60?Math.floor(m/60)+' h '+m%60+' m':m/60+' h'):m+' m';
const gbmb=g=>g<1?U(Math.round(g*1000),' MB'):U(g.toFixed(1),' GB');

/* one graph + its rows per section; same markup shape in every state so it can ease */
const GRAPH={
apps(s){
  const lim=[60,70,80,90][s.v], verb=['not watching',"closing frees",'Auto frees'][s.mode];
  const act=63>lim;
  return `<div class="cap"><span>Load <b>63 %</b></span><span class="k"><i class="sw8"></i>${verb} <b>22 %</b> and <b>9.3 GB</b></span></div>
   <div class="hb"><i class="s" style="left:0;width:41%;background:var(--gr)"></i><i class="s" style="left:41.4%;width:21.6%;background:var(--c)"></i><i class="t" style="left:${lim}%"></i></div>
   <div class="tl"><span class="l">kept apps</span><span style="left:${lim}%;color:var(--tx2);transform:translateX(-${lim>=80?100:50}%)">${act?'over ':'acts above '}${lim} %</span></div>`;
},
appsRows(s){
  const t=s.mode===2?'closes':s.mode===1?'shown':'';
  const r=(ic,n,sub,cpu,mem,tag,on)=>`<div class="row${on?'':' dim'}"><span class="ic">${IC[ic]}</span><span class="nm">${n}</span><span class="sub">${sub}</span><span class="v w1">${U(cpu,' %')}</span><span class="v w2">${mem}</span><span class="tag${on&&s.mode?' on':''}">${on?t:'kept'}</span></div>`;
  return r('chrome','Chrome','14 noise tabs','21',U('8.7',' GB'),'',1)+
    r('spotify','Spotify','','1',U('578',' MB'),'',1)+
    r('cmux','cmux','essential','44',U('6.8',' GB'),'',0)+
    r('cursor','Cursor','essential','12',U('3.1',' GB'),'',0);
},
servers(s){
  const lim=IDLE_MIN[s.v], verb=['not watching','past the line, shown','past the line, stopped'][s.mode];
  const col=x=>{
    if(x.idle<0) return `<div class="col" title="${x.p} ${x.idle===-1?'in use':'kept'}"><i style="height:${x.idle===-1?'14%':'0%'};background:var(--gr)"></i></div>`;
    const f=Math.min(x.idle/lim,1.25), over=x.idle>=lim;
    return `<div class="col" title="${x.p} idle ${fmtIdle(x.idle)}"><i style="height:${Math.max(10,f*76)}%;background:var(--c);opacity:${over?1:.4}"></i></div>`;
  };
  return `<div class="cap"><span>Idle time per server</span><span class="k"><i class="sw8"></i>${verb}</span></div>
    <div style="position:relative;padding-right:52px"><div class="cols" style="--cw:40px">${SERVERS.map(col).join('')}</div><i class="lim" style="bottom:${76*0.6}px"><span>${s.vals[s.v].replace(' ','&nbsp;')}</span></i></div>
    <div class="clab" style="--cw:40px;padding-right:52px">${SERVERS.map(x=>`<span>${x.p}</span>`).join('')}</div>`;
},
serversRows(s){
  const lim=IDLE_MIN[s.v];
  return SERVERS.filter(x=>x.idle>0).sort((a,b)=>b.idle-a.idle).map(x=>{
    const over=x.idle>=lim;
    const tag=!s.mode?'':over?(s.mode===2?'stops now':'shown'):'in '+fmtIdle(lim-x.idle);
    return `<div class="row"><span class="ic">${badge('servers')}</span><span class="nm">${x.p} ${x.k}</span><span class="sub">${x.o} · ${fmtIdle(x.idle)}</span><span class="v w2">${U(x.m,' MB')}</span><span class="tag${over&&s.mode?' on':''}">${tag}</span></div>`;
  }).join('');
},
trees(s){
  const after=AFTER_D[s.v], max=3.2;
  let free=0;
  const cols=TREES.map(t=>{
    let st;
    if(t.st==='m'){ const go=t.age>=after; if(go) free+=t.gb; st=go?'background:var(--c);box-shadow:none':'background:transparent;box-shadow:inset 0 0 0 1.5px var(--c)'; }
    else if(t.st==='s') st='background:repeating-linear-gradient(135deg,rgba(235,235,245,.3) 0 2px,rgba(235,235,245,.08) 2px 5px);box-shadow:none';
    else st='background:var(--gr);box-shadow:none';
    return `<div class="col" title="${t.n} · ${t.gb} GB"><i style="height:${t.gb/max*100}%;${st}"></i></div>`;
  }).join('');
  const verb=['not watching','Remove Merged would free','Remove Merged frees'][s.mode];
  return `<div class="cap"><span>Size per worktree</span><span class="k"><i class="sw8"></i>${verb} <b><span data-tw="1">${(Math.round(free*10+1e-6)/10).toFixed(1)}</span> GB</b></span></div>
    <div class="cols" style="height:56px">${cols}</div>
    <div class="leg"><span><i style="background:var(--c)"></i>merged, can go</span><span><i style="box-shadow:inset 0 0 0 1.5px var(--c)"></i>merged, waiting</span><span><i style="background:repeating-linear-gradient(135deg,rgba(235,235,245,.4) 0 2px,rgba(235,235,245,.1) 2px 4px)"></i>stale</span><span><i style="background:var(--gr)"></i>in use</span></div>`;
},
treesRows(s){
  const after=AFTER_D[s.v];
  return TREES.filter(t=>t.st==='m').map(t=>{
    const go=t.age>=after, wait=Math.ceil(after-t.age);
    const tag=!s.mode?'':go?(s.mode===2?'removes':'can go'):'waits '+wait+' d';
    return `<div class="row${go?'':' dim'}"><span class="ic">${badge('trees')}</span><span class="nm">${t.n}</span><span class="sub">merged ${t.age} d ago${t.note?' · '+t.note:''}</span><span class="v w2">${gbmb(t.gb)}</span><span class="tag${go&&s.mode?' on':''}">${tag}</span></div>`;
  }).join('');
},
disk(s){
  const tot=38.4; let x=0;
  const segs=CLUTTER.map((c,i)=>{const l=x/tot*100,w=c.gb/tot*100; x+=c.gb;
    return `<i class="s" style="left:calc(${l}% + ${i?1.5:0}px);width:calc(${w}% - ${i?1.5:0}px);background:${c.safe?'var(--c)':'var(--gr)'};opacity:${c.safe?[1,.78,.58][i]:.9}"></i>`}).join('');
  const verb=['not watching','Clean Safe would move','Clean Safe moves'][s.mode];
  return `<div class="cap"><span>Could go <b>38.4 GB</b></span><span class="k"><i class="sw8"></i>${verb} <b>30.1 GB</b> to the Trash</span></div>
    <div class="hb" style="background:transparent">${segs}</div>
    <div class="tl"><span class="l">Disk 812 of 994 GB used, 182 GB free</span><span class="r">the rest stays</span></div>`;
},
diskRows(s){
  const t=s.mode===2?'to Trash':s.mode===1?'safe':'';
  return CLUTTER.filter(c=>c.safe).map(c=>`<div class="row"><span class="ic">${badge(c.ic)}</span><span class="nm">${c.n}</span><span class="sub">${c.sub}</span><span class="v w2">${gbmb(c.gb)}</span><span class="tag${s.mode?' on':''}">${t}</span></div>`).join('')+
   `<div class="row dim"><span class="ic">${badge('disk')}</span><span class="nm">Other caches</span><span class="sub">Docker, Playwright, more</span><span class="v w2">${U('8.3',' GB')}</span><span class="tag">stays</span></div>`;
},
awake(s){
  const lim=[10,20,30,null][s.v];
  const r=s.mode===0?'sleeps as usual':s.mode===1?(lim?`asks first, ends at <b>${lim} %</b>`:'asks first, no battery limit'):(lim?`ends at <b>${lim} %</b>`:'no battery limit');
  return `<div class="cap"><span>Battery <b>64 %</b>, on power</span><span class="k"><i class="swt"></i>${r}</span></div>
    <div class="hb"><i class="s" style="left:0;width:64%;background:var(--c)"></i><i class="t" style="left:${lim||100}%;opacity:${lim?1:0}"></i></div>
`;
},
awakeRows(s){
  return AGENTS.map(a=>`<div class="row${a.w?'':' dim'}"><span class="ic">${IC[a.ic]}</span><span class="nm">${a.n}</span><span class="sub">${a.a}</span><span class="v" style="width:96px;color:${a.w?'var(--tx)':'var(--tx2)'};font-size:12px">${a.st}</span><span class="tag${a.w&&s.mode?' on':''}">${a.w?(s.mode===2?'holds awake':s.mode===1?'would hold':'—'):'not holding'}</span></div>`).join('');
}
};

/* one plain-words sentence about what is happening right now */
const INS={
  apps(s){const lim=[60,70,80,90][s.v];
    return 63>lim?`Load is <b>63 %</b>, over your ${lim} % line, so Chrome and Spotify ${s.mode===2?'get closed':'are worth closing'}. Your work apps stay.`
      :`Load is <b>63 %</b>, under your ${lim} % line. Chrome and Spotify are the noise: 14 tabs of YouTube, X and Reddit.`},
  servers(){return `<b>3 servers idle.</b> :6006 storybook has been idle 3 days and nobody owns it. :4000 belongs to a merged worktree.`},
  trees(s){const n=TREES.filter(t=>t.st==='m'&&t.age>=AFTER_D[s.v]).length;
    return `<b>4 worktrees are merged</b> into main and still take 5.7 GB${n<4?`; ${n} of them waited long enough`:''}. 2 stale ones stay: they hold work.`},
  disk(){return `Disk is <b>82 % full</b>, 182 GB free. Xcode still keeps build data for 4 projects that no longer exist.`},
  awake(s){const lim=[10,20,30,null][s.v];
    return s.mode===0?`<b>4 of your 12 agents</b> are working, but the Mac sleeps as usual when you leave it.`
      :`Awake because <b>4 of your 12 agents</b> are working. It sleeps when they finish${lim?`, at ${lim} % battery,`:','} if the network drops or the Mac runs hot.`}
};
const S=[
  {id:'apps',name:'Apps',c:'#5B9BFF',mode:2,lab:'When load is above',vals:['60 %','70 %','80 %','90 %'],v:1,
   rule:['Not watching apps.','Shows noise apps you could close when the Mac is busy.','Closes noise apps when the Mac is busy.'],
   now:[()=>['Not watching'],()=>['2','noise apps','ready to close'],()=>[undone?'0':'2','closed today',undone?'2 reopened':'']]},
  {id:'servers',name:'Servers',c:'#3FD0B8',mode:2,lab:'Idle for',vals:['30 min','1 h','2 h','4 h','1 day'],v:2,
   rule:['Not watching servers.','Shows localhost servers nobody is using.','Stops localhost servers nobody used.'],
   now:[()=>['Not watching'],()=>['3','idle now',''],()=>['3','idle now',`<b>${undone?0:3}</b> stopped today`]]},
  {id:'trees',name:'Worktrees',c:'#4CC96B',mode:1,lab:'After merge',vals:['1 h','1 day','1 week'],v:1,
   rule:['Not watching worktrees.','Shows git worktrees that are merged.','Removes merged worktrees. Undo brings them back.'],
   now:[()=>['Not watching'],()=>['4','merged','<b>5.7</b> GB'],()=>['4','merged','<b>5.7</b> GB']]},
  {id:'disk',name:'Disk',c:'#F2B544',mode:2,lab:'How often',vals:['daily','weekly','monthly'],v:1,
   rule:['Not watching the disk.','Shows caches and build output that are safe to clean.','Moves safe caches and build output to the Trash.'],
   now:[()=>['Not watching'],s=>['30','GB safe','check '+NEXT[s.v]],s=>['30','GB safe','next '+NEXT[s.v]]]},
  {id:'awake',name:'Keep Awake',c:'#B18CFF',mode:2,lab:'Ends at battery',vals:['10 %','20 %','30 %','never'],v:1,
   rule:['The Mac sleeps as usual.','Asks when an agent starts working.','Keeps the Mac awake while agents work, then lets it sleep.'],
   now:[()=>['Sleeps as usual'],()=>['4','agents working',''],()=>['4','agents working','']]}
];
const $=id=>document.getElementById(id);
const cur=()=>S.find(s=>s.id===sel);

function dot(s){
  return s.mode===2?`background:${s.c};box-shadow:none`:s.mode===1?`background:transparent;box-shadow:inset 0 0 0 1.5px ${s.c}`:'';
}
function renderIdx(){
  $('idx').innerHTML=S.map(s=>`<button class="it${s.id===sel?' sel':''}" role="tab" aria-selected="${s.id===sel}" data-s="${s.id}" id="it-${s.id}">
    <i class="dot" style="${dot(s)}"></i><span class="nm">${s.name}</span><span class="md">${MODES[s.mode]}</span></button>`).join('');
}
function bigHTML(s){
  const n=s.now[s.mode](s);
  return n.length===1 ? `<span class="n">${n[0]}</span>` :
    `<span class="n">${n[0]}</span><span class="u">${n[1]}</span>${n[2]?`<span class="n2">${n[2]}</span>`:''}`;
}
function detHTML(s){
  return `<div class="modes" role="radiogroup" aria-label="${s.name} mode">
      ${MODES.map((m,i)=>`<button role="radio" aria-checked="${i===s.mode}" data-m="${i}">${m}</button>`).join('')}
      <i class="bar" id="bar"></i></div>
    <p class="rule">${s.rule[s.mode]}</p>
    <div class="choose"><div class="lab">${s.lab}</div>
      <div class="opts" role="radiogroup" aria-label="${s.lab}">${s.vals.map((v,i)=>`<button role="radio" aria-checked="${i===s.v}" data-v="${i}">${v}</button>`).join('')}</div></div>
    <div class="now"><div class="lab">Right now</div><div class="big">${bigHTML(s)}</div><p class="ins" id="ins">${INS[s.id](s)}</p></div>
    <div class="gr" id="gr">${GRAPH[s.id](s)}</div>
    <div class="rows${s.id==='awake'?' tight':''}" id="rows" style="--tw:${{apps:64,servers:76,trees:64,disk:58,awake:84}[s.id]}px;${s.id==='awake'?'margin-top:18px':''}">${GRAPH[s.id+'Rows'](s)}</div>`;
}
/* morph: copy attributes/text from a freshly rendered tree so CSS transitions ease the change */
const RM=matchMedia('(prefers-reduced-motion: reduce)');
function tween(el,to){
  const from=parseFloat(el.textContent)||0, d=(String(to).split('.')[1]||'').length;
  if(RM.matches){el.textContent=to;return}
  const t0=performance.now();
  (function f(t){const k=Math.min(1,(t-t0)/600), e=1-Math.pow(1-k,3); el.textContent=(from+(to-from)*e).toFixed(d); if(k<1) requestAnimationFrame(f)})(t0);
}
function morph(a,b){
  if(a.nodeType===3){ if(a.nodeValue!==b.nodeValue) a.nodeValue=b.nodeValue; return }
  if(a.nodeType!==1) return;
  if(a.tagName!==b.tagName||a.childNodes.length!==b.childNodes.length){ a.replaceWith(b.cloneNode(true)); return }
  for(const at of [...b.attributes]) if(a.getAttribute(at.name)!==at.value) a.setAttribute(at.name,at.value);
  for(const at of [...a.attributes]) if(!b.hasAttribute(at.name)) a.removeAttribute(at.name);
  if(a.dataset.tw){ if(a.textContent!==b.textContent) tween(a,parseFloat(b.textContent).toFixed((b.textContent.split('.')[1]||'').length)); return }
  [...a.childNodes].forEach((c,i)=>morph(c,b.childNodes[i]));
}
function morphInto(el,html){
  const t=document.createElement(el.tagName); t.innerHTML=html;
  if(t.childNodes.length!==el.childNodes.length){ el.innerHTML=html; return }
  [...el.childNodes].forEach((c,i)=>morph(c,t.childNodes[i]));
}
function placeBar(instant){
  const s=cur(), b=$('bar'), t=document.querySelector(`.modes button[data-m="${s.mode}"]`);
  if(!b||!t) return;
  if(instant) b.style.transition='none';
  b.style.width=t.offsetWidth+'px'; b.style.transform=`translateX(${t.offsetLeft}px)`;
  b.style.opacity=s.mode?1:.35;
  if(instant){ void b.offsetWidth; b.style.transition='' }
}
function renderDet(animate){
  const s=cur(), d=$('det'), inn=$('in');
  d.style.setProperty('--c',s.c);
  const fill=()=>{ inn.innerHTML=detHTML(s); d.classList.toggle('off',!s.mode); placeBar(true) };
  if(!animate){ fill(); return }
  inn.classList.add('swap');
  setTimeout(()=>{ fill(); requestAnimationFrame(()=>inn.classList.remove('swap')) },170);
}
function updateDetInPlace(){
  const s=cur(), d=$('det');
  d.classList.toggle('off',!s.mode);
  document.querySelectorAll('.modes button').forEach(b=>b.setAttribute('aria-checked',String(+b.dataset.m===s.mode)));
  document.querySelectorAll('.opts button').forEach(b=>b.setAttribute('aria-checked',String(+b.dataset.v===s.v)));
  document.querySelector('.rule').textContent=s.rule[s.mode];
  document.querySelector('.big').innerHTML=bigHTML(s);
  $('ins').innerHTML=INS[s.id](s);
  morphInto($('gr'),GRAPH[s.id](s));
  morphInto($('rows'),GRAPH[s.id+'Rows'](s));
  placeBar(false);
}
function renderToday(){
  $('today').innerHTML = undone
   ? `<span class="lbl">Today</span><span class="txt">Reopened 2 apps and started 3 servers again</span><button class="undo" id="redo">Redo</button>`
   : `<span class="lbl">Today</span><span class="txt">Closed <b>2 apps</b>, stopped <b>3 servers</b></span><button class="undo" id="undo">Undo</button>`;
  if(sel==='apps'||sel==='servers') document.querySelector('.big').innerHTML=bigHTML(cur());
}
function renderIcons(){
  const one=$('one').getAttribute('aria-checked')==='true', box=$('icons');
  if(!box.querySelector('.mi')) box.insertAdjacentHTML('beforeend',S.map(s=>`<span class="mi" id="mi-${s.id}" data-s="${s.id}" title="${s.name}">${gl(s.id,'#fff',16)}</span>`).join('')+`<span class="mi off" id="mi-one" title="MinMacs">${gl('one','#fff',16)}</span>`);
  S.forEach(s=>$('mi-'+s.id).classList.toggle('off',one||s.mode===0));
  $('mi-one').classList.toggle('off',!one);
  setTimeout(aim,420); aim();
}
function anchor(){
  const one=$('one').getAttribute('aria-checked')==='true';
  if(one) return $('mi-one');
  const s=cur(); if(s.mode) return $('mi-'+s.id);
  return [...document.querySelectorAll('.mi:not(.off)')][0]||null;
}
function aim(){
  const a=anchor(), hl=$('hl'), box=$('icons');
  if(!a){ hl.style.opacity=0; return }
  const x=a.offsetLeft+8;
  hl.style.opacity=1; hl.style.transform=`translateX(${x-14}px)`;
  const st=$('stage'), k=st.getBoundingClientRect().width/1280;
  const bx=(box.getBoundingClientRect().left-st.getBoundingClientRect().left)/k;
  $('nub').style.transform=`translateX(${bx+x-$('sheet').offsetLeft-1}px)`;
}
function select(id){
  if(id===sel) return; sel=id;
  document.querySelectorAll('.it').forEach(e=>{const on=e.dataset.s===id; e.classList.toggle('sel',on); e.setAttribute('aria-selected',on)});
  renderDet(true); aim();
}
function setMode(m){
  const s=cur(); if(s.mode===m) return; s.mode=m;
  const it=$('it-'+s.id); it.querySelector('.dot').setAttribute('style',dot(s)); it.querySelector('.md').textContent=MODES[m];
  updateDetInPlace(); renderIcons();
}

document.addEventListener('click',e=>{
  const it=e.target.closest('.it'); if(it){ select(it.dataset.s); return }
  const mb=e.target.closest('.modes button'); if(mb){ setMode(+mb.dataset.m); return }
  const ob=e.target.closest('.opts button'); if(ob){ cur().v=+ob.dataset.v; updateDetInPlace(); return }
  const mi=e.target.closest('.mi'); if(mi&&mi.dataset.s){ select(mi.dataset.s); return }
  if(e.target.closest('#undo')){undone=true;renderToday();return}
  if(e.target.closest('#redo')){undone=false;renderToday();return}
  const sw=e.target.closest('.sw'); if(sw){ sw.setAttribute('aria-checked',String(sw.getAttribute('aria-checked')!=='true')); renderIcons() }
});
document.addEventListener('keydown',e=>{
  const it=e.target.closest&&e.target.closest('.it'); if(!it) return;
  const i=S.findIndex(s=>s.id===it.dataset.s);
  const j = e.key==='ArrowDown'?Math.min(4,i+1): e.key==='ArrowUp'?Math.max(0,i-1): -1;
  if(j<0) return; e.preventDefault(); select(S[j].id); $('it-'+S[j].id).focus();
});

function fit(){const st=$('stage'),k=Math.min(innerWidth/1280,innerHeight/800);st.style.transform=`translate(${(innerWidth-1280*k)/2}px,${(innerHeight-800*k)/2}px) scale(${k})`;aim()}
addEventListener('resize',fit);
renderIdx(); renderDet(false); renderToday(); renderIcons(); fit();
document.fonts&&document.fonts.ready.then(()=>{placeBar(true);aim()});
</script>
</body>
