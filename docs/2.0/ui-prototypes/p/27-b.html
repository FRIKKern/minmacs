<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Plan Tray</title>
<style>
:root{
  --glass:rgba(28,29,38,.88);
  --line:rgba(255,255,255,.06);
  --tx:rgba(255,255,255,.94);
  --tx2:rgba(235,235,245,.58);
  --tx3:rgba(235,235,245,.3);
  --g1:rgba(255,255,255,.07);
  --g2:rgba(255,255,255,.2);
  --g3:rgba(255,255,255,.42);
  --ease:cubic-bezier(.3,.7,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#1a1636}
body{font-family:-apple-system,"SF Pro Text",system-ui,sans-serif;color:var(--tx);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;font-size:13px;cursor:default;user-select:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;text-align:left}
b{font-weight:500}
:focus{outline:none}
:focus-visible{outline:2px solid rgba(255,255,255,.55);outline-offset:3px;border-radius:8px}
#stage{position:absolute;left:0;top:0;width:1280px;height:800px;transform-origin:0 0;overflow:hidden;
  background:
   radial-gradient(760px 560px at 10% 6%,#4b3c9e 0%,rgba(75,60,158,0) 70%),
   radial-gradient(700px 520px at 84% 2%,#22618f 0%,rgba(34,97,143,0) 70%),
   radial-gradient(820px 620px at 88% 104%,#a0436f 0%,rgba(160,67,111,0) 70%),
   radial-gradient(640px 520px at 18% 100%,#3a2463 0%,rgba(58,36,99,0) 75%),
   #1d1a3c}

/* menu bar */
.mb{position:absolute;left:0;right:0;top:0;height:26px;display:flex;align-items:center;justify-content:space-between;padding:0 12px 0 16px;background:rgba(18,14,40,.32);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);font-size:13px;color:rgba(255,255,255,.92);z-index:5}
.mb-l,.mb-r{display:flex;align-items:center;gap:18px}
.mb-l b{font-weight:700}
.mb-r{gap:14px}
.icons{position:relative;display:flex;align-items:center;gap:12px}
.hl{position:absolute;top:-3px;height:22px;width:28px;border-radius:6px;background:rgba(255,255,255,.2);transition:transform .45s var(--ease),opacity .3s;pointer-events:none}
.mi{position:relative;display:flex;width:16px;overflow:hidden;cursor:pointer;transition:width .4s var(--ease),opacity .3s,margin .4s var(--ease)}
.mi.off{width:0;opacity:0;margin-left:-12px}

/* sheet */
.sheet{position:absolute;top:34px;left:340px;width:900px;background:var(--glass);backdrop-filter:blur(36px) saturate(1.5);-webkit-backdrop-filter:blur(36px) saturate(1.5);border:1px solid rgba(255,255,255,.085);border-radius:22px;box-shadow:0 34px 100px rgba(6,4,24,.5),inset 0 1px 0 rgba(255,255,255,.035);animation:drop .6s var(--ease) both}
@keyframes drop{from{opacity:0;transform:translateY(-10px)}}
.nub{position:absolute;top:-8px;left:0;width:18px;height:8px;margin-left:-9px;transition:transform .45s var(--ease)}
.nub svg{display:block}

.head{display:flex;align-items:center;gap:12px;height:48px;padding:0 30px;white-space:nowrap}
.head .lbl{font-size:12px;color:var(--tx3)}
.head .txt{font-size:13px;color:var(--tx2)}
.head .txt b{color:var(--tx)}
.head .undo{margin-left:auto;font-size:13px;font-weight:500;padding:4px 12px;border-radius:12px;background:rgba(255,255,255,.07);transition:background .2s}
.head .undo:hover{background:rgba(255,255,255,.13)}

.body{display:grid;grid-template-columns:310px 1fr;column-gap:34px;padding:2px 30px 14px;height:604px}

/* ---------- left: live index ---------- */
.idx{display:flex;flex-direction:column}
.leg{font-size:11px;color:var(--tx3);height:22px;line-height:14px;white-space:nowrap;display:flex;justify-content:flex-end;align-items:flex-start;gap:6px}
.leg i{display:inline-block;width:12px;height:5px;border-radius:3px;margin-top:5px;background:linear-gradient(90deg,#FF7A8A,#5B9BFF 22%,#3FD0B8 42%,#4CC96B 60%,#F2B544 80%,#B18CFF)}
.it{display:flex;align-items:center;gap:10px;height:82px;border-radius:14px}
.it .dot{flex:none;width:9px;height:9px;border-radius:50%;box-shadow:inset 0 0 0 1.5px rgba(235,235,245,.28);transition:background .35s,box-shadow .35s}
.it .nm{flex:1;min-width:0;font-size:24px;font-weight:600;letter-spacing:-.022em;color:rgba(235,235,245,.36);transition:color .3s;white-space:nowrap}
.it:hover .nm{color:var(--tx2)}
.it.sel .nm{color:var(--tx)}
.mg{flex:none;position:relative;width:52px;height:24px;display:flex;align-items:flex-end;justify-content:space-between;transition:opacity .4s,filter .4s}
.it.m0 .mg{opacity:.28;filter:grayscale(1)}
.mg i{display:block;transition:height .55s var(--ease),width .55s var(--ease),left .55s var(--ease),background .35s,opacity .35s,box-shadow .35s}
.mg .tr{position:absolute;left:0;right:0;top:9px;height:6px;border-radius:3px;background:var(--g1)}
.mg .tr i{position:absolute;top:0;bottom:0;border-radius:3px}
.mg .tr .tk{top:-4px;bottom:-4px;width:2px;margin-left:-1px;border-radius:1px;background:#fff}
.mg.mc i{flex:none;border-radius:2px}
.mg.dots{flex-wrap:wrap;align-content:center;justify-content:space-between;row-gap:4px}
.mg.dots i{width:6px;height:6px;border-radius:50%}
.mg.ring{justify-content:flex-end;align-items:center}
.nb{flex:none;width:80px;display:flex;flex-direction:column;align-items:flex-end;white-space:nowrap}
.nb .n{font-size:16px;font-weight:500;line-height:19px;color:var(--tx2);transition:color .3s}
.nb .n u{text-decoration:none;font-size:11px;font-weight:400;color:var(--tx3);margin-left:3px}
.nb .cp{font-size:11px;line-height:15px;color:var(--tx3);transition:color .3s}
.it.sel .nb .n{color:var(--tx)}
.it.m0 .nb .n{color:var(--tx3);font-weight:400;font-size:13px}
.it .pk{color:var(--c)}
.ihint{margin-top:auto;padding:0 0 2px 21px;font-size:11.5px;line-height:17px;color:var(--tx3)}
.ihint b{color:var(--tx2);font-weight:500}

/* ---------- right pane ---------- */
.det{position:relative;min-width:0}
.det .in{transition:opacity .22s,transform .35s var(--ease)}
.det .in.swap{opacity:0;transform:translateY(6px)}
.lab{display:flex;align-items:center;height:16px;font-size:12px;color:var(--tx3);white-space:nowrap}
.big{display:flex;align-items:baseline;gap:6px;white-space:nowrap;height:44px;margin-top:2px}
.big .n{font-size:40px;font-weight:500;letter-spacing:-.02em;line-height:44px}
.big .u{font-size:15px;color:var(--tx2)}
.big .n2{margin-left:auto;font-size:13px;color:var(--tx2)}
.big .n2 b{color:var(--tx)}
.say{margin-top:2px;font-size:14px;line-height:20px;color:var(--tx2);min-height:40px}
.say b{color:var(--tx)}
.gr{margin-top:10px;transition:opacity .4s,filter .4s}
.det.off .gr,.det.off .rows .ic{filter:grayscale(1);opacity:.45}
.mt+.mt{margin-top:8px}
.mt .hd{display:flex;align-items:baseline;justify-content:space-between;height:16px;font-size:12px;color:var(--tx3);white-space:nowrap}
.mt .hd b{color:var(--tx)}
.mt .hd span:last-child{color:var(--tx2)}
.tb{position:relative;height:6px;margin-top:6px;border-radius:3px;background:var(--g1)}
.tb i{position:absolute;top:0;bottom:0;border-radius:3px;transition:left .55s var(--ease),width .55s var(--ease),background .35s}
.tb .tk{top:-4px;bottom:-4px;width:2px;margin-left:-1px;border-radius:1px;background:#fff}
.tb.seg{display:flex;gap:2px;background:none}
.tb.seg i{position:static;flex-basis:0;transition:flex-grow .55s var(--ease),background .35s,box-shadow .35s,margin .55s var(--ease)}
.tl{position:relative;height:13px;font-size:10.5px;color:var(--tx3)}
.tl span{position:absolute;top:2px;transform:translateX(-50%);white-space:nowrap;transition:left .55s var(--ease)}
.cols{display:flex;align-items:flex-end;gap:5px;height:50px}
.cols .cl{flex:1;position:relative;height:100%;border-radius:4px;background:rgba(255,255,255,.04);transition:flex-grow .55s var(--ease),opacity .4s}
.cols .cl i{position:absolute;left:0;right:0;bottom:0;border-radius:4px;transition:height .55s var(--ease),background .35s,box-shadow .35s,opacity .35s}
.cleg{display:flex;gap:11px;margin-top:7px;font-size:11px;color:var(--tx3);white-space:nowrap}
.cleg span{display:flex;align-items:center;gap:5px}
.cleg i{width:8px;height:8px;border-radius:2px}

/* list head: key + section actions */
.lh{display:flex;align-items:center;gap:10px;height:34px;margin-top:12px;white-space:nowrap}
.lh .key{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--tx3);transition:opacity .3s}
.lh .key b{color:var(--tx2);font-weight:400}
.lh .mk{display:inline-block;width:7px;height:7px;border-radius:50%}
.lh .sp{flex:1}
.sa{display:flex;align-items:center;gap:6px;height:28px;padding:0 13px;border-radius:14px;background:rgba(255,255,255,.07);font-size:13px;font-weight:500;transition:background .2s,opacity .3s,box-shadow .25s}
.sa:hover{background:rgba(255,255,255,.12);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c) 55%,transparent)}
.sa .t{font-weight:400;color:var(--tx3)}
.big .sa.sm{display:inline-flex;height:24px;padding:0 10px;margin-left:12px;font-size:12px;vertical-align:1px;color:var(--tx)}
.sa .gl{display:flex}
.sa[disabled]{opacity:.38;cursor:default}
.sa[disabled]:hover{background:rgba(255,255,255,.07);box-shadow:none}

/* rows */
.rows{margin-top:2px}
.rw{position:relative;display:flex;align-items:center;gap:7px;height:30px;margin:0 -8px;padding:0 8px;border-radius:9px;font-size:13px;white-space:nowrap;overflow:hidden;cursor:pointer;transition:height .45s var(--ease),opacity .35s,transform .45s var(--ease),background .25s}
.rw:hover{background:rgba(255,255,255,.045)}
.rw.sel{background:color-mix(in srgb,var(--c) 12%,transparent)}
.rw.sel:hover{background:color-mix(in srgb,var(--c) 16%,transparent)}
.rw.pv{background:color-mix(in srgb,var(--c) 17%,transparent)}
.rw.skip{opacity:.42}
.rw.gone{height:0;opacity:0;transform:translateX(16px);pointer-events:none}
.rw.flash{animation:flash 1.4s var(--ease)}
@keyframes flash{0%,30%{background:color-mix(in srgb,var(--c) 26%,transparent)}100%{background:transparent}}
.ck{flex:none;position:relative;width:16px;height:16px}
.ck .mk{position:absolute;left:4.5px;top:4.5px;width:7px;height:7px;border-radius:50%;transition:background .35s,box-shadow .35s,opacity .25s,transform .25s}
.mk.a{background:var(--c)}
.mk.s{box-shadow:inset 0 0 0 1.5px var(--c)}
.mk.n{opacity:0}
.ck .rg{position:absolute;inset:0;display:flex;border-radius:50%;background:rgba(255,255,255,.06);box-shadow:inset 0 0 0 1.5px rgba(235,235,245,.3);opacity:0;transform:scale(.55);transition:opacity .22s,transform .3s var(--ease),background .2s,box-shadow .2s}
.ck .rg svg{opacity:0;transition:opacity .2s}
.rw:hover .ck .rg,.picking .ck .rg,.rw.pv .ck .rg{opacity:1;transform:none}
.rw:hover .ck .mk,.picking .ck .mk,.rw.pv .ck .mk,.rw.sel .ck .mk{opacity:0;transform:scale(.4)}
.rw.pv:not(.sel) .ck .rg{box-shadow:inset 0 0 0 1.5px var(--c);background:color-mix(in srgb,var(--c) 28%,transparent)}
.rw.sel .ck .rg{opacity:1;transform:none;background:var(--c);box-shadow:none}
.rw.sel .ck .rg svg{opacity:1}
.rw .ic{flex:none;display:flex;width:18px;justify-content:center;transition:opacity .4s,filter .4s}
.rw .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.rw .nm .x{color:var(--tx3)}
.rw.dim .nm{color:var(--tx2)}
.rw .v{flex:none;width:54px;text-align:right;color:var(--tx2)}
.rw .v2{flex:none;width:32px;text-align:right;color:var(--tx3)}
.zn{flex:none;position:relative;height:26px;width:var(--zw,214px)}
.zn .st{position:absolute;inset:0;display:flex;align-items:center;justify-content:flex-end;gap:10px;color:var(--tx3);transition:opacity .2s,transform .3s var(--ease)}
.zn .st .s{transition:color .35s}
.rw.on .zn .st .s{color:var(--c)}
.zn .vbs{position:absolute;inset:0;display:flex;align-items:center;justify-content:flex-end;gap:5px;opacity:0;transform:translateX(8px);pointer-events:none;transition:opacity .2s,transform .3s var(--ease)}
.rw:hover .zn .st{opacity:0;transform:translateX(-6px)}
.rw:hover .zn .vbs{opacity:1;transform:none;pointer-events:auto}
.vbtn{height:24px;padding:0 9px;border-radius:8px;background:rgba(255,255,255,.08);font-size:12px;line-height:24px;color:var(--tx);white-space:nowrap;transition:background .15s}
.vbtn:hover{background:rgba(255,255,255,.15)}
.vbtn.p{color:var(--c);font-weight:500}
.vbtn.x{opacity:.36;cursor:default}
.vbtn.x:hover{background:rgba(255,255,255,.08)}
.why{font-size:12px;color:var(--tx3);margin-right:3px}
.ag{display:inline-flex;align-items:center;gap:5px;color:var(--tx2);border-radius:6px;padding:1px 5px;margin:0 -5px;transition:background .15s,color .15s}
.ag:hover{background:rgba(255,255,255,.09);color:var(--tx)}
.ag svg{flex:none}
.ag.no{color:var(--tx3);pointer-events:none}
.hm{display:inline-flex;align-items:center;gap:3px;font-style:normal;font-size:11.5px;color:var(--tx3)}
.hm svg{display:block}
.hms{display:flex;align-items:center;gap:9px}
.more{height:22px;padding-left:24px;font-size:12px;line-height:22px;color:var(--tx3);white-space:nowrap}

/* settings */
.set{margin-top:10px;padding-top:6px;border-top:1px solid var(--line)}
.modes{position:relative;display:flex;gap:24px;height:40px;align-items:flex-start;margin-top:4px}
.modes button{font-size:28px;font-weight:600;letter-spacing:-.02em;line-height:34px;color:var(--tx3);transition:color .3s}
.modes button:hover{color:var(--tx2)}
.modes button[aria-checked="true"]{color:var(--tx)}
.bar{position:absolute;left:0;top:37px;height:2px;border-radius:1px;background:var(--c);transition:transform .45s var(--ease),width .45s var(--ease),background .35s,opacity .3s}
.rule{margin-top:4px;font-size:14px;line-height:20px;color:var(--tx2)}
.opts{display:flex;gap:18px;height:24px;margin-top:6px;align-items:flex-start;white-space:nowrap;transition:opacity .3s}
.opts button{position:relative;font-size:15px;color:var(--tx3);line-height:20px;transition:color .25s}
.opts button:hover{color:var(--tx2)}
.opts button[aria-checked="true"]{color:var(--tx);font-weight:500}
.opts button[aria-checked="true"]::after{content:"";position:absolute;left:50%;bottom:-5px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--c)}
.det.off .opts{opacity:.3;pointer-events:none}
.det.off .big .n{font-size:22px;color:var(--tx3)}

/* foot + action bar */
.foot{position:relative;height:58px;border-top:1px solid var(--line);border-radius:0 0 22px 22px;overflow:hidden}
.fbase{display:flex;align-items:center;gap:28px;height:100%;padding:0 30px;transition:opacity .3s,transform .4s var(--ease)}
.foot.up .fbase{opacity:0;transform:translateY(-10px);pointer-events:none}
.sw{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--tx2);transition:color .2s}
.sw i{width:32px;height:19px;border-radius:10px;background:rgba(255,255,255,.14);position:relative;transition:background .25s;flex:none}
.sw i::after{content:"";position:absolute;left:2px;top:2px;width:15px;height:15px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .25s var(--ease)}
.sw[aria-checked="true"]{color:var(--tx)}
.sw[aria-checked="true"] i{background:#5B9BFF}
.sw[aria-checked="true"] i::after{transform:translateX(13px)}
.fbase .hint{margin-left:auto;font-size:11px;color:var(--tx3)}
.abar{position:absolute;inset:0;display:flex;align-items:center;gap:8px;padding:0 14px 0 20px;background:rgba(255,255,255,.035);transform:translateY(100%);transition:transform .42s var(--ease);white-space:nowrap}
.foot.up .abar{transform:none}
.abar .clr{flex:none;display:flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.07);transition:background .15s}
.abar .clr:hover{background:rgba(255,255,255,.14)}
.abar .who{display:flex;align-items:center;gap:8px;min-width:0;margin-left:4px}
.abar .who .ct{font-size:14px;font-weight:600}
.abar .who .cs{font-size:12px;color:var(--tx3);overflow:hidden;text-overflow:ellipsis}
.abar .grow{flex:1}
.abar .note{font-size:12px;color:var(--tx3);overflow:hidden;text-overflow:ellipsis;min-width:0}
.bb{flex:none;height:32px;padding:0 12px;border-radius:10px;background:rgba(255,255,255,.08);font-size:13px;transition:background .15s,opacity .2s}
.bb:hover{background:rgba(255,255,255,.15)}
.bb.x{opacity:.36;cursor:default}
.bp{flex:none;height:34px;padding:0 15px;border-radius:11px;background:var(--c);color:#12131b;font-size:13.5px;font-weight:600;transition:filter .15s,background .35s,transform .15s}
.bp:hover{filter:brightness(1.08)}
.bp:active{transform:scale(.98)}
.bp .t{font-weight:500;opacity:.62;margin-left:4px}
.bp.x{opacity:.4;cursor:default;filter:grayscale(.6)}

/* toast */
.toast{position:absolute;left:50%;top:calc(100% + 12px);display:flex;align-items:center;gap:14px;height:38px;padding:0 6px 0 16px;border-radius:13px;background:rgba(28,29,38,.9);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);border:1px solid rgba(255,255,255,.08);box-shadow:0 14px 40px rgba(6,4,24,.4);font-size:13px;color:var(--tx2);white-space:nowrap;opacity:0;transform:translate(-50%,-8px);pointer-events:none;transition:opacity .35s,transform .45s var(--ease)}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast b{color:var(--tx)}
.toast .tb2{height:28px;padding:0 12px;border-radius:9px;background:rgba(255,255,255,.08);font-weight:500;color:var(--tx);transition:background .15s}
.toast .tb2:hover{background:rgba(255,255,255,.15)}
.toast .tb2.nobtn{display:none}

/* tray (variant b) */
.tray .abar{padding-left:20px}
.chips{display:flex;align-items:center;gap:6px;min-width:0;overflow:hidden}
.chip{flex:none;max-width:170px;display:flex;align-items:center;gap:6px;height:28px;padding:0 4px 0 10px;border-radius:14px;background:rgba(255,255,255,.07);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;cursor:pointer;transition:background .15s,opacity .3s}
.chip:hover{background:rgba(255,255,255,.12)}
.chip i.d{width:7px;height:7px;border-radius:50%;background:var(--cc)}
.chip .xx{display:flex;width:20px;height:20px;border-radius:50%;align-items:center;justify-content:center;opacity:.5;transition:opacity .15s,background .15s}
.chip .xx:hover{opacity:1;background:rgba(255,255,255,.12)}
.chip.more2{padding:0 10px;color:var(--tx2)}
.chip.sug{background:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.16);color:var(--tx2);padding:0 10px 0 8px}
.chip.sug:hover{box-shadow:inset 0 0 0 1px var(--cc);color:var(--tx)}
.chip.sug .pl{color:var(--cc);font-weight:600}
.chip.sug .t{color:var(--tx3)}
.plab{flex:none;font-size:12px;color:var(--tx3);margin:0 4px 0 6px}
.plan{position:absolute;right:14px;bottom:66px;width:386px;padding:14px 16px 12px;border-radius:16px;background:#23242f;border:1px solid rgba(255,255,255,.09);box-shadow:0 24px 60px rgba(6,4,24,.5);opacity:0;transform:translateY(8px);pointer-events:none;transition:opacity .25s,transform .35s var(--ease);z-index:4}
.plan.show{opacity:1;transform:none;pointer-events:auto}
.plan .ph{display:flex;justify-content:space-between;font-size:12px;color:var(--tx3);margin-bottom:6px}
.plan .ph b{color:var(--tx)}
.pst{display:flex;align-items:center;gap:8px;height:26px;font-size:13px;white-space:nowrap}
.pst .d{flex:none;width:7px;height:7px;border-radius:50%;background:var(--cc)}
.pst .vv{flex:none;font-weight:500}
.pst .ww{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;color:var(--tx2)}
.pst .ss{flex:none;color:var(--tx2)}
.pst.sk .vv,.pst.sk .ww{color:var(--tx3);font-weight:400}
.pst.sk .ss{color:var(--tx3)}
.plan .pf{margin-top:8px;padding-top:8px;border-top:1px solid var(--line);font-size:12px;color:var(--tx3)}
.plan .pf b{color:var(--tx)}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important}}
</style>

  }

  steps.forEach(x=>{if(x.v.kind==='nav')return; if(apply(x.i,x.v.k)==='refused') refused=x.i});

/* ---------- morph ---------- */
function morph(a,b){
  if(a.nodeType!==b.nodeType||a.nodeName!==b.nodeName){a.replaceWith(b.cloneNode(true));return}
  if(a.nodeType===3){if(a.nodeValue!==b.nodeValue)a.nodeValue=b.nodeValue;return}
  if(a.nodeType!==1)return;
  if(a.hasAttribute('data-keep'))return;
  for(const at of [...b.attributes]) if(a.getAttribute(at.name)!==at.value) a.setAttribute(at.name,at.value);
  for(const at of [...a.attributes]) if(!b.hasAttribute(at.name)) a.removeAttribute(at.name);
  const ac=[...a.childNodes], bc=[...b.childNodes];
  if(ac.length!==bc.length){a.replaceChildren(...bc.map(n=>n.cloneNode(true)));return}
  ac.forEach((n,i)=>morph(n,bc[i]));
}
function patch(el,html){const t=document.createElement(el.tagName);t.innerHTML=html;
  if(!el.childNodes.length){el.innerHTML=html;return}
  const ac=[...el.childNodes], bc=[...t.childNodes];
  if(ac.length!==bc.length){el.innerHTML=html;return}
  ac.forEach((n,i)=>morph(n,bc[i]));
}

      el._raf=requestAnimationFrame(step);
    } else if(el._raf==null) el.textContent=fv(nv,f);
    el._v=nv;
  });
}

  if(p[0]==='bar'){const M=barModel([...picked]); const e=M.all.find(x=>x.k===p[1]); if(!e) return [null,null];
    return [new Set(e.el.map(x=>pk(x.ctx,x.i.id))),new Set(e.bl.map(x=>pk(x.ctx,x.i.id)))]}
  if(p[0]==='row'){return [new Set([p[1]+':'+p[2]]),null]}
  if(p[0]==='plan'){const st=planSteps(); return [new Set(st.filter(x=>!x.v.blk).map(x=>pk(x.ctx,x.i.id))),new Set(st.filter(x=>x.v.blk).map(x=>pk(x.ctx,x.i.id)))]}
  if(p[0]==='add'){return [new Set([p[1]+':'+p[2]]),null]}
  return [null,null];
}
let pvTag=null;
document.addEventListener('mouseover',e=>{
  const el=e.target.closest('[data-pv]'); const tag=el?el.dataset.pv:null;
  if(TRAY){const onPlan=e.target.closest('[data-plan]')||e.target.closest('#plan.show'); $('plan').classList.toggle('show',!!onPlan&&picked.size>0)}
  if(tag===pvTag) return; pvTag=tag;
  if(tag&&tag.startsWith('row:')){pv=null;pvSkip=null;return}
  [pv,pvSkip]=pvFor(tag); renderIdx(); updateDet();
});
function runSA(ctx,k){
  const a=k==='restore'?{direct:1}:SA[ctx].find(x=>x.k===k);
  if(a.direct){const sn=snap();G0.restored=true;stack.push(sn);toast('Restored <b>2 apps</b> and <b>14 tabs</b> from 11:05','Undo',undo);draw();return}
  const ids=a.ids(); if(!ids.length) return;
  if(!TRAY) picked.clear();
  ids.forEach(i=>picked.add(pk(ctx,i.id)));
  anchor=pk(ctx,ids[ids.length-1].id);
  pv=null;pvTag=null; draw();
}
function runBar(k){
  const M=barModel([...picked]); const e=M.all.find(x=>x.k===k); if(!e||!e.el.length) return;
  pv=null;pvSkip=null;pvTag=null;
  run(e.el);
}
function runPlan(){
  const steps=planSteps().filter(x=>!x.v.blk); if(!steps.length) return;
  const n=steps.length, tabs=new Set(steps.map(x=>x.ctx)).size;
  pv=null;pvSkip=null;pvTag=null;$('plan').classList.remove('show');
  run(steps,`Ran the plan: <b>${n} ${n===1?'step':'steps'}</b> in ${tabs} ${tabs===1?'tab':'tabs'}`);
}
function goAgent(id){
  const k=pk('agents',id); flashK=k; select('agents'); if(sel==='agents') updateDet();
  setTimeout(()=>{flashK=null},1500);
}
document.addEventListener('click',e=>{
  const t=e.target;
  const ag=t.closest('[data-go]'); if(ag){e.stopPropagation();goAgent(ag.dataset.go);return}
  const vb=t.closest('.vbtn'); if(vb){const rw=vb.closest('.rw'); if(vb.classList.contains('x')) return;
    const {ctx,i}=unpk(rw.dataset.k); const v=verbs(i,ctx).find(x=>x.k===vb.dataset.act);
    if(v.k==='agent'){goAgent(i.ag);return}
    pvTag=null; run([{i,ctx,v}]); return}
  const rw=t.closest('.rw'); if(rw){toggleRow(rw.dataset.k,e.shiftKey);return}
  const sa=t.closest('.sa'); if(sa){if(sa.disabled) return; const [c,k]=sa.dataset.sa.split(':'); runSA(c,k); return}
  if(t.closest('[data-clear]')){clearPick();draw();return}
  const un=t.closest('[data-unpick]'); if(un){e.stopPropagation();un.dataset.unpick.split(',').forEach(k=>picked.delete(k));pvTag=null;pv=null;draw();return}
  const ad=t.closest('[data-add]'); if(ad){picked.add(ad.dataset.add);pvTag=null;pv=null;draw();return}
  const jm=t.closest('[data-jump]'); if(jm){const {ctx}=unpk(jm.dataset.jump); flashK=jm.dataset.jump; if(ctx===sel) updateDet(); else select(ctx); setTimeout(()=>{flashK=null},1500); return}
  const rb=t.closest('[data-run]'); if(rb){runBar(rb.dataset.run);return}
  if(t.closest('[data-plan]')){runPlan();return}
  const it=t.closest('.it'); if(it){select(it.dataset.s);return}
  const mb=t.closest('.modes button'); if(mb){setMode(+mb.dataset.m);return}
  const ob=t.closest('.opts button'); if(ob){cur().v=+ob.dataset.v;draw();return}
  const mi=t.closest('.mi'); if(mi&&mi.dataset.s){select(mi.dataset.s);return}
  if(t.closest('#undo')){undone=true;renderToday();return}
  if(t.closest('#redo')){undone=false;renderToday();return}
  const sw=t.closest('.sw'); if(sw){sw.setAttribute('aria-checked',String(sw.getAttribute('aria-checked')!=='true'));renderIcons()}
});
document.addEventListener('mousedown',e=>{if(e.shiftKey&&e.target.closest('.rw'))e.preventDefault()});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&picked.size){clearPick();draw();return}
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='z'){e.preventDefault();undo();return}
  if(e.key==='Enter'&&picked.size&&!e.target.closest('button')){e.preventDefault();if(TRAY)runPlan();else{const M=barModel([...picked]);M.primary&&runBar(M.primary.k)}return}
  const it=e.target.closest&&e.target.closest('.it'); if(!it) return;
  const i=S.findIndex(s=>s.id===it.dataset.s);
  const j=e.key==='ArrowDown'?Math.min(S.length-1,i+1):e.key==='ArrowUp'?Math.max(0,i-1):-1;
  if(j<0) return; e.preventDefault(); select(S[j].id); $('it-'+S[j].id).focus();
});

function fit(){const st=$('stage'),k=Math.min(innerWidth/1280,innerHeight/800);st.style.transform=`translate(${(innerWidth-1280*k)/2}px,${(innerHeight-800*k)/2}px) scale(${k})`;aim()}
addEventListener('resize',fit);
renderIdx(); renderDet(false); renderToday(); renderIcons(); renderBar(); fit(); tweens();
document.fonts&&document.fonts.ready.then(()=>{placeBar(true);aim()});
</script>
</body>
