<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Goes or Stays</title>
<style>
:root{
  --glass:rgba(28,29,38,.88);
  --line:rgba(255,255,255,.06);
  --tx:rgba(255,255,255,.94);
  --tx2:rgba(235,235,245,.58);
  --tx3:rgba(235,235,245,.3);
  --g1:rgba(255,255,255,.07);
  --g2:rgba(255,255,255,.2);
  --g3:rgba(255,255,255,.42);
  --ag:#FF86A8;
  --ease:cubic-bezier(.3,.7,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#1a1636}
body{font-family:-apple-system,"SF Pro Text",system-ui,sans-serif;color:var(--tx);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;font-size:13px;cursor:default;user-select:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;text-align:left}
b{font-weight:500}
:focus{outline:none}
:focus-visible{outline:2px solid rgba(255,255,255,.55);outline-offset:3px;border-radius:8px}
#stage{position:absolute;left:0;top:0;width:1280px;height:800px;transform-origin:0 0;overflow:hidden;
  background:
   radial-gradient(760px 560px at 10% 6%,#4b3c9e 0%,rgba(75,60,158,0) 70%),
   radial-gradient(700px 520px at 84% 2%,#22618f 0%,rgba(34,97,143,0) 70%),
   radial-gradient(820px 620px at 88% 104%,#a0436f 0%,rgba(160,67,111,0) 70%),
   radial-gradient(640px 520px at 18% 100%,#3a2463 0%,rgba(58,36,99,0) 75%),
   #1d1a3c}
.mb{position:absolute;left:0;right:0;top:0;height:26px;display:flex;align-items:center;justify-content:space-between;padding:0 12px 0 16px;background:rgba(18,14,40,.32);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);font-size:13px;color:rgba(255,255,255,.92);z-index:5}
.mb-l,.mb-r{display:flex;align-items:center;gap:18px}
.mb-l b{font-weight:700}
.mb-r{gap:14px}
.icons{position:relative;display:flex;align-items:center;gap:12px}
.hl{position:absolute;top:-3px;height:22px;width:28px;border-radius:6px;background:rgba(255,255,255,.2);transition:transform .45s var(--ease),opacity .3s;pointer-events:none}
.mi{position:relative;display:flex;width:16px;overflow:hidden;cursor:pointer;transition:width .4s var(--ease),opacity .3s,margin .4s var(--ease)}
.mi.off{width:0;opacity:0;margin-left:-12px}

.sheet{position:absolute;top:34px;left:400px;width:840px;background:var(--glass);backdrop-filter:blur(36px) saturate(1.5);-webkit-backdrop-filter:blur(36px) saturate(1.5);border:1px solid rgba(255,255,255,.085);border-radius:22px;box-shadow:0 34px 100px rgba(6,4,24,.5),inset 0 1px 0 rgba(255,255,255,.035);animation:drop .6s var(--ease) both}
@keyframes drop{from{opacity:0;transform:translateY(-10px)}}
.nub{position:absolute;top:-8px;left:0;width:18px;height:8px;margin-left:-9px;transition:transform .45s var(--ease)}
.nub svg{display:block}
.head{display:flex;align-items:center;gap:12px;height:50px;padding:0 30px;white-space:nowrap}
.head .lbl{font-size:12px;color:var(--tx3)}
.head .txt{font-size:13px;color:var(--tx2)}
.head .txt b{color:var(--tx)}
.head .fr{margin-left:auto;font-size:12px;color:var(--tx3)}
.head .fr b{color:var(--tx2)}
.body{display:grid;padding:2px 30px 18px;height:612px}

/* live index */
.idx{display:flex;flex-direction:column;min-width:0}
.leg{font-size:11px;color:var(--tx3);height:20px;line-height:14px;white-space:nowrap;display:flex;align-items:flex-start;gap:6px}
.leg i{display:inline-block;width:12px;height:5px;border-radius:3px;margin-top:5px;background:linear-gradient(90deg,#FF86A8,#5B9BFF 22%,#3FD0B8 40%,#4CC96B 58%,#F2B544 78%,#B18CFF)}
.it{position:relative}
.it .dot{flex:none;width:9px;height:9px;border-radius:50%;box-shadow:inset 0 0 0 1.5px rgba(235,235,245,.28);transition:background .35s,box-shadow .35s}
.it .nm{font-weight:600;letter-spacing:-.022em;color:rgba(235,235,245,.36);transition:color .3s;white-space:nowrap}
.it:hover .nm{color:var(--tx2)}
.it.sel .nm{color:var(--tx)}
.it.m0 .mg,.it.m0 .tg{opacity:.28;filter:grayscale(1)}
.mg,.tg{transition:opacity .4s,filter .4s}
.mg i,.tg i{display:block;transition:height .55s var(--ease),width .55s var(--ease),left .55s var(--ease),flex-grow .55s var(--ease),background .35s,opacity .35s,box-shadow .35s,transform .35s var(--ease)}

/* right pane shared */
.det{position:relative;min-width:0}
.det .in{transition:opacity .22s,transform .35s var(--ease)}
.det .in.swap{opacity:0;transform:translateY(6px)}
.lab{display:flex;align-items:center;height:16px;font-size:12px;color:var(--tx3);white-space:nowrap}
.lab .key{margin-left:auto;display:flex;align-items:center;gap:6px;color:var(--tx2);transition:opacity .3s}
.mk{flex:none;width:7px;height:7px;border-radius:50%;background:var(--c)}
.big{display:flex;align-items:baseline;gap:6px;white-space:nowrap;height:44px;margin-top:2px}
.big .n{font-size:38px;font-weight:500;letter-spacing:-.02em;line-height:44px}
.big .u{font-size:15px;color:var(--tx2)}
.big .n2{margin-left:auto;font-size:13px;color:var(--tx2)}
.big .n2 b{color:var(--tx)}
.say{margin-top:2px;font-size:14px;line-height:20px;color:var(--tx2);min-height:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:color .25s}
.say b{color:var(--tx)}
.say.plan{color:var(--tx)}
.say.plan b{color:var(--c)}
.det.off .gfx{filter:grayscale(1);opacity:.5}

.own{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 8px 0 6px;border-radius:10px;font-size:12px;color:var(--ag);background:rgba(255,134,168,.1);white-space:nowrap;transition:background .2s}
.own:hover{background:rgba(255,134,168,.2)}
.own svg{flex:none}
.own.no{color:var(--tx3);background:none;padding:0;cursor:default}

.holds{display:inline-flex;align-items:center;gap:9px;font-size:11px;color:var(--tx3);white-space:nowrap}
.holds span{display:inline-flex;align-items:center;gap:4px}
.holds i{width:7px;height:7px;border-radius:2px}
.holds i.eye{border-radius:50%}

/* settings */
.set{padding-top:6px;border-top:1px solid var(--line)}
.modes{position:relative;display:flex;gap:24px;height:40px;align-items:flex-start;margin-top:4px}
.modes button{font-size:26px;font-weight:600;letter-spacing:-.02em;line-height:32px;color:var(--tx3);transition:color .3s}
.modes button:hover{color:var(--tx2)}
.modes button[aria-checked="true"]{color:var(--tx)}
.bar{position:absolute;left:0;top:35px;height:2px;border-radius:1px;background:var(--c);transition:transform .45s var(--ease),width .45s var(--ease),background .35s,opacity .3s}
.rule{margin-top:2px;font-size:13.5px;line-height:19px;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.opts{display:flex;gap:18px;height:24px;margin-top:7px;align-items:flex-start;white-space:nowrap;transition:opacity .3s}
.opts button{position:relative;font-size:14px;color:var(--tx3);line-height:19px;transition:color .25s}
.opts button:hover{color:var(--tx2)}
.opts button[aria-checked="true"]{color:var(--tx);font-weight:500}
.opts button[aria-checked="true"]::after{content:"";position:absolute;left:50%;bottom:-5px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--c)}
.det.off .opts{opacity:.3;pointer-events:none}

/* section action button */
.sa{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 15px;border-radius:17px;font-size:13.5px;font-weight:600;white-space:nowrap;background:var(--c);color:#0e1020;transition:filter .2s,opacity .3s,transform .2s var(--ease),box-shadow .25s}
.sa .tl{font-weight:400;opacity:.62;font-size:12.5px}
.sa:hover{filter:brightness(1.08);box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 22%,transparent)}
.sa:active{transform:scale(.98)}
.sa.ghost{background:rgba(255,255,255,.07);color:var(--tx)}
.sa.ghost .tl{color:var(--tx3);opacity:1}
.sa.ghost:hover{background:rgba(255,255,255,.12);box-shadow:none}
.sa[disabled]{opacity:.35;pointer-events:none}

/* verbs */
.vb{display:inline-flex;align-items:baseline;gap:5px;height:26px;line-height:26px;padding:0 9px;border-radius:13px;font-size:12.5px;font-weight:500;white-space:nowrap;color:var(--tx);background:rgba(255,255,255,.07);transition:background .2s,color .2s}
.vb .tl{font-weight:400;font-size:11.5px;color:var(--tx3)}
.vb:hover{background:rgba(255,255,255,.14)}
.vb.pr{background:color-mix(in srgb,var(--c) 24%,transparent);color:#fff}
.vb.pr:hover{background:color-mix(in srgb,var(--c) 36%,transparent)}
.vb.dis{background:none;color:var(--tx3);cursor:default;padding-left:4px}
.vb.dis .tl{color:var(--tx3);opacity:.8}

/* toast */
.toast{position:absolute;right:22px;top:6px;z-index:9;display:flex;align-items:center;gap:14px;height:40px;padding:0 8px 0 18px;border-radius:20px;background:rgba(44,45,58,.97);box-shadow:0 14px 40px rgba(0,0,0,.4),inset 0 0 0 1px rgba(255,255,255,.08);font-size:13px;color:var(--tx2);white-space:nowrap;transform:translateY(-8px);opacity:0;pointer-events:none;transition:opacity .3s,transform .4s var(--ease)}
.toast.on{opacity:1;transform:none;pointer-events:auto}
.toast b{color:var(--tx)}
.toast .tu{height:28px;padding:0 13px;border-radius:14px;font-weight:600;color:var(--tx);background:rgba(255,255,255,.1);transition:background .2s}
.toast .tu:hover{background:rgba(255,255,255,.18)}
.toast .tu[hidden]{display:none}
.toast.solo{padding-right:18px}

.foot{display:flex;align-items:center;gap:28px;height:50px;padding:0 30px;border-top:1px solid var(--line)}
.sw{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--tx2);transition:color .2s}
.sw i{width:32px;height:19px;border-radius:10px;background:rgba(255,255,255,.14);position:relative;transition:background .25s;flex:none}
.sw i::after{content:"";position:absolute;left:2px;top:2px;width:15px;height:15px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .25s var(--ease)}
.sw[aria-checked="true"]{color:var(--tx)}
.sw[aria-checked="true"] i{background:#5B9BFF}
.sw[aria-checked="true"] i::after{transform:translateX(13px)}
.foot .hint{margin-left:auto;font-size:11px;color:var(--tx3);white-space:nowrap}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important}}

/* ===== B: goes or stays ===== */
.body{grid-template-columns:238px 1fr;column-gap:36px}
.leg{padding-left:21px}
.it{display:block;width:100%;height:92px;padding-top:8px}
.it .top{display:flex;align-items:center;gap:12px;height:30px}
.it .nm{font-size:22px}
.it .md{margin-left:auto;font-size:12px;color:var(--tx3);transition:color .3s}
.it.sel .md{color:var(--tx2)}
.tg{position:relative;display:flex;gap:2px;height:6px;margin:9px 0 0 21px}
.tg i{height:6px;border-radius:3px;flex-basis:0;min-width:0}
.tg i.z{flex-grow:.0001!important;margin-left:-2px;opacity:0}
.cp{display:flex;margin:9px 0 0 21px;font-size:12px;color:var(--tx3);white-space:nowrap;transition:color .3s}
.cp b{color:var(--tx2);transition:color .3s}
.cp .r{margin-left:auto}
.it.sel .cp{color:var(--tx2)}
.it.sel .cp b{color:var(--tx)}

/* board */
.board{position:relative;margin-top:12px}
.lanes{display:flex;height:22px;font-size:12px;color:var(--tx3);white-space:nowrap}
.lanes span{flex:1;display:flex;align-items:baseline;gap:6px}
.lanes span b{font-weight:600;color:var(--tx2)}
.lanes span:last-child{justify-content:flex-end}
.lanes span:last-child b{color:var(--c)}
.mid{position:absolute;left:50%;top:26px;bottom:2px;width:1px;background:var(--line)}
.rows{position:relative}
.sr{position:relative;height:30px;margin-bottom:2px;transition:height .45s var(--ease),margin .45s var(--ease)}
.sr.open{height:66px}
.sr.tall.open{height:74px}
.sr .cd{position:absolute;left:0;top:0;bottom:0;width:var(--cw,60%);display:flex;flex-direction:column;justify-content:center;padding:0 12px 0 10px;border-radius:10px;background:rgba(255,255,255,.045);cursor:grab;touch-action:none;transition:transform .5s var(--ease),width .45s var(--ease),background .3s,box-shadow .3s,opacity .35s;z-index:1}
.sr .cd:hover{background:rgba(255,255,255,.075)}
.sr.go .cd{transform:translateX(var(--tx,66.667%));background:color-mix(in srgb,var(--c) 15%,transparent)}
.sr.go .cd:hover{background:color-mix(in srgb,var(--c) 22%,transparent)}
.sr.open .cd{width:100%;transform:none;cursor:default}
.sr.drag .cd{cursor:grabbing;box-shadow:0 10px 30px rgba(0,0,0,.35);z-index:3}
.sr.arm .cd{box-shadow:0 0 0 1.5px var(--c),0 10px 30px rgba(0,0,0,.35)}
.sr.arm.toStay .cd{box-shadow:0 0 0 1.5px rgba(255,255,255,.6),0 10px 30px rgba(0,0,0,.35)}
.sr.gone{height:0;margin-bottom:0;transition:height .45s var(--ease) .28s,margin .45s var(--ease) .28s}
.sr.gone .cd{transform:translateX(120%);opacity:0;pointer-events:none}
.sr.lockd .cd{cursor:default}
.sr .l1{display:flex;align-items:center;gap:8px;height:20px;white-space:nowrap;min-width:0}
.sr .l1 .ic{flex:none;display:flex;width:17px;justify-content:center}
.sr .l1 .n{flex:none;font-size:13px;max-width:150px;overflow:hidden;text-overflow:ellipsis}
.sr .l1 .x{flex:1;min-width:0;font-size:12px;color:var(--tx3);overflow:hidden;text-overflow:ellipsis}
.sr .l1 .v{flex:none;font-size:12.5px;color:var(--tx2)}
.sr.go .l1 .v{color:var(--tx)}
.sr .l1 .sd{flex:none;width:8px;height:8px;border-radius:50%}
.sr .la{display:flex;align-items:center;gap:8px;height:16px;margin-top:2px;padding-left:25px;font-size:11.5px;color:var(--tx3);white-space:nowrap;overflow:hidden}
.sr .l2{display:flex;align-items:center;gap:5px;height:0;overflow:hidden;opacity:0;transition:height .4s var(--ease),opacity .3s,margin .4s;white-space:nowrap}
.sr.open .l2{height:28px;margin-top:6px;opacity:1}
.sr .l2 .own,.sr .l2 .own.no{margin-left:auto}
.grip{position:absolute;left:3px;top:50%;width:4px;height:12px;margin-top:-6px;opacity:0;transition:opacity .2s;background-image:radial-gradient(circle,rgba(255,255,255,.5) 1px,transparent 1.2px);background-size:4px 4px}
.sr .cd:hover .grip{opacity:1}
.sr.open .grip{opacity:0}
/* the empty side of a row: where it can go */
.dest{position:absolute;top:0;bottom:0;width:calc(100% - var(--cw,60%));display:flex;align-items:center;gap:6px;padding:0 14px;font-size:12.5px;font-weight:500;white-space:nowrap;color:var(--tx3);opacity:0;border-radius:10px;cursor:pointer;transition:opacity .2s,background .2s,color .2s}
.dest.r{right:0;justify-content:flex-end}
.dest.l{left:0}
.sr:hover .dest,.sr.drag .dest{opacity:1}
.sr.open .dest{opacity:0;pointer-events:none}
.dest:hover{background:rgba(255,255,255,.04);color:var(--tx)}
.dest.r:hover{color:var(--c)}
.dest.no{cursor:default;font-weight:400}
.dest.no:hover{background:none;color:var(--tx3)}
.sr.go .dest.r,.sr:not(.go) .dest.l{display:none}
.sr.bump .cd{animation:bump .42s var(--ease)}
@keyframes bump{30%{transform:translateX(18px)}60%{transform:translateX(-4px)}}
.sr.go.bump .cd{animation:bumpb .42s var(--ease)}
@keyframes bumpb{0%{transform:translateX(var(--tx))}30%{transform:translateX(calc(var(--tx) - 18px))}100%{transform:translateX(var(--tx))}}
.chiprow{display:flex;gap:4px}
.chip{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 8px;border-radius:12px;font-size:12px;color:var(--tx2);background:rgba(255,255,255,.06);transition:background .2s}
.chip:hover{background:rgba(255,255,255,.12)}
.chip svg{width:14px;height:14px}
/* preview a section action */
.det.pv .sr:not(.go) .cd{opacity:.3}
.det.pv .sr.go .cd{box-shadow:0 0 0 1.5px color-mix(in srgb,var(--c) 80%,transparent),0 0 20px color-mix(in srgb,var(--c) 30%,transparent)}
.det.pv.nohi .sr .cd{opacity:1;box-shadow:none}
.empty{position:absolute;right:0;top:26px;width:40%;padding:6px 8px;font-size:12px;line-height:17px;color:var(--tx3);text-align:right;opacity:0;transition:opacity .4s .3s;pointer-events:none}
.empty.on{opacity:1}
.acts{display:flex;align-items:center;justify-content:flex-end;gap:10px;height:34px;margin:10px 0 12px}
.acts .note{margin-right:auto;font-size:11.5px;color:var(--tx3);white-space:nowrap}
.it.drop .nm{color:var(--tx)}

.var-b .body{height:628px}
.var-b .big{height:40px}
.var-b .big .n{font-size:34px;line-height:40px}
.sr.tall{height:38px}
.sr .l1 .ow{flex:none;display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 7px 0 5px;border-radius:10px;font-size:11.5px;color:var(--ag);background:rgba(255,134,168,.09);transition:background .2s}
.sr .l1 .ow:hover{background:rgba(255,134,168,.2)}

</style>
</head>
<body class="var-b">
<div id="stage">
  <div class="mb">
    <div class="mb-l">
      <svg viewBox="0 0 17 20" width="13" height="16" aria-hidden="true"><path fill="#fff" d="M14.1 10.6c0-2.6 2.1-3.8 2.2-3.9-1.2-1.8-3.1-2-3.7-2-1.6-.2-3.1.9-3.9.9-.8 0-2-.9-3.4-.9C3.6 4.8 1.9 5.8 1 7.4c-1.9 3.3-.5 8.2 1.4 10.9.9 1.3 2 2.8 3.4 2.7 1.4-.1 1.9-.9 3.5-.9s2.1.9 3.5.9c1.5 0 2.4-1.3 3.3-2.7 1-1.5 1.5-3 1.5-3.1-.1 0-2.9-1.1-2.9-4.3zM11.5 3c.7-.9 1.2-2.1 1.1-3.3-1 0-2.3.7-3 1.6-.7.8-1.3 2-1.1 3.2 1.1.1 2.3-.6 3-1.5z"/></svg>
      <b>Finder</b><span>File</span><span>Edit</span><span>View</span><span>Go</span><span>Window</span><span>Help</span>
    </div>
    <div class="mb-r">
      <div class="icons" id="icons"><i class="hl" id="hl"></i></div>
      <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M2 6.3a8.6 8.6 0 0 1 12 0M4.2 8.6a5.4 5.4 0 0 1 7.6 0"/><circle cx="8" cy="11.6" r="1.3" fill="#fff" stroke="none"/></svg>
      <svg viewBox="0 0 26 14" width="25" height="13" aria-hidden="true"><rect x=".7" y=".7" width="21.6" height="12.6" rx="3.6" fill="none" stroke="rgba(255,255,255,.55)" stroke-width="1.2"/><rect x="2.6" y="2.6" width="11.6" height="8.8" rx="2" fill="#fff"/><path d="M24 5v4" stroke="rgba(255,255,255,.55)" stroke-width="1.4" stroke-linecap="round"/></svg>
      <span>Tue 27 Oct&nbsp;&nbsp;16:42</span>
    </div>
  </div>
  <div class="sheet" id="sheet" role="dialog" aria-label="MinMacs">
    <div class="nub" id="nub"><svg viewBox="0 0 18 8" width="18" height="8" aria-hidden="true"><path d="M0 8 C5 8 6.5 0 9 0 C11.5 0 13 8 18 8 Z" fill="rgba(36,36,48,.96)"/></svg></div>
    <div class="head" id="today"></div>
    <div class="body">
      <div class="idx" id="idx" role="tablist" aria-orientation="vertical"></div>
      <div class="det" id="det"><div class="in" id="in"></div></div>
    </div>
    <div class="toast" id="toast" role="status" aria-live="polite"><span id="tmsg"></span><button class="tu" id="tundo">Undo</button></div>
    <div class="foot">
      <button class="sw" id="one" role="switch" aria-checked="false"><i></i>One icon in the menu bar</button>
      <button class="sw" id="login" role="switch" aria-checked="true"><i></i>Open at login</button>
      <span class="hint">Drag a row across to change the plan</span>
    </div>
  </div>
</div>
<script>
/* ================= core: data, actions, undo, rendering helpers ================= */
const $=id=>document.getElementById(id);

let st=fresh();
const SRVOF=a=>st.servers.filter(x=>x.own===a.k);
const TREEOF=a=>st.trees.filter(x=>x.own===a.k&&x.cls!=='f');
const agent=k=>st.agents.find(a=>a.k===k);
const itemsOf=id=>id==='awake'?st.agents:st[id];
const find=k=>{for(const id of ['agents','apps','servers','trees','disk']){const x=st[id].find(i=>i.k===k); if(x) return [id,x]} return [null,null]};
const holders=()=>st.agents.filter(a=>a.awake&&!a.sleep&&!a.gone);
const freeGB=a=>SRVOF(a).filter(x=>!x.gone).reduce((s,x)=>s+x.gb,0)+TREEOF(a).filter(x=>!x.gone&&x.cls==='m').reduce((s,x)=>s+x.gb,0);
const heldGB=a=>SRVOF(a).filter(x=>!x.gone).reduce((s,x)=>s+x.gb,0)+TREEOF(a).filter(x=>!x.gone).reduce((s,x)=>s+x.gb,0);

/* the plan: exactly what each section action touches */
function planOf(id){
  if(id==='awake') return holders();
  if(id==='agents') return st.agents.filter(a=>a.plan&&!a.gone&&(a.st==='f'||a.st==='i'));
  return st[id].filter(x=>x.plan&&!x.gone&&!x.lock);
}
function planGB(id){
  if(id==='agents') return planOf('agents').reduce((s,a)=>s+freeGB(a),0);
  if(id==='awake') return 0;
  return planOf(id).reduce((s,x)=>s+x.gb,0);
}
const f1=x=>(Math.round(x*10)/10).toFixed(1);
const f2=x=>(Math.round(x*100)/100).toFixed(2);
const sz=gb=>gb<1?Math.round(gb*1000)+' MB':(Math.round(gb*10)/10)+' GB';
const szs=gb=>gb>=10?f1(gb)+' GB':gb>=1?(Math.round(gb*100)/100)+' GB':Math.round(gb*1000)+' MB';
const plural=(n,w)=>n+' '+w+(n===1?'':'s');
const thr=s=>s.num?s.num[s.v]:0;

/* section actions: label, tail, which items, run, message */
const NOUN={agents:'agent',apps:'app',servers:'server',trees:'worktree',disk:'cache'};
function sacts(id){
  const p=planOf(id), gb=planGB(id), n=p.length;
  if(id==='agents') return [{k:'wrap',label:'Wrap Up Finished',tail:n?`${plural(n,'agent')} · ${f1(gb)} GB`:'none finished',n}];
  if(id==='apps') return [{k:'now',label:'MinMacs Now',tail:n?`${plural(n,'app')} · ${f1(gb)} GB`:'nothing to close',n},{k:'restore',label:'Restore Last Run',tail:'11:05',n:st.restored?0:1,ghost:1}];
  if(id==='servers') return [{k:'idle',label:'Close Idle',tail:n?`${n} · ${f2(gb).replace(/0$/,'')} GB`:'none idle',n}];
  if(id==='trees') return [{k:'merged',label:'Remove Merged',tail:n?`${n} · ${f2(gb).replace(/0$/,'')} GB`:'none merged',n}];
  if(id==='disk') return [{k:'safe',label:'Clean Safe',tail:n?`${f1(gb)} GB to the Trash`:'nothing safe left',n}];
  const h=holders().length;
  return [{k:'sleep',label:'Let It Sleep',tail:h?'now · '+plural(h,'agent'):'sleeps as usual',n:h},{k:'hour',label:'Keep Awake 1 h',tail:st.until?'until '+st.until:'until 17:42',n:st.until?0:1,ghost:1}];
}
function planWords(id,k){
  const p=planOf(id), gb=planGB(id);
  if(id==='apps'&&k==='restore') return `Reopens <b>2 apps</b> and <b>14 tabs</b> closed at 11:05.`;
  if(id==='awake'&&k==='hour') return `Holds the Mac awake until <b>17:42</b>, whoever is working.`;
  if(!p.length) return 'Nothing to do here right now.';
  const names=p.map(x=>x.n);
  const list=names.length>3?names.slice(0,2).join(', ')+' and '+(names.length-2)+' more':names.join(', ').replace(/, ([^,]*)$/,' and $1');
  if(id==='agents'&&p.length>1) return `Wraps up ${plural(p.length,'agent')}: stops their servers. Frees <b>${f1(gb)} GB</b>.`;
  if(id==='agents'){const a=p[0];return `Stops ${SRVOF(a).filter(x=>!x.gone).map(x=>x.n).join(', ')||'no servers'}, removes ${TREEOF(a).filter(x=>!x.gone).map(x=>x.n).join(', ')||'nothing'}. Frees <b>${f1(gb)} GB</b>.`}
  if(id==='awake') return `${plural(p.length,'agent')} let go of it. The Mac sleeps as usual.`;
  const v={apps:'Quits',servers:'Stops',trees:'Removes',disk:'Cleans'}[id];
  return `${v} ${list}. Frees <b>${szs(gb)}</b>.`;
}

/* item actions */
function acts(id,x){
  const L=[];
  const add=(k,label,tail,o={})=>L.push({k,label,tail:tail||'',...o});
  if(id==='agents'||id==='awake'){
    const a=x;
    if(a.gone){add('back','Bring Back','undo the wrap-up',{pr:1});return L}
    add('tab','Go to Tab');
    if(id==='awake'){
      if(a.awake&&!a.sleep) add('sleep','Let It Sleep','',{pr:1}); else if(a.awake) add('wake','Keep It Awake','',{pr:1});
      add('hour','Keep Awake 1 h',st.until?'until '+st.until:'until 17:42',{dis:!!st.until});
      return L;
    }
    if(a.st==='f'||a.st==='i') add('wrap','Wrap Up',freeGB(a)?f1(freeGB(a))+' GB':'',{pr:a.st==='f'}); else add('wrap','Wrap Up…',a.st==='w'?'working':'needs you',{dis:1});
    const sv=SRVOF(a).filter(s=>!s.gone);
    if(sv.length) add('stopsrv','Stop Its Servers',String(sv.length));
    if(a.awake&&!a.sleep) add('sleep','Let It Sleep');
    return L;
  }
  if(id==='apps'){
    if(x.gone){add('back','Restore','reopen',{pr:1});return L}
    if(x.k==='chrome'&&!x.trim) add('trim','Trim Tabs','14 tabs · 3.3 GB',{pr:1});
    if(x.lock) add('quit','Quit…',x.lock,{dis:1});
    else if(x.refused) add('force','Force Quit',sz(x.gb),{pr:1});
    else add('quit','Quit',sz(x.gb),{pr:x.k!=='chrome'||x.trim});
    if(!x.lock) add(x.plan?'keep':'add',x.plan?'Keep':'Move to Close List');
    return L;
  }
  if(id==='servers'){
    if(x.gone){add('back','Restart','start again',{pr:1});return L}
    if(x.cls==='use'){add('open','Open in Browser');add('restart','Restart');add('stop','Stop',sz(x.gb))}
    else{add('stop','Stop',sz(x.gb),{pr:1});add(x.plan?'keep':'add',x.plan?'Keep':'Add to Close Idle');add('open','Open in Browser')}
    if(x.own) add('agent','Go to Agent');
    return L;
  }
  if(id==='trees'){
    if(x.gone){add('back','Bring Back','from the Trash',{pr:1});return L}
    if(x.lock) add('rm','Remove…',x.lock,{dis:1});
    else add('rm','Remove',x.bundle?'bundles first':sz(x.gb),{pr:x.cls==='m'||x.cls==='s'});
    if(x.cls==='m') add(x.plan?'keep':'add',x.plan?'Keep':'Add Back');
    if(x.cls==='u') add('editor','Open in Editor'); else add('commit','Show Commit');
    if(x.cls!=='u') add('finder','Show in Finder');
    return L;
  }
  if(id==='disk'){
    if(x.gone){add('back','Put Back','from the Trash',{pr:1,dis:x.how!=='to the Trash',tail:x.how!=='to the Trash'?'re-downloads on use':'from the Trash'});return L}
    if(x.lock) add('clean','Clean…',x.lock,{dis:1});
    else add('clean','Clean',x.how==='to the Trash'?sz(x.gb)+' to the Trash':x.how,{pr:1});
    if(!x.lock) add(x.plan?'keep':'add',x.plan?'Keep':'Add to Clean Safe');
    add('finder','Show in Finder');
    return L;
  }
  return L;
}

/* ---------- undo + toast ---------- */
let snap=null, toastT=null;
function toast(html,undo){
  const t=$('toast'); $('tmsg').innerHTML=html;
  $('tundo').hidden=!undo; t.classList.toggle('solo',!undo);
  t.classList.add('on'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('on'),undo?7000:2600);
}
function commit(fn,msg,freed){
  snap=JSON.stringify(st);
  fn(); if(freed) st.freed+=freed;
  render(); toast(msg,true);
}
function undo(){
  if(!snap) return; st=JSON.parse(snap); snap=null; render();
  toast('Undone. Everything is back as it was.',false);
}

function runSection(id,k){
  const p=planOf(id), gb=planGB(id);
  if(id==='agents'){ if(!p.length) return;
    commit(()=>p.forEach(wrap),`Wrapped up <b>${p.map(a=>a.n).join(', ')}</b> · ${f1(gb)} GB freed`,gb); return }
  if(id==='apps'&&k==='restore'){ commit(()=>{st.restored=1},'Reopened <b>2 apps</b> and <b>14 tabs</b> from 11:05',0); return }
  if(id==='awake'){
    if(k==='hour'){ commit(()=>{st.until='17:42'},'The Mac stays awake until <b>17:42</b>',0); return }
    if(!p.length) return;
    commit(()=>p.forEach(a=>a.sleep=1),`<b>The Mac can sleep.</b> ${plural(p.length,'agent')} keep working until it does`,0); return }
  if(!p.length) return;
  const v={apps:'Quit',servers:'Stopped',trees:'Removed',disk:'Cleaned'}[id];
  commit(()=>p.forEach(x=>x.gone=1),`${v} <b>${plural(p.length,NOUN[id])}</b> · ${id==='apps'?f1(gb)+' GB':szs(gb)} freed`,gb);
}
function wrap(a){a.gone=1; SRVOF(a).forEach(s=>s.gone=1); TREEOF(a).filter(t=>t.cls==='m').forEach(t=>t.gone=1)}

function runItem(id,k,key){
  const x=id==='awake'||id==='agents'?agent(key):st[id].find(i=>i.k===key); if(!x) return;
  const A=acts(id,x).find(a=>a.k===k); if(!A||A.dis) return;
  const N=`<b>${x.n}</b>`;
  switch(k){
    case 'tab': toast(`Switched to ${N} in its ${x.where}`); return;
    case 'open': toast(`Opened <b>localhost${x.n}</b> in the browser`); return;
    case 'restart': toast(`Restarted ${N} ${x.x}`); return;
    case 'commit': toast(`Showing the last commit of ${N}`); return;
    case 'finder': toast(`Showing ${N} in Finder`); return;
    case 'editor': toast(`Opened ${N} in Cursor`); return;
    case 'agent': goAgent(x.own); return;
  }
  if(id==='agents'||id==='awake'){
    if(k==='wrap'){const gb=freeGB(x);commit(()=>wrap(x),`Wrapped up ${N} · stopped its servers, removed its worktree · ${f1(gb)} GB`,gb);return}
    if(k==='stopsrv'){const sv=SRVOF(x).filter(s=>!s.gone);const gb=sv.reduce((s,v)=>s+v.gb,0);commit(()=>sv.forEach(s=>s.gone=1),`Stopped ${sv.map(s=>s.n).join(', ')} for ${N} · ${sz(gb)}`,gb);return}
    if(k==='sleep'){commit(()=>{x.sleep=1},`${N} no longer holds the Mac awake`);return}
    if(k==='wake'){commit(()=>{x.sleep=0},`${N} holds the Mac awake again`);return}
    if(k==='hour'){commit(()=>{st.until='17:42'},'The Mac stays awake until <b>17:42</b>');return}
    if(k==='back'){commit(()=>{x.gone=0;SRVOF(x).forEach(s=>s.gone=0);TREEOF(x).forEach(t=>t.gone=0)},`Brought back ${N}, its server and worktree`);return}
  }
  if(k==='back'){commit(()=>{x.gone=0;x.refused=0},`${{apps:'Reopened',servers:'Started',trees:'Brought back',disk:'Put back'}[id]} ${N}`,-(x.gb));return}
  if(k==='keep'){commit(()=>{x.plan=0;x.kept=1},`Kept ${N}. ${sacts(id)[0].label} leaves it alone`);return}
  if(k==='add'){commit(()=>{x.plan=1;x.kept=0},`Added ${N} to ${sacts(id)[0].label}`);return}
  if(k==='trim'){commit(()=>{x.trim=1;x.gb=5.4;x.cpu=14;x.x='31 work tabs'},`Trimmed 14 noise tabs in ${N} · 3.3 GB freed`,3.3);return}
  if(k==='quit'&&x.refuse&&!x.refused){x.refused=1;render();toast(`${N} did not quit. It is not responding, so Force Quit is there now.`);return}
  const v={quit:'Quit',force:'Force quit',stop:'Stopped',rm:'Removed',clean:'Cleaned'}[k];
  if(v){const extra=k==='rm'&&x.bundle?' · kept a git bundle':k==='clean'&&x.how!=='to the Trash'?' · ran '+x.how:'';
    commit(()=>{x.gone=1},`${v} ${N} · ${sz(x.gb)}${extra}`,x.gb);}
}

/* ---------- morph so CSS eases every value ---------- */
function morph(a,b){
  if(a.nodeType!==b.nodeType||a.nodeName!==b.nodeName){a.replaceWith(b.cloneNode(true));return}
  if(a.nodeType===3){if(a.nodeValue!==b.nodeValue)a.nodeValue=b.nodeValue;return}
  if(a.nodeType!==1)return;
  if(a.hasAttribute('data-keep'))return;
  for(const at of [...b.attributes]) if(a.getAttribute(at.name)!==at.value) a.setAttribute(at.name,at.value);
  for(const at of [...a.attributes]) if(!b.hasAttribute(at.name)) a.removeAttribute(at.name);
  const ac=[...a.childNodes], bc=[...b.childNodes];
  if(ac.length!==bc.length){a.replaceChildren(...bc.map(n=>n.cloneNode(true)));return}
  ac.forEach((n,i)=>morph(n,bc[i]));
}
function patch(el,html){const t=document.createElement(el.tagName);t.innerHTML=html;
  if(!el.childNodes.length){el.innerHTML=html;return}
  const ac=[...el.childNodes], bc=[...t.childNodes];
  if(ac.length!==bc.length){el.innerHTML=html;return}
  ac.forEach((n,i)=>morph(n,bc[i]));
}
/* numbers ease down: <b class="tw" data-k data-v data-f> */
const TW={}; const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const tw=(k,v,f)=>`<span class="tw" data-k="${k}" data-v="${v}" data-f="${f}">${fmtN(v,f)}</span>`;
function fmtN(v,f){v=+v;return f==='g'?f1(v).replace(/\.0$/,''):f==='0'?String(Math.round(v)):f==='1'?f1(v):f==='2'?f2(v).replace(/0$/,''):String(v)}
function tweens(){
  document.querySelectorAll('.tw').forEach(el=>{
    const k=el.dataset.k, v=+el.dataset.v, f=el.dataset.f, p=TW[k]; TW[k]=v;
    if(p==null||p===v||RM){el.textContent=fmtN(v,f);return}
    const t0=performance.now(), d=650;
    const step=t=>{const q=Math.min(1,(t-t0)/d), e=1-Math.pow(1-q,3); if(el.dataset.k!==k) return; el.textContent=fmtN(p+(v-p)*e,f); if(q<1) requestAnimationFrame(step)};
    el.textContent=fmtN(p,f); requestAnimationFrame(step);
  });
}

  let l2='';
  if(x.group) l2=x.list.map(a=>`<button class="chip" data-chip="${a.k}">${a.n}</button>`).join('');
  else l2=acts(id,x).filter(a=>a.k!=='keep'&&a.k!=='add'&&a.k!=='agent').map(a=>`<button class="vb${a.pr&&!a.dis?' pr':''}${a.dis?' dis':''}" data-ia="${a.k}" data-k="${x.k}" data-id="${id}">${a.label}${a.tail?`<span class="tl">${a.tail}</span>`:''}</button>`).join('')+(ag?'':ownLink(x));
  const wGo=blockWhy(id,x,true), wSt=blockWhy(id,x,false);
  const dR=wGo?`<span class="dest r no">${wGo}</span>`:`<span class="dest r" data-mv="go">${TO[id]}${gl('arrow','currentColor',13)}</span>`;
  const dL=wSt?`<span class="dest l no">${wSt}</span>`:`<span class="dest l" data-mv="stay"><span style="transform:scaleX(-1);display:flex">${gl('arrow','currentColor',13)}</span>${BACK[id]}</span>`;
  return `<div class="sr${go?' go':''}${tall?' tall':''}${open?' open':''}${x.gone?' gone':''}${x.group?' lockd':''}" data-k="${x.k}">${dL}${dR}<div class="cd" tabindex="0" role="button" aria-label="${x.n}"><i class="grip"></i>${l1}${la}<span class="l2">${l2}</span></div></div>`;
}
const KEY={agents:'colored = Wrap Up takes it',apps:'colored = MinMacs Now quits',servers:'colored = Close Idle stops',trees:'colored = Remove Merged takes',disk:'colored = Clean Safe takes',awake:'colored = holds it awake'};
V.det=s=>{
  const id=s.id, b=bigOf(s), A=sacts(id), R=rowsOf(id), cw=CW[id]||.64;
  const goN=R.filter(x=>isGo(id,x)&&!x.gone), stN=R.filter(x=>!isGo(id,x)&&!x.gone);
  const gb=L=>L.reduce((n,x)=>n+(x.gb||(x.tool?freeGB(x):0)),0);
  const hd=(L,side)=>id==='awake'||id==='agents'?`<b>${L.reduce((n,x)=>n+(x.list?x.list.length:1),0)}</b>`:`<b>${L.reduce((n,x)=>n+(x.list?x.list.length:1),0)}</b>${gb(L)?' · '+szs(gb(L)):''}`;
  return `<div class="lab">Right now${keyLine(s,KEY[id])}</div>
   <div class="big"><span class="n">${b[0]}</span><span class="u">${b[1]}</span><span class="n2">${b[2]}</span></div>
   <p class="say" id="say">${sayOf(s)}</p>
   <div class="board gfx" style="--cw:${cw*100}%;--tx:${((1-cw)/cw*100).toFixed(3)}%">
     <div class="lanes"><span>${LANE[id][0]} ${hd(stN)}</span><span>${LANE[id][1]} ${hd(goN)}</span></div>
     <div class="rows" id="rows">${R.map(x=>rowHTML(id,x)).join('')}</div>
     <div class="empty${goN.length?'':' on'}">${id==='awake'?'Nothing holds it awake.':'Nothing goes now.'}<br>Drag a row here to add it.</div>
   </div>
   <div class="acts"><span class="note">Drag a row across, or click its open side</span>${A.map(a=>`<button class="sa${a.ghost?' ghost':''}" data-sa="${a.k}" data-sid="${id}"${a.n?'':' disabled'}>${a.label}<span class="tl">${a.tail}</span></button>`).join('')}</div>
   ${setHTML(s)}`;
};
V.after=()=>{if(pv) applyPV(pv.sid,pv.k)};
V.focus=k=>{openK=k; updateDet()};

/* ---------- moving a row across = a real, undoable choice ---------- */
function tryMove(id,k,toGo,row){
  const R=rowsOf(id), x=R.find(r=>r.k===k); if(!x) return false;
  const why=blockWhy(id,x,toGo);
  if(why){ bump(row); toast(`<b>${x.n}</b> stays: ${why}`); return false }
  if(isGo(id,x)===toGo) return false;
  const N=`<b>${x.n}</b>`, act=sacts(id)[0].label;
  if(id==='awake'){
    if(toGo) commit(()=>{x.sleep=0},`${N} holds the Mac awake again`);
    else commit(()=>{x.sleep=1},`${N} no longer holds the Mac awake`);
    return true;
  }
  if(toGo) commit(()=>{x.plan=1;x.kept=0},`${N} goes. ${act} takes it${x.gb?' · '+sz(x.gb):''}`);
  else commit(()=>{x.plan=0;x.kept=1},`Kept ${N}. ${act} and Auto leave it alone`);
  return true;
}
function bump(row){ if(!row) return; row.classList.remove('bump'); void row.offsetWidth; row.classList.add('bump'); setTimeout(()=>row.classList.remove('bump'),450) }

const scaleK=()=>$('stage').getBoundingClientRect().width/1280;
document.addEventListener('pointerdown',e=>{
  const cd=e.target.closest('.sr .cd'); if(!cd||e.button!==0) return;
  if(e.target.closest('button')) return;
  const row=cd.parentElement; if(row.classList.contains('open')) return;
  const k=scaleK(), w=row.getBoundingClientRect().width/k, cw=CW[sel]||.64, travel=w*(1-cw);
  drag={row,cd,x0:e.clientX,k,travel,go:row.classList.contains('go'),moved:false,pos:0};
  try{cd.setPointerCapture(e.pointerId)}catch(_){}
});
document.addEventListener('pointermove',e=>{
  if(!drag) return;
  const dx=(e.clientX-drag.x0)/drag.k;
  if(!drag.moved&&Math.abs(dx)<4) return;
  if(!drag.moved){drag.moved=true; drag.row.classList.add('drag'); drag.cd.style.transition='background .3s,box-shadow .3s'}
  const base=drag.go?drag.travel:0, pos=Math.max(-10,Math.min(drag.travel+10,base+dx));
  drag.pos=pos; drag.cd.style.transform=`translateX(${pos}px)`;
  const crossed=drag.go?pos<drag.travel/2:pos>drag.travel/2;
  drag.row.classList.toggle('arm',crossed); drag.row.classList.toggle('toStay',crossed&&drag.go);
});
document.addEventListener('pointerup',e=>{
  if(!drag) return; const d=drag; drag=null;
  d.row.classList.remove('drag','arm','toStay');
  if(!d.moved){ const k=d.row.dataset.k; openK=openK===k?null:k; updateDet(); return }
  const crossed=d.go?d.pos<d.travel/2:d.pos>d.travel/2;
  d.cd.style.transition=''; d.cd.style.transform='';
  if(crossed) tryMove(sel,d.row.dataset.k,!d.go,d.row);
});
document.addEventListener('pointercancel',()=>{if(!drag) return; drag.cd.style.transition='';drag.cd.style.transform='';drag.row.classList.remove('drag','arm','toStay');drag=null});

/* ---------- preview a section action ---------- */
function applyPV(sid,k){
  if(sid!==sel) return;
  const d=$('det'); d.classList.add('pv'); d.classList.toggle('nohi',k==='restore'||k==='hour');
  const say=$('say'); if(say){say.innerHTML=planWords(sid,k); say.classList.add('plan')}
}
function clearPV(){ pv=null; $('det').classList.remove('pv','nohi'); const say=$('say'); if(say){say.innerHTML=sayOf(cur()); say.classList.remove('plan')} }
document.addEventListener('mouseover',e=>{
  const a=e.target.closest('[data-sa]');
  if(a){ if(!pv||pv.k!==a.dataset.sa){clearPV(); pv={sid:a.dataset.sid,k:a.dataset.sa}; applyPV(pv.sid,pv.k)} }
  else if(pv) clearPV();
});
document.addEventListener('click',e=>{
  if(coreClick(e)) return;
  const sa=e.target.closest('[data-sa]'); if(sa){ runSection(sa.dataset.sid,sa.dataset.sa); clearPV(); return }
  const ia=e.target.closest('[data-ia]'); if(ia){ runItem(ia.dataset.id,ia.dataset.ia,ia.dataset.k); return }
  const ch=e.target.closest('[data-chip]'); if(ch){ const [cid,x]=find(ch.dataset.chip); if(x) toast(cid==='agents'?`Switched to <b>${x.n}</b> in its ${x.where}`:`Showing <b>${x.n}</b> in Finder`); return }
  const mv=e.target.closest('[data-mv]'); if(mv){ const row=mv.closest('.sr'); tryMove(sel,row.dataset.k,mv.dataset.mv==='go',row); return }
  const it=e.target.closest('.it'); if(it){ openK=null; select(it.dataset.s); return }
});
document.addEventListener('keydown',e=>{
  const cd=e.target.closest&&e.target.closest('.sr .cd');
  if(cd){ const row=cd.parentElement, k=row.dataset.k;
    if(e.key==='Enter'||e.key===' '){e.preventDefault(); openK=openK===k?null:k; updateDet(); return}
    if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault(); tryMove(sel,k,e.key==='ArrowRight',row); return}
  }
  const it=e.target.closest&&e.target.closest('.it'); if(!it) return;
  const i=S.findIndex(s=>s.id===it.dataset.s);
  const j=e.key==='ArrowDown'?Math.min(S.length-1,i+1):e.key==='ArrowUp'?Math.max(0,i-1):-1;
  if(j<0) return; e.preventDefault(); openK=null; select(S[j].id); $('it-'+S[j].id).focus();
});
boot();

</script>
