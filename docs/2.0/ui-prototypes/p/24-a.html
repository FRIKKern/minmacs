<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Every Size</title>
<style>
:root{
  --glass:rgba(28,29,38,.88);
  --line:rgba(255,255,255,.06);
  --tx:rgba(255,255,255,.94);
  --tx2:rgba(235,235,245,.55);
  --tx25:rgba(235,235,245,.42);
  --tx3:rgba(235,235,245,.28);
  --trk:rgba(255,255,255,.075);
  --use:rgba(255,255,255,.40);
  --ease:cubic-bezier(.3,.7,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#1a1636}
body{font-family:-apple-system,"SF Pro Text",system-ui,sans-serif;color:var(--tx);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;font-size:13px;cursor:default;user-select:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;text-align:left}
:focus{outline:none}
:focus-visible{outline:2px solid rgba(255,255,255,.55);outline-offset:3px;border-radius:8px}
#stage{position:absolute;left:0;top:0;width:1280px;height:800px;transform-origin:0 0;overflow:hidden;
  background:
   radial-gradient(760px 560px at 10% 6%,#4b3c9e 0%,rgba(75,60,158,0) 70%),
   radial-gradient(700px 520px at 84% 2%,#22618f 0%,rgba(34,97,143,0) 70%),
   radial-gradient(820px 620px at 88% 104%,#a0436f 0%,rgba(160,67,111,0) 70%),
   radial-gradient(640px 520px at 18% 100%,#3a2463 0%,rgba(58,36,99,0) 75%),
   #1d1a3c}

/* menu bar */
.mb{position:absolute;left:0;right:0;top:0;height:26px;display:flex;align-items:center;justify-content:space-between;padding:0 12px 0 16px;background:rgba(18,14,40,.32);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);font-size:13px;color:rgba(255,255,255,.92);z-index:5}
.mb-l,.mb-r{display:flex;align-items:center;gap:18px}
.mb-l b{font-weight:700}
.mb-r{gap:14px}
.icons{position:relative;display:flex;align-items:center;gap:12px}
.hl{position:absolute;top:-3px;height:22px;width:28px;border-radius:6px;background:rgba(255,255,255,.2);transition:transform .45s var(--ease),opacity .3s;pointer-events:none}
.mi{position:relative;display:flex;width:16px;overflow:hidden;cursor:pointer;transition:width .4s var(--ease),opacity .3s,margin .4s var(--ease)}
.mi.off{width:0;opacity:0;margin-left:-12px}

/* sheet: right edge fixed under the status items, it grows to the left */
.sheet{position:absolute;top:34px;right:180px;width:720px;background:var(--glass);backdrop-filter:blur(36px) saturate(1.5);-webkit-backdrop-filter:blur(36px) saturate(1.5);border:1px solid rgba(255,255,255,.085);border-radius:22px;box-shadow:0 34px 100px rgba(6,4,24,.5),inset 0 1px 0 rgba(255,255,255,.035);animation:drop .6s var(--ease) both;transition:width .55s var(--ease)}
.sheet.sz-s{width:600px}
.sheet.sz-l{width:760px}
@keyframes drop{from{opacity:0;transform:translateY(-10px)}}
.nub{position:absolute;top:-8px;right:0;width:18px;height:8px;transition:transform .45s var(--ease)}
.nub svg{display:block}

.head{display:flex;align-items:center;gap:12px;height:52px;padding:0 36px;white-space:nowrap}
.head .lbl{font-size:12px;color:var(--tx3)}
.head .txt{font-size:13px;color:var(--tx2)}
.head .txt b{font-weight:500;color:var(--tx)}
.head .undo{font-size:13px;font-weight:500;padding:3px 11px;border-radius:12px;background:rgba(255,255,255,.07);transition:background .2s}
.head .undo:hover{background:rgba(255,255,255,.13)}
.size{margin-left:auto;display:flex;gap:14px;height:20px;align-items:flex-start}
.size button{position:relative;font-size:12px;line-height:16px;color:var(--tx3);transition:color .25s}
.size button:hover{color:var(--tx2)}
.size button[aria-checked="true"]{color:var(--tx)}
.size button[aria-checked="true"]::after{content:"";position:absolute;left:50%;bottom:-4px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:rgba(255,255,255,.7)}

.body{display:grid;grid-template-columns:236px minmax(0,1fr);column-gap:40px;padding:6px 36px 26px}

/* index */
.idx{display:flex;flex-direction:column}
.it{display:block;white-space:nowrap;width:100%}
.it .l1{display:flex;align-items:center;gap:14px;height:54px;transition:height .5s var(--ease)}
.sz-s .it .l1{height:46px}
.sz-l .it .l1{height:44px}
.it .dot{flex:none;width:9px;height:9px;border-radius:50%;box-shadow:inset 0 0 0 1.5px rgba(235,235,245,.28);transition:background .35s,box-shadow .35s}
.it .nm{font-size:27px;font-weight:600;letter-spacing:-.022em;color:rgba(235,235,245,.34);transition:color .3s}
.it .md{margin-left:auto;font-size:12px;color:var(--tx3);transition:color .3s}
.it:hover .nm{color:var(--tx2)}
.it.sel .nm{color:var(--tx)}
.it.sel .md{color:var(--tx2)}
.it .sb>div{padding:0 0 12px 23px;font-size:12px;line-height:16px;color:var(--tx3)}
.it.sel .sb>div{color:var(--tx25)}

/* folds: blocks that open with the size */
.fold{display:grid;grid-template-rows:1fr;transition:grid-template-rows .5s var(--ease),opacity .35s}
.fold>div{min-height:0;overflow:hidden}
.sz-s .fm,.sz-s .fl,.sz-m .fl,.sz-s .fmo,.sz-l .fmo{grid-template-rows:0fr;opacity:0;pointer-events:none}
.rv{display:none}
.sz-s .rv{display:inline}

/* detail */
.det{position:relative;padding-top:6px}
.det .in{transition:opacity .22s,transform .35s var(--ease)}
.det .in.swap{opacity:0;transform:translateY(6px)}
.lab{font-size:12px;color:var(--tx3);line-height:16px}
.big{display:flex;align-items:baseline;gap:6px;white-space:nowrap;height:46px}
.big .n{font-size:42px;font-weight:500;letter-spacing:-.02em;line-height:46px}
.big .u{font-size:15px;color:var(--tx2)}
.big .n2{margin-left:18px;font-size:15px;color:var(--tx2)}
.big .n2 b{font-weight:500;color:var(--tx)}
.ins{margin-top:6px;font-size:15px;line-height:22px;color:var(--tx2);min-height:44px;text-wrap:pretty}
.ins b{font-weight:500;color:var(--tx)}

.g{padding-top:18px}
.gv{height:36px;position:relative}
.two{display:grid;grid-template-columns:1fr 1fr;column-gap:24px}
.gt{display:flex;align-items:baseline;gap:5px;height:18px;white-space:nowrap;font-size:13px}
.gt .gl{font-size:12px;color:var(--tx3);margin-right:3px}
.gt b{font-weight:500}
.gt .u{font-size:12px;color:var(--tx2)}
.gt .r{margin-left:auto;font-size:12px;color:var(--tx3)}
.tr{position:relative;height:6px;border-radius:3px;background:var(--trk);margin-top:8px}
.tr i{position:absolute;top:0;bottom:0;left:0;width:0;border-radius:3px}
.tr .f{background:var(--use);transition:width .7s var(--ease)}
.tr .sg{background:var(--c);transition:left .7s var(--ease),width .7s var(--ease);border-radius:0 3px 3px 0}
.tr .tk{top:-4px;bottom:-4px;width:2px;margin-left:-1px;border-radius:1px;background:#fff;transition:left .55s var(--ease),opacity .3s}
.split{display:flex;gap:2px;height:6px;margin-top:6px}
.split i{height:6px;border-radius:2px;width:0;transition:width .7s var(--ease),background .35s}
.cap{margin-top:4px;height:16px;font-size:12px;line-height:16px;color:var(--tx3);white-space:nowrap}
.cap em{font-style:normal;color:var(--c)}
.rings{display:flex;justify-content:space-between;height:36px}
.ring{display:flex;flex-direction:column;align-items:center;gap:2px;width:40px}
.ring svg{display:block}
.ring circle.a{transition:stroke-dashoffset .8s var(--ease),stroke .35s}
.ring span{font-size:11px;line-height:12px;color:var(--tx3)}
.ring.hot span{color:var(--tx2)}
.cols{display:flex;gap:4px;height:36px;align-items:flex-end}
.col{flex:1;height:36px;border-radius:3px;background:var(--trk);position:relative;overflow:hidden}
.col i{position:absolute;left:0;right:0;bottom:0;height:0;border-radius:3px;transition:height .7s var(--ease),background .35s,box-shadow .35s}
.pips{display:flex;gap:5px;margin-top:9px}
.pips i{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.1);transition:background .35s,box-shadow .35s}
.det.off .g .gv{opacity:.35}

/* items */
.cmp{padding-top:14px;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(3,26px);grid-auto-flow:column;column-gap:20px}
.ci{display:flex;align-items:center;gap:6px;min-width:0;white-space:nowrap;font-size:13px;color:var(--tx2)}
.ci .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.ci .ac{font-size:12px;color:var(--tx3)}
.ci.on{color:var(--tx)}
.ci.on .ac,.row.on .ac{color:var(--c)}
.rows{padding-top:14px}
.row{display:grid;grid-template-columns:var(--cols);column-gap:10px;align-items:center;height:24px;white-space:nowrap;font-size:13px;color:var(--tx2)}
.row>*{min-width:0;overflow:hidden;text-overflow:ellipsis}
.row .c3{color:var(--tx3);font-size:12px}
.row .c4{text-align:right}
.row .ac{text-align:right;font-size:12px;color:var(--tx3)}
.row.on{color:var(--tx)}
.ico{flex:none;display:block;width:16px;height:16px}
.bdg{flex:none;width:16px;height:16px;border-radius:50%;background:rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;transition:background .35s}
.on .bdg{background:color-mix(in srgb,var(--c) 26%,transparent)}
.det.off .cmp,.det.off .rows{opacity:.55}

/* settings */
.set{margin-top:22px}
.modes{position:relative;display:flex;gap:26px;height:46px;align-items:flex-start}
.modes button{font-size:30px;font-weight:600;letter-spacing:-.02em;line-height:36px;color:var(--tx3);transition:color .3s}
.modes button:hover{color:var(--tx2)}
.modes button[aria-checked="true"]{color:var(--tx)}
.bar{position:absolute;left:0;top:41px;height:2px;border-radius:1px;background:var(--c);transition:transform .45s var(--ease),width .45s var(--ease),background .35s}
.rule{margin-top:6px;font-size:15px;line-height:22px;color:var(--tx2);min-height:22px;text-wrap:pretty}
.choose>div{padding:14px 0 8px}
.choose .lab{margin-bottom:6px}
.sz-l .choose>div{display:flex;align-items:baseline;gap:20px}
.sz-l .choose .lab{margin:0;flex:none}
.opts{display:flex;gap:20px;height:22px;align-items:flex-start;white-space:nowrap}
.opts button{position:relative;font-size:15px;color:var(--tx3);line-height:20px;transition:color .25s}
.opts button:hover{color:var(--tx2)}
.opts button[aria-checked="true"]{color:var(--tx);font-weight:500}
.opts button[aria-checked="true"]::after{content:"";position:absolute;left:50%;bottom:-6px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--c)}
.det.off .choose{opacity:.3;pointer-events:none}
.det.off .big .n{font-size:20px;font-weight:500;color:var(--tx3)}

.foot{display:flex;align-items:center;gap:28px;height:50px;padding:0 36px;border-top:1px solid var(--line);white-space:nowrap}
.sw{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--tx2);transition:color .2s}
.sw i{width:32px;height:19px;border-radius:10px;background:rgba(255,255,255,.14);position:relative;transition:background .25s;flex:none}
.sw i::after{content:"";position:absolute;left:2px;top:2px;width:15px;height:15px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .25s var(--ease)}
.sw[aria-checked="true"]{color:var(--tx)}
.sw[aria-checked="true"] i{background:#5B9BFF}
.sw[aria-checked="true"] i::after{transform:translateX(13px)}
.foot .hint{margin-left:auto;font-size:11px;color:var(--tx3);transition:opacity .3s}
.sz-s .foot .hint{opacity:0}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important}}
</style>
</head>
<body>

  <div class="mb">

const G = {
  apps:'<rect x="4.2" y="4.2" width="7.6" height="7.6" rx="1.6"/><path d="M6.6 1.8v2.4M9.4 1.8v2.4M6.6 11.8v2.4M9.4 11.8v2.4M1.8 6.6h2.4M1.8 9.4h2.4M11.8 6.6h2.4M11.8 9.4h2.4"/>',

  disk:'<ellipse cx="8" cy="4" rx="5.5" ry="2"/><path d="M2.5 4v8c0 1.1 2.5 2 5.5 2s5.5-.9 5.5-2V4M2.5 8c0 1.1 2.5 2 5.5 2s5.5-.9 5.5-2"/>',
  awake:'<path d="M1.8 8s2.3-4.3 6.2-4.3S14.2 8 14.2 8s-2.3 4.3-6.2 4.3S1.8 8 1.8 8z"/><circle cx="8" cy="8" r="1.9"/>',
  one:'<circle cx="8" cy="8" r="5.8"/><path d="M8 4.6v3.6l2.4 1.4"/>'

const gl=(k,c,s,w)=>`<svg viewBox="0 0 16 16" width="${s}" height="${s}" fill="none" stroke="${c}" stroke-width="${w||1.6}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${G[k]}</svg>`;
const sq=(bg,inner)=>`<svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><rect width="16" height="16" rx="4" fill="${bg}"/>${inner}</svg>`;
const IC={
  chrome:`<span class="ico" style="border-radius:50%;background:radial-gradient(circle,#4c8bf5 0 27%,#fff 28% 37%,transparent 38%),conic-gradient(from -60deg,#ea4335 0 120deg,#fbbc04 0 240deg,#34a853 0)"></span>`,
  testing:`<span class="ico" style="border-radius:50%;background:radial-gradient(circle,#e8a33c 0 27%,#fff 28% 37%,transparent 38%),conic-gradient(from -60deg,#8f98a6 0 120deg,#b7bec9 0 240deg,#6c7480 0)"></span>`,
  spotify:`<svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="8" fill="#1ed760"/><path d="M4 6.2c2.7-.8 5.6-.5 8 .8M4.6 8.4c2.2-.6 4.4-.4 6.4.7M5.2 10.5c1.7-.4 3.3-.3 4.8.5" fill="none" stroke="#10331d" stroke-width="1.3" stroke-linecap="round"/></svg>`,
  raycast:sq('#ff6363','<path d="M4.5 11.5l7-7M4.5 7.5l4 4M8.5 4.5l3 3" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/>'),
  figma:sq('#2a2a31','<circle cx="6.6" cy="5" r="1.7" fill="#f24e1e"/><circle cx="9.4" cy="5" r="1.7" fill="#ff7262"/><circle cx="6.6" cy="8" r="1.7" fill="#a259ff"/><circle cx="9.4" cy="8" r="1.7" fill="#1abcfe"/><circle cx="6.6" cy="11" r="1.7" fill="#0acf83"/>'),

  claude:sq('#d97757','<path d="M8 3.6v8.8M3.6 8h8.8M4.9 4.9l6.2 6.2M11.1 4.9l-6.2 6.2" stroke="#fff" stroke-width="1.4" stroke-linecap="round"/>'),

};
const badge=k=>`<span class="bdg">${gl(k,'currentColor',10,1.8)}</span>`;

 {id:'apps',name:'Apps',c:'#5B9BFF',mode:2,lab:'When load is above',vals:['60 %','70 %','80 %','90 %'],v:1,

 {id:'servers',name:'Servers',c:'#3FD0B8',mode:2,lab:'Idle for',vals:['30 min','1 h','2 h','4 h','1 day'],v:2,

  graph:()=>`<div class="gv rings">${SRV_ORDER.map(i=>{const r=SRV[i];return `<div class="ring" id="rg${i}"><svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><circle cx="11" cy="11" r="9" fill="none" stroke="rgba(255,255,255,.09)" stroke-width="2.6" ${r.kept?'stroke-dasharray="2 3"':''}/><circle class="a" id="ra${i}" cx="11" cy="11" r="9" fill="none" stroke="var(--c)" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="${CIRC}" stroke-dashoffset="${CIRC}" transform="rotate(-90 11 11)"/></svg><span>${r.p}</span></div>`}).join('')}</div><div class="cap" id="g-cap"></div>`,
  apply:s=>{const th=IDLE_MIN[s.v];

 {id:'trees',name:'Worktrees',c:'#4CC96B',mode:1,lab:'After merge',vals:['1 h','1 day','1 week'],v:1,

  rv:s=>` ${s.vals[s.v][0].toUpperCase()+s.vals[s.v].slice(1)} after merge.`,
  sub:s=>s.mode?'4 merged · 5.7 GB':'Not watching',
  now:s=>s.mode?['4','merged',s.mode===2?'<b>5.7</b> GB to free':'<b>5.7</b> GB']:['Not watching'],
  ins:s=>'<b>4 merged worktrees</b> hold 5.7 GB. auth-redirect still runs a server on :4000.',
  graph:()=>`<div class="gv cols">${WT.map((w,i)=>`<div class="col" title="${w.n}"><i id="wc${i}"></i></div>`).join('')}</div><div class="cap" id="g-cap"></div>`,
  apply:s=>{const ah=AFTER_H[s.v];let n=0,gb=0;
    WT.forEach((w,i)=>{const e=$('wc'+i);if(!e)return;e.style.height=(w.gb/3.2*100)+'%';

      if(w.st==='stale') e.style.boxShadow='inset 0 0 0 1.5px rgba(255,255,255,.3)'});
    cap(`Height is size · <em>solid</em>: merged over ${s.vals[s.v]} ago, ${n} · ${gb.toFixed(1)} GB · faint: waiting`)},
  items:s=>{const ah=AFTER_H[s.v];return WT_ROWS.map(i=>{const w=WT[i];const ready=w.st==='merged'&&w.h>=ah;
      const ac=w.st==='stale'?'stale':ready?(s.mode===2?'removes':s.mode?'shown':'merged'):'in '+ago((ah-w.h)*60);
      return {on:ready&&s.mode>0,ic:badge('trees'),sn:w.sn||w.n,n:w.n,cells:[['c3',w.st==='stale'?'stale '+w.d+' d':(w.how?'squashed':'merged')+' '+ago(w.h*60)],['c4',(w.gb<1?Math.round(w.gb*1000)+' MB':w.gb+' GB')]],ac}})},
  rowsCols:'16px minmax(0,1fr) 92px 60px 60px'},
 {id:'disk',name:'Disk',c:'#F2B544',mode:2,lab:'How often',vals:['daily','weekly','monthly'],v:1,

  rv:s=>` ${s.vals[s.v][0].toUpperCase()+s.vals[s.v].slice(1)}.`,
  sub:s=>s.mode?'30 GB safe · next '+NEXT[s.v].replace('on ',''):'Not watching',
  now:s=>s.mode?['30','GB safe',(s.mode===2?'next ':'check ')+NEXT[s.v]]:['Not watching'],
  ins:s=>'<b>182 GB free.</b> Xcode keeps 14.2 GB of builds for 4 projects that are gone.',
  graph:()=>`<div class="gv"><div class="gt"><span class="gl">Disk</span><b>812</b><span class="u">/ 994 GB</span><span class="r">182 GB free</span></div>
     <div class="tr" style="margin-top:4px"><i class="f" id="g-df"></i><i class="sg" id="g-ds"></i></div>
     <div class="split">${DISK.map((d,i)=>`<i id="ds${i}"></i>`).join('')}</div></div><div class="cap" id="g-cap"></div>`,
  apply:s=>{W('g-df',81.7);seg('g-ds',77.8,3.9);
    DISK.forEach((d,i)=>{const e=$('ds'+i);if(!e)return;e.style.width=`calc((100% - 10px) * ${d.gb/38.4})`;
      e.style.background=d.k==='safe'?`color-mix(in srgb,var(--c) ${[100,78,58][i]}%,transparent)`:'rgba(255,255,255,'+(d.k==='ask'?.22:.12)+')'});
    cap(`Below: the 38.4 GB of clutter · <em>amber</em>, 30.1 GB, ${s.mode===2?'goes to the Trash':'is safe'} ${NEXT[s.v]}`)},
  items:s=>DISK.map(d=>{const safe=d.k==='safe';

  rowsCols:'16px minmax(0,1fr) 116px 56px 60px'},
 {id:'awake',name:'Keep Awake',c:'#B18CFF',mode:2,lab:'Ends at battery',vals:['10 %','20 %','30 %','never'],v:1,

  ins:s=>s.mode===2?'<b>Awake because 4 agents are working.</b> It sleeps when they end, or if it runs hot or loses network.':s.mode?'<b>4 agents are working.</b> You get asked before it stays awake.':'<b>4 agents are working</b>, but the Mac sleeps as usual.',
  graph:()=>`<div class="gv two">
     <div><div class="gt"><span class="gl">Agents</span><b>4</b><span class="u">of 12 working</span></div><div class="pips">${AG.map((a,i)=>`<i id="pp${i}"></i>`).join('')}</div></div>
     <div><div class="gt"><span class="gl">Battery</span><b>64</b><span class="u">%</span><span class="r">on power</span></div><div class="tr"><i class="f" id="g-bf"></i><i class="tk" id="g-bt"></i></div></div>
   </div><div class="cap" id="g-cap"></div>`,
  apply:s=>{W('g-bf',64);const t=[10,20,30,null][s.v];const tk=$('g-bt');
    if(tk){tk.style.opacity=t?1:0; if(t) tk.style.left=t+'%'}
    AG.forEach((a,i)=>{const e=$('pp'+i);if(!e)return;
      e.style.background=a.st==='work'?(s.mode===2?'var(--c)':'rgba(255,255,255,.55)'):'rgba(255,255,255,.1)';
      e.style.boxShadow=a.st==='need'?'inset 0 0 0 1.5px rgba(255,255,255,.6)':'none'});
    cap(s.mode===2?`<em>Purple</em>: agents holding it awake · tick: ${t?'sleeps at '+t+' %':'battery never stops it'}`:s.mode?`Asks before the next agent keeps it awake · tick: ${t?t+' %':'never'}`:'Not holding the Mac awake')},
  items:s=>AG.slice(0,6).map(a=>{const w=a.st==='work';
      const ac=w?(s.mode===2?'keeps awake':s.mode?'will ask':'working'):a.st==='need'?'needs you':'idle';
      return {on:w&&s.mode>0,ic:IC[a.ic],sn:a.n,n:a.n,cells:[['c3',a.t],['c4',a.tm]],ac:ac,cac:w&&s.mode===2?'awake':ac}}),

const $=id=>document.getElementById(id);
const W=(id,p)=>{const e=$(id);if(e)e.style.width=p+'%'};
const L=(id,p)=>{const e=$(id);if(e)e.style.left=p+'%'};
const seg=(id,l,w)=>{const e=$(id);if(e){e.style.left=l+'%';e.style.width=w+'%'}};
const cap=h=>{const e=$('g-cap');if(e)e.innerHTML=h};
let sel='apps', size='m';
const cur=()=>S.find(s=>s.id===sel);

function dot(s){return s.mode===2?`background:${s.c};box-shadow:none`:s.mode===1?`background:transparent;box-shadow:inset 0 0 0 1.5px ${s.c}`:''}
function renderIdx(){
  $('idx').innerHTML=S.map(s=>`<button class="it${s.id===sel?' sel':''}" role="tab" aria-selected="${s.id===sel}" data-s="${s.id}" id="it-${s.id}">
    <span class="l1"><i class="dot" style="${dot(s)}"></i><span class="nm">${s.name}</span><span class="md">${MODES[s.mode]}</span></span>
    <span class="fold fl sb"><div id="sb-${s.id}">${s.sub(s)}</div></span></button>`).join('');
}
function bigHTML(s){const n=s.now(s);
  return n.length===1?`<span class="n">${n[0]}</span>`:`<span class="n">${n[0]}</span><span class="u">${n[1]}</span>${n[2]?`<span class="n2">${n[2]}</span>`:''}`}
function itemsHTML(s){
  const it=s.items(s);
  const cmp=it.map(x=>`<div class="ci${x.on?' on':''}">${x.ic}<span class="nm">${x.sn}</span><span class="ac">${x.cac||x.ac}</span></div>`).join('');
  const rows=it.map(x=>`<div class="row${x.on?' on':''}" style="--cols:${s.rowsCols}">${x.ic}<span>${x.n}</span>${x.cells.map(c=>`<span class="${c[0]}">${c[1]}</span>`).join('')}<span class="ac">${x.ac}</span></div>`).join('');
  return [cmp,rows];
}
function detHTML(s){
  const [cmp,rows]=itemsHTML(s);
  return `<div class="lab">Now</div><div class="big" id="big">${bigHTML(s)}</div>
    <p class="ins" id="ins">${s.ins(s)}</p>
    <div class="fold fm"><div><div class="g">${s.graph()}</div></div></div>
    <div class="fold fmo"><div><div class="cmp" id="cmp">${cmp}</div></div></div>
    <div class="fold fl"><div><div class="rows" id="rows">${rows}</div></div></div>
    <div class="set">
      <div class="modes" role="radiogroup" aria-label="${s.name} mode">
        ${MODES.map((m,i)=>`<button role="radio" aria-checked="${i===s.mode}" data-m="${i}">${m}</button>`).join('')}
        <i class="bar" id="bar"></i></div>
      <p class="rule" id="rule"></p>
      <div class="fold fm choose"><div><div class="lab">${s.lab}</div>
        <div class="opts" role="radiogroup" aria-label="${s.lab}">${s.vals.map((v,i)=>`<button role="radio" aria-checked="${i===s.v}" data-v="${i}">${v}</button>`).join('')}</div></div></div>
    </div>`;
}
function ruleHTML(s){return s.rule[s.mode]+(s.mode?`<span class="rv">${s.rv(s)}</span>`:'')}
function placeBar(instant){
  const s=cur(), b=$('bar'), t=document.querySelector(`.modes button[data-m="${s.mode}"]`);
  if(!b||!t) return;
  if(instant) b.style.transition='none';
  b.style.width=t.offsetWidth+'px'; b.style.transform=`translateX(${t.offsetLeft}px)`;
  b.style.opacity=s.mode?1:.35;
  if(instant){ void b.offsetWidth; b.style.transition='' }
}
function renderDet(animate){
  const s=cur(), d=$('det'), inn=$('in');
  const fill=()=>{ d.style.setProperty('--c',s.c); inn.innerHTML=detHTML(s); $('rule').innerHTML=ruleHTML(s); d.classList.toggle('off',!s.mode); placeBar(true);
    requestAnimationFrame(()=>requestAnimationFrame(()=>s.apply(s))) };
  if(!animate){ fill(); return }
  inn.classList.add('swap');
  setTimeout(()=>{ fill(); requestAnimationFrame(()=>inn.classList.remove('swap')) },170);
}
function update(){
  const s=cur(), d=$('det');
  d.classList.toggle('off',!s.mode);
  document.querySelectorAll('.modes button').forEach(b=>b.setAttribute('aria-checked',String(+b.dataset.m===s.mode)));
  document.querySelectorAll('.opts button').forEach(b=>b.setAttribute('aria-checked',String(+b.dataset.v===s.v)));
  $('rule').innerHTML=ruleHTML(s); $('big').innerHTML=bigHTML(s); $('ins').innerHTML=s.ins(s);
  const [cmp,rows]=itemsHTML(s); $('cmp').innerHTML=cmp; $('rows').innerHTML=rows;
  $('sb-'+s.id).textContent=s.sub(s);
  s.apply(s); placeBar(false);
}
function renderToday(){
  $('today').innerHTML = undone
   ? `<span class="lbl">Today</span><span class="txt">Reopened 2 apps, started 3 servers</span><button class="undo" id="redo">Redo</button>`
   : `<span class="lbl">Today</span><span class="txt">Closed <b>2 apps</b>, stopped <b>3 servers</b></span><button class="undo" id="undo">Undo</button>`;
}
function setUndone(u){undone=u;renderToday();S.forEach(s=>{const e=$('sb-'+s.id);if(e)e.textContent=s.sub(s)});update()}
function renderIcons(){
  const one=$('one').getAttribute('aria-checked')==='true', box=$('icons');
  if(!box.querySelector('.mi')) box.insertAdjacentHTML('beforeend',S.map(s=>`<span class="mi" id="mi-${s.id}" data-s="${s.id}" title="${s.name}">${gl(s.id,'#fff',16)}</span>`).join('')+`<span class="mi off" id="mi-one" title="MinMacs">${gl('one','#fff',16)}</span>`);
  S.forEach(s=>$('mi-'+s.id).classList.toggle('off',one||s.mode===0));
  $('mi-one').classList.toggle('off',!one);
  setTimeout(aim,420); aim();
}
function anchor(){
  if($('one').getAttribute('aria-checked')==='true') return $('mi-one');
  const s=cur(); if(s.mode) return $('mi-'+s.id);
  return [...document.querySelectorAll('.mi:not(.off)')][0]||null;
}
// the sheet's right edge is fixed (stage x 1100), so the nub is placed from the right edge and does not move while the sheet resizes
function aim(){
  const a=anchor(), hl=$('hl'), box=$('icons');
  if(!a){ hl.style.opacity=0; return }
  const x=a.offsetLeft+8;
  hl.style.opacity=1; hl.style.transform=`translateX(${x-14}px)`;
  const st=$('stage'), k=st.getBoundingClientRect().width/1280;
  const bx=(box.getBoundingClientRect().left-st.getBoundingClientRect().left)/k;
  $('nub').style.transform=`translateX(${bx+x-(1100-1-9)}px)`;
}
function select(id){
  if(id===sel) return; sel=id;
  document.querySelectorAll('.it').forEach(e=>{const on=e.dataset.s===id; e.classList.toggle('sel',on); e.setAttribute('aria-selected',on)});
  renderDet(true); aim();
}
function setMode(m){
  const s=cur(); if(s.mode===m) return; s.mode=m;
  const it=$('it-'+s.id); it.querySelector('.dot').setAttribute('style',dot(s)); it.querySelector('.md').textContent=MODES[m];
  update(); renderIcons();
}
function setSize(z){
  size=z; const sh=$('sheet'); sh.classList.remove('sz-s','sz-m','sz-l'); sh.classList.add('sz-'+z);
  document.querySelectorAll('.size button').forEach(b=>b.setAttribute('aria-checked',String(b.dataset.z===z)));
  try{localStorage.setItem('mm24a-size',z)}catch(e){}
  const t0=performance.now();(function f(){placeBar(true);if(performance.now()-t0<600)requestAnimationFrame(f)})();
}

document.addEventListener('click',e=>{
  const it=e.target.closest('.it'); if(it){ select(it.dataset.s); return }
  const mb=e.target.closest('.modes button'); if(mb){ setMode(+mb.dataset.m); return }
  const ob=e.target.closest('.opts button'); if(ob){ cur().v=+ob.dataset.v; update(); return }
  const zb=e.target.closest('.size button'); if(zb){ setSize(zb.dataset.z); return }
  const mi=e.target.closest('.mi'); if(mi&&mi.dataset.s){ select(mi.dataset.s); return }
  if(e.target.closest('#undo')){setUndone(true);return}
  if(e.target.closest('#redo')){setUndone(false);return}
  const sw=e.target.closest('.sw'); if(sw){ sw.setAttribute('aria-checked',String(sw.getAttribute('aria-checked')!=='true')); renderIcons() }
});
document.addEventListener('keydown',e=>{
  const it=e.target.closest&&e.target.closest('.it'); if(!it) return;
  const i=S.findIndex(s=>s.id===it.dataset.s);
  const j = e.key==='ArrowDown'?Math.min(4,i+1): e.key==='ArrowUp'?Math.max(0,i-1): -1;
  if(j<0) return; e.preventDefault(); select(S[j].id); $('it-'+S[j].id).focus();
});

function fit(){const st=$('stage'),k=Math.min(innerWidth/1280,innerHeight/800);st.style.transform=`translate(${(innerWidth-1280*k)/2}px,${(innerHeight-800*k)/2}px) scale(${k})`;aim()}
addEventListener('resize',fit);

renderIdx(); renderDet(false); renderToday(); renderIcons(); fit();
document.fonts&&document.fonts.ready.then(()=>{placeBar(true);aim()});
