<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Headline and Picture</title>
<!--
COMPOSITION: Headline and Picture (32-b)
Sheet 960 x 708 hangs from the selected menu bar icon. Left: Live Index (300 px). Right: a two-column spread,
both columns vertically centered on the same axis, 40 px gutter, 8 px spacing scale.

  +---------------------------+   +-----------------------+
  |                           |   | (badge) Idle hold     |
  | 3 servers sit idle,       |   | 1.45 GB               |   right: the picture. One large ftop graph made of the
  | one with no owner.        |   |  _   _                |          items themselves (columns, ring, gauge), one
  | MinMacs [stops] them      |   | | | | | |  |          |          caption in words. Hover a mark: the caption
  | after [2 hours].          |   | | |_| |_|  |_         |          names it.
  |                           |   | :3000 :5173 ...       |
  | [Close Idle 3 · 1.45 GB]  |   | caption               |
  +---------------------------+   +-----------------------+
     left: the headline, the only big type. Its words are live: hovering "3 servers", "one", the mode
     verb, the value or the action turns the picture into exactly those items, each with its hover actions.
     Leave the sheet and the picture comes back.
The SETTING lives in the headline: the mode is the verb, the value is the time word, click either to change it.
Reading order: headline -> picture -> action. The list appears only when a word asks for it, so the resting view
is two things only: a sentence and a picture.
-->
<style>
:root{
  --glass:rgba(28,29,38,.88);
  --line:rgba(255,255,255,.06);
  --tx:rgba(255,255,255,.94);
  --tx2:rgba(235,235,245,.6);
  --tx3:rgba(235,235,245,.34);
  --g1:rgba(255,255,255,.06);
  --g2:rgba(255,255,255,.2);
  --g3:rgba(255,255,255,.42);
  --rowbg:#2b2b39;
  --ease:cubic-bezier(.3,.7,.2,1);
  --c:#fff;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#1a1636}
body{font-family:-apple-system,"SF Pro Text",system-ui,sans-serif;color:var(--tx);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;font-size:13px;line-height:18px;cursor:default;user-select:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;text-align:left;letter-spacing:inherit}
b{font-weight:500;color:var(--tx)}
:focus{outline:none}
:focus-visible{outline:2px solid rgba(255,255,255,.55);outline-offset:2px;border-radius:6px}
#stage{position:absolute;left:0;top:0;width:1280px;height:800px;transform-origin:0 0;overflow:hidden;
  background:
   radial-gradient(760px 560px at 10% 6%,#4b3c9e 0%,rgba(75,60,158,0) 70%),
   radial-gradient(700px 520px at 84% 2%,#22618f 0%,rgba(34,97,143,0) 70%),
   radial-gradient(820px 620px at 88% 104%,#a0436f 0%,rgba(160,67,111,0) 70%),
   radial-gradient(640px 520px at 18% 100%,#3a2463 0%,rgba(58,36,99,0) 75%),
   #1d1a3c}

/* menu bar */
.mb{position:absolute;left:0;right:0;top:0;height:26px;display:flex;align-items:center;justify-content:space-between;padding:0 12px 0 16px;background:rgba(18,14,40,.32);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);font-size:13px;color:rgba(255,255,255,.92);z-index:5}
.mb-l,.mb-r{display:flex;align-items:center;gap:18px}
.mb-l b{font-weight:700;color:#fff}
.mb-r{gap:14px}
.icons{position:relative;display:flex;align-items:center;gap:12px}
.hl{position:absolute;top:-3px;left:0;height:22px;width:28px;border-radius:6px;background:rgba(255,255,255,.2);transition:transform .45s var(--ease),opacity .3s;pointer-events:none}
.mi{position:relative;display:flex;width:16px;overflow:hidden;cursor:pointer;transition:width .4s var(--ease),opacity .3s,margin .4s var(--ease)}
.mi.off{width:0;opacity:0;margin-left:-12px}

/* sheet */
.sheet{position:absolute;top:34px;background:var(--glass);backdrop-filter:blur(36px) saturate(1.5);-webkit-backdrop-filter:blur(36px) saturate(1.5);border:1px solid rgba(255,255,255,.085);border-radius:22px;box-shadow:0 34px 100px rgba(6,4,24,.5),inset 0 1px 0 rgba(255,255,255,.035);animation:drop .6s var(--ease) both}
@keyframes drop{from{opacity:0;transform:translateY(-10px)}}
.nub{position:absolute;top:-8px;left:0;width:18px;height:8px;margin-left:-9px;transition:transform .45s var(--ease)}
.nub svg{display:block}

.head{display:flex;align-items:center;gap:12px;height:56px;padding:0 32px;white-space:nowrap}
.head .lbl{font-size:11px;color:var(--tx3)}
.head .txt{color:var(--tx2)}
.head .undo{margin-left:auto;font-weight:500;height:26px;padding:0 12px;border-radius:13px;background:rgba(255,255,255,.07);transition:background .2s}
.head .undo:hover{background:rgba(255,255,255,.13)}

.body{display:grid;column-gap:44px;padding:0 32px;grid-template-rows:minmax(0,1fr)}

/* ---------- live index ---------- */
.idx{display:flex;flex-direction:column;min-height:0}
.it{display:flex;align-items:center;gap:12px;flex:1;max-height:96px;min-height:0;border-radius:14px;padding:0 8px;margin:0 -8px;width:calc(100% + 16px);transition:background .25s}
.it:hover{background:rgba(255,255,255,.03)}
.it .dot{flex:none;width:9px;height:9px;border-radius:50%;box-shadow:inset 0 0 0 1.5px rgba(235,235,245,.28);transition:background .35s,box-shadow .35s,transform .3s}
.it .nm{flex:1;font-size:22px;line-height:28px;font-weight:600;letter-spacing:-.02em;color:rgba(235,235,245,.36);transition:color .3s;white-space:nowrap}
.it:hover .nm{color:var(--tx2)}
.it.sel .nm{color:var(--tx)}
.it.flash .dot{transform:scale(1.5)}
.mg{flex:none;position:relative;width:56px;height:24px;display:flex;align-items:flex-end;justify-content:space-between;transition:opacity .4s,filter .4s}
.it.m0 .mg{opacity:.28;filter:grayscale(1)}
.mg i{display:block;transition:height .55s var(--ease),width .55s var(--ease),left .55s var(--ease),background .35s,box-shadow .35s}
.mg .tr{position:absolute;left:0;right:0;top:9px;height:6px;border-radius:3px;background:var(--g1)}
.mg .tr i{position:absolute;top:0;bottom:0;border-radius:3px}
.mg .tr .tk{top:-4px;bottom:-4px;width:2px;margin-left:-1px;border-radius:1px;background:#fff}
.mg.mc i{flex:none;border-radius:2px}
.mg.dots{flex-wrap:wrap;align-content:center;justify-content:space-between;row-gap:4px}
.mg.dots i{width:6px;height:6px;border-radius:50%}
.mg.ring{justify-content:flex-end;align-items:center}
.nb{flex:none;width:92px;display:flex;flex-direction:column;align-items:flex-end;white-space:nowrap}
.nb .n{font-size:13px;font-weight:500;line-height:18px;color:var(--tx2);transition:color .3s}
.nb .n u{text-decoration:none;font-size:11px;font-weight:400;color:var(--tx3);margin-left:3px}
.nb .cp{font-size:11px;line-height:15px;color:var(--tx3)}
.it.sel .nb .n{color:var(--tx)}
.it.m0 .nb .n{color:var(--tx3);font-weight:400}

/* ---------- headline + its words ---------- */
.hed{font-size:var(--hs,36px);line-height:var(--hl,44px);font-weight:600;letter-spacing:-.024em;text-wrap:pretty;color:var(--tx)}
.hed .s1t{display:block;text-wrap:balance}
.hed .sn2{display:block;color:var(--tx2)}
.hed .hp{cursor:default;border-radius:6px;transition:color .25s,background .25s;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.hed .hp:hover,.hed .hp.on{color:var(--tx);background:rgba(255,255,255,.06)}
.w{display:inline;font-weight:600;color:var(--tx);cursor:pointer;border-radius:6px;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:7px;text-decoration-color:color-mix(in srgb,var(--c) 70%,transparent);transition:background .2s,text-decoration-color .2s;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.w:hover,.w.open{background:rgba(255,255,255,.07);text-decoration-color:var(--c)}
.w.vw{text-decoration-style:dotted}
.s0 .w{text-decoration-color:rgba(255,255,255,.3)}

/* picker */
.pick{position:absolute;z-index:20;min-width:200px;padding:6px;border-radius:14px;background:rgba(40,40,54,.97);border:1px solid rgba(255,255,255,.09);box-shadow:0 18px 50px rgba(0,0,0,.45);opacity:0;transform:translateY(-4px);pointer-events:none;transition:opacity .18s,transform .28s var(--ease)}
.pick.show{opacity:1;transform:none;pointer-events:auto}
.pick button{display:flex;align-items:baseline;gap:12px;width:100%;height:32px;padding:0 10px;border-radius:9px;white-space:nowrap;align-items:center;transition:background .15s}
.pick button:hover,.pick button:focus-visible{background:rgba(255,255,255,.07);outline:none}
.pick .pl{flex:none;width:34px;font-size:11px;color:var(--tx3)}
.pick .pw{color:var(--tx2)}
.pick button[aria-checked="true"] .pw{color:var(--tx);font-weight:500}
.pick button[aria-checked="true"] .pl{color:var(--c)}
.pick .ph{font-size:11px;color:var(--tx3);padding:4px 10px 6px}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 14px;border-radius:15px;background:rgba(255,255,255,.08);font-weight:500;white-space:nowrap;transition:background .2s,box-shadow .2s}
.btn:hover{background:rgba(255,255,255,.15)}
.btn .tl{font-weight:400;font-size:11px;color:var(--tx3)}
.btn.pri{background:color-mix(in srgb,var(--c) 26%,transparent)}
.btn.pri:hover{background:color-mix(in srgb,var(--c) 38%,transparent)}
.btn.pri .tl{color:rgba(255,255,255,.6)}
.btn.done{background:none;color:var(--tx3);font-weight:400;cursor:default;padding:0}
.ab{height:22px;padding:0 9px;border-radius:11px;background:rgba(255,255,255,.09);font-size:12px;font-weight:500;white-space:nowrap;display:inline-flex;align-items:center;gap:5px;transition:background .2s}
.ab:hover{background:rgba(255,255,255,.18)}
.ab .tl{font-weight:400;font-size:11px;color:var(--tx3)}
.ab.dis{background:none;color:var(--tx3);cursor:default;font-weight:400;padding:0 4px}
.ab.dis .tl{color:rgba(235,235,245,.26)}

/* item cells */
.cell{position:relative;display:grid;grid-template-columns:20px minmax(0,1fr);grid-template-rows:26px 24px;column-gap:12px;align-items:center;height:50px;padding:0 10px;margin:0 -10px;border-radius:12px;transition:background .25s,opacity .3s,transform .35s var(--ease)}
.cell:hover{background:var(--rowbg)}
.cell .ic{grid-row:1/3;display:flex;justify-content:center;align-items:center;width:20px;height:20px;transition:filter .4s,opacity .4s}
.cell .l1,.cell .l2{display:flex;align-items:baseline;gap:10px;min-width:0;white-space:nowrap}
.cell .l1{align-self:end}
.cell .l2{padding-top:2px}
.cell .l2{align-self:start;font-size:11px;line-height:16px;color:var(--tx3)}
.cell .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;color:var(--tx);transition:color .25s}
.cell .vl{flex:none;color:var(--tx2)}
.cell .sb{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.cell .st{flex:none;display:flex;align-items:center;gap:6px;transition:color .35s}
.cell .st .mk{width:6px;height:6px;border-radius:50%;background:var(--c);opacity:0;transition:opacity .3s}
.cell.on .st{color:var(--c)}
.cell.on .st .mk{opacity:1}
.s1 .cell.on .st .mk{background:transparent;box-shadow:inset 0 0 0 1.4px var(--c)}
.cell.dim .nm{color:var(--tx2)}
.cell .acts{position:absolute;left:42px;right:6px;top:25px;height:22px;display:flex;align-items:center;gap:4px;overflow:hidden;opacity:0;transform:translateY(3px);pointer-events:none;transition:opacity .2s,transform .3s var(--ease)}
.cell:hover .acts,.cell:focus-within .acts{opacity:1;transform:none;pointer-events:auto}
.cell .l2{transition:opacity .2s}
.cell:hover .l2,.cell:focus-within .l2{opacity:0}
.cell.more{grid-template-columns:20px minmax(0,1fr);grid-template-rows:1fr;color:var(--tx3);font-size:11px;line-height:16px}
.cell.more:hover{background:none}
.cell.more .ic{grid-row:auto}
.cell.flash{animation:flash 1.8s var(--ease)}
@keyframes flash{0%,40%{background:color-mix(in srgb,var(--c) 24%,transparent)}100%{background:transparent}}
.cell.leave{opacity:0;transform:scale(.97)}
.cell.enter{animation:enter .45s var(--ease) both}
@keyframes enter{from{opacity:0;transform:translateY(6px)}}
.lk{color:var(--tx2);cursor:pointer;border-bottom:1px solid rgba(255,255,255,.16);transition:color .2s,border-color .2s}
.lk:hover{color:var(--tx);border-color:rgba(255,255,255,.5)}
.hold{display:inline-flex;gap:6px;align-items:center}
.hold span{display:inline-flex;align-items:center;gap:2px}
.hold svg{position:relative;top:2px}

/* highlight: hovering a word or an action shows exactly what it touches */
.hlon [data-k]:not(.hit){opacity:.24}
.hlon .cell.hit{background:color-mix(in srgb,var(--c) 14%,transparent)}
.hlon i.hit,.hlon .gm.hit{box-shadow:0 0 0 1px rgba(255,255,255,.7),0 0 12px var(--c)}

/* off: the content quiets down */
.s0 .gr,.s0 .cell .ic{filter:grayscale(1);opacity:.5}

/* graph primitives */
.tb{position:relative;height:6px;border-radius:3px;display:flex;background:var(--g1)}
.tb i{display:block;height:6px;border-radius:3px;flex-basis:0;margin-right:2px;transition:flex-grow .55s var(--ease),background .35s,box-shadow .3s,opacity .3s}
.tb i:last-of-type{margin-right:0}
.tb i.z{margin-right:0}
.tb .tk{position:absolute;top:-4px;height:14px;width:2px;margin:0 0 0 -1px;border-radius:1px;background:#fff;transition:left .55s var(--ease),opacity .3s}
.cols{display:flex;align-items:flex-end;gap:5px}
.cols .cl{flex:1;position:relative;height:100%;border-radius:4px;background:rgba(255,255,255,.04)}
.cols .cl i{position:absolute;left:0;right:0;bottom:0;border-radius:4px;transition:height .55s var(--ease),background .35s,box-shadow .35s,opacity .3s}
.strip{display:flex;gap:4px}
.strip i{flex:1;height:14px;border-radius:5px;transition:background .35s,box-shadow .35s,opacity .3s}
.cap{font-size:11px;line-height:16px;color:var(--tx3);text-wrap:pretty}
.cap b{color:var(--tx2);font-weight:500}

/* footer */
.foot{display:flex;align-items:center;gap:26px;height:56px;padding:0 32px;border-top:1px solid var(--line);white-space:nowrap}
.sw{display:flex;align-items:center;gap:10px;color:var(--tx2)}
.sw i{position:relative;width:32px;height:19px;border-radius:10px;background:rgba(255,255,255,.12);transition:background .3s}
.sw i::after{content:"";position:absolute;left:2px;top:2px;width:15px;height:15px;border-radius:50%;background:#fff;transition:transform .35s var(--ease)}
.sw[aria-checked="true"] i{background:#3d86f5}
.sw[aria-checked="true"] i::after{transform:translateX(13px)}
.foot .hint{margin-left:auto;font-size:11px;color:var(--tx3)}

/* toast */
.toast{position:absolute;left:50%;bottom:72px;transform:translate(-50%,10px);display:flex;align-items:center;gap:14px;height:38px;padding:0 6px 0 16px;border-radius:19px;background:rgba(44,44,58,.97);border:1px solid rgba(255,255,255,.08);box-shadow:0 14px 40px rgba(0,0,0,.4);white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .25s,transform .4s var(--ease);z-index:30}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast .tt{color:var(--tx2)}
.toast button{height:28px;padding:0 13px;border-radius:14px;background:rgba(255,255,255,.1);font-weight:500}
.toast button:hover{background:rgba(255,255,255,.18)}
.toast button.hide{display:none}

.pane{position:relative;min-width:0;min-height:0}
.pane .in{height:100%;transition:opacity .22s,transform .35s var(--ease)}
.pane .in.swap{opacity:0;transform:translateY(6px)}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{transition:none!important;animation:none!important}
}

.sheet{left:232px;width:1024px}
.body{grid-template-columns:300px minmax(0,1fr);height:596px;padding-top:4px;padding-bottom:24px}
.spread{display:grid;grid-template-columns:minmax(0,1fr) 252px;column-gap:40px;height:100%;align-items:center}
.lead{padding-bottom:8px}
.lead .hed{--hs:31px;--hl:39px}
.lead .hed .sn2{text-wrap:balance}
.lead .hed .s1t{text-wrap:pretty}
.lead .hp{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:7px;text-decoration-color:rgba(255,255,255,.2)}
.lead .hp.on{text-decoration-color:rgba(255,255,255,.5)}
.arow{display:flex;flex-wrap:wrap;gap:8px;margin-top:32px}
.pic{position:relative;height:100%;display:flex;flex-direction:column;justify-content:center;transition:opacity .16s}
.pic.swap{opacity:0}
.ph{display:flex;align-items:center;gap:8px;height:20px;font-size:11px;color:var(--tx3);white-space:nowrap}
.pn{display:flex;align-items:baseline;gap:6px;margin-top:6px;white-space:nowrap}
.pn .n{font-size:46px;line-height:52px;font-weight:500;letter-spacing:-.025em}
.pn .u{font-size:13px;color:var(--tx3)}
.gr{margin-top:20px;transition:opacity .4s,filter .4s}
.gcap{margin-top:16px;min-height:32px}
.gcap b{color:var(--tx)}
.big-cols{display:flex;align-items:flex-end;height:250px}
.big-cols .cl{position:relative;flex:1;height:100%;border-radius:6px;background:rgba(255,255,255,.045)}
.big-cols .cl i{position:absolute;left:0;right:0;bottom:0;border-radius:6px;transition:height .6s var(--ease),background .35s,box-shadow .35s}
.big-cols .cl .tk{position:absolute;left:-3px;right:-3px;height:2px;border-radius:1px;background:#fff;transition:bottom .6s var(--ease)}
.big-cols .cl .sg{position:absolute;left:0;right:0;transition:height .6s var(--ease),bottom .6s var(--ease),background .35s}
.gm{cursor:pointer}
.gm:hover i,.gm.hot i{filter:brightness(1.25)}
.labs{display:flex;margin-top:8px;font-size:11px;color:var(--tx3);white-space:nowrap}
.labs span{flex:1;text-align:center}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:12px;font-size:11px;color:var(--tx3);white-space:nowrap}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:8px;height:8px;border-radius:2px}
.center{position:relative;display:flex;align-items:center;justify-content:center}
.center .mid{position:absolute;display:flex;flex-direction:column;align-items:center}
.center .mid .n{font-size:46px;line-height:52px;font-weight:500;letter-spacing:-.025em}
.center .mid .u{font-size:11px;color:var(--tx3);margin-top:2px}
.center svg circle,.center svg path{transition:stroke-dasharray .6s var(--ease),stroke-dashoffset .6s var(--ease),stroke .35s}
.dotrow{display:flex;justify-content:space-between;margin-top:20px}
.dotrow i{width:12px;height:12px;border-radius:50%;transition:background .35s,box-shadow .35s}
/* revealed list */
.rv-h{display:flex;align-items:center;justify-content:space-between;height:32px;border-bottom:1px solid var(--line);font-size:11px;color:var(--tx3);white-space:nowrap;margin-bottom:6px}
.rv-h .t{color:var(--tx2)}
.rv-h button{font-size:11px;color:var(--tx3);height:22px;padding:0 8px;border-radius:11px;margin-right:-8px;transition:color .2s,background .2s}
.rv-h button:hover{color:var(--tx);background:rgba(255,255,255,.07)}

.rv .empty{color:var(--tx3);line-height:20px;padding:8px 0}
.s0 .center svg,.s0 .dotrow{filter:grayscale(1);opacity:.5}
</style>
</head>

<script>
let REV=null, RT=null, GCAP='';
const TIP=(k,t)=>`data-k="${k}" data-tip="${t.replace(/"/g,'&quot;')}"`;
function arcBadge(k,c,f){const r=11,L=2*Math.PI*r;
  return `<span style="position:relative;display:flex;width:26px;height:26px;align-items:center;justify-content:center"><svg width="26" height="26" viewBox="0 0 26 26" style="position:absolute;inset:0"><circle cx="13" cy="13" r="${r}" fill="none" stroke="rgba(255,255,255,.1)" stroke-width="2.2"/><circle data-g="arc" cx="13" cy="13" r="${r}" fill="none" stroke="${c}" stroke-width="2.2" stroke-linecap="round" transform="rotate(-90 13 13)" style="stroke-dasharray:${Math.max(.01,f*L)} ${L};transition:stroke-dasharray .6s var(--ease)"/></svg>${gl(k,c,12,1.6)}</span>`}
const head=(s,k,l,f,n,d,u)=>`<div class="ph">${arcBadge(k,s.mode?s.c:'rgba(235,235,245,.5)',f)}<span>${l}</span></div>
  <div class="pn"><span class="n" data-n="pn-${s.id}" data-v="${n}" data-d="${d}">${(+n).toFixed(d)}</span><span class="u">${u}</span></div>`;
const dec=x=>fmtN(x).includes('.')?fmtN(x).split('.')[1].length:0;

function picture(s){
  const c=s.c,m=s.mode;
  switch(s.id){
    case 'agents':{const w=working().length,f=finished(),max=3.3;
      const cols=AG.map(a=>{const h=gone(a.id)?0:Math.max(3,agHeld(a.id)/max*100);
        return `<span class="cl gm" ${TIP(a.id,(a.n?`<b>${a.n}</b>, ${agState(a)}`:'<b>Idle agent</b>, over 1 hour')+(agHeld(a.id)?`, holds ${fmt(agHeld(a.id))}`:', holds nothing'))}><i data-g="ba-${a.id}" style="height:${h}%;background:${agColor(a)};box-shadow:${agRing(a)}"></i></span>`}).join('');
      return {html:head(s,'agents','Agents at work',w/12,w,0,'of 12')+`<div class="gr"><div class="big-cols" style="gap:6px;height:220px">${cols}</div>
        <div class="legend"><span><i style="background:${c}"></i>working</span><span><i style="background:#fff"></i>needs you</span><span><i style="background:var(--g2)"></i>idle</span><span><i style="box-shadow:inset 0 0 0 1.5px ${c}"></i>finished</span></div></div>`,
        cap:`One column per agent. Height is what it holds: servers and worktree.`}}
    case 'apps':{const L=LOAD(),fr=sum(noiseApps(),cpuOf),M=MEM(),fm=sum(noiseApps(),memOf),thr=s.num[s.v];
      const col=(k,tot,used,free,tick,tip)=>`<span class="cl gm" ${TIP(k,tip)}><i data-g="bp-${k}a" style="height:${(used-free)/tot*100}%;background:var(--g2)"></i><i class="sg" data-g="bp-${k}b" style="bottom:${(used-free)/tot*100}%;height:${free/tot*100}%;background:${m?c:'var(--g2)'};border-radius:6px 6px 0 0"></i>${tick!=null?`<i class="tk" data-g="bp-${k}t" style="bottom:${tick}%"></i>`:''}</span>`;
      return {html:head(s,'apps','System load',L/100,L,0,'%')+`<div class="gr"><div class="big-cols" style="gap:24px;height:220px">
          ${col('load',100,L,fr,thr,`Load <b>${L}&nbsp;%</b>. Closing the noise frees ${Math.round(fr)}&nbsp;%.`)}
          ${col('mem',32,M,fm,null,`Memory <b>${(Math.round(M*10)/10).toFixed(1)} of 32&nbsp;GB</b>. Closing the noise frees ${fmt(fm)}.`)}</div>
        <div class="labs" style="gap:24px"><span>load</span><span>memory, ${(Math.round(M*10)/10).toFixed(1)} of 32&nbsp;GB</span></div></div>`,
        cap:fr?`Blue is what closing the noise frees. The tick is the ${s.vals[s.v].replace(' ','&nbsp;')} line.`:`Nothing left to free. The tick is the ${s.vals[s.v].replace(' ','&nbsp;')} line.`}}
    case 'servers':{const i=idleSrv(),g=sum(i,x=>x.mb/1000);
      const cols=SRV.map(x=>{const idle=x.idle&&!has(x.id,'keep');
        return `<span class="cl gm" ${TIP(x.id,`<b>${x.p} ${x.k}</b>, ${fmt(x.mb/1000)}, ${x.use?'in use':x.kept?'kept':has(x.id,'keep')?'kept by you':'idle '+(x.idle>=1440?Math.round(x.idle/1440)+' days':x.idle>=60?Math.round(x.idle/60)+' h':x.idle+' min')}`)}><i data-g="bs-${x.id}" style="height:${gone(x.id)?0:Math.max(4,x.mb/640*100)}%;background:${gone(x.id)?'transparent':idle?c:'var(--g2)'}"></i></span>`}).join('');
      return {html:head(s,'servers','Idle servers hold',g/2.19,+fmtN(g)||0,dec(g),fmtU(g))+`<div class="gr"><div class="big-cols" style="gap:10px;height:200px">${cols}</div>
        <div class="labs" style="gap:10px">${SRV.map(x=>`<span style="${gone(x.id)?'opacity:.35':''}">${x.p}</span>`).join('')}</div></div>`,

    case 'trees':{const mg=mergedWT(),g=sum(mg,w=>w.gb);

      return {html:head(s,'trees','Merged worktrees hold',g/22.85,+fmtN(g)||0,dec(g),fmtU(g))+`<div class="gr"><div class="big-cols" style="gap:5px;height:200px">${cols}</div>
        <div class="legend"><span><i style="background:${c}"></i>merged</span><span><i style="box-shadow:inset 0 0 0 1.5px var(--g3)"></i>stale</span><span><i style="background:var(--g3)"></i>in use</span><span><i style="background:var(--g2)"></i>fine</span></div></div>`,
        cap:`One column per worktree, height is size.`}}
    case 'disk':{const r=88,L=2*Math.PI*r,tot=38.4,gapL=4;let off=0;const sf=sum(safeDK(),d=>d.gb),rc=reclaim();
      const segs=DK.map(d=>{const len=Math.max(0,d.gb/tot*L-gapL);const o=off;off+=d.gb/tot*L;
        const col=gone(d.id)?'rgba(255,255,255,.12)':d.safe&&!has(d.id,'keep')?c:'color-mix(in srgb,'+c+' 34%,transparent)';
        return `<circle class="gm" ${TIP(d.id,`<b>${d.n}</b>, ${fmt(d.gb)}, ${gone(d.id)?'in the Trash':d.safe?'safe to clean':d.x}`)} data-g="bd-${d.id}" cx="110" cy="110" r="${r}" fill="none" stroke-width="16" stroke-linecap="butt" transform="rotate(-90 110 110)" style="stroke:${col};stroke-dasharray:${len} ${L};stroke-dashoffset:${-o}"/>`}).join('');
      return {html:`<div class="gr center" style="margin-top:0"><svg width="220" height="220" viewBox="0 0 220 220">${segs}</svg>
          <div class="mid"><span class="n" data-n="dk-mid" data-v="${+fmtN(sf)||0}" data-d="1">${(+fmtN(sf)||0).toFixed(1)}</span><span class="u">GB safe to clean</span></div></div>
          <div class="legend" style="justify-content:center;margin-top:20px"><span><i style="background:${c}"></i>safe</span><span><i style="background:color-mix(in srgb,${c} 34%,transparent)"></i>by hand</span><span><i style="background:rgba(255,255,255,.12)"></i>in the Trash</span></div>`,
        cap:`The ring is ${nb(fmt(38.4))} of leftovers by kind. 812 of 994&nbsp;GB used.`}}
    case 'awake':{const thr=s.num[s.v],r=92,L=2*Math.PI*r,sweep=.75,bat=.64;
      const arcLen=L*sweep,fill=arcLen*bat,tickA=(135+270*(thr/100))*Math.PI/180;
      const tx=110+r*Math.cos(tickA),ty=110+r*Math.sin(tickA),tx2=110+(r-16)*Math.cos(tickA),ty2=110+(r-16)*Math.sin(tickA),tx1=110+(r+12)*Math.cos(tickA),ty1=110+(r+12)*Math.sin(tickA);
      const h=holders();
      return {html:`<div class="gr center" style="margin-top:0"><svg width="220" height="200" viewBox="0 0 220 200" style="overflow:visible">
          <circle cx="110" cy="110" r="${r}" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="12" stroke-linecap="round" transform="rotate(135 110 110)" style="stroke-dasharray:${arcLen} ${L}"/>
          <circle data-g="bw-arc" cx="110" cy="110" r="${r}" fill="none" stroke-width="12" stroke-linecap="round" transform="rotate(135 110 110)" style="stroke:${m?c:'var(--g3)'};stroke-dasharray:${fill} ${L}"/>

        </svg><div class="mid" style="top:66px"><span class="n">64</span><span class="u">% battery, on power</span></div></div>
        <div class="dotrow">${AG.map(a=>{const hh=a.st==='w'&&!gone(a.id)&&!has(a.id,'sleep');return `<i class="gm" ${TIP(a.id,a.n?`<b>${a.n}</b>, ${hh?'holds the Mac awake':agState(a)}`:'<b>Idle agent</b>, not holding')} data-g="bw-${a.id}" style="background:${hh&&m?c:hh?'var(--g3)':'var(--g1)'}"></i>`}).join('')}</div>`,
        cap:m===0?`The Mac sleeps on its usual schedule. ${h.length} of 12 agents are working.`:`<b>${h.length} of 12</b> agents hold it awake. ${thr?`The tick is ${thr}&nbsp;%, where it lets go.`:'It holds until they finish.'}`}}
  }

function cellHtml(it){
  if(it.more) return `<div class="cell more"><span class="ic">${more}</span><span>${it.nm}</span></div>`;
  return `<div class="cell ${it.on?'on':''} ${it.dim?'dim':''}" data-k="${it.k}" data-f="${it.k}">
    <span class="ic">${it.ic}</span>
    <span class="l1"><span class="nm">${it.nm}</span><span class="vl">${it.vl}</span></span>
    <span class="l2"><span class="sb">${it.sb}</span><span class="st"><i class="mk"></i>${it.st}</span></span>
    <span class="acts">${it.acts.map(ab).join('')}</span></div>`;
}
function emptyWhy(s,key){
  if(key!=='acts') return 'None right now.';
  if(s.mode===0) return `${s.name} is off, so MinMacs acts on nothing here.`;
  if(s.id==='agents') return finished().length?`fix auth redirect finished 2&nbsp;h ago, under the ${s.valWords[s.v]} line.`:'No agent has finished.';
  if(s.id==='servers') return idleSrv().length?`No server has been idle for ${s.valWords[s.v]} yet.`:'No server is idle.';
  if(s.id==='trees') return mergedWT().length?`No merge is ${s.valWords[s.v]} old yet.`:'Nothing is merged.';
  return 'None right now.';
}
function revealHtml(s,key){
  const ids=idsFor(key);let items=s.items().filter(it=>!it.more&&ids.includes(it.k));
  let lab=labelFor(key)||'These';
  if(key==='acts') lab=s.mode?`${MODES[s.mode]} acts on these`:'Off';
  return `<div class="rv"><div class="rv-h"><span class="t">${lab}${items.length?` · ${items.length}`:''}</span><button data-back="1">Show graph</button></div>
    ${items.length?items.map(cellHtml).join(''):`<p class="empty">${emptyWhy(s,key)}</p>`}</div>`;
}
function picHtml(s){
  if(REV) return revealHtml(s,REV);
  const p=picture(s);GCAP=p.cap;
  return p.html+`<p class="cap gcap" id="gcap">${p.cap}</p>`;
}
function renderPane(s){
  const a1=s.action(),a2=s.action2?s.action2():null;
  return `<div class="spread">
    <div class="lead">
      <h2 class="hed"><span class="s1t">${s.s1()}</span><span class="sn2">${s.s2()}</span></h2>
      <div class="arow">${bigBtn(a1,1)}${a2?bigBtn(a2,0):''}</div>
    </div>
    <div class="pic" id="pic">${picHtml(s)}</div>
  </div>`;
}
function afterPane(){markOn();fitActs($('pane'))}
function markOn(){$('pane').querySelectorAll('.lead [data-hk]').forEach(e=>e.classList.toggle('on',e.dataset.hk===REV))}
function setReveal(key){
  if(key===REV) return;
  if(key&&/^a\d+$/.test(key)&&!idsFor(key).length) return;REV=key;markOn();
  const pic=$('pic');if(!pic) return;
  const go=()=>{const old=Object.assign({},GC);pic.innerHTML=picHtml(CUR);pic.classList.remove('swap');easeG(pic,old);fitActs(pic);if(!REV){Object.keys(NUMS).forEach(k=>{if(k.startsWith('pn-')||k==='dk-mid')delete NUMS[k]});tweenNums(pic);keepG()}};
  if(RM){go();return}
  pic.classList.add('swap');clearTimeout(setReveal.t);setReveal.t=setTimeout(go,150);
}
function bindHover(){
  const pane=$('pane');
  pane.addEventListener('pointerover',e=>{
    clearTimeout(RT);
    const t=e.target.closest('.lead [data-hk]');
    if(t){setReveal(t.dataset.hk);return}
    const m=e.target.closest('.pic [data-tip]');
    if(m&&!REV){const g=$('gcap');if(g)g.innerHTML=m.dataset.tip+'. Click to see them all.';pane.querySelectorAll('.gm.hot').forEach(x=>x.classList.remove('hot'));m.classList.add('hot')}
  });
  pane.addEventListener('pointerout',e=>{const m=e.target.closest('.pic [data-tip]');if(m&&!(e.relatedTarget&&m.contains(e.relatedTarget))){m.classList.remove('hot');const g=$('gcap');if(g)g.innerHTML=GCAP}});
  pane.addEventListener('pointerleave',()=>{clearTimeout(RT);RT=setTimeout(()=>{if(!PICK)setReveal(null)},900)});
  pane.addEventListener('focusin',e=>{const t=e.target.closest('.lead [data-hk]');if(t)setReveal(t.dataset.hk)});
  pane.addEventListener('click',e=>{if(e.target.closest('[data-back]')){setReveal(null);return}
    const m=e.target.closest('.pic [data-tip]');if(m&&!REV){const k=m.dataset.k;setReveal('all');setTimeout(()=>{const c=$('pic').querySelector(`.cell[data-k="${k}"]`);if(c)c.classList.add('flash')},RM?0:200)}});
}
</script>

function easeG(root,old){
  if(RM) return;
  const els=[...root.querySelectorAll('[data-g]')].filter(e=>old[e.dataset.g]!=null&&old[e.dataset.g]!==(e.getAttribute('style')||''));
  if(!els.length) return;
  const nw=els.map(e=>e.getAttribute('style'));
  els.forEach((e,i)=>e.setAttribute('style',old[e.dataset.g]));
  root.offsetWidth;
  requestAnimationFrame(()=>els.forEach((e,i)=>e.setAttribute('style',nw[i])));
}
function snapF(root){const m={};root.querySelectorAll('[data-f]').forEach(e=>m[e.dataset.f]=e.getBoundingClientRect());return m}
function flip(root,old){
  if(RM) return;const sc=SCALE||1;
  root.querySelectorAll('[data-f]').forEach(e=>{const o=old[e.dataset.f];
    if(!o){e.classList.add('enter');return}
    const r=e.getBoundingClientRect(),dx=(o.left-r.left)/sc,dy=(o.top-r.top)/sc;
    if(Math.abs(dx)<1&&Math.abs(dy)<1) return;
    e.style.transition='none';e.style.transform=`translate(${dx}px,${dy}px)`;
    requestAnimationFrame(()=>requestAnimationFrame(()=>{e.style.transition='transform .5s var(--ease),background .25s,opacity .3s';e.style.transform='';setTimeout(()=>{e.style.transition=''},560)}));
  });
}
const NUMS={};
function tweenNums(root){

    const k=e.dataset.n,to=parseFloat(e.dataset.v),dec=+(e.dataset.d||0),from=NUMS[k];NUMS[k]=to;

    const step=t=>{const p=Math.min(1,(t-t0)/D),q=1-Math.pow(1-p,3);e.textContent=(from+(to-from)*q).toFixed(dec);if(p<1)requestAnimationFrame(step)};
    e.textContent=from.toFixed(dec);requestAnimationFrame(step);
  });
}

/* ---------- picker ---------- */
let PICK=null;
function openPick(kind,el){
  const s=CUR,pk=$('pick');
  if(PICK&&PICK.el===el){closePick();return}
  closePick();
  if(kind==='m') pk.innerHTML=`<div class="ph">What MinMacs does</div>`+[2,1,0].map(m=>`<button role="menuitemradio" aria-checked="${s.mode===m}" data-pm="${m}"><span class="pl">${MODES[m]}</span><span class="pw">${s.modeWords[m]}</span></button>`).join('');
  else pk.innerHTML=`<div class="ph">${s.id==='disk'?'How often':s.id==='awake'?'Ends at':s.id==='apps'?'When load passes':'After'}</div>`+s.vals.map((v,i)=>`<button role="menuitemradio" aria-checked="${s.v===i}" data-pv="${i}"><span class="pw">${s.valWords[i].replace(/&nbsp;/g,' ')}</span></button>`).join('');
  const sh=$('sheet').getBoundingClientRect(),r=el.getBoundingClientRect(),sc=SCALE;
  let x=(r.left-sh.left)/sc-10,y=(r.bottom-sh.top)/sc+8;
  pk.style.left=x+'px';pk.style.top=y+'px';
  pk.classList.add('show');el.classList.add('open');PICK={el,kind};
  const w=pk.offsetWidth;if(x+w>sh.width/sc-16){pk.style.left=(sh.width/sc-16-w)+'px'}
  const h=pk.offsetHeight;if(y+h>sh.height/sc-60){pk.style.top=((r.top-sh.top)/sc-h-8)+'px'}
  const f=pk.querySelector('[aria-checked="true"]');if(f)f.focus({preventScroll:true});
}
function closePick(){if(!PICK)return;$('pick').classList.remove('show');PICK.el.classList.remove('open');PICK=null}
function setMode(m){const s=CUR;if(s.mode===m){closePick();return}UNDO.push(snap());s.mode=m;closePick();render();
  toast(`${s.name}: MinMacs ${s.modeWords[m]}${m?'':''}.`.replace(' an agent.','.').replace(' merged ones.','.'),true)}
function setVal(i){const s=CUR;if(s.v===i){closePick();return}UNDO.push(snap());s.v=i;closePick();render();
  toast(`${s.name}: ${s.id==='disk'?'runs '+s.valWords[i].replace(/&nbsp;/g,' '):s.id==='awake'?'holds until '+s.valWords[i].replace(/&nbsp;/g,' '):s.id==='apps'?'acts when load passes '+s.vals[i]:'waits '+s.valWords[i].replace(/&nbsp;/g,' ')}.`,true)}

/* ---------- events ---------- */
function bind(){
  const sheet=$('sheet');
  document.addEventListener('click',e=>{
    const t=e.target.closest('[data-pm],[data-pv],[data-mw],[data-vw],[data-a],[data-goto],[data-sel],#tundo,#tbtn,#one,#login');
    if(!t){if(PICK&&!e.target.closest('#pick'))closePick();return}
    if(t.dataset.pm!=null) return setMode(+t.dataset.pm);
    if(t.dataset.pv!=null) return setVal(+t.dataset.pv);
    if(t.dataset.mw) return openPick('m',t);
    if(t.dataset.vw) return openPick('v',t);
    if(PICK) closePick();
    if(t.dataset.a!=null) return runAct(ACTS[+t.dataset.a]);
    if(t.dataset.goto){const id=t.dataset.goto;SEL='agents';render({swap:1});setTimeout(()=>{const c=$('pane').querySelector(`.cell[data-k="${id}"]`);if(c){c.classList.remove('flash');c.offsetWidth;c.classList.add('flash')}},RM?0:260);return}
    if(t.dataset.sel) return select(t.dataset.sel);
    if(t.id==='tundo'){UNDO.push(snap());X.autoUndone=1;render();toast('Brought back <b>Chrome</b>, <b>Spotify</b> and 3 servers.',true);return}
    if(t.id==='tbtn') return doUndo();
    if(t.id==='one'){UNDO.push(snap());ONE=!ONE;t.setAttribute('aria-checked',ONE);render();toast(ONE?'One icon in the menu bar.':'One icon per section in the menu bar.',true);return}
    if(t.id==='login'){LOGIN=!LOGIN;t.setAttribute('aria-checked',LOGIN);toast(LOGIN?'Opens at login.':'Does not open at login.',false);return}
  });
  document.addEventListener('keydown',e=>{
    if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('.w')){e.preventDefault();openPick(e.target.dataset.mw?'m':'v',e.target);return}
    if(e.key==='Escape'&&PICK){const el=PICK.el;closePick();el.focus()}
    if(PICK&&(e.key==='ArrowDown'||e.key==='ArrowUp')){e.preventDefault();const b=[...$('pick').querySelectorAll('button')],i=b.indexOf(document.activeElement);b[(i+(e.key==='ArrowDown'?1:-1)+b.length)%b.length].focus()}
    if((e.metaKey||e.ctrlKey)&&e.key==='z'){e.preventDefault();doUndo()}
  });
  if(window.bindHover) bindHover(); else {
    $('pane').addEventListener('pointerover',e=>{const t=e.target.closest('[data-hk]');setHL(t?t.dataset.hk:null)});
    $('pane').addEventListener('pointerleave',()=>setHL(null));
    $('pane').addEventListener('focusin',e=>{const t=e.target.closest('[data-hk]');setHL(t?t.dataset.hk:null)});
  }
}
function fit(){SCALE=Math.min(innerWidth/1280,innerHeight/800);$('stage').style.transform=`scale(${SCALE})`;placeNub()}
addEventListener('resize',fit);
fit();bind();render();

</script>
<script>
/* b: an action, a tab switch or a setting change returns to the picture, so its numbers ease */
(function(){const r0=runAct;runAct=function(o){if(o&&!o.done&&!o.soft)REV=null;r0(o)};
 const s0=select;select=function(id){REV=null;s0(id)};})();
</script>
</body>
</html>
