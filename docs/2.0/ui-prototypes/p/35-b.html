<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Turning Card</title>
<!--
  COMPOSITION (35-b, Turning Card)

  Sheet 940 x 660, hangs from the menu bar icon of the picked section.
  Body grid: Live Index 312 | gap 36 | pane 528 (12 cols x 33, gutter 12). Base unit 4, scale 4 8 12 16 24 32 48.
  Type: 22 (index names, headlines, the rule), 13 (body), 11 (captions) + ftop numbers 34 + the poster word 96.

  The front of every tab is activity and actions only. No form.
  The setting lives in ONE fixed spot on every tab: a tiny mode mark in the pane's top-right corner.
  Pressing it turns the whole pane over like a card. The back is that section's setting composed as a poster:
    top-left the section, top-right the same mark (now "Activity") to turn it back;
    the mode as one huge word (focal), the three modes as a small legend beside it;
    the rule as a 22 px sentence with its value in the section color;
    the rule drawn on a real axis with the real items on it: the value stops are the axis labels (click one),
      the white tick is the threshold, the tinted field is what the mode acts on, items inside it are lit;
    one plain line of what it touches right now, then the two app switches on the bottom hairline.
  The Live Index stays: walking it while the card is turned shows each section's poster.

  Fronts, each its own composition:
  - Agents   "Queue": headline (who needs you) -> two focus cards with their one action -> roster grid (2 cols)
               -> bottom-anchored 12-cell strip with the section action at its right end.
  - Apps     "Gauge and words": load ring on the left (focal), headline and the two section actions to its right,
               memory bar across, app rows below.
  - Servers  "Six badges": headline, then the six servers as large ftop arc badges in one row (focal, hover = card),
               memory bar + Close Idle anchored at the bottom.
  - Worktrees "Skyline": big number + Remove Merged on the left, 14 columns on the right (focal), rows of the
               merged and stale ones below.
  - Disk     "Zoom": whole-disk column -> zoom wedge -> column of the 38.4 GB, labels aligned to their segments.
  - Keep Awake "Column and sentence": tall battery column on the left, the reason as a headline on the right,
               the guards in words, then who holds the Mac awake.
-->
<style>
:root{
  --glass:rgba(28,29,38,.88);
  --line:rgba(255,255,255,.07);
  --tx:rgba(255,255,255,.94);
  --tx2:rgba(235,235,245,.62);
  --tx3:rgba(235,235,245,.34);
  --g1:rgba(255,255,255,.07);
  --g2:rgba(255,255,255,.18);
  --g3:rgba(255,255,255,.38);
  --rowbg:#2b2b39;
  --ease:cubic-bezier(.3,.7,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#1a1636}
body{font-family:-apple-system,"SF Pro Text",system-ui,sans-serif;color:var(--tx);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;font-size:13px;line-height:18px;cursor:default;user-select:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;text-align:left;line-height:inherit}
b{font-weight:500;color:var(--tx)}
:focus{outline:none}
:focus-visible{outline:2px solid rgba(255,255,255,.55);outline-offset:2px;border-radius:8px}
#stage{position:absolute;left:0;top:0;width:1280px;height:800px;transform-origin:0 0;overflow:hidden;
  background:
   radial-gradient(760px 560px at 10% 6%,#4b3c9e 0%,rgba(75,60,158,0) 70%),
   radial-gradient(700px 520px at 84% 2%,#22618f 0%,rgba(34,97,143,0) 70%),
   radial-gradient(820px 620px at 88% 104%,#a0436f 0%,rgba(160,67,111,0) 70%),
   radial-gradient(640px 520px at 18% 100%,#3a2463 0%,rgba(58,36,99,0) 75%),
   #1d1a3c}

/* menu bar */
.mb{position:absolute;left:0;right:0;top:0;height:26px;display:flex;align-items:center;justify-content:space-between;padding:0 12px 0 16px;background:rgba(18,14,40,.32);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);font-size:13px;color:rgba(255,255,255,.92);z-index:5}
.mb-l,.mb-r{display:flex;align-items:center;gap:18px}
.mb-l b{font-weight:700}
.mb-r{gap:14px}
.icons{position:relative;display:flex;align-items:center;gap:12px}
.hl{position:absolute;top:-3px;left:0;height:22px;width:28px;border-radius:6px;background:rgba(255,255,255,.2);transition:transform .45s var(--ease),opacity .3s;pointer-events:none}
.mi{position:relative;display:flex;width:16px;overflow:hidden;cursor:pointer;transition:width .4s var(--ease),opacity .3s,margin .4s var(--ease)}
.mi.off{width:0;opacity:0;margin-left:-12px}

/* sheet */
.sheet{position:absolute;top:34px;left:312px;width:940px;height:660px;background:var(--glass);backdrop-filter:blur(36px) saturate(1.5);-webkit-backdrop-filter:blur(36px) saturate(1.5);border:1px solid rgba(255,255,255,.085);border-radius:22px;box-shadow:0 34px 100px rgba(6,4,24,.5),inset 0 1px 0 rgba(255,255,255,.035);animation:drop .6s var(--ease) both}
@keyframes drop{from{opacity:0;transform:translateY(-10px)}}
.clip{position:absolute;inset:0;border-radius:22px;overflow:hidden}
.nub{position:absolute;top:-8px;left:0;width:18px;height:8px;margin-left:-9px;transition:transform .45s var(--ease)}
.nub svg{display:block}

.head{position:absolute;left:32px;right:32px;top:0;height:56px;display:flex;align-items:center;gap:12px;white-space:nowrap}
.head .lbl{font-size:11px;color:var(--tx3)}
.head .txt{color:var(--tx2)}
.head .undo{height:24px;padding:0 10px;border-radius:12px;font-size:11px;font-weight:500;color:var(--tx2);background:var(--g1);transition:background .2s,color .2s}
.head .undo:hover{background:rgba(255,255,255,.13);color:var(--tx)}

.body{position:absolute;left:32px;right:32px;top:56px;height:576px}

/* ---------- Live Index ---------- */
.idx{position:absolute;left:0;top:0;width:312px;height:576px;display:flex;flex-direction:column}
.it{display:flex;align-items:center;flex:1;margin:0 -10px;padding:0 10px;border-radius:14px;transition:background .25s}
.it:hover{background:rgba(255,255,255,.035)}
.it .dot{flex:none;width:9px;height:9px;border-radius:50%;box-shadow:inset 0 0 0 1.5px rgba(235,235,245,.28);transition:background .35s,box-shadow .35s}
.it .nm{flex:1 1 auto;min-width:0;max-width:150px;margin-left:12px;font-size:22px;line-height:28px;font-weight:600;letter-spacing:-.02em;color:rgba(235,235,245,.36);white-space:nowrap;overflow:hidden;transition:color .3s,max-width .5s var(--ease),opacity .3s,margin .5s var(--ease)}
.it:hover .nm{color:var(--tx2)}
.it.sel .nm{color:var(--tx)}
.mg{flex:none;position:relative;width:56px;height:24px;margin-left:auto;display:flex;align-items:flex-end;justify-content:space-between;transition:opacity .4s,filter .4s,margin .5s var(--ease)}
.it.m0 .mg{opacity:.28;filter:grayscale(1)}
.mg i{display:block;transition:height .55s var(--ease),width .55s var(--ease),left .55s var(--ease),background .35s,opacity .35s,box-shadow .35s}
.mg .tr{position:absolute;left:0;right:0;top:9px;height:6px;border-radius:3px;background:var(--g1)}
.mg .tr i{position:absolute;top:0;bottom:0;border-radius:3px}
.mg.mc i{flex:none;border-radius:2px}
.mg.dots{flex-wrap:wrap;align-content:center;row-gap:4px}
.mg.dots i{width:6px;height:6px;border-radius:50%}
.mg.ring{justify-content:flex-end;align-items:center}
.nb{flex:none;width:80px;margin-left:12px;display:flex;flex-direction:column;align-items:flex-end;white-space:nowrap;overflow:hidden;transition:width .5s var(--ease),opacity .3s,margin .5s var(--ease)}
.nb .n{font-size:13px;font-weight:500;line-height:18px;color:var(--tx2);transition:color .3s}
.nb .n u{text-decoration:none;font-size:11px;font-weight:400;color:var(--tx3);margin-left:3px}
.nb .cp{font-size:11px;line-height:14px;color:var(--tx3)}
.it.sel .nb .n{color:var(--tx)}

/* ---------- pane ---------- */
.pane{position:absolute;left:348px;top:0;width:528px;height:576px;transition:transform .6s var(--ease)}
.pin{position:absolute;inset:0;transition:opacity .2s,transform .35s var(--ease)}
.pin.swap{opacity:0;transform:translateY(6px)}
.f{position:absolute;inset:0;display:flex;flex-direction:column}

/* the mode mark: one fixed corner, every tab */
.mark{position:absolute;right:-8px;top:-2px;z-index:3;display:flex;align-items:center;gap:8px;height:28px;padding:0 10px;border-radius:14px;font-size:11px;color:var(--tx2);white-space:nowrap;transition:background .25s,color .25s,opacity .3s}
.mark:hover{background:var(--g1);color:var(--tx)}
.pips{display:flex;gap:3px}
.pips i{width:5px;height:5px;border-radius:50%;background:var(--g2);transition:background .35s,box-shadow .35s}
.mark .mv{color:var(--tx3)}
.mark svg{opacity:.5;transition:transform .3s var(--ease)}
.mark:hover svg{transform:translateX(2px);opacity:.8}

.hd{font-size:22px;line-height:28px;font-weight:600;letter-spacing:-.018em;color:var(--tx);max-width:404px}
.hd .s{color:var(--tx3)}
.cap{font-size:11px;line-height:14px;color:var(--tx3);white-space:nowrap}
.cap b{color:var(--tx2);font-weight:500}
.big{font-size:34px;line-height:38px;font-weight:500;letter-spacing:-.01em;white-space:nowrap}
.big u{text-decoration:none;font-size:13px;font-weight:400;color:var(--tx3);margin-left:4px;letter-spacing:0}

.btn{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 13px;border-radius:15px;background:var(--g1);font-size:13px;font-weight:500;white-space:nowrap;transition:background .2s,opacity .3s}
.btn:hover{background:rgba(255,255,255,.14)}
.btn .tl{font-weight:400;color:var(--tx3)}
.btn.pri{background:color-mix(in srgb,var(--c) 24%,transparent)}
.btn.pri:hover{background:color-mix(in srgb,var(--c) 36%,transparent)}
.btn.pri .tl{color:rgba(255,255,255,.55)}
.btn[disabled]{opacity:.35;pointer-events:none}

/* rows */
.rw{position:relative;display:flex;align-items:center;gap:10px;height:30px;margin:0 -8px;padding:0 8px;border-radius:8px;white-space:nowrap;transition:height .4s var(--ease),opacity .32s,background .25s}
.rw:hover{background:var(--rowbg)}
.rw.leave{height:0!important;opacity:0;pointer-events:none}
.rw .ic{flex:none;display:flex;width:18px;justify-content:center}
.rw .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.rw .nm .x{color:var(--tx3)}
.rw .v{flex:none;width:58px;text-align:right;color:var(--tx2)}
.rw .v2{flex:none;width:40px;text-align:right;color:var(--tx3)}
.rw .st{flex:none;text-align:right;color:var(--tx3)}
.rw.dim .nm{color:var(--tx2)}
.meta{display:flex;align-items:center;gap:10px;transition:opacity .2s}
.lk{color:var(--tx2);cursor:pointer;border-bottom:1px solid rgba(255,255,255,.14);transition:color .2s,border-color .2s}
.lk:hover{color:var(--tx);border-color:rgba(255,255,255,.5)}
.acts{position:absolute;right:0;top:0;bottom:0;display:flex;align-items:center;gap:4px;padding:0 4px 0 32px;background:linear-gradient(90deg,rgba(43,43,57,0),var(--rowbg) 28px);opacity:0;transform:translateX(8px);pointer-events:none;transition:opacity .2s,transform .3s var(--ease);border-radius:0 8px 8px 0}
.rw:hover .acts,.rw:focus-within .acts{opacity:1;transform:none;pointer-events:auto}
.rw:hover .meta,.rw:focus-within .meta{opacity:0}
.ab{height:22px;padding:0 9px;border-radius:11px;background:rgba(255,255,255,.08);font-size:11px;font-weight:500;white-space:nowrap;display:inline-flex;align-items:center;gap:5px;transition:background .2s}
.ab:hover{background:rgba(255,255,255,.17)}
.ab .tl{font-weight:400;color:var(--tx3)}
.ab.dis{background:none;color:var(--tx3);cursor:default;font-weight:400;padding:0 4px}
.ab.dis .tl{color:rgba(235,235,245,.24)}

/* setting marks (only while the setting face is open) */
.rw::before,.fc::before{content:"";position:absolute;left:-6px;top:50%;width:6px;height:6px;margin-top:-3px;border-radius:50%;opacity:0;transform:scale(.4);transition:opacity .3s,transform .35s var(--ease),background .3s,box-shadow .3s}
.fc::before{left:-2px}
.setv .aff.rw::before,.setv .aff.fc::before{opacity:1;transform:none}
.setv .aff.ma.rw::before,.setv .aff.ma.fc::before{background:var(--c)}
.setv .aff.mq.rw::before,.setv .aff.mq.fc::before{box-shadow:inset 0 0 0 1.5px var(--c)}
.setv [data-t]:not(.aff){opacity:.42}
.setv .aff .nm{color:var(--tx)}
.setv i.aff,.setv .bd.aff .ringwrap{box-shadow:0 0 0 1.5px color-mix(in srgb,var(--c) 80%,transparent),0 0 14px color-mix(in srgb,var(--c) 40%,transparent)!important}
[data-t]{transition:opacity .35s,height .4s var(--ease),background .25s,box-shadow .35s,flex-grow .55s var(--ease)}

/* plan: hovering a section action lights what it touches */
.plan [data-t]:not(.hit){opacity:.22}
.plan .rw.hit,.plan .fc.hit{background:color-mix(in srgb,var(--c) 15%,transparent)}
.plan i.hit,.plan .bd.hit .ringwrap{box-shadow:0 0 0 1.5px rgba(255,255,255,.75),0 0 14px var(--c)!important}

/* ---------- Agents: Queue ---------- */
.focus{margin-top:24px}
.fc{position:relative;display:flex;align-items:center;gap:14px;height:60px;margin:0 -12px;padding:0 12px;border-radius:14px;transition:background .25s,opacity .35s,height .4s var(--ease)}
.fc:hover{background:rgba(255,255,255,.04)}
.fc+.fc{margin-top:4px}
.fc .fi{flex:none;width:32px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:50%;position:relative}
.fc .fi svg{width:28px;height:28px}
.fc .fi .pulse{position:absolute;right:-1px;top:-1px;width:9px;height:9px;border-radius:50%;background:#fff;box-shadow:0 0 0 2px #23232f}
.fc .ft{flex:1;min-width:0;overflow:hidden}
.fc .fn{white-space:nowrap}
.fc .fn b{font-weight:600}
.fc .fs{font-size:11px;line-height:14px;color:var(--tx3);white-space:nowrap;margin-top:2px}
.fc .fb{display:flex;gap:6px;align-items:center}
.fc .fb .sec{opacity:0;transform:translateX(6px);transition:opacity .2s,transform .3s var(--ease)}
.fc:hover .fb .sec,.fc:focus-within .fb .sec{opacity:1;transform:none}
.fc.leave{height:0;opacity:0;margin-top:0}
.calm{height:60px;display:flex;align-items:center;color:var(--tx3)}
.roster{display:grid;grid-template-columns:1fr 1fr;column-gap:36px;margin-top:32px}
.roster .rw{height:52px;margin:0 -8px}
.roster .rw .nm{display:flex;flex-direction:column;justify-content:center}
.roster .rw .nm .x{font-size:11px;line-height:14px}
.roster .more{display:flex;align-items:center;height:48px;color:var(--tx3);font-size:11px;line-height:14px;white-space:normal}
.hold{display:flex;gap:6px;align-items:center}
.hold span{display:flex;align-items:center;gap:2px;font-size:11px;color:var(--tx3)}
.stripb{margin-top:auto}
.strip{display:flex;gap:4px}
.strip i{flex:1 1 0;height:24px;border-radius:7px;transition:flex-grow .55s var(--ease),background .35s,box-shadow .35s,opacity .35s,margin .55s var(--ease)}
.strip i.z{flex-grow:0.0001;margin-right:-4px}
.srow{display:flex;align-items:center;justify-content:space-between;margin-top:14px}

/* ---------- Apps: Gauge and words ---------- */
.atop{display:flex;align-items:center;gap:40px;height:176px}
.gauge{position:relative;flex:none;width:176px;height:176px}
.gauge svg{position:absolute;inset:0}
.gauge circle{fill:none;transition:stroke-dasharray .6s var(--ease),stroke-dashoffset .6s var(--ease),opacity .3s}
.gauge .ctr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.gauge .cap{margin-top:2px}
.aside{flex:1;min-width:0;padding-top:20px}
.aside .hd{max-width:none}
.btns{display:flex;gap:8px;margin-top:20px}
.aside .btns{flex-direction:column;align-items:flex-start;gap:6px}
.aside .btns .btn:not(.pri){background:none;padding-left:13px}
.aside .btns .btn:not(.pri):hover{background:var(--g1)}
.bar{position:relative;height:6px;border-radius:3px;background:var(--g1);overflow:hidden}
.bar i{position:absolute;top:0;bottom:0;border-radius:3px;transition:left .6s var(--ease),width .6s var(--ease),opacity .3s,box-shadow .3s}
.mh{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:8px;white-space:nowrap}
.mh .l{color:var(--tx2)}
.mem{margin-top:28px}
.rows{margin-top:20px}
.r-apps .st{width:128px}
.r-apps .v{width:56px}

/* ---------- Servers: Six badges ---------- */
.badges{display:grid;grid-template-columns:repeat(6,1fr);margin-top:auto;margin-left:-4px;margin-right:-4px}
.bd{display:flex;flex-direction:column;align-items:center;text-align:center;padding:10px 0 12px;border-radius:14px;transition:opacity .35s,background .25s,transform .4s var(--ease)}
.bd:hover{background:rgba(255,255,255,.04)}
.bd.leave{opacity:0;transform:scale(.85)}
.ringwrap{position:relative;width:76px;height:76px;border-radius:50%;transition:box-shadow .35s}
.ringwrap svg{position:absolute;inset:0}
.ringwrap circle{fill:none;transition:stroke-dashoffset .6s var(--ease),opacity .3s}
.ringwrap .in{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:500;color:var(--tx2)}
.ringwrap .now{width:8px;height:8px;border-radius:50%;background:var(--c);box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 18%,transparent)}
.bd .p{margin-top:12px;font-weight:500}
.bd .k,.bd .o{font-size:11px;line-height:14px;color:var(--tx3);white-space:nowrap}
.bd .o{margin-top:6px;color:var(--tx2)}
.bcap{margin-top:16px;padding:0 4px}
.sfoot{margin-top:auto;display:flex;align-items:flex-end;gap:36px}
.sfoot .mem2{flex:1;min-width:0}

/* ---------- Worktrees: Skyline ---------- */
.wtop{display:flex;gap:24px;height:212px}
.wnum{flex:none;width:204px;display:flex;flex-direction:column}
.wnum .t{margin-top:8px;color:var(--tx2);white-space:normal}
.wnum .btn{margin-top:auto;align-self:flex-start}
.sky{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:flex-end}
.cols{display:flex;align-items:flex-end;gap:4px;height:150px}
.cols i{flex:1 1 0;border-radius:5px;transition:height .55s var(--ease),flex-grow .55s var(--ease),background .35s,opacity .35s,box-shadow .35s,margin .55s var(--ease)}
.cols i.z{flex-grow:.0001;margin-right:-4px;height:0!important}
.cols .gap{flex:none;width:8px}
.leg{display:flex;gap:14px;margin-top:12px}
.leg span{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--tx3);white-space:nowrap}
.leg i{width:9px;height:9px;border-radius:3px}
.hatch{background:repeating-linear-gradient(135deg,rgba(76,201,107,.55) 0 3px,rgba(76,201,107,.16) 3px 6px)!important}
.r-trees{margin-top:36px}
.r-trees .st{width:150px}
.r-trees .v2{width:36px}

/* ---------- Disk: Zoom ---------- */
.zoom{position:relative;height:372px;margin-top:28px}
.zoom .col{position:absolute;top:0;width:52px;height:372px;border-radius:12px;background:var(--g1);overflow:hidden}
.zoom .col i{position:absolute;left:0;right:0;transition:top .6s var(--ease),height .6s var(--ease),background .35s,opacity .35s,box-shadow .35s}
.zoom svg.wedge{position:absolute;left:52px;top:0}
.zoom .lab{position:absolute;left:196px;right:0;transition:top .6s var(--ease),opacity .35s}
.zoom .lab .rw{height:40px}
.zoom .lab .nm{display:flex;flex-direction:column;justify-content:center}
.zoom .lab .nm .x{font-size:11px;line-height:14px}
.zoom .leads{position:absolute;left:176px;top:0}
.zcap{display:flex;margin-top:12px}
.zcap .cap{width:124px}
.dfoot{margin-top:auto;display:flex;align-items:center;gap:16px;padding-left:196px}

/* ---------- Keep Awake: Column and sentence ---------- */
.kw{display:flex;gap:40px;height:100%}
.kl{flex:none;width:112px;display:flex;flex-direction:column;align-items:flex-start}
.batt{position:relative;width:76px;height:400px;border-radius:18px;background:var(--g1);overflow:hidden;margin-top:6px}
.batt i{position:absolute;left:0;right:0;bottom:0;border-radius:0 0 18px 18px;transition:height .6s var(--ease)}
.batt .cap{position:absolute;left:0;right:0;text-align:center}
.kl .big{margin-top:16px}
.kr{flex:1;min-width:0;display:flex;flex-direction:column}
.kr .hd{max-width:330px}
.guard{margin-top:16px;color:var(--tx2);max-width:360px}
.kr .btns{margin-top:20px}
.r-awake{margin-top:28px}
.r-awake .st{width:118px}

/* hover card */
.card{position:absolute;z-index:8;width:232px;padding:14px 14px 10px;border-radius:16px;background:rgba(44,44,58,.97);border:1px solid rgba(255,255,255,.1);box-shadow:0 18px 50px rgba(0,0,0,.4);opacity:0;transform:translateY(4px);pointer-events:none;transition:opacity .18s,transform .25s var(--ease)}
.card.show{opacity:1;transform:none;pointer-events:auto}
.card .ct{font-weight:600}
.card .cs{margin-top:2px;font-size:11px;line-height:14px}
.card .cf{margin-top:10px;display:grid;grid-template-columns:64px 1fr;row-gap:4px;font-size:11px;line-height:14px}

<script>
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const G={

  awake:'<path d="M1.8 8s2.3-4.3 6.2-4.3S14.2 8 14.2 8s-2.3 4.3-6.2 4.3S1.8 8 1.8 8z"/><circle cx="8" cy="8" r="1.9"/>',

const gl=(k,c,s,w)=>`<svg viewBox="0 0 16 16" width="${s}" height="${s}" fill="none" stroke="${c}" stroke-width="${w||1.6}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${G[k]}</svg>`;
const CHEV=`<svg viewBox="0 0 8 12" width="6" height="9" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2 2l4 4-4 4"/></svg>`;
const FLIP=`<svg class="flip" viewBox="0 0 14 14" width="11" height="11" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2.2 6.2A4.9 4.9 0 0 1 11 4.1M11.8 7.8A4.9 4.9 0 0 1 3 9.9"/><path d="M11.3 1.6v2.8H8.5M2.7 12.4V9.6h2.8"/></svg>`;

/* ---------- fixture ---------- */

  {id:'cursor',n:'Cursor',ic:'cu',cpu:12,mem:3.1,cls:'kept'},
  {id:'docker',n:'Docker',ic:'docker',cpu:6,mem:2.4,cls:'kept'}
];
const SRV=[

  {id:'s5173',p:':5173',k:'vite',ag:'speed3',wt:'speed-3-base',mb:188,use:1},

const WT=[
  {id:'wt-auth',n:'auth-redirect',k:'m',gb:1.8,d:2,ag:'far',srv:'s4000',why:'squash-merged'},

  {id:'agents',name:'Agents',mode:1,lab:'Finished for',vals:['1 h','2 h','1 day'],num:[60,120,1440],v:2,

   desc:['The Mac sleeps as usual','Asks when an agent starts','Awake while agents work'],verb:['','Ask holds','Auto holds']}

const UNDO=[];
const byId={};[...APPS,...SRV,...WT,...DK,...AG].forEach(o=>byId[o.id]=o);
const agN=id=>byId[id]&&byId[id].n;

function fmt(x){
  if(x<1) return Math.round(x*1000)+' MB';
  const d=Math.abs(x*10-Math.round(x*10));
  return (d>.3?x.toFixed(2):x.toFixed(1)).replace(/\.0$/,'')+' GB';
}
const fN=x=>fmt(x).split(' ')[0], fU=x=>fmt(x).split(' ')[1];
const sum=(a,f)=>a.reduce((t,x)=>t+f(x),0);
const fmtIdle=m=>m>=1440?Math.round(m/1440)+' days':m>=60?Math.round(m/60)+' h':m+' min';
const shortIdle=m=>m>=1440?Math.round(m/1440)+' d':m>=60?Math.round(m/60)+' h':m+' m';

const cpuOf=a=>a.cpu-(a.id==='chrome'&&has('chrome','trim')?6:0);

const LOAD=()=>Math.round(63-sum(APPS,a=>gone(a.id)?cpuOf(a):0)-(has('chrome','trim')&&!gone('chrome')?6:0));
const MEM=()=>24.1-sum(APPS,a=>gone(a.id)?memOf(a):0)-(has('chrome','trim')&&!gone('chrome')?2.6:0);
const live=a=>a.filter(x=>!gone(x.id));
const idleSrv=()=>SRV.filter(x=>x.idle&&!gone(x.id)&&!has(x.id,'keep'));
const merged=()=>WT.filter(w=>w.k==='m'&&!gone(w.id)&&!has(w.id,'keep'));
const safeDK=()=>DK.filter(d=>d.safe&&!gone(d.id)&&!has(d.id,'keep'));
const holders=()=>AG.filter(a=>a.n&&a.st==='w'&&!gone(a.id)&&!has(a.id,'sleep'));
const finished=()=>AG.filter(a=>a.st==='f'&&!gone(a.id));
const agServers=id=>SRV.filter(x=>x.ag===id&&!gone(x.id));
const agTree=id=>WT.find(w=>w.ag===id&&!gone(w.id));
const agHeld=id=>sum(agServers(id),x=>x.mb/1000)+(agTree(id)&&agTree(id).k==='m'?agTree(id).gb:0);

/* what the setting touches, per section, given its mode and value */
function affected(s){
  if(!s.mode) return [];
  if(s.id==='agents') return finished().filter(a=>a.fin>=s.num[s.v]).map(a=>a.id);
  if(s.id==='apps') return noise().map(a=>a.id);
  if(s.id==='servers') return idleSrv().filter(x=>x.idle>=s.num[s.v]).map(x=>x.id);
  if(s.id==='trees') return merged().filter(w=>w.d>=s.num[s.v]).map(w=>w.id);
  if(s.id==='disk') return safeDK().map(d=>d.id);
  if(s.id==='awake') return holders().map(a=>a.id);
  return [];
}

/* ---------- actions ---------- */
const A=(a,l,tl,dis)=>({a,l,tl,dis});
function acts(kind,o){
  if(kind==='agent'){
    const r=[];
    if(o.st==='f') r.push(A('wrap','Wrap Up',fmt(agHeld(o.id))));
    r.push(A('nav','Go to Tab'));
    if(o.st==='w'&&!has(o.id,'sleep')) r.push(A('sleep','Let It Sleep'));
    if(o.st!=='f'&&agServers(o.id).length) r.push(A('stopall','Stop Its Servers'));
    return r;
  }
  if(kind==='app'){
    if(o.cls==='spared') return [A('','Quit','Playwright drives it',1)];
    const r=[A('quit','Quit',fmt(memOf(o)))];
    if(o.id==='chrome'&&!has('chrome','trim')) r.push(A('trim','Trim Tabs','14'));
    if(isNoise(o)) r.push(A('keep','Keep'));
    else if(o.cls==='unsorted') r.push(A('list','Move to Close List'));
    return r;
  }
  if(kind==='srv'){
    if(o.kept) return [A('open','Open in Browser'),A('','Stop','Docker runs it',1)];
    const r=[A('stop','Stop',fmt(o.mb/1000)),A('open','Open in Browser')];
    if(o.ag) r.push(A('goto','Go to Agent',agN(o.ag)));
    if(o.idle&&!has(o.id,'keep')) r.push(A('keep','Keep'));
    return r;
  }
  if(kind==='wt'){
    if(o.id==='wt-bp7') return [A('','Remove','1 commit not in main',1),A('commit','Show Commit'),A('editor','Open in Editor')];
    if(o.k==='u'||o.k==='f') return [A('finder','Show in Finder'),A('editor','Open in Editor')].concat(o.ag?[A('goto','Go to Agent',agN(o.ag))]:[]);
    const r=[A('rmtree','Remove',o.id==='wt-bp8'?'bundle saved':fmt(o.gb)),A('finder','Show in Finder')];
    if(o.k==='m'&&!has(o.id,'keep')) r.push(A('keep','Keep'));
    return r;
  }
  if(kind==='dk'){
    if(o.rep) return [A('finder','Show in Finder'),A('','Clean','report only',1)];
    const r=[A('clean','Clean',fmt(o.gb))];
    if(o.safe&&!has(o.id,'keep')) r.push(A('keep','Keep'));
    r.push(A('finder','Show in Finder'));
    return r;
  }
  if(kind==='awk'){
    const r=[A('nav','Go to Tab')];
    if(o.st==='w'&&!has(o.id,'sleep')) r.push(A('sleep','Let It Sleep'));
    if(o.st==='w'&&has(o.id,'sleep')) r.push(A('wake','Keep Awake'));
    if(o.st==='w') r.push(A('hour','Keep Awake 1 h'));
    return r;
  }
  return [];
}
const abtn=(x,id)=>x.dis?`<span class="ab dis">${x.l}<span class="tl">${x.tl}</span></span>`:`<button class="ab" data-act="${x.a}" data-id="${id}">${x.l}${x.tl?`<span class="tl">${x.tl}</span>`:''}</button>`;
const actsHTML=(kind,o,max)=>`<span class="acts">${acts(kind,o).slice(0,max||4).map(x=>abtn(x,o.id)).join('')}</span>`;

function nm(o){return o.p?o.p+' '+o.k:o.n}
function runAct(a,id){
  const o=byId[id], name=nm(o);
  const info={nav:`Switched to <b>${name}</b> in ${o.w==='app'?'the Codex app':o.w==='thread'?'its Codex thread':o.w==='Cursor'?'Cursor':'its '+o.w+' tab'}.`,
    open:`Opened <b>localhost${o.p}</b> in the browser.`,finder:`Showing <b>${name}</b> in Finder.`,editor:`Opened <b>${name}</b> in Cursor.`,
    commit:`Showing the commit in <b>${name}</b> that is not in main.`,goto:`Switched to <b>${agN(o.ag)}</b>.`};
  if(a==='goto'){ hideCard(); go(o.ag==='far'||o.ag==='parity'||o.ag==='speed3'?'agents':'agents'); toast(info.goto,false); return }
  if(info[a]){ if(a==='nav'&&o.st==='n') commit(info[a],()=>{fl(id).seen=1},[id],true); else toast(info[a],false); return }
  const M={
    quit:()=>[`Quit <b>${name}</b>, freed ${fmt(memOf(o))}.`,()=>{fl(id).gone=1},[id]],
    trim:()=>[`Closed <b>14 noise tabs</b> in Chrome. 31 work tabs stay.`,()=>{fl(id).trim=1},[]],
    keep:()=>[`<b>${name}</b> stays. MinMacs will leave it alone.`,()=>{fl(id).keep=1},[]],
    list:()=>[`<b>${name}</b> is on the close list now.`,()=>{fl(id).list=1},[]],
    stop:()=>[`Stopped <b>${name}</b>, freed ${fmt(o.mb/1000)}.`,()=>{fl(id).gone=1},[id]],
    rmtree:()=>[`Moved <b>${name}</b> to the Trash${o.id==='wt-bp8'?', a git bundle saved':''}${o.srv&&!gone(o.srv)?', stopped '+byId[o.srv].p:''}.`,()=>{fl(id).gone=1;if(o.srv)fl(o.srv).gone=1},[id].concat(o.srv?[o.srv]:[])],
    clean:()=>[o.tool?`${o.tool} cleaned its own <b>${o.n}</b>, ${fmt(o.gb)}.`:`Moved <b>${o.n}</b> to the Trash, ${fmt(o.gb)}.`,()=>{fl(id).gone=1},[id]],
    sleep:()=>[`<b>${name}</b> no longer holds the Mac awake.`,()=>{fl(id).sleep=1},[]],
    wake:()=>[`<b>${name}</b> holds the Mac awake again.`,()=>{delete fl(id).sleep},[]],
    hour:()=>[`The Mac stays awake 1 more hour for <b>${name}</b>.`,()=>{fl(id).hour=1;delete fl(id).sleep},[]],
    stopall:()=>{const s=agServers(id);return [`Stopped ${s.map(x=>'<b>'+x.p+'</b>').join(' and ')} for ${name}.`,()=>s.forEach(x=>fl(x.id).gone=1),s.map(x=>x.id)]},
    wrap:()=>[`Wrapped up <b>${name}</b>: stopped its server, removed its merged worktree.`,()=>wrapUp(id),[id].concat(agServers(id).map(x=>x.id),agTree(id)?[agTree(id).id]:[])]
  };
  if(!M[a]) return;
  const [msg,fn,leave]=M[a]();
  hideCard();
  commit(msg,fn,leave);
}
function wrapUp(id){agServers(id).forEach(x=>fl(x.id).gone=1);const t=agTree(id);if(t){fl(t.id).gone=1};fl(id).gone=1}

const SA={

  safe:{c:'disk',l:'Clean Safe',tl:()=>{const s=safeDK();return s.length?`${fmt(sum(s,d=>d.gb))} to the Trash`:'nothing'},
    t:()=>safeDK().map(d=>d.id),
    run:()=>{const s=safeDK(),n=s.find(d=>d.tool),t=sum(s.filter(d=>!d.tool),d=>d.gb);return [`Moved <b>${fmt(t)}</b> to the Trash${n?`, npm cleaned its own ${fmt(n.gb)}`:''}.`,()=>s.forEach(d=>fl(d.id).gone=1)]},on:()=>safeDK().length},
  sleepnow:{c:'awake',l:'Let It Sleep',tl:()=>'now',t:()=>holders().map(a=>a.id).concat(['batt']),
    run:()=>{const h=holders();return [`The Mac can sleep. <b>${h.length} agents</b> no longer hold it awake.`,()=>h.forEach(a=>fl(a.id).sleep=1)]},on:()=>holders().length},
  hourall:{c:'awake',l:'Keep Awake 1 h',tl:()=>'until 17:42',t:()=>['batt'],
    run:()=>[`The Mac stays awake until <b>17:42</b>, whatever the agents do.`,()=>{F.hour=1}],on:()=>!has('hour','x')&&!F.hour}
};
const saBtn=(k,pri)=>{const a=SA[k];return `<button class="btn${pri?' pri':''}" data-sa="${k}" style="--c:${C[a.c]}" ${a.on()?'':'disabled'}>${a.l}<span class="tl">${a.tl()}</span></button>`};

/* ---------- commit / undo / toast ---------- */
let tT;
function hideToast(){$('toast').classList.remove('show');$('sheet').classList.remove('tst')}
function toast(msg,undo){
  $('tt').innerHTML=nb(msg); $('tbtn').style.display=undo===false?'none':'';
  $('toast').classList.add('show');$('sheet').classList.add('tst'); clearTimeout(tT); tT=setTimeout(hideToast,6000);
}
function commit(msg,fn,leave,quiet){
  const pre=snap();
  const doit=()=>{fn();UNDO.push(pre);render();if(!quiet)toast(msg);else toast(msg)};
  const els=(leave||[]).flatMap(id=>[...$('pin').querySelectorAll(`[data-leave~="${id}"]`)]);
  if(els.length&&!RM){els.forEach(e=>e.classList.add('leave'));setTimeout(doit,380)} else doit();
}
$('tbtn').onclick=()=>{const p=UNDO.pop();if(!p)return;restore(p);render();hideToast()};

/* ---------- easing swap: graphs ease from their old value ---------- */
function swap(el,html){
  const old={};el.querySelectorAll('[data-a]').forEach(n=>old[n.dataset.a]=n.getAttribute('style')||'');
  const oldN={};el.querySelectorAll('[data-n]').forEach(n=>oldN[n.dataset.n]=+n.dataset.v);
  el.innerHTML=html;
  if(RM) return;
  const todo=[];
  el.querySelectorAll('[data-a]').forEach(n=>{const k=n.dataset.a;if(k in old){const nu=n.getAttribute('style')||'';if(nu!==old[k]){n.setAttribute('style',old[k]+';transition:none');todo.push([n,nu])}}});
  if(todo.length){el.offsetWidth;todo.forEach(([n,nu])=>n.setAttribute('style',nu))}
  el.querySelectorAll('[data-n]').forEach(n=>{const k=n.dataset.n;if(k in oldN&&oldN[k]!==+n.dataset.v)tween(n,oldN[k],+n.dataset.v,+n.dataset.d||0)});
}
function tween(n,a,b,d){const t0=performance.now(),D=550;const st=t=>{const p=Math.min(1,(t-t0)/D),e=1-Math.pow(1-p,3);n.textContent=(a+(b-a)*e).toFixed(d);if(p<1)requestAnimationFrame(st);else n.textContent=n.dataset.txt||b.toFixed(d)};requestAnimationFrame(st)}
const num=(k,v,d,txt)=>`<span data-n="${k}" data-v="${v}" data-d="${d||0}" data-txt="${txt||''}">${txt||v.toFixed(d||0)}</span>`;
const gnum=(k,gb)=>{const t=fN(gb),u=fU(gb);return `${num(k,u==='MB'?Math.round(gb*1000):gb,u==='MB'?0:(t.split('.')[1]||'').length,t)}<u>${u}</u>`};

/* ---------- Live Index ---------- */
function idxNum(s){
  const v=(a,u)=>({v:a,u});
  let r;
  if(s.id==='agents'){const f=finished();r=f.length?v(fN(sum(f,a=>agHeld(a.id))),fU(sum(f,a=>agHeld(a.id)))):v(String(holders().length),'working')}
  if(s.id==='apps'){const g=sum(noise(),memOf);r=g?v(fN(g),fU(g)):v('0','GB')}
  if(s.id==='servers') r=v(String(idleSrv().length),'idle');
  if(s.id==='trees'){const g=sum(merged(),w=>w.gb);r=g?v(fN(g),fU(g)):v('0','GB')}
  if(s.id==='disk'){const g=sum(safeDK(),d=>d.gb);r=g?v(fN(g),fU(g)):v('0','GB')}
  if(s.id==='awake') r=v(String(holders().length),'agents');
  r.cap=s.mode?s.verb[s.mode]:'Off';
  return r;
}
function agColor(a){return gone(a.id)?'transparent':a.st==='w'?(has(a.id,'sleep')?'var(--g3)':C.agents):a.st==='n'?'#fff':a.st==='f'?'transparent':'var(--g2)'}
function agShadow(a){return !gone(a.id)&&a.st==='f'?`inset 0 0 0 1.5px ${C.agents}`:'none'}
function mini(s){
  if(s.id==='agents') return `<span class="mg dots">${AG.map((a,i)=>`<i data-a="mga${i}" style="background:${agColor(a)};box-shadow:${agShadow(a)}${gone(a.id)?';opacity:.25;box-shadow:inset 0 0 0 1px var(--g2)':''}"></i>`).join('')}</span>`;
  if(s.id==='apps'){const L=LOAD(),n=sum(noise(),cpuOf);return `<span class="mg"><span class="tr"><i data-a="mgp0" style="left:0;width:${(L-n)/100*56}px;background:var(--g3)"></i><i data-a="mgp1" style="left:${(L-n)/100*56+1}px;width:${Math.max(0,n/100*56-1)}px;background:${C.apps}"></i></span></span>`}
  if(s.id==='servers') return `<span class="mg mc">${SRV.map(x=>`<i data-a="mgs${x.id}" style="width:6px;height:${gone(x.id)?2:6+x.mb/640*18}px;background:${gone(x.id)?'var(--g1)':x.idle&&!has(x.id,'keep')?C.servers:'var(--g2)'}"></i>`).join('')}</span>`;
  if(s.id==='trees') return `<span class="mg mc">${WT.map(w=>`<i data-a="mgt${w.id}" style="width:2.5px;height:${gone(w.id)?2:5+w.gb/3.2*19}px;background:${gone(w.id)?'var(--g1)':w.k==='m'&&!has(w.id,'keep')?C.trees:'var(--g2)'}"></i>`).join('')}</span>`;
  if(s.id==='disk'){const g=sum(safeDK(),d=>d.gb)/38.4*100;return `<span class="mg ring"><svg viewBox="0 0 24 24" width="24" height="24"><circle cx="12" cy="12" r="9" fill="none" stroke="var(--g1)" stroke-width="3.2"/><circle data-a="mgd" cx="12" cy="12" r="9" fill="none" stroke="${C.disk}" stroke-width="3.2" stroke-linecap="round" pathLength="100" transform="rotate(-90 12 12)" style="stroke-dasharray:${g} 100;transition:stroke-dasharray .6s var(--ease)"/></svg></span>`}
  if(s.id==='awake') return `<span class="mg"><span class="tr"><i data-a="mgk" style="left:0;width:${64/100*56}px;background:${holders().length?C.awake:'var(--g3)'}"></i></span></span>`;
}
function renderIdx(){
  swap($('idx'),S.map(s=>{const n=idxNum(s),m=s.mode;
    return `<button class="it${s.id===sel?' sel':''}${m?'':' m0'}" data-sec="${s.id}" role="tab" aria-selected="${s.id===sel}" style="--c:${s.c}">
      <i class="dot" data-a="dot${s.id}" style="background:${m===2?s.c:'transparent'};box-shadow:${m===1?`inset 0 0 0 1.5px ${s.c}`:m===2?'none':'inset 0 0 0 1.5px rgba(235,235,245,.28)'}"></i>
      <span class="nm">${s.name}</span>${mini(s)}
      <span class="nb"><span class="n">${n.v}<u>${n.u}</u></span><span class="cp">${n.cap}</span></span></button>`}).join(''));
}

    return `<div class="plot${on?'':' dim'}"><div class="cal">${days.map(i=>`<i data-a="cal${i}" class="${run(i)&&on?'on':''}${i===0?' today':''}"></i>`).join('')}</div>
      <div class="calx">${marks.map(([i,t])=>`<span style="left:${i/28*100}%">${t}</span>`).join('')}</div>
      <div class="calv" role="radiogroup">${s.vals.map((v,i)=>`<button class="vb" role="radio" aria-checked="${i===s.v}" data-val="${i}">${v}</button>`).join('')}<span class="cap" style="align-self:center">a filled day is a run, four weeks from today</span></div></div>`;
  }
  let sc,items=[],stops;
  if(s.id==='agents'){sc=lgs(10,10080);items=finished().map(a=>({id:a.id,l:a.n,t:a.a,v:a.fin}))}
  if(s.id==='apps'){sc=v=>16+v/100*496;const L=LOAD(),nc=sum(noise(),cpuOf);items=[{id:'ld',l:'load now',t:L+' %',v:L,hot:1}];if(nc)items.push({id:'wo',l:'with the noise closed',t:Math.round(L-nc)+' %',v:L-nc,ghost:1})}
  if(s.id==='servers'){sc=lgs(10,6000);items=SRV.filter(x=>x.idle&&!gone(x.id)).map(x=>({id:x.id,l:x.p,t:shortIdle(x.idle),v:x.idle,kept:has(x.id,'keep')}));if(SRV.some(x=>x.use&&!gone(x.id)))items.unshift({id:'use',l:':3000 :5173',t:'in use',v:10,ghost:1})}
  if(s.id==='trees'){sc=lgs(1/48,40);items=WT.filter(w=>w.k==='m'&&!gone(w.id)).map(w=>({id:w.id,l:w.n,t:w.d+' d',v:w.d,kept:has(w.id,'keep')}))}
  if(s.id==='awake'){sc=v=>16+(100-v)/100*440;items=[{id:'bat',l:'battery now',t:'64 %',v:64,hot:1}]}
  const tx=s.id==='awake'&&!thr?500:sc(thr);
  const stx=s.num.map(n=>s.id==='awake'&&!n?500:sc(n));
  // labels: one row above the axis, spread apart, with leaders down to each dot
  const it=items.map(o=>({...o,x:sc(o.v),w:tw(o.l+' '+o.t)})).sort((p,q)=>p.x-q.x);
  it.forEach((o,i)=>{o.c=Math.max(o.x,o.w/2);if(i)o.c=Math.max(o.c,it[i-1].c+(it[i-1].w+o.w)/2+14)});
  for(let i=it.length-1;i>=0;i--){const lim=i===it.length-1?528-it[i].w/2:it[i+1].c-(it[i].w+it[i+1].w)/2-14;it[i].c=Math.min(it[i].c,lim)}
  it.forEach(o=>o.y=64);
  const lit=o=>on&&!o.ghost&&!o.kept&&(s.id==='apps'?o.v>thr:o.x>=tx-0.5);
  const fldW=s.id==='awake'&&!thr?0:Math.max(0,512-tx);
  const AXC={agents:'time since it finished',apps:'load',servers:'time nobody used it',trees:'time since the merge',awake:'battery as it drains'};
  return `<div class="plot${on?'':' dim'}"><span class="cap pcap">${AXC[s.id]} &rarr;</span>
    <span class="fld" data-a="fld" style="left:${tx}px;width:${fldW}px;opacity:${on&&fldW>2?1:0}"></span>
    <span class="fl" data-a="fl" style="left:${tx+12}px;opacity:${on&&fldW>FIELD[s.id][s.mode===2?0:1].length*6.2+24?1:0}">${FIELD[s.id][s.mode===2?0:1]}</span>
    <span class="ax"></span>${stx.map(x=>`<span class="stp" style="left:${x}px"></span>`).join('')}
    <svg class="lead" width="528" height="120" viewBox="0 0 528 120">${it.map(o=>`<path d="M${o.c} ${o.y+20}L${o.c} ${o.y+26}L${o.x} ${o.y+42}L${o.x} 112" fill="none" stroke="rgba(255,255,255,.18)"/>`).join('')}</svg>
    ${it.map(o=>`<span class="lb${lit(o)?' on':''}" data-a="lb${o.id}" style="left:${o.c}px;top:${o.y}px"><b>${o.l}</b> ${o.t}</span><span class="dt${lit(o)?' on':''}${o.hot?' hot':''}" data-a="dt${o.id}" style="left:${o.x}px"></span>`).join('')}
    <span class="thr" data-a="thr" style="left:${tx}px;opacity:${on?1:0}"></span>
    <div role="radiogroup">${s.vals.map((v,i)=>`<button class="vb" role="radio" aria-checked="${i===s.v}" data-val="${i}" style="left:${Math.max(28,Math.min(496,stx[i]))}px">${v}</button>`).join('')}</div>
  </div>`;
}
function ruleBig(s){
  const v=`<em>${s.vals[s.v]}</em>`, a=s.mode===2;
  if(!s.mode) return {agents:'Agents run as they do. Nothing is wrapped up.',apps:'Apps run as they do. Nothing is closed.',servers:'Servers run until you stop them.',trees:'Worktrees stay until you remove them.',disk:'Clutter stays until you clean it.',awake:'The Mac sleeps on its usual schedule.'}[s.id];
  if(s.id==='agents') return `${a?'Wraps up':'Suggests Wrap Up for'} an agent once it has been finished for ${v}.`;
  if(s.id==='apps') return `${a?'Closes':'Shows'} noise apps when the load stays above ${v}.`;
  if(s.id==='servers') return `${a?'Stops':'Shows'} a server once nobody has used it for ${v}.`;
  if(s.id==='trees') return `${a?'Removes':'Shows'} a worktree ${v} after it is merged.`;
  if(s.id==='disk') return `${a?'Moves':'Lists'} safe clutter${a?' to the Trash':''}, ${v}.`;
  if(s.id==='awake') return s.num[s.v]?`${a?'Keeps the Mac awake while agents work,':'Asks when an agent starts,'} until the battery reaches ${v}.`:`${a?'Keeps the Mac awake while agents work,':'Asks when an agent starts,'} whatever the battery.`;
}
let lastWord='';
function drawerHTML(s){
  const w=MODES[s.mode];const ch=lastWord&&lastWord!==s.id+w;lastWord=s.id+w;
  return `<div class="po-hd" style="--c:${s.c}">${gl(s.id,s.c,15)}<span>${s.name}</span><span class="cap">setting</span></div>
    <button class="mark" data-close aria-label="Turn back to ${s.name} activity"><span>Activity</span>${FLIP}</button>
    <div class="pw${ch?' ch':''}" style="--c:${s.c}">${w}<i style="color:${s.mode?s.c:'var(--tx3)'}">.</i></div>
    <div class="leg3" role="radiogroup">${MODES.map((m,i)=>`<button role="radio" aria-checked="${i===s.mode}" data-mode="${i}"><i class="d" style="${i===s.mode?(i===2?`background:${s.c};box-shadow:none`:i===1?`box-shadow:inset 0 0 0 1.5px ${s.c}`:'background:var(--g3);box-shadow:none'):''}"></i><span class="w">${m}<span>${s.desc[i]}</span></span></button>`).join('')}</div>
    <p class="prule" style="--c:${s.c}">${nb(ruleBig(s))}</p>
    <div style="--c:${s.c}">${plotHTML(s)}</div>
    <div class="ptouch"><i class="mk" style="${s.mode===2?`background:${s.c}`:s.mode===1?`box-shadow:inset 0 0 0 1.5px ${s.c}`:'background:var(--g2)'}"></i><span>${nb(touchText(s))}</span></div>
    <div class="pglob"><button class="sw" role="switch" aria-checked="${one}" data-sw="one"><i></i>One icon in the menu bar</button><button class="sw" role="switch" aria-checked="${login}" data-sw="login"><i></i>Open at login</button><span class="cap">Changes apply at once</span></div>`;
}

/* ---------- marks: what the open setting touches ---------- */
function applyMarks(){
  const p=$('pin'),s=cur();
  p.classList.remove('setv');
  p.querySelectorAll('.aff').forEach(e=>e.classList.remove('aff','ma','mq'));
  return;
  const A=new Set(affected(s));
  p.querySelectorAll('[data-t]').forEach(e=>{if(e.dataset.t.split(' ').some(id=>A.has(id))){e.classList.add('aff',s.mode===2?'ma':'mq')}});
  // the gauge/bars belonging to a touched set count as touched
  if(s.id==='apps'&&A.size) p.querySelectorAll('[data-t="cpu-noise"],[data-t="mem-noise"],[data-t="cpu-kept"]').forEach(e=>e.classList.add('aff'));
  if(s.id==='servers') p.querySelectorAll('[data-t="m-idle"]').forEach(e=>e.classList.toggle('aff',A.size>0));
  if(s.id==='awake') p.querySelectorAll('[data-t="batt"]').forEach(e=>e.classList.add('aff'));
}

/* ---------- menu bar ---------- */
const ORDER=['agents','apps','servers','trees','disk','awake'];
function buildIcons(){
  $('icons').insertAdjacentHTML('beforeend',ORDER.map(k=>`<span class="mi" data-mi="${k}">${gl(k,'#fff',16)}</span>`).join('')+`<span class="mi off" data-mi="one">${gl('one','#fff',16)}</span>`);
}
function placeNub(){
  document.querySelectorAll('.mi').forEach(m=>{const k=m.dataset.mi;m.classList.toggle('off',one?k!=='one':k==='one'||(sec(k).mode===0&&k!==sel))});
  setTimeout(()=>{
    const st=$('stage').getBoundingClientRect(),sc=st.width/1280;
    const t=document.querySelector(one?'.mi[data-mi="one"]':`.mi[data-mi="${sel}"]`);
    const r=t.getBoundingClientRect(),ir=$('icons').getBoundingClientRect();
    const cx=(r.left+r.width/2-st.left)/sc;
    $('hl').style.transform=`translateX(${(r.left-ir.left)/sc-6}px)`;
    $('nub').style.transform=`translateX(${cx-312}px)`;
  },RM?0:420);
}

/* ---------- today ---------- */
function renderToday(){
  $('today').innerHTML=today&1?`<span class="lbl">Today</span><span class="txt">Brought back <b>2 apps</b> and <b>3 servers</b> Auto closed.</span>`:
    `<span class="lbl">Today</span><span class="txt">Auto closed <b>2 apps</b>, stopped <b>3 servers</b>${today&2?', you reopened the apps':''}.</span><button class="undo" data-today>Undo</button>`;
}

/* ---------- render ---------- */
function render(){
  renderToday(); renderIdx();
  swap($('pin'),markHTML(cur())+FRONT[sel]());
  swap($('dw'),drawerHTML(cur()));
  applyMarks(); placeNub();
  $('sheet').classList.toggle('open',open);
}
function go(id){
  if(id===sel) return;
  sel=id; hideCard();
  const p=$('pin'),d=$('dw');
  if(RM){render();return}
  if(open) d.classList.add('swap'); else p.classList.add('swap');
  setTimeout(()=>{renderToday();renderIdx();p.innerHTML=markHTML(cur())+FRONT[sel]();d.innerHTML=drawerHTML(cur());applyMarks();placeNub();requestAnimationFrame(()=>{p.classList.remove('swap');d.classList.remove('swap')})},170);
}
function setOpen(v){
  open=v; hideCard();
  $('dw').innerHTML=drawerHTML(cur());
  $('sheet').classList.toggle('open',open); applyMarks();
}

/* ---------- hover card ---------- */
let cardT, cardFor=null;
function cardHTML(kind,o){
  let t,s,sc,f=[];
  if(kind==='srv'){t=o.p+' '+o.k;sc=C.servers;s=o.use?'In use now':o.kept?'Stays, Docker runs it':has(o.id,'keep')?'Stays, you kept it':'Idle '+fmtIdle(o.idle);
    f=[['Owner',o.ag?lk(o.ag):o.o],['Worktree',o.wt||'none'],['Memory',fmt(o.mb/1000)]]}
  if(kind==='wt'){t=o.n;sc=o.k==='m'?C.trees:'var(--tx2)';s=o.k==='m'?(has(o.id,'keep')?'Stays, you kept it':'Merged '+o.d+' days ago'):o.k==='s'?'Stale '+o.d+' days, '+o.why:o.k==='u'?'In use':'Fine, has fresh commits';
    f=[['Size',fmt(o.gb)],['Agent',o.ag?lk(o.ag):'none'],['Server',o.srv&&!gone(o.srv)?byId[o.srv].p:'none']]}
  return `<div class="ct">${t}</div><div class="cs" style="color:${sc}">${s}</div><div class="cf">${f.map(x=>`<span>${x[0]}</span><span>${x[1]}</span>`).join('')}</div>
    <div class="ca">${acts(kind,o).map(x=>x.dis?`<button class="dis">${x.l}<span class="tl">${x.tl}</span></button>`:`<button data-act="${x.a}" data-id="${o.id}">${x.l}<span class="tl">${x.tl||''}</span></button>`).join('')}</div>`;
}
function showCard(el){
  const [kind,id]=el.dataset.card.split(':');const o=byId[id];if(!o||gone(id))return;
  clearTimeout(cardT);cardFor=el;
  const c=$('card');c.innerHTML=cardHTML(kind,o);
  const st=$('stage').getBoundingClientRect(),sc=st.width/1280,sh=$('sheet').getBoundingClientRect(),r=el.getBoundingClientRect();
  let x=(r.left-sh.left)/sc+(r.width/sc)/2-116,y=(r.bottom-sh.top)/sc+8;
  x=Math.max(16,Math.min(940-248,x));
  if(y+c.offsetHeight>644) y=(r.top-sh.top)/sc-c.offsetHeight-8;
  c.style.left=x+'px';c.style.top=y+'px';c.style.setProperty('--c',C[kind==='srv'?'servers':'trees']);
  c.classList.add('show');
}
function hideCard(){clearTimeout(cardT);$('card').classList.remove('show');cardFor=null}
$('sheet').addEventListener('mouseover',e=>{
  const el=e.target.closest('[data-card]');
  if(el&&el!==cardFor) showCard(el);
  else if(!el&&!e.target.closest('#card')&&cardFor){clearTimeout(cardT);cardT=setTimeout(hideCard,180)}
  else if(el||e.target.closest('#card')) clearTimeout(cardT);
  const sa=e.target.closest('[data-sa]');
  const p=$('pin');
  if(sa&&!sa.disabled){const a=SA[sa.dataset.sa],T=new Set(a.t());p.classList.add('plan');p.querySelectorAll('[data-t]').forEach(n=>n.classList.toggle('hit',n.dataset.t.split(' ').some(i=>T.has(i))))}
  else if(p.classList.contains('plan')){p.classList.remove('plan');p.querySelectorAll('.hit').forEach(n=>n.classList.remove('hit'))}
});

/* ---------- clicks ---------- */
document.addEventListener('click',e=>{
  const t=e.target;
  const it=t.closest('[data-sec]'); if(it){go(it.dataset.sec);return}
  if(t.closest('[data-open]')){setOpen(true);return}
  if(t.closest('[data-close]')){setOpen(false);return}
  const md=t.closest('[data-mode]'); if(md){const s=cur(),m=+md.dataset.mode;if(m===s.mode)return;const was=MODES[s.mode];commit(`${s.name} is <b>${MODES[m]}</b> now, was ${was}.`,()=>{s.mode=m});return}
  const vl=t.closest('[data-val]'); if(vl){const s=cur(),v=+vl.dataset.val;if(v===s.v)return;const was=s.vals[s.v];commit(`${s.name}: <b>${s.lab.toLowerCase()} ${s.vals[v]}</b>, was ${was}.`,()=>{s.v=v});return}
  const sw=t.closest('[data-sw]'); if(sw){const k=sw.dataset.sw;commit(k==='one'?(one?'Each section has its own menu bar icon again.':'<b>One icon</b> in the menu bar now.'):(login?'MinMacs will not open at login.':'MinMacs opens at login.'),()=>{if(k==='one')one=!one;else login=!login});return}
  if(t.closest('[data-today]')){commit('Brought back <b>2 apps</b> and <b>3 servers</b> Auto closed today.',()=>{today|=1});return}
  const sa=t.closest('[data-sa]'); if(sa){const a=SA[sa.dataset.sa];if(!a.on())return;const [msg,fn]=a.run();$('pin').classList.remove('plan');commit(msg,fn,a.t());return}
  const ac=t.closest('[data-act]'); if(ac){runAct(ac.dataset.act,ac.dataset.id);return}
  const gt=t.closest('[data-goto]'); if(gt){hideCard();go('agents');toast(`<b>${agN(gt.dataset.goto)}</b> is in Agents.`,false);return}
  const mi=t.closest('[data-mi]'); if(mi&&mi.dataset.mi!=='one'){go(mi.dataset.mi);return}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&open){setOpen(false);return}
  if((e.key==='ArrowDown'||e.key==='ArrowUp')&&e.target.closest('.idx')){const i=ORDER.indexOf(sel)+(e.key==='ArrowDown'?1:-1);if(ORDER[i]){go(ORDER[i]);setTimeout(()=>document.querySelector(`[data-sec="${ORDER[i]}"]`).focus(),200)}e.preventDefault()}
});

/* ---------- stage ---------- */
function fit(){const s=Math.min(innerWidth/1280,innerHeight/800);$('stage').style.transform=`scale(${s})`;$('stage').style.left=(innerWidth-1280*s)/2+'px';$('stage').style.top=(innerHeight-800*s)/2+'px'}
addEventListener('resize',()=>{fit();placeNub()});
buildIcons(); fit(); render();
</script>
</body>
</html>
