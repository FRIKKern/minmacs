<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Port Map</title>
<style>
:root{
  --teal:#3FD0B8;--green:#4CC96B;--goes:#FF9F8A;
  --txt:#F2F3F7;--sub:rgba(235,236,245,.54);--faint:rgba(235,236,245,.34);
  --hair:rgba(255,255,255,.07);--glass:rgba(28,29,38,.86);
  --ease:cubic-bezier(.22,.8,.24,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:radial-gradient(70% 70% at 14% 6%,#4b3a9c,transparent 62%),radial-gradient(60% 70% at 86% 4%,#1d5f88,transparent 62%),radial-gradient(70% 80% at 86% 104%,#9b3f6d,transparent 62%),linear-gradient(160deg,#2a2466,#1e2a56 46%,#46264f) #1e2148}
body{font:13px/1.25 -apple-system,"SF Pro Text",system-ui,sans-serif;color:var(--txt);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;outline:none}
button:focus-visible{box-shadow:0 0 0 2px rgba(255,255,255,.35)}
svg{display:block}
.ic{fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}

#stage{position:absolute;left:0;top:0;width:1280px;height:800px;transform-origin:0 0;overflow:hidden;
  background:
   radial-gradient(820px 560px at 14% 6%,#4b3a9c 0%,transparent 62%),
   radial-gradient(760px 560px at 86% 4%,#1d5f88 0%,transparent 62%),
   radial-gradient(900px 640px at 86% 104%,#9b3f6d 0%,transparent 62%),
   radial-gradient(700px 520px at 6% 100%,#34225e 0%,transparent 62%),
   linear-gradient(160deg,#2a2466,#1e2a56 46%,#46264f)}

.mb{position:absolute;left:0;right:0;top:0;height:26px;display:flex;align-items:center;padding:0 10px 0 16px;
  background:rgba(14,12,30,.36);backdrop-filter:blur(24px) saturate(160%);-webkit-backdrop-filter:blur(24px) saturate(160%);
  font-size:13px;color:rgba(255,255,255,.92);z-index:5}
.mb .l{display:flex;gap:19px;align-items:center}
.mb .l b{font-weight:700}
.mb .r{margin-left:auto;display:flex;align-items:center;gap:2px}
.mbi{height:22px;padding:0 7px;display:flex;align-items:center;gap:5px;border-radius:5px;color:#fff}
.mbi svg{width:16px;height:16px}
.mbi.on{background:rgba(255,255,255,.2)}
.mbi .u{color:rgba(255,255,255,.55)}
.clock{padding:0 4px 0 8px;font-weight:500}

.panel{position:absolute;top:34px;width:756px;background:var(--glass);border:1px solid rgba(255,255,255,.08);border-radius:22px;
  backdrop-filter:blur(30px) saturate(150%);-webkit-backdrop-filter:blur(30px) saturate(150%);
  box-shadow:0 30px 80px rgba(6,4,20,.5),inset 0 1px 0 rgba(255,255,255,.04);padding:18px}

.hrow{display:flex;align-items:center;gap:10px;height:30px}
.hb{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:rgba(63,208,184,.18);color:var(--teal);flex:none}
.hb svg{width:17px;height:17px}
.big{font-size:24px;font-weight:500;letter-spacing:-.3px}
.unit{font-size:13px;color:var(--sub);margin-left:3px}
.hcount{color:var(--sub);font-size:13px;margin-left:6px}
.legend{margin-left:auto;display:flex;gap:16px;color:var(--sub);font-size:12px}
.legend span{display:flex;align-items:center;gap:6px}
.legend b{color:var(--txt);font-weight:500}

.sm{width:16px;height:16px;display:grid;place-items:center;flex:none}
.sm::before{content:"";display:block}
.m-use::before{width:8px;height:8px;border-radius:50%;background:var(--teal)}
.m-idle::before{width:9px;height:9px;border-radius:50%;box-shadow:inset 0 0 0 1.6px rgba(255,255,255,.72)}
.m-kept::before{width:8px;height:8px;border-radius:2px;background:rgba(255,255,255,.42)}
.tile.use .m-use::before{background:#BFF7EC}

/* map */
.map{display:flex;gap:8px;height:384px;margin-top:16px}
.col,.rowg{display:flex;gap:8px;min-width:0;min-height:0;flex-basis:0}
.col{flex-direction:column}
.rowg{flex-direction:row}
.col,.rowg,.grp,.tile{transition:flex-grow .6s var(--ease),opacity .35s ease}
.gone{opacity:0}
[hidden]{display:none!important}

.grp{flex-basis:0;min-width:0;min-height:0;display:flex;flex-direction:column;gap:6px;padding:7px;border-radius:15px;
  background:rgba(255,255,255,.025);box-shadow:inset 0 0 0 1px rgba(255,255,255,.055)}
.gh{display:flex;align-items:center;gap:7px;height:20px;padding:0 4px;font-size:12px;white-space:nowrap;overflow:hidden}
.gh svg{width:13px;height:13px;color:var(--faint);flex:none}
.gh b{font-weight:600;color:rgba(242,243,247,.95)}
.gh span{color:var(--sub);overflow:hidden;text-overflow:ellipsis}
.gh .wk{color:var(--teal)}
.tiles{flex:1;display:flex;gap:6px;min-height:0}

.tile{flex-basis:0;min-width:0;position:relative;border-radius:10px;padding:10px 11px 10px;display:flex;flex-direction:column;overflow:hidden;
  text-align:left;cursor:pointer;transition:flex-grow .6s var(--ease),opacity .35s ease,transform .18s var(--ease),box-shadow .25s,background .3s,filter .3s}
.tile:active{transform:scale(.975)}
.tile:not(.gone){min-height:88px;min-width:92px}
.grp:not(.gone){min-height:128px;min-width:108px}
.tile:focus-visible{outline:none;box-shadow:0 0 0 2px rgba(255,255,255,.7)}
.tile.use{background:linear-gradient(180deg,rgba(63,208,184,.34),rgba(63,208,184,.2))}
.tile.idle{background:rgba(63,208,184,.075);box-shadow:inset 0 0 0 1px rgba(63,208,184,.2)}
.tile.kept{background:rgba(255,255,255,.07)}
.tile:hover{filter:brightness(1.12)}
.tile.sel{box-shadow:0 0 0 2px rgba(255,255,255,.78)}
.map.planning .tile:not(.plan){opacity:.3}
.map.planning .tile.plan{box-shadow:inset 0 0 0 1.5px rgba(255,159,138,.75)}
.tp{display:flex;align-items:flex-start;justify-content:space-between;gap:6px}
.port{font-size:20px;font-weight:600;letter-spacing:-.4px;line-height:1}
.port i{font-style:normal;opacity:.45;margin-right:1px}
.tn{font-size:12px;color:var(--sub);margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile.use .tn{color:rgba(225,250,245,.7)}
.tm{margin-top:auto;font-size:16px;font-weight:500;white-space:nowrap}
.tm small{font-size:11px;color:var(--sub);font-weight:400;margin-left:2px}
.tile.use .tm small{color:rgba(225,250,245,.62)}
.ib{height:3px;border-radius:2px;background:rgba(255,255,255,.09);margin-top:8px;overflow:hidden}
.ib i{display:block;height:100%;width:0;background:var(--teal);border-radius:2px;transition:width 1.2s var(--ease)}
.tile:not(.idle) .ib{visibility:hidden}

/* footer */
.ft{display:flex;align-items:center;gap:10px;height:40px;margin-top:14px;padding-left:4px}
.hint{color:var(--faint);font-size:12px;display:flex;align-items:center;gap:7px}
.hint svg{width:13px;height:13px}
.ci{margin-left:auto;display:flex;align-items:center;gap:10px;height:40px;padding:0 14px 0 6px;border-radius:20px;background:rgba(255,255,255,.06);transition:background .2s}
.ci:hover{background:rgba(255,255,255,.1)}
.rb{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--teal);color:#0f2a26;flex:none}
.rb svg{width:15px;height:15px}
.ci .lbl{font-size:14px;font-weight:500}
.ci .val{color:var(--sub);font-size:13px}
.ci .val b{color:var(--txt);font-weight:500}
.ci[disabled]{opacity:.4;cursor:default}
.ci[disabled] .rb{background:rgba(255,255,255,.14);color:rgba(255,255,255,.7)}
.undo{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:13.5px}
.undo .q b{font-weight:500}
.undo .q span{color:var(--sub)}
.cd{width:22px;height:22px;flex:none;transform:rotate(-90deg)}
.cd circle{fill:none;stroke-width:2}
.cd .tr{stroke:rgba(255,255,255,.1)}
.cd .ar{stroke:var(--teal);stroke-linecap:round}
.pill{height:30px;padding:0 15px;border-radius:15px;font-size:13px;font-weight:500;background:var(--teal);color:#0f2a26}
.pill:hover{background:#5ADCC6}

/* card */
.card{position:absolute;width:300px;background:rgba(32,33,44,.95);border:1px solid rgba(255,255,255,.1);border-radius:18px;padding:16px 16px 14px;
  backdrop-filter:blur(30px) saturate(150%);-webkit-backdrop-filter:blur(30px) saturate(150%);box-shadow:0 24px 60px rgba(6,4,20,.55);z-index:4;
  opacity:0;transform:scale(.97);transform-origin:var(--ox,0) 20px;pointer-events:none;transition:opacity .18s ease,transform .3s var(--ease)}
.card.on{opacity:1;transform:none;pointer-events:auto}
.ct{display:flex;align-items:baseline;gap:7px}
.ct .p{font-size:20px;font-weight:600;letter-spacing:-.4px}
.ct .p i{font-style:normal;opacity:.45}
.ct .n{font-size:14px;font-weight:500;color:rgba(242,243,247,.85)}
.ct .m{margin-left:auto;font-size:14px;font-weight:500}
.ct .m small{font-size:11px;color:var(--sub);font-weight:400;margin-left:2px}
.cs{font-size:12.5px;color:var(--sub);margin-top:6px}
.cs b{font-weight:600}
.cs .stays{color:var(--teal)}
.cs .goes{color:var(--goes)}
.facts{margin:14px 0 2px;display:grid;grid-template-columns:90px 1fr;row-gap:8px;font-size:12.5px}
.facts dt{color:var(--sub)}
.facts dd{color:rgba(242,243,247,.92);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xl{display:inline-flex;align-items:center;gap:5px;color:var(--green);border-radius:5px;padding:1px 4px;margin:-1px -4px;max-width:100%}
.xl:hover{background:rgba(76,201,107,.12)}
.xl svg{width:11px;height:11px;flex:none}
.xl em{font-style:normal;color:rgba(76,201,107,.62)}
.acts{display:grid;grid-template-columns:repeat(4,1fr);margin-top:14px;padding-top:12px;border-top:1px solid var(--hair)}
.act{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11.5px;color:rgba(235,236,245,.78)}
.act i{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.08);transition:background .2s,transform .15s}
.act:hover i{background:rgba(255,255,255,.15)}
.act:active i{transform:scale(.92)}
.act.pri i{background:var(--teal);color:#0f2a26}
.act.pri:hover i{background:#5ADCC6}
.act[disabled]{opacity:.32;cursor:default}
.act[disabled] i{background:rgba(255,255,255,.08)!important}
.act svg{width:15px;height:15px}

.toast{position:absolute;height:30px;padding:0 14px;border-radius:15px;background:rgba(30,31,41,.9);border:1px solid rgba(255,255,255,.08);
  display:flex;align-items:center;font-size:12.5px;color:rgba(242,243,247,.9);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  opacity:0;transform:translateY(-4px);transition:opacity .25s,transform .35s var(--ease);pointer-events:none;white-space:nowrap}
.toast.on{opacity:1;transform:none}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition-duration:.01ms!important;animation:none!important}
}
</style>
</head>

  facts:[['Owner','Docker'],['Container','pg-dev · postgres:16'],['Kept since','12 Oct'],['Process','com.docker.backend']],tab:null}
};
Object.entries(D).forEach(([p,s])=>{s.p=+p;s.alive=true;s.o={st:s.st,f:s.f,status:s.status.slice()};});

/* layout tree: columns of workstream groups, everything grows by memory */
const TREE=['row',[
  ['col',[ ['grp','speed-3',[3000,5173]], ['rowg',[ ['grp','auth-redirect',[4000]], ['grp','Docker',[5432]] ]] ]],
  ['col',[ ['grp','studio-parity',[3334]], ['grp','nobody',[6006]] ]]
]];
const nodes=[];
function build(n,parent){
  const [kind,a,b]=n;
  if(kind==='row'){a.forEach(c=>build(c,parent));return;}
  const el=document.createElement('div');
  el.className=kind;
  if(kind==='grp'){
    const w=W[a];
    el.innerHTML=`<div class="gh">${G[w.ag]}<b>${a}</b><span>${w.sub}</span></div><div class="tiles"></div>`;
    const tl=el.querySelector('.tiles');
    b.forEach(p=>{const s=D[p];const t=document.createElement('button');t.className='tile';t.dataset.p=p;
      t.innerHTML=`<div class="tp"><span class="port"><i>:</i>${p}</span><i class="sm"></i></div><div class="tn">${s.n}</div><div class="tm">${s.mb}<small>MB</small></div><div class="ib"><i></i></div>`;
      s.el=t;tl.appendChild(t);t.addEventListener('click',e=>{e.stopPropagation();open(s);});});
    el._ports=b.slice();
  } else {
    a.forEach(c=>build(c,el));
    el._kids=true;
  }
  nodes.push(el);parent.appendChild(el);
}
build(TREE,map);

function weight(el){
  if(el.classList.contains('tile')) {const s=D[el.dataset.p];return s.alive?s.mb:0;}
  if(el.classList.contains('grp')) return el._ports.reduce((a,p)=>a+(D[p].alive?D[p].mb:0),0);
  return [...el.children].reduce((a,c)=>a+weight(c),0);
}
function reflow(){
  const all=[...map.querySelectorAll('.col,.rowg,.grp,.tile')];
  all.forEach(el=>{
    const w=weight(el);
    if(w>0){
      if(el.hidden){el.hidden=false;el.classList.add('gone');el.style.flexGrow=0.001;void el.offsetWidth;}
      clearTimeout(el._t);
      el.style.flexGrow=w;el.classList.remove('gone');
    } else if(!el.hidden){
      el.style.flexGrow=0.001;el.classList.add('gone');
      clearTimeout(el._t);el._t=setTimeout(()=>{if(weight(el)===0)el.hidden=true;},560);
    }
  });
}
function paint(s,first){
  const t=s.el;t.classList.remove('use','idle','kept');t.classList.add(s.st);
  t.querySelector('.sm').className='sm m-'+s.st;
  const bar=t.querySelector('.ib i');
  if(first) requestAnimationFrame(()=>requestAnimationFrame(()=>bar.style.width=(s.f*100)+'%'));
  else bar.style.width=(s.f*100)+'%';
  t.setAttribute('aria-label',`:${s.p} ${s.n}, ${s.mb} MB, ${s.st==='use'?'in use':s.st}`);
}
function gb(mb){let v=(mb/1000).toFixed(2);if(v.endsWith('0'))v=v.slice(0,-1);return v;}
function summary(){
  const live=Object.values(D).filter(s=>s.alive);
  const n=k=>live.filter(s=>s.st===k).length;
    $('tot').textContent=live.length;$('totU').textContent=live.length===1?'server':'servers';
  $('cnt').textContent=`using ${gb(live.reduce((a,s)=>a+s.mb,0))} GB`;
  $('lu').textContent=n('use');$('li').textContent=n('idle');$('lk').textContent=n('kept');
  const total=live.reduce((a,s)=>a+s.mb,0);
  $('mbVal').innerHTML=`${gb(total)}<span class="u"> GB</span>`;
  const idle=live.filter(s=>s.st==='idle'),mb=idle.reduce((a,s)=>a+s.mb,0);
  $('ciVal').innerHTML=idle.length?`<b>${idle.length}</b> server${idle.length===1?'':'s'} · <b>${mb>=1000?gb(mb):mb}</b> ${mb>=1000?'GB':'MB'}`:'nothing idle';
  $('ci').disabled=!idle.length;
  return idle;
}
Object.values(D).forEach(s=>paint(s,true));reflow();summary();

/* Close Idle: hover shows the plan, press closes, Undo for 8 s */
const ci=$('ci');
const plan=on=>{const idle=on?Object.values(D).filter(s=>s.alive&&s.st==='idle'):[];
  map.classList.toggle('planning',on&&idle.length>0);$('hintT').textContent=on&&idle.length?'Closes '+idle.map(s=>':'+s.p).join(', ')+', nothing else':'Tile size is memory';Object.values(D).forEach(s=>s.el.classList.toggle('plan',idle.includes(s)));};
ci.addEventListener('mouseenter',()=>plan(true));ci.addEventListener('mouseleave',()=>plan(false));
ci.addEventListener('focus',()=>plan(true));ci.addEventListener('blur',()=>plan(false));
ci.addEventListener('click',()=>{const idle=Object.values(D).filter(s=>s.alive&&s.st==='idle');if(idle.length){plan(false);close();stop(idle,`Closed ${idle.map(s=>':'+s.p).join(' ')}`);}});

let undoSet=[],ut=0;
function stop(set,label){
  clearTimeout(ut);
  set.forEach(s=>s.alive=false);undoSet=set;reflow();summary();
  const mb=set.reduce((a,s)=>a+s.mb,0);
  $('uq').innerHTML=`<b>${label}</b> <span>· ${mb>=1000?gb(mb)+' GB':mb+' MB'} freed</span>`;
  ci.hidden=true;$('undo').hidden=false;
  const a=$('cdA');a.style.transition='none';a.setAttribute('stroke-dashoffset',0);
  requestAnimationFrame(()=>requestAnimationFrame(()=>{a.style.transition='stroke-dashoffset 8s linear';a.setAttribute('stroke-dashoffset',56.55);}));
  ut=setTimeout(endUndo,8000);
}
function endUndo(){$('undo').hidden=true;ci.hidden=false;summary();}
$('uBtn').onclick=()=>{clearTimeout(ut);undoSet.forEach(s=>s.alive=true);reflow();endUndo();};

/* card */
let cur=null;
function fact(v){
  if(v[0]==='@'){const [w,note]=v.slice(1).split('|');
    return `<button class="xl" data-wt="${w}">${G.wt}<span>${w}${note?' · '+note:''}</span><em>›</em></button>`;}
  return v;
}
function open(s){
  if(cur===s){close();return;}
  cur=s;
  Object.values(D).forEach(x=>x.el.classList.toggle('sel',x===s));
  const goes=s.status[0].startsWith('Goes');
  const acts=[['Stop',true],[s.st==='kept'?'Unkeep':'Keep',true],['Open',true],['Go to tab',!!s.tab]];
  card.innerHTML=`
    <div class="ct"><span class="p"><i>:</i>${s.p}</span><span class="n">${s.n}</span><span class="m">${s.mb}<small>MB</small></span></div>
    <div class="cs"><b class="${goes?'goes':'stays'}">${s.status[0]}</b> · ${s.status[1]}</div>
    <dl class="facts">${s.facts.map(f=>`<dt>${f[0]}</dt><dd>${fact(f[1])}</dd>`).join('')}</dl>
    <div class="acts">${acts.map(([a,ok],k)=>`<button class="act ${k===0&&s.st==='idle'?'pri':''}" data-a="${a}" ${ok?'':'disabled title="No tab: '+(s.ws==='Docker'?'runs in Docker':'started outside an agent')+'"'}><i>${A[a]}</i>${a}</button>`).join('')}</div>`;
  const sr=stage.getBoundingClientRect(),k=sr.width/1280;
  const r=s.el.getBoundingClientRect();
  const x=(r.left-sr.left)/k,y=(r.top-sr.top)/k,w=r.width/k;
  const pl=panel.offsetLeft,pr=pl+panel.offsetWidth;
  let left=x+w+10,ox='0px';
  if(left+300>pr-8){left=x-300-10;ox='300px';}
  if(left<12){left=Math.max(12,x+w/2-150);ox='150px';}
  card.style.setProperty('--ox',ox);
  card.style.left=left+'px';
  card.classList.add('on');
  card.style.top=Math.max(34,Math.min(y,800-card.offsetHeight-16))+'px';
}
function close(){cur=null;card.classList.remove('on');Object.values(D).forEach(x=>x.el.classList.remove('sel'));}
document.addEventListener('click',e=>{if(!card.contains(e.target)&&!e.target.closest('.tile'))close();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')close();});

let tt=0;
function say(msg){
  toast.textContent=msg;toast.style.top=(panel.offsetTop+panel.offsetHeight+10)+'px';toast.classList.add('on');
  requestAnimationFrame(()=>{toast.style.left=(panel.offsetLeft+panel.offsetWidth-toast.offsetWidth)+'px';});
  clearTimeout(tt);tt=setTimeout(()=>toast.classList.remove('on'),2200);
}
card.addEventListener('click',e=>{
  e.stopPropagation();
  const x=e.target.closest('.xl');if(x){say('WorkForest opens at '+x.dataset.wt);return;}
  const b=e.target.closest('.act');if(!b||b.disabled||!cur)return;
  const s=cur,a=b.dataset.a;
  if(a==='Stop'){close();stop([s],'Stopped :'+s.p);}
  else if(a==='Keep'){s.st='kept';s.f=0;s.status=['Stays','kept by you'];paint(s);summary();cur=null;open(s);}
  else if(a==='Unkeep'){
    if(s.o.st==='kept'){s.st='idle';s.f=1;s.status=['Goes now','no longer kept'];}else{s.st=s.o.st;s.f=s.o.f;s.status=s.o.status.slice();}
    paint(s);summary();cur=null;open(s);}
  else if(a==='Open')say('Opened localhost:'+s.p);
  else if(a==='Go to tab')say('Switched to '+s.tab);
});

function layout(){
  const ic=$('lhIcon'),w=panel.offsetWidth,cx=ic.offsetLeft+ic.offsetWidth/2;
  panel.style.left=Math.min(1280-12-w,cx-w+90)+'px';
}
function fit(){
  const s=Math.min(innerWidth/1280,innerHeight/800);
  stage.style.transform=`translate(${(innerWidth-1280*s)/2}px,${(innerHeight-800*s)/2}px) scale(${s})`;
}
addEventListener('resize',fit);fit();layout();
})();
</script>
</body>
