<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sidebar and Cards</title>
<style>
:root{
  --glass:rgba(28,29,38,.86);
  --group:rgba(255,255,255,.042);
  --line:rgba(255,255,255,.06);
  --tx:rgba(255,255,255,.94);
  --tx2:rgba(235,235,245,.56);
  --tx3:rgba(235,235,245,.32);
  --ease:cubic-bezier(.25,.8,.25,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#1a1636}
body{font-family:-apple-system,"SF Pro Text",system-ui,sans-serif;color:var(--tx);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;font-size:13px;cursor:default;user-select:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;text-align:left}
button:focus-visible{outline:2px solid rgba(255,255,255,.55);outline-offset:2px}
#stage{position:absolute;left:0;top:0;width:1280px;height:800px;transform-origin:0 0;overflow:hidden;
  background:
   radial-gradient(760px 560px at 10% 6%,#4b3c9e 0%,rgba(75,60,158,0) 70%),
   radial-gradient(700px 520px at 84% 2%,#22618f 0%,rgba(34,97,143,0) 70%),
   radial-gradient(820px 620px at 88% 104%,#a0436f 0%,rgba(160,67,111,0) 70%),
   radial-gradient(640px 520px at 18% 100%,#3a2463 0%,rgba(58,36,99,0) 75%),
   #1d1a3c}

/* menu bar */
.mb{position:absolute;left:0;right:0;top:0;height:26px;display:flex;align-items:center;justify-content:space-between;padding:0 12px 0 16px;background:rgba(18,14,40,.32);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);font-size:13px;color:rgba(255,255,255,.92);z-index:5}
.mb-l,.mb-r{display:flex;align-items:center;gap:20px}
.mb-l b{font-weight:700}
.mb-r{gap:16px}
.icons{display:flex;align-items:center}
.mi{display:flex;width:16px;margin-left:14px;overflow:hidden;transition:width .4s var(--ease),opacity .3s,margin .4s var(--ease)}
.mi:first-child{margin-left:0}
.mi.off{width:0;opacity:0;margin-left:0}
.mi.pop svg{animation:pop .45s var(--ease)}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.15)}100%{transform:scale(1)}}

/* window */
.win{position:absolute;left:240px;top:168px;width:800px;height:456px;display:grid;grid-template-columns:224px 1fr;background:var(--glass);backdrop-filter:blur(40px) saturate(1.6);-webkit-backdrop-filter:blur(40px) saturate(1.6);border:1px solid rgba(255,255,255,.09);border-radius:22px;box-shadow:0 40px 100px rgba(6,4,24,.55),0 0 0 .5px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.04);overflow:hidden}

/* sidebar */
.side{display:flex;flex-direction:column;padding:0 12px 12px;background:rgba(0,0,0,.14);border-right:1px solid var(--line)}
.lights{display:flex;gap:8px;height:52px;align-items:center;padding-left:8px}
.lights i{width:12px;height:12px;border-radius:50%;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.25)}
.lights i:nth-child(1){background:#ff5f57}.lights i:nth-child(2){background:#febc2e}.lights i:nth-child(3){background:#28c840}
.nav{display:flex;flex-direction:column;gap:2px}
.it{display:flex;align-items:center;gap:10px;height:38px;padding:0 12px 0 8px;border-radius:9px;font-size:13px;transition:background .2s}
.it:hover{background:rgba(255,255,255,.04)}
.it[aria-selected="true"]{background:rgba(255,255,255,.1)}
.sq{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;flex:none;background:var(--c);box-shadow:inset 0 .5px 0 rgba(255,255,255,.25)}
.it .n{flex:1;white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;flex:none;transition:background .3s,box-shadow .3s,opacity .3s}
.dot[data-m="2"]{background:var(--c)}
.dot[data-m="1"]{background:transparent;box-shadow:inset 0 0 0 1.5px var(--c)}
.dot[data-m="0"]{background:rgba(235,235,245,.22)}
.sep{height:1px;background:var(--line);margin:10px 8px}
.today{margin-top:auto;padding:14px 14px 12px;border-radius:13px;background:var(--group);border:.5px solid rgba(255,255,255,.035)}
.today h3{font-size:12px;font-weight:600;color:var(--tx2);margin-bottom:6px}
.today p{font-size:12.5px;line-height:1.45;color:var(--tx);transition:opacity .2s}
.today .ln{margin-top:10px;font-size:12.5px;font-weight:500;color:#8fb8ff;padding:2px 0}
.today .ln:hover{color:#b4cfff}

/* detail */
.detail{padding:30px 34px 28px;position:relative}
.pane{transition:opacity .2s,transform .28s var(--ease)}
.pane.out{opacity:0;transform:translateY(6px)}
.hd{display:flex;align-items:center;gap:14px;margin-bottom:26px}
.hd .bg{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex:none;background:var(--c);box-shadow:inset 0 .5px 0 rgba(255,255,255,.25)}
.hd h2{font-size:24px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.hd .cap{font-size:13px;color:var(--tx2);margin-top:4px;white-space:nowrap;transition:opacity .2s}
.hd .cap b{color:var(--tx);font-weight:500}
.lbl{font-size:12px;font-weight:600;color:var(--tx3);margin:0 0 9px 2px}

.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:26px}
.card{position:relative;height:140px;padding:15px 15px 14px;border-radius:14px;background:var(--group);box-shadow:inset 0 0 0 1px rgba(255,255,255,.05);display:flex;flex-direction:column;transition:background .3s var(--ease),box-shadow .3s var(--ease)}
.card:hover{background:rgba(255,255,255,.06)}
.card .ci{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;flex:none;background:rgba(255,255,255,.07);margin-bottom:12px;transition:background .3s}
.card .ci svg{transition:stroke .3s}
.card .t{font-size:14px;font-weight:600;margin-bottom:3px;color:var(--tx2);transition:color .3s}
.card .d{font-size:12px;line-height:1.4;color:var(--tx3);transition:color .3s}
.card .rd{position:absolute;right:13px;top:13px;width:16px;height:16px;border-radius:50%;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.16);display:grid;place-items:center;transition:background .3s,box-shadow .3s}
.card .rd svg{opacity:0;transform:scale(.5);transition:opacity .2s,transform .3s var(--ease)}
.card[aria-checked="true"]{background:color-mix(in srgb,var(--c) 11%,rgba(255,255,255,.03));box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--c) 75%,transparent)}
.card[aria-checked="true"] .ci{background:var(--c)}
.card[aria-checked="true"] .t{color:var(--tx)}
.card[aria-checked="true"] .d{color:var(--tx2)}
.card[aria-checked="true"] .rd{background:var(--c);box-shadow:none}
.card[aria-checked="true"] .rd svg{opacity:1;transform:none}
.card.k0[aria-checked="true"]{--c:rgba(235,235,245,.5)}

.group{background:var(--group);border-radius:13px;border:.5px solid rgba(255,255,255,.035);transition:opacity .35s var(--ease)}
.row{display:flex;align-items:center;gap:12px;height:48px;padding:0 10px 0 16px}
.row+.row{border-top:1px solid var(--line);margin-left:16px;padding-left:0}
.row .l{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;transition:opacity .2s}
.row .r{color:var(--tx2);white-space:nowrap;padding-right:6px;transition:opacity .2s}
.row .r b{color:var(--tx);font-weight:500}
.group.dim .row:first-child{opacity:.38;pointer-events:none}
.swap{opacity:0!important}

/* pop-up button */
.pop{display:flex;align-items:center;gap:9px;height:26px;padding:0 7px 0 11px;border-radius:7px;background:rgba(255,255,255,.09);box-shadow:inset 0 .5px 0 rgba(255,255,255,.12),0 .5px 1px rgba(0,0,0,.3);font-size:13px;color:var(--tx);white-space:nowrap;flex:none;min-width:84px;justify-content:space-between;transition:background .15s}
.pop:hover,.pop.open{background:rgba(255,255,255,.14)}
.pop svg{opacity:.6}

/* switches */
.sw{display:flex;align-items:center;justify-content:space-between;width:100%;height:48px;font-size:13px}
.sw i{width:32px;height:19px;border-radius:10px;background:rgba(255,255,255,.14);position:relative;transition:background .25s;flex:none;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.2)}
.sw i::after{content:"";position:absolute;left:2px;top:2px;width:15px;height:15px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.35);transition:transform .3s var(--ease)}
.sw[aria-checked="true"] i{background:#5B9BFF}
.sw[aria-checked="true"] i::after{transform:translateX(13px)}
.note{font-size:12px;color:var(--tx3);margin:10px 2px 0;line-height:1.45}

/* menu */
.menu{position:absolute;z-index:20;min-width:120px;padding:5px;border-radius:11px;background:rgba(44,45,58,.9);backdrop-filter:blur(30px) saturate(1.6);-webkit-backdrop-filter:blur(30px) saturate(1.6);border:.5px solid rgba(255,255,255,.14);box-shadow:0 18px 50px rgba(0,0,0,.5),0 0 0 .5px rgba(0,0,0,.5);opacity:0;transform:scale(.97);pointer-events:none;transition:opacity .14s,transform .18s var(--ease)}
.menu.on{opacity:1;transform:none;pointer-events:auto}
.menu button{display:flex;align-items:center;width:100%;height:26px;padding:0 14px 0 6px;border-radius:6px;font-size:13px;white-space:nowrap}
.menu button:focus-visible{outline:none}
.menu button .ck{width:20px;display:flex;justify-content:center;flex:none}
.menu button.hl{background:var(--mc);color:#12131a}
.menu button.hl svg{stroke:#12131a}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important}}
</style>
</head>
<body>
<div id="stage">
  <div class="mb">
    <div class="mb-l">
      <svg viewBox="0 0 17 20" width="13" height="16" aria-hidden="true"><path fill="#fff" d="M14.1 10.6c0-2.6 2.1-3.8 2.2-3.9-1.2-1.8-3.1-2-3.7-2-1.6-.2-3.1.9-3.9.9-.8 0-2-.9-3.4-.9C3.6 4.8 1.9 5.8 1 7.4c-1.9 3.3-.5 8.2 1.4 10.9.9 1.3 2 2.8 3.4 2.7 1.4-.1 1.9-.9 3.5-.9s2.1.9 3.5.9c1.5 0 2.4-1.3 3.3-2.7 1-1.5 1.5-3 1.5-3.1-.1 0-2.9-1.1-2.9-4.3zM11.5 3c.7-.9 1.2-2.1 1.1-3.3-1 0-2.3.7-3 1.6-.7.8-1.3 2-1.1 3.2 1.1.1 2.3-.6 3-1.5z"/></svg>
      <b>MinMacs</b><span>Edit</span><span>Window</span><span>Help</span>
    </div>
    <div class="mb-r">
      <div class="icons" id="icons"></div>
      <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M2 6.3a8.6 8.6 0 0 1 12 0M4.2 8.6a5.4 5.4 0 0 1 7.6 0"/><circle cx="8" cy="11.6" r="1.3" fill="#fff" stroke="none"/></svg>
      <svg viewBox="0 0 26 14" width="25" height="13" aria-hidden="true"><rect x=".7" y=".7" width="21.6" height="12.6" rx="3.6" fill="none" stroke="rgba(255,255,255,.55)" stroke-width="1.2"/><rect x="2.6" y="2.6" width="11.6" height="8.8" rx="2" fill="#fff"/><path d="M24 5v4" stroke="rgba(255,255,255,.55)" stroke-width="1.4" stroke-linecap="round"/></svg>
      <span>Tue 27 Oct&nbsp;&nbsp;16:42</span>
    </div>
  </div>

  <div class="win" id="win" role="dialog" aria-label="Settings">
    <aside class="side">
      <div class="lights"><i></i><i></i><i></i></div>
      <nav class="nav" id="nav" role="tablist" aria-orientation="vertical"></nav>
      <div class="today">
        <h3>Today</h3>
        <p id="today-t"></p>
        <button class="ln" id="undo"></button>
      </div>
    </aside>
    <main class="detail"><div class="pane" id="pane"></div></main>
  </div>

  <div class="menu" id="menu" role="menu"></div>
</div>

<script>
const G = {
  apps:'<rect x="4.2" y="4.2" width="7.6" height="7.6" rx="1.6"/><path d="M6.6 1.8v2.4M9.4 1.8v2.4M6.6 11.8v2.4M9.4 11.8v2.4M1.8 6.6h2.4M1.8 9.4h2.4M11.8 6.6h2.4M11.8 9.4h2.4"/>',
  servers:'<rect x="2.5" y="2.8" width="11" height="4.2" rx="1.4"/><rect x="2.5" y="9" width="11" height="4.2" rx="1.4"/><path d="M5.2 4.9h.01M5.2 11.1h.01" stroke-width="2.2"/>',
  trees:'<circle cx="4.6" cy="3.6" r="1.6"/><circle cx="4.6" cy="12.4" r="1.6"/><circle cx="11.4" cy="5.4" r="1.6"/><path d="M4.6 5.2v5.6M11.4 7c0 2.7-2.4 3.4-5.4 4.2"/>',
  disk:'<ellipse cx="8" cy="4" rx="5.5" ry="2"/><path d="M2.5 4v8c0 1.1 2.5 2 5.5 2s5.5-.9 5.5-2V4M2.5 8c0 1.1 2.5 2 5.5 2s5.5-.9 5.5-2"/>',
  awake:'<path d="M13.2 9.6A5.6 5.6 0 0 1 6.4 2.8a5.6 5.6 0 1 0 6.8 6.8z"/>',
  one:'<rect x="2.2" y="2.2" width="11.6" height="11.6" rx="3.4"/><path d="M5.2 10.6V5.6l2.8 3 2.8-3v5"/>',
  gear:'<circle cx="8" cy="8" r="2.2"/><path d="M8 1.8v1.8M8 12.4v1.8M1.8 8h1.8M12.4 8h1.8M3.6 3.6l1.3 1.3M11.1 11.1l1.3 1.3M3.6 12.4l1.3-1.3M11.1 4.9l1.3-1.3"/>',
  m0:'<circle cx="8" cy="8" r="5.6"/><path d="M4.1 11.9 11.9 4.1"/>',
  m1:'<path d="M2.6 4.4a2 2 0 0 1 2-2h6.8a2 2 0 0 1 2 2v4.4a2 2 0 0 1-2 2H7.2L4.4 13.4v-2.6h0a2 2 0 0 1-1.8-2z"/><path d="M8 8.4h.01"/>',
  m2:'<path d="M9 1.8 3.4 9h4.2L7 14.2 12.6 7H8.4z"/>'
};
const gl=(k,c,s,w)=>`<svg viewBox="0 0 16 16" width="${s}" height="${s}" fill="none" stroke="${c}" stroke-width="${w||1.6}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${G[k]}</svg>`;
const chev='<svg viewBox="0 0 8 12" width="7" height="11" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1.5 4.3 4 1.8l2.5 2.5M1.5 7.7 4 10.2l2.5-2.5"/></svg>';
const check=(c,s)=>`<svg viewBox="0 0 12 12" width="${s||11}" height="${s||11}" fill="none" stroke="${c||'#fff'}" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.2 6.4 4.8 9 9.8 3.2"/></svg>`;
const MODES=['Off','Ask','Auto'];
const st={undone:false,sel:'apps'};
const nextRun={daily:'tomorrow',weekly:'on Sunday',monthly:'on 1 Nov'};
const S=[
  {id:'apps',name:'Apps',c:'#5B9BFF',mode:2,vals:['60 %','70 %','80 %','90 %'],v:1,
   desc:['Not watching apps','Shows noise apps to close','Closes noise apps when the Mac is busy'],
   rule:['Close noise apps when load is over','Show noise apps when load is over','Close noise apps when load is over'],
   cap:m=>['Not watching','<b>2</b> noise apps open now', st.undone?'<b>2</b> reopened, nothing closed today':'<b>2</b> closed today'][m]},
  {id:'servers',name:'Servers',c:'#3FD0B8',mode:2,vals:['30 min','1 h','2 h','4 h','1 day'],v:2,
   desc:['Not watching servers','Shows idle localhost servers','Stops servers nobody used'],
   rule:['Stop servers nobody used for','Show servers nobody used for','Stop servers nobody used for'],
   cap:m=>['Not watching','<b>3</b> idle now', st.undone?'<b>6</b> idle now, nothing stopped today':'<b>3</b> idle now · <b>3</b> stopped today'][m]},
  {id:'trees',name:'Worktrees',c:'#4CC96B',mode:1,vals:['1 h','1 day','1 week'],v:1,
   desc:['Not watching worktrees','Shows merged git worktrees','Removes merged worktrees. Undo brings them back'],
   rule:['Remove merged worktrees after','Show merged worktrees after','Remove merged worktrees after'],
   cap:m=>['Not watching','<b>4</b> merged · <b>5.7 GB</b>','<b>4</b> merged · <b>5.7 GB</b>'][m]},
  {id:'disk',name:'Disk',c:'#F2B544',mode:2,vals:['Daily','Weekly','Monthly'],v:1,
   desc:['Not watching the disk','Shows caches and build output safe to clean','Moves safe clutter to the Trash'],
   rule:['Clean','Check','Clean'],
   cap:function(m){return m?`<b>30 GB</b> safe to clean · next ${nextRun[this.vals[this.v].toLowerCase()]}`:'Not watching'}},
  {id:'awake',name:'Keep Awake',c:'#B18CFF',mode:2,vals:['10 %','20 %','30 %','Never'],v:1,
   desc:['The Mac sleeps as usual','Asks when an agent starts working','Keeps the Mac awake while agents work, then sleeps'],
   rule:['End at battery','End at battery','End at battery'],
   cap:m=>['The Mac sleeps as usual','<b>4</b> agents working now','<b>4</b> agents working, awake until done'][m]}
];
const $=id=>document.getElementById(id);
const sec=id=>S.find(x=>x.id===id);
const capOf=s=>s.cap.call(s,s.mode);

function renderNav(){
  $('nav').innerHTML=S.map(s=>`<button class="it" role="tab" id="it-${s.id}" data-sel="${s.id}" aria-selected="${st.sel===s.id}" style="--c:${s.c}">
      <span class="sq">${gl(s.id,'#14151d',14,1.7)}</span><span class="n">${s.name}</span><span class="dot" data-m="${s.mode}" title="${MODES[s.mode]}"></span></button>`).join('')
    +`<div class="sep"></div><button class="it" role="tab" id="it-general" data-sel="general" aria-selected="${st.sel==='general'}" style="--c:rgba(235,235,245,.42)">
      <span class="sq">${gl('gear','#14151d',14,1.7)}</span><span class="n">General</span></button>`;
}
function paneHTML(){
  if(st.sel==='general') return `
    <div class="hd" style="--c:rgba(235,235,245,.42)"><span class="bg">${gl('gear','#14151d',22,1.6)}</span>
      <div><h2>General</h2><div class="cap">How MinMacs shows up on your Mac</div></div></div>
    <div class="group">
      <div class="row"><button class="sw" id="one" role="switch" aria-checked="${st.one}"><span>One icon in the menu bar</span><i></i></button></div>
      <div class="row"><button class="sw" id="login" role="switch" aria-checked="${st.login}"><span>Open at login</span><i></i></button></div>
    </div>
    <p class="note">With one icon, the five section icons fold into a single MinMacs icon.</p>`;
  const s=sec(st.sel);
  return `
    <div class="hd" style="--c:${s.c}"><span class="bg">${gl(s.id,'#14151d',22,1.6)}</span>
      <div><h2>${s.name}</h2><div class="cap" id="cap">${capOf(s)}</div></div></div>
    <div class="lbl">Mode</div>
    <div class="cards" role="radiogroup" aria-label="${s.name} mode" style="--c:${s.c}">
      ${MODES.map((m,i)=>`<button class="card k${i}" role="radio" data-m="${i}" aria-checked="${i===s.mode}">
        <span class="rd">${check('#14151d',10)}</span>
        <span class="ci">${gl('m'+i, i===s.mode?'#14151d':'rgba(235,235,245,.5)',15)}</span>
        <span class="t">${m}</span><span class="d">${s.desc[i]}</span></button>`).join('')}
    </div>
    <div class="lbl">Rule</div>
    <div class="group${s.mode?'':' dim'}" id="rules">
      <div class="row"><span class="l" id="rule">${s.rule[s.mode]}</span>
        <button class="pop" id="pop" aria-haspopup="menu"><span>${s.vals[s.v]}</span>${chev}</button></div>
    </div>`;
}
st.one=false; st.login=true;
function select(id){
  if(st.sel===id) return; closeMenu();
  st.sel=id;
  document.querySelectorAll('.it').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.sel===id)));
  const p=$('pane'); p.classList.add('out');
  setTimeout(()=>{p.innerHTML=paneHTML(); requestAnimationFrame(()=>p.classList.remove('out'))},170);
}
function swapText(el,html){
  if(!el||el.innerHTML===html) return;
  el.classList.add('swap'); setTimeout(()=>{el.innerHTML=html; el.classList.remove('swap')},150);
}
function setMode(m){
  const s=sec(st.sel); if(s.mode===m) return;
  const was=s.mode; s.mode=m;
  document.querySelectorAll('.card').forEach(c=>{const on=+c.dataset.m===m; c.setAttribute('aria-checked',String(on)); c.querySelector('.ci svg').setAttribute('stroke',on?'#14151d':'rgba(235,235,245,.5)')});
  $('rules').classList.toggle('dim',!m);
  swapText($('cap'),capOf(s)); swapText($('now'),capOf(s)); swapText($('rule'),s.rule[m]);
  const d=$('it-'+s.id).querySelector('.dot'); d.dataset.m=m; d.title=MODES[m];
  renderIcons(was===0&&m?s.id:null);
}
function renderToday(){
  $('today-t').textContent = st.undone ? 'Reopened 2 apps and restarted 3 servers.' : 'Closed 2 apps and stopped 3 servers.';
  $('undo').textContent = st.undone ? 'Redo' : 'Undo';
}
function renderIcons(pop){
  const box=$('icons');
  if(!box.children.length) box.innerHTML=S.map(s=>`<span class="mi" id="mi-${s.id}" data-sel="${s.id}" title="${s.name}">${gl(s.id,'#fff',16)}</span>`).join('')+`<span class="mi off" id="mi-one" data-sel="general" title="MinMacs">${gl('one','#fff',16)}</span>`;
  S.forEach(s=>$('mi-'+s.id).classList.toggle('off', st.one||s.mode===0));
  $('mi-one').classList.toggle('off',!st.one);
  if(pop){ const el=$('mi-'+pop); el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop'); }
}

/* pop-up menu, opened so the chosen item sits on top of the button */
const menu=$('menu'); let openFor=null, hi=0;
function openMenu(s,btn){
  openFor=s; hi=s.v;
  menu.style.setProperty('--mc',s.c);
  menu.innerHTML=s.vals.map((v,i)=>`<button role="menuitemradio" aria-checked="${i===s.v}" data-i="${i}" class="${i===hi?'hl':''}"><span class="ck">${i===s.v?check():''}</span>${v}</button>`).join('');
  const r=btn.getBoundingClientRect(), sr=$('stage').getBoundingClientRect(), z=sr.width/1280;
  const bx=(r.left-sr.left)/z, by=(r.top-sr.top)/z, bw=r.width/z;
  menu.style.minWidth=(bw+24)+'px';
  let top=by-5-s.v*26; top=Math.max(32,Math.min(top,800-menu.offsetHeight-8));
  menu.style.left=(bx-15)+'px'; menu.style.top=top+'px';
  menu.style.transformOrigin=`20px ${by-top+13}px`;
  btn.classList.add('open'); menu.classList.add('on');
  requestAnimationFrame(()=>menu.querySelector('.hl')?.focus({preventScroll:true}));
}
function closeMenu(){ if(!openFor) return; const b=$('pop'); b&&b.classList.remove('open'); menu.classList.remove('on'); b&&b.focus({preventScroll:true}); openFor=null }
function pick(i){
  const s=openFor; s.v=i; $('pop').firstElementChild.textContent=s.vals[i];
  closeMenu(); swapText($('cap'),capOf(s)); swapText($('now'),capOf(s));
}
function setHi(i){ hi=i; menu.querySelectorAll('button').forEach((b,j)=>b.classList.toggle('hl',j===i)); menu.children[i].focus({preventScroll:true}) }
menu.addEventListener('mousemove',e=>{const b=e.target.closest('button'); if(b&&+b.dataset.i!==hi) setHi(+b.dataset.i)});
menu.addEventListener('click',e=>{const b=e.target.closest('button'); if(b) pick(+b.dataset.i)});
document.addEventListener('keydown',e=>{
  if(openFor){
    const n=openFor.vals.length;
    if(e.key==='Escape'){e.preventDefault();closeMenu()}
    else if(e.key==='ArrowDown'){e.preventDefault();setHi((hi+1)%n)}
    else if(e.key==='ArrowUp'){e.preventDefault();setHi((hi+n-1)%n)}
    else if(e.key==='Enter'||e.key===' '){e.preventDefault();pick(hi)}
    return;
  }
  const it=e.target.closest&&e.target.closest('.it');
  if(it&&(e.key==='ArrowDown'||e.key==='ArrowUp')){
    e.preventDefault(); const all=[...document.querySelectorAll('.it')], j=all.indexOf(it), nx=all[(j+(e.key==='ArrowDown'?1:all.length-1))%all.length];
    nx.focus(); select(nx.dataset.sel);
  }
});
document.addEventListener('mousedown',e=>{ if(openFor && !e.target.closest('#menu') && !e.target.closest('.pop')) closeMenu() });
document.addEventListener('click',e=>{
  const it=e.target.closest('[data-sel]'); if(it){ select(it.dataset.sel); return }
  const c=e.target.closest('.card'); if(c){ setMode(+c.dataset.m); return }
  const p=e.target.closest('.pop'); if(p){ const s=sec(st.sel); openFor? closeMenu() : openMenu(s,p); return }
  if(e.target.closest('#undo')){ st.undone=!st.undone; const t=$('today-t'); t.style.opacity=0; setTimeout(()=>{renderToday(); t.style.opacity=1},150);
    if(st.sel==='apps'||st.sel==='servers'){ const s=sec(st.sel); swapText($('cap'),capOf(s)); swapText($('now'),capOf(s)) } return }
  const sw=e.target.closest('.sw'); if(sw){ const on=sw.getAttribute('aria-checked')!=='true'; sw.setAttribute('aria-checked',String(on)); st[sw.id]=on; if(sw.id==='one') renderIcons() }
});

function fit(){ const s=$('stage'), z=Math.min(innerWidth/1280,innerHeight/800); s.style.transform=`translate(${(innerWidth-1280*z)/2}px,${(innerHeight-800*z)/2}px) scale(${z})` }
addEventListener('resize',()=>{closeMenu();fit()});
renderNav(); $('pane').innerHTML=paneHTML(); renderToday(); renderIcons(); fit();
</script>
</body>
