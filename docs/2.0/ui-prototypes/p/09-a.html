<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Workstream Cards</title>
<style>
:root{
  --glass:rgba(28,29,38,.86);
  --edge:rgba(255,255,255,.09);
  --hair:rgba(255,255,255,.06);
  --tx:#F2F3F7; --tx2:#A4A6B3; --tx3:#6E7080;
  --mm:91,155,255; --loco:63,208,184; --forest:76,201,107; --noo:242,181,68; --ins:177,140,255;
  --ease:cubic-bezier(.22,.8,.26,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{
  font-family:-apple-system,"SF Pro Text",system-ui,sans-serif;color:var(--tx);
  background:#1d1a3c;
  -webkit-font-smoothing:antialiased;font-feature-settings:"tnum" 1;
}
.desk{position:fixed;inset:0;background:
  radial-gradient(900px 600px at 12% 8%,#43348f 0%,transparent 60%),
  radial-gradient(800px 600px at 88% 6%,#1f5a86 0%,transparent 60%),
  radial-gradient(900px 700px at 90% 100%,#8b3b64 0%,transparent 62%),
  radial-gradient(700px 600px at 20% 100%,#2a2350 0%,transparent 70%),
  #211c45;}
#stage{position:absolute;width:1280px;height:800px;transform-origin:0 0}

/* menu bar */
.mbar{position:absolute;left:0;right:0;top:0;height:26px;display:flex;align-items:center;
  padding:0 10px 0 14px;font-size:13px;background:rgba(20,18,40,.38);
  -webkit-backdrop-filter:blur(20px) saturate(1.4);backdrop-filter:blur(20px) saturate(1.4);color:#fff}
.mbar .l{display:flex;gap:18px;align-items:center}
.mbar .l b{font-weight:700}
.mbar .l span{opacity:.92}
.mbar .r{margin-left:auto;display:flex;align-items:center;gap:4px}
.mi{display:flex;align-items:center;gap:4px;height:22px;padding:0 7px;border-radius:5px;font-size:12.5px;font-weight:500}
.mi svg{width:15px;height:15px}
.mi.on{background:rgba(255,255,255,.2)}
.mi .u{color:rgba(255,255,255,.55);font-size:11px;margin-left:-2px}
.clock{padding:0 6px 0 8px;font-weight:500}

/* glass panel */
.panel{position:absolute;top:34px;right:76px;width:616px;
  background:var(--glass);border:1px solid var(--edge);border-radius:22px;
  -webkit-backdrop-filter:blur(30px) saturate(1.3);backdrop-filter:blur(30px) saturate(1.3);
  box-shadow:0 30px 80px rgba(8,6,24,.45),0 2px 8px rgba(0,0,0,.2);padding:14px 12px 10px}
.phead{display:flex;align-items:center;padding:2px 8px 12px 8px}
.phead h1{font-size:15px;font-weight:600;letter-spacing:.1px}
.phead .sub{color:var(--tx3);font-size:12.5px;margin-left:8px}
.sizes{margin-left:auto;display:flex;gap:6px}
.sz{width:26px;height:26px;border-radius:50%;border:0;display:grid;place-items:center;cursor:pointer;
  background:rgba(255,255,255,.07);color:var(--tx2);transition:background .2s var(--ease),color .2s}
.sz svg{width:14px;height:14px}
.sz.on{background:rgba(var(--mm),1);color:#12131a}

/* badges */
.b{--c:var(--mm);width:22px;height:22px;flex:0 0 22px;border-radius:50%;display:grid;place-items:center;
  background:rgba(var(--c),.24);color:rgb(var(--c));position:relative}
.b svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.b.idle{background:transparent;box-shadow:inset 0 0 0 1.5px rgba(var(--c),.6)}
.b.goes{background:transparent;border:1.5px dashed rgba(var(--c),.8)}
.b.off{background:rgba(255,255,255,.05);color:#5d5f6c}
.b.arc{background:rgba(var(--c),.14)}
.b.arc .ring{position:absolute;inset:-1px;width:24px;height:24px}
.b.arc .ring circle{fill:none;stroke:rgb(var(--c));stroke-width:2;stroke-linecap:round;
  stroke-dasharray:22 100;transform-origin:12px 12px;animation:spin 3.2s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.c-mm{--c:var(--mm)}.c-loco{--c:var(--loco)}.c-forest{--c:var(--forest)}.c-noo{--c:var(--noo)}.c-ins{--c:var(--ins)}

/* workstream cards */
.list{display:flex;flex-direction:column;gap:8px}
.card{background:rgba(255,255,255,.035);border:1px solid var(--hair);border-radius:16px;padding:13px 16px 12px;
  overflow:hidden;transition:background .25s var(--ease),opacity .4s var(--ease),transform .4s var(--ease)}
.card:hover{background:rgba(255,255,255,.05)}
.top{display:flex;align-items:center;gap:11px}
.agent{width:26px;height:26px;flex:0 0 26px}
.who .n{white-space:nowrap;font-size:15px;font-weight:600;letter-spacing:.1px}
.who .s{font-size:12px;color:var(--tx3);margin-top:1px}
.state{white-space:nowrap;margin-left:auto;display:flex;align-items:center;gap:7px;font-size:13px;font-weight:500}
.state .age{color:var(--tx3);font-weight:400}
.mk{width:9px;height:9px;border-radius:50%;position:relative}
.mk.work{background:var(--tx)}
.mk.work::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:1.5px solid rgba(255,255,255,.35);animation:pulse 2.4s var(--ease) infinite}
@keyframes pulse{0%{transform:scale(.6);opacity:1}100%{transform:scale(1.5);opacity:0}}
.mk.idle{box-shadow:inset 0 0 0 1.5px var(--tx2)}
.mk.plan{width:11px;height:11px;border:1.5px dashed var(--tx2)}
.mk.done{width:14px;height:14px;background:rgba(255,255,255,.14);display:grid;place-items:center}
.mk.done svg{width:9px;height:9px;stroke:var(--tx);stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}

.facts{display:grid;grid-template-columns:1fr 1fr;column-gap:24px;row-gap:2px;margin-top:12px;padding-left:2px}
.f{display:flex;align-items:center;gap:10px;height:28px;font-size:13px;min-width:0;border-radius:8px;cursor:default}
.f .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.f .d{color:var(--tx3);font-size:12px;margin-left:5px}
.f .v{margin-left:auto;white-space:nowrap;padding-left:6px}
.f .v .u{color:var(--tx3);font-size:11.5px;margin-left:2px}
.f .v.g{color:var(--tx3);font-size:12px}
.f .verb{display:none;color:var(--tx2);font-size:12.5px;width:58px;flex:0 0 58px}
.f.dim .nm{color:var(--tx3)}

.foot{display:flex;align-items:center;gap:10px;margin-top:9px;padding-left:2px;min-height:30px}
.foot .msg{font-size:12.5px;color:var(--tx2)}
.foot .msg b{color:var(--tx);font-weight:500}
.btn{white-space:nowrap;margin-left:auto;height:28px;padding:0 14px;border-radius:14px;border:0;cursor:pointer;
  font:500 12.5px -apple-system,"SF Pro Text",system-ui;background:rgba(255,255,255,.1);color:var(--tx);
  transition:background .2s var(--ease),transform .15s var(--ease)}
.btn:hover{background:rgba(255,255,255,.16)}
.btn:active{transform:scale(.97)}
.btn.pri{background:#F2F3F7;color:#15161d}
.btn.pri:hover{background:#fff}
.btn+.btn{margin-left:6px}

/* plan mode */
.card.plan .facts{grid-template-columns:1fr}
.card.plan .f.noplan{display:none}
.card.plan .f .verb{display:block}
.f .pd{display:none}.card.plan .f .pd{display:inline}.card.plan .f .nd{display:none}
.f .undo{display:none;color:var(--tx3);font-size:12px;margin-left:auto;padding-left:10px;white-space:nowrap}
.card.plan .f .undo{display:block}
.card.plan .f .v{display:none}
.f .tick{width:16px;height:16px;flex:0 0 16px;margin-left:8px;opacity:0;transform:scale(.6);transition:opacity .25s,transform .3s var(--ease)}
.f .tick svg{width:16px;height:16px;stroke:rgb(var(--forest));fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.card.plan .f .tick{display:block}
.f.doneStep .tick{opacity:1;transform:none}
.f.doneStep .nm{color:var(--tx3)}
.f .tick{display:none}

/* wrapped row */
.wrapped{display:flex;align-items:center;gap:11px;padding:11px 16px;border-radius:16px;
  background:rgba(var(--forest),.07);border:1px solid rgba(var(--forest),.16);font-size:13px;
  animation:slideIn .45s var(--ease)}
.wrapped .mk.done{background:rgba(var(--forest),.25)}
.wrapped .mk.done svg{stroke:rgb(var(--forest))}
.wrapped .t2{color:var(--tx3);font-size:12px;margin-left:4px}
@keyframes slideIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}

/* strip mode */
.strip{display:none;align-items:center;gap:6px;margin-left:14px}
.panel.small .facts,.panel.small .foot.normal{display:none}
.panel.small .strip{display:flex}
.panel.small .card{padding:10px 14px}
.panel.small .who .s{display:none}
.panel.small .who{width:150px;flex:0 0 150px}
.panel.small .strip{margin-left:0}
.panel.small .btn.wrap-s{display:inline-block}
.btn.wrap-s{display:none;height:24px;padding:0 11px;font-size:12px;margin-left:10px}
.panel.small .state{margin-left:auto}

/* orphan footer */
.orph{display:flex;align-items:center;gap:10px;padding:12px 10px 4px;margin-top:6px;border-top:1px solid var(--hair);font-size:12.5px;color:var(--tx3)}
.orph .it{display:flex;align-items:center;gap:8px;color:var(--tx2);cursor:default}
.orph .it .g{color:var(--tx3)}
.orph .lbl{margin-right:4px}

/* hover card */
.tip{position:absolute;width:300px;background:rgba(30,31,41,.94);border:1px solid var(--edge);border-radius:16px;
  -webkit-backdrop-filter:blur(30px);backdrop-filter:blur(30px);padding:13px 14px 12px;
  box-shadow:0 18px 50px rgba(6,5,20,.5);opacity:0;transform:translateY(4px) scale(.98);pointer-events:none;
  transition:opacity .18s var(--ease),transform .22s var(--ease);z-index:20}
.tip.show{opacity:1;transform:none;pointer-events:auto}
.tip .tt{display:flex;align-items:center;gap:9px;font-size:13.5px;font-weight:600}
.tip .st{font-size:12.5px;margin:7px 0 9px;color:var(--tx2)}
.tip .st b{font-weight:600}
.tip dl{display:grid;grid-template-columns:auto 1fr;column-gap:14px;row-gap:5px;font-size:12.5px;padding:9px 0 10px;border-top:1px solid var(--hair)}
.tip dt{color:var(--tx3)}
.tip dd{text-align:right;color:var(--tx)}
.tip dt{white-space:nowrap}
.tip .acts{display:flex;flex-wrap:wrap;gap:6px;padding-top:10px;border-top:1px solid var(--hair)}
.tip .acts button{height:24px;padding:0 10px;border-radius:12px;border:0;background:rgba(255,255,255,.09);color:var(--tx);font:500 12px -apple-system,system-ui;cursor:pointer}
.tip .acts button:hover{background:rgba(255,255,255,.16)}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:opacity .2s linear!important}
  .b.arc .ring circle{stroke-dasharray:22 100}
}
</style>
</head>

const COL={mm:'rgb(91,155,255)',loco:'rgb(63,208,184)',forest:'rgb(76,201,107)',noo:'rgb(242,181,68)',ins:'rgb(177,140,255)',rose:'#FF8E9E'};

const list=document.getElementById('list');
function factHTML(f){
  const v=f.g?`<span class="v g">${f.g}</span>`:(f.v?`<span class="v">${f.v}<span class="u">${f.u}</span></span>`:'');
  const d=(f.d?`<span class="d nd">${f.d}</span>`:'')+(f.pd?`<span class="d pd">${f.pd}</span>`:'');
  return `<div class="f ${f.dim?'dim':''} ${f.noplan?'noplan':''}" data-tip="${f.tip}">${badge(f.k,f.s)}
   <span class="verb">${f.verb||''}</span><span class="nm">${f.n}${d}</span>${v}<span class="undo">${f.undo||''}</span><span class="tick">${TICK}</span></div>`;
}
function mark(st){return st==='done'?`<span class="mk done">${CHECK}</span>`:`<span class="mk ${st}"></span>`}
function cardHTML(w){
  const strip=w.facts.map(f=>`<span data-tip="${f.tip}">${badge(f.k,f.s)}</span>`).join('');
  return `<div class="card" id="c-${w.id}">
   <div class="top">${AG[w.agent]}<div class="who"><div class="n">${w.name}</div><div class="s">${w.sub}</div></div>
     <div class="strip">${strip}</div>
     <div class="state">${mark(w.st)}<span class="sw">${w.stw}</span><span class="age">${w.age}</span></div>
     ${w.wrap?'<button class="btn wrap-s" data-act="plan">Wrap Up</button>':''}
   </div>
   <div class="facts">${w.facts.map(factHTML).join('')}</div>
   <div class="foot normal">${w.wrap?
     `<span class="msg">Frees <b>4.2 GB</b> disk and <b>290 MB</b> memory</span><button class="btn pri" data-act="plan">Wrap Up</button>`:
     `<span class="msg">${w.foot}</span>`}</div>
  </div>`;
}
function render(){list.innerHTML=WS.map(cardHTML).join('');bindTips(list)}
render();

/* Wrap Up flow */
let timers=[];
list.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const card=document.getElementById('c-ar');
  const act=b.dataset.act;
  if(act==='plan'){
    setSize(false);
    card.classList.add('plan');
    card.querySelector('.sw').textContent='Wrap Up plan';card.querySelector('.state .mk').outerHTML='<span class="mk plan"></span>';
    card.querySelector('.age').textContent='';
    card.querySelector('.foot').innerHTML=`<span class="msg">Only these three. Undo brings them back.</span><button class="btn" data-act="cancel">Cancel</button><button class="btn pri" data-act="go">Wrap Up</button>`;
  }
  if(act==='cancel'){render()}
  if(act==='go'){
    card.querySelector('.foot').innerHTML=`<span class="msg">Wrapping up…</span>`;
    const steps=[...card.querySelectorAll('.f:not(.noplan)')];
    const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
    steps.forEach((s,i)=>timers.push(setTimeout(()=>s.classList.add('doneStep'),reduce?0:280+i*360)));
    timers.push(setTimeout(()=>{
      card.style.opacity='0';card.style.transform='translateY(-4px)';
      setTimeout(()=>{
        card.outerHTML=`<div class="wrapped" id="c-ar">${AG.codex}<span class="mk done">${CHECK}</span>
         <span>fix auth redirect wrapped up</span><span class="t2">:4000 stopped · 4.2 GB in Trash · 16:42</span>
         <button class="btn" data-act="undo">Undo</button></div>`;
      },reduce?0:320);
    },reduce?100:280+steps.length*360+300));
  }
  if(act==='undo'){timers.forEach(clearTimeout);render();
    const c=document.getElementById('c-ar');c.style.animation='slideIn .45s var(--ease)';}
});

/* size toggle */
const panel=document.getElementById('panel');
function setSize(small){panel.classList.toggle('small',small);szS.classList.toggle('on',small);szL.classList.toggle('on',!small);hideTip(true)}
szL.onclick=()=>setSize(false);szS.onclick=()=>setSize(true);

/* hover cards */
const stage=document.getElementById('stage'),tip=document.getElementById('tip');
let scale=1,hideT;
function showTip(el){
  const d=TIPS[el.dataset.tip];if(!d)return;clearTimeout(hideT);
  tip.innerHTML=`<div class="tt">${badge(d.k,'')}${d.t}</div>
   <div class="st"><b style="color:${COL[d.c]}">${d.w}</b> · ${d.s}</div>
   <dl>${d.f.map(([a,b])=>`<dt>${a}</dt><dd>${b}</dd>`).join('')}</dl>
   ${d.a.length?`<div class="acts">${d.a.map(a=>`<button>${a}</button>`).join('')}</div>`:''}`;
  const r=el.getBoundingClientRect(),s=stage.getBoundingClientRect();
  let x=(r.left-s.left)/scale, y=(r.bottom-s.top)/scale+8;
  const pr=panel.getBoundingClientRect();
  // place to the left of the panel, aligned with the row
  if(el.closest('.panel')){x=(pr.left-s.left)/scale-300-12;y=(r.top-s.top)/scale-10}
  else{x=Math.min(x,1280-280)}
  tip.style.left=x+'px';tip.style.top=Math.min(y,800-tip.offsetHeight-12)+'px';
  tip.classList.add('show');
}
function hideTip(now){clearTimeout(hideT);hideT=setTimeout(()=>tip.classList.remove('show'),now===true?0:140)}
function bindTips(root){root.querySelectorAll('[data-tip]').forEach(el=>{el.onmouseenter=()=>showTip(el);el.onmouseleave=hideTip})}
bindTips(document);
tip.onmouseenter=()=>clearTimeout(hideT);tip.onmouseleave=hideTip;

function fit(){scale=Math.min(innerWidth/1280,innerHeight/800);
  stage.style.transform=`scale(${scale})`;
  stage.style.left=(innerWidth-1280*scale)/2+'px';stage.style.top=(innerHeight-800*scale)/2+'px'}
addEventListener('resize',fit);fit();
if(location.hash==='#small')setSize(true);
if(location.hash==='#plan')document.querySelector('#c-ar [data-act=plan]').click();
if(location.hash==='#done'){document.querySelector('#c-ar [data-act=plan]').click();document.querySelector('#c-ar [data-act=go]').click()}
if(location.hash==='#tip')showTip(document.querySelector('.f[data-tip=s4000]'));
</script>
