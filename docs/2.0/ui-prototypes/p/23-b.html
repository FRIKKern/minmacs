<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agent Matrix</title>
<style>
:root{
  --glass:rgba(28,29,38,.88);
  --line:rgba(255,255,255,.06);
  --tx:rgba(255,255,255,.94);
  --tx2:rgba(235,235,245,.55);
  --tx3:rgba(235,235,245,.28);
  --ease:cubic-bezier(.3,.7,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#1a1636}
body{font-family:-apple-system,"SF Pro Text",system-ui,sans-serif;color:var(--tx);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;font-size:13px;cursor:default;user-select:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;text-align:left}
:focus{outline:none}
:focus-visible{outline:2px solid rgba(255,255,255,.55);outline-offset:3px;border-radius:8px}
small{font-size:.86em;color:var(--tx2)}
#stage{position:absolute;left:0;top:0;width:1280px;height:800px;transform-origin:0 0;overflow:hidden;
  background:
   radial-gradient(760px 560px at 10% 6%,#4b3c9e 0%,rgba(75,60,158,0) 70%),
   radial-gradient(700px 520px at 84% 2%,#22618f 0%,rgba(34,97,143,0) 70%),
   radial-gradient(820px 620px at 88% 104%,#a0436f 0%,rgba(160,67,111,0) 70%),
   radial-gradient(640px 520px at 18% 100%,#3a2463 0%,rgba(58,36,99,0) 75%),
   #1d1a3c}
.mb{position:absolute;left:0;right:0;top:0;height:26px;display:flex;align-items:center;justify-content:space-between;padding:0 12px 0 16px;background:rgba(18,14,40,.32);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);font-size:13px;color:rgba(255,255,255,.92);z-index:5}
.mb-l,.mb-r{display:flex;align-items:center;gap:18px}
.mb-l b{font-weight:700}
.mb-r{gap:14px}
.icons{position:relative;display:flex;align-items:center;gap:12px}
.hl{position:absolute;left:0;top:-3px;height:22px;width:28px;border-radius:6px;background:rgba(255,255,255,.2);transition:transform .45s var(--ease),width .45s var(--ease),opacity .3s;pointer-events:none}
.mi{position:relative;display:flex;width:16px;overflow:hidden;cursor:pointer;transition:width .4s var(--ease),opacity .3s,margin .4s var(--ease)}
.mi.off{width:0;opacity:0;margin-left:-12px}

.sheet{position:absolute;top:34px;left:480px;width:760px;background:var(--glass);backdrop-filter:blur(36px) saturate(1.5);-webkit-backdrop-filter:blur(36px) saturate(1.5);border:1px solid rgba(255,255,255,.085);border-radius:22px;box-shadow:0 34px 100px rgba(6,4,24,.5),inset 0 1px 0 rgba(255,255,255,.035);animation:drop .6s var(--ease) both}
@keyframes drop{from{opacity:0;transform:translateY(-10px)}}
.nub{position:absolute;top:-8px;left:0;width:18px;height:8px;margin-left:-9px;transition:transform .45s var(--ease)}
.nub svg{display:block}
.head{display:flex;align-items:center;gap:12px;height:52px;padding:0 36px;white-space:nowrap}
.head .lbl{font-size:12px;color:var(--tx3)}
.head .txt{font-size:13px;color:var(--tx2)}
.head .txt b{font-weight:500;color:var(--tx)}
.head .undo{margin-left:auto;font-size:13px;font-weight:500;padding:4px 12px;border-radius:12px;background:rgba(255,255,255,.07);transition:background .2s}
.head .undo:hover{background:rgba(255,255,255,.13)}

/* matrix */
.mx-wrap{position:relative;margin:0 36px}
.colhl{position:absolute;top:-6px;bottom:-4px;left:0;width:0;border-radius:12px;background:rgba(255,255,255,.045);box-shadow:inset 0 0 0 1px rgba(255,255,255,.04);transition:transform .55s var(--ease),width .55s var(--ease),opacity .3s;pointer-events:none}
.mx{position:relative;display:grid;column-gap:8px;transition:grid-template-columns .55s var(--ease)}
.ch{height:58px;display:flex;flex-direction:column;justify-content:flex-end;padding:0 0 8px 10px;min-width:0;overflow:hidden}
.ch.ag{padding-left:0}
.ch .cn{font-size:13px;line-height:16px;font-weight:600;letter-spacing:-.01em;color:rgba(235,235,245,.4);transition:color .3s,font-size .4s var(--ease)}
.ch.sel .cn{font-size:17px;line-height:20px;white-space:nowrap}
.ch.ag .cn{font-size:20px;line-height:24px;white-space:nowrap}
.ch .cm{display:flex;align-items:center;gap:6px;margin-top:3px;font-size:11px;color:var(--tx3);white-space:nowrap}
.ch .dot{width:7px;height:7px;border-radius:50%;box-shadow:inset 0 0 0 1.3px rgba(235,235,245,.28);transition:background .35s,box-shadow .35s}
.ch:hover .cn{color:var(--tx2)}
.ch.sel .cn{color:var(--tx)}
.ch.sel .cm{color:var(--tx2)}
.lc{display:flex;align-items:center;gap:9px;height:28px;white-space:nowrap;min-width:0}
.lc .ic{position:relative;width:18px;height:18px;flex:none}
.lc .ic>svg{display:block}
.lc .an{font-size:13px;color:var(--tx);overflow:hidden;text-overflow:ellipsis;min-width:0}
.lc .aw{margin-left:auto;font-size:11.5px;color:var(--tx3);flex:none}
.lc .aw.nd{color:#FF9F5A}
.lc.dim .an{color:var(--tx2)}
.sd{position:absolute;right:-3px;bottom:-3px;width:8px;height:8px;border-radius:50%;border:1.5px solid #22232d}
.sd.working{background:#fff}
.sd.needs{background:#FF9F5A;border-radius:1.5px;transform:rotate(45deg);width:7.5px;height:7.5px}
.sd.idle{background:#22232d;box-shadow:inset 0 0 0 1.3px rgba(235,235,245,.5)}
.sd.done{background:rgba(235,235,245,.5)}
.cell{display:flex;align-items:center;gap:6px;height:28px;padding-left:10px;white-space:nowrap;min-width:0;overflow:hidden;cursor:pointer;transition:opacity .35s}
.cell.off{opacity:.35}
.cell .tx{font-size:12px;color:var(--tx2);max-width:0;opacity:0;overflow:hidden;transition:opacity .3s,max-width .55s var(--ease)}
.cell.sel .tx{max-width:150px;opacity:1;transition:opacity .4s .15s,max-width .55s var(--ease)}
.cell .tx b{font-weight:500;color:var(--tx)}
.cell .tx em{font-style:normal;color:var(--c)}
.mk{flex:none;width:6px;height:6px;border-radius:50%;margin-left:-11px;margin-right:-1px;transition:background .35s,box-shadow .35s,transform .35s var(--ease);transform:scale(0)}
.mk.on{background:var(--c);transform:none}
.mk.ask{box-shadow:inset 0 0 0 1.3px var(--c);transform:none}
.cell>svg,.cell .m{flex:none}
.ring circle{transition:stroke-dashoffset .9s var(--ease)}
.mc{display:flex;align-items:flex-end;gap:3px;height:20px}
.mc i{width:6px;border-radius:2px;height:3px;transition:height .8s var(--ease),background .4s,box-shadow .4s}
.mc .inuse{background:rgba(235,235,245,.55)}
.mc .fine{background:rgba(255,255,255,.14)}
.mc .stale{background:repeating-linear-gradient(135deg,rgba(235,235,245,.32) 0 1.5px,transparent 1.5px 3.5px);box-shadow:inset 0 0 0 1px rgba(235,235,245,.26)}
.mc .mg{box-shadow:inset 0 0 0 1.3px #4CC96B}
.mc .mg.due{background:#4CC96B;box-shadow:none}
.db{display:flex;gap:2px;height:5px}
.db i{height:5px;border-radius:2.5px;background:#F2B544;width:0;transition:width .8s var(--ease)}
.db i.fd{opacity:.35}
.aw-d{width:10px;height:10px;border-radius:50%;transition:background .35s,box-shadow .35s}
.aw-d.hold{background:#B18CFF}
.aw-d.wait{box-shadow:inset 0 0 0 1.5px #B18CFF}
.aw-d.offh{box-shadow:inset 0 0 0 1.5px rgba(177,140,255,.4)}
.mxcap{margin:12px 36px 0;font-size:12px;line-height:16px;color:var(--tx3);height:16px;white-space:nowrap;transition:opacity .25s}
.mxcap b{font-weight:500;color:var(--tx2)}

/* panel */
.panel{display:grid;grid-template-columns:1fr 316px;column-gap:40px;margin:14px 36px 0;padding:16px 0 18px;border-top:1px solid var(--line);height:154px}
.pn{transition:opacity .22s,transform .35s var(--ease)}
.pn.swap{opacity:0;transform:translateY(5px)}
.lab{font-size:12px;color:var(--tx3)}
.big{display:flex;align-items:baseline;gap:6px;white-space:nowrap;height:46px;margin-top:2px}
.big .n{font-size:40px;font-weight:500;letter-spacing:-.02em;line-height:46px}
.big .u{font-size:15px;color:var(--tx2)}
.big .n2{margin-left:14px;font-size:13.5px;color:var(--tx2)}
.big .n2 b{font-weight:500;color:var(--tx)}
.big .n.w{font-size:24px;color:var(--tx3)}
.insight{margin-top:6px;font-size:13.5px;line-height:19px;color:var(--tx2)}
.insight b{font-weight:500;color:var(--tx)}
.modes{position:relative;display:flex;gap:22px;height:42px;align-items:flex-start;margin-top:2px}
.modes button{font-size:28px;font-weight:600;letter-spacing:-.02em;line-height:34px;color:var(--tx3);transition:color .3s}
.modes button:hover{color:var(--tx2)}
.modes button[aria-checked="true"]{color:var(--tx)}
.bar{position:absolute;left:0;top:38px;height:2px;border-radius:1px;background:var(--c);transition:transform .45s var(--ease),width .45s var(--ease),opacity .35s}
.rule{margin-top:8px;font-size:13px;line-height:18px;color:var(--tx2);min-height:18px}
.vals{margin-top:12px;display:flex;align-items:baseline;gap:16px;white-space:nowrap;transition:opacity .3s}
.opts{display:flex;gap:16px;height:24px;align-items:flex-start}
.opts button{position:relative;font-size:14.5px;color:var(--tx3);line-height:20px;transition:color .25s}
.opts button:hover{color:var(--tx2)}
.opts button[aria-checked="true"]{color:var(--tx);font-weight:500}
.opts button[aria-checked="true"]::after{content:"";position:absolute;left:50%;bottom:-5px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--c)}
.pr.off .vals{opacity:.3;pointer-events:none}
.legend{display:grid;grid-template-columns:auto 1fr;column-gap:12px;row-gap:8px;margin-top:8px;font-size:12px;color:var(--tx2);align-items:center}
.legend .k{display:flex;align-items:center;justify-content:center;width:44px}

.foot{display:flex;align-items:center;gap:28px;height:54px;padding:0 36px;border-top:1px solid var(--line)}
.sw{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--tx2);transition:color .2s}
.sw i{width:32px;height:19px;border-radius:10px;background:rgba(255,255,255,.14);position:relative;transition:background .25s;flex:none}
.sw i::after{content:"";position:absolute;left:2px;top:2px;width:15px;height:15px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .25s var(--ease)}
.sw[aria-checked="true"]{color:var(--tx)}
.sw[aria-checked="true"] i{background:#5B9BFF}
.sw[aria-checked="true"] i::after{transform:translateX(13px)}
.foot .hint{margin-left:auto;font-size:11px;color:var(--tx3)}
.tip{position:absolute;left:0;top:0;z-index:30;pointer-events:none;padding:6px 10px;border-radius:8px;background:rgba(46,46,60,.97);border:1px solid rgba(255,255,255,.08);box-shadow:0 8px 24px rgba(0,0,0,.35);font-size:12px;color:var(--tx);white-space:nowrap;opacity:0;transform:translate(-50%,calc(-100% - 6px));transition:opacity .15s}
.tip.on{opacity:1}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:.01ms!important;transition-delay:0s!important;animation-duration:.01ms!important}}
</style>
</head>
<body>
<div id="stage">
  <div class="mb">
    <div class="mb-l">
      <svg viewBox="0 0 17 20" width="13" height="16" aria-hidden="true"><path fill="#fff" d="M14.1 10.6c0-2.6 2.1-3.8 2.2-3.9-1.2-1.8-3.1-2-3.7-2-1.6-.2-3.1.9-3.9.9-.8 0-2-.9-3.4-.9C3.6 4.8 1.9 5.8 1 7.4c-1.9 3.3-.5 8.2 1.4 10.9.9 1.3 2 2.8 3.4 2.7 1.4-.1 1.9-.9 3.5-.9s2.1.9 3.5.9c1.5 0 2.4-1.3 3.3-2.7 1-1.5 1.5-3 1.5-3.1-.1 0-2.9-1.1-2.9-4.3zM11.5 3c.7-.9 1.2-2.1 1.1-3.3-1 0-2.3.7-3 1.6-.7.8-1.3 2-1.1 3.2 1.1.1 2.3-.6 3-1.5z"/></svg>

      <span>Tue 27 Oct&nbsp;&nbsp;16:42</span>

  </div>

  <div class="sheet" id="sheet" role="dialog" aria-label="Settings">
    <div class="nub" id="nub"><svg viewBox="0 0 18 8" width="18" height="8" aria-hidden="true"><path d="M0 8 C5 8 6.5 0 9 0 C11.5 0 13 8 18 8 Z" fill="rgba(36,36,48,.96)"/></svg></div>
    <div class="head" id="today"></div>
    <div class="mx-wrap"><i class="colhl" id="colhl"></i><div class="mx" id="mx" role="grid" aria-label="Agents and what they hold"></div></div>

      <div class="pn" id="pl"></div>
      <div class="pn pr" id="pr"></div>

      <button class="sw" id="one" role="switch" aria-checked="false"><i></i>One icon in the menu bar</button>

      <span class="hint">Pick a column to see its setting</span>
    </div>
  </div>

</div>

<script>
const G = {
  apps:'<rect x="4.2" y="4.2" width="7.6" height="7.6" rx="1.6"/><path d="M6.6 1.8v2.4M9.4 1.8v2.4M6.6 11.8v2.4M9.4 11.8v2.4M1.8 6.6h2.4M1.8 9.4h2.4M11.8 6.6h2.4M11.8 9.4h2.4"/>',
  servers:'<rect x="2.5" y="2.8" width="11" height="4.2" rx="1.4"/><rect x="2.5" y="9" width="11" height="4.2" rx="1.4"/><path d="M5.2 4.9h.01M5.2 11.1h.01" stroke-width="2.2"/>',
  trees:'<circle cx="4.6" cy="3.6" r="1.6"/><circle cx="4.6" cy="12.4" r="1.6"/><circle cx="11.4" cy="5.4" r="1.6"/><path d="M4.6 5.2v5.6M11.4 7c0 2.7-2.4 3.4-5.4 4.2"/>',
  disk:'<ellipse cx="8" cy="4" rx="5.5" ry="2"/><path d="M2.5 4v8c0 1.1 2.5 2 5.5 2s5.5-.9 5.5-2V4M2.5 8c0 1.1 2.5 2 5.5 2s5.5-.9 5.5-2"/>',
  awake:'<path d="M1.8 8s2.3-4.3 6.2-4.3S14.2 8 14.2 8s-2.3 4.3-6.2 4.3S1.8 8 1.8 8z"/><circle cx="8" cy="8" r="1.9"/>',
  one:'<circle cx="8" cy="8" r="5.8"/><path d="M8 4.6v3.6l2.4 1.4"/>'
};
const COL={apps:'#5B9BFF',servers:'#3FD0B8',trees:'#4CC96B',disk:'#F2B544',awake:'#B18CFF'};
const gl=(k,c,s)=>`<svg viewBox="0 0 16 16" width="${s}" height="${s}" fill="none" stroke="${c}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${G[k]}</svg>`;
function tool(t,s){
  if(t==='cc') return `<svg viewBox="0 0 20 20" width="${s}" height="${s}" aria-hidden="true"><circle cx="10" cy="10" r="10" fill="#D97757"/><path d="M10 4.8v10.4M4.8 10h10.4M6.3 6.3l7.4 7.4M13.7 6.3l-7.4 7.4" stroke="#fff" stroke-width="1.7" stroke-linecap="round"/></svg>`;
  if(t==='codex') return `<svg viewBox="0 0 20 20" width="${s}" height="${s}" aria-hidden="true"><circle cx="10" cy="10" r="10" fill="#ECECF1"/><path d="M6.2 7.3l2.7 2.7-2.7 2.7M10.6 13h3.4" fill="none" stroke="#1b1b20" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  if(t==='none') return `<svg viewBox="0 0 20 20" width="${s}" height="${s}" aria-hidden="true"><circle cx="10" cy="10" r="9.2" fill="none" stroke="rgba(235,235,245,.3)" stroke-width="1.4" stroke-dasharray="2.4 2.2"/></svg>`;
  return `<svg viewBox="0 0 20 20" width="${s}" height="${s}" aria-hidden="true"><circle cx="10" cy="10" r="10" fill="#2a2a31"/><circle cx="10" cy="10" r="9.5" fill="none" stroke="rgba(255,255,255,.16)"/><path d="M10 4.9l4.4 2.55v5.1L10 15.1l-4.4-2.55v-5.1zM10 10l4.4-2.55M10 10v5.1M10 10L5.6 7.45" fill="none" stroke="#fff" stroke-width="1.2" stroke-linejoin="round"/></svg>`;
}
function appIcon(k,s=16){
  if(k==='spotify') return `<svg viewBox="0 0 20 20" width="${s}" height="${s}" aria-hidden="true"><circle cx="10" cy="10" r="10" fill="#1DB954"/><path d="M5.2 7.6c3.3-1 6.9-.7 9.7.9M5.8 10.4c2.7-.8 5.6-.5 7.9.8M6.4 13c2.1-.6 4.3-.4 6.1.6" fill="none" stroke="#0b2a17" stroke-width="1.5" stroke-linecap="round"/></svg>`;
  if(k==='cmux') return `<svg viewBox="0 0 20 20" width="${s}" height="${s}" aria-hidden="true"><rect width="20" height="20" rx="5" fill="#15151a"/><rect x=".5" y=".5" width="19" height="19" rx="4.5" fill="none" stroke="rgba(255,255,255,.2)"/><path d="M5.5 7l3 3-3 3M10 13.5h4.5" fill="none" stroke="#7CE38B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  if(k==='cursor') return tool('cursor',s);
  const a = k==='cft' ? ['#E58A3A','#F2C14E','#B56A2C','#F7E3C4'] : ['#DB4437','#F4B400','#0F9D58','#4285F4'];
  return `<svg viewBox="0 0 20 20" width="${s}" height="${s}" aria-hidden="true"><path d="M10 10L10 0A10 10 0 0 1 18.66 15Z" fill="${a[0]}" transform="rotate(-60 10 10)"/><path d="M10 10L10 0A10 10 0 0 1 18.66 15Z" fill="${a[1]}" transform="rotate(60 10 10)"/><path d="M10 10L10 0A10 10 0 0 1 18.66 15Z" fill="${a[2]}" transform="rotate(180 10 10)"/><circle cx="10" cy="10" r="4.6" fill="#fff"/><circle cx="10" cy="10" r="3.4" fill="${a[3]}"/></svg>`;
}

/* rows: agents, then everything nobody owns */
const ROWS=[
 {id:'speed-3',t:'cc',st:'working',w:'2m',tip:'Claude Code in cmux, working 2m'},
 {id:'bp-lane-c',t:'cc',st:'working',w:'14m',tip:'Claude Code, working 14m'},
 {id:'media-scope',t:'codex',st:'working',w:'6m',tip:'Codex, working 6m'},
 {id:'studio-icons',t:'cursor',st:'working',w:'1m',tip:'Cursor, working 1m'},
 {id:'lexicon-judge',t:'cc',st:'needs',w:'3m',tip:'Claude Code, needs you for 3m'},
 {id:'studio-parity',t:'cc',st:'idle',w:'40m',tip:'Claude Code, idle 40m'},
 {id:'fix auth redirect',t:'codex',st:'done',w:'2h',tip:'Codex, finished 2h ago'},
 {id:'5 more',t:'cc',st:'idle',w:'1h+',more:1,tip:'lane-e, fieldsets, w19, dogfood, sweep-403'},
 {id:'No agent',t:'none',none:1,w:'',tip:'Things no agent owns'}
];
/* what each row holds, per section */
const SRV={':3000':{k:'next dev',idle:0,use:'in use'},':5173':{k:'vite',idle:0,use:'in use'},':3334':{k:'sanity',idle:40},':4000':{k:'phoenix',idle:120},':6006':{k:'storybook',idle:4320},':5432':{k:'postgres',idle:0,use:'kept'}};
const LIM=[30,60,120,240,1440];
const AFTER=[60,1440,10080];
const H={
 apps:{'speed-3':[['cmux','kept, hosts the agent']],'studio-icons':[['cursor','kept, in use']],'lexicon-judge':[['cft','spared, Playwright drives it']],'No agent':[['chrome','21 %, 8.7 GB, 14 noise tabs',1],['spotify','1 %, 578 MB',1]]},
 servers:{'speed-3':[':3000',':5173'],'studio-parity':[':3334'],'fix auth redirect':[':4000'],'No agent':[':6006',':5432']},
 trees:{'speed-3':[['speed-3-base','inuse',2.1]],'bp-lane-c':[['bp-lane-c','inuse',1.6]],'media-scope':[['media-scope','inuse',1.3]],'studio-parity':[['studio-parity','fine',2.6]],
   'fix auth redirect':[['auth-redirect','mg',1.8,2880]],'5 more':[['lane-e-sort','mg',2.3,4320],['sb-fieldsets','mg',.94,7200],['w19-fire','mg',.61,12960],['bp7-studio-dogfood','stale',3.2],['bp8-sweep-studio403','stale',1.1]],
   'No agent':[['studio-rhythm','fine',1.4],['studio-collab','fine',.9],['studio-dayref','fine',1.2],['lexicon-deploy','fine',.7]]},
 disk:{'lexicon-judge':[['old Playwright',3.3,0]],'fix auth redirect':[['node_modules',2.6,1]],'5 more':[['node_modules',7.2,1]],'No agent':[['DerivedData',14.2,1],['npm cache',6.1,1],['Docker cache',4.2,0],['Simulators',.8,0]]},
 awake:{'speed-3':'hold','bp-lane-c':'hold','media-scope':'hold','studio-icons':'hold','lexicon-judge':'wait'}
};
const NEXT=['tonight','on Sunday','on 1 Nov'];
const MODES=['Off','Ask','Auto'];
let undone=false, sel='servers';
const S=[
 {id:'apps',name:'Apps',c:COL.apps,mode:2,lab:'When load is above',vals:['60 %','70 %','80 %','90 %'],th:[60,70,80,90],v:1,
  rule:['Not watching apps.','Shows noise apps you could close when the Mac is busy.','Closes noise apps when the Mac is busy.'],
  big(){ return !this.mode?['Not watching']:this.mode===2?[undone?'0':'2','closed today','load <b>63 %</b>']:['2','ready to close','load <b>63 %</b>'] },
  insight(){ const t=this.th[this.v], over=63>=t;
    if(!this.mode) return 'Not watching apps. Chrome uses the most memory, 8.7 GB, and no agent needs it.';
    return over?`Load is <b>63 %</b>, over ${t} %, so ${this.mode===2?'Auto closes':'you are asked about'} Chrome and Spotify now. No agent uses them.`:`Load is <b>63 %</b>, under ${t} %. Chrome and Spotify go next; no agent uses them. lexicon-judge’s Chrome for Testing is spared.`},
  cap(){ return `Icons are apps each agent uses. <b>Dot</b>: ${this.mode===2?'Auto closes':'shown to close'} when load passes ${this.vals[this.v]}.` }},
 {id:'servers',name:'Servers',c:COL.servers,mode:2,lab:'Idle for',vals:['30 min','1 h','2 h','4 h','1 day'],v:2,
  rule:['Not watching servers.','Shows localhost servers nobody is using.','Stops localhost servers nobody used.'],
  big(){ return !this.mode?['Not watching']:this.mode===2?['3','idle now',`<b>${undone?0:3}</b> stopped today`]:['3','idle now'] },
  insight(){ return this.mode?'<b>3 servers idle.</b> :6006 storybook has been idle 3 days and nobody owns it. fix auth redirect is done but holds :4000.':'Not watching. 6 servers run, 2.19 GB in all; speed-3 is using two of them.' },
  cap(){ return `Ring fills toward ${this.vals[this.v]} idle; a full ring is past it. <b>Dot</b>: ${this.mode===2?'Auto stops it':'shown to stop'}.` }},
 {id:'trees',name:'Worktrees',c:COL.trees,mode:1,lab:'After merge',vals:['1 h','1 day','1 week'],v:1,
  rule:['Not watching worktrees.','Shows git worktrees that are merged.','Removes merged worktrees. Undo brings them back.'],
  free(){ let g=0; Object.values(H.trees).flat().forEach(x=>{ if(x[1]==='mg'&&x[3]>=AFTER[this.v]) g+=x[2] }); return g.toFixed(2) },
  big(){ return !this.mode?['Not watching']:['4','merged',`<b>${this.free()}</b> GB ${this.mode===2?'to free':'ready'}`] },
  insight(){ return this.mode?'<b>4 merged worktrees</b> hold 5.65 GB, all from agents that are done. dogfood’s bp7-studio-dogfood is stale 21 days with 1 commit not in main.':'Not watching. 14 worktrees, 3 in use by speed-3, bp-lane-c and media-scope.' },
  cap(){ return `Column height is size. <b>Solid green</b>: merged over ${this.vals[this.v]} ago, ${this.mode===2?'Remove Merged takes it':'shown to remove'}.` }},
 {id:'disk',name:'Disk',c:COL.disk,mode:2,lab:'How often',vals:['daily','weekly','monthly'],v:1,
  rule:['Not watching the disk.','Shows caches and build output that are safe to clean.','Moves safe caches and build output to the Trash.'],
  big(){ return !this.mode?['Not watching']:['30.1','GB safe',(this.mode===2?'next ':'check ')+NEXT[this.v]] },
  insight(){ return this.mode?'The disk is <b>82 % full</b>, 812 of 994 GB. 38.4 GB is clutter; the biggest piece is Xcode DerivedData, which no agent owns.':'Not watching. The disk is 82 % full, 182 GB free.' },
  cap(){ return `Bar is the clutter each agent left. <b>Solid</b>: ${this.mode===2?'Clean Safe moves it to the Trash':'shown as safe'}; faded is shown only.` }},
 {id:'awake',name:'Keep Awake',c:COL.awake,mode:2,lab:'Ends at battery',vals:['10 %','20 %','30 %','never'],bt:[10,20,30,null],v:1,
  rule:['The Mac sleeps as usual.','Asks when an agent starts working.','Keeps the Mac awake while agents work, then lets it sleep.'],
  big(){ return this.mode?['4','agents keep it awake','battery <b>64 %</b>']:['Sleeps as usual'] },
  insight(){ const b=this.bt[this.v];
    if(!this.mode) return 'The Mac sleeps as usual, even while 4 agents work.';
    return `Awake because <b>speed-3, bp-lane-c, media-scope and studio-icons</b> work. It sleeps when the last one finishes${b?`, or at ${b} % battery`:''}.`},
  cap(){ return this.mode?'<b>Filled</b>: holds the Mac awake. Ring: waiting on you, not holding. Also ends if the network drops or the Mac runs hot.':'Nothing holds the Mac awake.' }}
];
const AGV={id:'agents',name:'Agents'};
const $=id=>document.getElementById(id);
const sec=id=>S.find(s=>s.id===id);
const cur=()=>sec(sel)||AGV;

/* ---------- matrix cells ---------- */
function ringSvg(p){ return `<svg class="ring m" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="5.8" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="2.2" ${SRV[p].use==='kept'?'stroke-dasharray="1.6 1.8"':''}/><circle data-ring="${p}" cx="8" cy="8" r="5.8" fill="none" stroke="#3FD0B8" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="36.4" stroke-dashoffset="36.4" transform="rotate(-90 8 8)"/>${SRV[p].use==='in use'?'<circle cx="8" cy="8" r="1.8" fill="rgba(235,235,245,.7)"/>':''}</svg>` }
function cellHTML(sid,r){
  const h=H[sid][r.id]; let m='';
  if(sid==='apps'&&h) m=h.map(a=>`<span class="m" data-tip="${{cmux:'cmux',cursor:'Cursor',cft:'Chrome for Testing',chrome:'Google Chrome',spotify:'Spotify'}[a[0]]}: ${a[1]}">${appIcon(a[0])}</span>`).join('');
  if(sid==='servers'&&h) m=h.map(p=>`<span class="m" data-tip="${p} ${SRV[p].k} · ${SRV[p].use||'idle '+(SRV[p].idle>=1440?SRV[p].idle/1440+' d':SRV[p].idle>=60?SRV[p].idle/60+' h':SRV[p].idle+' m')}">${ringSvg(p)}</span>`).join('');
  if(sid==='trees'&&h) m=`<span class="mc m">${h.map(x=>`<i class="${x[1]}" data-h="${x[2]}" data-age="${x[3]||''}" data-tip="${x[0]} · ${({inuse:'in use',fine:'fine',stale:'stale',mg:'merged'})[x[1]]} · ${x[2]} GB"></i>`).join('')}</span>`;
  if(sid==='disk'&&h) m=`<span class="db m" data-tip="${h.map(x=>x[0]+' '+x[1]+' GB'+(x[2]?'':' (shown only)')).join(', ')}">${h.map(x=>`<i class="${x[2]?'':'fd'}" data-gb="${x[1]}"></i>`).join('')}</span>`;
  if(sid==='awake'&&h) m=`<i class="aw-d m" data-aw="${h}"></i>`;
  return `<div class="cell" data-s="${sid}" data-r="${r.id}" style="--c:${COL[sid]}"><i class="mk"></i>${m}<span class="tx"></span></div>`;
}
function buildMatrix(){
  let html=`<button class="ch ag" data-s="agents" id="ch-agents"><span class="cn">Agents</span><span class="cm">12 · 4 working</span></button>`;
  html+=S.map(s=>`<button class="ch" data-s="${s.id}" id="ch-${s.id}"><span class="cn">${s.name}</span><span class="cm"><i class="dot"></i><span class="mw"></span></span></button>`).join('');
  ROWS.forEach(r=>{
    html+=`<div class="lc${r.none?' dim':''}" data-tip="${r.tip}"><span class="ic">${r.more?`<svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><circle cx="5" cy="9" r="2" fill="rgba(235,235,245,.45)"/><circle cx="9" cy="9" r="2" fill="rgba(235,235,245,.45)"/><circle cx="13" cy="9" r="2" fill="rgba(235,235,245,.45)"/></svg>`:tool(r.t,18)}${r.none||r.more?'':`<i class="sd ${r.st}"></i>`}</span><span class="an">${r.id}</span><span class="aw${r.st==='needs'?' nd':''}">${r.w}</span></div>`;
    html+=S.map(s=>cellHTML(s.id,r)).join('');
  });
  $('mx').innerHTML=html;
}
/* text + marks per cell, from the current settings */
function cellState(s,r){
  const h=H[s.id][r.id]; if(!h) return {t:'',act:false};
  if(s.id==='apps'){ const t=s.th[s.v], act=h.some(a=>a[2]);
    const names={cmux:'cmux',cursor:'Cursor',cft:'Chrome for Testing',chrome:'Chrome',spotify:'Spotify'};
    if(act) return {act:true,t:63>=t?'<em>close now</em>':`close at <b>${t} %</b>`};
    return {act:false,t:`<b>${names[h[0][0]]}</b>`} }
  if(s.id==='servers'){ const L=LIM[s.v]; const due=h.filter(p=>SRV[p].idle>=L);
    const word=p=>SRV[p].use||((SRV[p].idle>=1440?SRV[p].idle/1440+'d':SRV[p].idle>=60?SRV[p].idle/60+'h':SRV[p].idle+'m'));
    const t = h.length>1&&h.every(p=>SRV[p].use==='in use') ? `<b>${h.join(' ')}</b> in use` : h.map(p=>`<b>${p}</b> ${SRV[p].idle>=L?'<em>'+word(p)+'</em>':word(p)}`).join(' ');
    return {act:due.length>0,t} }
  if(s.id==='trees'){ const A=AFTER[s.v]; const due=h.filter(x=>x[1]==='mg'&&x[3]>=A);
    let t; if(h.length>1){ const c={}; h.forEach(x=>c[x[1]]=(c[x[1]]||0)+1); t=Object.entries(c).map(([k,n])=>`<b>${n}</b> ${({inuse:'in use',fine:'fine',stale:'stale',mg:'merged'})[k]}`).join(' · ') }
    else t=`<b>${h[0][0]}</b> ${({inuse:'in use',fine:'',stale:'stale',mg:'merged'})[h[0][1]]}`;
    return {act:due.length>0,t} }
  if(s.id==='disk'){ const safe=h.filter(x=>x[2]).reduce((a,x)=>a+x[1],0), all=h.reduce((a,x)=>a+x[1],0);
    const t = h.length>1 ? `<b>${safe.toFixed(1)} GB</b> safe` : `<b>${h[0][0]}</b> ${h[0][1]} GB`;
    return {act:safe>0,t} }
  if(s.id==='awake'){ return {act:h==='hold',t:h==='hold'?(s.mode?'<b>holds it awake</b>':'working'):'waiting on you'} }
}
const COLW=(id)=> id==='agents' ? '162px repeat(5,96px)' : '162px '+S.map(s=>s.id===id?'176px':'76px').join(' ');
function layout(){
  $('mx').style.gridTemplateColumns=COLW(sel);
  // highlight behind the picked column, from the target widths
  const ws=sel==='agents'?[96,96,96,96,96]:S.map(s=>s.id===sel?176:76);
  const hl=$('colhl');
  if(sel==='agents'){ hl.style.transform='translateX(-14px)'; hl.style.width='184px'; }
  else { const i=S.findIndex(s=>s.id===sel); let x=162+8; for(let j=0;j<i;j++) x+=ws[j]+8; hl.style.transform=`translateX(${x}px)`; hl.style.width=ws[i]+'px' }
  document.querySelectorAll('.ch').forEach(c=>c.classList.toggle('sel',c.dataset.s===sel));
  document.querySelectorAll('.cell').forEach(c=>c.classList.toggle('sel',c.dataset.s===sel));
}
function updCells(){
  S.forEach(s=>{
    const L=LIM[S[1].v];
    document.querySelectorAll(`.cell[data-s="${s.id}"]`).forEach(c=>{
      const r=ROWS.find(x=>x.id===c.dataset.r), st=cellState(s,r);
      c.classList.toggle('off',!s.mode);
      c.querySelector('.tx').innerHTML=st.t;
      c.querySelector('.mk').className='mk'+(st.act&&s.mode&&s.id!=='awake'?(s.mode===2?' on':' ask'):'');
    });
  });
  const Ls=LIM[sec('servers').v];
  document.querySelectorAll('[data-ring]').forEach(a=>{ const p=SRV[a.dataset.ring]; const f=p.idle?Math.min(1,p.idle/Ls):0; a.style.strokeDashoffset=36.4*(1-f) });
  const T=sec('trees'), A=AFTER[T.v];
  document.querySelectorAll('.mc i').forEach(i=>{ i.style.height=(4+(+i.dataset.h)/3.2*16)+'px'; if(i.classList.contains('mg')) i.classList.toggle('due',T.mode>0&&+i.dataset.age>=A) });
  document.querySelectorAll('.db i').forEach(i=>i.style.width=((+i.dataset.gb)*1.5)+'px');
  const K=sec('awake'); document.querySelectorAll('.aw-d').forEach(d=>{ const h=d.dataset.aw; d.className='aw-d m '+(h==='hold'?(K.mode?'hold':'offh'):'wait') });
  S.forEach(s=>{ const c=$('ch-'+s.id); c.querySelector('.dot').setAttribute('style',dot(s)); c.querySelector('.mw').textContent=MODES[s.mode] });
}
function dot(s){ return s.mode===2?`background:${s.c};box-shadow:none`:s.mode===1?`background:transparent;box-shadow:inset 0 0 0 1.3px ${s.c}`:'' }

/* ---------- panel ---------- */
function bigHTML(n){ return n.length===1?`<span class="n w">${n[0]}</span>`:`<span class="n">${n[0]}</span><span class="u">${n[1]}</span>${n[2]?`<span class="n2">${n[2]}</span>`:''}` }
function panelHTML(){
  const s=cur();
  if(s.id==='agents') return [
    `<div class="lab">Right now</div><div class="big"><span class="n">12</span><span class="u">agents</span><span class="n2"><b>4</b> working</span></div>
     <p class="insight"><b>4 are working</b> and keep the Mac awake. lexicon-judge needs you; fix auth redirect is done but still holds :4000.</p>`,
    `<div class="lab">How to read a row</div><div class="legend">
      <span class="k">${ringSvg(':3334').replace('stroke-dashoffset="36.4"','stroke-dashoffset="24"').replace('data-ring','data-x')}</span><span>server, ring fills toward idle-out</span>
      <span class="k"><span class="mc"><i class="inuse" style="height:14px"></i><i class="mg due" style="height:9px"></i></span></span><span>worktree, height is size</span>
      <span class="k"><span class="db"><i style="width:22px"></i></span></span><span>clutter it left on disk</span>
      <span class="k"><i class="aw-d hold"></i></span><span>holds the Mac awake</span></div>`];
  return [
    `<div class="lab">Right now</div><div class="big" id="big"></div><p class="insight" id="ins"></p>`,
    `<div class="lab">Setting</div><div class="modes" role="radiogroup" aria-label="${s.name} mode">${MODES.map((m,i)=>`<button role="radio" aria-checked="${i===s.mode}" data-m="${i}">${m}</button>`).join('')}<i class="bar" id="bar"></i></div>
     <p class="rule" id="rule"></p>
     <div class="vals"><span class="lab">${s.lab}</span><div class="opts" role="radiogroup" aria-label="${s.lab}">${s.vals.map((v,i)=>`<button role="radio" aria-checked="${i===s.v}" data-v="${i}">${v}</button>`).join('')}</div></div>`];
}
function placeBar(instant){
  const s=cur(), b=$('bar'); if(!b) return; const t=document.querySelector(`.modes button[data-m="${s.mode}"]`);
  if(instant) b.style.transition='none';
  b.style.width=t.offsetWidth+'px'; b.style.transform=`translateX(${t.offsetLeft}px)`; b.style.opacity=s.mode?1:.35;
  if(instant){ void b.offsetWidth; b.style.transition='' }
}
function updPanel(){
  const s=cur(); $('mxcap').innerHTML = s.id==='agents' ? 'Each row is an agent, each column what it holds there. Items with a <b>dot</b> are the ones a section acts on.' : s.cap();
  if(s.id==='agents') return;
  $('pr').classList.toggle('off',!s.mode);
  document.querySelectorAll('.modes button').forEach(b=>b.setAttribute('aria-checked',String(+b.dataset.m===s.mode)));
  document.querySelectorAll('.opts button').forEach(b=>b.setAttribute('aria-checked',String(+b.dataset.v===s.v)));
  $('big').innerHTML=bigHTML(s.big()); $('ins').innerHTML=s.insight(); $('rule').textContent=s.rule[s.mode];
  placeBar(false);
}
function renderPanel(animate){
  const s=cur(); const pl=$('pl'), pr=$('pr');
  document.querySelector('.panel').style.setProperty('--c',s.c||'#fff');
  const fill=()=>{ const [a,b]=panelHTML(); pl.innerHTML=a; pr.innerHTML=b; updPanel(); placeBar(true) };
  if(!animate){ fill(); return }
  pl.classList.add('swap'); pr.classList.add('swap'); $('mxcap').style.opacity=0;
  setTimeout(()=>{ fill(); requestAnimationFrame(()=>{ pl.classList.remove('swap'); pr.classList.remove('swap'); $('mxcap').style.opacity=1 }) },170);
}
function renderToday(){
  $('today').innerHTML = undone
   ? `<span class="lbl">Today</span><span class="txt">Reopened 2 apps and started 3 servers again</span><button class="undo" id="redo">Redo</button>`
   : `<span class="lbl">Today</span><span class="txt">Closed <b>2 apps</b>, stopped <b>3 servers</b></span><button class="undo" id="undo">Undo</button>`;
}

/* ---------- menu bar ---------- */
function renderIcons(){
  const one=$('one').getAttribute('aria-checked')==='true', box=$('icons');
  if(!box.querySelector('.mi')) box.insertAdjacentHTML('beforeend',S.map(s=>`<span class="mi" id="mi-${s.id}" data-s="${s.id}" title="${s.name}">${gl(s.id,'#fff',16)}</span>`).join('')+`<span class="mi off" id="mi-one" title="MinMacs">${gl('one','#fff',16)}</span>`);
  S.forEach(s=>$('mi-'+s.id).classList.toggle('off',one||s.mode===0));
  $('mi-one').classList.toggle('off',!one);
  setTimeout(aim,420); aim();
}
function span(){
  const one=$('one').getAttribute('aria-checked')==='true';
  if(one) return [$('mi-one'),$('mi-one')];
  const vis=[...document.querySelectorAll('.mi:not(.off)')]; if(!vis.length) return null;
  const s=cur(); if(s.id==='agents') return [vis[0],vis[vis.length-1]];
  if(s.mode) return [$('mi-'+s.id),$('mi-'+s.id)];
  return [vis[0],vis[0]];
}
function aim(){
  const sp=span(), hl=$('hl'), box=$('icons');
  if(!sp){ hl.style.opacity=0; return }
  const x1=sp[0].offsetLeft-6, x2=sp[1].offsetLeft+22;
  hl.style.opacity=1; hl.style.width=(x2-x1)+'px'; hl.style.transform=`translateX(${x1}px)`;
  const st=$('stage').getBoundingClientRect(), k=st.width/1280, sh=$('sheet').getBoundingClientRect();
  $('nub').style.transform=`translateX(${(box.getBoundingClientRect().left-sh.left)/k+(x1+x2)/2-1}px)`;
}

function select(id){ if(id===sel) return; sel=id; layout(); renderPanel(true); aim() }
function setMode(m){ const s=cur(); if(s.mode===m) return; s.mode=m; updCells(); updPanel(); renderIcons() }

document.addEventListener('click',e=>{
  const ch=e.target.closest('.ch'); if(ch){ select(ch.dataset.s); return }
  const ce=e.target.closest('.cell'); if(ce){ select(ce.dataset.s); return }
  const mb=e.target.closest('.modes button'); if(mb){ setMode(+mb.dataset.m); return }
  const ob=e.target.closest('.opts button'); if(ob){ cur().v=+ob.dataset.v; updCells(); updPanel(); return }
  const mi=e.target.closest('.mi'); if(mi&&mi.dataset.s){ select(mi.dataset.s); return }
  if(e.target.closest('#undo')){undone=true;renderToday();updPanel();return}
  if(e.target.closest('#redo')){undone=false;renderToday();updPanel();return}
  const sw=e.target.closest('.sw'); if(sw){ sw.setAttribute('aria-checked',String(sw.getAttribute('aria-checked')!=='true')); renderIcons() }
});
document.addEventListener('keydown',e=>{
  const ch=e.target.closest&&e.target.closest('.ch'); if(!ch) return;
  const ids=['agents',...S.map(s=>s.id)], i=ids.indexOf(ch.dataset.s);
  const j=e.key==='ArrowRight'?Math.min(5,i+1):e.key==='ArrowLeft'?Math.max(0,i-1):-1;
  if(j<0) return; e.preventDefault(); select(ids[j]); $('ch-'+ids[j]).focus();
});
const tip=$('tip');
document.addEventListener('mouseover',e=>{
  const t=e.target.closest('[data-tip]'); if(!t){ tip.classList.remove('on'); return }
  const st=$('stage').getBoundingClientRect(), k=st.width/1280, r=t.getBoundingClientRect();
  tip.textContent=t.dataset.tip; tip.style.left=((r.left+r.width/2-st.left)/k)+'px'; tip.style.top=((r.top-st.top)/k)+'px'; tip.classList.add('on');
});
function fit(){const st=$('stage'),k=Math.min(innerWidth/1280,innerHeight/800);st.style.transform=`translate(${(innerWidth-1280*k)/2}px,${(innerHeight-800*k)/2}px) scale(${k})`;aim()}
addEventListener('resize',fit);
buildMatrix(); layout(); renderToday(); renderIcons(); renderPanel(false); fit();
requestAnimationFrame(()=>requestAnimationFrame(updCells));
document.fonts&&document.fonts.ready.then(()=>{placeBar(true);aim()});
</script>
</body>
</html>
