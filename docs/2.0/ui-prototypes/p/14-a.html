<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Five Sentences</title>
<style>
:root{
  --glass:rgba(28,29,38,.86);
  --line:rgba(255,255,255,.06);
  --tx:rgba(255,255,255,.94);
  --tx2:rgba(235,235,245,.62);
  --tx3:rgba(235,235,245,.36);
  --tx4:rgba(235,235,245,.24);
  --ease:cubic-bezier(.3,.7,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#1a1636}
body{font-family:-apple-system,"SF Pro Text",system-ui,sans-serif;color:var(--tx);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;cursor:default;user-select:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;letter-spacing:inherit}
button:focus-visible{outline:2px solid rgba(255,255,255,.55);outline-offset:3px;border-radius:6px}
#stage{position:absolute;left:0;top:0;width:1280px;height:800px;transform-origin:0 0;overflow:hidden;
  background:
   radial-gradient(760px 560px at 10% 6%,#4b3c9e 0%,rgba(75,60,158,0) 70%),
   radial-gradient(700px 520px at 84% 2%,#22618f 0%,rgba(34,97,143,0) 70%),
   radial-gradient(820px 620px at 88% 104%,#a0436f 0%,rgba(160,67,111,0) 70%),
   radial-gradient(640px 520px at 18% 100%,#3a2463 0%,rgba(58,36,99,0) 75%),
   #1d1a3c}

/* menu bar */
.mb{position:absolute;left:0;right:0;top:0;height:26px;display:flex;align-items:center;justify-content:space-between;padding:0 12px 0 16px;background:rgba(18,14,40,.32);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);font-size:13px;color:rgba(255,255,255,.92);z-index:5}
.mb-l,.mb-r{display:flex;align-items:center;gap:18px}
.mb-l b{font-weight:700}
.mb-r{gap:14px}
.icons{display:flex;align-items:center;gap:12px}
.mi{display:flex;width:16px;overflow:hidden;transition:width .4s var(--ease),opacity .3s,margin .4s var(--ease)}
.mi.off{width:0;opacity:0;margin-left:-12px}

/* window */
.win{position:absolute;left:50%;top:104px;width:748px;transform:translateX(-50%);background:var(--glass);backdrop-filter:blur(36px) saturate(1.5);-webkit-backdrop-filter:blur(36px) saturate(1.5);border:1px solid rgba(255,255,255,.08);border-radius:22px;box-shadow:0 40px 110px rgba(6,4,24,.5),inset 0 1px 0 rgba(255,255,255,.035)}
.tb{height:46px;display:flex;align-items:center;padding:0 18px;position:relative}
.lights{display:flex;gap:8px}
.lights i{width:12px;height:12px;border-radius:50%}
.lights i:nth-child(1){background:#ff5f57}.lights i:nth-child(2){background:#febc2e}.lights i:nth-child(3){background:#28c840}
.tb h1{position:absolute;left:0;right:0;text-align:center;font-size:13px;font-weight:600;color:var(--tx3);pointer-events:none}

.body{padding:20px 52px 0}

/* today */
.today{font-size:15px;line-height:24px;color:var(--tx3);min-height:24px;white-space:nowrap}
.today b{font-weight:500;color:var(--tx2)}
.today .act{color:var(--tx);font-weight:500;margin-left:6px;padding:0 2px;border-radius:4px;transition:color .2s}
.today .act:hover{text-decoration:underline;text-underline-offset:3px;text-decoration-color:rgba(255,255,255,.35)}
.fade{animation:fade .45s var(--ease)}
@keyframes fade{from{opacity:0;transform:translateY(3px)}}

/* sentences */
.list{margin-top:38px}
.s{font-size:21px;line-height:32px;white-space:nowrap;letter-spacing:-.012em;color:rgba(255,255,255,.8);font-weight:400;transition:color .4s var(--ease)}
.s + .s{margin-top:30px}
.s .nm{color:var(--tx);font-weight:600}
.s .dash{color:var(--tx4);margin:0 .3em}
.s.off{color:var(--tx3)}
.s.off .nm{color:var(--tx2)}
.w{position:relative;display:inline;padding:0 1px;border-radius:5px;color:var(--c);font-weight:500;background:linear-gradient(currentColor,currentColor) 0 100%/100% 1px no-repeat;background-image:linear-gradient(color-mix(in srgb,var(--c) 45%,transparent),color-mix(in srgb,var(--c) 45%,transparent));transition:color .35s var(--ease)}
.w:hover,.w[aria-expanded="true"]{background-color:color-mix(in srgb,var(--c) 14%,transparent)}
.w.mode{font-weight:600}
.s.off .w{--c:rgba(235,235,245,.6)}
.s.off .w.val{--c:rgba(235,235,245,.4)}
.w .t{display:inline-block}
.w .t.swap{animation:swap .42s var(--ease)}
@keyframes swap{from{opacity:0;filter:blur(3px);transform:translateY(4px)}}
.tail{display:block;font-size:15px;line-height:22px;margin-top:4px;color:var(--tx3);font-weight:400;letter-spacing:0;white-space:nowrap}
.tail b{font-weight:500;color:var(--tx2)}

/* app line */
.foot{margin:38px -52px 0;padding:19px 52px 22px;border-top:1px solid var(--line);font-size:15px;line-height:24px;color:var(--tx3)}
.foot .w{--c:rgba(255,255,255,.86);font-weight:500}

/* popover */
.pop{position:absolute;z-index:10;min-width:196px;padding:6px;border-radius:14px;background:rgba(40,41,54,.94);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,.1);box-shadow:0 18px 50px rgba(0,0,0,.45);opacity:0;transform:translateY(-4px) scale(.98);transform-origin:top left;pointer-events:none;transition:opacity .2s,transform .28s var(--ease)}
.pop.on{opacity:1;transform:none;pointer-events:auto}
.pop button{display:flex;align-items:baseline;gap:10px;width:100%;text-align:left;padding:8px 12px 8px 10px;border-radius:9px;font-size:14px;color:var(--tx2);white-space:nowrap}
.pop button:hover,.pop button:focus-visible{background:rgba(255,255,255,.07);color:var(--tx);outline:0}
.pop button .ck{width:12px;flex:none;color:var(--c);align-self:center;display:flex}
.pop button[aria-checked="true"]{color:var(--tx)}
.pop button .d{font-size:12.5px;color:var(--tx3);margin-left:auto;padding-left:18px}
.pop button .k{font-weight:500}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important}}
</style>
</head>
<body>
<div id="stage">
  <div class="mb">
    <div class="mb-l">
      <svg viewBox="0 0 17 20" width="13" height="16" aria-hidden="true"><path fill="#fff" d="M14.1 10.6c0-2.6 2.1-3.8 2.2-3.9-1.2-1.8-3.1-2-3.7-2-1.6-.2-3.1.9-3.9.9-.8 0-2-.9-3.4-.9C3.6 4.8 1.9 5.8 1 7.4c-1.9 3.3-.5 8.2 1.4 10.9.9 1.3 2 2.8 3.4 2.7 1.4-.1 1.9-.9 3.5-.9s2.1.9 3.5.9c1.5 0 2.4-1.3 3.3-2.7 1-1.5 1.5-3 1.5-3.1-.1 0-2.9-1.1-2.9-4.3zM11.5 3c.7-.9 1.2-2.1 1.1-3.3-1 0-2.3.7-3 1.6-.7.8-1.3 2-1.1 3.2 1.1.1 2.3-.6 3-1.5z"/></svg>
      <b>MinMacs</b><span>Edit</span><span>Window</span><span>Help</span>
    </div>
    <div class="mb-r">
      <div class="icons" id="icons"></div>
      <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M2 6.3a8.6 8.6 0 0 1 12 0M4.2 8.6a5.4 5.4 0 0 1 7.6 0"/><circle cx="8" cy="11.6" r="1.3" fill="#fff" stroke="none"/></svg>
      <svg viewBox="0 0 26 14" width="25" height="13" aria-hidden="true"><rect x=".7" y=".7" width="21.6" height="12.6" rx="3.6" fill="none" stroke="rgba(255,255,255,.55)" stroke-width="1.2"/><rect x="2.6" y="2.6" width="11.6" height="8.8" rx="2" fill="#fff"/><path d="M24 5v4" stroke="rgba(255,255,255,.55)" stroke-width="1.4" stroke-linecap="round"/></svg>
      <span>Tue 27 Oct&nbsp;&nbsp;16:42</span>
    </div>
  </div>

  <div class="win" id="win" role="dialog" aria-label="Settings">
    <div class="tb"><div class="lights"><i></i><i></i><i></i></div><h1>Settings</h1></div>
    <div class="body">
      <p class="today" id="today"></p>
      <div class="list" id="list"></div>
      <p class="foot" id="foot"></p>
    </div>
    <div class="pop" id="pop" role="menu"></div>
  </div>
</div>

<script>
const G = {
  apps:'<rect x="4.2" y="4.2" width="7.6" height="7.6" rx="1.6"/><path d="M6.6 1.8v2.4M9.4 1.8v2.4M6.6 11.8v2.4M9.4 11.8v2.4M1.8 6.6h2.4M1.8 9.4h2.4M11.8 6.6h2.4M11.8 9.4h2.4"/>',
  servers:'<rect x="2.5" y="2.8" width="11" height="4.2" rx="1.4"/><rect x="2.5" y="9" width="11" height="4.2" rx="1.4"/><path d="M5.2 4.9h.01M5.2 11.1h.01" stroke-width="2.2"/>',
  trees:'<circle cx="4.6" cy="3.6" r="1.6"/><circle cx="4.6" cy="12.4" r="1.6"/><circle cx="11.4" cy="5.4" r="1.6"/><path d="M4.6 5.2v5.6M11.4 7c0 2.7-2.4 3.4-5.4 4.2"/>',
  disk:'<ellipse cx="8" cy="4" rx="5.5" ry="2"/><path d="M2.5 4v8c0 1.1 2.5 2 5.5 2s5.5-.9 5.5-2V4M2.5 8c0 1.1 2.5 2 5.5 2s5.5-.9 5.5-2"/>',
  awake:'<path d="M1.8 8s2.3-4.3 6.2-4.3S14.2 8 14.2 8s-2.3 4.3-6.2 4.3S1.8 8 1.8 8z"/><circle cx="8" cy="8" r="1.9"/>',
  one:'<circle cx="8" cy="8" r="5.8"/><path d="M8 4.6v3.6l2.4 1.4"/>'
};
const gl=(k,c,s)=>`<svg viewBox="0 0 16 16" width="${s}" height="${s}" fill="none" stroke="${c}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${G[k]}</svg>`;
const CK='<svg viewBox="0 0 12 12" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2.2 6.3l2.4 2.4 5.2-5.4"/></svg>';

/* mode index: 0 = Leave it (Off), 1 = Ask me (Ask), 2 = Do it (Auto) */
const MW = ['Leave it','Ask me','Do it'];
const ORDER = [2,1,0];
const S = [
  {id:'apps',name:'Apps',c:'#5B9BFF',mode:2,vals:['60 %','70 %','80 %','90 %'],v:1,
   say:v=>`close noise apps when the Mac is over ${v} busy.`,
   does:['Not watching','Shows noise apps to close','Closes them for you'],
   tail:['not watching','<b>2</b> noise apps open','<b>2</b> closed today']},
  {id:'servers',name:'Servers',c:'#3FD0B8',mode:2,vals:['30 min','1 hour','2 hours','4 hours','1 day'],v:2,
   say:v=>`stop them when nobody used them for ${v}.`,
   does:['Not watching','Shows idle localhost servers','Stops the ones nobody used'],
   tail:['not watching','<b>3</b> idle now','<b>3</b> idle now · <b>3</b> stopped today']},
  {id:'trees',name:'Worktrees',c:'#4CC96B',mode:1,vals:['1 hour','1 day','1 week'],v:1,
   say:v=>`remove merged ones after ${v}.`,
   does:['Not watching','Shows merged git worktrees','Removes them; Undo brings back'],
   tail:['not watching','<b>4</b> merged · <b>5.7 GB</b>','<b>4</b> merged · <b>5.7 GB</b>']},
  {id:'disk',name:'Disk',c:'#F2B544',mode:2,vals:['daily','weekly','monthly'],v:1,
   say:v=>`move safe clutter to the Trash ${v}.`,
   does:['Not watching','Shows caches and build output','Moves safe clutter to the Trash'],
   tail:['not watching','<b>30 GB</b> safe to clean','<b>30 GB</b> safe · next on Sunday']},
  {id:'awake',name:'Keep Awake',c:'#B18CFF',mode:2,vals:['10 %','20 %','30 %','any'],v:1,
   say:v=>v==='any'?`stay awake while agents work, on ${v} battery.`:`stay awake while agents work, until ${v} battery.`,
   does:['The Mac sleeps as usual','Asks when an agent starts','Stays awake, then sleeps'],
   tail:['sleeps as usual','<b>4</b> agents working now','<b>4</b> agents working now']}
];
const app = {one:false, login:true, undone:false};

const $ = id => document.getElementById(id);
const word = (cls,key,txt,extra='') => `<button class="w ${cls}" data-k="${key}" aria-haspopup="menu" aria-expanded="false"${extra}><span class="t">${txt}</span></button>`;

function sentence(s){
  const val = s.vals[s.v];
  const full = s.say(val), at = full.indexOf(val), said = [full.slice(0,at), full.slice(at+val.length)];
  return `<span class="nm">${s.name}</span><span class="dash">—</span>${said[0]}${word('val','v:'+s.id,val)}${said[1]} ${word('mode','m:'+s.id,MW[s.mode]+'.')}<span class="tail" id="tl-${s.id}">${s.tail[s.mode]}</span>`;
}
function renderList(){
  $('list').innerHTML = S.map(s=>`<p class="s${s.mode?'':' off'}" id="s-${s.id}" style="--c:${s.c}">${sentence(s)}</p>`).join('');
}
function renderToday(anim){
  $('today').innerHTML = app.undone
    ? `<span>Reopened <b>2 apps</b> and restarted <b>3 servers</b>.</span><button class="act" id="redo">Redo</button>`
    : `<span>Today I closed <b>2 apps</b> and stopped <b>3 servers</b>.</span><button class="act" id="undo">Undo</button>`;
  if(anim){ $('today').classList.remove('fade'); void $('today').offsetWidth; $('today').classList.add('fade'); }
}
function renderFoot(){
  $('foot').innerHTML = `Show ${word('', 'one', app.one?'one icon':'an icon for each')} in the menu bar, and ${word('', 'login', app.login?'open':'don’t open')} at login.`;
}
function renderIcons(){
  const box=$('icons');
  if(!box.children.length) box.innerHTML = S.map(s=>`<span class="mi" id="mi-${s.id}">${gl(s.id,'#fff',16)}</span>`).join('') + `<span class="mi off" id="mi-one">${gl('one','#fff',16)}</span>`;
  S.forEach(s=>$('mi-'+s.id).classList.toggle('off', app.one || s.mode===0));
  $('mi-one').classList.toggle('off', !app.one);
}
function swapIn(el){ const t=el.querySelector('.t'); if(t){ t.classList.remove('swap'); void t.offsetWidth; t.classList.add('swap'); } }

/* popover */
let openKey=null;
function scale(){ return $('stage').getBoundingClientRect().width/1280 }
function openPop(btn){
  const k=btn.dataset.k, [kind,id]=k.split(':'), s=S.find(x=>x.id===id), pop=$('pop');
  let rows='';
  if(kind==='m'){
    rows = ORDER.map(i=>`<button role="menuitemradio" aria-checked="${i===s.mode}" data-pick="${i}"><span class="ck">${i===s.mode?CK:''}</span><span class="k">${MW[i]}</span><span class="d">${s.does[i]}</span></button>`).join('');
  } else if(kind==='v'){
    rows = s.vals.map((v,i)=>`<button role="menuitemradio" aria-checked="${i===s.v}" data-pick="${i}"><span class="ck">${i===s.v?CK:''}</span><span class="k">${v}</span></button>`).join('');
  } else {
    const opts = kind==='one' ? ['an icon for each','one icon'] : ['open','don’t open'];
    const cur = kind==='one' ? +app.one : +!app.login;
    rows = opts.map((v,i)=>`<button role="menuitemradio" aria-checked="${i===cur}" data-pick="${i}"><span class="ck">${i===cur?CK:''}</span><span class="k">${v}</span></button>`).join('');
  }
  pop.innerHTML = rows;
  pop.style.setProperty('--c', s ? s.c : 'rgba(255,255,255,.9)');
  const k2=scale(), wr=$('win').getBoundingClientRect(), br=btn.getBoundingClientRect();
  let x=(br.left-wr.left)/k2 - 12, y=(br.bottom-wr.top)/k2 + 8;
  pop.classList.add('on'); openKey=k;
  const pw=pop.offsetWidth, ph=pop.offsetHeight;
  x=Math.max(16,Math.min(x,748-pw-16));
  if(y+ph > $('win').offsetHeight + 40) y=(br.top-wr.top)/k2 - ph - 8;
  pop.style.left=x+'px'; pop.style.top=y+'px';
  document.querySelectorAll('.w[aria-expanded="true"]').forEach(b=>b.setAttribute('aria-expanded','false'));
  btn.setAttribute('aria-expanded','true');
  const cur=pop.querySelector('[aria-checked="true"]')||pop.querySelector('button'); cur&&cur.focus({preventScroll:true});
}
function closePop(){
  $('pop').classList.remove('on');
  const b=document.querySelector('.w[aria-expanded="true"]'); if(b){ b.setAttribute('aria-expanded','false'); }
  return b;
}
function pick(i){
  const [kind,id]=openKey.split(':'); const s=S.find(x=>x.id===id);
  closePop();
  if(kind==='m'){
    s.mode=i; const p=$('s-'+id); p.classList.toggle('off',!i); p.innerHTML=sentence(s);
    swapIn(p.querySelector('.mode')); const tl=$('tl-'+id); tl.classList.add('fade');
    renderIcons(); p.querySelector('.mode').focus({preventScroll:true});
  } else if(kind==='v'){
    s.v=i; const p=$('s-'+id); p.innerHTML=sentence(s); swapIn(p.querySelector('.val')); p.querySelector('.val').focus({preventScroll:true});
  } else {
    if(kind==='one') app.one=!!i; else app.login=!i;
    renderFoot(); renderIcons(); const b=document.querySelector(`.w[data-k="${kind}"]`); swapIn(b); b.focus({preventScroll:true});
  }
  openKey=null;
}
document.addEventListener('click',e=>{
  const it=e.target.closest('.pop button'); if(it){ pick(+it.dataset.pick); return }
  const w=e.target.closest('.w');
  if(w){ if(openKey===w.dataset.k){ closePop(); openKey=null; } else openPop(w); return }
  if(openKey && !e.target.closest('.pop')){ closePop(); openKey=null; }
  if(e.target.closest('#undo')){ app.undone=true; renderToday(true); return }
  if(e.target.closest('#redo')){ app.undone=false; renderToday(true); return }
});
document.addEventListener('keydown',e=>{
  if(!openKey) return;
  if(e.key==='Escape'){ const b=closePop(); openKey=null; b&&b.focus(); }
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){
    e.preventDefault(); const bs=[...$('pop').querySelectorAll('button')], i=bs.indexOf(document.activeElement);
    bs[(i+(e.key==='ArrowDown'?1:-1)+bs.length)%bs.length].focus();
  }
});
function fit(){ const st=$('stage'), k=Math.min(innerWidth/1280, innerHeight/800); st.style.transform=`translate(${(innerWidth-1280*k)/2}px,${(innerHeight-800*k)/2}px) scale(${k})` }
addEventListener('resize',()=>{ fit(); if(openKey){ closePop(); openKey=null; } });
renderToday(); renderList(); renderFoot(); renderIcons(); fit();
</script>
</body>
</html>
