<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0}[hidden]{display:none!important}</style><script>try{if(localStorage.getItem("mm-walk")===null)localStorage.setItem("mm-walk","1")}catch(e){}</script></head><body><title>MinMacs 2.0 Prototypes</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: a quiet sidebar of directions on the left, one big stage on the right that shows a prototype at true 1280x800, scaled to fit. Grid view swaps the stage for thumbnails. */
:root {
  --bg: #121219;
  --panel: #1a1b24;
  --raise: #23242f;
  --line: rgba(255,255,255,.07);
  --fg: #ececf2;
  --dim: #9091a3;
  --faint: #5d5e70;
  --accent: #6fa3ff;
  --star: #f2c14e;
  --ui: -apple-system, "SF Pro Text", system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) {
  --bg: #f3f3f6; --panel: #ffffff; --raise: #ececf1; --line: rgba(0,0,0,.08);
  --fg: #16161d; --dim: #5f6072; --faint: #9a9bab; --accent: #2f6fe0; --star: #c48a00; color-scheme: light;
} }
:root[data-theme="light"] {
  --bg: #f3f3f6; --panel: #ffffff; --raise: #ececf1; --line: rgba(0,0,0,.08);
  --fg: #16161d; --dim: #5f6072; --faint: #9a9bab; --accent: #2f6fe0; --star: #c48a00; color-scheme: light;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font: 13px/1.45 var(--ui); }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
button:focus-visible, textarea:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }

.app { display: grid; grid-template-columns: 280px 1fr; height: 100%; }
aside { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
.brand { padding: 18px 18px 12px; display: flex; flex-direction: column; gap: 2px; }
.brand h1 { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: -.01em; }
.brand p { margin: 0; color: var(--dim); font-size: 12px; }
.filters { display: flex; gap: 6px; padding: 0 14px 12px; }
.chip { padding: 4px 10px; border-radius: 999px; background: var(--raise); color: var(--dim); font-size: 12px; }
.chip[aria-pressed="true"] { background: var(--accent); color: #fff; }
.list { overflow-y: auto; padding: 4px 8px 16px; flex: 1; min-height: 0; }
.group { padding: 10px 10px 4px; font-size: 11px; color: var(--faint); letter-spacing: .04em; text-transform: uppercase; display: flex; gap: 8px; }
.group span:first-child { font-family: var(--mono); }
.item { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 6px; width: 100%; text-align: left; padding: 7px 10px; border-radius: 8px; }
.item:hover { background: var(--raise); }
.item[aria-current="true"] { background: color-mix(in srgb, var(--accent) 18%, transparent); }
.item .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item .meta { display: flex; gap: 6px; align-items: center; color: var(--faint); font-size: 11px; }
.starmark { color: var(--star); }
.foot { padding: 10px 18px 14px; border-top: 1px solid var(--line); color: var(--faint); font-size: 11px; display: flex; flex-direction: column; gap: 3px; }
kbd { font-family: var(--mono); font-size: 10.5px; padding: 0 4px; border: 1px solid var(--line); border-radius: 4px; color: var(--dim); }

main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.bar { display: flex; align-items: flex-start; gap: 16px; padding: 14px 20px 12px; border-bottom: 1px solid var(--line); }
.info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.title { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.title h2 { margin: 0; font-size: 18px; font-weight: 600; letter-spacing: -.01em; text-wrap: balance; }
.title .dir { color: var(--dim); }
.surface { font-size: 11px; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--dim); }
.idea { color: var(--fg); margin: 0; max-width: 80ch; }
.pros { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; color: var(--dim); max-width: 90ch; }
.pros b { font-weight: 500; color: var(--faint); font-size: 11px; text-transform: uppercase; letter-spacing: .05em; padding-top: 1px; }
.tools { display: flex; gap: 6px; align-items: center; flex-shrink: 0; }
.btn { height: 30px; min-width: 30px; padding: 0 10px; border-radius: 8px; background: var(--raise); display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.btn:hover { filter: brightness(1.15); }
.btn.on { color: var(--star); }
.btn svg { width: 15px; height: 15px; }

.stage { flex: 1; min-height: 0; position: relative; overflow: hidden; }
.frame { width: 1280px; height: 800px; border: 0; border-radius: 12px; background: #000; box-shadow: 0 20px 60px rgba(0,0,0,.35), 0 0 0 1px var(--line); position: absolute; left: 50%; top: 50%; transform-origin: center center; }
.notes { display: flex; gap: 10px; align-items: center; padding: 10px 20px 14px; border-top: 1px solid var(--line); }
.notes label { color: var(--faint); font-size: 11px; text-transform: uppercase; letter-spacing: .05em; }
.notes textarea { flex: 1; min-width: 0; resize: none; height: 34px; background: var(--raise); border: 1px solid var(--line); border-radius: 8px; color: var(--fg); font: inherit; padding: 7px 10px; }
.saved { color: var(--faint); font-size: 11px; min-width: 8ch; }

.grid { flex: 1; overflow-y: auto; padding: 18px 20px 28px; display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 18px 16px; align-content: start; }
.thumb { display: flex; flex-direction: column; gap: 8px; text-align: left; }
.thumb .box { position: relative; width: 100%; aspect-ratio: 16 / 10; border-radius: 10px; overflow: hidden; background: var(--raise); box-shadow: 0 0 0 1px var(--line); max-width: 100%; }
.thumb:hover .box { box-shadow: 0 0 0 2px var(--accent); }
.thumb iframe { position: absolute; left: 0; top: 0; width: 1280px; height: 800px; border: 0; transform-origin: 0 0; pointer-events: none; }
.thumb .cap { display: flex; justify-content: space-between; gap: 8px; }
.thumb .cap span:last-child { color: var(--faint); font-family: var(--mono); font-size: 11px; }
.empty { color: var(--dim); padding: 40px; text-align: center; }

/* Walk mode: the prototype is the whole window, a small pill steps through them. */
.app.walk { grid-template-columns: 1fr; }
.app.walk aside, .app.walk .bar, .app.walk .notes { display: none; }
.app.walk .frame { left: 0; top: 0; width: 100%; height: 100%; border-radius: 0; box-shadow: none; transform: none !important; }
.pill { position: fixed; left: 50%; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 20; display: none; align-items: center; gap: 4px; padding: 4px; border-radius: 999px; background: rgba(22,23,31,.82); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); box-shadow: 0 8px 30px rgba(0,0,0,.4), 0 0 0 1px rgba(255,255,255,.08); color: #ececf2; max-width: calc(100% - 32px); }
.app.walk ~ .pill { display: flex; }
.pill button { height: 30px; min-width: 30px; padding: 0 10px; border-radius: 999px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.pill button:hover { background: rgba(255,255,255,.1); }
.pill .pn { padding: 0 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.pill .pn small { color: #8d8ea0; font-family: var(--mono); font-size: 11px; margin-left: 6px; }
.pill .on { color: #f2c14e; }
.pill svg { width: 14px; height: 14px; }
@media (max-width: 820px) {
  .app { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
  aside { max-height: 38vh; border-right: 0; border-bottom: 1px solid var(--line); }
  .foot { display: none; }
  .bar { flex-direction: column; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .notes, .grid { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .pros { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: no-preference) { .item, .btn, .thumb .box { transition: background .15s, box-shadow .15s, filter .15s; } }
</style>

<div class="app">
  <aside>
    <div class="brand">
      <h1>MinMacs 2.0 Prototypes</h1>
      <p id="count">Loading prototypes</p>
    </div>
    <div class="filters" role="group" aria-label="Filter">
      <button class="chip" id="f-all" aria-pressed="true">All</button>
      <button class="chip" id="f-star" aria-pressed="false">Starred</button>
      <button class="chip" id="f-grid" aria-pressed="false">Grid</button>
      <button class="chip" id="f-walk" aria-pressed="false">Walk</button>
    </div>
    <nav class="list" id="list" aria-label="Prototypes"></nav>
    <div class="foot">
      <div><kbd>←</kbd> <kbd>→</kbd> previous, next</div>
      <div><kbd>S</kbd> star &nbsp; <kbd>G</kbd> grid &nbsp; <kbd>W</kbd> walk full window</div>
      <div id="sync">Stars save on this device only</div>
    </div>
  </aside>
  <main>
    <div class="bar" id="bar">
      <div class="info">
        <div class="title"><h2 id="name"></h2><span class="dir" id="dir"></span><span class="surface" id="surface"></span></div>
        <p class="idea" id="idea"></p>
        <div class="pros"><b>Wins</b><span id="good"></span><b>Costs</b><span id="cost"></span></div>
      </div>
      <div class="tools">
        <button class="btn" id="prev" aria-label="Previous"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M10 3 5 8l5 5"/></svg></button>
        <button class="btn" id="next" aria-label="Next"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="m6 3 5 5-5 5"/></svg></button>
        <button class="btn" id="star" aria-label="Star"><svg viewBox="0 0 16 16" fill="currentColor"><path id="starpath" d="M8 1.6l1.9 4 4.4.5-3.3 3 .9 4.3L8 11.2l-3.9 2.2.9-4.3-3.3-3 4.4-.5z"/></svg><span id="startxt">Star</span></button>
        <a class="btn" id="open" target="_blank" rel="noopener" aria-label="Open alone"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M9 3h4v4M13 3 7.5 8.5M11 9.5V13H3V5h3.5"/></svg></a>
      </div>
    </div>
    <div class="stage" id="stage"><iframe class="frame" id="frame" title="Prototype"></iframe></div>
    <div class="grid" id="grid" hidden></div>
    <div class="notes" id="notesbar">
      <label for="note">Note</label>
      <textarea id="note" placeholder="What you like or don't, for the next round"></textarea>
      <span class="saved" id="saved"></span>
    </div>
  </main>
</div>
<div class="pill" role="toolbar" aria-label="Walk through prototypes">
  <button id="w-prev" aria-label="Previous"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M10 3 5 8l5 5"/></svg></button>
  <span class="pn" id="w-name"></span>
  <button id="w-next" aria-label="Next"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m6 3 5 5-5 5"/></svg></button>
  <button id="w-star" aria-label="Star"><svg viewBox="0 0 16 16" fill="currentColor"><path d="M8 1.6l1.9 4 4.4.5-3.3 3 .9 4.3L8 11.2l-3.9 2.2.9-4.3-3.3-3 4.4-.5z"/></svg></button>
  <button id="w-exit" aria-label="Back to the list">List</button>
</div>

<script>
(() => {
  let items = [], cur = 0, onlyStar = false, gridMode = false, walk = false;
  try { walk = localStorage.getItem("mm-walk") === "1"; } catch {}
  const picks = {};               // id -> {star, note}
  let db = null;
  const $ = id => document.getElementById(id);
  const idOf = it => it.file.replace(/\.html$/, "");
  const local = {
    get() { try { return JSON.parse(localStorage.getItem("mm-picks") || "{}"); } catch { return {}; } },
    put() { try { localStorage.setItem("mm-picks", JSON.stringify(picks)); } catch {} }
  };
  Object.assign(picks, local.get());

  async function save(id) {
    local.put();
    if (!db) return;
    try {
      await db.collection("picks").doc(id).set({ star: !!picks[id]?.star, note: picks[id]?.note || "", updated: Date.now() });
      $("saved").textContent = "Saved";
    } catch { $("saved").textContent = "Not saved"; }
  }

  function visible() { return items.map((it, i) => ({ it, i })).filter(x => !onlyStar || picks[idOf(x.it)]?.star); }

  function renderList() {
    const nav = $("list"); nav.textContent = "";
    let lastGroup = null;
    const vis = visible();
    if (!vis.length) { const p = document.createElement("p"); p.className = "empty"; p.textContent = "No stars yet. Press S on one you like."; nav.append(p); }
    for (const { it, i } of vis) {
      if (it.groupId !== lastGroup) {
        lastGroup = it.groupId;
        const g = document.createElement("div"); g.className = "group";
        const a = document.createElement("span"); a.textContent = it.groupId;
        const b = document.createElement("span"); b.textContent = it.direction;
        g.append(a, b); nav.append(g);
      }
      const b = document.createElement("button"); b.className = "item";
      b.setAttribute("aria-current", i === cur ? "true" : "false");
      const nm = document.createElement("span"); nm.className = "nm"; nm.textContent = it.name;
      const meta = document.createElement("span"); meta.className = "meta";
      if (picks[idOf(it)]?.star) { const s = document.createElement("span"); s.className = "starmark"; s.textContent = "★"; meta.append(s); }
      const v = document.createElement("span"); v.textContent = idOf(it).slice(-1).toUpperCase(); meta.append(v);
      b.append(nm, meta);
      b.onclick = () => { gridMode = false; go(i); };
      nav.append(b);
    }
    const stars = items.filter(it => picks[idOf(it)]?.star).length;
    $("count").textContent = `${items.length} prototypes · ${new Set(items.map(i => i.groupId)).size} directions` + (stars ? ` · ${stars} starred` : "");
  }

  function fit() {
    const st = $("stage"), f = $("frame");
    const s = Math.min((st.clientWidth - 32) / 1280, (st.clientHeight - 32) / 800, 1);
    f.style.transform = `translate(-50%, -50%) scale(${Math.max(s, .1)})`;
    document.querySelectorAll(".thumb .box").forEach(box => {
      const fr = box.querySelector("iframe"); if (fr) fr.style.transform = `scale(${box.clientWidth / 1280})`;
    });
  }

  function renderStage() {
    const it = items[cur]; if (!it) return;
    $("name").textContent = it.name;
    $("dir").textContent = `${it.groupId} · ${it.direction}`;
    $("surface").textContent = it.surface || "";
    $("idea").textContent = it.idea || "";
    $("good").textContent = it.good || "";
    $("cost").textContent = it.tradeoff || "";
    const src = "p/" + it.file;
    if ($("frame").getAttribute("src") !== src) $("frame").setAttribute("src", src);
    $("open").href = src;
    const p = picks[idOf(it)] || {};
    $("star").classList.toggle("on", !!p.star);
    $("startxt").textContent = p.star ? "Starred" : "Star";
    $("note").value = p.note || "";
    $("saved").textContent = "";
  }

  function renderGrid() {
    const g = $("grid"); g.textContent = "";
    for (const { it, i } of visible()) {
      const b = document.createElement("button"); b.className = "thumb";
      const box = document.createElement("div"); box.className = "box";
      const fr = document.createElement("iframe"); fr.loading = "lazy"; fr.tabIndex = -1; fr.title = it.name; fr.src = "p/" + it.file;
      box.append(fr);
      const cap = document.createElement("div"); cap.className = "cap";
      const a = document.createElement("span"); a.textContent = (picks[idOf(it)]?.star ? "★ " : "") + it.name;
      const c = document.createElement("span"); c.textContent = idOf(it);
      cap.append(a, c); b.append(box, cap);
      b.onclick = () => { gridMode = false; go(i); };
      g.append(b);
    }
  }

  function render() {
    $("f-all").setAttribute("aria-pressed", String(!onlyStar));
    $("f-star").setAttribute("aria-pressed", String(onlyStar));
    $("f-grid").setAttribute("aria-pressed", String(gridMode));
    if (walk) gridMode = false;
    document.querySelector(".app").classList.toggle("walk", walk);
    $("f-walk").setAttribute("aria-pressed", String(walk));
    if (items[cur]) {
      const it = items[cur], pos = visible().findIndex(x => x.i === cur);
      const total = visible().length;
      $("w-name").textContent = it.name;
      const sm = document.createElement("small"); sm.textContent = `${idOf(it)} · ${pos + 1}/${total}`; $("w-name").append(sm);
      $("w-star").classList.toggle("on", !!picks[idOf(it)]?.star);
    }
    $("stage").hidden = gridMode; $("notesbar").hidden = gridMode; $("bar").hidden = gridMode;
    $("grid").hidden = !gridMode;
    renderList();
    if (gridMode) renderGrid(); else renderStage();
    requestAnimationFrame(fit);
  }

  function go(i) {
    if (!items.length) return;
    cur = (i + items.length) % items.length;
    if (location.hash !== "#p" + idOf(items[cur])) history.replaceState(null, "", "#p" + idOf(items[cur]));
    render();
    document.querySelector('.item[aria-current="true"]')?.scrollIntoView({ block: "nearest" });
  }
  function step(d) {
    const vis = visible().map(x => x.i);
    if (!vis.length) return;
    const k = vis.indexOf(cur);
    go(vis[(k === -1 ? 0 : (k + d + vis.length) % vis.length)]);
  }
  function toggleStar() {
    const id = idOf(items[cur]); picks[id] = { ...(picks[id] || {}), star: !picks[id]?.star };
    render(); save(id);
  }

  $("prev").onclick = () => step(-1);
  $("next").onclick = () => step(1);
  $("star").onclick = toggleStar;
  $("f-all").onclick = () => { onlyStar = false; render(); };
  $("f-star").onclick = () => { onlyStar = true; render(); };
  $("f-grid").onclick = () => { gridMode = !gridMode; render(); };
  let t;
  $("note").addEventListener("input", () => {
    const id = idOf(items[cur]); picks[id] = { ...(picks[id] || {}), note: $("note").value };
    $("saved").textContent = "…"; clearTimeout(t); t = setTimeout(() => save(id), 700);
  });
  function setWalk(v) { walk = v; try { localStorage.setItem("mm-walk", v ? "1" : "0"); } catch {} render(); }
  $("f-walk").onclick = () => setWalk(true);
  $("w-exit").onclick = () => setWalk(false);
  $("w-prev").onclick = () => step(-1);
  $("w-next").onclick = () => step(1);
  $("w-star").onclick = toggleStar;
  function onKey(e) {
    if (e.target.tagName === "TEXTAREA" || e.target.tagName === "INPUT" || e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === "ArrowRight" || e.key === "j") step(1);
    else if (e.key === "ArrowLeft" || e.key === "k") step(-1);
    else if (e.key === "s") toggleStar();
    else if (e.key === "g") { walk = false; gridMode = !gridMode; render(); }
    else if (e.key === "w") setWalk(!walk);
    else if (e.key === "Escape" && walk) setWalk(false);
    else if (e.key === "o" && items[cur]) $("open").click();
    else return;
    e.preventDefault();
  }
  addEventListener("keydown", onKey);
  // Keys still work after clicking into a prototype (same origin).
  $("frame").addEventListener("load", () => {
    fit();
    try { $("frame").contentWindow.addEventListener("keydown", onKey); } catch {}
  });
  addEventListener("resize", fit);
  try { new ResizeObserver(fit).observe($("stage")); } catch {}
  addEventListener("hashchange", () => {
    const i = items.findIndex(it => "#p" + idOf(it) === location.hash);
    if (i >= 0 && i !== cur) go(i);
  });

  fetch("manifest.json").then(r => r.json()).then(m => {
    items = m;
    const i = items.findIndex(it => "#p" + idOf(it) === location.hash);
    cur = i >= 0 ? i : 0;
    render();
  }).catch(() => { $("count").textContent = "Could not load the list of prototypes."; });

  (async () => {
    db = await window.claude?.use?.("db") ?? null;
    if (!db) return;
    $("sync").textContent = "Stars and notes sync, and Claude can read them";
    db.collection("picks").onSnapshot(snap => {
      for (const d of snap.docs) { const v = d.data(); if (v) picks[d.id] = { star: !!v.star, note: v.note || "" }; }
      local.put();
      if (document.activeElement !== $("note")) render(); else renderList();
    }, () => {});
  })();
})();
</script>
</body></html>
